  "functions": [
    {
      "id": "register-item-instance",
      "name": "Register item instance",
      "description": "Create the master record for one individual physical thing, binding it to an authoritative identifier and, where known, to its type.",
      "inputs": [
        "candidate identifier and scheme",
        "individuation evidence",
        "type reference (optional)",
        "registering party"
      ],
      "outputs": [
        "item record with master identifier",
        "registration event",
        "resolution status"
      ],
      "preconditions": [
        "The candidate passes the individuation test and is not bulk, batch or fungible matter",
        "No existing record already resolves the same identifier under the same scheme"
      ],
      "effects": [
        "A new master record exists with record version 1 and an RFC 3339 creation timestamp",
        "A registration event is appended to the item event stream"
      ],
      "source_refs": [
        "SRC-012",
        "SRC-003",
        "SRC-009"
      ]
    },
    {
      "id": "assign-identifier-and-mark",
      "name": "Assign identifier and record identity mark",
      "description": "Allocate or record an identifier for the item and register the physical mark or data carrier that bears it.",
      "inputs": [
        "item reference",
        "identifier value and scheme",
        "marking method and placement",
        "carrier type and encoded link"
      ],
      "outputs": [
        "identifier assignment record",
        "identity mark record",
        "carrier link URI"
      ],
      "preconditions": [
        "The assigning party is authorised under the scheme's rules",
        "The identifier is unique within the declared uniqueness scope"
      ],
      "effects": [
        "The item carries an additional identifier and mark with an application timestamp",
        "Superseded marks are closed with an end timestamp rather than deleted"
      ],
      "source_refs": [
        "SRC-008",
        "SRC-002",
        "SRC-012"
      ]
    },
    {
      "id": "resolve-identifier",
      "name": "Resolve observed identifier to item",
      "description": "Resolve a scanned, quoted or inferred identifier to at most one item record, reporting ambiguity instead of guessing.",
      "inputs": [
        "observed identifier string",
        "scheme hint (optional)",
        "observation context"
      ],
      "outputs": [
        "matched item reference or empty result",
        "match confidence",
        "ambiguity report where more than one candidate matches"
      ],
      "preconditions": [
        "The identifier syntax is recognisable or explicitly flagged as unrecognised"
      ],
      "effects": [
        "A resolution attempt is logged with outcome and timestamp",
        "Multiple matches raise a collision case rather than returning an arbitrary record"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-001"
      ]
    },
    {
      "id": "capture-item-event",
      "name": "Capture item event",
      "description": "Append a validated event about the item recording what happened, when, where, why and how.",
      "inputs": [
        "item identifier list",
        "event type",
        "event time with offset",
        "location references",
        "business step and disposition",
        "agent and sensor data (optional)"
      ],
      "outputs": [
        "stored event with event identifier",
        "updated derived state",
        "duplicate decision where applicable"
      ],
      "preconditions": [
        "Event time is RFC 3339 with seconds and an explicit offset",
        "The item identifier resolves to exactly one record or the event is quarantined"
      ],
      "effects": [
        "The event stream gains an immutable entry with both event time and record time",
        "Derived current status, whereabouts and containment are recalculated"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-009",
        "SRC-016"
      ]
    },
    {
      "id": "record-condition-assessment",
      "name": "Record condition assessment",
      "description": "Attach a dated condition judgement to the item with scale, method, assessor and supporting evidence.",
      "inputs": [
        "item reference",
        "condition grade and scale",
        "assessment method",
        "assessor reference",
        "defect observations",
        "supporting artifacts"
      ],
      "outputs": [
        "condition assessment record",
        "updated current condition view",
        "validity window"
      ],
      "preconditions": [
        "The scale is a named, versioned scale rather than an ad hoc grade",
        "The assessor reference resolves to a party or device"
      ],
      "effects": [
        "Prior assessments are retained as history and not overwritten",
        "Assessments older than the staleness threshold cease to be presented as current"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-010",
        "SRC-003"
      ]
    },
    {
      "id": "transition-lifecycle-state",
      "name": "Transition lifecycle state",
      "description": "Move the item to a new governed status through a permitted transition, or reject the request.",
      "inputs": [
        "item reference",
        "target status",
        "triggering event reference",
        "authorising role"
      ],
      "outputs": [
        "updated lifecycle status",
        "transition record",
        "rejection reason where refused"
      ],
      "preconditions": [
        "The transition is permitted by the versioned state model",
        "Persistent states such as recalled or stolen are not silently cleared"
      ],
      "effects": [
        "Status and effective-from timestamp are updated and the prior status is retained in history",
        "Terminal transitions start the record retention clock"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-010"
      ]
    },
    {
      "id": "transfer-custody",
      "name": "Transfer custody",
      "description": "Close the outgoing custody period and open the incoming one, recording basis, parties and acknowledgement.",
      "inputs": [
        "item reference",
        "source party",
        "destination party",
        "basis of holding",
        "transfer time",
        "condition at handover (optional)"
      ],
      "outputs": [
        "closed custody period",
        "open custody period",
        "transfer event",
        "receipt artifact reference"
      ],
      "preconditions": [
        "At most one custody period is open before and after the operation",
        "Transfer time is not earlier than the start of the custody period being closed"
      ],
      "effects": [
        "Custody history gains a closed period and a new open period",
        "Unacknowledged transfers are flagged for reconciliation rather than assumed complete"
      ],
      "source_refs": [
        "SRC-011",
        "SRC-001",
        "SRC-004"
      ]
    },
    {
      "id": "link-to-assembly",
      "name": "Attach or detach item from assembly",
      "description": "Record that the item was installed into or removed from a parent item at a stated time and position.",
      "inputs": [
        "item reference",
        "parent item reference",
        "position or role",
        "action (attach or detach)",
        "event time"
      ],
      "outputs": [
        "membership period record",
        "aggregation or disaggregation event",
        "updated containment view"
      ],
      "preconditions": [
        "The parent item resolves to an existing item record",
        "No overlapping open membership exists for the same item"
      ],
      "effects": [
        "Membership periods are opened or closed without altering either item's identity",
        "Derived location of the child may be inherited from the parent while membership is open"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-004",
        "SRC-007"
      ]
    },
    {
      "id": "verify-authenticity",
      "name": "Verify authenticity",
      "description": "Evaluate marks, carriers, tamper evidence and credentials to decide whether the physical thing is the thing the record designates.",
      "inputs": [
        "item reference",
        "observed mark and carrier data",
        "presented credentials",
        "verifier reference"
      ],
      "outputs": [
        "verification result",
        "credential status results",
        "failure handling action"
      ],
      "preconditions": [
        "Credential status can be checked or the check is explicitly recorded as unavailable"
      ],
      "effects": [
        "A verification result is appended with verifier, method and timestamp",
        "Failures raise a case and may set a persistent state such as suspected counterfeit"
      ],
      "source_refs": [
        "SRC-006",
        "SRC-008",
        "SRC-002"
      ]
    },
    {
      "id": "reconcile-duplicate-records",
      "name": "Merge or split item records",
      "description": "Reconcile records after discovering that two records describe one thing, or that one record conflated two things.",
      "inputs": [
        "candidate record references",
        "reconciliation evidence",
        "deciding role"
      ],
      "outputs": [
        "surviving record reference",
        "retired record references",
        "reconciliation decision record"
      ],
      "preconditions": [
        "Evidence supporting sameness or difference is attached and graded",
        "The deciding role is authorised by the mastership rules"
      ],
      "effects": [
        "Retired records are marked superseded with a pointer to the survivor rather than deleted",
        "Events, custody and observations are re-parented with their original provenance preserved"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-004"
      ]
    },
    {
      "id": "retire-item",
      "name": "Retire item and close record",
      "description": "Record the item's end of life with evidence and place the record under its retention schedule.",
      "inputs": [
        "item reference",
        "disposal mode",
        "terminal event time",
        "evidence artifact reference"
      ],
      "outputs": [
        "terminal lifecycle status",
        "retention schedule assignment",
        "closure record"
      ],
      "preconditions": [
        "Evidence of the terminal event is attached or the mode is recorded as unverified",
        "No open custody period remains, or the open period is explicitly closed as part of the operation"
      ],
      "effects": [
        "The item is no longer presented as active in any projection",
        "The record is retained until its retention date and then handled per the disposition action"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-013",
        "SRC-014"
      ]
    },
    {
      "id": "issue-disclosure-view",
      "name": "Issue scoped disclosure view",
      "description": "Produce a projection of the record limited to a defined field set for a named audience, and log the disclosure.",
      "inputs": [
        "item reference",
        "view identifier",
        "requesting party",
        "basis of access",
        "validity window"
      ],
      "outputs": [
        "projected payload",
        "disclosure log entry",
        "published snapshot reference where external"
      ],
      "preconditions": [
        "A grant, published-view definition or recorded exception authorises the disclosure",
        "Prohibited fields for the view are enforced by the view definition, not by the caller"
      ],
      "effects": [
        "The requesting party receives only the fields the view defines",
        "A disclosure record is written with recipient, scope, basis and RFC 3339 timestamp"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-014",
        "SRC-001"
      ]
    },
    {
      "id": "transform-item-identity",
      "name": "Transform item identity",
      "description": "Consume this identity and generate successor item identities when a physical transformation so requires, recording PROV derivation.",
      "inputs": [
        "Transformation event with inputs consumed and outputs produced",
        "Derivation type",
        "Event time and record time"
      ],
      "outputs": [
        "Successor item identities and PROV derivation links"
      ],
      "preconditions": [
        "Evidence supports that the transformation ended this identity rather than repairing it"
      ],
      "effects": [
        "Consumes this identity and generates successor items",
        "Records wasDerivedFrom links from predecessor to successors"
      ],
      "source_refs": [
        "SRC-017",
        "SRC-005"
      ]
    },
    {
      "id": "bind-digital-representation",
      "name": "Bind digital representation",
      "description": "Link an IL, Digital Link, DPP or AAS record to this item while keeping shell and passport identifiers distinct from the item master.",
      "inputs": [
        "Representation kind: Identification Link, Digital Link, DPP or AAS",
        "Representation identifiers including globalAssetId, specificAssetIds and shell id",
        "Grain evidence for the representation identifier"
      ],
      "outputs": [
        "Digital representation binding"
      ],
      "preconditions": [
        "Representation identifier grain is instance-level or recorded as unspecified"
      ],
      "effects": [
        "Links the representation to the item",
        "Marks representation identifiers as not the item master"
      ],
      "source_refs": [
        "SRC-022",
        "SRC-027",
        "SRC-026"
      ]
    },
    {
      "id": "correct-or-quarantine-statement",
      "name": "Quarantine or correct statement",
      "description": "Flag failed validation, cloned-serial suspicion or conflicting events without deleting history; corrections are new statements.",
      "inputs": [
        "Failing rule id and offending fact reference",
        "Detected time and severity",
        "Corrected statement where available"
      ],
      "outputs": [
        "Validation issue with quarantine flag",
        "Corrective statement with its own record time"
      ],
      "preconditions": [
        "The original statement remains readable in history"
      ],
      "effects": [
        "Quarantines the suspect statement instead of deleting it",
        "Adds corrections as new statements"
      ],
      "source_refs": [
        "SRC-019",
        "SRC-024",
        "SRC-005"
      ]
    },
    {
      "id": "report-loss-or-theft",
      "name": "Report loss, theft or seizure",
      "description": "Set exceptional status with last-known location and holder, without treating the item as disposed.",
      "inputs": [
        "Exceptional status and asserting party",
        "Last known location and custodian",
        "Legal or operational reference"
      ],
      "outputs": [
        "Exceptional status assertion and case file"
      ],
      "preconditions": [
        "Unknown whereabouts is not recorded as non-existence"
      ],
      "effects": [
        "Sets exceptional status while the item continues to exist",
        "Freezes last-known location and holder for recovery use"
      ],
      "source_refs": [
        "SRC-024",
        "SRC-025"
      ]
    },
    {
      "id": "recover-item",
      "name": "Recover item",
      "description": "Re-enter a missing or stolen item into tracking after re-validating identity, condition and custody.",
      "inputs": [
        "Recovery event time and recovering party",
        "Identity re-validation evidence",
        "New custody and condition assessment"
      ],
      "outputs": [
        "Recovery record with revalidated identity, condition and custody"
      ],
      "preconditions": [
        "The recovered object has been matched against distinguishing features and documentation"
      ],
      "effects": [
        "Clears exceptional status",
        "Opens a new custody period and appends a condition assessment"
      ],
      "source_refs": [
        "SRC-024",
        "SRC-017"
      ]
    },
    {
      "id": "bind-type-and-configuration",
      "name": "Bind kind and configuration",
      "description": "Assert or revise the class and optional configuration of the instance as references to sibling masters, with confidence and history.",
      "inputs": [
        "Class key and optional configuration id",
        "Resolution method and confidence",
        "Asserting party and assertion time"
      ],
      "outputs": [
        "Dated kind assertion, optionally with configuration reference"
      ],
      "preconditions": [
        "Class and configuration masters live in sibling models and are referenced, not restated"
      ],
      "effects": [
        "Adds a kind assertion and supersedes the prior one without erasing it",
        "Leaves kind_status unknown or unique-object when no class resolves"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-019"
      ]
    }
  ],
