  "model": {
    "registry_id": "vr.wm-obj-001",
    "model_id": "WM-OBJ-001",
    "name": "Physical Item Instance",
    "entry_kind": "entity",
    "purpose": "Model the context an agent needs to identify, describe, track and govern one individual physical thing as a distinguishable instance, separately from the type it instantiates and from any value, inventory or asset projection over it.",
    "scope_statement": "This model covers the individuated, one-of-a-kind record of a discrete physical thing: how it is identified and marked, which type it instantiates, what was measured on this specimen, its condition and lifecycle state, where it has been observed, who has held it, the events and provenance evidence attached to it, and the governance of that record. It excludes all class-level description, all quantity aggregation, and every concept mastered by a composable sibling model. Storage and interface (JSON, Markdown, Git, MongoDB, MCP) are projections, never semantics.",
    "in_scope": [
      "Instance-level identifiers, identity marks, data carriers, and identifier resolution/collision handling for one physical thing",
      "The instance-of link to a product type or configuration, and rules for identity continuity across repair, replacement and reconfiguration",
      "Properties measured on this specimen (as-built/as-observed), distinct from type specifications",
      "Condition, damage, intervention history and lifecycle state including end of life",
      "Observed whereabouts (location fixes, containment context) and custody/possession records",
      "Events, provenance, chain-of-custody and evidence/attestations attached to the individual thing",
      "Record stewardship: mastership, access scoping, privacy, retention, audit and external alignment"
    ],
    "out_of_scope": [
      "Type, model, design and configuration specifications (mastered by WM-OBJ-002 and WM-OBJ-017)",
      "Material substance classes and their properties (mastered by the material substance sibling model)",
      "Countable stock quantities and inventory positions (mastered by WM-OBJ-020)",
      "Packaging and handling-unit structures as containers in their own right (mastered by WM-OBJ-021)",
      "Place identity, premises geometry and address semantics (mastered by WM-BLT-002)",
      "Financial, value and asset-management projections over the item (WM-OBJ-022 is a view, not a second master)",
      "Legal title, ownership registration and party identity (mastered by the S1 ownership/party models)",
      "Bulk, fungible or continuous matter with no individuating boundary, and batch/lot-level identity",
      "Human beings, living organisms and purely digital or conceptual items",
      "Maintenance work management, job planning and spare-part provisioning processes"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-OBJ-002 Product type / WM-OBJ-017 Product configuration",
        "distinction": "Type-instance boundary. schema.org separates Product/ProductModel from IndividualProduct ('a single, identifiable product instance'), and EPCIS separates class-level identification (GTIN/LGTIN with quantity) from instance-level identification (SGTIN, SSCC). Specifications, variants and marketing attributes stay in the type models; only the resolved reference and instance-specific deviations live here.",
        "source_refs": [
          "SRC-001",
          "SRC-003",
          "SRC-016"
        ]
      },
      {
        "neighbor": "WM-OBJ-012 As-built assembly",
        "distinction": "The assembly graph, positions and build structure are mastered by WM-OBJ-012. This model carries only the membership pointer (parent item, role, installed/removed time) needed to interpret the individual, mirroring CIDOC CRM P46 is composed of and EPCIS AggregationEvent parent/child semantics.",
        "source_refs": [
          "SRC-001",
          "SRC-004"
        ]
      },
      {
        "neighbor": "WM-OBJ-020 Stock position",
        "distinction": "Inventory is a quantity of a type at a location; this model never masters counts. An item instance may be referenced by a stock position, but a stock position is not decomposable into instances unless each instance is separately identified.",
        "source_refs": [
          "SRC-001",
          "SRC-016"
        ]
      },
      {
        "neighbor": "WM-OBJ-021 Handling unit",
        "distinction": "A handling unit (SSCC-identified logistic unit) is itself a physical thing that contains items. Containment is recorded here as observed context only; the packaging hierarchy is mastered by WM-OBJ-021.",
        "source_refs": [
          "SRC-001"
        ]
      },
      {
        "neighbor": "WM-OBJ-022 Asset lifecycle",
        "distinction": "ISO 55000 defines an asset as a thing or entity with potential or actual value to an organization; that is a value-relative role that may span portfolios, systems and non-physical entities. Asset records are a projection over this item and must not mint a second master identity.",
        "source_refs": [
          "SRC-010"
        ]
      },
      {
        "neighbor": "WM-BLT-002 Premises",
        "distinction": "Premises contain item instances. Place identity, geometry and hierarchy are mastered there; here only a resolved place reference plus observation quality (EPCIS readPoint vs bizLocation, CIDOC P53 has former or current location).",
        "source_refs": [
          "SRC-001",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Batch/lot and bulk material records",
        "distinction": "Instance identity requires an individuating physical boundary. ISO 22095 chain-of-custody models such as mass balance and controlled blending explicitly break one-to-one identity between input and output material, so batch/lot traceability must not be modelled as instance identity here.",
        "source_refs": [
          "SRC-011"
        ]
      },
      {
        "neighbor": "S1 ownership and party models",
        "distinction": "Custody (holding, CIDOC P49 keeper) is modelled here; title and ownership (CIDOC P52 current owner) resolve to the ownership model, which also supplies the stewardship authority for this record.",
        "source_refs": [
          "SRC-004"
        ]
      }
    ]
  },
