  "structure": {
    "bundles": [
      {
        "id": "identity-and-designation",
        "name": "Identity and designation",
        "description": "Everything needed to tell this individual thing apart from every other thing, to bind marks and identifiers to it, and to decide when it is still the same thing.",
        "rationale": "Instance modelling collapses without a defensible identity rule. Standards agree that instance-level identification is a distinct construct (schema.org IndividualProduct, EPCIS SGTIN/SSCC versus GTIN, ISO/IEC 15459-4 unique identifier for individual items), but they do not agree on scheme, so identity, marking and resolution must be modelled explicitly rather than assumed.",
