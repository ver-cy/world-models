  "model": {
    "registry_id": "vr.wm-act-048",
    "model_id": "WM-ACT-048",
    "name": "Medication Order / Administration",
    "entry_kind": "aggregate",
    "purpose": "Represent a source-qualified medication lifecycle aggregate so agents can distinguish clinical request, supply, actual administration or non-administration, reported use, reconciliation and safety evidence without conflating intent with exposure or consequence.",
    "scope_statement": "Owns the aggregate identity and links among medication request, dispense, administration or explicit non-administration, medication statement, discrepancy, reconciliation and safety-check records. Each child keeps its own identity, source, status, actors and times. Patient, practitioner, organization, encounter, care plan, medication and product definition, clinical knowledge, condition, observation, allergy, adverse event, detected issue, coverage, claim, inventory, device, consent, provenance, audit and record masters remain external.",
    "in_scope": [
      "Aggregate and child-record identity, medication and subject bindings, request intent, dosage and dispense authorization, dispense events, administration or non-administration events, reported use and reconciliation",
      "Independent status and time axes, substitution and actual dose differences, safety evidence, clinical consequence links, correction, privacy, retention and loss-aware projections"
    ],
    "out_of_scope": [
      "Independent patient, practitioner, organization, encounter, care plan, medication, medicinal product, medication knowledge, condition, observation, allergy, adverse event, detected issue, coverage, claim, inventory, device, consent, provenance, audit and record lifecycles",
      "Treating a medication request as proof of dispense or exposure, dispense as proof of administration, medication statement as formal event evidence, completed as effective, or association as causation",
      "Providing medical advice, prescribing, changing dose, authorizing substitution, dispensing, administering, overriding safety or deciding adherence and causality"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ACT-049 Care Plan / Episode",
        "distinction": "A care plan may contain medication-request references, but owns goals and planning lifecycle. The ledger relation is candidate and creates no cascade behavior.",
        "source_refs": [
          "SRC-001",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Medication and medicinal-product definitions",
        "distinction": "Product masters own substance, strength, dose form, authorization, packaging and knowledge. This aggregate stores versioned references and actual supplied or administered distinctions.",
        "source_refs": [
          "SRC-005",
          "SRC-009",
          "SRC-010",
          "SRC-011",
          "SRC-012"
        ]
      },
      {
        "neighbor": "MedicationRequest, MedicationDispense and MedicationAdministration",
        "distinction": "These are separately identifiable intent, supply and exposure records with independent states and event times; the aggregate only composes them.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-003",
          "SRC-006"
        ]
      },
      {
        "neighbor": "MedicationStatement and medication list",
        "distinction": "A statement is source-attributed reported or derived belief and is not a prescribe, dispense or administer event. A list is a view over such records, not the aggregate root.",
        "source_refs": [
          "SRC-004",
          "SRC-006",
          "SRC-007"
        ]
      },
      {
        "neighbor": "Observation, Condition, AllergyIntolerance, DetectedIssue and AdverseEvent",
        "distinction": "External clinical and safety records own findings, diagnoses, allergies, detected issues and harm assertions. The aggregate keeps typed links and uncertainty without inventing causality.",
        "source_refs": [
          "SRC-003",
          "SRC-004",
          "SRC-008",
          "SRC-016"
        ]
      },
      {
        "neighbor": "Inventory, supply chain, billing and coverage",
        "distinction": "External masters own stock, logistics, claims, payment and coverage. Dispense records bind the supplied product, quantity, lot and authorization without absorbing those lifecycles.",
        "source_refs": [
          "SRC-002",
          "SRC-005",
          "SRC-010",
          "SRC-013"
        ]
      }
    ]
  },
