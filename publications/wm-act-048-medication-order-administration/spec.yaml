  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "Dimension owner and medication-governance mandate",
        "Patient, practitioner, organization, encounter, care plan, medication, product, condition, observation, allergy, adverse-event, inventory, provenance, audit and record registries",
        "Approved medication, terminology, unit, prescribing, dispensing, administration, reconciliation and safety profiles",
        "Consent, privacy, correction, disclosure, retention and agent policies"
      ],
      "namespace_guidance": "Mint aggregate, request, dispense, administration, statement, discrepancy, safety-check, correction, disclosure and event IDs; preserve every source-system, prescription, product, package and lot identifier.",
      "registry_links": [
        "https://ver.cy/models/",
        "https://ver.cy/model-agent-protocol.md"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Canonicalize by authoritative source-system identifier and source organization for each request, dispense, administration and statement; never patient, medication, date, encounter or claim alone.",
        "Keep request intent, dispense supply, administration exposure, reported medication use, product definition, clinical response and adverse event distinct."
      ],
      "patch_rules": [
        "Extensions declare jurisdiction, setting, product, terminology, unit, authorization, safety, privacy, retention and interoperability effects.",
        "Released request, dispense, administration, reconciliation and safety records are immutable; corrections create linked successors.",
        "Never silently change subject, medication, dosage, substitution, quantity, lot, performer, recipient, event time, status, omission, reason, response, access or provenance."
      ],
      "compatibility_rules": [
        "Ignore additive fields only when identity, child-record kind, subject, medication, authority, status, clinical times, actual values, safety and provenance survive.",
        "Every projection pins profile, code system, unit system and information-loss declaration."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier for each medication request, dispense, administration or statement, qualified by source organization and record kind.",
        "Governed globally resolvable medication record IRI.",
        "Dimension UUID when neither preceding identifier exists."
      ],
      "timestamp_rule": "Use RFC 3339 timestamps with seconds and explicit offset or Z; distinguish authored, validity, scheduled, prepared, handed-over, administration occurrence, recorded, reported, ingested, observation and knowledge times whenever they differ.",
      "serial_naming_rule": "Use {aggregate-id}--{request-dispense-administration-or-assertion-id}--{artifact-kind}--{revision-id}.",
      "integrity_rule": "Store digest, media type, child-record kind, subject and medication binding, product and terminology versions, actor, event and knowledge times, status, access marking and provenance."
    },
    "policies": [
      "The aggregate does not own Patient, Practitioner, Organization, Encounter, CarePlan, Medication, MedicinalProductDefinition, MedicationKnowledge, Condition, Observation, AllergyIntolerance, AdverseEvent, DetectedIssue, Coverage, Claim, Inventory, Device, Provenance, Audit or Record masters.",
      "Request, authorization, dispense, handover, administration, reported use, adherence, response and harm remain separate assertions.",
      "A completed request, dispense or administration has only the semantics of that child record and never proves adherence, effectiveness, safety or causality.",
      "Agents cannot prescribe, modify dosage, authorize substitution, dispense, administer, infer adherence, override safety, attribute harm, disclose data or dispose records outside explicit clinical and policy authority."
    ],
    "crud": {
      "read": [
        "Resolve purpose, aggregate profile, child-record identities and kinds, sources, subject, medication, intent, actual events, statements, safety evidence, clinical links, lineage, holds and projection loss."
      ],
      "create": [
        "Bind stable aggregate and child identity, source, subject, medication, responsible authority, record kind and event or intent time before recording the medication stage."
      ],
      "update": [
        "Append successor child events, statuses, discrepancies, reconciliations, safety checks, response links and corrections with reason, authority, expected revision, event time and knowledge time."
      ],
      "delete": [
        "Apply clinical-record, medication-safety, privacy, legal-hold and adopting-Dimension retention policy; retire or tombstone only the aggregate or named child without cascading to Patient, CarePlan, Medication, Observation, AdverseEvent or other masters, and let the external records policy execute physical disposition."
      ]
    },
