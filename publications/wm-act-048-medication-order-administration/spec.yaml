    "decisions": [
      {
        "concept": "Request, dispense, administration and statement separation",
        "disposition": "accepted",
        "rationale": "FHIR defines intent, supply, actual exposure and reported belief as distinct records. The aggregate composes them through references and independent child identities rather than flattening them into one status or event."
      },
      {
        "concept": "Prescribed, dispensed and actually administered dosage separation",
        "disposition": "accepted",
        "rationale": "Dose, timing, route, site, method, rate, instructions, product and quantity may differ across stages. Source-qualified differences and reasons must survive reconciliation and projection."
      },
      {
        "concept": "Medication and regulated product master ownership",
        "disposition": "accepted-external",
        "rationale": "IDMP, SNOMED CT, RxNorm and FHIR separate product and terminology knowledge from patient-specific lifecycle records. The aggregate binds versioned substance, product, pack and lot identities but does not own their lifecycle."
      },
      {
        "concept": "Reported use and medication reconciliation",
        "disposition": "accepted",
        "rationale": "A MedicationStatement is weaker reported or derived evidence, while WHO transition guidance supports attributable source comparison, discrepancy resolution, list update and communication. Neither is silently promoted to formal administration evidence."
      },
      {
        "concept": "Medication safety checks and clinical authority",
        "disposition": "accepted-with-profile-hold",
        "rationale": "High-risk controls, allergy, contraindication, interaction and duplicate-therapy checks are relevant evidence, but knowledge versions, reviewer authority, local policy, override and escalation remain external and profile-specific."
      },
