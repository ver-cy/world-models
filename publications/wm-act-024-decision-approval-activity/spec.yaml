  "structure": {
    "bundles": [
      {
        "id": "b-frame",
        "name": "Decision framing and identity",
        "description": "What this decision occurrence is, what question it answers, what it concerns and what kind of decision it is.",
        "rationale": "Before authority or outcome can be interpreted, the occurrence must be individuated and typed; DMN gives the question/allowed-answers framing and PROV gives the activity individuation.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-003"
        ],
        "layers": [
          {
            "id": "l-identity-subject",
            "name": "Identity and subject",
            "description": "Identification of the occurrence and the question and subject matter it addresses.",
            "source_refs": [
              "SRC-001",
              "SRC-003",
              "SRC-011"
            ],
            "findings": [
              {
                "id": "f-decision-instance-identity",
                "name": "Decision occurrence identity",
                "description": "How one decision or approval occurrence is identified and kept distinct from its subject, its notice and the rule set applied.",
                "source_refs": [
                  "SRC-003",
                  "SRC-005",
                  "SRC-011"
                ],
                "questions": [
                  {
                    "id": "q-id-master-ref",
                    "text": "Which system of record issues the authoritative identifier for this decision occurrence, and what is that identifier?",
                    "kind": "identity",
                    "answer_data": [
                      "issuing register or system-of-record name",
                      "master decision reference string",
                      "identifier scheme and version"
                    ]
                  },
                  {
                    "id": "q-id-fallback",
                    "text": "If no master-system reference exists, which governed IRI or Dimension-minted UUID/ULID identifies it, and who mints it?",
                    "kind": "identity",
                    "answer_data": [
                      "fallback identifier value",
                      "minting authority",
                      "identifier kind (IRI, UUID, ULID)"
                    ]
                  },
                  {
                    "id": "q-id-separation",
                    "text": "How is this identifier kept distinct from the identifiers of the subject, the decision notice and the applied rule set?",
                    "kind": "relationship",
                    "answer_data": [
                      "subject reference",
                      "notice artifact reference",
                      "rule set reference",
                      "disambiguation rule"
                    ]
                  },
                  {
                    "id": "q-id-stability",
                    "text": "Under which later events (correction, re-vote, appeal outcome) does the identifier stay stable rather than being reissued?",
                    "kind": "constraint",
                    "answer_data": [
                      "stability policy statement",
                      "events forcing a new identifier",
                      "link type to the prior identifier"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-decision-ref",
                    "name": "Decision reference",
                    "description": "Authoritative identifier of the decision occurrence in its system of record.",
                    "value_kind": "identifier",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-005",
                      "SRC-011"
                    ]
                  },
                  {
                    "id": "de-decision-id-scheme",
                    "name": "Identifier scheme",
                    "description": "Scheme and version under which the decision reference is issued.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-011"
                    ]
                  },
                  {
                    "id": "de-decision-alt-refs",
                    "name": "Alternate references",
                    "description": "Non-authoritative identifiers used by other systems for the same occurrence.",
                    "value_kind": "identifier",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-003"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "Identity is pure inline reference data carried on the decision context itself. Emitting a document here would create a second, competing identity carrier; the notice, minutes and dossier are identified within their own findings."
              },
              {
                "id": "f-decision-question-and-subject",
                "name": "Question, subject and granularity",
                "description": "The exact question decided, the subject matter it reaches, the admissible answers and what counts as one occurrence rather than a chain.",
                "source_refs": [
                  "SRC-001",
                  "SRC-002",
                  "SRC-003",
                  "SRC-013"
                ],
                "questions": [
                  {
                    "id": "q-subject-question",
                    "text": "What exact question does this decision answer, and whose formulation of it is authoritative?",
                    "kind": "definition",
                    "answer_data": [
                      "question text",
                      "formulating authority",
                      "language and version of the formulation"
                    ]
                  },
                  {
                    "id": "q-subject-reach",
                    "text": "Which subject entities, requests or assets does the decision reach, and by which references?",
                    "kind": "relationship",
                    "answer_data": [
                      "subject reference set",
                      "reference resolution scheme",
                      "reach limitation statement"
                    ]
                  },
                  {
                    "id": "q-subject-allowed",
                    "text": "Which answers were admissible before the choice was made?",
                    "kind": "constraint",
                    "answer_data": [
                      "allowed answer set",
                      "source of the admissible set",
                      "whether a null or defer answer was admissible"
                    ]
                  },
                  {
                    "id": "q-subject-unit",
                    "text": "Is one occurrence a single approval step, a whole approval chain, or one item within a multi-item session?",
                    "kind": "composition",
                    "answer_data": [
                      "granularity code",
                      "splitting rule for multi-item sessions",
                      "upstream and downstream decision references"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-decision-question",
                    "name": "Decision question",
                    "description": "The question the decision answers, in the authoritative formulation.",
                    "value_kind": "text",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-001",
                      "SRC-002"
                    ]
                  },
                  {
                    "id": "de-decision-subject-ref",
                    "name": "Subject reference",
                    "description": "Reference to the entity or request decided about, resolved in its own owning model.",
                    "value_kind": "reference",
                    "cardinality": "1..n",
                    "required": true,
                    "source_refs": [
                      "SRC-003",
                      "SRC-009"
                    ]
                  },
                  {
                    "id": "de-decision-granularity",
                    "name": "Granularity code",
                    "description": "Whether the occurrence is a step, a chain or an item within a session.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-013"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "The question, the admissible answer set and the subject references are inline fields; any document that states them (agenda item, request form) belongs to the subject or input models and is referenced, not owned here."
              }
            ]
          },
          {
            "id": "l-typing-boundaries",
            "name": "Typing and modality",
            "description": "Classification of the decision and whether it was reached by human, automated or hybrid means.",
            "source_refs": [
              "SRC-004",
              "SRC-007",
              "SRC-008"
            ],
            "findings": [
              {
                "id": "f-decision-type-and-modality",
                "name": "Decision type, modality and materiality",
                "description": "The governed decision-type code, whether the outcome was produced solely by automated processing, and the materiality and reversibility of the decision.",
                "source_refs": [
                  "SRC-004",
                  "SRC-005",
                  "SRC-007",
                  "SRC-008"
                ],
                "questions": [
                  {
                    "id": "q-type-code",
                    "text": "Which decision-type code, from which governed code list and version, classifies this occurrence?",
                    "kind": "classification",
                    "answer_data": [
                      "decision-type code",
                      "code list identifier and version",
                      "definition of the code"
                    ]
                  },
                  {
                    "id": "q-type-modality",
                    "text": "Was the outcome produced solely by automated processing, by a human, or by a human acting on an automated recommendation?",
                    "kind": "decision",
                    "answer_data": [
                      "modality code",
                      "automated component reference",
                      "human decision-maker reference"
                    ]
                  },
                  {
                    "id": "q-type-materiality",
                    "text": "Which materiality or impact tier applies, and which scale sets that tier?",
                    "kind": "measurement",
                    "answer_data": [
                      "materiality tier value",
                      "scale identifier and version",
                      "measured or estimated basis"
                    ]
                  },
                  {
                    "id": "q-type-reversibility",
                    "text": "Is the decision reversible in practice, and what makes it irreversible once acted upon?",
                    "kind": "quality",
                    "answer_data": [
                      "reversibility flag",
                      "irreversibility cause",
                      "point of no return description"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-decision-type-code",
                    "name": "Decision type code",
                    "description": "Governed classification of the decision (approval, authorization, adjudication, selection, determination, ratification).",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-005"
                    ]
                  },
                  {
                    "id": "de-decision-modality",
                    "name": "Decision modality",
                    "description": "Human, automated or human-on-recommendation production of the outcome.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-007",
                      "SRC-008"
                    ]
                  },
                  {
                    "id": "de-materiality-tier",
                    "name": "Materiality tier",
                    "description": "Impact or materiality band governing scrutiny and review frequency.",
                    "value_kind": "code",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-005"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "Classification is coded inline data resolved against an externally governed code list; the code list itself is a registry owned by the adopting Dimension and is referenced rather than reproduced as an artifact here."
              }
            ]
          }
        ]
      },
      {
        "id": "b-authority",
