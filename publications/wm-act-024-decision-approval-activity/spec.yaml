  "model": {
    "registry_id": "vr.wm-act-024",
    "model_id": "WM-ACT-024",
    "name": "Decision / Approval Activity",
    "entry_kind": "event",
    "purpose": "Provide the context an agent needs to understand, create, inspect and operate a single decision or approval activity occurrence: the authority under which it was taken, the inputs and criteria actually used, the choice among admissible options, and the outcome with its conditions, validity window and contestation path.",
    "scope_statement": "Scope is one bounded decision or approval occurrence, in the PROV sense of an activity that occurred over a period and bears assigned responsibility. The model records that a decision was taken, by whom, on what authority, from what inputs, with what result and under what conditions. It does not evaluate policy, enforce outcomes, author rule logic, keep audit trails or execute disposition; those remain with referenced models. Storage and interface (JSON, YAML, Markdown, Git, MCP, MongoDB) are projections of this semantics, not part of it.",
    "in_scope": [
      "Identification of a single decision or approval occurrence and the question it answers",
      "Authority basis, mandate, delegation chain and competence limits under which the decision was taken",
      "Participants and their roles, independence requirements and multi-party approval facts",
      "The input and evidence set actually used, fixed by version, digest or as-of time",
      "The admissible option set, the chosen option and the rejected alternatives with reasons",
      "Rationale, dissent and the explanation owed to affected parties",
      "Outcome value, attached conditions and obligations, effective instant and validity window",
      "Decision status lifecycle, supersession, revocation, suspension and reauthorization triggers",
      "Human oversight of automated or assisted decisions, contestation, appeal and override records",
      "Reference bindings and crosswalks to external decision, provenance and authorization vocabularies"
    ],
    "out_of_scope": [
      "Runtime policy evaluation, rule combining algorithms, obligation discharge and access enforcement",
      "Audit-trail record structure, storage, immutability guarantees and log retention execution",
      "Authoring, versioning and testing of decision logic, rule sets, decision tables and hit policies",
      "The subject entity's own attributes and lifecycle (application, change, budget, dossier, system)",
      "Workflow orchestration, routing, queueing and task assignment engines",
      "Party and agent master data, organisational structure and position registries",
      "Retention schedule definition and disposition or destruction execution",
      "Cryptographic signature creation, certificate handling and signature validation",
      "Risk assessment methodology, scoring scales and control assessment procedures",
      "Notification transport, messaging infrastructure and publication channels",
      "Constitutive organisational rules (board composition, standing orders) as normative content"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ACT-002 Activity (registry parent)",
        "distinction": "Generic activity identity, temporal bounds, participation and status machinery are defined once in the parent; this model adds only decision-specific authority, option set, choice and outcome and must not restate the generic activity surface.",
        "source_refs": [
          "SRC-003"
        ]
      },
      {
        "neighbor": "Authorization policy evaluation service (XACML PDP/PEP)",
        "distinction": "A reference to an evaluator never grants ownership of evaluation. This model records that a decision exists and by what authority; policy evaluation, combining algorithms, obligation discharge and enforcement stay with the PDP and PEP.",
        "source_refs": [
          "SRC-004"
        ]
      },
      {
        "neighbor": "Audit trail / event log model",
        "distinction": "This model states which decision events must be logged and where the log reference lives; audit-record structure, tamper evidence, immutability and log retention are owned by the audit model.",
        "source_refs": [
          "SRC-006",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Records management and disposition model",
        "distinction": "Retention class and legal-hold status are asserted here as attributes of the decision record; appraisal, schedule definition and destruction execution belong to the records model or the adopting Dimension's retention policy.",
        "source_refs": [
          "SRC-006",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Decision logic / rule model (DMN decision requirement graph)",
        "distinction": "Design-time decisions, business knowledge models, decision tables and hit policies are authored and versioned there; this model pins the applied version and records deviations from it.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Subject of the decision",
        "distinction": "The thing decided about keeps its own model and lifecycle; the decision carries a reference plus decision-specific parameters and must not mirror the subject's attributes.",
        "source_refs": [
          "SRC-001",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Electronic signature and seal model",
        "distinction": "Signature creation and cryptographic validation are external; what is local is the binding of a signature to this decision and the declared meaning of that signature.",
        "source_refs": [
          "SRC-006"
        ]
      }
    ]
  },
