      "outputs": [
        "Resolved state code",
        "Governing validity interval",
        "Assertion and transition event references",
        "Lifecycle definition version used"
      ],
      "preconditions": [
        "The subject is bound to a lifecycle definition version",
        "At least one state assertion exists, or an explicit indeterminate status is returned"
      ],
      "effects": [
        "No state change; read-only",
        "May emit a reproducible as-of state snapshot for audit"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-024",
        "SRC-008",
        "SRC-001"
      ]
    },
    {
