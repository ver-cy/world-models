      "outputs": [
        "Updated validity interval",
        "Continuity validation result"
      ],
      "preconditions": [
        "Boundary convention and precision are declared in the temporal convention profile",
        "Adjustment does not violate contiguity or overlap constraints unless an exception is authorised"
