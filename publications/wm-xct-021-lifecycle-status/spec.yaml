        "rationale": "A lifecycle model that cannot be operated deterministically or exchanged without loss is not usable by an agent. SCXML fixes deterministic execution semantics, system-versioned tables fix as-of querying, FHIR supplies an explicit 'unknown' code for indeterminate status, and Bitstring Status List supplies distribution and privacy considerations for published status.",
