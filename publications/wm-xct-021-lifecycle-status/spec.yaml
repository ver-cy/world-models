  "composition": [
    {
      "target": "Host world-model entry composing this mixin (any entity, event, relationship, aggregate, registry or classifier)",
      "relation": "MIX-IN",
      "purpose": "Supply the host entry with a governed state machine, current-state assertion, bitemporal validity and disposition hooks without imposing any domain semantics.",
      "required": true,
      "source_refs": [
        "SRC-018",
        "SRC-016",
        "SRC-007"
      ]
    },
    {
      "target": "Classification / Code List Registry model (sibling; not yet registered)",
      "relation": "COMPOSE",
      "purpose": "The state space is a governed code list administered by a registration authority; this mixin binds such a code list and adds transition structure that a plain code list does not carry.",
      "required": true,
      "source_refs": [
        "SRC-016",
        "SRC-018",
        "SRC-022"
      ]
    },
    {
      "target": "Identity & Identifier model (sibling; not yet registered)",
      "relation": "REFERENCE",
      "purpose": "Subject, artifact and authority identifiers are minted and governed there; this mixin only cites them and enforces the identity priority order for its own artifacts.",
      "required": true,
      "source_refs": [
        "SRC-016",
        "SRC-018"
      ]
    },
    {
      "target": "Provenance & Lineage model (sibling; not yet registered)",
