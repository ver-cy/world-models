  "model": {
    "registry_id": "vr.wm-xct-021",
    "model_id": "WM-XCT-021",
    "name": "Lifecycle / Status",
    "entry_kind": "mixin",
    "purpose": "Provide one reusable, format-neutral context package that lets any host world-model entry declare the governed state machine it obeys, its current state on each status axis, the effective validity of that state in real-world time and in system time, and the authority, evidence, succession, invalidation and disposition rules that govern movement between states.",
    "scope_statement": "WM-XCT-021 is a cross-cutting mixin, not a standalone entity. It supplies (a) the definition of a lifecycle state machine as a governed, versioned, identified object; (b) the assertion of current state and the append-only history of transitions; (c) bitemporal effective validity, separating real-world (valid/application) time from record (transaction/ingestion) time; (d) succession, deprecation, revocation, suspension and disposition semantics including their reversibility and retroactive effect; and (e) the operational and interoperability surface needed to evaluate, apply, query, publish and map status. It deliberately carries no domain meaning: the semantics of any particular state ('active order', 'approved permit') belong to the host model that composes this mixin. It is independent of storage format and access interface; JSON, YAML, Markdown, HTML, Git, MCP and MongoDB are projections of these semantics, never their source.",
    "in_scope": [
      "Definition of the state space: governed state code list, state identity, initial state, terminal states, reversible states",
      "Multiple concurrent status axes (governance/publication, operational, legal validity, quality) and their precedence rules",
      "Transition topology: permitted source/target pairs, triggers, guard conditions, mandated effects, deterministic conflict resolution",
      "Concurrent regions, composite states, and history (resumption) semantics where the host lifecycle needs them",
      "Identity, versioning, ownership and change procedure of the lifecycle definition itself, including self-application of the mixin",
      "Current-state assertion and append-only transition history, with actor, authorizer, delegation and reason code",
      "Effective validity intervals (valid-from / valid-until), boundary inclusivity, precision, open-endedness and no-expiry conventions",
      "Bitemporality: event time, observation time, record/ingestion time; retroactive correction, amendment and as-of/as-at reconstruction",
      "Supersession, replacement, deprecation and sunset links, and traversal to the current item",
      "Revocation versus suspension, invalidity dating, retroactive effect, and published status distribution to relying parties",
      "Lifecycle end as a retention/disposition trigger, legal hold, logical deletion, tombstones and erasure reconciliation",
      "Operational contract for evaluating and applying transitions (idempotency, concurrency, atomicity, rejection recording)",
      "Mapping of local states to external status vocabularies, mapping strength, lossiness and recorded conflicts",
      "Visibility and access classification of pre-publication states and of transition justifications"
    ],
    "out_of_scope": [
      "Domain semantics of individual states (what 'dispensed', 'settled' or 'commissioned' means) — supplied by the host model",
      "Version identity, content diffing, branching and merging of the subject's content — belongs to a Versioning & Change Control model",
      "General provenance of content creation and derivation beyond lifecycle transitions — belongs to a Provenance & Lineage model",
      "Retention schedules, appraisal methodology and the legal instruments that authorise disposition — belongs to a Records Retention & Disposition model",
      "Authorization policy language, role engineering and enforcement — belongs to an Authorization & Access Control model",
      "Human workflow orchestration: task assignment, queues, escalation, service levels — belongs to a Process / Workflow model",
      "Calendars, business-day arithmetic, non-Gregorian temporal reference systems — belongs to a Temporal Reference & Calendar model",
      "Assignment and minting of subject identifiers — belongs to an Identity & Identifier model",
      "Governance of the state code list as a code list (publication, translation, code-list versioning) — belongs to a Classification / Code List Registry model",
      "Cryptographic formats, proofs and key management for credentials whose revocation patterns are reused here",
      "Physical storage, indexing, change-data-capture and database audit mechanisms — projection concerns",
      "Formal verification of state machines (deadlock, liveness, reachability proofs)"
    ],
    "boundary_notes": [
      {
        "neighbor": "Provenance & Lineage model",
        "distinction": "This mixin records why, by whom and under what authority a state changed, and the invalidation instant. General entity generation, derivation and attribution graphs belong to the provenance model; PROV-O generation/invalidation and FHIR Provenance.occurred vs Provenance.recorded are the shared seam, not a duplication.",
        "source_refs": [
          "SRC-004",
          "SRC-014"
        ]
      },
      {
        "neighbor": "Versioning & Change Control model",
        "distinction": "Supersession and deprecation are represented here as lifecycle states and links because they change fitness for use. The identity of a version, its content delta and its release engineering belong to the versioning model; DCAT 3 previousVersion/hasCurrentVersion and DCMI replaces/isReplacedBy are the alignment points.",
        "source_refs": [
          "SRC-009",
          "SRC-015",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Records Retention & Disposition model",
        "distinction": "Only the lifecycle-end trigger, the legal-hold flag and the resulting disposition state are modelled here. Appraisal, retention schedules and the authorising instrument are external; ISO 15489-1 requires disposition authorities to be authorised, dated, implemented and reviewed, which this mixin references rather than restates.",
        "source_refs": [
          "SRC-017",
          "SRC-021"
        ]
      },
      {
        "neighbor": "Authorization & Access Control model",
        "distinction": "This mixin records the authority basis actually exercised for a transition and the visibility class of a state; it does not define policy syntax, role hierarchies or an enforcement point.",
        "source_refs": [
          "SRC-017",
          "SRC-020"
        ]
      },
      {
        "neighbor": "Process / Workflow Orchestration model",
        "distinction": "The lifecycle here is a declarative state machine over one subject, in the sense of SCXML/UML behavioural state machines. Multi-actor task routing, work queues and durations belong to the workflow model.",
        "source_refs": [
          "SRC-007",
          "SRC-019"
        ]
      },
      {
        "neighbor": "Temporal Reference & Calendar model",
        "distinction": "Validity intervals, boundary conventions and RFC 3339/9557 timestamp rules are in scope. Temporal reference systems, non-Gregorian calendars and duration arithmetic belong to the temporal model; OWL-Time supplies the interval-relation vocabulary used across the seam.",
        "source_refs": [
          "SRC-008",
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Classification / Code List Registry model",
        "distinction": "The state code list is governed as a code list elsewhere (registration authority, registration status of each code). This mixin binds a code list to a state space and adds transition structure that a plain code list does not carry.",
        "source_refs": [
          "SRC-016",
          "SRC-018"
        ]
      },
      {
        "neighbor": "Credential / Certificate model",
        "distinction": "Revocation, suspension and status-list distribution patterns are generalised here from PKI and Verifiable Credentials. Credential formats, signature suites and key lifecycle stay in the credential model.",
        "source_refs": [
          "SRC-003",
          "SRC-005",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Event Record model",
        "distinction": "A lifecycle transition is a constrained event with a mandatory prior-state/new-state pair. General domain events, their payloads and their correlation belong to the event model.",
        "source_refs": [
          "SRC-004",
          "SRC-014"
        ]
      }
    ]
  },
