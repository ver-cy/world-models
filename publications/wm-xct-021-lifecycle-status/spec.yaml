      "preconditions": [
        "Transition evaluated as permitted",
        "Expected current state matches actual current state",
        "Event time conforms to the temporal convention profile"
      ],
      "effects": [
        "Appends to the append-only transition log",
        "Sets record time from the system clock, not from caller input",
        "Triggers mandated effects atomically or with declared compensation"
      ],
      "source_refs": [
        "SRC-007",
        "SRC-014",
        "SRC-024"
      ]
    },
    {
