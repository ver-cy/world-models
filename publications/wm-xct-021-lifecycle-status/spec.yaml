    "conflicts": [
      "Interval boundary inclusivity is genuinely inconsistent across ecosystems: HL7 FHIR states that both Period boundaries are inclusive, while SQL:2011-style application-time and system-time periods are closed-open. Exchanging validity intervals between the two without explicit conversion silently shifts every boundary by one unit of precision. The model resolves this by requiring the convention to be declared and conversions to be recorded, not by choosing a winner.",
      "RFC 9557 updates RFC 3339's interpretation of Z: under RFC 3339, -00:00 signalled that UTC is known but the local offset is not, while RFC 9557 assigns that meaning to Z itself. Systems built to the two documents can disagree about whether a timestamp carries a meaningful local offset.",
      "FHIR PublicationStatus collapses withdrawal and supersession into a single 'retired' code, whereas ISO 19135-1 keeps 'superseded' and 'retired' distinct because only the former implies a successor. Mapping FHIR to ISO 19135-1 is lossy in one direction and requires an out-of-band successor link in the other.",
      "Reversibility is not consistent across ecosystems: Bitstring Status List declares revocation irreversible and suspension reversible, while RFC 5280 permits a certificateHold to be reversed by removeFromCRL and treats 'superseded' as a revocation reason rather than a separate lifecycle state. A subject that is 'revoked' in one ecosystem may be 'held' and later restored in the other.",
      "W3C ADMS is a Working Group Note that was retired in August 2023, yet adms:status remains the property that DCAT 3 and DCAT-AP reference for resource status. Citing it is unavoidable in catalogue contexts and simultaneously unsafe as a stable normative anchor.",
      "The latest published version of the W3C Time Ontology at /TR/owl-time/ is a Candidate Recommendation Draft dated 15 November 2022, not a Recommendation. Alignment to Allen relations is therefore alignment to a non-final draft and should be re-checked before any conformance claim.",
      "schema.org EventStatusType mixes lifecycle state (EventCancelled, EventPostponed) with a change of modality (EventMovedOnline), which is a property change rather than a state change. It is included as a widely deployed alignment target and as a documented counterexample of axis conflation, not as a model to imitate.",
      "ISO 19135-1 requires retired, superseded and invalid items to be kept so that historical data remains interpretable, while GDPR Article 17 can require erasure of personal data held in those very records. The tombstone construct is the model's reconciliation, but it is a policy compromise rather than a resolution: some jurisdictions will not accept a tombstone as sufficient erasure.",
      "FHIR says consistency of status codes across resources is not the primary objective, yet publishes an experimental canonical map that is not ready for production.",
      "ISO 19108 emphasises valid time; PROV and RFC 3339 emphasise event/transaction timestamps; both axes are required and must not be collapsed.",
      "RFC 3339 describes instants only; FHIR Period, OWL-Time and dcterms:valid describe intervals, with dcterms:valid as a literal rather than a structured period.",
      "OWL-Time encodings ignore leap seconds; ISO 8601 mandates them.",
      "OWL-Time 2022 is a Candidate Recommendation Draft; a 2017 Recommendation exists. Align to the cited 2022 CRD without claiming W3C Recommendation status for that edition.",
      "SCXML XML, UML graphical/XMI and PSSM operational semantics are related Harel descendants, not identical.",
      "Clinical status is not workflow status; using one code list for both is a conflict with FHIR.",
      "Current-list membership cannot be inferred from status=active.",
      "entered-in-error should be ignored but often cannot be removed, conflicting with naive CRUD delete.",
      "RFC 3339 -00:00 (unknown offset) is semantically distinct from Z."
