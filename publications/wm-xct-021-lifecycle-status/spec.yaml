    "regional_assumptions": [
      "Erasure and storage-limitation duties are modelled on Regulation (EU) 2016/679 and apply to EU/EEA personal data. Other regimes (UK GDPR, Brazilian LGPD, US state privacy laws, sectoral rules) impose different triggers, exemptions and retention floors; the retention trigger and disposition action elements are deliberately parameterised rather than fixed.",
      "The NARA General Records Schedules are United States federal instruments and are cited as an example of externally issued, versioned disposition authority, not as an applicable rule outside that jurisdiction.",
      "Gregorian calendar, UTC and the IANA time-zone database are assumed for all timestamps. Non-Gregorian calendars, ordinal or geological time scales and other temporal reference systems are out of scope and delegated to a Temporal Reference model.",
      "ISO 19135-1 is written for geographic-information registers. Its generalisation to non-geographic registers is an interpretation made here, supported by the UKGovLD registry vocabulary explicitly reusing its status semantics, but it is an interpretation and not a claim about the standard's stated scope.",
      "ISO/IEC 11179-6 registration status semantics are drawn from metadata registries; applying lifecycle-versus-documentation status categories to arbitrary world-model subjects is an extension by analogy.",
      "Language and label handling assumes that display labels are non-identifying and may be translated freely; jurisdictions where a legally binding status must be expressed in a specific official language will need an additional constraint on label authority.",
      "Default TRS is Gregorian calendar with UTC offsets as in RFC 3339 and xsd:dateTimeStamp; other TRS are allowed but not defaulted.",
      "Canonical status tokens cited from FHIR are English codes; local systems may use other languages or jurisdictions.",
      "Healthcare-shaped pattern families are alignments, not a requirement outside clinical Dimensions.",
      "Records retention durations and legal holds are jurisdiction-specific and not specified here.",
      "Daylight-saving and political offset changes are out of RFC 3339 scope; scheduled local wall-clock transitions need a time sibling."
