    "adversarial_checks": [
      "Tested whether 'status' and 'validity period' could be modelled as one concept, and rejected it: VC Data Model 2.0 keeps validFrom/validUntil separate from credentialStatus, and RFC 5280 keeps the certificate validity period separate from the CRL, precisely because time-bound expiry and event-driven invalidation have different actors, different reversibility and different distribution needs.",
      "Tested whether a single flat status enumeration suffices, and rejected it: ISO/IEC 11179-6 already splits registration status into lifecycle and documentation categories, and the UKGovLD registry organises statuses into a two-level hierarchy under accepted and notAccepted. A flat enumeration cannot express that superseded and retired are both kinds of deprecated.",
      "Tested whether the transition log could be an audit-log projection rather than model semantics, and rejected it: the FHIR distinction between Provenance.occurred and Provenance.recorded and the RFC 5280 invalidityDate extension are semantic, not storage, facts — they change what a consumer may rely on. Storage-level change-data-capture is therefore explicitly excluded while the semantic log is retained.",
      "Searched for a counterexample to the append-only policy and found one: GDPR Article 17 erasure can compel removal of content from records that ISO 19135-1 requires to be preserved. Rather than asserting that append-only is absolute, the model records the conflict and specifies a tombstone mechanism, flagging it as a policy compromise that some jurisdictions may reject.",
      "Attempted to verify boundary-inclusivity as a universal convention and found the opposite: FHIR Period boundaries are inclusive while SQL:2011-style periods are closed-open. The model therefore declines to pick a canonical convention and instead requires the convention to be declared and conversions to be explicit — an attractive simplification was rejected for lack of support.",
      "Checked whether ADMS and OWL-Time could be used as stable normative anchors and found they cannot: ADMS is a retired W3C Note still referenced by DCAT 3, and the latest published OWL-Time is a Candidate Recommendation Draft. Both are retained as alignments only, with their maturity recorded as a conflict rather than glossed over.",
      "Tested whether ISO 19135-1's four item statuses could be presented as the canonical state set for all subjects, and rejected it: the standard's stated scope is geographic-information registers, and FHIR, schema.org and PKI each carry incompatible sets. The model therefore treats every external vocabulary as a mapping target and requires local state sets to be governed independently.",
      "Attempted to source the structural node on jurisdictional scoping of validity from a primary standard and failed; rather than presenting it as canonical structure, it is recorded as a gap in the coverage checklist and excluded from the bundle hierarchy.",
      "Treat any proposal that uses a date as the lifecycle identifier as invalid.",
      "Reject models that store only one timestamp for a late-entered historical status.",
      "Reject single-code current status as complete when the machine has parallel regions.",
      "Reject delete-as-correction when entered-in-error applies.",
      "Reject inference that status=active means membership of a current curated list.",
      "Reject unstated production use of experimental http://hl7.org/fhir/resource-status.",
      "Reject collapse of clinical-interpretation inactive with workflow completed.",
      "Reject unqualified local times without offset or Z.",
      "Reject silent overwrite of status without a transition audit and agent.",
