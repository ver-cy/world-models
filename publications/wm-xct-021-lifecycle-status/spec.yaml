        "rationale": "Registration standards require that the status of an item be assigned by a named authority against a defined set of statuses, and state-machine standards require states and transitions to be declared before instances can be validated. Without an explicit machine definition, a status field is an ungoverned string and no conformance claim about instance histories is falsifiable.",
