  "functions": [
    {
      "id": "resolve-effective-state",
      "name": "Resolve effective state",
      "description": "Return the state of a subject on a named axis for a given real-world instant, as believed at a given record instant, together with the interval and assertion that produced the answer.",
      "inputs": [
        "Subject reference",
        "Status axis identifier",
        "As-of valid instant (default: request instant)",
        "As-at record instant (default: latest)"
