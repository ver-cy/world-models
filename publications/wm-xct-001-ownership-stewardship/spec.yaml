  "functions": [
    {
      "id": "anchor-controllable-object",
      "name": "Anchor a controllable object",
      "description": "Admit a meta-object into the control register by recording its reference, controllability class, extent and registration basis, making it capable of bearing control assertions.",
      "inputs": [
        "object reference",
        "object kind",
        "proposed controllability class",
        "registration basis and source",
        "requesting party"
      ],
      "outputs": [
        "control anchor record",
        "assigned control record identifier",
        "controllability determination"
      ],
      "preconditions": [
        "object reference resolves to a canonical instance",
        "register competence covers the object class and territory",
        "requesting party is authorised to lodge an anchor"
      ],
      "effects": [
        "object becomes addressable by subsequent control assertions",
        "objectAnchored event emitted with RFC 3339 event and ingestion timestamps",
        "non-controllable determination recorded as a refusal with reasons rather than a silent drop"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-006",
        "SRC-019",
        "SRC-001"
      ]
    },
    {
      "id": "assert-control-position",
      "name": "Assert a control position",
      "description": "Record that one or more parties hold a referenced object in a stated modality, with basis, shares, encumbrances, validity interval and assurance level.",
      "inputs": [
        "control anchor reference",
        "holder party references and roles",
        "control modality",
        "basis and evidencing sources",
        "share schedule where co-held",
        "effective interval"
      ],
      "outputs": [
        "control record",
        "assurance level determination",
        "validation report"
      ],
      "preconditions": [
        "anchor exists and is operative",
        "modality is present in the governed modality vocabulary",
        "shares sum correctly for the stated extent",
        "asserting party has standing under the register charter"
      ],
      "effects": [
        "control record created in state effective or pending-conditions",
        "prior overlapping assertion superseded and retained as addressable",
        "controlAsserted event emitted"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-007",
        "SRC-009",
        "SRC-016"
      ]
    },
    {
      "id": "resolve-current-controller",
      "name": "Resolve the current controller",
      "description": "Return the operative holder or controller of a named object in a named modality at a given instant, with the minimum disclosure the requester's purpose requires.",
      "inputs": [
        "object reference",
        "control modality",
        "as-of timestamp",
        "requester identity and declared purpose"
      ],
      "outputs": [
        "current holder extract",
        "assurance and staleness indicators",
        "contested-status flag"
      ],
      "preconditions": [
        "requester passes the disclosure test for the requested projection",
        "as-of timestamp carries an explicit offset or Z"
      ],
      "effects": [
        "read logged where the projection is privileged",
        "no mutation of the control record",
        "extract issued as a serial artifact with its own as-of timestamp"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-018",
        "SRC-012"
      ]
    },
    {
      "id": "verify-delegated-authority",
      "name": "Verify delegated authority",
      "description": "Determine whether a claimed delegate holds live, in-scope, unrevoked authority to perform a specific act over a specific object, and record the verification as counterparty evidence.",
      "inputs": [
        "mandate reference or presented capability",
        "proposed act and object extent",
        "verification instant",
        "verifier identity"
      ],
      "outputs": [
        "verification outcome",
        "scope match detail",
        "mandate verification record",
        "attribution mode determination"
      ],
      "preconditions": [
        "mandate resolves and its issuing control position is operative",
        "status source is reachable, or a declared offline method with a stated staleness bound is used"
      ],
      "effects": [
        "verification record persisted immutably",
        "chain containment checked against the issuing position",
        "excess-scope attempts recorded as refusals with reasons"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-011",
        "SRC-004",
        "SRC-005"
      ]
    },
    {
      "id": "execute-transfer-of-control",
      "name": "Execute a transfer of control",
      "description": "Move control of an object from transferor to transferee under an instrument, enforcing exclusivity, conditions precedent and required consents.",
      "inputs": [
        "transfer instrument",
        "transferor and transferee references",
        "transferred modality and extent",
        "consents from encumbrance holders and co-holders",
        "execution and intended effective timestamps"
      ],
      "outputs": [
        "new control record for the transferee",
        "superseded record for the transferor",
        "transfer event",
        "updated chain of title"
      ],
      "preconditions": [
        "transferor's position is operative and not frozen by a contested-claim notice",
        "all conditions precedent are satisfied or explicitly deferred",
        "exclusivity check confirms no concurrent disposition holds the ordering key",
        "transferred extent does not exceed the transferor's position"
      ],
      "effects": [
        "exactly one operative position exists per object-and-modality after commit",
        "execution, effective and recorded times persisted separately",
        "counterparties with notice-only encumbrances notified",
        "subsisting mandates re-evaluated against the new position"
      ],
      "source_refs": [
        "SRC-006",
        "SRC-019",
        "SRC-013"
      ]
    },
    {
      "id": "restructure-holding-shares",
      "name": "Restructure holding shares",
      "description": "Change the co-holders, fractions or co-holding form of a single holding, subject to the recorded decision rule.",
      "inputs": [
        "control record reference",
        "proposed share schedule",
        "co-holder consents",
        "effective timestamp"
      ],
      "outputs": [
        "new share schedule artifact",
        "superseded schedule reference",
        "shareRestructured event"
      ],
      "preconditions": [
        "proposed fractions sum correctly for the recorded extent",
        "decision threshold for disposal or restructuring is met",
        "no encumbrance blocks the restructuring"
      ],
      "effects": [
        "prior schedule retained and addressable",
        "downstream mandates scoped to a changed share are re-evaluated",
        "co-holder set changes propagated to the disclosure tiering"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-007"
      ]
    },
    {
      "id": "manage-capacity-arrangement",
      "name": "Establish or review a capacity arrangement",
      "description": "Create, review, vary or terminate a support or substitute decision-making arrangement over a holding, enforcing the mandatory safeguards.",
      "inputs": [
        "holder reference",
        "proposed arrangement mode and scope",
        "least-restrictive-alternative justification",
        "conflict of interest screening",
        "reviewing authority reference",
        "proposed expiry"
      ],
      "outputs": [
        "capacity arrangement record",
        "review schedule",
        "safeguard compliance determination"
      ],
      "preconditions": [
        "a competent, independent and impartial review authority is named",
        "an expiry date is present",
        "conflict of interest screening is recorded",
        "the person's expressed will and preferences are on record or their absence is justified"
      ],
      "effects": [
        "arrangement created with a mandatory next-review date",
        "arrangement without an expiry or reviewer is rejected",
        "review outcomes create new serial versions rather than editing in place",
        "expiry without review moves the arrangement to lapsed, not to silently continuing"
      ],
      "source_refs": [
        "SRC-010"
      ]
    },
    {
      "id": "open-succession-or-lapse",
      "name": "Open a succession or lapse",
      "description": "Record the trigger event that removes a holder without an act of transfer, place the holding in an interim state, and apply the vesting rule when a successor is determined.",
      "inputs": [
        "trigger event type and timestamp",
        "evidencing source",
        "administrator or interim controller where appointed",
        "diligent search record for abandonment cases"
      ],
      "outputs": [
        "succession notice",
        "interim control state",
        "vesting record when determined"
      ],
      "preconditions": [
        "trigger event is evidenced by an admissible source",
        "for abandonment or lapse, a documented diligent search over a defined period exists"
      ],
      "effects": [
        "holding enters an explicit interim state rather than acquiring an invented successor",
        "successionOpened event emitted",
        "the former holder's identifier is never reassigned to the successor"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-010",
        "SRC-015"
      ]
    },
    {
      "id": "record-competing-claim",
      "name": "Record and resolve a competing claim",
      "description": "Register an irreconcilable claim over an object, freeze the operations the register's rules require, and ingest an outcome from the dispute forum without adjudicating.",
      "inputs": [
        "claimant reference",
        "claimed position and basis",
        "conflict dimension",
        "dispute forum reference where proceedings exist"
      ],
      "outputs": [
        "contested claim notice",
        "frozen operation set",
        "ingested outcome record"
      ],
      "preconditions": [
        "the claim states a basis and identifies the conflict dimension",
        "the register has competence over the object"
      ],
      "effects": [
        "object flagged contested and the notice surfaced on all extracts",
        "declared operations frozen until resolution or withdrawal",
        "ingested outcomes create new records; no prior record is deleted"
      ],
      "source_refs": [
        "SRC-015",
        "SRC-013",
        "SRC-019"
      ]
    },
    {
      "id": "evaluate-control-assurance",
      "name": "Evaluate control assurance",
      "description": "Assess a control record or a population of records for adequacy, accuracy, currency and chain completeness, and schedule remediation.",
      "inputs": [
        "control record or population selector",
        "assurance policy and staleness thresholds",
        "evaluation instant"
      ],
      "outputs": [
        "assurance review report",
        "staleness and gap findings",
        "remediation task list"
      ],
      "preconditions": [
        "assurance policy with explicit thresholds is in force",
        "evaluation instant carries an explicit offset or Z"
      ],
      "effects": [
        "assurance levels and last-verified timestamps updated",
        "records exceeding the staleness threshold marked non-operative for reliance",
        "unverified and unevidenced links reported rather than inferred"
      ],
      "source_refs": [
        "SRC-009",
        "SRC-013",
        "SRC-017"
      ]
    },
    {
      "id": "export-aligned-projection",
      "name": "Export an aligned projection",
      "description": "Emit control records in an external standard's shape for portability or interchange, carrying explicit loss and conflict warnings and no unwarranted conformance claim.",
      "inputs": [
        "record selection",
        "target standard and version",
        "requester identity and purpose",
        "disclosure tier"
      ],
      "outputs": [
        "aligned export payload",
        "loss and conflict report",
        "alignment crosswalk version reference"
      ],
      "preconditions": [
        "a crosswalk exists for the pinned target standard version",
        "requester is entitled to the elements included at the applied disclosure tier"
      ],
      "effects": [
        "export emitted with alignment-only labelling unless tested conformance evidence exists",
        "unmapped and lossy elements enumerated in the report",
        "export event logged with the crosswalk and disclosure policy versions in force"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-003",
        "SRC-004",
        "SRC-007",
        "SRC-001"
      ]
    },
    {
      "id": "appoint-steward-or-custodian",
      "name": "Appoint steward",
      "description": "Appoint a custodian or trustee-like operator with duties, term and accountability route, without conferring beneficial ownership.",
      "inputs": [
        "Appointing title or trust instrument",
        "Steward party, duty list, term and accountability route"
      ],
      "outputs": [
        "Steward appointment instrument"
      ],
      "preconditions": [
        "An appointment basis exists (contract, statute, court order or trust instrument)"
      ],
      "effects": [
        "Custody and care are conferred while beneficial ownership is expressly not transferred"
      ],
      "source_refs": [
        "SRC-026",
        "SRC-028"
      ]
    },
    {
      "id": "grant-or-revoke-delegation-mandate",
      "name": "Grant or revoke mandate",
      "description": "Issue, constrain, sub-delegate, expire or revoke a scoped grant of control powers that must not exceed the live parent title.",
      "inputs": [
        "Parent ownership record",
        "Assignee, power list, constraints, term and sub-delegation flag"
      ],
      "outputs": [
        "Mandate instrument with lifecycle status"
      ],
      "preconditions": [
        "Granted powers do not exceed the live parent title"
      ],
      "effects": [
        "Mandate becomes offered, agreed, suspended, expired or revoked",
        "Powers shrink automatically when the parent title is transferred, restricted, annulled or ceases"
      ],
      "source_refs": [
        "SRC-022",
        "SRC-026"
      ]
    },
    {
      "id": "reconstruct-chain-of-control",
      "name": "Reconstruct chain of title",
      "description": "Return the ordered transfer and provenance history of one object, omitting unrelated holdings of the parties.",
      "inputs": [
        "Object reference"
      ],
      "outputs": [
        "Ordered transfer and provenance history with supporting sources"
      ],
      "preconditions": [
        "Requester already has a legitimate interest in that object"
      ],
      "effects": [
        "Unrelated holdings of the parties are omitted",
        "History is read from append-only records, not from mutated current state"
      ],
      "source_refs": [
        "SRC-021",
        "SRC-012"
      ]
    },
    {
      "id": "record-or-release-encumbrance",
      "name": "Record restriction",
      "description": "Attach a restriction, responsibility, prohibition or duty to a title, with interval and an optional pointer to a secured-transactions sibling.",
      "inputs": [
        "Ownership record",
        "Restriction class, imposing party, action or duty, constraints and interval"
      ],
      "outputs": [
        "Restriction notice bound to the title"
      ],
      "preconditions": [
        "The imposing party and legal basis are identified"
      ],
      "effects": [
        "The title is qualified without transfer",
        "Priority and enforcement remain in the secured-transactions sibling behind a pointer"
      ],
      "source_refs": [
        "SRC-021",
        "SRC-022"
      ]
    },
    {
      "id": "resolve-beneficial-holders",
      "name": "Resolve beneficial owners",
      "description": "Return the natural persons who ultimately own or control, the control pathway, currency timestamp and any open discrepancy, distinct from legal owners.",
      "inputs": [
        "Object or holding-vehicle reference",
        "Access class of the requester"
      ],
      "outputs": [
        "Natural-person beneficial owners with control pathway, currency timestamp and discrepancy status"
      ],
      "preconditions": [
        "Requester falls within a FATF access class implemented by the Dimension"
      ],
      "effects": [
        "The read is audited",
        "Stale beneficial-ownership records are returned marked discrepant or unknown, never as current"
      ],
      "source_refs": [
        "SRC-024"
      ]
    }
  ],
  "composition": [
    {
      "target": "Every meta-object in the catalogue (the control facet)",
      "relation": "MIX-IN",
      "purpose": "Attach the control facet — holder, modality, basis, validity, assurance — to any meta-object without embedding domain semantics into it, so that control can be asked of anything the catalogue registers.",
      "required": true,
      "source_refs": [
        "SRC-013",
        "SRC-001",
        "SRC-016"
      ]
    },
    {
      "target": "Meta-object core identity primitive",
      "relation": "EXTEND",
      "purpose": "Every control assertion anchors to the core object identity; this model extends that primitive with a control facet rather than minting a parallel identity for the object.",
      "required": true,
      "source_refs": [
        "SRC-013",
        "SRC-001"
      ]
    },
    {
      "target": "Person model (natural persons)",
      "relation": "REFERENCE",
      "purpose": "Holders, beneficial holders, delegates, stewards and supported persons are natural persons resolved in the person model; this model holds only references and roles.",
      "required": true,
      "source_refs": [
        "SRC-013",
        "SRC-010"
      ]
    },
    {
      "target": "Organization model (legal persons and bodies)",
      "relation": "REFERENCE",
      "purpose": "Organizations, communities and public bodies appear as holders, stewards, register authorities and review authorities; their identity, legal form and existence lifecycle live in their own model.",
      "required": true,
      "source_refs": [
        "SRC-013",
        "SRC-009"
      ]
    },
    {
      "target": "Access / authorization contract model",
      "relation": "REFERENCE",
      "purpose": "Every access grant must resolve its grantor against a live control record here; this model supplies grantor standing, the access model supplies permissions, prohibitions and duties.",
      "required": true,
      "source_refs": [
        "SRC-004",
        "SRC-001"
      ]
    },
    {
      "target": "Access and change audit model",
      "relation": "REFERENCE",
      "purpose": "Privileged reads of control data and all register mutations are logged in the audit model; this model declares what must be logged, not the log's structure.",
      "required": true,
      "source_refs": [
        "SRC-018",
        "SRC-007"
      ]
    },
    {
      "target": "Provenance and lineage model",
      "relation": "ALIGN",
      "purpose": "Control transitions are emitted as provenance-compatible attribution and delegation statements, so that responsibility for an object's control history is queryable alongside its content lineage.",
      "required": false,
      "source_refs": [
        "SRC-003",
        "SRC-012"
      ]
    },
    {
      "target": "Rights, licensing and IPR model",
      "relation": "REFERENCE",
      "purpose": "Rights in the work are distinguished from control of the object; a rights holder is referenced here but rights terms, licences and permitted uses are defined there.",
      "required": false,
      "source_refs": [
        "SRC-012",
        "SRC-004"
      ]
    },
    {
      "target": "Dispute resolution and adjudication model",
      "relation": "REFERENCE",
      "purpose": "Contested claims are flagged here and adjudicated there; outcomes flow back as ingested transfer, annulment or confirmation records.",
      "required": false,
      "source_refs": [
        "SRC-013",
        "SRC-015"
      ]
    },
    {
      "target": "Identity credential and key management model",
      "relation": "REFERENCE",
      "purpose": "Cryptographic verification methods evidence control but do not constitute it; key rotation must not be interpretable as a transfer of ownership.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-002"
      ]
    },
    {
      "target": "ISO 19152-1:2024 LADM generic conceptual model",
      "relation": "ALIGN",
      "purpose": "Adopt the party / right-restriction-responsibility / administrative-unit pattern, the fraction and versioned-object primitives, and the source association; alignment only, since this model covers non-spatial meta-objects LADM does not address.",
      "required": false,
      "source_refs": [
        "SRC-013"
      ]
    },
    {
      "target": "W3C ODRL Information Model 2.2",
      "relation": "ALIGN",
      "purpose": "Reuse the assigner/assignee role functions, constraint shape and Duty class for mandates and holder responsibilities, without adopting ODRL as the control record's own encoding.",
      "required": false,
      "source_refs": [
        "SRC-004"
      ]
    },
    {
      "target": "W3C Controlled Identifiers v1.0 and DID v1.1",
      "relation": "ALIGN",
      "purpose": "Map the de-facto technical control modality and the delegation primitive onto controller, capabilityInvocation and capabilityDelegation; DID v1.1 is a Candidate Recommendation, so the alignment is provisional.",
