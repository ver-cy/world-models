            "findings": [
              {
                "id": "capacity-support-arrangements",
                "name": "Capacity and decision-support arrangements",
                "description": "CRPD Article 12 recognises legal capacity on an equal basis and requires access to support in exercising it; where any measure relating to legal capacity is used it must respect the person's rights, will and preferences, be free of conflict of interest and undue influence, be proportional and tailored, apply for the shortest time possible, and be subject to regular review by a competent, independent and impartial authority. A control model must therefore default to supported decision-making and treat full substitution as a bounded, reviewable exception carrying an expiry — not as a permanent 'guardian' field.",
                "source_refs": [
                  "SRC-010",
                  "SRC-005"
                ],
                "questions": [
                  {
