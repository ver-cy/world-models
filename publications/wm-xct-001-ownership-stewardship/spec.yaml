            "findings": [
              {
                "id": "control-modality-classification",
                "name": "Control modality classification",
                "description": "'Ownership' is not a single relation. The sources support at least five distinguishable modalities: legal title or tenure right (LADM LA_Right), beneficial interest (AMLR beneficial owner), custody or possession-equivalent control (MLETR, UCC-12), administrative controllership and accountability (GDPR controller; NIST information owner; ISO/IEC 27002 asset owner), and de-facto technical control (CID controller). These have different transfer rules, different evidence and different consequences; the EU Data Act explicitly refuses to convert a data holder's position into a new right. The modality must therefore be an explicit, non-defaulted field.",
                "source_refs": [
                  "SRC-007",
                  "SRC-016",
                  "SRC-006",
                  "SRC-008",
                  "SRC-001",
                  "SRC-013",
                  "SRC-017"
                ],
