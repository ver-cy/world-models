    "conflicts": [
      "dcterms:rightsHolder defines a rights holder as a person or organization 'owning or managing rights over the resource', conflating the holder and the steward that this model deliberately separates. Exports to DCMI are therefore lossy and must emit a warning (SRC-012).",
      "CID makes control a factual capability — whoever can update the canonical resource is by definition a controller — while LADM, MLETR and property law treat control as a normative entitlement. A person can hold CID-control without any right, and vice versa. This model keeps them as separate modalities and refuses to reconcile them (SRC-001, SRC-013, SRC-006).",
