              {
                "id": "mandate-verification-revocation",
                "name": "Mandate verification and revocation",
                "description": "A mandate is only useful if a counterparty can check, at the moment of reliance, that it exists, is in scope and is unrevoked. Revocation is never instantaneous in a distributed setting, so the model must record the revocation timestamp, the publication timestamp and the reliance rule that governs acts falling in the gap. RFC 8693's may_act shows the same pattern: authorization to become an actor is a checkable statement, not an ambient property.",
