            "findings": [
              {
                "id": "retention-archival-and-deletion",
                "name": "Retention, archival and deletion",
                "description": "Control history and personal-data rights pull in opposite directions. dcterms:provenance treats the ownership and custody chain as essential to authenticity, and a chain with holes cannot support reliance; GDPR nonetheless grants rectification and, in defined circumstances, erasure. The resolution is explicit: define which elements are permanent register content, which are erasable identifying attributes held by reference in the party model, and use tombstoning rather than physical deletion of links.",
