      {
        "id": "control-anchor",
        "name": "Controllability and Anchoring",
        "description": "What makes a meta-object subject to a control record at all, how that record is identified and versioned, which modality of control is asserted, and on what basis.",
        "rationale": "Every downstream statement — share, delegation, transfer — presupposes a determinate object, a determinate control modality and a stated basis. LADM anchors rights to a basic administrative unit and every class to a versioned object and a source; MLETR and UCC Art. 12 both require that the record be susceptible to control and that the person in control be identifiable. Without this bundle the mix-in would attach ownership language to objects that cannot bear it.",
        "source_refs": [
          "SRC-013",
          "SRC-006",
          "SRC-019",
          "SRC-001"
        ],
        "layers": [
          {
            "id": "object-binding",
            "name": "Object Binding and Record Identity",
            "description": "The reference from a control assertion to the meta-object it governs, the controllability of that object, and the identity and version discipline of the assertion itself.",
            "source_refs": [
              "SRC-013",
              "SRC-006",
              "SRC-001"
            ],
            "findings": [
              {
                "id": "controllable-object-anchor",
                "name": "Controllable object anchor",
                "description": "A control record binds to exactly one referenced meta-object. The reference must resolve, and the object must be of a kind that can bear control: MLETR and UCC Article 12 both gate control on the record being susceptible to exclusive control, and CID makes control turn on the ability to update a canonical resource. Objects that are pure abstractions, aggregates without a canonical instance, or copies without a single authoritative instance are not controllable and must be flagged rather than silently given an owner.",
                "source_refs": [
                  "SRC-006",
                  "SRC-019",
                  "SRC-001",
                  "SRC-013"
                ],
                "questions": [
                  {
                    "id": "q-anchor-target",
                    "text": "Which single meta-object does this control assertion govern, and does that reference resolve to a canonical instance rather than a copy or a class?",
                    "kind": "identity",
                    "answer_data": [
                      "object reference (identifier of the governed meta-object)",
                      "object kind / classifier",
                      "canonical-instance flag",
                      "resolution status of the reference"
                    ]
                  },
                  {
                    "id": "q-anchor-controllable",
                    "text": "Is the object susceptible to exclusive control, or does it exist as indefinitely reproducible copies with no authoritative instance?",
                    "kind": "classification",
                    "answer_data": [
                      "controllability class (exclusively-controllable | jointly-controllable | non-exclusive | non-controllable)",
                      "authoritative-instance mechanism",
                      "justification text"
                    ]
                  },
