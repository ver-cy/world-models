                "id": "trust-arrangement-and-separate-fund",
                "name": "Trust parties and separate fund",
                "description": "HCCH Trusts Convention Article 2 defines a trust as a relationship created inter vivos or on death by a settlor when assets are placed under the control of a trustee for a beneficiary or a specified purpose. Characteristics: the assets are a separate fund and not part of the trustee's own estate; title stands in the trustee or another on the trustee's behalf; the trustee has the power and the duty, in respect of which the trustee is accountable, to manage, employ or dispose of the assets. Reservation of settlor powers, and the trustee also being a beneficiary, are not necessarily inconsistent with a trust. Article 11 requires that personal creditors of the trustee have no recourse against trust assets and that those assets do not fall into the trustee's insolvency, matrimonial property or death estate. The Convention applies only to voluntarily created trusts evidenced in writing (Article 3) and does not bind States to recognise trusts whose significant elements connect to non-trust States (Article 13).",
