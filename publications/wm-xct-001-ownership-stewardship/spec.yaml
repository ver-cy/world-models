                "name": "Applicable law and situs",
                "description": "HCCH Articles 6–8: a trust is governed by the law chosen by the settlor or, failing that, the law of closest connection, ascertained especially from place of administration, situs of assets, residence of the trustee, and objects of the trust. Article 9 allows a severable aspect, particularly administration, to be governed by a different law. Article 15 lists mandatory forum rules that cannot be derogated from by voluntary act. DCMI coverage and Jurisdiction describe spatial applicability or the jurisdiction under which a resource is relevant. FAO VGGT is implemented through national strategies and legislation; it is not self-executing title. Lex rei sitae for tangible objects, lex societatis for legal persons, and chosen trust law may therefore diverge for one meta-object; the mixin records each pointer rather than picking a single world law.",
