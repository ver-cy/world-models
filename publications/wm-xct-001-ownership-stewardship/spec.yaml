                "name": "Collective and community authority to control",
                "description": "Some holdings vest in a people, community or governing body rather than in an individual or a corporate person. CARE asserts that Indigenous Peoples' rights and interests in Indigenous data must be recognised and their authority to control empowered, and that Indigenous data governance comprises both stewardship and the processes implementing that control. VGGT requires respect for communal, indigenous, customary and informal tenure. This is a distinct authority shape: consent is given by a governance process, is often non-transferable, and may persist even where a third party physically holds the object.",
