    "name": "Ownership / Stewardship",
    "entry_kind": "mixin",
    "purpose": "Provide the reusable control facet that can be attached to any meta-object so that an agent can determine who holds it, who may lawfully act for the holder, under what basis and constraints, and how control moved or will move — independently of what the object itself is.",
    "scope_statement": "This model records assertions of control over a referenced meta-object: the binding of one or more parties to that object in a named control modality (legal title, beneficial interest, custody, administrative controllership, or de-facto technical control), the fractions and co-holding rules that partition it, the encumbrances and holder duties that qualify it, the stewardship and delegated-authority arrangements through which someone other than the holder may act, the substitute or supported decision-making arrangements used where a holder cannot act unaided, and the instruments and events by which control is created, suspended, transferred, succeeded, lapsed or extinguished. It also records the evidentiary basis, assurance and temporal validity of each such assertion, and the governance of the control register itself. It deliberately models control as a time-bounded, source-backed, contestable assertion rather than as a fact, because no register can guarantee that its record matches the underlying legal or physical position.",
    "in_scope": [
      "Binding of holders/controllers to a referenced meta-object, including group and collective holders, in an explicit control modality",
      "Fractional, joint and several holding, share restructuring and co-holder decision rules",
      "Encumbrances, restrictions and holder responsibilities that qualify control without transferring it",
      "Steward, custodian and processor appointments where operation is separated from beneficial holding",
      "Scoped, revocable delegation of control powers, sub-delegation, and the representation-versus-impersonation distinction",
      "Capacity-related arrangements: supported decision-making, substitute decision-making and their mandatory safeguards and review",
      "Transfer instruments, exclusivity of control, conditions precedent, succession, lapse, abandonment and escheat",
      "Chain-of-title reconstruction, competing claims, dispute status and priority ordering",
      "Evidentiary sources, assurance level, staleness and validity intervals of every control assertion",
      "Authority, recording effect, access, audit, retention and interoperability of the control register itself"
    ],
    "out_of_scope": [
      "Identity, attributes and lifecycle of the parties themselves (natural persons, organizations, agents) — held in the person and organization models",
      "Runtime authorization decisions, policy evaluation and enforcement — the access-contract model consumes control records but is not defined here",
      "Substantive intellectual-property rights, licence terms and usage permissions over content, which are rights-in-the-work rather than control-of-the-object",
      "Valuation, price, accounting treatment, tax position and payment settlement of transferred objects",
      "Adjudication procedure for disputed title — only the dispute status and the ingested outcome are held here",
      "Data lineage and derivation history of the object's content, which belong to the provenance model",
      "Physical or logical custody mechanics (storage location, replication, key management) beyond the fact of a custody appointment",
      "Determination of whether any given jurisdiction actually recognises a claimed right; this model records the claimed basis and its evidence, not its legal validity"
    ],
    "boundary_notes": [
      {
        "neighbor": "Person / Organization models",
        "distinction": "This model holds only a reference and a role for each party (holder, steward, delegate, supported person, beneficial owner). Party identity, legal form, capacity determination and existence lifecycle are resolved externally; a control record must not restate them. LADM makes the same split between LA_Party and the RRR that binds it.",
        "source_refs": [
          "SRC-013",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Access / authorization contract model",
        "distinction": "Control answers 'who may grant'; access answers 'who may do what, now'. An ODRL-style Policy names an assigner; this model is what makes an assigner's standing checkable. Permission evaluation, obligations discharge and enforcement stay in the access model.",
        "source_refs": [
          "SRC-004",
          "SRC-001"
        ]
      },
      {
        "neighbor": "Provenance / lineage model",
        "distinction": "PROV attribution and delegation describe responsibility for entities and activities. This model reuses that shape for who acts for whom, but its subject is a standing control relation with validity intervals, not a past activity trace. Where both exist, the control record is the assertion and the provenance record is its trace.",
        "source_refs": [
          "SRC-003",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Rights and licensing (IPR) model",
        "distinction": "dcterms:rightsHolder conflates owning and managing rights over a resource. This model separates control of the meta-object from rights in the work it represents: a custodian may control a record without holding any IP right in its content, and a rights holder may hold no control record.",
        "source_refs": [
          "SRC-012",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Audit / evidence log model",
        "distinction": "Every write to, and privileged read of, a control record is an auditable event, but the audit trail itself is a separate append-only model. This model declares what must be logged and by whom, not the log's own structure.",
        "source_refs": [
          "SRC-009",
          "SRC-018"
        ]
      },
      {
        "neighbor": "Identity credential / key management model",
        "distinction": "Cryptographic control (a verification method authorized for capabilityInvocation) is evidence of control, not the control record. Key rotation is not a transfer of ownership; conflating them makes an operator into an owner. The controlled-identifier document is an artifact this model cites, not one it owns.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Dispute resolution / courts model",
        "distinction": "This model carries a dispute flag, the competing claims and the ingested outcome reference. Procedure, evidence weighing and remedies belong to the dispute model; a control record must never encode an adjudication.",
        "source_refs": [
          "SRC-010",
          "SRC-013"
        ]
      }
    ]
