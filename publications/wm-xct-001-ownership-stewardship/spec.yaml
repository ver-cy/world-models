      {
        "id": "holding",
        "name": "Holding, Shares and Encumbrances",
        "description": "Who holds the object, in what proportions and under which co-holder decision rules, what encumbers the holding, and what duties the holding carries.",
        "rationale": "LADM's party / RRR / basic-administrative-unit pattern with an explicit Fraction class, together with the AMLR legal-versus-beneficial distinction and CARE's collective Authority to Control, establish that the holder side is not a single party field but a structured set of parties, proportions, restrictions and responsibilities.",
        "source_refs": [
          "SRC-013",
          "SRC-009",
          "SRC-014",
          "SRC-004"
        ],
        "layers": [
          {
            "id": "holder-identification",
            "name": "Holder Identification",
            "description": "Binding parties to the object in holder roles, including group and collective holders, and separating the party of record from the party who actually benefits.",
            "source_refs": [
              "SRC-013",
              "SRC-009",
              "SRC-014"
            ],
            "findings": [
              {
                "id": "holder-party-binding",
                "name": "Holder party binding",
                "description": "The holder side is a set of party references with declared roles, resolved against the person and organization models. LADM distinguishes an individual party from a group party with members, which is what allows a community, a household, a partnership or an unincorporated body to hold without being forced into a legal-person shape. The binding carries a role and a validity interval, not the party's attributes.",
                "source_refs": [
                  "SRC-013",
                  "SRC-014",
                  "SRC-015",
                  "SRC-003"
                ],
                "questions": [
                  {
                    "id": "q-holder-who",
                    "text": "Which parties are bound as holders of this object, and in which role does each stand?",
                    "kind": "ownership",
                    "answer_data": [
                      "party references",
                      "holder role per party (sole | co-holder | nominee | trustee | representative)",
                      "validity interval per binding"
                    ]
                  },
                  {
                    "id": "q-holder-group",
