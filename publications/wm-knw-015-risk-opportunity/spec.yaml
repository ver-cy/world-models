  "functions": [
    {
      "id": "fn-register-item",
      "name": "Register risk or opportunity item",
      "description": "Admit a new item to a register scope with its statement, valence, definition scheme, objective reference and provenance, minting identity under the identity priority rule.",
      "inputs": [
        "risk source, event and consequence statement",
        "affected objective reference",
        "valence and definition scheme codes",
        "register scope and asserting agent"
      ],
      "outputs": [
        "registered item with identity and revision 1",
        "registration provenance record"
      ],
      "preconditions": [
        "minimum registration set is complete",
        "register scope and applicable criteria set are declared",
        "boundary tests exclude an issue, incident, threat or observation being registered as an item"
      ],
      "effects": [
        "mints or adopts the item identifier per identity priority",
        "sets lifecycle state to identified with effective and record times",
        "does not create treatment actions, controls or evidence records"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-011",
        "SRC-006"
      ]
    },
    {
      "id": "fn-classify-item",
      "name": "Classify item against a scheme",
      "description": "Assign coded categories from one or more published, versioned classification schemes and retain superseded assignments.",
      "inputs": [
        "item reference",
        "scheme identifier and version",
        "category code and assigning role"
      ],
      "outputs": [
        "category assignment with scheme version",
        "superseded assignment history"
      ],
      "preconditions": [
        "scheme is published and in force for the register scope",
        "code exists in the cited scheme version"
      ],
      "effects": [
        "adds the coded assignment with provenance",
        "retains prior assignments rather than overwriting them",
        "does not alter estimates, level or state"
      ],
      "source_refs": [
        "SRC-014",
        "SRC-005",
        "SRC-003"
      ]
    },
    {
      "id": "fn-estimate-likelihood-consequence",
      "name": "Estimate likelihood and consequence",
      "description": "Produce a new assessment revision holding likelihood and consequence values with their scales, horizon, technique, assumptions, evidence references and confidence.",
      "inputs": [
        "item reference",
        "technique reference and parameters",
        "scale references and horizon",
        "evidence and input source references"
      ],
      "outputs": [
        "assessment revision with likelihood and consequence values",
        "confidence statement and assumption list"
      ],
      "preconditions": [
        "scales, horizon and case basis are declared",
        "technique is identified and applicable",
        "input evidence references resolve in their owning models"
      ],
      "effects": [
        "creates a new revision and never overwrites a prior revision",
        "records observation time separately from record time",
        "does not create or modify the evidence records it references"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-007",
        "SRC-005",
        "SRC-011"
      ]
    },
    {
      "id": "fn-evaluate-against-criteria",
      "name": "Evaluate against criteria and appetite",
      "description": "Derive the level of risk from the current revision using the declared combination rule and compare it with criteria thresholds and the referenced appetite or tolerance statement.",
      "inputs": [
        "assessment revision",
        "criteria set identifier and version",
        "appetite or tolerance statement reference"
      ],
      "outputs": [
        "level of risk and priority candidate",
        "evaluation outcome with timestamp",
        "escalation flag where outside appetite"
      ],
      "preconditions": [
        "criteria version is in force for the item's scope",
        "combination rule and its validity limits are documented",
        "values conform to the declared scales"
      ],
      "effects": [
        "records the outcome and the thresholds compared against",
        "flags items outside appetite for escalation",
        "does not approve, accept or enforce any disposition"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-006",
        "SRC-010"
      ]
    },
    {
      "id": "fn-record-response-decision",
      "name": "Record response decision",
      "description": "Record the response option selected from the governed option set together with its rationale, cost estimate and the authorising decision reference.",
      "inputs": [
        "item reference",
        "response option code and option set version",
        "rationale, cost and authority level",
        "authorising decision reference"
      ],
      "outputs": [
        "response record on the item"
      ],
      "preconditions": [
        "an evaluation outcome exists for the current revision",
        "the option belongs to the governed option set",
        "the decision reference resolves in the decision model"
      ],
      "effects": [
        "records the selected option and its authorising reference",
        "does not execute treatment, grant authority or enforce acceptance"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-006",
        "SRC-011"
      ]
    },
    {
      "id": "fn-bind-treatment-control-references",
      "name": "Bind treatment and control references",
      "description": "Attach references to planned actions, existing controls and mitigating factors, with expected post-treatment effect and deadline.",
      "inputs": [
        "item reference",
        "action and control references",
        "expected post-treatment values",
        "deadline and tracking role"
      ],
      "outputs": [
        "treatment and control linkage set",
        "risk treatment plan revision"
      ],
      "preconditions": [
        "referenced actions and controls exist in their owning models",
        "the selected response option supports the linkage type"
      ],
      "effects": [
        "stores references, expected effect and deadline",
        "leaves execution, scheduling and control assurance with the owning models",
        "does not assert a control effectiveness opinion of its own"
      ],
      "source_refs": [
        "SRC-011",
        "SRC-005",
        "SRC-006"
      ]
    },
    {
      "id": "fn-transition-lifecycle-state",
      "name": "Transition lifecycle state",
      "description": "Move an item to a permitted target state, recording the trigger, effective time and record time, and appending the transition to the review log.",
      "inputs": [
        "item reference",
        "target state and trigger",
        "effective time and acting role"
      ],
      "outputs": [
        "state transition record",
        "updated lifecycle state"
      ],
      "preconditions": [
        "the transition is permitted by the declared state model",
        "mandatory fields for the target state are present and valid",
        "reopen of a closed item carries an authorising role"
      ],
      "effects": [
        "updates state with effective and record times",
        "appends an immutable transition entry to the review log",
        "freezes closed items against value edits except via reopen"
      ],
      "source_refs": [
        "SRC-011",
        "SRC-005",
        "SRC-006"
      ]
    },
    {
      "id": "fn-record-review-outcome",
      "name": "Record review outcome",
      "description": "Append an immutable review log entry capturing reviewer, changes, trend and next review date, following a scheduled cadence or a trigger event.",
      "inputs": [
        "item reference",
        "reviewer identity and review timestamp",
        "observed changes, trend and indicator readings"
      ],
      "outputs": [
        "serial review log entry",
        "updated next review due date"
      ],
      "preconditions": [
        "cadence is due or a documented trigger has fired",
        "the item is not in a terminal state unless the review concerns closure"
      ],
      "effects": [
        "appends an immutable, sequence-numbered log entry",
        "sets the next review due date",
        "may invoke re-estimation but does not itself change estimates"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-011",
        "SRC-006"
      ]
    },
    {
      "id": "fn-hand-off-realised-item",
      "name": "Hand off realised item",
      "description": "Mark the item realised when the uncertain event occurs, record the occurrence time and the receiving incident, loss-event or benefit record, and move the item to closure.",
      "inputs": [
        "item reference",
        "event occurrence time and detection source",
        "receiving record reference"
      ],
      "outputs": [
        "realisation record",
        "closure record with reason and authority"
      ],
      "preconditions": [
        "occurrence is evidenced by a resolvable detection source",
        "the receiving model has accepted ownership of the materialised event"
      ],
      "effects": [
        "sets realisation status and hand-off reference",
        "closes the item with a permitted reason",
        "does not manage, investigate or quantify the materialised event"
      ],
      "source_refs": [
        "SRC-014",
        "SRC-011",
        "SRC-005"
      ]
    },
    {
      "id": "fn-compile-register-view",
      "name": "Compile register view or snapshot",
      "description": "Produce a register view for a scope and as-of time, or an immutable snapshot and audience-specific reporting extract derived from it.",
      "inputs": [
        "register scope and as-of time",
        "membership and audience filters",
        "sensitivity and redaction rules"
      ],
      "outputs": [
        "register view",
        "immutable snapshot with content hash",
        "redacted reporting extract"
      ],
      "preconditions": [
        "member items pass validation",
        "aggregation eligibility is satisfied for any roll-up presented",
        "audience release rules are declared"
      ],
      "effects": [
        "produces read-only projections that never recompute item values",
        "assigns snapshot and extract sequence identifiers",
        "does not perform analytics, dashboards or reporting distribution"
      ],
      "source_refs": [
        "SRC-009",
        "SRC-006",
        "SRC-005"
      ]
    },
    {
      "id": "fn-validate-record",
      "name": "Validate item or register record",
      "description": "Apply the published validation ruleset to check mandatory fields, scale conformance, duplicates and staleness, and emit a defect list.",
      "inputs": [
        "item or register reference",
        "validation ruleset version"
      ],
      "outputs": [
        "validation report with outcome and defect list"
      ],
      "preconditions": [
        "the ruleset version is published and applicable to the scope"
      ],
      "effects": [
        "flags incomplete, stale, duplicate and non-conforming records",
        "blocks state transitions or exchanges where a blocking defect exists",
        "never silently amends recorded values"
      ],
      "source_refs": [
        "SRC-006",
        "SRC-011",
        "SRC-005"
      ]
    },
    {
      "id": "fn-emit-alignment-projection",
      "name": "Emit alignment projection",
      "description": "Project selected items into an external schema or vocabulary using a published crosswalk and record the losses incurred.",
      "inputs": [
        "item set",
        "target schema identifier and version",
        "crosswalk reference"
      ],
      "outputs": [
        "projected representation for the target schema",
        "mapping loss report"
      ],
      "preconditions": [
        "a published crosswalk exists for the target version",
        "conflicting definitions affecting the projection are recorded"
      ],
      "effects": [
        "emits the mapped representation with a loss report",
        "records approximations such as beneficial items forced into threat-only structures",
        "asserts no conformance claim unless cited conformance evidence exists"
      ],
      "source_refs": [
        "SRC-011",
        "SRC-008",
        "SRC-002",
        "SRC-014"
      ]
    }
  ],
  "composition": [
    {
      "target": "WM-ACT-017",
      "relation": "CHILD",
      "purpose": "Register the model beneath its parent action and objective plane: objectives affected, treatment actions and the management activity that owns execution live in the parent, while this model owns only the uncertainty record that references them.",
      "required": true,
      "source_refs": [
        "SRC-005",
        "SRC-001"
      ]
    },
    {
      "target": "WM-AI-008 (AI governance assessment)",
      "relation": "REFERENCE",
      "purpose": "Carry a back-reference and context binding when an AI governance assessment cites items here as risk evidence. The assessment's own lifecycle, residual-risk acceptability determination, conformity assessment and enforcement remain entirely in WM-AI-008 and with the competent authority.",
      "required": false,
      "source_refs": [
        "SRC-013",
        "SRC-011"
      ]
    },
    {
      "target": "Threat and hazard catalogue model (sibling; identifier not yet assigned in the registry)",
      "relation": "REFERENCE",
      "purpose": "Reference threat or hazard entries by identifier, following the OSCAL threat-id pattern, without maintaining catalogues, intelligence or hazard characterisation locally.",
      "required": false,
      "source_refs": [
        "SRC-011",
        "SRC-008"
      ]
    },
    {
      "target": "Control and safeguard model (sibling; identifier not yet assigned in the registry)",
      "relation": "REFERENCE",
      "purpose": "Reference controls and mitigating factors relied upon in a given framing and carry effectiveness evidence references; control design, testing and assurance opinions stay in the control model.",
      "required": false,
      "source_refs": [
        "SRC-011",
        "SRC-005"
      ]
    },
    {
      "target": "Incident and loss-event model (sibling; identifier not yet assigned in the registry)",
      "relation": "REFERENCE",
      "purpose": "Hand off ownership when the uncertain event materialises, carrying only the realisation flag, occurrence time and the receiving record reference.",
      "required": false,
      "source_refs": [
        "SRC-014",
        "SRC-005"
      ]
    },
    {
      "target": "Observation and evidence model (sibling; identifier not yet assigned in the registry)",
      "relation": "REFERENCE",
      "purpose": "Reference supporting observations and evidence with digest and relevance note, mirroring OSCAL related-observations; capture, custody and evidence lifecycle are not owned here.",
      "required": false,
      "source_refs": [
        "SRC-011"
      ]
    },
    {
      "target": "Party, role and organisation model (sibling; identifier not yet assigned in the registry)",
      "relation": "REFERENCE",
      "purpose": "Resolve risk owners, assessors, reviewers and accepting authorities as party references rather than storing identity data locally.",
      "required": true,
      "source_refs": [
        "SRC-005",
        "SRC-012"
      ]
    },
    {
      "target": "Decision and delegated-authority model (sibling; identifier not yet assigned in the registry)",
      "relation": "REFERENCE",
      "purpose": "Carry the authorising decision reference and the authority level asserted at the time; delegation schemes, approval workflow and enforcement remain external.",
      "required": false,
      "source_refs": [
        "SRC-005",
        "SRC-010"
      ]
    },
    {
      "target": "Quantity, unit and currency model (sibling; identifier not yet assigned in the registry)",
      "relation": "REFERENCE",
      "purpose": "Type monetary and physical consequence magnitudes with governed unit and currency codes and valuation basis dates instead of defining measurement systems locally.",
      "required": false,
      "source_refs": [
        "SRC-007",
        "SRC-014"
      ]
    },
    {
      "target": "Versioned classification scheme and code-list mixin (sibling; identifier not yet assigned in the registry)",
      "relation": "MIX-IN",
      "purpose": "Reuse generic code-list semantics — scheme identity, version, effective dating, retirement and crosswalks — for risk taxonomies rather than reimplementing scheme governance in this model.",
      "required": false,
      "source_refs": [
        "SRC-014",
        "SRC-003"
      ]
    },
    {
      "target": "W3C PROV-O (http://www.w3.org/ns/prov#)",
      "relation": "ALIGN",
      "purpose": "Align assertion provenance to Entity, Activity and Agent with wasAttributedTo, wasDerivedFrom, wasGeneratedBy and actedOnBehalfOf, so that provenance is exchangeable without importing a separate provenance lifecycle.",
      "required": false,
      "source_refs": [
        "SRC-012"
      ]
    },
    {
      "target": "NIST OSCAL Assessment Results risk structure (OSCAL v1.2.3)",
      "relation": "ALIGN",
      "purpose": "Map item fields to the OSCAL risk object for exchange, recording known losses — notably the absence of an opportunity valence and the threat-oriented status vocabulary.",
      "required": false,
      "source_refs": [
        "SRC-011",
        "SRC-008"
      ]
    },
    {
      "target": "NIST IR 8286 risk register and risk detail record structures",
      "relation": "ALIGN",
      "purpose": "Map register membership, exposure and priority to the published register and detail-record structures for enterprise roll-up, without adopting the enterprise risk management process itself.",
      "required": false,
      "source_refs": [
        "SRC-006",
        "SRC-007",
        "SRC-009"
      ]
    },
    {
      "target": "IEC 31010:2019 risk assessment technique catalogue",
      "relation": "ALIGN",
      "purpose": "Identify assessment techniques by reference to a published catalogue so that technique definitions, applicability and limitations are cited rather than restated locally.",
      "required": false,
      "source_refs": [
        "SRC-004"
      ]
    }
