  "structure": {
    "bundles": [
      {
        "id": "b-semantic-core",
        "name": "Semantic core: concept, articulation and identity",
        "description": "What a risk or opportunity item is, how it is stated, how it is distinguished from adjacent concepts, and how it is identified and kept continuous across revisions.",
        "rationale": "Every downstream operation depends on a stable answer to what the record asserts and which real thing it denotes; competing standard definitions make this the first place a model fails.",
        "source_refs": [
          "SRC-001",
          "SRC-005",
          "SRC-008",
          "SRC-011"
        ],
        "layers": [
          {
            "id": "l-concept-articulation",
            "name": "Concept and articulation",
            "description": "The definitional binding of the item, the source-event-consequence articulation, and the tests that keep non-risks out of the register.",
            "source_refs": [
              "SRC-001",
              "SRC-005",
              "SRC-008"
            ],
            "findings": [
              {
                "id": "f-concept-frame",
                "name": "Definitional frame and objective linkage",
                "description": "An item is a recorded assertion that an uncertain event or condition, if it occurs, would have an effect on stated objectives; the governing definition (neutral effect-on-objectives versus adverse likelihood-and-impact) must be declared because authoritative sources disagree.",
                "source_refs": [
                  "SRC-001",
                  "SRC-005",
                  "SRC-008",
                  "SRC-003"
                ],
                "questions": [
                  {
                    "id": "q-concept-definition-scheme",
                    "text": "Under which definitional scheme was this item recorded — neutral effect of uncertainty on objectives, or adverse-only likelihood and impact?",
                    "kind": "definition",
                    "answer_data": [
                      "definition scheme code",
                      "cited standard and clause",
                      "scheme version"
                    ]
                  },
                  {
                    "id": "q-concept-objective-link",
                    "text": "Which stated objective or outcome does this item's uncertainty act upon?",
                    "kind": "relationship",
                    "answer_data": [
                      "objective reference identifier",
                      "objective owner reference",
                      "direction of effect on the objective"
                    ]
                  },
                  {
                    "id": "q-concept-uncertainty-basis",
                    "text": "What makes this item uncertain rather than a known present condition?",
                    "kind": "state",
                    "answer_data": [
                      "uncertainty basis statement",
                      "occurrence status at assertion time",
                      "distinguishing test applied"
                    ]
                  },
                  {
                    "id": "q-concept-minimum-set",
                    "text": "What minimum content must be present before the item may be registered at all?",
                    "kind": "requirement",
                    "answer_data": [
                      "mandatory field list",
                      "registration gate rule",
                      "authority for the gate"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-definition-scheme",
                    "name": "Definition scheme",
                    "description": "Coded declaration of the risk definition under which the item was recorded, with the standard reference it derives from.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-008",
                      "SRC-001"
                    ]
                  },
                  {
                    "id": "de-objective-ref",
                    "name": "Affected objective reference",
                    "description": "Reference to one or more objectives in the owning objective or activity model that the uncertainty acts upon.",
                    "value_kind": "reference",
                    "cardinality": "1..n",
                    "required": true,
                    "source_refs": [
                      "SRC-005",
                      "SRC-001"
                    ]
                  },
                  {
                    "id": "de-uncertainty-basis",
                    "name": "Uncertainty basis",
                    "description": "Short statement of why occurrence is uncertain, used to distinguish an open item from a materialised condition.",
                    "value_kind": "text",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-005",
                      "SRC-011"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "The definitional frame is a set of inline coded fields and references carried on every item record; it produces no separate document, and materialising it as an artifact would duplicate the objective and standard records owned elsewhere."
              },
              {
                "id": "f-scenario-articulation",
                "name": "Scenario articulation: source, event, consequence",
                "description": "The item is stated as a chain of risk source or cause, an uncertain event, and the consequence on the exposed object, at a granularity that keeps items separable and assessable.",
