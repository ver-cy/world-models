    "model_id": "WM-KNW-015",
    "name": "Risk / Opportunity",
    "entry_kind": "entity",
    "purpose": "Govern the identified risk or opportunity as a persistent, identified record of an uncertain future event or condition whose occurrence would affect stated objectives, carrying its articulation, classification, likelihood and consequence estimates, evaluation against criteria, response decision, lifecycle state, ownership and provenance.",
    "scope_statement": "This model covers the registered uncertainty item itself: how it is defined, identified, articulated as a source-event-consequence scenario, classified against versioned schemes, estimated for likelihood and consequence over a declared horizon, evaluated against risk criteria and an appetite or tolerance reference, assigned a response option, linked by reference to treatment actions and controls, moved through lifecycle states to realisation or closure, owned, provenanced, aggregated into registers and snapshots, validated, protected and projected into external schemas. It is deliberately symmetric: adverse (threat) and beneficial (opportunity) items share one identity, criteria and lifecycle machinery, with valence recorded as a coded field. It does not perform, execute or enforce anything: treatment execution, control assurance, incident handling, objective setting, decision authority, evidence capture, audit trails and retention execution belong to referenced sibling models or the adopting Dimension. The model is storage- and interface-neutral; register tables, documents, graphs and message payloads are projections of the same semantics.",
    "in_scope": [
      "The identified risk or opportunity item as a governed record, threat-side and opportunity-side under one identity",
      "Scenario articulation: risk source or cause, uncertain event, consequence, and the exposed object",
      "Boundary tests separating an item from an issue, incident, hazard, control deficiency or assumption",
      "Classification against versioned schemes plus valence and inherent/current/residual/target framing",
      "Likelihood and consequence estimates with declared scales, units, horizon and conditionality",
      "Level of risk, combination rule, aggregation limits, evaluation outcome and priority candidate",
      "Assessment technique, assumptions, inputs, confidence and references to supporting evidence",
      "Response option selection and referenced treatment actions, controls and mitigating factors",
      "Lifecycle states, review cadence and triggers, realisation hand-off and closure outcomes",
      "Ownership, acceptance and escalation authority references, and assertion provenance",
      "Register membership, point-in-time snapshots and reporting extracts as artifacts",
      "Validation rules, sensitivity classification, and alignment or crosswalk records with recorded conflicts"
    ],
    "out_of_scope": [
      "Execution, scheduling and change control of treatment actions and projects",
      "Control design, testing, effectiveness assurance and audit opinions",
      "Incident, issue and loss-event handling, investigation and post-event response",
      "Objective, strategy and target setting, and performance measurement of objectives",
      "Threat intelligence, hazard catalogues and vulnerability management",
      "Capture and lifecycle of observations and evidence records, including chain of custody",
      "Setting enterprise risk appetite and tolerance statements (referenced, not authored here)",
      "Delegated authority schemes, approval workflow engines and runtime policy evaluation or enforcement",
      "Platform audit-trail creation and retention or erasure execution, including legal hold mechanics",
      "AI-system conformity assessment, high-risk classification and regulatory enforcement",
      "Insurance contracts, actuarial pricing, risk transfer instruments and regulatory capital calculation",
      "Dashboards, business intelligence and board reporting cadence built on register extracts"
    ],
    "boundary_notes": [
      {
        "neighbor": "Incident / loss-event record (sibling model)",
        "distinction": "An item ceases to be a risk when the uncertain event occurs. The materialised event, its measured losses and its response are owned by the incident or loss-event model; this model retains only the realisation flag, the event time and a reference.",
        "source_refs": [
          "SRC-014",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Threat or hazard catalogue (sibling model)",
        "distinction": "Threats and hazards are reusable catalogue entries referenced by identifier, mirroring the OSCAL threat-id pattern. This model neither maintains threat taxonomies nor produces intelligence.",
        "source_refs": [
          "SRC-011",
          "SRC-008"
        ]
      },
      {
        "neighbor": "Control / safeguard model (sibling model)",
        "distinction": "Controls and mitigating factors are referenced with an effectiveness input recorded as evidence. Control design, testing and assurance opinions remain in the control model.",
        "source_refs": [
          "SRC-011",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Observation / evidence record (sibling model)",
        "distinction": "Supporting observations are referenced, following the OSCAL related-observations pattern. Evidence capture, custody and lifecycle are not owned here; only reference, digest and relevance note are held.",
        "source_refs": [
          "SRC-011"
        ]
      },
      {
        "neighbor": "Objective / outcome model (parent WM-ACT-017 plane)",
        "distinction": "Risk is defined as an effect of uncertainty on objectives, so objectives are referenced, never authored here. Objective definition, targets and performance reporting stay with the parent action or objective model.",
        "source_refs": [
          "SRC-005",
          "SRC-001"
        ]
      },
      {
        "neighbor": "WM-AI-008 AI governance assessment",
        "distinction": "An AI governance assessment references items here as risk evidence. The AI-specific risk-management-system obligation, residual-risk acceptability determination, conformity assessment and enforcement remain with that model and the competent authority.",
        "source_refs": [
          "SRC-013",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Decision and delegated-authority model (sibling model)",
        "distinction": "Acceptance, escalation and closure decisions are carried as decision references with the authority level asserted at the time. Delegation schemes, approval workflow and enforcement are not modelled here.",
        "source_refs": [
          "SRC-005",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Enterprise reporting and analytics platform",
        "distinction": "Register snapshots and reporting extracts are defined as immutable artifacts of this model; dashboards, roll-up analytics and reporting cadence belong to the adopting Dimension.",
        "source_refs": [
          "SRC-005",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Insurance, risk transfer and capital models",
        "distinction": "Only the sharing or transfer response option and its contract reference are recorded. Pricing, capital requirement calculation and loss-distribution modelling for capital are excluded.",
        "source_refs": [
          "SRC-014"
        ]
      },
      {
        "neighbor": "Platform audit trail and access enforcement",
        "distinction": "This model states what must be auditable and what sensitivity applies, but does not create, hold or enforce audit records or access decisions.",
        "source_refs": [
          "SRC-011",
          "SRC-005"
        ]
      }
    ]
