  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "Name one accountable owner package for each register namespace and record it in AGENTS.md, including which system of record holds authoritative item identifiers.",
        "Publish and version the criteria sets, likelihood and consequence scales, combination rule and response option set in force, with effective dates; items may not be evaluated against unpublished criteria.",
        "Declare the classification schemes and versions in force for the namespace, and publish crosswalks before retiring any scheme version.",
        "Declare the appetite or tolerance statements that items reference, their approving body and their version, acknowledging that the statements themselves are authored outside this model.",
        "Declare the retention classes, sensitivity classification scheme and audience release rules that apply to items, snapshots and extracts."
      ],
      "namespace_guidance": "Use one stable namespace per register scope, for example dim.<dimension>.risk.<register-scope>, with opaque identifiers inside it. Identifiers must not encode dates, owners, category codes, valence, severity or sensitivity, because every one of those attributes changes independently of item identity. Scheme, scale and criteria namespaces are separate from item namespaces so that a criteria version can be retired without touching item identity.",
      "registry_links": [
        "Vercy registry entry vr.wm-knw-015 (WM-KNW-015 Risk / Opportunity), nav path NAV.INF.KNW.RSK",
        "Parent registry entry WM-ACT-017 for objectives and treatment actions",
        "Referencing model WM-AI-008 for AI governance assessments that cite items as risk evidence",
        "External alignment registries: OSCAL assessment-results (v1.2.3), NIST IR 8286 register and detail-record schemas, ISO 31073 vocabulary, Basel Framework OPE taxonomy"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Canonical form orders fields deterministically, trims and NFC-normalises text, and renders every reference as a triple of target model, namespace and identifier.",
        "Coded values are canonicalised as scheme identifier plus version plus code; a bare code without its scheme version is not canonical.",
        "Quantities are canonicalised as value plus unit or ISO currency code plus valuation basis date; ordinal band labels carry their scale identifier and version and are never converted to numbers during canonicalisation.",
        "All time values are canonicalised to RFC 3339 date-time with seconds and an explicit offset or Z, with event, observation and record times kept as distinct fields."
      ],
      "patch_rules": [
        "Patches address the immutable item identity; the item identifier, its registration provenance and all prior revisions are never rewritten by a patch.",
        "Changes to likelihood, consequence, technique, assumptions or confidence are applied by creating a new assessment revision, not by editing values in place.",
        "Lifecycle, ownership and classification changes are applied as effective-dated patches carrying both effective time and record time plus the asserting agent.",
        "Review log entries, snapshots and closure records are append-only; a correction is issued as a new entry that cites the entry it supersedes.",
        "Concurrent conflicting patches resolve in favour of the authoritative master system of record; where none exists, the patch with the earlier observation time is retained and the other is recorded as a conflict for review."
      ],
      "compatibility_rules": [
        "Adding optional fields, new codes to an open code list, or a new alignment target is a minor, backward-compatible change.",
        "Changing the meaning of a scale band, the combination rule, a threshold, a valence code or a lifecycle state is a breaking change requiring a new criteria or model version and a stated migration for existing items.",
        "Retired codes and scheme versions are never reused; historical items keep the version they were assessed under.",
        "Projections into external schemas must be regenerated when either this model's version or the target schema version changes, and the loss report reissued with them."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier issued by the system of record for the register — for example the risk register entry key held by the owning enterprise risk or assessment system — is always preferred where such a system exists.",
        "A governed global identifier or IRI from a published namespace, such as an OSCAL uuid or a Dimension-published IRI, where no master-system key exists.",
        "A UUID or ULID minted by the adopting Dimension, recorded with its minting authority and time, as the last resort.",
        "A date, title, category code, owner name, severity band or file name is never an identifier; such values may only be metadata carried alongside the identifier."
      ],
