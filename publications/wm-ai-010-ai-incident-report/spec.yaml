    "name": "AI Incident Report",
    "entry_kind": "aggregate",
    "purpose": "Represent one governed, versioned AI incident reporting case that makes facts, timeline, affected systems, classification, impact, causal assessments, response, obligations, submissions and corrections machine-readable without absorbing the incident or authority masters.",
    "scope_statement": "Owns report-case identity, version and status; issuer, jurisdiction, legal basis, recipient and reportability assertions; incident, affected-system and party bindings; facts, timeline, context, classification, severity, impact, harm, causal, security and privacy assessments; response and remediation summaries; notification duties, deadlines, submissions, receipts and authority exchanges; approval, confidentiality, communication, evidence, correction, retention, audit and projections. Incident, AI system, model, deployment, investigation, regulatory case, remediation work, harm, vulnerability, evidence, audit and records masters remain external.",
    "in_scope": [
      "Report identity, version, jurisdiction, legal basis, recipient, affected systems, responsible parties, facts, timeline, context, classification, severity, impact and causal assessments",
      "Security and privacy links, response and remediation summaries, obligations, deadlines, submissions, receipts, authority exchanges, disclosure, lifecycle, evidence, retention, audit and projections"
    ],
    "out_of_scope": [
      "Owning the incident, affected AI system, model, deployment, person, organization, harm, investigation, regulatory case, remediation action, vulnerability, evidence, audit or records masters",
      "Treating report receipt, mitigation deployment, system recovery or closure as proof of causality, acceptance, effectiveness, compliance or absence of harm",
      "Autonomous legal classification, regulatory submission, public disclosure, liability admission, attribution, access expansion, evidence destruction or closure"
    ],
