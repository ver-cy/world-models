  "model": {
    "registry_id": "vr.wm-act-027",
    "model_id": "WM-ACT-027",
    "name": "Communication Interaction",
    "entry_kind": "aggregate",
    "purpose": "Provide the format-neutral context an agent needs to open, conduct, evidence, classify, correlate and close a communication interaction - a bounded exchange of contact turns between identified parties across one or more channels - with its participant roster, channel and endpoint bindings, turn content, delivery evidence, lifecycle state, outcome and governance references.",
    "scope_statement": "WM-ACT-027 models the interaction record as an aggregate: an interaction root carrying identity, classification, participants-in-role, channel and endpoint bindings, ordered turns with content and attachments, threading relations, lifecycle and handling state, temporal points and windows, delivery and engagement evidence, outcome/disposition, and typed references to the party, permission, access, retention and audit models that own their own semantics. It stops at transport protocols, party master data, permission evaluation, policy enforcement, audit-trail production and disposition execution. It is storage- and interface-neutral: JSON, YAML, Markdown, HTML, Git, MCP and MongoDB are projections of these semantics, not their definition.",
    "in_scope": [
      "The interaction as a unit of account: what opens one, what continues it across a channel switch, what closes it",
      "Interaction identity, correlation keys and cross-channel identifier resolution",
      "Participants in roles (initiator, addressee, copied, observer, handler) as references into an external party model",
      "Channel classification, channel capability constraints, and endpoint/address bindings including proxy-address pairs",
      "Direction (inbound, outbound, internal) and initiation attribution",
      "Ordered turns with authorship, sequence, content references and attachments",
      "Threading, reply and relation structure between turns and between interactions",
      "Lifecycle and handling state, assignment of handling responsibility, and state-change reasons",
      "Interaction time points, periods and channel engagement windows/timers",
      "Delivery, receipt, read and engagement evidence attached to turns",
      "Capture provenance: which system observed or authored the record and how faithfully",
      "Outcome, resolution and wrap-up disposition of the interaction",
      "Confidentiality/visibility classification and redaction markers carried on the record",
      "References to permission basis, retention class, access policy and audit records owned by sibling models",
      "Alignment bindings to external interaction schemas and vocabularies"
    ],
    "out_of_scope": [
      "Party, organisation and person master data and their identity lifecycle (owned by the party model)",
      "The canonical contact-point/electronic-address registry and address verification",
      "Permission and consent capture, evaluation and withdrawal semantics (this model carries only a reference to the decision)",
      "Runtime access-control evaluation and enforcement (this model carries classification markers only)",
      "Audit-trail creation, immutability guarantees and audit query semantics",
      "Execution of deletion, anonymisation or disposition (this model carries the class and a tombstone marker only)",
      "Transport and signalling protocol behaviour (SIP/IMS sessions, SMTP relay, SMS submission, charging/CDR production)",
      "Case, ticket, order or service-request lifecycle (referenced, not reproduced)",
      "Campaign, journey and outbound orchestration logic",
      "Bot/NLU intent model training, ranking and dialogue policy",
      "Media file storage, transcoding and CDN delivery",
      "Workforce management, agent scheduling and staffing forecasts",
      "Billing, rating and settlement for communication traffic"
    ],
    "boundary_notes": [
      {
        "neighbor": "Party / party-role model (e.g. TM Forum TMF632/TMF669 pattern)",
        "distinction": "TMF683 carries only relatedParty references with a role; the interaction record must not restate party attributes, party identity resolution or party lifecycle.",
        "source_refs": [
          "SRC-001"
        ]
      },
      {
        "neighbor": "Permission / consent model",
        "distinction": "ePrivacy and 47 CFR 64.1200 place consent capture, validity and revocation with the permission holder; this model records only the reference to a permission decision that was in force at send time, never the evaluation.",
        "source_refs": [
          "SRC-007",
          "SRC-008"
        ]
      },
      {
        "neighbor": "Clinical or business request model (FHIR CommunicationRequest)",
        "distinction": "FHIR separates the planned/ordered communication from the record of one that occurred; WM-ACT-027 covers the occurrence, with the request kept as a basedOn reference.",
        "source_refs": [
          "SRC-002"
        ]
      },
      {
        "neighbor": "Audit / disclosure log (FHIR AuditEvent pattern)",
        "distinction": "FHIR explicitly distinguishes Communication from AuditEvent; system-level disclosure tracking and audit-trail semantics stay in the audit model.",
        "source_refs": [
          "SRC-002"
        ]
      },
      {
        "neighbor": "Transport and protocol layer (RFC 5322 trace fields, Matrix federation, carrier submission)",
        "distinction": "Trace/Received fields and protocol event graphs are informational transport artefacts; this model consumes their identifiers and status outcomes without owning routing or delivery mechanics.",
        "source_refs": [
          "SRC-005",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Records retention and disposition model",
        "distinction": "Sector rules such as MiFID II impose fixed retention on communication records, but the retention schedule and its execution belong to the retention model; this record only binds a retention class and a disposition marker.",
        "source_refs": [
          "SRC-011",
          "SRC-013"
        ]
      },
      {
        "neighbor": "Content / media asset model",
        "distinction": "Attachment bytes, transcoding and storage location are owned by the content model; this model carries attachment references, media type and integrity digests.",
        "source_refs": [
          "SRC-001",
          "SRC-004"
        ]
      }
    ]
