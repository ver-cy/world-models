  "composition": [
    {
      "target": "WM-ACT-018 (parent activity model in NAV.ACT)",
      "relation": "CHILD",
      "purpose": "Registers Communication Interaction as a specialisation of the parent activity concept, inheriting generic activity identity and actor structure rather than restating it.",
      "required": true,
      "source_refs": [
        "SRC-003"
      ]
    },
    {
      "target": "Party and party-role model",
      "relation": "REFERENCE",
      "purpose": "Participants are carried as party references with a role, mirroring the TMF683 relatedParty pattern; party attributes, identity resolution and lifecycle remain with the party model.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-002"
      ]
    },
    {
      "target": "Contact point and electronic address registry model",
      "relation": "REFERENCE",
      "purpose": "Endpoint bindings cite canonical contact points; address verification, reachability and ownership stay in the registry.",
      "required": false,
      "source_refs": [
        "SRC-009",
        "SRC-012"
      ]
    },
    {
      "target": "Channel and channel-capability registry model",
      "relation": "REFERENCE",
      "purpose": "Channel codes and capability constraints are dereferenced from the channel registry so that channel definitions are not duplicated per interaction.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-012"
      ]
    },
    {
      "target": "Permission, consent and preference model",
      "relation": "REFERENCE",
      "purpose": "Carries only a decision reference and point-in-time basis snapshot; capture, evaluation, validity and withdrawal of permission are owned entirely by that model.",
      "required": true,
      "source_refs": [
        "SRC-007",
        "SRC-008",
        "SRC-011"
      ]
    },
    {
      "target": "Case, request or service-order model",
      "relation": "REFERENCE",
      "purpose": "Provides based-on and part-of links so an interaction can be situated in a wider work item without importing that item's lifecycle.",
      "required": false,
      "source_refs": [
        "SRC-002"
      ]
    },
    {
      "target": "Content and media asset model",
      "relation": "REFERENCE",
      "purpose": "Attachment and recording bytes, storage location and transcoding are owned by the content model; this model holds references, media types and digests.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-004"
      ]
    },
    {
      "target": "Records retention and disposition model",
      "relation": "REFERENCE",
      "purpose": "Supplies the retention class, schedule and disposition execution; this model contributes only the trigger time, hold marker and tombstone shape.",
      "required": true,
      "source_refs": [
        "SRC-011",
        "SRC-013"
      ]
    },
    {
      "target": "Access-control and authorization policy model",
      "relation": "REFERENCE",
      "purpose": "Consumes the confidentiality and redaction markers carried here; evaluation and enforcement of access requests are never performed by this model.",
      "required": true,
      "source_refs": [
        "SRC-002",
        "SRC-005"
      ]
    },
    {
      "target": "Audit trail and event log model",
      "relation": "REFERENCE",
      "purpose": "Receives access and change events concerning interaction records; FHIR's explicit Communication-versus-AuditEvent split keeps audit-trail semantics outside this boundary.",
      "required": true,
      "source_refs": [
        "SRC-002"
      ]
    },
    {
      "target": "Identifier and reference mixin",
      "relation": "MIX-IN",
      "purpose": "Supplies the shared pattern for authoritative identifier, alias retention, superseded-by links and correlation keys used across the interaction root, turns and artifacts.",
      "required": true,
      "source_refs": [
        "SRC-004",
        "SRC-009"
      ]
    },
    {
      "target": "Temporal expression pattern (RFC 3339 profile)",
      "relation": "ALIGN",
      "purpose": "Binds all recorded time points to the RFC 3339 profile including seconds, explicit offset and the unknown-offset convention.",
      "required": true,
      "source_refs": [
        "SRC-010"
      ]
    },
    {
      "target": "TM Forum TMF683 Party Interaction resource",
      "relation": "ALIGN",
      "purpose": "Element-level alignment for direction, status, channel, interactionDate, interactionItem, relatedParty, note and interactionRelationship, recorded as alignment with conflicts noted rather than a conformance claim.",
      "required": false,
      "source_refs": [
        "SRC-001"
      ]
    },
    {
      "target": "HL7 FHIR Communication resource",
      "relation": "ALIGN",
      "purpose": "Alignment for status, category, medium, sender, recipient, sent, received, payload, inResponseTo and about in healthcare-facing deployments, without adopting FHIR's clinical context model.",
      "required": false,
      "source_refs": [
        "SRC-002"
      ]
    },
    {
      "target": "W3C Activity Streams 2.0 vocabulary",
      "relation": "ALIGN",
      "purpose": "Alignment for actor, object, target, audience targeting and inReplyTo when interactions are projected into social or federated activity feeds.",
      "required": false,
      "source_refs": [
        "SRC-003"
      ]
    },
    {
      "target": "Interaction analytics and reporting model",
      "relation": "EXTEND",
      "purpose": "Consumes measure definitions and derived durations declared here and extends them into aggregate reporting; aggregation, benchmarking and visualisation are not modelled locally.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-004"
      ]
    }
  ],
  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "The adopting Dimension must designate a single accountable owner for the interaction record population and publish the system of record for each channel it operates",
        "The owner must declare which sibling models supply party, contact point, channel, permission, access, retention and audit semantics before any interaction record is created",
        "The owner must publish the interaction unit-of-account rule, the continuation window per channel and the lifecycle state transition matrix as versioned governed content",
        "The owner must maintain a register of channel capability constraints and engagement window rules for every channel in operation"
      ],
      "namespace_guidance": "Allocate one namespace per adopting Dimension for locally issued interaction and turn identifiers, kept disjoint from channel-native identifier namespaces which are retained only as correlation keys under their issuing authority's namespace. Vocabulary terms for channel, role, outcome, confidentiality and retention class must be qualified by the owning registry's namespace URI and version so that an unqualified code is never stored.",
      "registry_links": [
        "Vercy registry entry vr.wm-act-027 under nav path NAV.ACT.COM, with parent WM-ACT-018",
        "Channel and channel-capability registry of the adopting Dimension",
        "Controlled vocabulary registry for interaction role, category, outcome and confidentiality codes",
        "External alignment registry recording bound schema namespaces and versions for TMF683, FHIR Communication and Activity Streams 2.0"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Serialise interaction records with a deterministic key order and no insignificant whitespace before computing any digest, so that digests are comparable across JSON, YAML and document projections",
        "Normalise all timestamps to the RFC 3339 profile with seconds and an explicit offset before comparison, preserving the originally reported offset as a separate recorded value",
        "Normalise endpoint addresses to their scheme's canonical form before correlation, and retain the as-received form alongside the normalised value",
        "Store vocabulary codes as namespace-qualified pairs of scheme identifier and code, never as bare strings",
        "Order turns by the monotonic sequence index rather than by timestamp, since author-declared time may precede or follow store-received time"
      ],
      "patch_rules": [
        "Patches address the interaction root, a named turn, a participant entry or an evidence entry; a patch must never silently rewrite an appended turn's content",
        "Corrections to already-recorded content are expressed as a replacement turn plus a redaction marker on the original, preserving the superseded record where retention rules require it",
        "Every patch carries the acting party reference, the reason and the observation time; the change history required for accountability is emitted to the audit model rather than accumulated here",
        "Lifecycle status, assignment and classification are the only interaction-root fields that may be updated in place; identity, direction and opening time point are immutable after creation",
        "A patch that would leave a mandatory element unsatisfied is rejected and the record retains its previous validation status"
      ],
      "compatibility_rules": [
        "Adding an optional element, a new vocabulary value or a new alignment binding is a minor change; removing an element, narrowing cardinality or retyping a value is a breaking change requiring a new major version",
        "External alignment bindings are versioned independently of this model, so a target schema upgrade does not force a model version change unless local semantics move",
        "Consumers must tolerate unknown optional elements and unknown vocabulary values, treating the latter as unrecognised rather than invalid",
        "Deprecated elements remain readable for at least one major version with a superseded-by pointer to their replacement"
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier issued by the designated system of record for the interaction, turn or artifact",
        "Governed global identifier or IRI issued by a recognised external authority, such as an RFC 5322 Message-ID, a Matrix event ID or a platform message identifier retained under its issuing namespace",
        "UUID or ULID minted by the adopting Dimension when neither a master-system nor a governed global identifier is available"
      ],
      "timestamp_rule": "All recorded times use RFC 3339 date-time with seconds and an explicit offset, either Z or a signed hh:mm offset; -00:00 is used only where UTC is known but the local offset is not. Event time and observation or ingestion time are recorded as separate values and never substituted for one another: the author-declared time, the transport or store received time, the delivery report time and this model's own observation time each occupy distinct elements, and where only one is known the others are left absent rather than back-filled.",
