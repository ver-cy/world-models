  "functions": [
    {
      "id": "fn-open-interaction",
      "name": "Open Interaction",
      "description": "Create an interaction record with its identity, direction, classification, initial participants and opening time point.",
      "inputs": [
        "Direction code",
        "Initiating participant reference",
        "Channel reference",
        "Interaction reason or category",
        "Opening time point"
      ],
      "outputs": [
        "Interaction record with authoritative identifier",
        "Initial lifecycle status",
        "Observation time stamped per the timestamp rule"
      ],
      "preconditions": [
        "The unit-of-account rule confirms no open interaction should absorb this contact",
        "At least one participant reference resolves in the party model"
      ],
      "effects": [
        "A new interaction root exists in the opened state",
        "Correlation keys are registered for later continuation matching"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-010"
      ]
    },
    {
      "id": "fn-bind-channel-endpoint",
