      "outputs": [
        "Outcome and resolution on the interaction",
        "Wrap-up note artifact reference",
        "Closed lifecycle status"
      ],
      "preconditions": [
        "All turns intended for inclusion have been appended",
        "Outcome vocabulary values are resolvable"
      ],
      "effects": [
        "The interaction reaches a terminal state with an explicit outcome",
        "Retention trigger time is set for the retention model to act on"
