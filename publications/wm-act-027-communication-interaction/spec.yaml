      "source_refs": [
        "SRC-002",
        "SRC-005",
        "SRC-011"
      ]
    },
    {
      "id": "fn-close-interaction-with-outcome",
      "name": "Close Interaction with Outcome",
      "description": "Conclude the interaction by recording its outcome, resolution, follow-up commitments and wrap-up note, distinct from its lifecycle status.",
      "inputs": [
        "Interaction identifier",
        "Outcome code",
        "Resolution statement",
        "Follow-up commitments",
        "Wrap-up note with author and generation method"
