      "inputs": [
        "Participant reference",
        "Channel reference",
        "Participant endpoint address",
        "Service proxy address",
        "Validity start"
      ],
      "outputs": [
        "Endpoint binding entry with validity period",
        "Recorded channel capability constraints"
      ],
      "preconditions": [
        "The participant exists on the interaction",
        "The address is normalised to its scheme's canonical form"
      ],
      "effects": [
        "The binding becomes the effective route for subsequent turns on that channel",
        "Any superseded binding is closed with an end time"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-012"
      ]
    },
    {
      "id": "fn-append-interaction-turn",
      "name": "Append Interaction Turn",
      "description": "Record one turn against the interaction with its author, sequence position, channel binding, time points and content references.",
      "inputs": [
        "Interaction identifier",
        "Author participant reference",
        "Channel binding reference",
        "Content part and attachment references",
        "Authored and received time points"
      ],
      "outputs": [
        "Turn record with identifier and sequence index",
        "Retained channel-native identifiers as correlation keys"
      ],
      "preconditions": [
        "The interaction is in a state that accepts new turns",
        "The content references resolve or a capture gap is recorded"
      ],
      "effects": [
        "The turn is placed in canonical order within the interaction",
        "Derived measures that depend on turn times are marked for recomputation"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-005",
        "SRC-009"
      ]
    },
    {
      "id": "fn-resolve-thread-membership",
      "name": "Resolve Thread Membership",
      "description": "Compute or reconcile the thread a turn belongs to from identifier chains and asserted relations, recording the method used.",
      "inputs": [
        "Turn identifier",
        "Reply and reference identifier chain",
        "Asserted relation, if any",
        "Derivation method version"
      ],
      "outputs": [
        "Thread reference for the turn",
        "Conflict marker where identifier evidence and assertion disagree"
      ],
      "preconditions": [
        "The turn has been appended",
        "The derivation method version is declared"
      ],
      "effects": [
        "Thread membership is recorded as derived or asserted",
        "Conflicts are surfaced rather than silently resolved"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-005",
        "SRC-009"
      ]
    },
    {
      "id": "fn-record-delivery-evidence",
      "name": "Record Delivery Evidence",
      "description": "Attach a submission, delivery, failure or engagement outcome to a turn for a specific recipient, with its reporting source and time.",
      "inputs": [
        "Turn identifier",
        "Recipient participant reference",
        "Reported outcome code",
        "Reporting system identifier",
        "Report time"
      ],
      "outputs": [
        "Per-recipient delivery evidence entry",
        "Optional delivery status receipt artifact reference"
      ],
      "preconditions": [
