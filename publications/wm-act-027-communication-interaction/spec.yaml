        "Recognised signal type",
        "Recognition method and version",
        "Observation time"
      ],
      "outputs": [
        "Revocation signal observation on the turn",
        "Handoff reference with acknowledgement and elapsed interval"
      ],
      "preconditions": [
        "The signal was observed within recorded turn content",
        "The receiving permission model endpoint is known"
      ],
      "effects": [
        "The observation and its handoff timing are evidenced on the interaction",
        "Suppression state itself is created only by the permission model"
      ],
      "source_refs": [
        "SRC-008",
        "SRC-011"
      ]
    },
    {
      "id": "fn-classify-interaction-confidentiality",
      "name": "Classify Interaction Confidentiality",
      "description": "Apply confidentiality, sensitivity and redaction markers to the interaction or its parts and bind them to an access policy identifier.",
      "inputs": [
        "Interaction or part reference",
        "Classification code",
        "Sensitivity marker",
        "Access policy binding identifier",
        "Authorising party reference"
      ],
      "outputs": [
        "Classification and redaction markers on the record",
        "Policy binding reference"
      ],
      "preconditions": [
        "The classification vocabulary and policy identifier are governed externally"
      ],
      "effects": [
        "Consumers can see what handling the record requires",
        "No access decision is evaluated, enforced or logged by this model"
