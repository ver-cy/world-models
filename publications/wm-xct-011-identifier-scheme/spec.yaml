                "id": "check-character-and-validation",
                "name": "Check character systems and what validity proves",
                "description": "Many schemes carry a self-checking element - LEI check digits, an ARK check character computed over a defined check zone, or the version and variant bits of a UUID - that detects transcription error. This finding separates three distinct claims that are routinely confused: the string is well-formed, the string passes its internal check, and the string has actually been assigned to a referent by the authority. Only the third is evidence of existence.",
