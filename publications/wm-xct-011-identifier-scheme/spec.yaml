    "known_omissions": [
      "ISO/IEC 11179-5 and 11179-6 on naming and registration principles, ISO/IEC 7064 on check character systems, ISO/IEC 6523 itself, ISO 26324, ISO 17442 and ISO 15511 could not be read directly; the ISO catalogue and browsing platform returned 403 throughout. Their content is reflected only through accessible first-party or downstream sources, and no clause-level claim is made about any of them.",
