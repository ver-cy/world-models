        "name": "Resolution, Dereference and Persistence",
        "description": "Whether the scheme resolves at all, through which services, what a resolution returns, and what is actually being promised about the future.",
        "rationale": "RFC 8141 requires every namespace registration to state whether resolution is intended; RFC 3986 insists that identification does not imply access; the Handle System shows a two-tier resolution architecture that keeps identifier separate from location; ARK states plainly that persistence is a matter of service rather than of naming syntax. Resolution and persistence are therefore declared properties of the scheme, distinct from its grammar and its assignment register.",
