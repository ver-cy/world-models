          {
            "id": "equivalence-and-canonical-form",
            "name": "Equivalence and Canonical Form",
            "description": "When two strings denote the same referent, which transformations preserve identity, and which comparison level a consumer is entitled to apply.",
            "source_refs": [
              "SRC-002",
              "SRC-001",
              "SRC-010",
              "SRC-019"
            ],
            "findings": [
              {
                "id": "equivalence-and-normalization-rules",
                "name": "Scheme-specific equivalence and normalization rules",
                "description": "Comparison is not a generic operation. RFC 3986 sets out a ladder from simple string comparison through syntax-based and scheme-based normalization to protocol-based normalization, with each rung raising both true-positive and false-positive rates. RFC 8141 requires case normalization of the scheme token and namespace identifier while forbidding percent-decoding and requiring optional components to be ignored. XML namespace names are compared as identical character sequences with no escaping done or undone. ARK normalization removes the resolver host, lowercases the authority number and treats hyphens as insignificant. A single global normalizer applied across schemes will merge distinct referents.",
                "source_refs": [
                  "SRC-002",
                  "SRC-001",
                  "SRC-010",
                  "SRC-019",
                  "SRC-021"
                ],
                "questions": [
                  {
                    "id": "q-canonical-form",
                    "text": "What is the canonical form of an identifier of this scheme, and how is it derived?",
                    "kind": "definition",
                    "answer_data": [
                      "Canonical form definition",
                      "Ordered normalization procedure",
                      "Worked example from raw input to canonical output"
                    ]
                  },
                  {
                    "id": "q-equivalence-transforms",
                    "text": "Which transformations preserve identity for this scheme and which must never be applied?",
                    "kind": "constraint",
                    "answer_data": [
                      "Permitted transformations",
                      "Forbidden transformations with the harm each would cause",
                      "Handling of optional or trailing components"
                    ]
                  },
                  {
                    "id": "q-comparison-level",
                    "text": "Which comparison level is a consumer entitled to rely on without contacting the authority?",
                    "kind": "constraint",
                    "answer_data": [
