      {
        "id": "assignment-and-lifecycle",
        "name": "Assignment, State and Continuity",
        "description": "The act of binding an identifier to a referent, the states that binding passes through, whether a retired identifier may ever be used again, and whether the namespace will hold out.",
        "rationale": "RFC 8141 makes the assignment mechanism a mandatory element of a namespace registration and a non-reassignment commitment a qualifying condition; BCP 47 shows a registry that guarantees subtags are never removed and carries supersession through deprecation and preferred-value fields instead; GLEIF publishes an explicit registration status vocabulary and a renewal duty; RFC 9562 requires collision consequences to be reasoned about. Binding, state and continuity are therefore separable from syntax and from resolution.",
        "source_refs": [
          "SRC-001",
          "SRC-005",
          "SRC-014",
          "SRC-006"
        ],
        "layers": [
          {
            "id": "assignment-act-and-binding",
            "name": "Assignment Act and Binding",
            "description": "The record of who bound which identifier to which referent, when, on what evidence, and with what obligatory metadata.",
            "source_refs": [
              "SRC-013",
              "SRC-001",
              "SRC-015",
              "SRC-021"
            ],
            "findings": [
              {
                "id": "identifier-assignment-record",
                "name": "Assignment record: referent binding, assigner, evidence and period",
                "description": "The assignment is the atomic fact this model exists to support. The FHIR Identifier datatype gives the minimal shape a consumer needs: a system establishing the namespace, a value unique within it, an optional coded type, a use marker that modifies interpretation, a validity period and an assigner. DataCite shows that a registration agency may impose mandatory descriptive metadata as a condition of assignment. RFC 8141 requires the assignment mechanism and its uniqueness method to be specified. Event time and record time must be kept apart: when the binding took effect is not when the register learned of it.",
                "source_refs": [
                  "SRC-013",
                  "SRC-015",
                  "SRC-001",
                  "SRC-021",
                  "SRC-014"
                ],
                "questions": [
                  {
                    "id": "q-assignment-referent",
                    "text": "Which referent is bound by this assignment, and how is that referent itself identified?",
                    "kind": "identity",
                    "answer_data": [
                      "Referent reference with its own identifier and scheme",
                      "Referent class",
                      "Statement of whether the binding is exclusive to one referent"
                    ]
                  },
                  {
                    "id": "q-assignment-assigner",
                    "text": "Who performed the assignment, under which delegated authority?",
