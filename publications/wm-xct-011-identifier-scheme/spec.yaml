    "adversarial_checks": [
      "Tested whether an identifier scheme is merely a code list, using SKOS. A concept scheme governs meaning and is explicitly open-boundaried, with notation as a typed literal labelling a concept; an identifier scheme governs denotation and uniqueness over referents. The distinction holds for opaque schemes but blurs for standards such as ISO 3166 that both classify and denote, so this is recorded as an unresolved boundary rather than a clean separation.",
      "Tested the claim that identifiers are never reused. Falsified: GS1 permits reuse twelve months after catalogue deletion for never-produced items and grandfathers pre-2019 discontinuations, and RFC 8141 states only that a registrant should demonstrate a commitment. The model was restructured to carry reuse as a versioned per-scheme policy with exceptions.",
      "Tested whether equivalence could be a single generic function. Falsified by four mutually incompatible normalization regimes across RFC 3986, RFC 8141, Namespaces in XML and ARK. Canonicalization was moved inside the scheme and a compatibility rule added making a rule-set change a breaking change.",
      "Tested whether resolution success or failure is evidence about the referent. Falsified by RFC 3986 section 1.2.2, which states that access is neither guaranteed nor implied. A separate finding fixes failure semantics so that failure cannot be read as non-existence, and it is deliberately carried inline because the resolution statement already lives in the registration record.",
      "Tested whether a self-generated UUID is a sufficient identity strategy. RFC 9562 requires collision consequences to be reasoned about and offers only local or global uniqueness depending on deployment; more decisively, a UUID has no registration authority and so cannot satisfy any requirement for an authority of record. It is therefore ranked third in identity priority and must be marked locally scoped.",
      "Tested whether DIDs falsify the registration authority concept. Partially only: methods are registered and each must define create, resolve, update and deactivate, so authority is relocated into method governance. The model treats decentralised methods as a variant, not a counterexample.",
