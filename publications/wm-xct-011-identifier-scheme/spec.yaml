          {
            "id": "semantic-transparency-and-opacity",
            "name": "Semantic Transparency and Opacity",
            "description": "How much the identifier string is permitted to say about its referent, and what that disclosure costs.",
            "source_refs": [
              "SRC-009",
              "SRC-019",
              "SRC-002",
              "SRC-018"
            ],
            "findings": [
              {
                "id": "opacity-and-embedded-semantics",
                "name": "Opacity policy and embedded semantics",
                "description": "W3C web architecture advises that agents should not infer properties of a referent from its identifier, and ARK strongly encourages semantic opacity so that names survive changes in the world. Yet delegated-prefix schemes deliberately embed the issuing authority in the string, which is exactly what makes decentralised allocation work. This finding records what the scheme permits to be inferred, what must never be inferred, and what the structure discloses to an observer who was never meant to know it.",
                "source_refs": [
                  "SRC-009",
                  "SRC-019",
                  "SRC-002",
                  "SRC-014",
