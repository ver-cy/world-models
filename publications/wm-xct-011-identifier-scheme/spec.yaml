  "model": {
    "registry_id": "vr.wm-xct-011",
    "model_id": "WM-XCT-011",
    "name": "Identifier Scheme",
    "entry_kind": "mixin",
    "purpose": "Describe a governed naming system as a thing in the world - its constitution, syntax, authority, allocation, lifecycle, resolution, cross-scheme mapping and assurance - so that every other model can carry identifiers by mixing in one scheme-aware structure instead of re-inventing naming rules locally.",
    "scope_statement": "In scope is the scheme as referent: how a scheme is constituted and registered, what strings it admits, how those strings are compared, who is mandated to allocate them and under what policy, how an identifier is bound to a referent and moves through states, whether and how it resolves, what persistence is promised, how it maps to other schemes, and what quality, privacy and legal constraints attach. Out of scope is the referent itself, the proof that a claimant is the entity a label denotes, and every storage or interface projection.",
    "in_scope": [
      "Scheme constitution: registry entry, namespace expression, referent class, scheme version and registration status",
      "Lexical form: grammar, character repertoire, length, case rules, internal prefix structure, check character systems",
      "Equivalence: canonical form, scheme-specific normalization, permitted and forbidden comparison transformations",
      "Registration authority, mandate instrument, oversight body and accreditation of issuers",
      "Sub-namespace delegation, prefix exclusivity, change controller and revocation of delegation",
      "Allocation policy (private use, experimental, first come first served, expert review, specification required, hierarchical)",
      "Assignment records binding an identifier to a referent, with assigner, evidence and effective period",
      "Identifier state vocabulary and permitted transitions including deprecation, retirement, annulment and transfer",
      "Reuse, reassignment, quarantine, supersession, split and merge rules",
      "Namespace capacity, consumption and exhaustion planning",
      "Resolution services, protocols, coverage and the separation of identification from dereference",
      "Persistence commitments, tombstone behaviour and custody transfer",
      "Cross-scheme mapping assertions with relation type, evidence and quality",
      "Carriage of scheme identity alongside an identifier value in consuming models",
      "Collision, squatting, alias and drift detection",
      "Conformance evidence, defect rates and audit",
      "Privacy classification of identifier values and disclosure risk",
      "Legal mandate, licensing of registry and crosswalk data, and succession planning"
    ],
    "out_of_scope": [
      "The referent itself - the person, organization, product, document, dataset or concept that an identifier denotes belongs to the model of that thing",
      "Identity proofing, authenticator binding, authentication and federation - an identifier is a label, not a credential",
      "Authorization and access control decisions taken on the basis of an identifier",
      "Cryptographic key management, verification methods and signature suites used by self-certifying identifier methods",
      "Organization master data for registration authorities, issuers and resolver operators beyond their mandate role",
      "Semantic definition of concepts in a controlled vocabulary; only the notation and its uniqueness are in scope here",
      "Transport, DNS operations, network routing and hosting of resolver infrastructure",
      "Record linkage and probabilistic entity resolution techniques used to reconcile records that lack a shared identifier",
      "Storage and interface projections: JSON, YAML, Markdown, HTML, Git, MCP and MongoDB are renderings, not semantics"
    ],
    "boundary_notes": [
      {
        "neighbor": "Digital identity and authentication model",
        "distinction": "NIST SP 800-63-4 separates resolution of a subject, validation of evidence, creation of a subscriber account and binding of authenticators; this model covers only the label and its governance, never the proof that a claimant is the entity the label denotes. An identifier must never be treated as an authenticator.",
        "source_refs": [
          "SRC-017"
        ]
      },
      {
        "neighbor": "Controlled vocabulary / concept scheme model",
        "distinction": "A SKOS concept scheme governs meaning and is deliberately open-boundaried; an identifier scheme governs denotation and uniqueness of a string over referents. skos:notation is the single overlap point: the notation string is in scope here, the concept it labels is not. Code lists such as ISO 3166 sit ambiguously across this line and are recorded as an unresolved boundary.",
        "source_refs": [
          "SRC-011"
        ]
      },
      {
        "neighbor": "Organization model",
        "distinction": "Registration authorities, oversight committees, local operating units and resolver operators are organizations; only the mandate, accreditation status and change-controller role are modelled here, by reference. GLEIF, the Regulatory Oversight Committee and accredited issuers illustrate the three distinct roles.",
        "source_refs": [
          "SRC-014",
          "SRC-020"
        ]
      },
      {
        "neighbor": "Service and endpoint model",
        "distinction": "RFC 3986 section 1.2.2 states that a URI provides identification only and that access is neither guaranteed nor implied; resolver endpoints, protocols and service levels are described here as declared properties of the scheme, while the operational service belongs to a service model.",
        "source_refs": [
          "SRC-002",
          "SRC-007"
        ]
      },
      {
        "neighbor": "URI scheme registry / protocol registry model",
        "distinction": "BCP 35 governs the registration of URI scheme names as protocol elements with permanent, provisional or historical status; that registry is itself an identifier scheme instance under this model, not a separate meta-layer. Registration of a scheme name is distinguished from allocation of identifiers under it.",
        "source_refs": [
          "SRC-004",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Privacy and data protection model",
        "distinction": "GDPR Article 4(1) makes an identification number or online identifier a route to identifiability, and Article 87 leaves national identification numbers to Member State law; this model records the classification and disclosure risk of identifier values, while lawful basis, impact assessment and data subject rights belong to the privacy model.",
        "source_refs": [
          "SRC-018"
        ]
      },
      {
        "neighbor": "Agreement and licensing model",
        "distinction": "Registration contracts, resolution service terms and bulk crosswalk licences are agreements; this model records only their existence, the obligations they impose on registrants and the continuity commitments they encode.",
        "source_refs": [
          "SRC-014",
          "SRC-021"
        ]
      }
    ]
  },
