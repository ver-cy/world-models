                      "Notation used and its version",
                      "Location of the authoritative expression in the specification"
                    ]
                  },
                  {
                    "id": "q-syntax-repertoire",
                    "text": "Which characters and encodings are permitted, and how is case treated?",
                    "kind": "constraint",
