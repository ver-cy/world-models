  "structure": {
    "bundles": [
      {
        "id": "scheme-constitution",
        "name": "Scheme Constitution and Lexical Form",
        "description": "What the scheme is, which strings it admits, when two strings denote the same thing, and how much meaning the string is allowed to carry.",
        "rationale": "Nothing can be allocated, resolved or mapped until the scheme itself is identifiable and the set of well-formed identifiers is decidable. RFC 8141 makes a syntax statement and equivalence rules mandatory in a namespace registration; RFC 3986 makes comparison a graded, scheme-dependent operation; W3C web architecture makes distinctness of identifiers a first constraint. These are prerequisites, not attributes.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-009"
        ],
        "layers": [
          {
            "id": "scheme-identity-and-scope",
            "name": "Scheme Identity and Scope",
            "description": "The scheme as a first-class referent: its registry key, namespace expression, class of referents, version and registration status.",
            "source_refs": [
              "SRC-001",
              "SRC-008",
              "SRC-004",
              "SRC-023"
            ],
            "findings": [
              {
                "id": "scheme-identity-record",
                "name": "Scheme identity, namespace expression and referent class",
                "description": "An identifier scheme is itself a referent that must be identifiable, scoped and statused before any identifier under it can be interpreted. Its identity comes from an entry in a governing registry (an IANA URN namespace identifier, a URI scheme name, an ISO 6523 code designator, a DID method name), and its scope is the declared class of referents it may name. The namespace expression is the token a consuming model carries next to the value so that the value can be interpreted at all.",
                "source_refs": [
                  "SRC-001",
                  "SRC-008",
                  "SRC-004",
                  "SRC-023",
                  "SRC-013"
                ],
                "questions": [
                  {
                    "id": "q-scheme-registry-key",
                    "text": "Which authoritative registry entry establishes this scheme, and under what key?",
                    "kind": "identity",
                    "answer_data": [
                      "Governing registry name and URL",
                      "Registration key as issued (namespace identifier, scheme name, code designator, method name)",
                      "Registration date and reference document"
                    ]
                  },
                  {
                    "id": "q-scheme-referent-class",
                    "text": "What class of referents may be named under this scheme, and what is explicitly excluded?",
                    "kind": "classification",
                    "answer_data": [
                      "Referent class statement",
                      "Explicit exclusions",
                      "Representative in-scope and out-of-scope examples"
                    ]
                  },
                  {
                    "id": "q-scheme-namespace-expression",
                    "text": "What namespace expression must accompany a value of this scheme when it is carried inside another model?",
                    "kind": "interoperability",
                    "answer_data": [
                      "Absolute namespace URI",
                      "Alternative tokens such as namespace identifier or numeric code designator",
                      "Statement of which token is canonical for exchange"
                    ]
                  },
                  {
                    "id": "q-scheme-version-effect",
                    "text": "Is the scheme versioned, and does a version change alter the meaning of identifiers already assigned?",
                    "kind": "temporal",
                    "answer_data": [
                      "Scheme version label",
                      "Version effective date as an RFC 3339 timestamp",
                      "Backward-compatibility statement for prior assignments"
                    ]
                  },
                  {
                    "id": "q-scheme-status",
                    "text": "What is the scheme's registration status and when did that status last change?",
                    "kind": "state",
                    "answer_data": [
