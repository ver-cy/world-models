  "functions": [
    {
      "id": "register-scheme",
      "name": "Register an identifier scheme",
      "description": "Create or amend the record that constitutes a scheme in a governing registry, capturing purpose, syntax, equivalence rules, assignment mechanism, security and privacy analysis, interoperability conflicts and resolution intent.",
      "inputs": [
        "Completed registration template",
        "Pointer to a permanent public specification",
        "Applicant and change controller references"
      ],
      "outputs": [
        "Scheme registration record with an issued registry key",
        "Registration status value",
        "Registration timestamp in RFC 3339"
      ],
      "preconditions": [
        "The governing registry and its allocation policy are identified",
        "The proposed key satisfies the registry's syntactic constraints and is not already registered",
        "Any required review or specification obligation has been satisfied"
      ],
      "effects": [
        "The scheme becomes citable by a stable registry key",
        "Downstream models may carry the scheme's namespace token",
        "The change controller becomes accountable for future amendment"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-004",
        "SRC-003",
        "SRC-008"
      ]
    },
    {
      "id": "validate-identifier-syntax",
      "name": "Validate a candidate identifier",
      "description": "Decide whether a candidate string is well formed under the scheme's grammar, repertoire and length rules and whether it passes any check element, reporting the three validity levels separately.",
      "inputs": [
        "Candidate string",
        "Scheme registry key and specification version"
      ],
      "outputs": [
        "Well-formedness verdict",
        "Check-element verdict where applicable",
        "Asserted validity level"
      ],
      "preconditions": [
        "A machine-checkable syntax expression is available for the scheme version in force"
      ],
      "effects": [
        "Malformed values are rejected before they enter a register",
        "A passing verdict is explicitly recorded as not evidence that the identifier has been assigned"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-019",
        "SRC-006"
      ]
    },
    {
      "id": "canonicalize-identifier",
      "name": "Canonicalize an identifier value",
      "description": "Apply the scheme's own ordered normalization procedure to produce the canonical form used for storage, indexing and comparison, retaining the as-received form.",
      "inputs": [
        "As-received identifier value",
        "Scheme canonicalization rule set"
      ],
      "outputs": [
        "Canonical identifier value",
        "Record of transformations applied"
      ],
      "preconditions": [
        "The scheme's normalization rules are known and versioned",
        "No cross-scheme generic normalizer is substituted for the scheme's own rules"
      ],
      "effects": [
        "Comparison becomes deterministic within the scheme",
        "The as-received form remains available for provenance and dispute"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-001",
        "SRC-010",
        "SRC-019"
      ]
    },
    {
      "id": "delegate-sub-namespace",
      "name": "Delegate a sub-namespace",
      "description": "Grant allocation authority over a portion of the namespace to another party, recording exclusivity, change control, sub-delegation rights and effective period.",
      "inputs": [
        "Namespace portion",
        "Delegate reference",
        "Delegation terms including exclusivity and sub-delegation rights"
      ],
      "outputs": [
        "Delegation register entry",
        "Effective period timestamps"
      ],
      "preconditions": [
        "The delegating party holds authority over the portion",
        "The portion does not overlap an existing exclusive delegation"
      ],
      "effects": [
        "The delegate may assign identifiers within the portion",
        "The parent retains audit reach and revocation rights as recorded"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-007",
        "SRC-020"
      ]
    },
    {
      "id": "assign-identifier",
      "name": "Assign an identifier to a referent",
      "description": "Bind a well-formed identifier to a referent, recording assigner, effective time, record time, evidence, use marker and any obligatory registration metadata.",
      "inputs": [
        "Candidate identifier or generation request",
        "Referent reference",
        "Assigner and authority basis",
        "Obligatory registration metadata"
      ],
      "outputs": [
        "Assignment register entry",
        "Identifier state set to its initial value",
        "Effective and record timestamps in RFC 3339"
      ],
      "preconditions": [
        "The identifier is well formed and not already assigned or under quarantine",
        "The assigner holds authority over the relevant namespace portion",
        "Any mandatory metadata condition has been met"
      ],
      "effects": [
        "The identifier becomes usable as a reference to the referent",
        "Registrant obligations such as renewal and metadata maintenance begin"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-001",
        "SRC-015",
        "SRC-014"
      ]
    },
    {
      "id": "transition-identifier-state",
      "name": "Transition identifier state",
      "description": "Move an identifier to a new state in the scheme's state vocabulary, recording trigger, actor, successor where applicable, effective time and record time.",
      "inputs": [
        "Identifier value",
        "Target state",
        "Trigger and evidence",
        "Successor identifier where the transition is a supersession"
      ],
      "outputs": [
        "State event log entry",
        "Updated current state and change timestamp"
      ],
      "preconditions": [
        "The transition is permitted by the scheme's state model",
        "The actor is authorised to trigger it",
        "Any required evidence is present"
      ],
      "effects": [
        "Consumers holding the identifier acquire a defined duty such as following a successor",
        "History is preserved rather than overwritten"
      ],
      "source_refs": [
        "SRC-014",
        "SRC-005",
        "SRC-012",
        "SRC-003"
      ]
    },
    {
      "id": "evaluate-reuse-eligibility",
      "name": "Evaluate reuse eligibility",
      "description": "Determine whether a retired identifier may be bound to a different referent under the scheme's reuse rule, its quarantine period and its stated exceptions, including rules that changed on a given date.",
      "inputs": [
        "Retired identifier value",
        "Retirement timestamp",
        "Scheme reuse policy version in force at retirement and now"
      ],
      "outputs": [
        "Eligibility verdict with the governing clause",
        "Earliest permissible reassignment time where eligible"
      ],
      "preconditions": [
        "The reuse policy and its version history are recorded",
        "The retirement time and cause are known"
      ],
      "effects": [
        "Reassignment is blocked where non-reuse applies",
        "Where reuse is permitted, the prior binding is retained so consumers can detect the change"
      ],
      "source_refs": [
        "SRC-022",
        "SRC-001",
        "SRC-005"
      ]
    },
    {
      "id": "resolve-identifier",
      "name": "Resolve an identifier",
      "description": "Query a resolver for the values associated with an identifier, recording the resolver consulted, the outcome class and the observation time, and interpreting failure against the scheme's declared failure semantics.",
      "inputs": [
        "Canonical identifier value",
        "Resolver selection",
        "Optional metadata or policy request"
      ],
      "outputs": [
        "Resolution outcome class",
        "Returned value set or metadata",
        "Resolution audit log entry with observation time"
      ],
      "preconditions": [
        "The scheme declares resolution intent",
        "A resolver covering the relevant namespace portion is reachable"
      ],
      "effects": [
        "The caller obtains a time-stamped result that can be reproduced or disputed",
        "Resolution failure is classified rather than silently treated as non-existence"
      ],
      "source_refs": [
        "SRC-007",
        "SRC-001",
        "SRC-012",
        "SRC-002"
      ]
    },
    {
      "id": "publish-persistence-commitment",
      "name": "Publish a persistence commitment",
      "description": "Issue a declaration by the current provider stating what is promised per dimension - identifier validity, object availability, content invariance, change history - over what horizon and with what exclusions.",
      "inputs": [
        "Namespace portion covered",
        "Per-dimension promise levels and exclusions",
        "Committing party and horizon"
      ],
      "outputs": [
        "Persistence commitment statement",
        "Supersession pointer to the prior statement"
      ],
      "preconditions": [
        "The committing party currently controls resolution for the portion",
        "Any funding or legal backing for the horizon is identified"
      ],
      "effects": [
        "Consumers can evaluate the promise instead of relying on the word persistent",
        "Custody transfer triggers a requirement to reissue"
      ],
      "source_refs": [
        "SRC-019",
        "SRC-016",
        "SRC-009"
      ]
    },
    {
      "id": "assert-cross-scheme-mapping",
      "name": "Assert a cross-scheme mapping",
      "description": "Record a typed correspondence between an identifier or scheme and its counterpart in another scheme, with asserter, evidence, quality, cardinality and chaining permission.",
      "inputs": [
        "Source and target identifiers with their namespaces",
        "Relation type from a named vocabulary",
        "Evidence basis and asserting party"
      ],
      "outputs": [
        "Mapping assertion entry",
        "Quality grade and chaining permission",
        "Assertion timestamp"
      ],
      "preconditions": [
        "Both sides are canonicalized under their own scheme rules",
        "The relation type's symmetry, transitivity and disjointness properties are known"
      ],
      "effects": [
        "Cross-scheme lookup becomes possible with a stated confidence",
        "Chaining is constrained so that error does not compound silently"
      ],
      "source_refs": [
        "SRC-011",
        "SRC-015",
        "SRC-013"
      ]
    },
    {
      "id": "detect-collision-and-drift",
      "name": "Detect collision, aliasing and drift",
      "description": "Scan a population of stored identifiers for duplicate denotation, uncontrolled aliasing, known unregistered use and divergence from the scheme version currently in force.",
      "inputs": [
        "Population of stored identifier values with their carried scheme versions",
        "Current scheme specification and registry entry"
      ],
      "outputs": [
        "Collision and drift report",
        "Per-item remediation status"
      ],
      "preconditions": [
        "Stored values carry their namespace token and the scheme version in force at capture"
      ],
      "effects": [
        "Silent divergence becomes visible and assignable to an owner",
        "Upstream source-standard changes can be absorbed through deprecation rather than deletion"
      ],
      "source_refs": [
        "SRC-009",
        "SRC-005",
        "SRC-003",
        "SRC-004"
      ]
    },
    {
      "id": "classify-identifier-privacy-risk",
      "name": "Classify identifier privacy risk",
      "description": "Assess whether values of a scheme are personal data in a given jurisdiction, what they leak, whether the namespace is enumerable, and confirm the prohibition on treating the value as an authenticator.",
      "inputs": [
        "Scheme syntax and semantic disclosure statement",
        "Jurisdiction",
        "Intended processing purpose"
      ],
      "outputs": [
        "Privacy classification record",
        "Required controls and processing restrictions"
      ],
      "preconditions": [
        "The applicable legal regime for the jurisdiction is identified",
        "The structural disclosure of the identifier is documented"
      ],
      "effects": [
        "Access rules and audit requirements for the identifier are set",
        "Misuse of the identifier as a secret or credential is explicitly foreclosed"
      ],
      "source_refs": [
        "SRC-018",
        "SRC-001",
        "SRC-017",
        "SRC-006"
      ]
    },
    {
      "id": "project-scheme-registry-view",
      "name": "Project a scheme registry view",
      "description": "Produce a projection over scheme records, delegations, allocation policies and resolver descriptors that omits individual assignments, for consumers who need to interpret identifiers without access to the register.",
      "inputs": [
        "Scheme records and delegation register",
        "Resolver service descriptors",
        "Requested projection scope"
      ],
      "outputs": [
        "Registry projection containing scheme keys, namespace tokens, syntax, equivalence rules and resolution intent"
      ],
      "preconditions": [
        "Access scope permits scheme-level but not assignment-level disclosure"
      ],
      "effects": [
        "Consuming models can validate and canonicalize without seeing assignment data",
        "Assignment-level confidentiality is preserved"
      ],
      "source_refs": [
        "SRC-008",
        "SRC-013",
        "SRC-023",
        "SRC-001"
      ]
    },
    {
      "id": "transfer-registration-authority",
      "name": "Transfer registration authority",
      "description": "Reassign change control or RA mandate when the original registrant is unreachable or an IESG or ISO decision requires it.",
      "inputs": [
        "scheme reference",
        "new authority",
        "authorising decision"
      ],
      "outputs": [
        "updated mandate",
        "succession event"
      ],
      "preconditions": [
        "Authorising body has jurisdiction (IESG, ISO, parent RA)."
      ],
      "effects": [
        "Updates change controller.",
        "Must not recycle already-assigned identifiers."
      ],
      "source_refs": [
        "SRC-004",
        "SRC-026"
      ]
    }
  ],
  "composition": [
    {
      "target": "Any Vercy model carrying identifier-valued data elements",
      "relation": "MIX-IN",
      "purpose": "Supply the carriage shape - namespace token, value, type, use marker, validity period and assigner - so that a consuming model stores an interpretable identifier instead of a bare string, and so that scheme drift is detectable at the point of use.",
      "required": true,
      "source_refs": [
        "SRC-013",
        "SRC-010",
        "SRC-009"
      ]
    },
    {
      "target": "Organization model",
      "relation": "REFERENCE",
      "purpose": "Registration authorities, oversight bodies, accredited issuers, registrants and resolver operators are organizations; this model holds only their mandate and role, never their master data.",
      "required": true,
      "source_refs": [
        "SRC-014",
        "SRC-020",
        "SRC-021"
      ]
    },
    {
      "target": "Controlled vocabulary and concept scheme model",
      "relation": "ALIGN",
      "purpose": "Align the notation carried by a concept with this model's identifier value, while leaving concept meaning, scheme membership and semantic relations to the vocabulary model; the alignment point is notation as a typed literal.",
      "required": false,
      "source_refs": [
        "SRC-011"
      ]
    },
    {
      "target": "Service and endpoint model",
      "relation": "REFERENCE",
      "purpose": "Resolver endpoints, protocols and service levels are described here as declared scheme properties and referenced to the service model for their operational reality, monitoring and incident history.",
      "required": false,
      "source_refs": [
        "SRC-007",
        "SRC-012"
      ]
    },
    {
      "target": "Digital identity and authentication model",
      "relation": "REFERENCE",
      "purpose": "Record the hard boundary that an identifier is a label and never a credential; proofing, authenticator binding and authentication belong entirely to the identity model.",
      "required": true,
      "source_refs": [
        "SRC-017"
      ]
    },
    {
      "target": "Privacy and data protection model",
      "relation": "REFERENCE",
      "purpose": "Carry the privacy classification of identifier values into lawful-basis, impact-assessment and data-subject-rights processing without duplicating those processes here.",
      "required": true,
      "source_refs": [
        "SRC-018"
      ]
    },
    {
      "target": "Agreement and licensing model",
      "relation": "REFERENCE",
      "purpose": "Registration contracts, resolution service terms and bulk crosswalk licences are agreements; this model records their existence, obligations and continuity effects only.",
      "required": false,
      "source_refs": [
        "SRC-014",
        "SRC-021"
      ]
    },
    {
      "target": "RFC 8141 Uniform Resource Names",
      "relation": "ALIGN",
      "purpose": "Align namespace registration, equivalence procedure and the mandatory registration template fields; alignment only, since conformance for any given scheme requires an actual IANA registration as evidence.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-008"
      ]
    },
    {
      "target": "RFC 3986 URI Generic Syntax",
      "relation": "ALIGN",
      "purpose": "Align the comparison ladder and the principle that identification does not imply access, which together fix how far a consumer may normalize and what a resolution failure means.",
      "required": false,
      "source_refs": [
        "SRC-002"
      ]
    },
    {
      "target": "RFC 8126 IANA registration policies",
      "relation": "ALIGN",
      "purpose": "Adopt the allocation policy vocabulary and the reserved-value status terms so that any scheme can state how much review its identifiers have had.",
      "required": false,
      "source_refs": [
        "SRC-003"
      ]
    },
    {
      "target": "ITU-T X.660 object identifier registration authority procedures",
      "relation": "ALIGN",
      "purpose": "Align the registration authority and hierarchical arc delegation pattern; cited only to the extent the published abstract supports, since the full text was not retrievable during research.",
      "required": false,
      "source_refs": [
        "SRC-020"
      ]
    },
    {
      "target": "HL7 FHIR Identifier datatype",
      "relation": "ALIGN",
      "purpose": "Adopt the system-plus-value carriage pattern with use, type, period and assigner as the reference shape for the mixin surface.",
      "required": false,
      "source_refs": [
        "SRC-013"
      ]
    },
    {
      "target": "SKOS mapping relations",
      "relation": "ALIGN",
      "purpose": "Adopt the mapping relation vocabulary including the deliberate non-transitivity of close matches, which constrains crosswalk chaining.",
      "required": false,
      "source_refs": [
        "SRC-011"
      ]
