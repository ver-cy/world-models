            "findings": [
              {
                "id": "identifier-syntax-grammar",
                "name": "Identifier grammar, repertoire and internal structure",
                "description": "The decidable definition of a well-formed identifier: a formal grammar, the permitted character repertoire and encoding, length bounds, case treatment, and which substrings are structurally significant. RFC 8141 requires a syntax statement in every namespace registration and constrains namespace identifiers to a bounded alphanumeric pattern; RFC 3986 requires a scheme's own syntax to remain within the generic grammar; DOI names divide at a forward slash into an issuer prefix and a registrant-chosen suffix; the LEI is a fixed twenty-character code whose leading characters denote the issuing unit.",
                "source_refs": [
                  "SRC-001",
                  "SRC-002",
                  "SRC-021",
                  "SRC-014",
                  "SRC-006"
                ],
                "questions": [
                  {
                    "id": "q-syntax-expression",
                    "text": "What machine-checkable expression defines a well-formed identifier of this scheme?",
                    "kind": "constraint",
                    "answer_data": [
