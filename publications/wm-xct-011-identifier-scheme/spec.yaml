    "conflicts": [
      "Non-reuse is not universal. RFC 8141 section 5.1 asks a formal-namespace registrant to demonstrate a commitment not to reassign, and BCP 47 section 3.4 guarantees subtags are never removed or reassigned; GS1 by contrast operated timed reuse until an all-sector non-reallocation rule took effect after December 2018 and still permits reuse twelve months after catalogue deletion for never-produced items. The model therefore records reuse as a per-scheme policy with versions and exceptions, not as an invariant.",
      "Equivalence rules are mutually incompatible across schemes. RFC 3986 section 6 offers a graded normalization ladder, RFC 8141 section 3.1 forbids percent-decoding and requires optional components to be ignored, Namespaces in XML section 2.3 requires identical character sequences with no escaping done or undone, and ARK treats hyphens as insignificant and lowercases the authority number. No single generic normalizer is correct; the model makes canonicalization scheme-scoped.",
      "Opacity guidance conflicts with delegated-prefix design. W3C web architecture section 2.5 advises agents not to infer properties of a referent from its identifier, and ARK strongly encourages semantic opacity, yet DOI prefixes, LEI issuer prefixes, GS1 company prefixes and Handle naming authorities all deliberately encode the issuer, and real systems parse them. The model resolves this by recording permitted and forbidden inferences per scheme rather than adopting either position.",
      "The name-versus-locator partition is contested. RFC 3986 section 1.1.3 states that a scheme need not be classified as just one of name or locator and recommends the general term URI, while the DOI, Handle and ARK communities maintain a strong separation of identifier from location as a design principle.",
      "SKOS declares exactMatch transitive and symmetric while deliberately withholding transitivity from closeMatch to stop errors compounding. In practice crosswalks are chained across schemes regardless, so a formally valid transitive inference can still produce a wrong correspondence. The model carries an explicit chaining permission flag rather than relying on the formal semantics alone.",
      "Persistence expectations conflict with erasure obligations. FAIR A2 asks that metadata remain accessible even when the data are gone, and ARK persistence declarations may promise identifier validity indefinitely, while GDPR erasure rights can require removal of personal data from a record that a persistence commitment says will endure. The model handles this with tombstones and an explicit reconciliation decision record, but the conflict is real and jurisdiction-dependent.",
      "DID design goals reject centralized authorities and single points of failure, yet DID methods are themselves registered and each must specify create, resolve, update and deactivate operations. The registration authority function is displaced into method governance rather than eliminated, which the model treats as a variant of authority rather than its absence.",
      "Case sensitivity is scheme-specific and cannot be generalised: URN namespace identifiers are case-insensitive, DOI names are case-insensitive, XML namespace names are case-sensitive, and ARK lowercases only the authority number.",
      "RFC 8141 uniqueness never reassigns a name; FHIR old/temp and many telecom/domain schemes permit reuse or former-identifier matching. Record the scheme policy; do not globalise URN rules.",
      "RFC 8141 restricts URNs to ASCII with percent-encoding; RFC 3987 IRIs share the URI scheme registry. A scheme may have both forms only if its specification says so.",
      "ISO 26324: a DOI does not replace other ISO/TC 46 identifiers even when it encapsulates their strings.",
      "DID Core: UUIDs are not resolvable or cryptographically verifiable; treating urn:uuid as a DID method is a conflict.",
      "SKOS exactMatch versus owl:sameAs: mappings of identifiers or notations are not identity of referents.",
      "RFC 8141 r-components are syntactically defined but SHOULD NOT be used until their semantics are standardised.",
      "Microsoft COM GUID little-endian layout versus RFC 9562 network byte order.",
