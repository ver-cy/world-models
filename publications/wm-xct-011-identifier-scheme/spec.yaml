            "findings": [
              {
                "id": "capacity-and-exhaustion-planning",
                "name": "Capacity, consumption rate and extension strategy",
                "description": "Namespace exhaustion is a foreseeable failure with long lead times and is routinely omitted from scheme documentation. RFC 9562 makes the point in the probabilistic case: implementers must weigh the consequences of collision and choose between local and global uniqueness guarantees. ARK addresses the combinatorial case directly by recommending digit-heavy names with sparing use of a restricted alphabet to raise namespace density. Hierarchical schemes shift the problem to the delegation tree, where a parent can extend capacity by widening or deepening arcs.",
                "source_refs": [
                  "SRC-006",
                  "SRC-019",
                  "SRC-007",
                  "SRC-003"
                ],
                "questions": [
                  {
