          {
            "id": "privacy-and-disclosure-risk",
            "name": "Privacy and Disclosure Risk",
            "description": "Whether identifier values are personal data, what they leak, and what they must never be used for.",
            "source_refs": [
              "SRC-018",
              "SRC-001",
              "SRC-017",
              "SRC-006"
            ],
            "findings": [
              {
                "id": "identifier-privacy-classification",
                "name": "Personal-data classification, leakage and misuse as a credential",
                "description": "GDPR Article 4(1) makes an identification number or online identifier a route to identifiability, Recital 26 keeps re-identifiable pseudonymised data within scope, Recital 30 names device and cookie identifiers explicitly, and Article 87 leaves national identification numbers to Member State law. RFC 8141 requires a filed analysis of comparison issues, information leakage and privacy. Time-based generated identifiers can disclose creation time and generator state. NIST separates a label from a credential: an identifier is never proof of anything, and treating it as an authenticator is a design fault, not a policy preference.",
                "source_refs": [
                  "SRC-018",
                  "SRC-001",
                  "SRC-017",
                  "SRC-006"
                ],
                "questions": [
                  {
                    "id": "q-personal-data-status",
                    "text": "Are values of this scheme personal data, directly or through re-identification?",
                    "kind": "classification",
                    "answer_data": [
                      "Personal-data classification with reasoning",
                      "Re-identification pathway if any",
                      "Applicable legal regime and territory"
                    ]
                  },
                  {
                    "id": "q-value-leakage",
                    "text": "What does a value disclose about its referent or its creation to a party holding only the string?",
