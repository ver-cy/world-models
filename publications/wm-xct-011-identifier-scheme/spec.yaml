          {
            "id": "legal-basis-and-continuity",
            "name": "Legal Basis, Licensing and Continuity",
            "description": "The instrument the scheme runs on, the terms on which its data may be used, and what happens if the operator stops.",
            "source_refs": [
              "SRC-014",
              "SRC-021",
              "SRC-003",
              "SRC-019"
            ],
            "findings": [
              {
                "id": "mandate-licensing-and-succession",
                "name": "Legal instrument, data licensing and succession planning",
                "description": "A scheme's data has terms even when it is free: the LEI system is presented as a public good available free to all users, which is itself a licensing position with consequences for downstream reuse. Registration agencies impose obligations on registrants as a condition of assignment. RFC 8126 requires change control to be settled per registry and, where entries come from many sources, per entry. ARK's observation that only a current provider can state its intended commitment makes succession the central continuity question: if the operator stops, the commitment stops unless someone has already agreed to inherit it.",
                "source_refs": [
                  "SRC-014",
                  "SRC-021",
                  "SRC-003",
                  "SRC-019",
                  "SRC-004"
                ],
                "questions": [
                  {
                    "id": "q-legal-instrument",
                    "text": "Under what legal instrument does the scheme operate, and in which jurisdictions is it effective?",
                    "kind": "authority",
                    "answer_data": [
                      "Instrument type and citation",
                      "Jurisdictions of effect",
                      "Any jurisdiction where it is not recognised"
                    ]
                  },
                  {
                    "id": "q-data-licence",
                    "text": "On what terms may the registry, assignment register and crosswalk data be used and redistributed?",
                    "kind": "access",
                    "answer_data": [
                      "Licence identifier and terms",
                      "Distinction between single-lookup and bulk access",
                      "Attribution and redistribution conditions"
                    ]
                  },
                  {
                    "id": "q-registrant-obligations",
                    "text": "What ongoing obligations bind a registrant, and what are the fees?",
                    "kind": "requirement",
                    "answer_data": [
                      "Obligation list including metadata maintenance and renewal",
                      "Fee structure",
                      "Consequence of non-payment or non-compliance"
                    ]
                  },
                  {
                    "id": "q-succession-plan",
                    "text": "Who inherits the scheme, its register and its resolution duty if the operator winds down?",
                    "kind": "process",
                    "answer_data": [
                      "Named successor or escrow arrangement",
                      "Trigger conditions",
                      "Whether the arrangement has been tested or exercised"
                    ]
                  },
                  {
                    "id": "q-change-control-legal",
                    "text": "Who holds change control over the scheme record and over individual entries?",
                    "kind": "ownership",
                    "answer_data": [
                      "Change controller at registry level",
                      "Change controller at entry level where these differ",
                      "Transfer procedure"
                    ]
                  }
                ],
                "data_elements": [
                  {
