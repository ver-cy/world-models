              "SRC-023"
            ],
            "findings": [
              {
                "id": "cross-scheme-mapping-assertion",
                "name": "Mapping assertion: relation type, evidence, quality and chaining",
                "description": "A crosswalk is an assertion by a party, not a fact of the world. SKOS distinguishes exact, close, broad, narrow and related matches, declares exactMatch transitive and symmetric while deliberately withholding transitivity from closeMatch so that errors do not compound when mappings are chained across schemes, and makes exactMatch disjoint from broadMatch and relatedMatch. DataCite supplies a complementary vocabulary for identity and version relations between registered resources. Every assertion needs an asserter, evidence, a quality judgement and a retirement path.",
                "source_refs": [
                  "SRC-011",
                  "SRC-015",
                  "SRC-013",
                  "SRC-023"
                ],
                "questions": [
                  {
                    "id": "q-mapping-relation-type",
                    "text": "What relation type does this mapping assert, and is it symmetric or transitive?",
                    "kind": "relationship",
                    "answer_data": [
                      "Relation type from a named vocabulary",
                      "Symmetry and transitivity properties",
                      "Disjointness constraints with other relations"
                    ]
                  },
                  {
                    "id": "q-mapping-asserter",
                    "text": "Who asserted this mapping, on what evidence, and when?",
                    "kind": "provenance",
                    "answer_data": [
                      "Asserting party reference",
                      "Evidence basis such as authority publication, expert review or algorithmic match",
                      "Assertion time in RFC 3339"
                    ]
