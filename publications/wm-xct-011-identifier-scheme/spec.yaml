                "description": "Non-reuse is a policy choice, not a law of naming, and this is where naive models fail. RFC 8141 asks formal-namespace registrants to demonstrate a commitment not to reassign, and BCP 47 guarantees that subtags are never removed or reassigned. GS1 by contrast operated timed reuse until an all-sector non-reallocation rule took effect after December 2018, and it still permits reuse twelve months after catalogue deletion for items that were never produced, while withdrawn-and-reintroduced items keep their original identifier. Supersession, splits and merges need explicit relation vocabulary of the kind DataCite provides.",
