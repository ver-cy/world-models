                "description": "This is the mixin surface. FHIR's Identifier shows the minimum that must travel with a value for it to remain interpretable: a system establishing the namespace, the value unique within it, a coded type, a use marker that modifies meaning, a validity period and an assigner. XML Namespaces warns that a prefix functions only as a local placeholder and that applications should use the namespace name, not the prefix, whenever a name's scope extends beyond its document. ISO 6523 code designators show the same job done with a numeric scheme code instead of a URI. A consuming model that stores a bare string has thrown away the interpretation.",
