              {
                "id": "delegation-chain-and-change-control",
                "name": "Delegation chain, exclusivity and change controller",
                "description": "Hierarchical allocation lets delegated administrators control portions of a namespace while a higher authority manages the levels above, and RFC 8126 names it as a policy in its own right. The Handle System builds naming authorities as a dotted tree in which global uniqueness follows from a globally unique authority combined with a locally unique name. DOI achieves decentralised allocation the same way. Delegation raises questions the parent scheme must answer: is a delegated prefix exclusive against longer strings sharing its leading characters, who may change an entry once delegated, and what happens to identifiers already issued when a delegation is revoked.",
