        "id": "interoperability-and-mapping",
        "name": "Interoperability, Carriage and Conflict",
        "description": "How identifiers of this scheme relate to identifiers of other schemes, how they travel inside other models, and how collisions and drift are detected.",
        "rationale": "SKOS provides the only widely adopted mapping vocabulary with an explicit warning about compounding error across chained mappings; FHIR shows the carriage shape that keeps a value interpretable outside its home system; W3C web architecture names URI collision and aliasing as first-order harms; BCP 47 demonstrates how a registry absorbs change in an upstream source standard without breaking existing references. Mapping, carriage and conflict are distinct from allocation and resolution.",
