              {
                "id": "identification-versus-dereference",
                "name": "Identification distinguished from dereference",
                "description": "RFC 3986 states that a URI provides identification only and that access to the resource is neither guaranteed nor implied, and it discourages the strict name-versus-locator partition on which many identifier arguments rest. XML namespace names are explicitly not intended for retrieval. Yet FAIR expects data to be retrievable by identifier over a standardised protocol, and users routinely treat a failed resolution as evidence that the referent does not exist. This finding fixes the interpretation a consuming agent must apply so that resolution failure is not mistaken for non-existence, nor successful resolution for authenticity of the referent.",
