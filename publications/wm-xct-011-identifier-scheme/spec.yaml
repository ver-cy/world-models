            "findings": [
              {
                "id": "collision-and-drift-detection",
                "name": "Collision, squatting, aliasing and upstream drift",
                "description": "W3C web architecture names two failure modes directly: collision, where distinct resources share an identifier, and aliasing, where one resource acquires arbitrarily many. BCP 35 warns against squatting and requires a new scheme to show utility beyond what is already registered. RFC 8126 provides a marker for values known to be in use without registration. BCP 47 shows the hardest case: an upstream source standard withdraws or reassigns a code, and the registry must absorb the change through deprecation and preferred-value mappings rather than by removing the record. Carrying the scheme version alongside every stored value is what makes such drift detectable at all.",
                "source_refs": [
                  "SRC-009",
                  "SRC-004",
                  "SRC-003",
                  "SRC-005",
                  "SRC-014"
                ],
                "questions": [
                  {
