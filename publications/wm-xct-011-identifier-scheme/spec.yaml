        "id": "assurance-risk-and-compliance",
        "name": "Assurance, Privacy and Legal Continuity",
        "description": "Whether the scheme's claims can be checked, what risk its values carry, and what legal footing keeps it running.",
        "rationale": "RFC 8141 makes a security and privacy analysis a mandatory part of a namespace registration; GDPR makes an identification number a route to identifiability and reserves national identification numbers to Member State law; NIST separates a label from a credential; GLEIF runs an explicit data quality programme; ARK insists that only a current provider can make a commitment. Assurance, privacy and legal continuity are governance concerns that no syntax rule can supply.",
