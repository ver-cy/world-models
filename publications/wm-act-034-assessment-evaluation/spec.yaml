                ],
                "artifacts": [],
                "inline_only_rationale": "Identity, granularity and supersession are pure reference data carried on the record itself — identifier values, scheme names and pointers. Nothing is rendered, captured or attached here; any document that displays these values is produced by the conclusion or disclosure findings, so declaring an artifact would duplicate them."
              },
              {
                "id": "fd-type-stakes-mandate",
                "name": "Assessment type, stakes and mandate",
                "description": "The class of assessment, the party relationship between assessor and subject, the scheme or legal basis authorising it, and the consequence class its result carries.",
                "source_refs": [
                  "SRC-001",
                  "SRC-012",
                  "SRC-007",
                  "SRC-010"
                ],
                "questions": [
                  {
                    "id": "q-assessment-kind",
                    "text": "Which class of assessment is this: conformity, diagnostic, formative, summative, risk, quality, appraisal or peer review?",
                    "kind": "classification",
                    "answer_data": [
                      "Assessment type code and its code system",
                      "Purpose statement",
                      "Formative versus summative flag"
                    ]
                  },
                  {
                    "id": "q-party-relationship",
                    "text": "Is this a first-party, second-party or third-party assessment relative to the subject?",
                    "kind": "relationship",
                    "answer_data": [
                      "Party-relationship code",
                      "Description of the assessor-to-subject relationship",
                      "Declared independence level"
                    ]
                  },
                  {
                    "id": "q-mandate-basis",
                    "text": "Under what mandate, scheme or legal basis is the assessment carried out?",
