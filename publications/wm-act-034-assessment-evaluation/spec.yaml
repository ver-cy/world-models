  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "Name a single accountable assessment owner and, separately, a decision authority entitled to record conclusions; the two roles must be distinguishable in every record so determination and decision remain separable.",
        "Declare the criteria sources, scales, outcome vocabularies and decision rules the package binds, each with a version and a publication location, and version them independently of individual assessment records.",
        "Declare the sibling models this package references for subject, party, evidence custody, retention, disclosure, attestation and dispute handling, and confirm that none of their lifecycle or enforcement functions is reimplemented locally.",
        "State explicitly which assessments carry legal, regulatory or contractual effect in the adopting jurisdiction and which are informational, and record the designation or accreditation evidence for the former."
      ],
      "namespace_guidance": "Use one namespace per assessing authority and scheme, for example `<dimension>/assessment/<scheme>/<record-id>`. Keep criterion, scale, outcome-vocabulary and decision-rule identifiers in separate registry namespaces so a record binds them by identifier plus version without copying them. Never embed a date, a score, a subject name or an assessor name in a namespace path, and never reuse a retired record identifier.",
      "registry_links": [
        "Criteria catalogue registry supplying criterion identifiers and pinned versions",
        "Outcome vocabulary and severity scheme registry, including indeterminate values",
        "Scale, unit and decision-rule registry with published thresholds and guard bands",
        "Party, competence and accreditation registry for assessors and assessing bodies",
        "Scheme and programme registry defining recurring assessment rules and surveillance intervals",
        "Crosswalk registry holding versioned mappings to external reporting formats"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Serialise every coded value as an explicit triple of code system, code and code-system version; a bare label is never canonical.",
        "Represent scores as decimal strings at the precision declared by the bound scale; never apply locale-dependent number formatting and never round silently during aggregation.",
        "Order criterion results by criterion identifier within the bound catalogue rather than by insertion order, so digests over the record are stable.",
        "Distinguish three absent states explicitly: criterion not selected, criterion selected with no result yet, and criterion selected with an explicit indeterminate outcome.",
        "Normalise every cross-model pointer to a tuple of owning model, identifier and version, and tag every narrative field with a BCP 47 language tag."
      ],
      "patch_rules": [
        "Draft records may be patched in place; final records are append-only and change only by issuing a new version that cites the version it supersedes.",
        "Every patch carries an actor reference, an RFC 3339 timestamp with seconds and an explicit offset, a reason code and the field paths affected.",
        "Patching a criteria binding, a scale, a decision rule, a recorded observation or a score after finalisation is prohibited; issue an amendment or a re-assessment instead.",
        "Redaction is a patch that removes content from a rendition, never from the retained record; the retained record keeps a redaction marker naming the rule version applied.",
        "Recomputation of a composite result after finalisation is prohibited; a changed aggregation model produces a new assessment version with its own binding."
      ],
      "compatibility_rules": [
        "Adding an optional element, a new outcome code, a new severity level or a new external projection is a minor, backward-compatible change.",
        "Changing scale bounds, weighting, aggregation model or decision-rule thresholds is a breaking change; historical records retain their original bindings and are never recomputed against the new definition.",
        "Deprecate outcome codes with a documented successor mapping rather than removing them; consumers encountering an unknown outcome code must treat it as indeterminate and never as a negative result.",
        "A crosswalk to an external format is versioned against both source and target vocabulary versions; a new target version produces a new crosswalk rather than an in-place edit."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier issued by the system of record for the assessment — for example the assessing body's report or case number, the accreditation scheme's application number, or the assessment platform's record identifier.",
        "Governed global identifier or IRI where the assessment, its criteria binding or its published conclusion exists under a governed namespace — for example a DOI, a URN or a scheme-issued IRI.",
        "UUID or ULID assigned by the adopting Dimension where neither of the above exists; assigned once at record creation and never reissued or reused.",
        "A date, a score, a composite level, a subject name, a criteria version or a file name is never an identifier and may not be used as one, alone or in combination."
      ],
      "timestamp_rule": "All time values are RFC 3339 date-time strings that include seconds and an explicit UTC offset or `Z`; local times without an offset are rejected at ingestion. Record event time — when the assessed condition held, or when the assessment act occurred — separately from observation or ingestion time — when evidence was collected, when a result was returned, and when the record was written. Where these differ, both are retained and neither overwrites the other; comparisons and validity checks state which of the two they use.",
      "serial_naming_rule": "Serial artifacts — report revisions, evidence indexes, execution manifests, score reports, public renditions and periodic surveillance results — are named with a stable series key plus a zero-padded, monotonically increasing sequence number, for example `report-r0007`. The series key derives from the assessment identifier and, where needed, the producing agent or disclosure class. The sequence is never derived from a date, never restarted within a series, and never reused after an artifact is withdrawn.",
      "integrity_rule": "Every artifact records its media type, byte length and a cryptographic digest with the named algorithm, captured at registration and again at each republication. Digests are recomputed on read; a mismatch quarantines the artifact, marks every determination that cites it as unverified, and blocks reliance on any conclusion derived from it until a reviewer resolves the discrepancy."
    },
    "policies": [
      "Determination and decision are separable: the record must be able to name a different actor for evaluating evidence against criteria and for deciding the conclusion, and must state when the same actor did both.",
      "No conclusion is recorded without at least one version-pinned criterion binding and at least one evidence or observation reference, or an explicit declaration that the conclusion rests on expert judgement alone with that judgement's basis stated.",
      "Indeterminate, not-applicable, untested and error outcomes must be representable and must never be coerced into a negative result, an average, or a zero score.",
      "Every published score travels with the scale reference, the aggregation model identifier and the decision rule that produced it; a score published alone is treated as uninterpretable.",
      "Authority to assert regulatory or contractual effect is never inferred from method quality or tool sophistication; it must be evidenced by a resolvable designation, accreditation or contractual reference.",
      "Assessment records are never deleted to resolve a dispute or an unfavourable result; corrections proceed only by amendment, supersession or an entered-in-error marking that retains history.",
      "Where a sample was assessed, any claim extending to the unsampled remainder must be stated explicitly as an extrapolation with its confidence, never implied by silence."
    ],
    "crud": {
      "read": [
        "Read by assessment identifier, or query by subject reference, criteria source and version, scheme, record status, conclusion type or validity window.",
        "Reading a final record returns its frozen content together with the current effective-version pointer; a consumer must resolve supersession before relying on any conclusion.",
        "Evidence bodies are read through the referenced custody model; this model returns pointers, digests, types and disclosure classes only.",
        "Reads honour disclosure class per record part, so a caller may legitimately receive a conclusion and its validity window without the scores, rationale or evidence.",
        "Every read of a conclusion returns the scale, aggregation model and decision rule references alongside it, so the result cannot be quoted without its interpretation context."
      ],
      "create": [
        "Creation requires a resolvable subject reference, an assessment type, a mandate or scheme reference and a named owner; the record starts in draft.",
        "Criteria bindings must resolve at a stated version before the record may leave draft; an unresolvable or unpinned binding blocks finalisation.",
        "The creating actor and creation time are captured as provenance at creation and are never editable thereafter.",
        "Creating a record for a subject that already has an open assessment under the same scheme and criteria requires an explicit reason, so duplicates are deliberate rather than accidental."
      ],
      "update": [
        "Draft records accept in-place updates to scope, sampling, criteria bindings, method declarations, evidence links, observations and criterion results.",
        "Transition to final requires an outcome or explicit indeterminate value for every selected criterion, a completed independent review, a named decision maker and a resolvable decision rule.",
        "After finalisation only lifecycle-scoped fields change: effective-version pointers, supersession links, disclosure class, publication terms, retention class, legal-hold flag and registered appeal outcomes.",
        "Any post-finalisation change to substantive content is rejected; the caller is directed to the amendment or re-assessment function.",
        "Updates that change a bound vocabulary version do not retro-apply to finalised records, which keep the version they were decided under."
      ],
      "delete": [
        "Assessment records are not hard-deleted by default. Withdrawal is a status transition to `entered-in-error` or `withdrawn` accompanied by a tombstone that retains the identifier, record type, withdrawal reason code, acting party and an RFC 3339 timestamp with seconds and offset.",
        "The record declares a retention class and a retention trigger event per record part; the minimum retention period, the disposition action and its execution are owned by the adopting Dimension's records-retention policy model, which this model references. This model records only the classification and the referral, together with the referral's acknowledgement.",
        "Erasure of personal data contained in evidence is executed by the referenced evidence-custody and privacy models under their own legal basis; this model records that erasure occurred, the authority relied on, and marks every conclusion that cited the erased evidence as evidentially incomplete rather than silently unchanged.",
        "Disposition is blocked while a legal hold, an open appeal or complaint, or an unexpired validity window is recorded against the assessment; the hold itself is set and released by the referenced legal-hold or dispute model, not here.",
        "Tombstones are retained at least as long as the retention period of any assessment that references the withdrawn record, and a tombstoned identifier is never reused for a new record.",
        "Deletion of a derived artifact such as a score report or public rendition does not delete the record it was derived from; the record retains a marker that the rendition was withdrawn, with the reason and actor."
      ]
