  "structure": {
    "bundles": [
      {
        "id": "bn-frame",
        "name": "Assessment Frame, Subject and Scope",
        "description": "What this assessment is, who mandated it, what it is about, and where its boundary lies.",
        "rationale": "Every reviewed standard begins by fixing an object of assessment and a bounded scope before any criterion is applied: OSCAL names an assessment-subject and reviewed-controls, WCAG-EM makes scope definition and sampling the first two steps, and FHIR RiskAssessment requires a subject. Framing errors invalidate everything downstream, so identity, mandate, subject and scope are grouped as one top-level concern.",
        "source_refs": [
          "SRC-002",
          "SRC-013",
          "SRC-007",
          "SRC-012"
        ],
        "layers": [
          {
            "id": "ly-identity-mandate",
            "name": "Identity and Mandate",
            "description": "How the assessment record is identified and versioned, and the authority and purpose under which it exists.",
            "source_refs": [
              "SRC-002",
              "SRC-012",
              "SRC-007"
            ],
            "findings": [
              {
                "id": "fd-record-identity",
                "name": "Assessment record identity, granularity and versioning",
                "description": "The identifier that authoritatively designates this assessment, the unit of record it covers, and how successive versions and supersessions are distinguished from independent re-assessments.",
                "source_refs": [
                  "SRC-002",
                  "SRC-007",
                  "SRC-011"
                ],
                "questions": [
                  {
                    "id": "q-record-identifier",
                    "text": "Which identifier authoritatively designates this assessment record, and which system issued it?",
                    "kind": "identity",
                    "answer_data": [
                      "Issuing system of record",
                      "Primary identifier value and its scheme",
                      "Alternate or business identifiers with their schemes"
                    ]
                  },
                  {
                    "id": "q-record-granularity",
                    "text": "What is the atomic unit of the record: one subject, one criteria set, one occasion, or a combination?",
                    "kind": "definition",
                    "answer_data": [
                      "Declared record granularity",
                      "Components of the composite key",
                      "Rules for splitting or merging records"
                    ]
                  },
                  {
                    "id": "q-record-version",
                    "text": "How are successive versions of the same assessment distinguished from a new, independent assessment?",
                    "kind": "lifecycle",
                    "answer_data": [
                      "Version label or sequence",
                      "Supersedes and superseded-by pointers",
                      "Rule distinguishing amendment from re-assessment"
                    ]
                  },
                  {
                    "id": "q-record-derivation",
                    "text": "Which prior assessment, plan or request does this record derive from or fulfil?",
                    "kind": "provenance",
                    "answer_data": [
                      "Basis or derived-from reference",
                      "Fulfilled request or engagement reference",
                      "Relationship type between the records"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-assessment-id",
                    "name": "Assessment identifier",
                    "description": "Authoritative identifier of the assessment record, with its issuing scheme.",
                    "value_kind": "identifier",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-002",
                      "SRC-007"
                    ]
                  },
                  {
                    "id": "de-assessment-version",
                    "name": "Assessment version",
                    "description": "Version label or sequence of this revision of the assessment.",
                    "value_kind": "text",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-002"
                    ]
                  },
                  {
                    "id": "de-supersedes-ref",
                    "name": "Supersedes reference",
                    "description": "Pointer to the assessment version this record replaces.",
                    "value_kind": "reference",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-002",
                      "SRC-011"
                    ]
                  },
                  {
                    "id": "de-record-granularity",
                    "name": "Record granularity",
                    "description": "Declared unit of record (subject-occasion, subject-criteria-set, campaign item).",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
