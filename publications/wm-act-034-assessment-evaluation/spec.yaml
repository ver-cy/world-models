  "model": {
    "registry_id": "vr.wm-act-034",
    "model_id": "WM-ACT-034",
    "name": "Assessment / Evaluation",
    "entry_kind": "aggregate",
    "purpose": "Give an agent the context needed to understand, create, inspect and operate an assessment or evaluation record: what was assessed, against which criteria at which version, by which method, on what evidence, yielding which criterion outcomes, scores, composite result and stated conclusion, with declared validity, assurance, lifecycle, disclosure and interoperability.",
    "scope_statement": "Format-neutral structure of a single assessment/evaluation instance and the bindings it carries to reusable definitional components (criteria source, instrument, scale, decision rule). It spans framing and scoping, criteria binding and tailoring, method and execution parameters, evidence and observation capture, criterion-level determination, aggregation, conclusion and validity, assurance of assessor competence and impartiality, and record lifecycle, disclosure, retention referral and external projection. It is subject-domain agnostic and applies equally to conformity assessment, security control assessment, accessibility evaluation, educational measurement, clinical risk assessment and peer review. It is modelled as an aggregate because the assessment act, its inputs and its determinations share one identity boundary and one finalisation event.",
    "in_scope": [
      "Identity, granularity and versioning of an assessment record and its supersession chain",
      "Assessment type, stakes, mandate, scheme reference and first/second/third-party relationship",
      "Subject reference, pinned assessed state, scope boundary, sampling and generalisation limits",
      "Binding of criteria to a named catalogue at a pinned version, plus selection, tailoring and interpretation notes",
      "Declared method, mode, depth and coverage, and the instrument or rubric that operationalises each criterion",
      "Execution parameters needed for reproducibility: tool and model references, versions, configuration, input snapshots",
      "Evidence item references, criterion linkage, sufficiency, admissibility and confidentiality qualifiers",
      "Observation records with distinct event and recording times, plus declared uncertainty and traceability pointers",
      "Criterion-level outcomes, rationale, severity and locators; raw, normalised and maximum scores",
      "Aggregation model, weighting, composite score or level, and result-vector expression",
      "Conclusion statement, decision authority, qualifications, dissent, validity window and surveillance obligations",
      "Assessor identity and roles, competence and authorisation references, impartiality and conflict declarations",
      "Independent review, moderation, rater agreement, and validity/reliability/fairness evidence for the instrument",
      "Record state machine, correction, appeal and supersession; disclosure classification, redaction and retention referral",
      "Crosswalks and vocabulary bindings for projection into external assessment reporting formats"
    ],
    "out_of_scope": [
      "Internal structure, lifecycle and state management of the assessed subject itself",
      "Authoring, versioning, publication and normative interpretation of the criteria catalogue or standard",
      "Runtime execution and orchestration of testing tools, scanners, graders or evaluator engines and their operational telemetry",
      "Issuance, signing, suspension, withdrawal and verification of certificates, credentials or attestations",
      "Enforcement of consequences: certification decisions with legal effect, licensing, sanction, market withdrawal or remediation workflow",
      "Identity management, employment and qualification records of persons and organisations",
      "Physical or digital custody, storage and chain-of-custody execution for evidence objects",
      "Calibration programmes, metrological traceability management and instrument maintenance",
      "Training, validation and deployment lifecycle of predictive or generative scoring engines",
      "Platform audit-trail and access-log semantics, storage and evaluation",
      "Execution of retention, destruction, transfer or erasure actions",
      "Risk register lifecycle, risk treatment and plan-of-action-and-milestones case management",
      "Population-level aggregation of many assessments into reputation scores or league tables",
      "Commercial terms, scheduling and cost accounting of assessment services"
    ],
    "boundary_notes": [
      {
        "neighbor": "Measurement / observation model",
        "distinction": "An assessment consumes measured or observed values as evidence and adds criterion-referenced judgement; a bare measured value with an uncertainty statement is a measurement result, not an assessment. Units, uncertainty evaluation and calibration traceability are referenced from the metrology model.",
        "source_refs": [
          "SRC-015",
          "SRC-007"
        ]
      },
      {
        "neighbor": "Criteria / requirement catalogue model",
        "distinction": "This model carries a criterion reference, its pinned catalogue version, local applicability and interpretation notes only. Criterion text, structure, normative status and catalogue lifecycle belong to the catalogue, exactly as OSCAL separates a control catalogue from assessment results and XCCDF separates a Benchmark from a TestResult.",
        "source_refs": [
          "SRC-002",
          "SRC-004",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Attestation / certificate / credential model",
        "distinction": "ISO/IEC 17000 separates determination and review from decision and from attestation. This model ends at the recorded conclusion; issuing, signing, suspending or revoking a certificate or credential is a downstream act, and in EU product law only a designated notified body may give that act legal effect.",
        "source_refs": [
          "SRC-001",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Evaluator or test-execution engine",
        "distinction": "EARL records the assertor and the test mode as attributes of an assertion, and XCCDF records the checking system as a reference. Naming a tool, its version and its configuration never transfers ownership of running that tool, its scheduling, or its operational logs.",
        "source_refs": [
          "SRC-005",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Risk register and treatment model",
        "distinction": "OSCAL keeps observations, findings and risks distinct and hands risks onward to a POA&M. This model may produce findings that seed risks, but risk characterisation lifecycle, mitigating factors, remediation tracking and deadlines belong to the risk model.",
        "source_refs": [
          "SRC-002"
        ]
      },
      {
        "neighbor": "Party, competence and accreditation registry",
        "distinction": "Assessor identity, competence evidence, accreditation and designation scope are referenced by identifier and version. Whether a body is accredited or notified, and for what scope, is asserted and maintained by the accreditation authority, not by an assessment record.",
        "source_refs": [
          "SRC-011",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Provenance and audit-trail models",
        "distinction": "Content provenance (which agent produced which determination, from which evidence, when) is mixed in from a PROV-aligned model and retained. Platform-level record access and change logging is a separate audit model whose storage and evaluation this model does not own.",
        "source_refs": [
          "SRC-006"
        ]
      },
      {
        "neighbor": "Records retention and disposition model",
        "distinction": "This model declares a retention class, a retention trigger event and a legal-hold flag, and records the referral. Setting periods and executing destruction, transfer or erasure is owned by the adopting Dimension's records policy.",
        "source_refs": [
          "SRC-012",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Aggregate rating / reputation model",
        "distinction": "schema.org AggregateRating rolls many individual ratings into counts and averages across a population. That population-level statistic is a sibling concern; this model bounds one assessment occasion on one declared subject and scope.",
        "source_refs": [
          "SRC-014"
        ]
      },
      {
        "neighbor": "Assessment programme / scheme model",
        "distinction": "A conformity assessment scheme, examination programme or continuous-monitoring programme defines recurring rules, cycles and eligibility. This model references the scheme and carries the parameters it fixed for this occasion; the scheme's own rules and cycle belong to the programme model.",
        "source_refs": [
          "SRC-012",
          "SRC-010"
        ]
      }
    ]
  },
