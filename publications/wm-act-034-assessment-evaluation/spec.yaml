  "functions": [
    {
      "id": "fn-frame-assessment",
      "name": "Frame the assessment",
      "description": "Open an assessment record by fixing its identity, type, mandate, subject reference, pinned subject state, scope boundary and sampling design.",
      "inputs": [
        "Subject reference from the owning domain model",
        "Assessment type and consequence class",
        "Scheme, mandate or engagement reference",
        "Proposed scope statement and sampling design"
      ],
      "outputs": [
        "Assessment record in draft state with an authoritative identifier",
        "Declared scope, exclusions and sampling design",
        "Pinned subject state descriptor"
      ],
      "preconditions": [
        "The subject is identified and resolvable in a referenced domain model",
        "A mandate, scheme or engagement basis is recorded",
        "An accountable assessment owner is named"
      ],
      "effects": [
        "Creates the record identity and its granularity declaration",
        "Fixes the assessed boundary and the generalisation limit for everything recorded afterwards",
        "Does not alter the subject or its state, which remain owned by the subject-domain model"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-002",
        "SRC-007"
      ]
    },
    {
      "id": "fn-bind-criteria",
      "name": "Bind criteria at version",
      "description": "Resolve the criteria source, pin its version, select the applicable criteria, record not-applicable justifications and any additions, and retain the binding so results stay reproducible.",
      "inputs": [
        "Criteria source reference",
        "Requested profile or selection basis",
        "Tailoring decisions with justifications"
      ],
      "outputs": [
        "Version-pinned criterion binding set",
        "Not-applicable list with justifications",
        "Retained snapshot or digest of the bound criteria"
      ],
      "preconditions": [
        "The criteria source resolves at a stated version",
        "Authority exists for any criterion added beyond the source"
      ],
      "effects": [
        "Makes every later determination addressable to a specific criterion at a specific version",
        "Freezes the binding against later catalogue changes",
        "Does not author, version or publish criteria, which remain owned by the catalogue model"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-004",
        "SRC-010"
      ]
    },
    {
      "id": "fn-declare-method-scale-and-rule",
