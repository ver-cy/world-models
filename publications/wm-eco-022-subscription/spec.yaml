    "entry_kind": "aggregate",
    "purpose": "Represent one governed recurring commercial relationship so agents can understand who subscribes to which plan, which items and entitlements recur, how billing and renewal operate, what usage and service evidence exists and how cancellation progresses without confusing the subscription with its contract, invoices, payments or service instances.",
    "scope_statement": "Owns subscription identity, versions, profile and lifecycle; provider, subscriber, payer, beneficiary and administrator references; external contract, account, order, catalogue, offering, service and entitlement bindings; plan versions, items, add-ons, bundles, seats, assignments and dependencies; permissions, limits, usage allowances, rollover and overage references; recurring, one-time, seat, usage and tiered price rules; currencies, taxes, discounts, credits, proration and refunds; billing anchors, recurrence, periods, invoice and payment references; trial, activation, service, pause, suspension, grace and reactivation observations; term, renewal, notice, consent, cancellation and termination assertions; usage, quality, support, provenance, validation, privacy, retention and loss-aware projections. External agreement, party, product, entitlement, order, invoice, payment, usage, service, support and records masters remain authoritative.",
    "in_scope": [
      "Subscription identity, versions, profiles, participants, plan bindings, items, seats, beneficiaries, entitlements, usage allowances and constraints",
      "Recurring economics, billing and renewal schedules, invoice and payment references, service and usage evidence, lifecycle, notices, cancellation, validation, access, retention and projections"
    ],
    "out_of_scope": [
      "Owning Contract, Party, Account, Product, Service Offering, Entitlement, Credential, Order, Invoice, Payment Method, Payment Transaction, Usage Event, Meter Reading, Service Instance, Support Case or Records masters",
      "Treating active, paid, renewed or cancelled status as universal proof of legal validity, service delivery, entitlement, conformity, termination completion or data deletion",
      "Autonomous contract formation, charging, invoicing, plan or price change, entitlement grant or revocation, renewal, cancellation, termination, disclosure or physical records disposition"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ECO-006 Commercial Contract",
        "distinction": "The unfrozen parent agreement establishes obligations and legal terms. The subscription is a recurring operational aggregate that references but does not replace the contract.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Plan, product, service and entitlement",
        "distinction": "The plan or offering defines reusable terms, products and services have independent instances, and entitlements are separate grants. The subscription binds versions and observes state.",
        "source_refs": [
          "SRC-004",
          "SRC-005",
          "SRC-006",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Invoice, payment mandate, payment and usage",
        "distinction": "Billing schedules predict or request recurring economics, invoices assert amounts due, payments settle, and usage observations meter consumption; none is the subscription identity.",
        "source_refs": [
          "SRC-004",
          "SRC-007",
