                    "value_kind": "reference",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-009"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "Node identity is pure reference data carried inside every lineage assertion. Materialising it as a separate artifact would create a second, competing dataset record and would duplicate the catalog entry that WM-DAT-001 owns."
              },
              {
                "id": "field-node-identity",
                "name": "Field and column node identity",
                "description": "How a field-level lineage node is identified so that column lineage survives renames and schema evolution, given that column lineage facets key on field name while table formats assign immutable numeric field IDs.",
                "source_refs": [
                  "SRC-006",
                  "SRC-013"
                ],
                "questions": [
