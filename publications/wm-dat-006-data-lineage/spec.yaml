      "The legal anchors used are EU instruments (the AI Act, GDPR and the INSPIRE metadata implementing regulation). Equivalent obligations in other jurisdictions were not enumerated, and the obligation binding register is the intended extension point for them.",
      "BCBS 239 is a supervisory standard whose scope and implementation timetable are set by national supervisors and which primarily binds globally and domestically systemically important banks. Its use here as evidence for governance, reconciliation and manual-workaround control is a generalisation of supervisory expectation, not a claim of universal applicability.",
      "The INSPIRE lineage requirement is cited from a retained-EU-law republication by a national authority; the authentic EU text should be substituted before the citation is relied on in an EU regulatory context.",
      "Time handling assumes RFC 3339 offsets are available from source systems. Systems that record only local civil time, or that change offset across a daylight-saving boundary during a processing window, require an explicit offset resolution rule that this model requires but does not supply.",
      "The identity priority assumes a system of record exists that issues stable identifiers. In estates dominated by file drops and ad hoc extracts, only the third priority is achievable and the resulting weakness must be recorded on each affected node."
