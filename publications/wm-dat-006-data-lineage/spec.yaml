        "rationale": "Lineage discloses schema names, business logic and personal-data footprints, so it is not automatically less sensitive than the data it describes. GDPR imposes storage limitation and erasure duties including informing controllers about copies and replications, while the AI Act and supervisory expectations require provenance documentation to be retained. These pull in opposite directions and must be reconciled explicitly rather than assumed.",
