    "conflicts": [
      "PROV-CONSTRAINTS treats a provenance instance as a consistent history subject to event-ordering constraints, while OpenLineage explicitly permits accumulative, partial and out-of-order events that consumers combine. A store that validates strictly on arrival will reject legitimate late-arriving lineage; this model resolves it by validating after merge and normalisation and by recording ordering violations as violations rather than silently reordering.",
      "INSPIRE and the ISO tradition define lineage as a free-text statement on process history and overall quality, while PROV and OpenLineage define a machine-readable graph. A single lineage field cannot satisfy both. This model requires the obligation binding register to declare the required form and, where both are required, a consistency rule deriving the statement from the graph.",
      "OpenLineage dataset identity is derived from physical location (namespace plus name), whereas this model's identity priority puts the authoritative master-system identifier first. The OpenLineage documentation itself warns that switching a namespace format disconnects existing lineage nodes, confirming the fragility; this model resolves the conflict by treating location-derived names as retained bindings rather than as identity.",
      "Table formats assign field IDs that are unique and immutable under rename, while the column lineage facet keys input and output fields by name. A rename therefore preserves lineage in the table format but breaks it in the exchange format unless a rebinding is recorded. This model requires both a stable field identifier and the observed name.",
      "GDPR storage limitation and the right to erasure, including the duty to inform other controllers about copies and replications, pull toward removing lineage records, while AI Act technical documentation and supervisory expectations on risk data pull toward retaining them. The retrieved sources do not resolve this; this model resolves it operationally through tombstoning and field-level redaction and by requiring the conflict to be documented, which is a design decision and not a conformance claim.",
      "DCAT offers both a narrative dcterms:provenance statement and structured prov:wasGeneratedBy links for the same resource, with no rule preventing them from disagreeing. This model requires the narrative form to be derived from the structured form when both are published."
