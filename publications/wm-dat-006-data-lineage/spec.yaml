    "adversarial_checks": [
      "Checked every bundle, layer, finding and function against the WM-DAT-005 relation rationale. Run states appear only as a carried read-only outcome inside run-reference-binding, with an explicit non-ownership statement; no finding models scheduling, retries, task dependency resolution or run state transitions, and no function triggers or controls execution.",
      "Checked every node against the WM-DAT-001 relation rationale. Dataset and field findings hold references, version pins and observed names only. An earlier draft carried a schema description finding; it was removed because it reproduced the dataset schema, and the residual need is met by a cached binding with an observation time plus a boundary note.",
      "Checked that no finding or function claims audit-trail ownership. Access audit requirements are written as obligations discharged by the logging and audit-record model, and the disclosure finding produces no access-decision record, because a reference to an audit record does not transfer audit semantics.",
