  "model": {
    "registry_id": "vr.wm-dat-006",
    "model_id": "WM-DAT-006",
    "name": "Data Lineage",
    "entry_kind": "pattern",
    "purpose": "Provide a format-neutral, composable pattern for asserting, evidencing and governing how datasets and their fields were derived from other datasets and fields through processing activities, so that an agent can reconstruct derivation paths, perform impact analysis and evidence provenance obligations.",
    "scope_statement": "WM-DAT-006 models the lineage assertion itself: the identity of the nodes it connects (dataset, distribution, field, activity, run, agent), the derivation edge and its transformation characterisation, the time and version bindings that make the assertion interpretable, the evidence and capture method that make it falsifiable, and the governance of the lineage record. Per the known-relation ledger it is a pattern composed into WM-DAT-001 (Dataset) and WM-DAT-005 (Pipeline); it carries references and bindings to datasets, jobs and runs but never reproduces their definition, schema, orchestration, execution or run lifecycle. It is storage- and interface-neutral: property graphs, event streams, catalog tables, RDF, JSON documents and narrative statements are projections of the same semantics.",
    "in_scope": [
      "Identity and resolution of lineage nodes: dataset, distribution, field or column, processing activity, run reference and responsible agent",
      "Derivation edges between nodes, including direct and indirect field-level dependency and characterisation of the transformation applied",
      "Granularity declaration (dataset, field, partition or collection level) and the declared perimeter separating observed from opaque segments",
      "Time semantics: event time of derivation versus observation or ingestion time of the assertion, nominal time, and the validity window of an assertion",
      "Version and snapshot pinning of referenced dataset states, and continuity of lineage across schema change",
      "Capture method, producer, confidence grading and supporting evidence for each assertion, including provenance of the lineage record itself",
      "Structural validation of the lineage instance and measurement of lineage coverage and reconciliation against declared sources",
      "Sensitivity classification, disclosure scoping requirements, retention and disposition of lineage records",
      "Alignment crosswalks and exchange payload contracts for interchange with PROV, OpenLineage and DCAT consumers"
    ],
    "out_of_scope": [
      "Dataset definition, schema authoring, distribution publication and catalog lifecycle, which are owned by WM-DAT-001",
      "Pipeline orchestration, scheduling, task dependency resolution, retry and failure handling, and run state transitions, which are owned by WM-DAT-005",
      "Execution of processing itself; this model records assertions about processing, it does not run or trigger it",
      "Audit-trail and log-record semantics, including tamper-evidence and log retention for regulatory logging obligations, which belong to a logging or audit-record model",
      "Access-control policy evaluation and enforcement; this model declares required scoping and defers evaluation to the access model",
      "Data quality rule definition, profiling and fitness scoring of the data content itself, which belongs to a data quality sibling",
      "Software build provenance and artifact attestation for code and container images",
      "Master data matching, entity resolution of business records, and semantic mapping of business terms",
      "Lineage visualisation, graph query languages and storage engines, which are interface and storage projections"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-DAT-001 Dataset",
        "distinction": "WM-DAT-001 owns what a dataset is: its definition, schema, distributions, classification and catalog lifecycle. WM-DAT-006 carries only a resolvable reference plus a version or snapshot pin to a dataset state, and asserts derivation between such references. A schema description reproduced inside a lineage record is a cached binding, not an authoritative schema.",
        "source_refs": [
          "SRC-009",
          "SRC-004",
          "SRC-013"
        ]
      },
      {
        "neighbor": "WM-DAT-005 Pipeline",
        "distinction": "WM-DAT-005 owns job definition, scheduling, orchestration, run execution and run state transitions such as START, RUNNING, COMPLETE, ABORT and FAIL. WM-DAT-006 records the run identifier and job reference under which a derivation was observed, plus the terminal outcome as a carried attribute for interpreting completeness; it does not model, drive or validate the run lifecycle.",
        "source_refs": [
          "SRC-007",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Logging and audit-record model",
        "distinction": "Regulatory logging obligations require automatic recording of events over the lifetime of a system. Lineage may be an input to such records but does not own log capture, tamper-evidence, log retention or audit-trail semantics; a reference to an audit record never transfers those semantics to this model.",
        "source_refs": [
          "SRC-010",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Software build provenance (SLSA)",
        "distinction": "SLSA provenance attests how a software artifact was built, covering build definition, resolved dependencies and builder identity. It does not describe dataset or field derivation. WM-DAT-006 may reference a build attestation as evidence for the code version of a processing activity, but the two provenance graphs are distinct and must not be merged into one node space.",
        "source_refs": [
          "SRC-014"
        ]
      },
      {
        "neighbor": "Data quality management",
        "distinction": "Quality of the data content (accuracy, completeness of values, conformance to rules) is a sibling concern. WM-DAT-006 owns only quality of the lineage assertion: capture method, confidence, coverage and reconciliation status. Quality metric facets attached to a dataset in an exchange payload are carried references to the quality model.",
        "source_refs": [
          "SRC-012",
          "SRC-008"
        ]
      },
      {
        "neighbor": "Access control and data classification model",
        "distinction": "WM-DAT-006 declares that a lineage record has a sensitivity classification and which disclosure scopes apply, because lineage exposes schema names, business logic and personal-data footprints. Evaluation and enforcement of the resulting access decision, and any enforcement audit trail, remain with the access-control model.",
        "source_refs": [
          "SRC-011",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Catalog and discovery (DCAT)",
        "distinction": "DCAT owns catalog records, publication and discovery of datasets and dataset series. WM-DAT-006 aligns to DCAT provenance and versioning terms for interchange but does not own catalog entries, publisher metadata or distribution access URLs.",
        "source_refs": [
          "SRC-009"
        ]
      }
    ]
  },
