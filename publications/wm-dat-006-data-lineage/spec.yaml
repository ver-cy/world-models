  "structure": {
    "bundles": [
      {
        "id": "subject-identity-and-perimeter",
        "name": "Lineage Subject Identity and Perimeter",
        "description": "What a lineage assertion is about: the identity and resolution of the dataset, field, activity and agent nodes it connects, and the declared granularity and coverage perimeter of the lineage graph.",
        "rationale": "Every provenance standard reviewed is identifier-first: PROV requires typed identified objects, OpenLineage identity is namespace plus name for datasets and a client-generated UUID for runs, and Iceberg gives immutable field IDs. Lineage that cannot resolve its endpoints is unusable, and a graph whose perimeter is undeclared silently misleads impact analysis.",
        "source_refs": [
          "SRC-001",
          "SRC-003",
          "SRC-004",
          "SRC-005",
          "SRC-013"
        ],
        "layers": [
          {
            "id": "node-identity",
            "name": "Node Identity and Resolution",
            "description": "Identity rules for the four node kinds a lineage edge can touch: dataset or distribution, field, processing activity, and responsible agent.",
            "source_refs": [
              "SRC-001",
              "SRC-002",
              "SRC-004",
              "SRC-005",
              "SRC-013"
            ],
            "findings": [
              {
                "id": "dataset-node-identity",
                "name": "Dataset and distribution node identity",
                "description": "How a lineage node that stands for a dataset or one of its physical distributions is identified, bound to a location-derived name, and resolved to the authoritative dataset record held by WM-DAT-001.",
                "source_refs": [
                  "SRC-004",
                  "SRC-005",
                  "SRC-009",
                  "SRC-013"
                ],
                "questions": [
                  {
                    "id": "dni-q1",
                    "text": "Which authoritative master-system identifier identifies the dataset this node stands for, and which system of record issued it?",
                    "kind": "identity",
                    "answer_data": [
                      "Master-system dataset identifier value",
                      "Issuing system-of-record reference",
                      "Identifier scheme or type code"
                    ]
                  },
                  {
                    "id": "dni-q2",
                    "text": "What location-derived binding (namespace and name) is recorded for this node, and under which source-type convention was it constructed?",
                    "kind": "interoperability",
                    "answer_data": [
                      "Namespace string",
                      "Name string",
                      "Source-type convention code such as postgres, s3, bigquery or snowflake"
                    ]
                  },
                  {
                    "id": "dni-q3",
                    "text": "Does this node denote the abstract dataset or one specific distribution or physical materialisation of it?",
                    "kind": "classification",
                    "answer_data": [
                      "Node level code: dataset, distribution, or materialisation",
                      "Reference to the parent dataset node when the node is a distribution"
                    ]
                  },
                  {
                    "id": "dni-q4",
                    "text": "How is a node re-resolved when the dataset is renamed, relocated or its namespace convention changes?",
                    "kind": "exception",
                    "answer_data": [
                      "Alternate or symlink identifier set",
                      "Resolution rule reference",
                      "Effective observation time of the rebinding"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "dni-master-id",
                    "name": "Dataset master identifier",
                    "description": "Authoritative identifier issued by the system of record for the referenced dataset, such as a catalog table UUID.",
                    "value_kind": "identifier",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-013",
                      "SRC-004"
                    ]
                  },
                  {
                    "id": "dni-namespace-binding",
                    "name": "Location-derived name binding",
                    "description": "Namespace and name pair constructed under a declared source-type convention, retained as a resolvable binding rather than as primary identity.",
                    "value_kind": "object",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-005"
                    ]
                  },
                  {
                    "id": "dni-node-level",
                    "name": "Node level",
                    "description": "Whether the node denotes an abstract dataset, a distribution, or a concrete materialisation.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-009"
                    ]
                  },
                  {
                    "id": "dni-dataset-ref",
