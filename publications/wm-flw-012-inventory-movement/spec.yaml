    "scope_statement": "Owns movement identity and revision; assertion kind, class, direction and reason; idempotency and correction lineage; item, lot, serial and handling-unit scope references; qualified quantity; source and destination position, location, owner, custodian, status and disposition references; request, order, reservation, task, production and shipment triggers; lifecycle and clocks; execution observations; external authoritative posting references; exceptions, reconciliation, provenance, access, retention and loss-aware projections. Product, lot, serial, handling unit, location, stock position and balance, order, warehouse task, production, shipment, journey, chain of custody, ledger, valuation, accounting, document, observation, incident and evidence masters remain external.",
    "in_scope": [
      "Movement identity, class, assertion kind, revision, idempotency, direction, reason and successor lineage",
      "Stock-subject scope, qualified quantity, source-destination and stock-bucket transition references, triggers, execution and posting assertions",
      "Lifecycle clocks, evidence, exceptions, reconciliation, governance, access, retention and interoperability"
    ],
    "out_of_scope": [
      "Owning product, material, lot, serial, handling unit, place, inventory position, stock balance, order, reservation, task, production, shipment, journey, trace, ledger, valuation, accounting, document, observation, incident or evidence lifecycles",
      "Equating request with execution, physical movement with posting, custody with ownership, location with stock status, position with movement, count discrepancy with adjustment or shipment milestone with inventory receipt",
      "Executing warehouse operations, inventory ledger mutation, accounting posting, autonomous physical handling, safety decisions, protected disclosure or irreversible deletion"
    ],
