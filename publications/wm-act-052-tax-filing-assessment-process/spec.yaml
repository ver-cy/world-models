    "model_id": "WM-ACT-052",
    "name": "Tax Filing / Assessment Process",
    "entry_kind": "aggregate",
    "purpose": "Represent a governed tax filing and assessment case so agents can connect return preparation, validation, declaration, submission, authority determination, settlement references and dispute without treating any transport or workflow state as proof of legal finality or payment.",
    "scope_statement": "Owns one filing-and-assessment case identity for a defined taxpayer reference, tax type, jurisdiction and period; return composition and source lineage; calculation and validation results; declaration, submission and acknowledgement links; self-assessed and authority-determined positions; adjustments, notice and liability references; settlement, penalty and dispute links; and correction lineage. Taxpayer, registration, account, obligation, law, form, source document, ledger, evidence, payment, refund, penalty, audit, examination, dispute, collection, enforcement, adjudication, provenance, access audit and record masters remain external.",
    "in_scope": [
      "Case identity and tax scope; return, schedule and attachment composition; source lineage, calculations, validations, declaration, submission and acknowledgement",
      "Self-assessment, authority assessment and adjustment context; notice and liability references; payment, refund, penalty and dispute links; correction, privacy, retention and loss-aware projections"
    ],
    "out_of_scope": [
      "Creating or changing taxpayer, tax account, obligation, law, form, source record, payment, refund, penalty, examination, dispute, collection, enforcement or court masters",
      "Equating receipt with acceptance, acceptance with processing, self-assessment with authority assessment, payment with full satisfaction, or notice with finality",
      "Providing tax advice, signing or filing without authority, moving money, deciding an assessment or appeal, or destructively handling tax evidence"
    ],
    "boundary_notes": [
      {
        "neighbor": "Taxpayer, registration, tax account, obligation and law models",
        "distinction": "These masters retain authoritative identity and lifecycle. The case stores typed, versioned references and a bounded filing scope without rewriting them.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-004",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Return, schedule, attachment, declaration, submission and acknowledgement",
        "distinction": "Each record has independent identity, authority, status and time. A technical receipt is not a legal acceptance or assessment.",
        "source_refs": [
          "SRC-005",
          "SRC-006",
          "SRC-007",
          "SRC-008",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Audit, examination, assessment, collection, enforcement and adjudication",
        "distinction": "Specialist processes own selection, evidence gathering, decisions and enforcement. This aggregate records links, notices, amounts, reasons, deadlines and status intake.",
        "source_refs": [
          "SRC-001",
          "SRC-003",
          "SRC-017"
        ]
      },
      {
        "neighbor": "Payment, refund, interest and penalty models",
        "distinction": "Authoritative financial systems own money movement and balances. The case stores typed allocation and status references without inferring universal satisfaction.",
        "source_refs": [
          "SRC-007",
          "SRC-008",
          "SRC-017"
        ]
      },
      {
        "neighbor": "Dispute and appeal models",
