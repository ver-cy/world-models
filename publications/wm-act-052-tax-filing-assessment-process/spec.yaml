    "dimension": {
      "owner_package_requirements": [
        "Dimension owner and tax-data mandate",
        "Authoritative taxpayer, registration, account, obligation, law, form, source-document, ledger, evidence, payment, refund, penalty, audit, assessment, dispute, collection, provenance, access-audit and record registries",
        "Approved jurisdiction, tax type, filing season, schema, business-rule, signature, currency, privacy, retention and interoperability profiles",
        "Legal interpretation, representation, signing, submission, payment, dispute, disclosure and agent-operation policies"
      ],
      "namespace_guidance": "Mint case, return, schedule, attachment, calculation, validation, declaration, submission, acknowledgement, assessment, notice, allocation, dispute, correction, disclosure and event IDs; preserve authoritative master and authority identifiers.",
      "registry_links": [
        "https://ver.cy/models/",
        "https://ver.cy/model-agent-protocol.md"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Canonicalize each case and constituent by authoritative master-system identifier, tax administration and record kind; never by taxpayer, period, form, date, amount or status alone.",
        "Keep return, schedule, attachment, declaration, submission, acknowledgement, assessment notice, liability, payment, refund, penalty and dispute independently identifiable."
      ],
      "patch_rules": [
        "Extensions declare jurisdiction, tax type, filing season, form, schema, business-rule, signature, privacy, retention and interoperability effects.",
        "Released returns, submissions, acknowledgements, assessments, notices, allocations and dispute records are immutable; corrections create linked successors.",
        "Never silently change taxpayer, obligation, period, source values, calculation, declaration, signature, status, amount, reason, deadline, authority or provenance."
      ],
      "compatibility_rules": [
        "Ignore additive fields only when identity, tax scope, record kind, source, authority, status, time, evidence and provenance survive.",
        "Every projection pins jurisdiction, tax type, filing season, form, schema, business rules, signature profile and code-list versions and declares information loss."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative tax-administration or master-system identifier for each case, return, submission, acknowledgement, assessment, liability, payment, refund, penalty, dispute or notice, qualified by administration and record kind.",
        "Governed globally resolvable tax-record IRI.",
        "Dimension UUID when neither preceding identifier exists."
      ],
      "timestamp_rule": "Use RFC 3339 timestamps with seconds and explicit offset or Z; distinguish tax period, source effective, due, signed, submitted, postmarked, received, acknowledged, accepted, processed, assessed, served, paid, appealed, recorded, ingested and knowledge times whenever they differ.",
      "serial_naming_rule": "Use {case-id}--{return-submission-acknowledgement-assessment-payment-dispute-or-assertion-id}--{artifact-kind}--{revision-id}.",
      "integrity_rule": "Store digest, media type, record kind, tax scope, form and rule versions, actor, authority, event and knowledge times, status, access marking and provenance."
    },
    "policies": [
      "The aggregate does not own Taxpayer, Registration, Tax Account, Tax Obligation, Law, Form, Source Document, Ledger, Evidence, Payment, Refund, Penalty, Audit, Examination, Dispute, Collection, Enforcement, Adjudication, Provenance, Access Audit or Record masters.",
      "Technical validation, business validation, transmission receipt, filing acceptance, processing, self-assessment, authority assessment, payment and dispute outcome remain separate assertions.",
      "Receipt does not prove validity or acceptance; acceptance does not prove assessment finality, payment, absence of penalties or dispute resolution.",
      "Agents cannot give tax advice, sign declarations, file returns, initiate payments, change authority decisions, waive appeal rights, disclose tax data or dispose records outside explicit delegated authority."
    ],
    "crud": {
      "read": [
        "Resolve purpose, case head, taxpayer and obligation references, tax scope, versions, source lineage, calculations, validations, declaration, submission, responses, assessment, settlement links, dispute, holds and projection loss."
