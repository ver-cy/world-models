      "Alignment to an external framework is recorded as an alignment, never as certified conformance, unless a conformity-assessment record from a competent body is attached to the claim.",
      "Hazardous-capability and exploit-enabling detail is stored under a restricted sensitivity label with a documented redaction rule applied before any distribution beyond the authorised recipient list.",
