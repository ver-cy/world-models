    "canon_and_patch": {
      "canonicalization_rules": [
        "The canonical form is the format-neutral record graph. JSON, YAML, Markdown, HTML, Git objects, MCP resources and MongoDB documents are projections and must round-trip without semantic loss.",
        "All time values canonicalise to RFC 3339 with seconds and an explicit offset or Z; durations canonicalise to ISO 8601 durations and are never substituted for an offset.",
        "Numeric result values canonicalise together with their declared precision and rounding convention; a five-significant-figure round-to-even profile is acceptable where the adopting Dimension declares it.",
        "Identifiers canonicalise to trimmed lower-case strings compared by exact match; no identifier is derived from a date, a file name or a display label.",
        "Sensitivity labels, state codes and severity codes canonicalise against the Dimension's published code lists, with unmapped values rejected rather than silently coerced."
      ],
      "patch_rules": [
        "Registered protocols, run records, sealed evidence packages and signed decisions are append-only; corrections create a new version that references the superseded record.",
        "A score change must retain the original value, the new value, the scorer version, the actor and the reason, and must recompute every dependent aggregate and flag affected published reports.",
        "Any change to an acceptance threshold after results are known requires a change record naming the authoriser and stating explicitly that results were already observed.",
        "State transitions are recorded as appended entries carrying actor and event time; the current state is a derived projection, not an editable field.",
        "Deletion never removes a reference target silently: it leaves a tombstone carrying the identifier, class, deletion time, authoriser and content digest."
      ],
      "compatibility_rules": [
        "Adding optional data elements, new metric definitions or new alignment declarations is backward compatible.",
        "Changing a metric definition, aggregation rule or threshold semantics is breaking and requires a new metric or threshold identifier, not an in-place redefinition.",
        "Removing or narrowing a declared disaggregation factor is breaking for fairness claims and invalidates comparability with prior rounds; the break must be disclosed in the affected reports.",
        "Alignment declarations may be withdrawn, but withdrawal must be dated, reasoned and reflected in every report version that relied on them.",
        "Consumers must tolerate unknown optional fields and must fail loudly on unknown values in code-list fields that drive access, retention or conformance behaviour."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier issued by the system of record for the entity — the model artefact registry for the evaluation subject, the dataset registry for evaluation data, and the quality or records management system for the evaluation instance, decision and finding.",
        "Governed global identifier or IRI where no master-system identifier exists — for example a PROV-O or JSON-LD IRI, a DOI, or a registry-governed URI under a declared namespace authority.",
        "UUID or ULID minted by the adopting Dimension, recorded together with the minting agent and the minting event time.",
        "A date, a run timestamp, a benchmark name, a file name or a metric score is never an identifier; such values may only be recorded as attributes."
      ],
      "timestamp_rule": "All time values use RFC 3339 with seconds and an explicit UTC offset or Z, for example 2026-08-26T09:15:00Z or 2026-08-26T11:15:00+02:00. Event time (run start, run end, trigger occurrence, seal, decision signature, publication) is recorded separately from observation or ingestion time (when the record reached the evaluation store) whenever the two can differ; where both exist, neither may be inferred from the other. Durations use ISO 8601 durations and never substitute for an offset, and the clock source is recorded where runs span systems.",
      "serial_naming_rule": "Serial artefacts — runs, per-item trace segments, findings, report versions, access-log entries and state transitions — are named <namespace>:<artifact-type>:<stable-parent-key>:<monotonic-sequence>, where the sequence is an opaque counter or ULID scoped to the parent. Human-readable timestamps may appear in file names purely as ordering hints and carry no identity; sequence numbers are never reused, including after withdrawal or deletion.",
      "integrity_rule": "Every artefact carries a content digest, such as SHA-256, recorded in its manifest entry. Sealed evidence packages additionally carry a signature and a seal event time bound to the signatory and their role. Verification is repeated before any submission or publication; a digest mismatch invalidates every downstream conformance claim and dependent decision until the artefact is re-verified or the decision is re-taken, and the mismatch itself is raised as a finding."
    },
    "policies": [
      "No public or downstream claim about capability, safety or quality may exceed what the sealed internal evidence for the cited evidence version supports.",
      "Acceptance thresholds, disaggregation factors and the analysis plan are pre-registered before any result is observed; post-hoc change is permitted only with a dated, authorised change record that discloses that results were known.",
