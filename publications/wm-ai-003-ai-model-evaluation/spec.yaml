    "purpose": "Provide the format-neutral context an agent needs to plan, execute, record, interpret, approve and disclose an evaluation of a specified AI model or system version, and to retain the resulting evidence.",
    "scope_statement": "One evaluation instance: a bounded, protocol-governed measurement applied to a version-pinned AI model or system under a declared configuration, producing runs, results, findings, decisions and retained evidence. The model owns the evaluation record graph and its governance; it references but does not own the dataset, the model artefact, the organisational management system, the risk register or the incident process.",
    "in_scope": [
      "Evaluation mandate, trigger and consuming decision or gate",
      "Binding of the evaluation to a model or system version, configuration and inference settings",
      "Method-class selection (statistical, formal, empirical, human-subject, adversarial) and protocol design",
      "Task and dataset version binding, split discipline, ground-truth definition and contamination control",
      "Metric specification, aggregation, disaggregation factors and pre-registered acceptance thresholds",
      "Human-rater and red-team protocols including threat models and elicitation effort",
      "Run execution records, environment capture, determinism and replication",
      "Result records, per-item evidence, uncertainty and statistical validity",
      "Findings, severity, validity threats and declared limitations",
      "Approval, conditional approval, waiver, rejection and release gating",
      "Re-evaluation triggers, evaluation lifecycle states and cadence",
      "Evidence packaging, integrity, provenance and lineage",
      "Audience-tiered reporting, external and third-party evaluation arrangements",
      "Access control, sensitivity handling, retention, deletion and legal hold",
      "Declared alignments to external frameworks and exchange interoperability"
    ],
    "out_of_scope": [
      "Construction, licensing, annotation and internal structure of evaluation datasets (belongs to the benchmark dataset model)",
      "Model training, fine-tuning, packaging and build provenance of the evaluated artefact (belongs to the model artefact model)",
      "Organisation-wide AI management system policy, competence programme and internal audit programme",
      "Risk identification, treatment selection and residual-risk ownership in a risk register",
      "Serious-incident capture, statutory reporting deadlines and corrective-action workflow",
      "Notified-body conformity assessment, declarations of conformity and certification records",
      "Continuous production telemetry and observability outside a bounded evaluation protocol",
      "Procurement scoring, vendor selection and commercial cost-benefit analysis",
      "Human-subject research ethics approval procedures (referenced, not defined)",
      "Compute infrastructure inventory and capacity management"
    ],
