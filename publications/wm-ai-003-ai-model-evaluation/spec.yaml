        "Dataset binding manifest",
        "Metric definition records",
        "Acceptance criteria",
        "Mandate basis"
      ],
      "outputs": [
        "Registered evaluation protocol version",
        "Pre-registration event time"
      ],
      "preconditions": [
        "Subject identifier resolves in its master system",
        "Dataset version and split are pinned",
        "Thresholds are set by an authorised role"
      ],
      "effects": [
        "Protocol becomes the immutable baseline for the instance",
        "Later changes require a dated, authorised change record",
        "Evaluation instance enters the planned state"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-004",
        "SRC-001",
        "SRC-005"
      ]
    },
    {
      "id": "fn-bind-evaluation-subject",
