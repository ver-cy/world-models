      ],
      "namespace_guidance": "Use one namespace per accountable provider organisation, structured as <org-namespace>/eval/<campaign>/<run>/<artifact>. Local model IDs are stable lower-kebab-case. Instance identifiers must resolve within the owning Dimension, must be opaque with respect to time, and must never encode a date, a benchmark name or a score as identity. Metric identifiers live in a governed metric catalogue; a change in metric semantics forces a new identifier rather than a new version of the old one.",
      "registry_links": [
