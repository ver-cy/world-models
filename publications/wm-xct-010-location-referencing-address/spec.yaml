        "description": "Who may create, change and retire an address, under which numbering rules, through which lifecycle states and temporal versions, and to which object in a sibling model the address is bound.",
        "rationale": "FGDC-STD-016-2011 places Address Authority among lineage attributes and defines Address Lifecycle Status and Address Anomaly Status relative to a governing Address Reference System; ISO 19160-1 makes lifecycle attributes mandatory for lifecycle-conformant classes; INSPIRE separates real-world validity from record version lifespan. Authority, rules, states and binding are therefore not optional metadata but the core of a trustworthy reference.",
