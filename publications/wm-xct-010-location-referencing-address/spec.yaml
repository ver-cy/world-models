  "composition": [
    {
      "target": "Any locatable subject model (host of this mixin)",
      "relation": "MIX-IN",
      "purpose": "Supply address, geographic identifier, position and code-reference capability to any subject that must state where it is, without the host absorbing addressing authority, lifecycle or reference-system semantics.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-005",
        "SRC-003"
      ]
    },
    {
      "target": "Building and structure model (legacy U1)",
      "relation": "REFERENCE",
      "purpose": "Bind addresses to buildings as addressable objects; the address record carries the reference while the building model owns the structure, its geometry and its condition.",
      "required": false,
      "source_refs": [
        "SRC-005",
        "SRC-001"
      ]
    },
    {
      "target": "Premises and spatial unit model (legacy U2)",
      "relation": "REFERENCE",
      "purpose": "Resolve sub-address locators — building, floor, unit, room and seat levels — to spatial units defined and governed by the premises model.",
      "required": false,
      "source_refs": [
        "SRC-005",
        "SRC-009"
      ]
    },
    {
      "target": "Land parcel and cadastre model (legacy P2)",
      "relation": "REFERENCE",
      "purpose": "Bind addresses to parcels where no building stands, and support positional containment tests against parcel geometry, without importing tenure or rights.",
      "required": false,
      "source_refs": [
        "SRC-005",
        "SRC-008"
      ]
    },
    {
      "target": "Administrative units and settlements model (legacy U4)",
      "relation": "REFERENCE",
      "purpose": "Resolve administrative unit name and address area name components to authoritative administrative units and named places rather than repeating their names as free text.",
      "required": true,
      "source_refs": [
        "SRC-005",
        "SRC-007"
      ]
    },
    {
      "target": "Transport network model",
      "relation": "REFERENCE",
      "purpose": "Link thoroughfare names used for addressing to the transport link features that carry centreline geometry and network topology.",
      "required": false,
      "source_refs": [
        "SRC-005"
      ]
    },
    {
      "target": "Public mandate and authority model (legacy A12)",
      "relation": "REFERENCE",
      "purpose": "Resolve the addressing authority and its mandate instrument, jurisdiction extent and effective period, which condition the validity of every assignment act.",
      "required": true,
      "source_refs": [
        "SRC-008",
        "SRC-007"
      ]
    },
    {
      "target": "Party model (person and organisation)",
      "relation": "REFERENCE",
      "purpose": "Supply the addressee and organisation segments needed to render a complete postal address at run time, while keeping party identity outside this model.",
      "required": false,
      "source_refs": [
        "SRC-002"
      ]
    },
    {
      "target": "Geodetic parameter registry (external CRS and coordinate operation authority)",
      "relation": "REFERENCE",
      "purpose": "Resolve coordinate reference systems, datums, epochs and coordinate operations by authority code and dataset version instead of redefining them.",
      "required": true,
      "source_refs": [
        "SRC-004"
      ]
    },
    {
      "target": "ISO 19160-1:2015 Addressing — Part 1: Conceptual model",
      "relation": "ALIGN",
      "purpose": "Align the address record, its components, aliases, lifecycle attributes and metadata with the international conceptual address model, and use its cross-mapping intent as the basis for declared crosswalks rather than assumed equivalence.",
      "required": false,
      "source_refs": [
        "SRC-001"
      ]
    },
    {
      "target": "ISO 19160-4:2023 international postal address components and template language, with UPU S42",
      "relation": "ALIGN",
      "purpose": "Align postal components, sub-elements, rendering rules and country templates; note that S42 Part A and Part B are the operational carrier of country templates.",
      "required": false,
      "source_refs": [
        "SRC-002",
        "SRC-012"
      ]
    },
    {
      "target": "ISO 19112:2019 Spatial referencing by geographic identifiers",
      "relation": "ALIGN",
      "purpose": "Align location types, location instances, gazetteers and complementary coordinate references so that identifier-based referencing is modelled to the same schema as the coordinate-based path.",
      "required": false,
      "source_refs": [
        "SRC-003"
      ]
    },
    {
      "target": "INSPIRE Addresses application schema 4.0 and Regulation (EU) No 1089/2010",
      "relation": "ALIGN",
      "purpose": "Align address component subtypes, locator structure, geographic position specification and the split between real-world validity and record version lifespan with the binding European schema.",
      "required": false,
      "source_refs": [
        "SRC-005",
        "SRC-006",
        "SRC-007"
      ]
    },
    {
      "target": "FGDC-STD-016-2011 United States Thoroughfare, Landmark, and Postal Address Data Standard",
      "relation": "ALIGN",
      "purpose": "Align address classes, lifecycle status values, address authority lineage and the anomaly-against-reference-system concept; treat it as a national profile, not a universal one.",
      "required": false,
      "source_refs": [
        "SRC-008"
      ]
    },
    {
      "target": "IETF RFC 5139 civic location format and NENA-STA-004.2-2024 CLDXF-US",
      "relation": "ALIGN",
      "purpose": "Align civic address element decomposition for emergency location exchange, and adopt the documented FGDC-to-CLDXF crosswalk pattern as evidence that mappings must be maintained explicitly.",
      "required": false,
      "source_refs": [
        "SRC-009",
        "SRC-019"
      ]
    },
    {
      "target": "IETF RFC 7946 GeoJSON",
      "relation": "ALIGN",
      "purpose": "Constrain the position projection: WGS 84 in decimal degrees, longitude before latitude, cut antimeridian geometries, and avoid publishing precision beyond what accuracy supports.",
      "required": false,
      "source_refs": [
        "SRC-010"
      ]
    },
    {
      "target": "IETF RFC 3339 timestamps",
      "relation": "ALIGN",
      "purpose": "Fix the encoding of every timestamp in the model, including the explicit-offset requirement and the -00:00 convention for an unknown local offset.",
      "required": true,
      "source_refs": [
        "SRC-011"
      ]
    },
    {
      "target": "W3C and OGC Spatial Data on the Web Best Practices",
      "relation": "ALIGN",
      "purpose": "Adopt persistent identifiers for spatial things, declared coordinate reference systems, described positional accuracy, published validation schemas, change information for spatial things, and responsible interaction with spatial data.",
      "required": false,
      "source_refs": [
        "SRC-014"
      ]
    },
    {
      "target": "Open Location Code specification",
      "relation": "EXTEND",
      "purpose": "Extend the model's reference kinds with an openly specified, offline-reversible code scheme for places without civic addresses, while recording that shortened codes are not self-contained identifiers.",
      "required": false,
      "source_refs": [
        "SRC-017"
      ]
    },
    {
      "target": "UNGEGN national names authorities and standardised names lists",
      "relation": "ALIGN",
      "purpose": "Align toponym language, script, romanisation and standardisation status with nationally standardised names, and treat names authority decisions as the authority for official display forms.",
      "required": false,
      "source_refs": [
        "SRC-018"
      ]
    }
  ],
  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "An adopting Dimension must name a single accountable address registrar or reference-data steward, and record the mandate instrument, jurisdiction extent and effective period that authorise assignment and retirement within its scope.",
        "It must declare, per territory it operates in, the governing address specification profile, the address reference systems in force, the coordinate reference systems and their dataset versions, and the gazetteers it treats as custodian of record — each by identifier and version, not by name alone.",
        "It must publish its validation rule set, its crosswalks with versions and known losses, its licence and access conditions, and its retention and suppression rules before publishing any address, position or place record."
      ],
      "namespace_guidance": "Use a stable namespace for this model that separates the reference (address, thoroughfare, geocode, reference system, location instance, place, toponym) from the referent, so that a host subject can carry a location reference without inheriting its namespace. Identifiers minted by the Dimension must be namespaced by issuing register and never reuse a retired value; identifiers imported from an external authority keep that authority's namespace and are recorded as alternative identifiers rather than rewritten. Territory-specific profiles belong in sub-namespaces so that two national profiles can coexist without collision.",
      "registry_links": [
