  "functions": [
    {
      "id": "assign-address",
      "name": "Assign address",
      "description": "Create a new address record binding an address to an addressable object under a governing address reference system, producing an authority decision and an initial lifecycle status.",
      "inputs": [
        "Addressable object reference and owning model",
        "Governing address reference system identifier",
        "Proposed locator designators and components",
        "Basis evidence reference"
      ],
      "outputs": [
        "Address record with identifier and lifecycle status",
        "Assignment decision record",
        "Address assigned event"
      ],
      "preconditions": [
        "The acting authority holds a mandate in force covering the object's location",
        "The proposed designator passes the numbering rules of the governing reference system",
        "The addressable object is resolvable in its owning model"
      ],
      "effects": [
        "A new address identifier is issued and made resolvable",
        "Lifecycle status is set and status change time recorded in RFC 3339",
        "A new record version is opened in the register change log"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-005",
        "SRC-008"
      ]
    },
    {
      "id": "retire-address",
      "name": "Retire address",
      "description": "Withdraw an address from current use while retaining it for historical resolution, optionally linking to a superseding address.",
      "inputs": [
        "Address identifier",
        "Reason code",
        "Superseding address reference where applicable",
        "Effective time"
      ],
      "outputs": [
        "Updated address record with retired status",
        "Retirement decision record",
        "Address retired event"
      ],
      "preconditions": [
        "The address exists and is not already retired",
        "The acting authority is competent for the address's jurisdiction",
        "Any dependent sub-addresses have a declared cascade outcome"
      ],
      "effects": [
        "Lifecycle status becomes retired and validity end time is set",
        "Historic resolution remains available for the declared retention period",
        "Downstream consumers are notified through the change log"
      ],
      "source_refs": [
        "SRC-008",
        "SRC-005",
        "SRC-001"
      ]
    },
    {
      "id": "validate-address",
      "name": "Validate address",
      "description": "Test an address record against its governing specification profile and address reference system, returning per-test results and an anomaly status where it fails.",
      "inputs": [
        "Address record version",
        "Governing specification profile and version",
        "Address reference system definition",
        "Validation rule set version"
      ],
      "outputs": [
        "Per-test pass or fail results",
        "Anomaly status where applicable",
        "Validation evidence with execution timestamp"
      ],
      "preconditions": [
        "The governing profile and reference system are resolvable",
        "The published validation rule set version is known"
      ],
      "effects": [
        "Anomaly status is set or cleared on the record",
        "A test execution record is retained against the specific record version",
        "Defects are routed to the responsible steward"
      ],
      "source_refs": [
        "SRC-008",
        "SRC-014",
        "SRC-001"
      ]
    },
    {
      "id": "render-postal-address",
      "name": "Render postal address",
      "description": "Apply a destination country template to stored address components to produce ordered, formatted output lines for postal use.",
      "inputs": [
        "Address record",
        "Destination country template and version",
        "Rendering context parameters",
        "Addressee segment supplied by the party model"
      ],
      "outputs": [
        "Ordered rendered output lines",
        "Applied template reference and version",
        "Report of components that had no target"
      ],
      "preconditions": [
        "A template exists for the destination country at a known version",
        "Mandatory components required by the template are present"
      ],
      "effects": [
        "A rendered representation is produced and may be cached with its template version",
        "Unmapped components are disclosed rather than dropped silently"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-012",
        "SRC-013"
      ]
    },
    {
      "id": "parse-address",
      "name": "Parse address string",
      "description": "Decompose an unstructured address string into typed components and locators under a declared country profile, retaining the original string.",
      "inputs": [
        "Unstructured address text",
        "Assumed country and language or script",
        "Parser rule set version"
      ],
      "outputs": [
        "Typed component and locator set",
        "Parse confidence and unparsed residue",
        "Original string retained verbatim"
      ],
      "preconditions": [
        "A parsing profile exists for the assumed country",
        "Character encoding and script of the input are known or detectable"
      ],
      "effects": [
        "A structured candidate is produced for matching or validation",
        "Residue and low confidence are surfaced instead of being discarded"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-009",
        "SRC-013"
      ]
    },
    {
      "id": "geocode-address",
      "name": "Geocode address",
      "description": "Resolve a structured or unstructured address to one or more reference records and positions, returning scored candidates rather than a forced single answer.",
      "inputs": [
        "Address input or parsed components",
        "Reference dataset identifier and version",
        "Acceptance threshold"
      ],
      "outputs": [
        "Matched address reference and position",
        "Match score, match type and matched component set",
        "Candidate set when ambiguous"
      ],
      "preconditions": [
        "The reference dataset version is available and its licence permits the use",
        "Normalisation rules for the territory are defined"
      ],
      "effects": [
