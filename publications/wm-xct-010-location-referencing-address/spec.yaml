        "Ambiguous or interpolated outcomes are flagged for review"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-008",
        "SRC-014",
        "SRC-015"
      ]
    },
    {
      "id": "reverse-geocode-position",
      "name": "Reverse geocode position",
      "description": "Resolve a coordinate position to candidate addresses, geographic identifiers or points of interest, qualified by distance and the geometry specification of each candidate.",
      "inputs": [
        "Position geometry with its CRS and epoch",
        "Search radius or tolerance",
        "Candidate types requested"
      ],
      "outputs": [
        "Ranked candidate references with distances",
        "Geometry specification of each candidate position",
        "Statement when no candidate meets the tolerance"
      ],
      "preconditions": [
        "The input CRS is declared and transformable to the reference dataset CRS",
        "Positional accuracy of the input is stated or assumed and disclosed"
      ],
      "effects": [
        "Candidates are returned with their own accuracy and specification",
        "No candidate is asserted as authoritative beyond its stated confidence"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-005",
        "SRC-014"
      ]
    },
    {
      "id": "transform-position-crs",
      "name": "Transform position between reference systems",
      "description": "Convert or transform a position from one coordinate reference system to another using a declared coordinate operation, preserving epoch and accuracy information.",
      "inputs": [
        "Source position with CRS and coordinate epoch",
        "Target CRS",
        "Selected coordinate operation"
      ],
      "outputs": [
        "Transformed position in the target CRS",
        "Operation identifier and its stated accuracy",
        "Combined accuracy statement"
      ],
      "preconditions": [
        "Both CRSs are resolvable from a geodetic parameter registry with a known dataset version",
        "The position lies within the operation's area of validity",
        "A coordinate epoch is present when either CRS is dynamic"
      ],
      "effects": [
        "Accuracy degradation introduced by the operation is recorded, not hidden",
        "Axis order and units are adjusted to the target CRS or the target encoding"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-010"
      ]
    },
    {
      "id": "resolve-geographic-identifier",
      "name": "Resolve geographic identifier",
      "description": "Look up a location instance of a declared location type in a gazetteer, returning its identifier, names, relationships and any complementary coordinate reference.",
      "inputs": [
        "Geographic identifier or name query",
        "Location type",
        "Gazetteer reference"
      ],
      "outputs": [
        "Location instance with identifier and names",
        "Parent and related instance references",
        "Complementary position or extent where held"
      ],
      "preconditions": [
        "The gazetteer is the declared custodian of record for the location type",
        "The territory of use covers the query"
      ],
      "effects": [
        "Ambiguity across homonyms is surfaced with disambiguating context",
        "Retired instances are returned marked as historic rather than omitted"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-018"
      ]
    },
    {
      "id": "attach-location-reference",
      "name": "Attach location reference to a host subject",
      "description": "Apply this model as a mixin to a subject in another model by recording a typed binding to an address, geographic identifier, position or code reference, with basis, purpose and effective period.",
      "inputs": [
        "Host subject identifier and owning model",
        "Reference kind and target reference",
        "Binding basis and purpose",
        "Effective from timestamp"
      ],
      "outputs": [
        "Binding record linking subject and location reference",
        "Validation result for the binding",
        "Binding created event"
      ],
      "preconditions": [
        "The host subject is resolvable in its owning model",
        "The target location reference exists and is not retired, or its historic use is explicitly permitted",
        "The binding purpose is among those the target is authoritative for"
      ],
      "effects": [
        "The host subject becomes locatable without absorbing referencing semantics",
        "Cardinality and exclusivity rules for the purpose are enforced",
        "The binding is versioned with RFC 3339 effective timestamps"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-001",
        "SRC-008"
      ]
    },
    {
      "id": "publish-reference-release",
      "name": "Publish reference data release",
      "description": "Cut a dated, versioned release of a register, gazetteer or reference dataset together with its licence, validation schema and crosswalk pack, and emit the delta since the previous release.",
      "inputs": [
        "Register or gazetteer identifier",
        "Release scope and cut-off time",
