  "model": {
    "registry_id": "vr.wm-xct-010",
    "model_id": "WM-XCT-010",
    "name": "Location Referencing / Address",
    "entry_kind": "mixin",
    "purpose": "Provide a format-neutral, reusable referencing fabric — addresses, thoroughfares, postal designations, geocodes, reference systems, gazetteer identifiers, points of interest and place names — that any subject model can mix in to state where something is, without absorbing the semantics of the thing located.",
    "scope_statement": "This model governs location references as first-class governed records with their own identity, authority, lifecycle and provenance, independent of the objects they designate. It covers the structure of an address and its components and locators (ISO 19160-1, INSPIRE Addresses), the authority and numbering rules under which addresses are assigned and retired, postal designation and template-driven rendering (ISO 19160-4 / UPU S42), coordinate positions with their geometry specification, method, accuracy and coordinate reference system and epoch (ISO 19111), non-coordinate code and grid references, spatial referencing by geographic identifiers and gazetteers (ISO 19112), points of interest and toponyms, and the matching, quality, provenance, access and interoperability concerns that make a reference trustworthy. It is deliberately storage- and interface-neutral: register rows, feature collections, Markdown records, graph triples and API responses are projections of the same semantics.",
    "in_scope": [
      "Address records: identifiers, class/profile, components, locators and sub-address levels, aliases and rendered representations",
      "Addressing authority, jurisdiction, address reference systems (numbering schemes) and assignment/retirement acts",
      "Address lifecycle status, real-world validity period and record version lifespan, recorded separately",
      "Binding of an address to an addressable object in a sibling model, including basis and exclusivity",
      "Thoroughfare naming for addressing purposes, name decomposition, renaming and name continuity",
      "Postal descriptors, delivery point types, country templates and postal address rendering rules",
      "Geocodes: position geometry, geometry specification and method, default position, positional accuracy and precision",
      "Coordinate reference systems, dynamic CRS coordinate epochs, axis order and coordinate operations used by stored positions",
      "Spatial reference systems using geographic identifiers, location types, location instances and gazetteers",
      "Open code and grid references (e.g. Open Location Code) as derived location value objects",
      "Points of interest as referenceable named places, with category, operating status and existence confidence",
      "Toponyms with language, script, romanisation and official standardisation status",
      "Geocoding and address matching operations, match quality, ambiguity and interpolation",
      "Address data quality tests, anomaly status against the governing reference system, and validation evidence",
      "Source lineage, observation/ingestion time, licensing, sensitivity, suppression and crosswalk/conformance declarations"
    ],
    "out_of_scope": [
      "The physical or legal objects addressed — buildings, premises, units, land parcels — including their geometry, construction and tenure",
      "Administrative unit and settlement hierarchies, boundaries and geometry; these are referenced as address components but defined by a sibling model",
      "Persons and organisations as addressees, recipients, occupiers or owners, and the addressee/organisation segments of a postal address",
      "Occupancy, tenancy, residence registration and mail forwarding",
      "Transport network topology, road segment geometry and linear referencing for asset management",
      "Mail and parcel logistics: items, routing execution, delivery scan events and track-and-trace",
      "Indoor navigable geometry and floor-plan models beyond the sub-address designators used for addressing",
      "Geodetic infrastructure operation: control networks, datum realisation and survey adjustment (referenced via a geodetic parameter registry, not defined here)",
      "Routing, isochrones and wayfinding algorithms that consume geocodes",
      "Data protection compliance programme design; ISO 19160-4 explicitly excludes data protection specification and this model records constraints rather than legal advice"
    ],
    "boundary_notes": [
      {
        "neighbor": "Building & structure model (legacy U1) and premises/spatial unit model (legacy U2)",
        "distinction": "INSPIRE models Address with associations to building and parcel rather than embedding them; this model owns the address record and the binding act, while the host model owns the object, its geometry and its condition. A unit number is a locator here and a spatial unit there.",
        "source_refs": [
          "SRC-005",
          "SRC-001"
        ]
      },
      {
        "neighbor": "Land parcel / cadastre model (legacy P2)",
        "distinction": "An address may designate a parcel where no building stands; the cadastral parcel identifier, rights and boundaries stay in the cadastre model and are referenced, never copied, by the address record.",
        "source_refs": [
          "SRC-005",
          "SRC-008"
        ]
      },
      {
        "neighbor": "Administrative units, settlements and geographical names (INSPIRE Annex I themes 3 and 4)",
        "distinction": "AdminUnitName and AddressAreaName are address components that reference authoritative administrative units and named places; their boundaries, hierarchy and legal status belong to the administrative-unit model. This model retains only the toponym facets needed to reference and display a place.",
        "source_refs": [
          "SRC-005",
          "SRC-007"
        ]
      },
      {
        "neighbor": "Transport network model",
        "distinction": "INSPIRE ThoroughfareName carries a transportLink association; this model owns the official name, its decomposition and its addressing use, while centreline geometry, topology and network attributes belong to the transport model.",
        "source_refs": [
          "SRC-005"
        ]
      },
      {
        "neighbor": "Party model (person / organisation)",
        "distinction": "ISO 19160-4 structures a postal address into elements, constructs and segments including an addressee specification; this model owns only the location-bearing segments and delegates addressee and organisation identification to the party model.",
        "source_refs": [
          "SRC-002"
        ]
      },
      {
        "neighbor": "Geodetic parameter registry (external, e.g. an authority-coded CRS dataset)",
        "distinction": "ISO 19111 defines CRS, datum, dynamic CRS and coordinate epoch; this model references CRS definitions by authority code and version and never redefines datums or transformation parameters.",
        "source_refs": [
          "SRC-004"
        ]
      },
      {
        "neighbor": "Public mandate / authority model (legacy A12)",
        "distinction": "The registrar's legal power to assign and retire addresses is a mandate instrument owned by the mandate model; this model records the authority reference, jurisdiction extent and effective period as constraints on assignment acts.",
        "source_refs": [
          "SRC-008"
        ]
      },
      {
        "neighbor": "Emergency response / NG9-1-1 dispatch model",
        "distinction": "CLDXF-US and RFC 5139 define civic location exchange for emergency calls; this model supplies the civic location content and its precision, while call handling, dispatch and PSAP routing belong to the emergency model.",
        "source_refs": [
          "SRC-009",
          "SRC-019"
        ]
      }
    ]
