    "known_omissions": [
      "ISO 19160-2 (assigning and maintaining addresses), ISO 19160-3 (address data quality) and ISO 19160-5 (address rendering) were not retrieved; no claim is made about their content, and the assignment, quality and rendering findings here are grounded in other sources that may diverge from them.",
      "ISO 19157 data quality, ISO 19115 metadata, ISO 19148 linear referencing, IndoorGML, OGC API - Features, GeoSPARQL and OASIS xAL/CIQ were not consulted; the quality-measure vocabulary and the graph/API projections are therefore under-specified.",
      "Direct HTTPS fetches of the FGDC and NENA pages returned HTTP 403; their element names, status values and standard designations were obtained through the search index rather than read verbatim from the documents. Element-level detail attributed to SRC-008 and SRC-019 should be treated as indicative and re-verified against the published PDFs before implementation.",
