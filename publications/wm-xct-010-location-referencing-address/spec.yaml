    "conflicts": [
      "Temporal modelling conflicts between sources: INSPIRE separates real-world validity (validFrom/validTo) from record version lifespan (beginLifespanVersion/endLifespanVersion), while FGDC combines a lifecycle status with start and end dates. This model adopts the INSPIRE separation and treats the FGDC pattern as a lossy projection of it — an explicit design choice, not a neutral merge.",
      "Axis order conflict: RFC 7946 fixes WGS 84 with longitude before latitude for GeoJSON, while ISO 19111 lets the coordinate reference system define axis order, and widely used geographic CRS definitions order latitude first. Any position projection must state which convention applies; silent reliance on either causes transposed coordinates.",
      "Class-model conflict: FGDC address classes (numbered thoroughfare, landmark, postal delivery), INSPIRE's locator-and-component structure, and RFC 5139's flat civic-type list have no one-to-one mapping. Landmark addresses in particular have no first-class INSPIRE equivalent. Crosswalks must be declared with losses rather than assumed.",
      "Postal versus civic conflict: FGDC states that postal delivery addresses may bear no definite relation to the recipient's location, and Overture carries a postal_city that may differ from the actual locality. Treating a postal address as a location reference is therefore unsafe without a declared role.",
      "Standard-lineage claim not verified: secondary material describes UPU S42 as registered as ISO 19160, but the UPU's own addressing page does not state a relationship to ISO 19160-4, and ISO publishes 19160-4 as its own standard with a 2023 second edition. This model treats S42 and ISO 19160-4 as aligned but distinct, and makes no equivalence claim.",
      "Identifier self-containment conflict: shortened Open Location Codes require an external reference location to be recovered, so they fail the self-contained identifier test even though the scheme is openly specified and offline-reversible for full codes.",
      "Governance conflict: postcodes are modelled by INSPIRE as an address component (PostalDescriptor) but are maintained by postal operators as routing keys with their own release cycle and licence. This model keeps them as components with an optional, explicitly non-authoritative extent, and records that the two views disagree about what a postcode is.",
      "NENA: a postal address is frequently not valid for emergency service; civic, postal and service addresses can differ for one site.",
      "ISO 19160-1 is a cross-map hub and is not intended to replace other conceptual models; claiming a single global address class is false.",
      "SEMIC locn is more flexible than INSPIRE Address; INSPIRE-conformant detail can be expressed in locn, but the reverse is not generally true.",
      "RFC 5870 excludes civic addresses and complex geometries from geo URI; coordinates and civic references are complementary, not substitutes.",
      "Plus Codes encode areas, not points, and shortened codes are ambiguous without a nearby reference location.",
      "ISO 19160-4 adds telephone number as a postal address element, which collides with a contact/party sibling if treated as location semantics.",
      "WGS-84 default in RFC 5870 versus national projected CRS required by many address maps; comparison without transformation is invalid.",
      "FGDC, CLDXF and USPS Publication 28 share US ancestry but serve repository, emergency-exchange and postal-rendering purposes that still conflict in classification."
    ],
    "regional_assumptions": [
      "The primary sources skew to ISO, the European Union, the United States and the Universal Postal Union. No primary source was consulted for East Asian block-and-lot addressing (for example chōme-banchi systems), South Asian, Middle Eastern or African national addressing conventions beyond the generic template mechanism, so the component and locator vocabularies may be incomplete for those regions.",
      "The model assumes that an addressing authority with a mandate exists and that a governing numbering scheme is identifiable. Large parts of the world lack assigned civic addresses entirely — the stated motivation for open code schemes — and in those settings the address-centred bundles degrade to code and geographic-identifier referencing.",
      "Postcode semantics are assumed to vary: some territories have no postcode, some postcodes are routing keys without a stable geographic extent, and some are areas. The model does not assume a postcode is an area.",
      "Sub-address vocabulary (secondary unit designators, floors, rooms) is grounded chiefly in United States practice and RFC 5139; other jurisdictions use different level structures that may not map cleanly.",
      "The separation of real-world validity from record version lifespan is a European modelling convention adopted here as the canonical form; registers built to other national standards will need a migration rather than a field rename.",
      "Retention, suppression and personal-data treatment are assumed to be set by national law that was not researched; the European regulatory context is the only legal context represented in the source set, and even there only through an interoperability regulation rather than data protection law.",
      "ISO 19160-2's typical registrar is a local government supported by national and postal agencies; some states use a national address register as master.",
      "Thoroughfare-plus-locator civic form is treated as the common international pattern; it does not cover all numbering cultures.",
      "WGS-84 / EPSG 4326 or 4979 is the default exchange CRS for compact geo identifiers; national mapping CRS remain first-class for local geocodes.",
      "Latin-script postal rendering and ISO 3166-1 country codes are default exchange practice; UNGEGN romanisation is required when the endonym is non-Roman.",
      "European INSPIRE constraints (country component, default geographic position, lifespan versioning) apply to EU public-sector exchange, not globally.",
      "US FGDC and NENA CLDXF content is authoritative for United States thoroughfare taxonomy and NG9-1-1 civic exchange, not for other states."
    ],
    "adversarial_checks": [
      "Tested whether a geocode can be collapsed into a plain coordinate attribute of the address. Rejected: INSPIRE requires every geographic position to declare what it specifies, by what method and whether it is the default, and ISO 19111 requires a CRS and, for dynamic systems, a coordinate epoch. A bare coordinate pair loses information that is normatively required, so position is modelled with its own qualifying structure.",
      "Tested whether a POI belongs in this model at all. Overture separates places — with operating status, existence confidence, brand and contact channels — from addresses, and much of that is business-entity data. Resolution: only the referencing facets (identity, category, position, status, name, address resolution, confidence) are retained here; operator, brand and contact data are pushed to sibling models, and the finding says so.",
      "Tested whether an address is one thing or two. FGDC states that postal delivery addresses may have no definite relation to the recipient's location, so a single entity that silently serves both location and delivery roles is wrong. Resolution: an explicit address role is required, and the purpose for which a binding is authoritative is modelled separately from the binding itself.",
      "Tested whether thoroughfare geometry should be owned here. Rejected: INSPIRE ThoroughfareName carries only a transportLink association, leaving centreline geometry and topology to the transport network theme. Owning geometry here would duplicate a sibling model and create two sources of truth for road position.",
      "Tested whether a date can serve as a version identifier for an address record. Rejected under the identity rule: multiple versions can share a date, and dates carry no issuing authority. Version identity uses a register key plus a monotonic sequence, with RFC 3339 timestamps as metadata.",
