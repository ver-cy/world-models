  "functions": [
    {
      "id": "register-jurisdiction",
      "name": "Register a jurisdiction record",
      "description": "Create a new jurisdiction record binding an authority-holder to a delimited competence, with at least one conferring instrument reference and an identifier assigned by the identity priority rule.",
      "inputs": [
        "authority-holder reference",
        "jurisdiction kind code",
        "competence category code",
        "scope declarations across the four axes",
        "conferring instrument reference",
        "source attestation"
      ],
      "outputs": [
        "jurisdiction record in draft state",
        "assigned identifier with provenance tier",
        "initial validation status"
      ],
      "preconditions": [
        "authority-holder resolvable in the referenced organisation or court register",
        "at least one conferring instrument citable by a governed legal identifier",
        "identity priority applied and the tier recorded"
      ],
      "effects": [
        "creates a draft record that asserts no legal validity of its own",
        "records the attestation and observation instant for every asserted element"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-013",
        "SRC-017"
      ]
    },
    {
      "id": "align-external-territorial-code",
      "name": "Align to an external territorial code",
      "description": "Record an alignment assertion between a jurisdiction record and an externally maintained territorial code, with match strength, pinned scheme version and any published neutrality caveat.",
      "inputs": [
        "jurisdiction identifier",
        "code scheme identifier and version",
        "code value",
        "match strength",
        "supporting evidence reference"
      ],
      "outputs": [
        "alignment entry with validity interval",
        "caveat carry-over where the scheme publishes one"
      ],
      "preconditions": [
        "the code scheme has a named maintenance agency and a retrievable release",
        "no conformance is claimed unless explicit evidence is supplied"
      ],
      "effects": [
        "adds a dated alignment assertion",
        "never mutates the external code or the local identifier"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-012",
        "SRC-015"
      ]
    },
    {
      "id": "declare-spatial-extent-reference",
      "name": "Declare spatial extent by reference",
      "description": "Bind a jurisdiction to administrative-unit features or maritime and aerial zone declarations without storing geometry locally.",
      "inputs": [
        "jurisdiction identifier",
        "administrative unit or boundary feature references",
        "zone type where applicable",
        "baseline reference and deposited coordinate reference"
      ],
      "outputs": [
        "spatial extent reference set",
        "zone rights enumeration where the extent is a functional zone"
      ],
      "preconditions": [
        "geometry is authored and versioned in the referenced spatial model",
        "for maritime zones, the zone type and its outer limit rest on a citable declaration"
      ],
      "effects": [
        "binds references and zone semantics only",
        "leaves geometry authorship, topology and boundary lifecycle entirely with the spatial model"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-006",
        "SRC-013"
      ]
    },
    {
      "id": "resolve-candidate-jurisdictions",
      "name": "Resolve candidate jurisdictions",
      "description": "Return an ordered advisory set of jurisdictions whose recorded scope matches supplied connecting factors, subject matter and reference instant, each with its basis of connection.",
      "inputs": [
        "connecting factors such as situs, domicile, habitual residence, nationality, place of conduct, place of effect and targeting indicators",
        "subject matter code",
        "reference instant"
      ],
      "outputs": [
        "ordered candidate set with basis of connection and confidence",
        "contested-result flag with competing claim references",
        "insufficiency signal listing missing inputs"
      ],
      "preconditions": [
        "reference instant supplied in RFC 3339 with seconds and an explicit offset or Z",
        "scope records evaluated only in states valid at that instant"
      ],
      "effects": [
        "produces advisory context only",
        "does not select the competent forum, determine applicable law, decide a case or trigger any enforcement"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-007",
        "SRC-011",
        "SRC-016"
      ]
    },
    {
      "id": "assess-overlap-and-priority",
      "name": "Assess overlap and priority",
      "description": "Classify the relation between two or more jurisdictions over a shared scope as exclusive, concurrent, hierarchical or disputed, and cite the recorded priority rule.",
      "inputs": [
        "two or more jurisdiction identifiers",
        "subject matter code",
        "reference instant"
      ],
      "outputs": [
        "overlap classification",
        "priority rule reference",
        "four-axis intersection description"
      ],
      "preconditions": [
        "each record is in a state valid at the reference instant",
        "competing claims, if any, are already recorded as separate assertions"
      ],
      "effects": [
        "records a dated, attributable assessment with provenance",
        "never silently merges or suppresses a competing claim"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-006",
        "SRC-007"
      ]
    },
    {
      "id": "record-scope-change",
      "name": "Record a scope change",
      "description": "Apply a controlled change event to a jurisdiction record, closing the prior version's validity interval and opening a new one, with the effecting instrument cited.",
      "inputs": [
        "jurisdiction identifier",
        "change type code",
        "effecting instrument reference",
        "effective instant",
        "observation instant"
      ],
      "outputs": [
        "new record version",
        "closed prior version with retained content",
        "identifier continuity decision"
      ],
      "preconditions": [
        "instrument reference resolvable through a governed legal identifier",
        "effective instant and observation instant supplied as distinct fields"
      ],
      "effects": [
        "supersedes rather than overwrites the prior version",
        "retains the prior version under the retention class for the record type"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-009",
        "SRC-012"
      ]
    },
    {
      "id": "record-succession-or-cession",
      "name": "Record succession, cession or dissolution",
      "description": "Link predecessor and successor jurisdictions when competence is transferred, merged, split or extinguished, recording the share of scope passing to each successor.",
      "inputs": [
        "predecessor jurisdiction identifier",
        "successor jurisdiction identifiers",
        "succession basis instrument reference",
        "effective instant",
