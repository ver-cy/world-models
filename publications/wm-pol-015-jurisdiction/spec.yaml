  "model": {
    "registry_id": "vr.wm-pol-015",
    "model_id": "WM-POL-015",
    "name": "Jurisdiction",
    "entry_kind": "entity",
    "purpose": "Describe, in a storage- and interface-neutral way, the bounded competence of an authority: which authority-holder may act, over what territory, persons, subject matter and period, on what legal basis, and how that competence relates to, yields to or is excluded by other competences.",
    "scope_statement": "A Jurisdiction record binds an identified authority-holder to a delimited competence and records the evidence for that delimitation. It covers identity and coding of jurisdictions and their subdivisions; the conferring instrument and category of competence; the four scope axes (territorial, personal, material, temporal); the declared type of power (prescriptive, adjudicative, enforcement) as a classification only; relations between jurisdictions (hierarchy, concurrency, exclusivity, delegation); immunities, reservations and derogations that narrow scope; lifecycle change including succession and cession; provenance, contestation and validation; and interoperability with external territorial and legal identifier schemes. It does not author geometry, does not hold legal instruments, does not decide a concrete case, and does not evaluate, execute, enforce or audit anything at runtime.",
    "in_scope": [
      "Identity, naming and versioned records for jurisdictions and jurisdictional subdivisions, including supranational, State, sub-State and specialised tribunal scopes",
      "Alignment to external territorial code lists (ISO 3166-1/-2 as normatively referenced by other standards, UN M49, EU Countries and territories NAL, NUTS) without asserting conformance",
      "Authority-holder binding by reference and the conferring or constituting instrument cited as legal basis",
      "Category of competence and exclusivity (exclusive, shared, supporting/coordinating) and the principle of conferral",
      "Territorial scope by reference, including land territory, internal waters, territorial sea, contiguous zone, exclusive economic zone, continental shelf and superjacent airspace",
      "Personal scope and connecting factors (domicile, habitual residence, nationality, seat, place of conduct, place of effect, targeting)",
      "Material or subject-matter scope, including declared subject-matter competence catalogues",
      "Temporal scope: entry into force, applicability window, non-retroactivity and jurisdiction ratione temporis",
      "Declared classification of power type as prescriptive, adjudicative or enforcement competence",
      "Inter-jurisdictional relations: hierarchy and supremacy, subsidiarity, concurrency, priority and lis pendens references",
      "Immunities, privileges, reservations, opt-outs, derogations and carve-outs that narrow declared scope",
      "Forum-selection and recognition bindings recorded as references to the governing instrument",
      "Lifecycle of the jurisdiction record: establishment, extension, reduction, transfer, cession, merger, split, suspension, termination and State succession",
      "Provenance, official-publication attestation, contested or overlapping claims, and validation status with currency"
    ],
    "out_of_scope": [
      "Authoring or storing boundary geometry, coordinate reference systems or topology; these belong to the parent place and administrative-unit spatial model",
      "Holding the text, consolidation, FRBR expressions or in-force computation of legal instruments; these belong to the legislation model addressed by ELI and Akoma Ntoso",
      "Deciding the competent forum, the applicable law or the outcome of a concrete dispute; this model produces advisory candidate sets only",
      "Runtime policy evaluation, decision execution, enforcement action and enforcement outcomes; these are owned by a referenced policy-decision and enforcement runtime model",
      "Audit-trail semantics, audit record schemas and audit retention execution; the model emits provenance about its own records only and never owns another model's audit trail",
      "Court dockets, case files, judgments and case-law citation graphs, which belong to the case-law identification model addressed by ECLI",
      "Organisational structure, appointments, budgets and staffing of the authority-holder, held in the public-authority organisation model",
      "Legal-entity master data such as LEI reference data, ownership structures and registration-authority records, mastered by GLEIF and Local Operating Units",
      "Statistical territorial classification for reporting purposes as an authority claim; NUTS units are statistical and are aligned to, not treated as, jurisdictions",
      "Natural-person nationality, citizenship or residence registries, and postal address formats",
      "Tax rate schedules, treaty-benefit computation and customs tariff calculation"
    ],
    "boundary_notes": [
      {
        "neighbor": "Parent place and administrative-unit spatial model (WM-PLC-004; INSPIRE Administrative Units theme)",
        "distinction": "The spatial model owns AdministrativeUnit and AdministrativeBoundary features, their geometry, national levels and boundary editing lifecycle. Jurisdiction carries only a resolvable reference to those features plus the competence semantics attached to them, and never re-authors or re-versions geometry locally.",
        "source_refs": [
          "SRC-013"
        ]
      },
      {
        "neighbor": "Statistical territorial classification (NUTS, Regulation (EC) No 1059/2003)",
        "distinction": "NUTS levels exist to enable collection and dissemination of European statistics and are built from administrative units subject to population thresholds and a triennial amendment cadence. A NUTS unit is therefore an alignment target for reporting, not evidence that an authority holds decision-making power over that area.",
        "source_refs": [
          "SRC-012"
        ]
      },
      {
        "neighbor": "Legislation and legal-instrument model (ELI, Akoma Ntoso Naming Convention)",
        "distinction": "ELI and the Akoma Ntoso FRBR Work/Expression/Manifestation/Item stack own instrument identity, versioning and publication. Jurisdiction cites an instrument as the legal basis for a competence; it must not mirror expression-level versioning, consolidation or in-force computation of that instrument.",
        "source_refs": [
          "SRC-002",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Applicable-law / conflict-of-laws model (Rome I, Regulation (EC) No 593/2008)",
        "distinction": "Rome I governs which law applies to a contractual obligation, including party choice, default connecting rules, overriding mandatory provisions and the public-policy exception. Brussels Ia governs which court has jurisdiction. Choice of law and choice of forum are separate determinations and this model owns only the forum-scope side, by reference.",
        "source_refs": [
          "SRC-004",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Case-law identification model (ECLI)",
        "distinction": "ECLI identifies individual judgments through country code, court code, year and ordinal number. Jurisdiction may align to the ECLI court code as an identifier for an adjudicative authority, but judgments, dockets and citation metadata are not modelled here.",
        "source_refs": [
          "SRC-010"
        ]
      },
      {
        "neighbor": "Legal-entity registry model (ISO 17442 / GLEIF Global LEI Index)",
        "distinction": "The LEI record masters an entity's legal jurisdiction and registration authority as entity reference data. Jurisdiction consumes those values as connecting-factor inputs by reference and never becomes a second master for entity reference data.",
        "source_refs": [
          "SRC-018"
        ]
      },
      {
        "neighbor": "Policy-decision, enforcement and audit runtime",
        "distinction": "This model supplies scope facts and advisory candidate sets. Evaluation of a rule against a case, issuance of a decision, enforcement action against a party outside the territory, and the audit trail of those acts are wholly owned by the runtime model. Enforcement jurisdiction is recorded here only as a declared classification, never as an executed capability.",
        "source_refs": [
          "SRC-016",
          "SRC-019"
        ]
      },
      {
        "neighbor": "Territorial code maintenance agencies (ISO 3166 series, UN M49, EU Countries and territories NAL)",
        "distinction": "Code assignment, retirement and re-use rules belong to the maintaining agency. UNSD explicitly states that grouping assignments are for statistical convenience and imply no position on political affiliation or legal status. Alignment entries here are assertions with a match strength, not conformance claims.",
        "source_refs": [
          "SRC-001",
          "SRC-015"
        ]
      },
      {
        "neighbor": "Maritime delimitation and law-of-the-sea model",
        "distinction": "UNCLOS fixes zone breadths and the content of coastal-State rights per zone. A maritime jurisdiction record specialises the generic Jurisdiction entity with zone type, baseline reference and deposited-coordinate reference; it does not redefine zone entitlements, delimitation methodology or dispute settlement machinery.",
        "source_refs": [
          "SRC-005",
          "SRC-006"
        ]
      }
    ]
