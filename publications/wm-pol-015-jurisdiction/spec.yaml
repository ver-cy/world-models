        "The owner package must declare which policy-decision or enforcement runtime consumes its outputs, and must record that evaluation, enforcement and audit are executed there."
      ],
      "namespace_guidance": "Use one stable namespace per adopting Dimension for locally minted jurisdiction identifiers, kept strictly separate from the namespaces of external registrars. Never mint a local identifier in a shape that could be mistaken for an ISO 3166, M49, ELI, ECLI or LEX URN token. Local subdivision hierarchies should mirror the parent-child structure of the record graph rather than encoding hierarchy in the identifier string, so that reorganisation does not force a rename that external schemes forbid.",
      "registry_links": [
        "Vercy registry entry vr.wm-pol-015 (model WM-POL-015) is the canonical registration for this model and records its parent WM-PLC-004.",
        "External registrar links must be recorded per alignment: the maintenance agency for each territorial code list, the ELI implementation register of the publishing authority, the ECLI national coordinator, and the LEX URN Jurisdictional Registrar where one is designated.",
        "Composition targets that are not yet registered Vercy models must be recorded as named placeholders with their intended relation type so that the ownership contract is auditable before the sibling model exists."
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Canonical form is the semantic record graph, not any serialisation: JSON, YAML, Markdown, HTML, a Git tree, an MCP resource and a document collection are equivalent projections and none is normative.",
        "Order-insensitive collections (alignment entries, crosswalk entries, competing claims, exception entries) are canonicalised by sorting on their member identifiers before digesting, so that projection ordering cannot change a digest.",
        "All instants are canonicalised to RFC 3339 with seconds present and an explicit numeric offset or Z; no locale-dependent or offset-less form is canonical.",
        "Identifiers are canonicalised case-sensitively as issued by their registrar; the model never normalises the case or punctuation of an external token."
      ],
      "patch_rules": [
        "Substantive changes to a competence create a new record version through record-scope-change; they are never applied as in-place edits to a published version.",
        "A patch must carry the effecting instrument reference, the effective instant and the observation instant; a patch lacking an instrument reference may only alter attestation, alignment or crosswalk metadata, not scope.",
        "Corrections of transcription error are recorded as errata against the same version with their own provenance, distinguishing correction of the record from change of the underlying competence.",
        "Deleting an alignment or crosswalk entry is expressed as closing its validity interval, never as removal, so that historical resolution remains reproducible."
      ],
      "compatibility_rules": [
        "Adding a new optional data element, code-list term, alignment scheme or question is a minor change; removing or narrowing an element, retiring a code-list term, or tightening a cardinality is a breaking change.",
        "Jurisdiction identifiers are permanently stable: they are never renamed, never reassigned and only ever marked obsolete with a successor link, following the LEX URN rule for jurisdiction codes.",
        "A change to the meaning of a typology term requires a new term and deprecation of the old one; terms are never redefined in place.",
        "Consumers must tolerate multi-valued and contested results; a scheme change that would force a single answer where the sources disagree is breaking."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier issued by the competent public or legal authority that constitutes or registers the jurisdiction — for example the national official register or gazette reference for the constituting instrument, the treaty depositary notification reference, the ECLI court code for an adjudicative body, or the statutory subdivision code issued by the national coding authority.",
        "Governed global identifier or IRI from a maintained public registry — for example the EU Countries and territories NAL URI, an ELI URI for the conferring instrument, a LEX URN jurisdiction token, or an ISO 3166-1/-2 code as normatively referenced by Akoma Ntoso and urn:lex.",
        "UUID or ULID minted by the adopting Dimension in its own namespace, used only when neither of the tiers above yields a stable identifier, and always recorded together with the tier marker and the reason no higher tier applied.",
        "A date, a name, a boundary geometry, a NUTS code or any statistical grouping code is never an identifier for a jurisdiction; NUTS and M49 codes may be carried only as alignments."
      ],
      "timestamp_rule": "All time values are recorded as RFC 3339 date-time strings that include seconds and an explicit numeric UTC offset or the literal Z; offset-less, date-only or locale-formatted values are rejected at validation. Event time and observation time are separate mandatory fields wherever they can differ: the effective instant records when a jurisdictional change took legal effect according to its instrument, while the observation or ingestion instant records when this model retrieved or recorded that fact. Where an instrument states only a date, the effective instant is recorded as a date-typed element with the governing time zone named explicitly rather than silently coerced to midnight UTC.",
      "serial_naming_rule": "Serial artifacts — the code alignment table, subject-matter competence catalogue, deposited coordinate records, depositary declaration records, official publication attestations, validation reports, the identifier crosswalk map and the tombstone register — are named as artifact identifier plus a monotonically increasing semantic version or run instant, never by overwriting a prior name. Each release pins the versions of every external scheme it depends on, is immutable once published, and links to the release it supersedes; the AGENTS.md bootstrap descriptor is the sole non-serial artifact and is replaced wholesale on version change.",
      "integrity_rule": "Every artifact release carries a content digest and the retrieval instants and digests of the external sources it depends on, so that an agent can detect upstream drift. Attestation and tombstone registers are append-only. A digest mismatch against a pinned source sets the affected records to a stale state and blocks their promotion, but never rewrites the historical release; integrity of externally held instruments and geometry is verified by reference only, since those artifacts are owned by the legislation and spatial models."
    },
    "policies": [
      "Alignment, not conformance: citing an external standard records a mapping with a match strength and pinned version. Conformance to ISO 3166, ELI, ECLI, Akoma Ntoso, LEX URN or INSPIRE is asserted only where explicit conformance evidence is recorded, and conflicts between schemes are preserved as conflict records rather than resolved editorially.",
      "Neutrality on contested status: where authorities assert incompatible competence, all claims are held side by side with their asserting authority, instrument and instant. The model does not adjudicate, rank by political preference, or suppress a claim, and it carries forward source caveats disclaiming any position on legal status or delimitation of frontiers.",
      "Advisory only: outputs are context for a decision-maker. The model never determines the competent forum for a concrete matter, never selects the applicable law, and never evaluates, executes, enforces or audits anything; those operations belong to the referenced conflict-of-laws and policy-decision runtime models.",
      "Reference over replication: geometry, instrument text, entity reference data, judgments and audit trails are referenced through resolvable identifiers and are never copied into this model, even when copying would be convenient for offline use.",
