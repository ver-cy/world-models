  "structure": {
    "bundles": [
      {
        "id": "identity-and-typology",
        "name": "Jurisdiction Identity and Typology",
        "description": "Establishes what a jurisdiction record is, how it is uniquely and durably identified, how it aligns to external territorial code lists, and how it is classified by kind of jurisdictional entity and by type of power claimed.",
        "rationale": "Identifier stability is a normative requirement in the sources: urn:lex forbids renaming jurisdiction codes and permits only obsolescence, Akoma Ntoso requires an ISO 3166-1/-2 code in the Work IRI, and the EU Countries NAL publishes versioned governed URIs. Classification must be separated from identity because UNSD warns that grouping is a statistical convenience and implies nothing about legal status.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-009",
          "SRC-015"
        ],
        "layers": [
          {
            "id": "identity-and-territorial-coding",
            "name": "Identity and Territorial Coding",
            "description": "How a jurisdiction record is identified in its own right and how that identity is bound to externally governed territorial codes without absorbing their governance.",
            "source_refs": [
              "SRC-001",
              "SRC-002",
              "SRC-009",
              "SRC-015"
            ],
            "findings": [
              {
                "id": "jurisdiction-record-identity",
                "name": "Jurisdiction record identity and identifier stability",
                "description": "The identifier for a jurisdiction record, its priority order of sources, its immutability guarantees, and how obsolescence is expressed without reuse or deletion.",
                "source_refs": [
                  "SRC-009",
                  "SRC-015",
                  "SRC-010"
                ],
                "questions": [
                  {
                    "id": "q-identity-primary",
                    "text": "Which identifier is the authoritative master-system identifier for this jurisdiction, and which body issues it?",
                    "kind": "identity",
                    "answer_data": [
                      "issuing authority reference",
                      "master identifier value",
                      "identifier scheme name",
                      "issuance instrument or register reference"
                    ]
                  },
                  {
                    "id": "q-identity-fallback",
                    "text": "If no master-system identifier exists, which governed global URI is used, and on what basis is a locally minted ULID or UUID justified instead?",
                    "kind": "decision",
                    "answer_data": [
                      "governed URI value",
                      "registry name and version",
                      "fallback tier used",
                      "justification note"
                    ]
                  },
                  {
                    "id": "q-identity-obsolescence",
                    "text": "How is an identifier retired so that it is never renamed or reassigned to a different jurisdiction?",
                    "kind": "constraint",
                    "answer_data": [
                      "obsolete flag",
                      "obsolescence instant",
                      "successor identifier reference",
                      "reuse-prohibited assertion"
                    ]
                  },
                  {
                    "id": "q-identity-aliases",
                    "text": "Which alternate names, historical names and transliterations are recorded, and which one is authoritative for display?",
                    "kind": "definition",
                    "answer_data": [
                      "preferred label with language tag",
                      "alternate labels",
                      "historical labels with validity intervals",
                      "script or transliteration code"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "jurisdiction-id",
