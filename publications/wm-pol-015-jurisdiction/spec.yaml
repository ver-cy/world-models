  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "The adopting Dimension must name a competent public or legal authority, or an accountable steward acting on published sources, as owner of every jurisdiction record it publishes; unowned records may exist only in draft state.",
        "The owner package must declare, per record class, which retention class applies and which actor executes physical disposition, since disposition execution lies outside this model's boundary.",
