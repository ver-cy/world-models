      "namespace_guidance": "Use a stable domain-scoped namespace under the economic navigation path (for example an authority-qualified IRI ending in a payment segment) that is independent of storage technology. Externally governed vocabularies keep their own namespaces and are referenced by scheme plus version, never re-minted: currency codes stay in the ISO 4217 registry namespace, message element names stay in the ISO 20022 namespace, scheme reason codes stay in their scheme namespace. Local terms coined by the Dimension must be clearly separated from imported terms so that an agent can tell at a glance whether a term is governed elsewhere.",
