  "functions": [
    {
      "id": "register-payment-order",
      "name": "Register a payment order",
      "description": "Accept an instruction as a payment order, record actual and deemed receipt times, and assign or adopt the authoritative reference set.",
      "inputs": [
        "Instruction payload",
        "Instructing party reference",
        "Channel and cut-off context",
        "Business day calendar reference"
      ],
      "outputs": [
        "Registered payment aggregate",
        "Order receipt acknowledgement",
        "Deemed receipt timestamp",
        "Reference set"
      ],
      "preconditions": [
        "The instruction contains no conditions to payment beyond time of payment",
        "A reimbursement path from the sender is identified",
        "The instructing party is entitled to instruct on the debtor account"
      ],
      "effects": [
        "Starts every execution and notification deadline from the deemed receipt time",
        "Creates the first lifecycle event entry",
        "Fixes which references are authoritative and which are correlating"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-004",
        "SRC-003"
      ]
    },
    {
      "id": "validate-payment-instruction",
      "name": "Validate a payment instruction",
      "description": "Check the instruction against the scheme profile, currency registry scale, party data profile and account identifier rules before acceptance.",
      "inputs": [
        "Registered payment aggregate",
        "Payment scheme profile",
        "Party data payload profile",
        "Currency registry reference"
      ],
      "outputs": [
        "Validation result set",
        "Account identifier validation report",
        "Blocking defect list"
      ],
      "preconditions": [
        "A scheme profile for the classified payment type is available",
        "The currency code resolves in the governed registry"
      ],
      "effects": [
        "Blocks acceptance where a mandatory scheme element is missing",
        "Records the validation depth actually achieved, including whether payee name was confirmed"
      ],
      "source_refs": [
        "SRC-012",
        "SRC-009",
        "SRC-002"
      ]
    },
    {
      "id": "authorise-payment",
      "name": "Authorise a payment",
      "description": "Capture consent in the agreed form, exercise authentication, and record evidence sufficient to answer a later unauthorised-transaction claim.",
      "inputs": [
        "Registered payment aggregate",
        "Consent input",
        "Authentication factors",
        "Mandate reference where applicable"
      ],
      "outputs": [
        "Authorisation state",
        "Authorisation evidence record",
        "Authentication outcome"
      ],
      "preconditions": [
        "The consent form matches what the framework contract specifies",
        "The instrument used is in an active state"
      ],
      "effects": [
        "Determines whether the payment is authorised for liability purposes",
        "Creates append-only evidence including failed attempts"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-013",
        "SRC-001"
      ]
    },
    {
      "id": "screen-and-decide-acceptance",
      "name": "Screen and decide acceptance",
      "description": "Apply compliance, sanctions, fraud and limit checks, then accept, hold or refuse the order with a notifiable reason where lawful.",
      "inputs": [
        "Validated payment aggregate",
        "Screening rule and list versions",
        "Applicable regime determination"
      ],
      "outputs": [
        "Acceptance decision code",
        "Screening decision log",
        "Refusal notification"
      ],
      "preconditions": [
        "Applicable regimes have been determined",
        "Screening lists in use have a recorded version"
      ],
      "effects": [
        "Refusal must be notified at the earliest opportunity within the applicable execution period",
        "May create a non-disclosable hold whose true reason differs from the user-facing message"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-015",
        "SRC-014"
      ]
    },
    {
      "id": "route-and-clear-payment",
      "name": "Route and clear a payment",
      "description": "Select the rail or correspondent chain, apply the settlement method per hop, and submit the payment into the clearing arrangement.",
      "inputs": [
        "Accepted payment aggregate",
        "Reachability and rail capability data",
        "Liquidity position"
      ],
      "outputs": [
        "Routing plan and actual route record",
        "Clearing cycle assignment",
        "Per-hop instructions"
      ],
      "preconditions": [
        "The payee's agent is reachable on the selected rail",
        "The rail is open under its operating calendar or the order is scheduled"
      ],
      "effects": [
        "Creates credit exposure between participants along the chain",
        "Binds the payment to a specific cycle and cut-off"
      ],
      "source_refs": [
        "SRC-012",
        "SRC-010",
        "SRC-007"
      ]
    },
    {
      "id": "settle-and-record-finality",
      "name": "Settle and record finality",
      "description": "Effect settlement in the applicable settlement asset, record settlement time, value date and availability, and assert the finality point under the governing rules.",
      "inputs": [
        "Cleared payment aggregate",
        "Settlement operator confirmation",
        "Governing system rules reference"
      ],
      "outputs": [
        "Settlement confirmation record",
        "Finality attestation",
        "Value date and availability values"
      ],
      "preconditions": [
        "Sufficient liquidity or a settled net position exists",
        "The governing finality rule is identified for this rail"
      ],
      "effects": [
        "Makes the payment irrevocable under system rules",
        "Discharges the underlying obligation subject to the recognised exceptions",
        "Triggers the payee's value dating and crediting duties"
      ],
      "source_refs": [
        "SRC-007",
        "SRC-010",
        "SRC-005",
        "SRC-003"
      ]
    },
    {
