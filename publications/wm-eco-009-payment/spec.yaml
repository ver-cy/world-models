                "id": "instrument-class-and-initiation-direction",
                "name": "Payment instrument class and initiation direction",
                "description": "CPMI statistics treat payment instruments as credit transfers, direct debits, card payments, e-money payments and cheques. A credit transfer is a payment order, or sequence of orders, made to place funds at the disposal of the payee, with both the order and the funds moving from the payer's institution to the payee's institution. A direct debit is a preauthorised debit of the payer's account initiated by the payee. PSD2 defines a payment transaction as an act, initiated by the payer or on his behalf or by the payee, of placing, transferring or withdrawing funds, irrespective of any underlying obligations. Instant credit transfer is a credit transfer executed immediately, 24 hours a day on any calendar day. Cash and card remain instrument classes even when detailed till or scheme-clearing rules live elsewhere.",
