      "patch_rules": [
        "Settlement, finality and lifecycle event records are append-only: a correction is recorded as a new entry that supersedes an earlier one with a reason, never as an in-place edit, so the state known at any past moment stays reconstructible.",
        "Instruction-stage fields may be patched only before acceptance; after acceptance a change is either a scheme amendment with its own reference or a cancellation and reissue, and the model must record which occurred.",
        "A patch that changes amount, currency, payee or account identifier after acceptance is prohibited; such a change is a different payment and must be represented as one, linked to the original.",
        "Redaction and purge are expressed as patches that remove content while retaining the element's existence, class, removal time, basis and executing process, so that absence is distinguishable from never-present.",
        "Every patch carries the patching role, the basis, the occurrence time of the underlying fact and the observation time of the patch itself.",
        "Patches derived from a later-arriving participant status must not overwrite a status reported by a higher-precedence participant unless the precedence rule in force is recorded with the patch."
