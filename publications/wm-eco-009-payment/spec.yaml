              {
                "id": "travel-rule-payload-and-screening",
                "name": "Travel-rule payload and screening",
                "description": "FATF Recommendation 16 requires countries to ensure that financial institutions include required and accurate originator information and required beneficiary information on wire payments or value transfers and related messages. The June 2025 update standardises responsibilities in the payment chain, starting with the institution that receives the customer instruction, and applies enhanced data for peer-to-peer cross-border payments above USD/EUR 1,000 (name, address, date of birth among other fields). The EU Transfer of Funds rules require the payer's PSP to accompany transfers with payer and payee name and account number (or unique transaction identifier where no account), plus specified identity details, and to verify payer information before execution; the payee's PSP must detect missing data and may execute, reject or suspend. Screening against restrictive measures is a pre-execution control; list contents are out of scope. Crypto-asset transfers are covered by the TFR recast; detailed on-chain semantics remain a gap.",
