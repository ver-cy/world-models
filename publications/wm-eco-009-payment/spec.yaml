  "model": {
    "registry_id": "vr.wm-eco-009",
    "model_id": "WM-ECO-009",
    "name": "Payment",
    "entry_kind": "aggregate",
    "purpose": "Provide the format-neutral context an agent needs to understand, create, inspect and operate a payment: an instructed transfer of funds from a payer to a payee that discharges or modifies a monetary obligation, together with its authorisation, routing, clearing, settlement, finality, evidence and exception handling.",
    "scope_statement": "The model covers the payment as a legal and operational act and as an aggregate: the payment order and its receipt, the consent and authorisation that make it authorised, the amount and denomination, the party and account references it carries, the rail and routing chain, the clearing cycle and settlement event, the finality point at which the underlying obligation is discharged, the status and lifecycle history, the exception paths (refusal, revocation, return, recall, refund, chargeback, unauthorised-transaction claims), the evidence produced (advices, confirmations, statements), and the governance of access, retention and deletion of payment records. It is deliberately independent of storage format and access interface: ISO 20022 XML, card network messages, ledger rows, files or API payloads are projections of the same semantics. Money itself, accounts as entities, invoices and accounting postings are referenced through sibling models rather than restated here.",
    "in_scope": [
      "Payment order identity, references and correlation across legs and participants (end-to-end reference, instruction reference, clearing system reference)",
      "Payment classification: instrument class, scheme, local instrument, service level and category purpose",
      "Instructed, settlement and equivalent amounts, currency denomination, minor units and currency conversion",
      "Charges, fees and charge-bearer allocation between payer and payee",
      "Payer, payee, initiating party, ultimate parties and the ordered chain of agents",
      "Party and account identification data carried with the payment, including structured address and identifier schemes",
      "Consent, authorisation, authentication evidence and the authorised/unauthorised determination",
      "Receipt of the payment order, cut-off times, business-day calendars and refusal",
      "Revocability, revocation deadlines, amendment and cancellation or recall requests",
      "Rail and routing selection, settlement method and the intermediary chain",
      "Clearing cycle, gross versus net settlement, settlement asset and prefunding",
      "Settlement execution, settlement date, value date, funds availability and execution deadlines",
      "Settlement finality, irrevocability and discharge of the underlying monetary obligation",
      "Status codes, status reason codes and the lifecycle event history",
      "Returns, reversals, recalls, refunds, chargebacks, disputes and error resolution",
      "Confirmations, advices, statements and reconciliation to ledger postings",
      "Compliance data that must travel with the payment, and access, retention and deletion of payment records"
    ],
    "out_of_scope": [
      "Money as an instrument: currency catalogue governance, cash classes, deposit and electronic-money issuance and redemption (WM-ECO-004)",
      "Accounts, wallets and balances as first-class entities; the payment references them and does not own their lifecycle",
      "Invoices, bills and demand documents and their own lifecycle (WM-ECO-008)",
      "Double-entry postings, journals, trial balance and accounting policy (WM-ECO-016)",
      "Credit claims, loans, interest accrual and debt instruments; their cash flows appear here only as payments",
      "Natural persons and organizations as entities; only role references are held",
      "The contract or agreement that creates the obligation, and the goods, services or rights being paid for",
      "Tax determination, withholding calculation and statutory tax filing",
      "Securities settlement legs, delivery-versus-payment asset legs and trade lifecycle",
      "Customer onboarding, KYC file content and firm-level compliance programme design",
      "Pricing, discounting, dunning and collections strategy",
      "Payroll entitlement calculation and benefits administration"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ECO-004 Money and Monetary Instrument",
        "distinction": "That model owns what money is: units of account, minor units, instrument forms and issuance. This model owns the transfer act. A currency code or instrument form is referenced by scheme and version here, never redefined; conversely a settlement finality rule belongs here, not there.",
        "source_refs": [
          "SRC-009",
          "SRC-007"
        ]
      },
      {
        "neighbor": "WM-ECO-016 Financial Transaction and Posting",
        "distinction": "A payment is an economic and legal act on a rail; a posting is its representation in a ledger under an accounting policy. One payment may generate several postings in several ledgers, and a posting may exist with no payment. The handoff is a COMPOSE relation, not an identity.",
        "source_refs": [
          "SRC-012",
          "SRC-007"
        ]
      },
      {
        "neighbor": "WM-ECO-008 Invoice",
        "distinction": "The invoice states the obligation and its amount; the payment discharges it. Allocation of a payment across invoices is held here as a linkage, while invoice line detail, tax lines and dunning state remain in the invoice model.",
        "source_refs": [
          "SRC-005",
          "SRC-001"
        ]
      },
      {
        "neighbor": "Account and Holding model",
        "distinction": "The payment carries account references and unique identifiers, and asserts value date and availability effects, but does not own account opening, mandate registers, balances or statement generation. This neighbour is not yet present in the registry and is recorded as an unresolved boundary.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Dispute and case management",
        "distinction": "Chargeback, error-resolution and unauthorised-transaction cases have their own investigatory workflow, provisional credit and evidence packs. This model holds the payment-side case linkage, deadlines and liability outcome; deeper case workflow belongs to an EXTEND sibling.",
        "source_refs": [
          "SRC-013",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Card scheme and acquiring domain",
        "distinction": "Card authorisation, capture, clearing files and interchange are a specialisation of this aggregate rather than a separate concern; but cardholder data protection obligations and credential tokenisation are governed by an external security standard aligned to, not absorbed by, this model.",
        "source_refs": [
          "SRC-014",
          "SRC-001"
        ]
      },
      {
        "neighbor": "Crypto-asset and e-money token transfers",
        "distinction": "Transfers of e-money tokens referencing one official currency behave as payments but sit under a distinct authorisation regime. They are modelled as an EXTEND specialisation so that issuer authorisation, reserve and white-paper obligations do not leak into the core payment aggregate.",
        "source_refs": [
          "SRC-015"
        ]
      }
    ]
  },
