    "artifact_rules": {
      "identity_priority": [
        "The authoritative master-system identifier assigned by the system of record for the fact in question takes absolute priority: for settlement and finality facts this is the settlement operator's or clearing system's own settlement reference; for a dispute it is the investigating institution's or scheme's case reference; for a statement it is the account servicer's statement identifier. This identifier is adopted verbatim and never re-minted.",
        "Where no master-system identifier exists, a governed global identifier or IRI issued under an externally maintained scheme is used, recorded together with its scheme name and version (for example a scheme-issued end-to-end transaction reference or a registered party identifier).",
