      "compatibility_rules": [
        "Adding an optional element or a new code value is a compatible change; making an element required, narrowing a code set, or changing the meaning of an existing code is breaking and requires a new model version.",
        "Superseded scheme profiles, code set versions and retention policies are retained indefinitely so that historic payments remain interpretable under the rules in force when they occurred.",
        "Alignment to an external standard is versioned independently of this model; an upstream message version change does not force a model version change unless it alters semantics rather than structure.",
        "Consumers must tolerate unknown optional elements and unknown code values by preserving them verbatim rather than discarding them, since intermediary truncation is a known cause of reconciliation loss.",
