            "findings": [
              {
                "id": "returns-reversals-and-recalls",
                "name": "Returns, reversals and recall requests",
                "description": "Distinct mechanisms are frequently conflated. A return is a new payment in the opposite direction raised by the receiving side; a return request asks the receiving side to return a settled payment and may be refused; a response message conveys that refusal or agreement; and a reversal in some schemes undoes an entry rather than creating a new one. Each has its own reference, reason code set and timing window, and the original payment usually remains valid and final.",
                "source_refs": [
                  "SRC-012",
                  "SRC-002",
                  "SRC-004"
                ],
                "questions": [
                  {
                    "id": "q-return-mechanism",
                    "text": "Which mechanism was used to move value back, and did it create a new payment or unwind the original?",
                    "kind": "process",
