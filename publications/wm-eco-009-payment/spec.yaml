  "composition": [
    {
      "target": "WM-ECO-016 Financial Transaction and Posting",
      "relation": "COMPOSE",
      "purpose": "A settled or reversed payment hands confirmed economic facts to the accounting model, which owns account selection, double-entry structure and period assignment. This model supplies the reconciled event, amounts, value dates and evidence references; it does not choose ledger accounts.",
      "required": true,
      "source_refs": [
        "SRC-012",
        "SRC-011",
        "SRC-007"
      ]
    },
    {
      "target": "WM-ECO-008 Invoice",
      "relation": "REFERENCE",
      "purpose": "A payment allocates against one or more invoices or claims, discharging them in whole or in part. Invoice line content, tax treatment and dunning state remain in the invoice model; only allocation, allocated amount and residual are held here.",
      "required": false,
      "source_refs": [
        "SRC-005",
        "SRC-001"
      ]
    },
    {
      "target": "WM-ECO-004 Money and Monetary Instrument",
      "relation": "REFERENCE",
      "purpose": "Currency identity, minor units, instrument forms and issuance are resolved by reference to the money model. This model never redefines a currency or an instrument form; it records which one a payment is denominated in and moves.",
      "required": true,
      "source_refs": [
        "SRC-009",
        "SRC-001"
      ]
    },
    {
      "target": "Account and Holding model (candidate sibling, not yet in registry)",
      "relation": "REFERENCE",
      "purpose": "Account identifiers, servicer relationships and balance effects are referenced rather than owned. Recorded as a gap: no registry entry currently exists, so account semantics are at risk of being absorbed here by default.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-002"
      ]
    },
    {
      "target": "Person model",
      "relation": "REFERENCE",
      "purpose": "Natural persons occupying payer, payee or ultimate-party roles are resolved by identity reference and never inlined, keeping personal-data stewardship with the party model.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-004"
      ]
    },
    {
      "target": "Organization model",
      "relation": "REFERENCE",
      "purpose": "Payment service providers, agents, scheme operators and settlement operators are organizations resolved by reference, so that operator licensing and identity remain single-mastered outside this model.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-010"
      ]
    },
    {
      "target": "Agreement and Obligation model",
      "relation": "REFERENCE",
      "purpose": "The framework contract governing the payment service, and the underlying obligation the payment discharges, live in the agreement model. Discharge conditions are evaluated here against terms defined there.",
      "required": false,
      "source_refs": [
        "SRC-005",
        "SRC-002"
      ]
    },
    {
      "target": "Dispute and Case Management model",
      "relation": "EXTEND",
      "purpose": "Chargeback and error-resolution workflow, evidence exchange with schemes and multi-payment cases extend beyond the payment aggregate. This model holds case linkage, deadlines and liability outcome only.",
      "required": false,
      "source_refs": [
        "SRC-013",
        "SRC-002"
      ]
    },
