  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "The adopting Dimension must name a single owning package for the payment aggregate and declare, per rail it operates on, which participant is the system of record for settlement and finality facts; where the Dimension is not that participant, its records are declared derivative.",
        "The owning package must publish its scheme profile set (one per rail and rulebook version) and its code set registry (status, reason, purpose, charge bearer) with versions, because reason codes are only partially harmonised and are uninterpretable without a versioned code set identity.",
        "The owning package must declare the retention basis and access policy for each element class before any payment record is created, since credential and personal-data elements carry externally imposed prohibitions that cannot be applied retrospectively.",
        "The owning package must declare its business-day calendars and cut-off times per rail, as every statutory execution deadline is computed from a deemed receipt time that depends on them.",
