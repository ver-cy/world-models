                "id": "instant-execution-clocks-and-settlement-lag",
                "name": "Execution clocks, value date and instant SLA",
                "description": "CPMI settlement lag is the time between acceptance of the transfer order by the system and final settlement. PSD2 execution clocks run from time of receipt. For EU instant credit transfers, time of receipt is the moment the payer's PSP receives the order regardless of hour or calendar day; the payer's PSP must immediately verify conditions and funds and send the transaction; the payee's PSP must make funds available and confirm completion within 10 seconds of that time of receipt. EPC SCT Inst scheme rules add tighter originator-PSP response expectations. Value date is a business date, not an identifier. Event time and ingestion time must be stored separately when they differ.",
