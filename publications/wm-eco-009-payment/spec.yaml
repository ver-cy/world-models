        "rationale": "Operators publish dedicated status, return, return-request and investigation messages, and consumer protection rules impose hard investigation deadlines and provisional credit duties. Exceptions are therefore a normatively specified part of the aggregate rather than an error path, and status must be modelled as reported-by-participant rather than as a single global truth.",
