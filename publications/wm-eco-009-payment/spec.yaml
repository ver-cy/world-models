      "inputs": [
        "Originator and beneficiary information",
        "Applicable threshold and the jurisdictions in the chain",
        "Restrictive-measures screening service"
      ],
      "outputs": [
        "Completeness assessment of the required payload",
        "Screening decision for this transfer"
      ],
      "preconditions": [
        "The payment order exists and has not yet been sent to the rail"
