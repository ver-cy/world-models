        "A date, a date-and-amount combination, a statement period or a filename is never an identifier; where a legacy source offers only these, a Dimension-assigned ULID is minted and the legacy string is retained as a non-identifying correlating attribute."
      ],
      "timestamp_rule": "All time values are recorded as RFC 3339 timestamps that include seconds and an explicit numeric offset or the literal Z; local wall-clock strings without an offset are rejected on ingest. Event time (when the act occurred at its source, such as when the payment order was received by the provider, when the rail settled it, or when finality arose) and observation or ingestion time (when the adopting Dimension learned of or recorded it) are stored as two separate fields whenever they differ, and neither may be derived from the other. Where a legally deemed time differs from the actual time (for example a post-cut-off order deemed received on the next business day), both the actual and the deemed value are retained with the rule that produced the deemed value. Durations and deadlines are stored as their computed absolute instants together with the rule and the calendar used, so that a deadline remains auditable after calendar data changes.",
      "serial_naming_rule": "Artifacts that form an ordered series (clearing cycle settlement instructions, account statements, lifecycle event log entries, reconciliation runs, retention policy versions) carry a strictly increasing integer sequence assigned by their issuing authority within a declared scope (rail, account, payment, or policy). Sequence numbers are gap-detectable, never reused and never derived from a calendar date; the date is recorded as a separate attribute. A gap in a received sequence is an explicit completeness defect that must be raised, not silently tolerated, and a duplicate sequence value from the same issuer is a conflict requiring resolution rather than an overwrite.",
      "integrity_rule": "Every artifact carries a content digest computed over its canonical form, the identifier of the issuing authority, and the observation time at which it was received. Append-only artifacts (event logs, screening logs, purge logs, settlement confirmations) additionally chain each entry to the digest of its predecessor within its sequence scope, so that removal or reordering is detectable. Redaction must preserve the chain by replacing content with a redaction marker that retains the original element digest where lawful; where the digest itself must be destroyed, the break is recorded explicitly as an integrity discontinuity with its basis rather than being concealed by recomputation."
    },
    "policies": [
      "Fail closed on unresolved identity: a payment whose authoritative master identifier cannot be established, or whose currency or party references cannot be resolved against their governing siblings, is held rather than processed on inferred values.",
      "Never infer finality. Finality is asserted only from an identified governing rule and an attesting authority; an absence of a failure message, a timeout, or a successful transmission acknowledgement must never be recorded as settled or final.",
      "Preserve the distinction between what a participant reported and what the Dimension concluded. Reported statuses are stored per participant; any aggregate status is a derived value with its precedence rule recorded and is never written back over a source report.",
      "Minimise before transmission and before storage: party and remittance content beyond what the selected rail requires is suppressed by default, and elements whose storage is externally prohibited after authorisation are never persisted, not even transiently in logs.",
      "Deadlines are first-class: every statutory or scheme deadline is materialised as an absolute instant with its start event, rule and calendar at the moment the clock starts, and breaches are recorded as facts rather than corrected retrospectively.",
      "Do not claim conformance to any external standard without evidence. Alignments are recorded as mappings with known losses and conflicts; a rail's own assertion of compliance is stored as that rail's claim, attributed to it.",
      "Do not execute a cross-border payment until travel-rule originator and beneficiary information required for the applicable threshold is complete and payer data has been verified.",
      "Authorization evidence and dual-control or SCA results must be retained with the payment; execution without recorded authorization is an exception event, not a normal create.",
      "Least-privilege access: only parties to the payment, their PSPs, the rail operator for its own rail, and competent authorities with a recorded legal basis may read non-aggregated payment data.",
