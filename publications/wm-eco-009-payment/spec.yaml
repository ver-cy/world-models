        "Status message or observation",
        "Code set version"
      ],
      "outputs": [
        "Payment status report",
        "Resolved aggregate status",
        "Conflict resolution note"
      ],
      "preconditions": [
        "The status can be correlated to a payment through an echoed reference"
      ],
      "effects": [
        "Appends to the lifecycle event log with distinct occurrence and observation times",
        "May supersede a previously reported status under a recorded precedence rule"
      ],
      "source_refs": [
        "SRC-012",
        "SRC-011",
        "SRC-002"
      ]
    },
    {
      "id": "revoke-or-recall-payment",
      "name": "Revoke or recall a payment",
      "description": "Attempt to stop a payment before irrevocability, or raise a recall or return request afterwards, and record the response.",
      "inputs": [
        "Payment aggregate",
        "Requesting party reference",
        "Reason code",
        "Scheme window rules"
      ],
      "outputs": [
        "Cancellation or recall request record",
        "Response outcome",
        "Recovered amount where any"
      ],
      "preconditions": [
        "The requester is entitled to raise the request",
        "The applicable window is identified even if it has closed"
      ],
      "effects": [
        "Before irrevocability, may prevent execution outright",
        "After finality, leaves the original payment intact and can only produce a new return payment"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-012",
        "SRC-004"
      ]
    },
    {
      "id": "handle-dispute-and-error-claim",
      "name": "Handle a dispute or error claim",
      "description": "Open a case on a disputed or unauthorised payment, run the statutory clocks, apply provisional credit where required, gather evidence and determine liability.",
      "inputs": [
        "Payment aggregate",
        "Claim as received",
        "Authorisation evidence record",
        "Applicable consumer rules"
      ],
      "outputs": [
        "Dispute case file",
        "Provisional credit movement",
        "Liability allocation outcome",
        "Written explanation to claimant"
      ],
      "preconditions": [
        "The claim was raised within the applicable notice window",
        "The clock start event is identified"
      ],
      "effects": [
        "Creates hard deadlines for investigation and result reporting",
        "May reverse value provisionally before the determination is made",
        "Suspends scheduled deletion of the related evidence"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-002"
      ]
    },
    {
      "id": "reconcile-and-emit-postings",
      "name": "Reconcile and emit postings",
      "description": "Match instruction, settlement confirmation and statement entry, classify breaks, and hand confirmed economic facts to the accounting model.",
      "inputs": [
        "Payment aggregate",
        "Settlement confirmation record",
        "Payment confirmation and account statement",
        "Matching rules"
      ],
      "outputs": [
        "Reconciliation result set",
        "Ledger posting reference",
        "Break list with ages and owners"
      ],
      "preconditions": [
        "Statement sequence completeness has been checked",
        "Binding keys between instruction and entry are available"
      ],
      "effects": [
        "Produces the accounting handoff without making posting-policy decisions",
        "Leaves unmatched items visible as ageing breaks rather than silently forcing a match"
      ],
      "source_refs": [
        "SRC-012",
        "SRC-011",
        "SRC-007"
      ]
    },
    {
      "id": "apply-retention-and-redaction",
      "name": "Apply retention and redaction",
      "description": "Enforce element-level retention bases, purge or redact expired elements without breaking append-only settlement and event records, and honour legal holds.",
      "inputs": [
        "Payment aggregate",
        "Retention and access policy binding",
        "Legal hold flags",
        "Prohibited element list"
      ],
      "outputs": [
        "Executed purge log entries",
        "Redacted record",
        "Retention compliance report"
      ],
      "preconditions": [
        "A retention basis is recorded for every element class",
        "No legal hold or open dispute covers the elements in scope"
      ],
      "effects": [
        "Removes restricted credential elements while preserving integrity proofs over the remainder",
        "Records the fact of removal permanently even after the data is gone"
      ],
      "source_refs": [
        "SRC-014",
        "SRC-013",
        "SRC-002"
      ]
    },
    {
      "id": "verify-payee",
      "name": "Verify payee",
      "description": "Match the instructed unique identifier to the payee name via scheme directory and record match, close-match or mismatch before the payer confirms execution.",
      "inputs": [
        "Instructed payee unique identifier",
        "Instructed payee name",
        "Scheme directory or verification service"
      ],
      "outputs": [
        "Match, close-match or mismatch result with the time of the check"
      ],
      "preconditions": [
        "The payer has not yet confirmed the order for execution"
      ],
      "effects": [
        "The verification result is recorded on the payment",
        "A payer decision to proceed after a non-match is recorded as an exception"
      ],
      "source_refs": [
        "SRC-024",
        "SRC-021"
      ]
    },
