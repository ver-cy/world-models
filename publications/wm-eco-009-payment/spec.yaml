      "canonicalization_rules": [
        "A payment is canonicalised around exactly one authoritative master identifier; all other references are stored as typed correlating aliases with their assigning participant, and are never promoted to master by convenience.",
        "Amounts are canonicalised as an exact decimal value plus a currency code, with scale validated against the governed minor unit of the referenced registry version; floating-point representation is prohibited and trailing-zero differences are not treated as value differences.",
        "All timestamps are canonicalised to RFC 3339 with seconds and an explicit offset; the stored value preserves the originating offset rather than silently normalising to UTC, because cut-off and business-day rules are local.",
        "Status and reason codes are canonicalised as a triple of code set identifier, code set version and code value; a bare code without its set version is treated as unresolved, not as a default-set code.",
        "Party and account data are canonicalised into their structured components where the source supplied structure; free-text concatenation of a structured address is a lossy projection and never the canonical form.",
        "Ordering of lifecycle events is canonicalised by source-assigned sequence where available, then by occurrence time, then by observation time, with the ordering basis recorded per entry."
