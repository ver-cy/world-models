              {
                "id": "disputes-unauthorised-claims-and-error-resolution",
                "name": "Disputes, unauthorised claims and error resolution",
                "description": "Consumer rules define an error broadly, require notice within sixty days of the statement first reflecting it, oblige the institution to investigate within ten business days or extend to forty-five days with provisional credit, and to report results within three business days of completing the investigation. Separate rules cap payer liability for lost or stolen instruments, remove liability after notification or where strong authentication was not applied, and set a thirteen-month outer limit for unauthorised-transaction claims. These are hard deadlines with defined start events, so the model must record which event started each clock.",
                "source_refs": [
