    "model_id": "WM-ECO-020",
    "name": "Sales Order",
    "entry_kind": "aggregate",
    "purpose": "Give an agent the context needed to understand, create, inspect and operate a seller-side sales order across acceptance, commitment, fulfilment and closure, independent of storage format or interface.",
    "scope_statement": "The sales order as held by the seller: the order record and its lines; the party roles and authority that bind it; the priced, delivery and payment terms it carries; the seller's disposition of the order (acceptance, amendment, rejection, counter-offer); state, change, cancellation and hold control; allocation and despatch linkage; delivered-versus-outstanding accounting; post-delivery claims; and closure. It carries references, bindings and recorded outcomes for neighbouring concerns and never reproduces their lifecycles or enforcement semantics.",
    "in_scope": [
      "Seller-assigned order identity, versioning and line structure",
      "Party roles on the order and the authority under which it was committed or changed",
      "Priced quantities, allowances and charges, currencies, and the delivery and payment terms carried on the order",
      "Seller disposition at header and line level, including counter-offer and conditional acceptance",
      "Order and line state, permitted transitions, holds, blocks and exception paths",
      "Availability promise, allocation and fulfilment schedule lines derived from accepted lines",
      "Despatch linkage to order lines and delivered, outstanding and oversupply quantity accounting",
      "Post-delivery claims recorded against order lines, and order completion and closure",
      "Validation rule and code list bindings with recorded outcomes",
      "Provenance of the inbound order message and separation of event time from ingestion time",
      "Sensitivity classification, disclosable subsets and retention bindings for the order record"
    ],
    "out_of_scope": [
      "Buyer-side requisition, approval and procurement budget lifecycle",
      "Invoice, credit note, tax determination and fiscal reporting",
      "Payment instrument issuance, settlement, dunning and credit scoring",
      "Carrier booking, transport documents, customs declarations and physical movement",
      "Inventory ledger balances, replenishment and warehouse location lifecycle",
      "Trade item master, classification and catalogue lifecycle",
      "Party master identity, deduplication and identifier-scheme registration",
      "Quotation negotiation and framework agreement lifecycle",
      "Reverse logistics execution and refund settlement",
      "Execution of validation rules, policy enforcement and audit-trail storage",
      "Revenue recognition and performance-obligation accounting"
    ],
    "boundary_notes": [
      {
        "neighbor": "Buyer-side purchase order and procurement model",
        "distinction": "The same order document is read from the opposite role. This model begins when the seller receives or captures the order and owns only seller-side disposition, commitment and fulfilment; requisition, approval and buyer budget control stay with the procurement model.",
        "source_refs": [
          "SRC-002",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Invoice and credit note model",
        "distinction": "Order tax totals and anticipated monetary totals are indicative buyer expectations, not fiscal determinations. The legally binding priced document, tax determination and e-invoicing compliance obligations belong to the invoice model.",
        "source_refs": [
          "SRC-002",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Despatch, shipment and transport execution model",
        "distinction": "The order holds despatch and consignment references and the delivered, outstanding and oversupply accounting per line. Shipment structure, carrier detail and physical transport execution are owned by the despatch and transport models.",
        "source_refs": [
          "SRC-005"
        ]
      },
      {
        "neighbor": "Quotation, contract and framework agreement model",
        "distinction": "The order cites the upstream commercial basis and any call-off parameters, but negotiation, agreement lifecycle and term precedence remain with the agreement model.",
        "source_refs": [
          "SRC-002",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Trade item and trade party master models",
        "distinction": "Order lines and party roles carry scheme-qualified references plus the snapshot actually agreed at order time. Master attribute stewardship and identifier-scheme governance stay with those models.",
        "source_refs": [
          "SRC-002",
          "SRC-004",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Trade term rule set (delivery terms classifier)",
        "distinction": "The order binds a coded trade term rule to a named place and records the resulting obligation split. The rule set's content, versioning and interpretation are owned by its publisher, and transfer of title falls outside it.",
        "source_refs": [
          "SRC-010"
        ]
      },
      {
        "neighbor": "Applicable sales law and consumer protection regimes",
        "distinction": "The order records an applicability determination and citation only. Uniform international sales law does not cover consumer sales, so consumer duties come from jurisdictional instruments this model references but does not restate.",
        "source_refs": [
          "SRC-009"
        ]
      },
      {
        "neighbor": "Records management, data protection and audit models of the adopting Dimension",
        "distinction": "This model declares classification, retention triggers, tombstone content and evidence pointers. Execution of retention, erasure and audit-trail storage and immutability is owned by those models.",
        "source_refs": [
          "SRC-006",
          "SRC-012"
        ]
      }
    ]
  },
