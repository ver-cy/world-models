    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier: the sales order identifier assigned by the seller's system of record for orders, scoped to the issuing seller legal entity, is the primary key for every artifact in this model.",
        "Governed global identifier or IRI: a scheme-qualified identifier issued under an external governed scheme - such as a party, location or trade item key resolved under its declared scheme - or a dereferenceable IRI minted in the owning Dimension's registered namespace.",
        "UUID or ULID assigned by the adopting Dimension where neither an authoritative master-system identifier nor a governed global identifier exists, recorded together with its minting authority and minting instant.",
        "Buyer order references, customer references and accounting cost codes are cross-references only and must never be promoted to a primary key. A date, a delivery period, an issue date or a version effective-from instant is never an identifier."
      ],
      "timestamp_rule": "All instants are recorded as RFC 3339 date-time values with seconds present and an explicit numeric offset or the Z designator; a local offset is never omitted or inferred from the reader's environment, and the -00:00 form is used only where UTC is known but the local offset is not. Event time (when the business fact occurred - order issue, acceptance, despatch, delivery, claim) is recorded separately from observation or ingestion time (when the seller's system received or captured the fact) wherever the two can differ, and both are retained on inbound and fulfilment records. Date-only values such as a requested delivery date remain dates and are never widened into instants by assuming a local midnight.",
      "serial_naming_rule": "Serial artifacts are named by their parent key plus a monotonically increasing, zero-padded sequence value assigned by the owning Dimension, for example <sales-order-id>/response/0007 or <sales-order-id>/<line-id>/schedule/003. Sequence values are never reused after deletion or void, never encode a date or any business meaning, and never by themselves determine effect: ordering for effect is decided by the recorded event timestamp together with the supersession pointer.",
      "integrity_rule": "Every artifact records a content digest over its canonical form, the identifier and version of the specification it was produced under, and a pointer to its validation outcome. Cross-artifact references cite the target identifier and, where the target is versioned, the exact version. A reference that cannot be resolved marks the referring record as degraded rather than silently dropping it. Digest and signature verification are performed by the referenced validation and cryptographic components; this model stores only the recorded outcome."
