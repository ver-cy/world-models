    "canon_and_patch": {
      "canonicalization_rules": [
        "The canonical sales order is the seller's record keyed by the seller-assigned sales order identifier; received message payloads are provenance, never the canonical record.",
        "Every coded value is stored together with its code list identifier and pinned version; a bare code is not canonical.",
        "Amounts are stored with an explicit currency code at the precision the pinned profile requires, and quantities are stored with an explicit unit of measure code.",
        "All instants are canonicalised to the timestamp profile with an explicit offset; date-only values stay dates and are never widened to instants by assuming a local midnight.",
        "Party and item values are canonicalised to a scheme-qualified reference plus the snapshot actually agreed at order time; snapshots are never silently refreshed from master data."
