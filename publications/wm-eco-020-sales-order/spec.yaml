      "patch_rules": [
        "An accepted order is amended only by a recorded change or cancellation citing the target version counter; in-place mutation of an accepted version is prohibited.",
        "Each accepted amendment produces a new effective version with an effective-from timestamp and a supersession pointer to the version it replaces, which remains readable.",
        "Corrections to provenance or classification metadata that do not alter agreed commercial terms are applied as metadata patches with their own provenance entry and do not increment the commercial version counter.",
        "A patch that would alter an already-despatched quantity is rejected and routed to the post-delivery claim path."
