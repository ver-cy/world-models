        "Pin the external specification versions bound by the package - order syntax and profile, code lists, trade term rule set and timestamp profile - and record the date each pin was last reviewed.",
        "Declare which sibling models supply party, item, inventory, agreement, invoice, payment, shipment, validation and records-management context, and forbid local forks of them."
      ],
      "namespace_guidance": "Use a stable, dereferenceable namespace under the adopting Dimension's authority, segmented per seller legal entity where identifier uniqueness is entity-scoped, for example <dimension-base>/sales-order/<seller-entity>/. Never encode a date, environment name, storage technology or transport protocol in the namespace. External identifiers - customization and profile identifiers, party and item schemes, trade term rule codes, code list keys - are referenced under their publishers' namespaces and are never re-minted locally.",
      "registry_links": [
