        "name": "Order Identity and Scope",
        "description": "What a sales order record is, how it is identified, what it points at, and how its lines are structured and addressed.",
        "rationale": "UBL 2.4 anchors ordering on distinct sender-assigned and seller-assigned identifiers plus explicit document references, and Peppol requires addressable lines for any line-level disposition. Without settled identity and line structure, no state, promise or fulfilment claim can attach to anything.",
