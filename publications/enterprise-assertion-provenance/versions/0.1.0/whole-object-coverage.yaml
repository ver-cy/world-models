{
  "Capture": {
    "identity-class": {
      "disposition": "required",
      "reason": "Source, representation, acquisition time and mode anchors"
    },
    "direct-properties": {
      "disposition": "required",
      "reason": "Availability, optional digest/author/origin and declared integrity"
    },
    "recognition-observation": {
      "disposition": "required",
      "reason": "Capture mode/subject/time consistency; no live connector proof"
    },
    "capabilities-behaviour-actions": {
      "disposition": "required",
      "reason": "Record metadata correction or terminal withdrawal; new acquisition gets new ID"
    },
    "context-evidence": {
      "disposition": "required",
      "reason": "Source identity/version and origin declarations, recorder and limitations"
    }
  },
  "Activity": {
    "identity-class": {
      "disposition": "required",
      "reason": "One occurrence with stable mode/actor/time/method/inputs"
    },
    "direct-properties": {
      "disposition": "required",
      "reason": "Exact prior input pins and optional observed target"
    },
    "recognition-observation": {
      "disposition": "required",
      "reason": "Typed input and interval checks, declared execution only"
    },
    "capabilities-behaviour-actions": {
      "disposition": "required",
      "reason": "Create a new ID for a new run; correct notes or withdraw"
    },
    "context-evidence": {
      "disposition": "required",
      "reason": "Method pin, executing actor and source inputs"
    }
  },
  "ProvenanceRecord": {
    "identity-class": {
      "disposition": "required",
      "reason": "Asserter plus pinned claim, subject and epistemic kind"
    },
    "direct-properties": {
      "disposition": "required",
      "reason": "Activity pin and explicit limitations"
    },
    "recognition-observation": {
      "disposition": "required",
      "reason": "Kind-specific activity/subject consistency"
    },
    "capabilities-behaviour-actions": {
      "disposition": "required",
      "reason": "Correct activity reference or limitations; withdraw; changed kind/claim gets new ID"
    },
    "context-evidence": {
      "disposition": "required",
      "reason": "External claim content delegated to its pinned owner; local input closure retained"
    }
  },
  "EvidenceLink": {
    "identity-class": {
      "disposition": "required",
      "reason": "Pinned source/target endpoints, relation kind and author"
    },
    "direct-properties": {
      "disposition": "required",
      "reason": "Selector and explicit rationale"
    },
    "recognition-observation": {
      "disposition": "required",
      "reason": "Exact local source pin and external target pin; selector not executed"
    },
    "capabilities-behaviour-actions": {
      "disposition": "required",
      "reason": "Revise rationale/selector; withdraw; new endpoint or polarity gets new ID"
    },
    "context-evidence": {
      "disposition": "required",
      "reason": "No inherited source authorship, veracity or support default"
    }
  },
  "ConfidenceAssessment": {
    "identity-class": {
      "disposition": "required",
      "reason": "Exact account, assessor, purpose, method and scheme"
    },
    "direct-properties": {
      "disposition": "required",
      "reason": "Qualitative label, basis, review activity and limitations"
    },
    "recognition-observation": {
      "disposition": "required",
      "reason": "Reviewer/method/target consistency; quality of judgement external"
    },
    "capabilities-behaviour-actions": {
      "disposition": "required",
      "reason": "Correct label/basis explicitly or withdraw; new independent judgement gets new ID"
    },
    "context-evidence": {
      "disposition": "required",
      "reason": "No numeric probability, score aggregation or cross-method conversion"
    }
  },
  "ProvenanceRegister": {
    "identity-class": {
      "disposition": "required",
      "reason": "One aggregate per Dimension: dimension URI plus provenance-register suffix"
    },
    "direct-properties": {
      "disposition": "required",
      "reason": "Versioned header, complete ordered records and immutable snapshot digest"
    },
    "recognition-observation": {
      "disposition": "required",
      "reason": "Full structural/history validation; completeness requires trusted previous root"
    },
    "capabilities-behaviour-actions": {
      "disposition": "required",
      "reason": "Append authorized records, verify extension; no delete or partial projection"
    },
    "context-evidence": {
      "disposition": "required",
      "reason": "Host config and operator; external claim mastership not transferred"
    }
  }
}
