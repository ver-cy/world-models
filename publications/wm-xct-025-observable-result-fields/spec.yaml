      "timestamp_rule": "All time values use RFC 3339 with at least whole seconds and an explicit UTC offset or a trailing `Z`; local times without an offset are rejected at creation. Event time (phenomenon time, the time the result applies to the feature of interest) is recorded separately from observation and ingestion time (result time, when the observing activity completed, and the time the record entered the store) whenever the two can differ, and neither may be inferred from the other. Sub-second precision is permitted and preserved when supplied.",
      "serial_naming_rule": "Serial artifacts such as raw observation records are named `<host-record-id>--<observed-property-code>--<zero-padded-sequence>`, where the sequence is a monotonic counter assigned by the acquiring system. The name carries no date component, no unit, no measured value and no status, and the sequence must not be read as ordering by phenomenon time.",
