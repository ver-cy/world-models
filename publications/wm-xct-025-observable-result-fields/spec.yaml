      "canonicalization_rules": [
        "Canonical form orders fields lexicographically by fully qualified field name, preserves the as-reported numeric literal including trailing zeros, and writes unit codes exactly as defined by the pinned code system including case.",
        "Time values are canonicalised to RFC 3339 with at least whole seconds and an explicit offset; a literal `Z` is preserved rather than rewritten to `+00:00`.",
        "Absent optional fields are omitted rather than encoded as an explicit null, so that digests stay stable across projections and storage engines.",
        "Derived fields such as the canonical-unit expression are excluded from the payload digest and recomputed on read."
