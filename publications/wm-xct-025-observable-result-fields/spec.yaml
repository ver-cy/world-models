  "model": {
    "registry_id": "vr.wm-xct-025",
    "model_id": "WM-XCT-025",
    "name": "Observable Result Fields",
    "entry_kind": "mixin",
    "purpose": "Provide a reusable, format-neutral field group for expressing an observation or measurement result — measurand binding, value, unit and quantity kind, method reference, uncertainty, limits, time anchoring, state, provenance and disclosure class — so that any host record can carry an interpretable, comparable result without forking metrology semantics.",
    "scope_statement": "This mixin defines the fields that make a reported value interpretable and comparable, and the rules that govern them. It attaches to a host record (registered parent WM-MAT-008 and any other adopting host) and carries references into vocabularies, procedures, devices, samples, access policy and conformity-decision models without reproducing their lifecycles. Storage and interface (JSON, RDF, Markdown, Git, MCP, MongoDB) are projections of these semantics, never their definition.",
    "in_scope": [
      "Measurand and observed-property binding, including specified conditions and property class (quantity, ordinal, nominal)",
      "Value representation: scalar, coded, ordinal, boolean, range, ratio, component/tuple and reference to an external series",
      "Unit code and code-system binding, quantity kind, dimensional commensurability, canonical expression alongside the as-reported value",
      "Numeric precision, declared resolution and rounding rules",
      "Reference to the procedure or method and the subject-specific parameters and influence quantities that qualify the value",
      "Uncertainty statement: components, evaluation type, distribution, combined standard uncertainty, coverage factor and coverage probability",
      "Detection and quantitation limits, comparator operators and censored values",
      "Phenomenon (event) time, result time and ingestion time, validity window and aggregation period",
      "Result status, supersession and amendment linkage; coded absence of a value",
      "Derivation and assertion lineage, evidence references and digests",
      "Sensitivity classification, redaction signalling and retention class recorded as references"
    ],
    "out_of_scope": [
      "The observation act, sampling activity and their scheduling (owned by an observation/event model)",
      "Sensor, device and platform registration, calibration execution and certificate issuance",
      "Minting, deprecation or maintenance of unit codes, quantity kinds and conversion factor tables",
      "Authoring, validation studies and approval lifecycle of procedures and methods",
      "Feature-of-interest, sample and specimen definition and custody",
      "Numerical propagation of distributions through a measurement model (performed by the producing measurement system)",
      "Conformity assessment, acceptance decisions, guard banding and pass/fail rules",
      "Access evaluation, enforcement, audit-trail storage and physical disposition execution",
      "Time-series, coverage and statistical dataset storage, indexing and compression",
      "Laboratory accreditation, quality-management and competence claims",
      "Alerting, clinical or operational decision support acting on a result"
    ],
    "boundary_notes": [
      {
        "neighbor": "Observation act / event model (sosa:Observation, OMS Observation)",
        "distinction": "The act carries exactly one result; this mixin defines the result payload's fields and their interpretation rules. It does not own the act, its sampling features, its stimulus or its scheduling.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Sensor, device and calibration record model",
        "distinction": "This mixin carries an observer/device reference and a calibration record reference plus a validity-at-observation check. Device lifecycle, calibration execution and certificate issuance stay with that model.",
        "source_refs": [
          "SRC-002",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Unit and quantity-kind vocabulary registry (UCUM, QUDT, UN/CEFACT Rec 20)",
        "distinction": "This mixin pins a code system version and cites codes, quantity kinds and conversion factors by reference. Code minting, deprecation and factor maintenance are the registry's.",
        "source_refs": [
          "SRC-005",
          "SRC-008",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Procedure and method catalogue",
        "distinction": "This mixin carries a method identifier, version and subject-specific parameter overrides. Method authoring, validation studies and approval remain in the catalogue.",
        "source_refs": [
          "SRC-001",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Conformity assessment / decision-rule model",
        "distinction": "Interpretation flags and a reference to an applied reference interval are carried here as context; acceptance, pass/fail and guard-band decisions and their records belong to the decision model.",
        "source_refs": [
          "SRC-012",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Feature-of-interest, sample and specimen model",
        "distinction": "Referenced only, to anchor what the value is about; sample identity, hierarchy and custody are not modelled here.",
        "source_refs": [
          "SRC-001"
        ]
      },
      {
        "neighbor": "Access policy, audit and retention model of the adopting Dimension",
        "distinction": "As FHIR separates Observation from its security and audit resources, this mixin records a sensitivity class, a policy reference and a retention class only; evaluation, enforcement, audit-trail storage and disposition execution are external.",
        "source_refs": [
          "SRC-006"
        ]
      },
      {
        "neighbor": "Time-series / statistical dataset model (SensorThings Datastream, FHIR SampledData)",
        "distinction": "When the result is a large series the mixin holds a reference plus the fields needed to interpret it; series storage, windowing and aggregation infrastructure are external.",
        "source_refs": [
          "SRC-009",
          "SRC-007"
        ]
      }
    ]
  },
