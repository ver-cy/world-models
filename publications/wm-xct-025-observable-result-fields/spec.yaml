        "Making a field mandatory, narrowing a value set, changing the pinned unit code system or altering canonicalisation is a breaking change requiring a new binding profile major version.",
        "Consumers must ignore unknown optional fields and must never infer a unit, a coverage factor or a code system when the corresponding field is absent.",
