  "functions": [
    {
      "id": "bind-result-fields",
      "name": "Bind result fields to a host record type",
      "description": "Attaches the field group to a host record type under a named, versioned binding profile that fixes value kinds, unit code systems, mandatory fields and namespace prefix.",
      "inputs": [
        "host record type identifier",
        "binding profile identifier and version",
        "mandatory field selection"
      ],
      "outputs": [
        "bound field group definition on the host type",
        "binding validation report"
      ],
      "preconditions": [
        "Host record type is registered and its owner is named",
        "Profile pins unit code system and permissible value sets"
      ],
      "effects": [
        "Host records of that type accept and validate the field group",
        "Namespace prefix is reserved so group fields cannot collide with host-native fields"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-006"
      ]
    },
    {
      "id": "validate-unit-quantity-consistency",
      "name": "Validate unit against quantity kind",
      "description": "Checks that the recorded unit code resolves in the pinned code system and that its dimension is commensurable with the declared quantity kind of the observed property.",
      "inputs": [
        "unit code and code system version",
        "declared quantity kind or dimensionless declaration",
        "numeric value"
      ],
      "outputs": [
        "commensurability verdict",
        "dimension comparison detail",
        "rejection reason when inconsistent"
      ],
      "preconditions": [
        "Unit code resolves in the pinned code system",
        "Observed property declares a quantity kind or is explicitly dimensionless"
      ],
      "effects": [
        "Inconsistent records are rejected at creation and the verdict is stored with the record",
        "Unresolvable unit codes quarantine the record rather than coercing a unit"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-008",
        "SRC-011"
      ]
    },
    {
      "id": "record-canonical-expression",
      "name": "Record a canonical-unit expression",
      "description": "Stores a derived canonical-unit expression alongside the unchanged as-reported value, using a conversion factor resolved from the referenced unit registry.",
      "inputs": [
        "as-reported value and unit",
        "target canonical unit",
        "conversion multiplier and offset resolved from the unit registry"
      ],
      "outputs": [
        "canonical expression labelled as derived",
        "conversion provenance record"
      ],
      "preconditions": [
        "Units are commensurable",
        "Conversion factor carries a registry reference and version"
      ],
      "effects": [
        "The as-reported value remains authoritative and unmodified",
        "Offset units are converted only with the registry-declared offset, and ratio arithmetic on them is refused"
      ],
      "source_refs": [
        "SRC-008",
        "SRC-011"
      ]
