  "structure": {
    "bundles": [
      {
        "id": "result-semantics",
        "name": "Result Semantics and Host Binding",
        "description": "What the reported value is about, how it is shaped, and how the field group attaches to a host record.",
        "rationale": "OMS requires the result type and scale to be consistent with the observed property, and SOSA binds a result to exactly one observed property and feature of interest; a reusable field group is uninterpretable unless that binding and its host attachment are fixed first.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-004"
        ],
        "layers": [
          {
            "id": "measurand-definition",
            "name": "Measurand and Observed Property",
            "description": "Identification of the property observed, the entity it belongs to, and the specification detail that makes the value interpretable.",
            "source_refs": [
              "SRC-001",
              "SRC-002",
              "SRC-004"
            ],
            "findings": [
              {
                "id": "measurand-and-observed-property",
                "name": "Measurand binding and specification",
                "description": "A value is meaningless without the property it quantifies, the entity that property belongs to, and the conditions under which it was specified; VIM treats a result as quantity values attributed to a measurand plus all other relevant information.",
                "source_refs": [
                  "SRC-004",
                  "SRC-001",
                  "SRC-002"
                ],
                "questions": [
                  {
                    "id": "q-measurand-what",
                    "text": "Which observable property, under which specified conditions, does this value quantify?",
                    "kind": "definition",
                    "answer_data": [
                      "observed property code and code system",
                      "measurand specification text or reference",
                      "stated conditions such as temperature, matrix or orientation"
                    ]
                  },
                  {
                    "id": "q-measurand-subject",
                    "text": "Which feature of interest or sample does the result apply to, and is that the ultimate or a proximate subject?",
                    "kind": "relationship",
                    "answer_data": [
                      "feature-of-interest reference",
                      "sample or specimen reference",
                      "proximate versus ultimate subject flag"
                    ]
                  },
                  {
                    "id": "q-measurand-class",
                    "text": "Is the observed property a quantity, an ordinal property or a nominal property?",
                    "kind": "classification",
                    "answer_data": [
                      "property class code",
                      "scale type",
                      "permissible value domain reference"
                    ]
                  },
                  {
                    "id": "q-measurand-minimum",
                    "text": "Below which set of measurand descriptors must the value be rejected as uninterpretable?",
                    "kind": "requirement",
                    "answer_data": [
                      "required descriptor list per profile",
                      "rejection rule",
                      "handling of legacy records missing descriptors"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "observed-property-code",
                    "name": "Observed property code",
                    "description": "Governed code identifying the property observed.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-001",
                      "SRC-002"
                    ]
                  },
                  {
                    "id": "measurand-specification",
                    "name": "Measurand specification",
                    "description": "Narrative or referenced specification of the measurand including conditions of measurement.",
                    "value_kind": "text",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-004"
                    ]
                  },
                  {
                    "id": "feature-of-interest-ref",
                    "name": "Feature of interest reference",
                    "description": "Reference to the entity or sample whose property was observed; the entity itself is modelled elsewhere.",
                    "value_kind": "reference",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-001",
                      "SRC-002"
                    ]
                  },
                  {
                    "id": "property-class",
                    "name": "Property class",
                    "description": "Whether the property is a quantity, an ordinal property or a nominal property.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-004"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "These descriptors are inline reference fields on the host record. The property vocabulary and the feature-of-interest record are owned by referenced sibling models, so this finding produces no artifact of its own."
              }
            ]
          },
          {
            "id": "value-representation",
            "name": "Value Representation",
            "description": "The permitted shapes of a result value and how their precision and structure survive storage and exchange.",
            "source_refs": [
              "SRC-006",
              "SRC-007",
              "SRC-002"
            ],
            "findings": [
              {
                "id": "value-kind-and-datatype",
                "name": "Value kind and primitive carriage",
                "description": "FHIR carries thirteen value[x] alternatives and SOSA offers both a simple literal result and a structured Result object; a reusable field group must fix which shape a host property uses and how the primitive is carried.",
                "source_refs": [
                  "SRC-006",
                  "SRC-007",
                  "SRC-002"
                ],
                "questions": [
                  {
                    "id": "q-value-shape",
                    "text": "Which value representation is used for this property, and is that choice fixed for the host record type?",
                    "kind": "classification",
                    "answer_data": [
                      "value representation kind code",
                      "profile constraint fixing the kind",
                      "permitted alternatives"
                    ]
                  },
                  {
                    "id": "q-value-precision-carriage",
                    "text": "How is the primitive value carried so that its declared decimal precision survives storage and re-encoding?",
                    "kind": "interoperability",
                    "answer_data": [
                      "numeric carriage type (decimal string versus binary float)",
                      "trailing-zero preservation rule",
                      "encoding notes per projection"
                    ]
                  },
                  {
                    "id": "q-value-identity",
                    "text": "What makes two recorded values of this property the same value for deduplication?",
                    "kind": "identity",
                    "answer_data": [
                      "equality rule over value, unit and precision",
                      "canonical digest inputs",
                      "tolerance policy or its explicit absence"
                    ]
                  },
                  {
                    "id": "q-value-prohibited",
                    "text": "Which value representations are prohibited for this property, and on what grounds?",
                    "kind": "constraint",
                    "answer_data": [
                      "prohibited kinds list",
                      "justification reference",
                      "validation error code"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "result-value-slot",
                    "name": "Result value",
                    "description": "The polymorphic value slot whose concrete shape is fixed by the binding profile.",
                    "value_kind": "other",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-006",
                      "SRC-002"
                    ]
                  },
                  {
                    "id": "value-representation-kind",
                    "name": "Value representation kind",
                    "description": "Code naming the concrete shape used (quantity, coded, boolean, range, ratio, series reference and so on).",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-006"
                    ]
                  },
                  {
                    "id": "value-precision-declaration",
                    "name": "Declared precision",
                    "description": "Explicit statement of the significant digits carried by the value as reported.",
                    "value_kind": "text",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-007"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "The value slot and its declared shape are inline scalar fields of the host record; nothing here is a separable, independently identified object, so declaring an artifact would misrepresent the storage semantics."
              },
              {
                "id": "structured-and-ordinal-results",
                "name": "Structured, coded and referenced results",
                "description": "Composite observations (components), bounded results (range, ratio), ordinal and nominal codes, and results too large to embed all need declared structure and ordering.",
                "source_refs": [
                  "SRC-006",
                  "SRC-007",
                  "SRC-009",
                  "SRC-004"
                ],
                "questions": [
                  {
                    "id": "q-structured-components",
                    "text": "When one observation yields several correlated components, how are they grouped, coded and ordered?",
                    "kind": "composition",
                    "answer_data": [
                      "component code per part",
                      "grouping and ordering rule",
                      "correlation note between components"
                    ]
                  },
                  {
                    "id": "q-structured-codeset",
                    "text": "How is a coded or ordinal result bound to its permissible value set and to a defined ordering?",
                    "kind": "classification",
                    "answer_data": [
                      "value set reference and version",
                      "ordering declaration for ordinal values",
                      "rule forbidding arithmetic on ordinal codes"
                    ]
                  },
                  {
                    "id": "q-structured-range",
                    "text": "How is a result expressed as a range or ratio distinguished from a point value carrying uncertainty?",
                    "kind": "definition",
                    "answer_data": [
                      "range or ratio field structure",
                      "inclusivity of bounds",
                      "rule separating a range from an uncertainty interval"
                    ]
                  },
                  {
                    "id": "q-structured-series",
                    "text": "Which reference carries a result held as a large series or waveform outside the record?",
                    "kind": "relationship",
                    "answer_data": [
                      "series or datastream reference",
                      "sampling interval and interval unit",
                      "offset and origin declaration"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "result-components",
                    "name": "Result components",
                    "description": "Ordered set of coded component values belonging to one observation.",
                    "value_kind": "collection",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-006"
                    ]
                  },
                  {
                    "id": "value-set-ref",
                    "name": "Permissible value set reference",
                    "description": "Reference to the governed code list and version constraining a coded or ordinal result.",
                    "value_kind": "reference",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-006"
                    ]
                  },
                  {
                    "id": "series-ref",
                    "name": "External series reference",
                    "description": "Reference to a series, waveform or datastream carrying the result payload.",
                    "value_kind": "reference",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-009",
