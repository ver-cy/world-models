    "adversarial_checks": [
      "Is any structural node presented as canonical without primary support? The blanket/standing/call-off vocabulary is the weakest point; it is deliberately split into a coded order type (SRC-001) plus a commitment pattern, with the terminology inconsistency recorded as a conflict citing a secondary source, rather than asserted as a controlled list.",
      "Does the model duplicate a sibling? Fulfilment events, invoice content, quotation pricing and contract clause bodies were each tested for leakage and pushed out to WM-ECO-024, the settlement model, WM-ECO-021 and WM-ECO-006 respectively; only linking references and the terms that create obligations remain here, and boundary notes state the distinction for each.",
      "Does the model assume acceptance is automatic on issuance? Explicitly not: FAR treats the order as a unilateral offer, so the state model separates issued from accepted, provides acceptance by performance as a distinct function, and a policy forbids reporting a contract as formed on issuance alone.",
      "Does the model smuggle format into semantics? Profile and customization identifiers, UBL element names and the 'NA' filler convention are confined to the interoperability layer and the projection function; the canonicalisation rules explicitly treat syntax fillers as projection artefacts that must not be read back into the source.",
