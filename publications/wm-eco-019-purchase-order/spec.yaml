    "regional_assumptions": [
      "FAR Parts 4 and 13 govern US federal acquisition only. Their treatment of purchase orders as unilateral offers, modification numbering, cancellation versus termination, and the 3- and 4-year retention periods should not be assumed to apply to commercial buyers or to other jurisdictions.",
      "Peppol BIS Ordering and BIS Billing reflect European post-award practice and their profile identifiers, EAS electronic address codes and ICD party schemes are governed by OpenPeppol; they carry no authority outside that network.",
      "CISG applies only between parties whose places of business are in different contracting states (or where private international law points to one), and parties may exclude it by agreement; a purchase order under a domestic contract is governed by domestic sale-of-goods law instead.",
      "GLN allocation, prefix length and the non-reuse policy effective 1 July 2022 are administered by GS1 Member Organisations; details cited here come from GS1 Australia and may differ in presentation, though not in the underlying standard, elsewhere.",
      "Retention periods for commercial (non-government) purchase orders are set by national commercial, tax and accounting law and are not covered by any source consulted here.",
      "Incoterms 2020 is the current edition but earlier editions remain in lawful use where a contract names them, so the edition must always be recorded with the term.",
      "Peppol BIS Ordering is written for EU and EEA public eProcurement and B2B/B2G; it is an alignment, not a global mandate.",
      "CISG applies to international sales of goods between contracting states and not automatically to services-only orders or to states that reserved Part II.",
      "VAT, GST and sales-tax treatment of estimated tax on orders is regime-specific.",
      "UN/EDIFACT ORDERS remains widely used in global retail and manufacturing independently of Peppol.",
      "Public-sector buyers may be subject to EU procurement directives when using this BIS, as Peppol itself warns."
