    "known_omissions": [
      "UN/EDIFACT ORDERS and ANSI ASC X12 850/855/860/865 are the two most widely deployed order syntaxes and neither could be retrieved live (UNECE service returned HTTP 403; x12.org did not expose the 850 transaction set on the page fetched). Their mapping is therefore absent rather than asserted, and the interoperability layer is weaker for classic EDI than for UBL and Peppol.",
      "No source was verified for tax determination on orders (VAT category codes, reverse charge, place-of-supply), so tax is modelled only as an indicative amount and a code-list reference.",
      "Consignment, vendor-managed inventory, scheduling agreements and just-in-time delivery call-offs are acknowledged as purchasing patterns but not modelled in detail; each may need its own contained model.",
      "Services procurement (timesheets, milestones, statements of work) is treated identically to goods at the line level, which understates milestone-based acceptance and progress payment structures.",
      "Electronic signature and sealing formats for orders, and the legal weight of each, are not covered.",
      "Currency of account versus currency of settlement, and hedging or price-adjustment clauses, are only gestured at through the price-status question.",
      "Public-sector specific order metadata (procurement procedure reference, CPV/UNSPSC classification obligations, contract award notice linkage) is not modelled.",
      "ICC Incoterms 2020 official text was not fetched; UBL only cites CIF, FOB and EXW as example delivery-term alignments",
      "United States UCC Article 2 and FAR/DFARS federal purchase orders were not independently retrieved as primary sources",
      "ASC X12 850/855 TR3 content is membership-gated; North American EDI is an alignment gap rather than a canonical node",
      "UN/CEFACT Buyer's Order CCL / SCRDM was not fetched beyond EDIFACT ORDERS D.99B",
      "Standing, rush, subscription and digital-goods or SaaS order semantics lack first-party coverage here",
      "Islamic financing purchase instruments and letter-of-credit specific order clauses are not modelled",
      "Line-level cancellation as a first-class document distinct from Order Change is not specified by the cited UBL process",
      "National commercial-books retention periods (often five to ten years) are jurisdiction-specific and not enumerated",
      "GDPR and other privacy statutes are not cited; only the presence of contact personal data on Peppol/UBL parties is sourced"
    ],
    "conflicts": [
      "FAR 13 states that a quotation is not an offer and cannot be accepted by the government to form a binding contract, whereas under CISG a sufficiently definite communication indicating intent to be bound can be an offer regardless of what it is called. The formation posture must therefore be recorded explicitly per order rather than inferred from the document type.",
      "UBL treats order references as optional in several places, while Peppol BIS Billing makes cbc:ID within cac:OrderReference 1..1 and prescribes an 'NA' filler when only a sales order reference exists. A filler value that is syntactically valid but semantically empty conflicts with the canonicalisation rule that absent values are omitted; the model resolves this by treating the filler as a projection artefact only.",
      "Peppol BIS Ordering 3.3 binds to UBL 2.1 while UBL 2.4 is the current OASIS Standard, so the alignment targets are at different versions of the same document model and cannot both be conformed to simultaneously without a declared profile.",
      "Incoterms 2020 allocate delivery, cost and risk but do not determine transfer of title; commercial practice frequently conflates the two, and orders that state a trade term but no title clause leave ownership transfer undefined.",
      "FAR 4.703 sets a 3-year baseline after final payment while 4.705-1 and 4.705-3 set 4 years for purchase order records, so a single order file can attract different periods; the model adopts the longest-applicable-period rule to resolve this.",
      "Industry terminology for framework purchasing (blanket order, standing order, call-off, release order) is used inconsistently and no consulted primary source normalises it; the model separates the coded order type from the commitment pattern instead of picking a winner.",
      "UN/EDIFACT document-name 105 Purchase Order is an internal enterprise document, while UBL alternative business term Purchase Order and common commercial usage mean the exchanged buyer-to-seller Order (typically code 220). This model follows the exchanged-commitment sense and maps 105 to originator requisition.",
      "CISG art. 18: silence or inactivity is not in itself acceptance, but some courts give effect to commercial letters of confirmation where a usage exists under art. 9. Adopters must record which rule they apply.",
      "Peppol dates shall not include timezone information, while this Dimension requires RFC 3339 timestamps with seconds and explicit offset; date-only source values must be normalised, not treated as already conformant.",
      "UBL DocumentCurrencyCode is optional on Order; Peppol T01 makes it fatal-mandatory.",
      "Peppol states TAX on orders is informative and does not affect terms of trade; some tax administrations may still treat a stated VAT amount as a representation. Do not claim tax-document status.",
      "UBL full Order Response replaces the entire order state; Peppol also allows partial acceptance and multiple responses for one order. Both patterns must be recorded rather than collapsed.",
      "ISO/IEC 19845 has frozen earlier UBL versions; OASIS UBL 2.4 is the OASIS Standard used here and is not automatically the ISO edition.",
      "Peppol Ordering does not mandate eSignature; UBL defines a signature extension. Unsigned orders can be valid in Peppol and still lack non-repudiation evidence."
