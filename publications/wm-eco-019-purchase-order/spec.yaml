      "inputs": [
        "order identifier",
        "identifier scheme",
        "optional revision selector",
        "optional counterparty context"
      ],
      "outputs": [
        "resolved order aggregate reference",
        "resolved revision",
        "resolution confidence and failure reason"
      ],
      "preconditions": [
        "identifier scheme is registered",
        "caller is authorised to read the order"
      ],
      "effects": [
        "records a resolution attempt in the audit log",
        "raises a broken-reference exception when no unique match exists"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-010"
      ]
    },
    {
      "id": "compose-purchase-order",
