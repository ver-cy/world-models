    "name": "Purchase Order",
    "entry_kind": "aggregate",
    "purpose": "Give an agent the context needed to interpret, create, validate and operate a purchase order as a buyer-issued commitment instrument, and to track it through response, amendment, fulfilment linkage and closure, independently of storage format or interface.",
    "scope_statement": "Covers the purchase order as an identifiable commercial instrument issued by a buyer to a seller: identity and revision, classification and purchasing pattern, parties and commitment authority, line-item and commercial terms content, delivery instruction, lifecycle from issue through response, amendment, cancellation and closure, and the governance layers (provenance, retention, access, interoperability) needed to operate it. It stops where a distinct instrument or sibling model takes over: the quotation that may precede it, the contract or framework agreement it draws on, the fulfilment obligations it creates, and the invoice and payment that settle it. Registry entry_kind 'standalone-mm' is expressed here as 'aggregate' because the order header is the aggregate root and order lines have no identity outside it.",
    "in_scope": [
      "Order header identity, document versioning and revision control",
      "Order classification and purchasing pattern (standalone, call-off/release against a framework, change, consignment, drop-ship)",
      "Buyer, seller and ancillary party roles and their identification schemes",
      "Order line composition: item identification, ordered quantity, unit of measure, packaging",
      "Price basis, allowances and charges, currency and anticipated monetary totals as stated on the order",
      "Payment terms and means, and references to governing contract terms and clauses",
      "Delivery destination, requested delivery schedule, delivery terms and risk-transfer point",
      "Order lifecycle states, order response and acceptance semantics, amendment, cancellation and closure",
      "Provenance, transmission evidence, time semantics, retention, access control and syntax interoperability"
    ],
    "out_of_scope": [
      "Invoice content, tax determination and payment execution (settlement instruments reference the order but are modelled separately)",
      "Quotation and RFQ content and seller price-offer logic (WM-ECO-021)",
      "Product catalogue and item master data content beyond the identifiers cited on the order",
      "Physical fulfilment execution, despatch, transport and receipt/inspection events (WM-ECO-024)",
      "Contract clause corpus, framework agreement negotiation and master terms body (WM-ECO-006)",
      "Supplier onboarding, qualification and party master data management",
      "Requisition, budget encumbrance and internal spend approval policy beyond the authority actually asserted on the order"
    ],
    "boundary_notes": [
      {
        "neighbor": "Quotation / RFQ (WM-ECO-021)",
        "distinction": "A quotation is seller-originated and, under FAR 13, is not an offer that the buyer can accept to form a contract; the purchase order is the buyer-originated instrument. UBL keeps Quotation and Order as separate documents linked by QuotationDocumentReference, so quotation content stays in the sibling model and only the reference is held here.",
        "source_refs": [
          "SRC-001",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Fulfilment obligation (WM-ECO-024)",
        "distinction": "The order states requested delivery; the obligations it creates and the performance events that discharge them (despatch, receipt, acceptance of goods) belong to the contained model. UBL and Peppol model despatch advice and receipt as separate documents.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Contract / framework agreement (WM-ECO-006)",
        "distinction": "The order references a contract rather than restating it; UBL Order carries a Contract reference, and FAR treats a blanket purchase agreement and the calls placed against it as different objects. Clause bodies and negotiated terms live in the parent model.",
        "source_refs": [
          "SRC-001",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Invoice and settlement",
        "distinction": "The invoice references the order (EN 16931 BT-13 purchase order reference, BT-14 sales order reference); invoice content, tax breakdown and payment status are not order content, and the order carries only anticipated, not settled, monetary totals.",
        "source_refs": [
          "SRC-001",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Transport and delivery-terms rules",
        "distinction": "Incoterms 2020 allocate delivery, cost and risk between seller and buyer but are a referenced trade-term code plus named place; the ICC rules themselves are external and are not restated in this model, and they do not determine price, title transfer or payment.",
        "source_refs": [
          "SRC-009"
        ]
      },
      {
        "neighbor": "Order response document",
        "distinction": "An order response is a distinct document with its own identity and its own customization identifier in Peppol; this model holds the resulting acceptance state and the response reference on the order, not the response document's internal model.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Party master data and identifier registries",
        "distinction": "GS1 allocates and governs GLNs and ISO 6523 ICD schemes qualify party identifiers; the order cites identifiers under a declared scheme but does not own their allocation, reuse policy or registry lifecycle.",
        "source_refs": [
          "SRC-008",
          "SRC-002"
        ]
      }
    ]
  },
