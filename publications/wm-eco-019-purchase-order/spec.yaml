        "name": "Order identity and classification",
        "description": "What this order is, how it is uniquely referenced, how its revisions are distinguished, and what kind of purchasing instrument it is.",
        "rationale": "Every downstream document, response and match depends on resolving a reference to exactly one order and one revision; Peppol requires the order identifier on every response and FAR requires each modification to identify the order it changes.",
