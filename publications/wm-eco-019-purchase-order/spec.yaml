      "name": "Close order",
      "description": "Close an order once every line satisfies its closure criteria and no residual obligation remains.",
      "inputs": [
        "order reference",
        "per-line outstanding quantities and values",
        "closure thresholds"
      ],
      "outputs": [
        "closed order state",
        "closure instant",
        "residual write-off record where thresholds allow"
      ],
      "preconditions": [
