      "outputs": [
        "updated order and line states",
        "derived acceptance position",
        "discrepancy list where lines were changed"
      ],
      "preconditions": [
        "the response refers to exactly one order",
        "every referenced line identifier exists on that order"
      ],
      "effects": [
        "may transition the order to accepted, conditionally accepted or rejected",
