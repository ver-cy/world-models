      "outputs": [
        "validation result set with rule identifiers and severities",
        "fatal or passable verdict"
      ],
      "preconditions": [
        "profile binding is declared",
        "rule set version is pinned"
      ],
      "effects": [
        "produces a retained validation report",
        "blocks issuance while fatal failures remain unwaived"
      ],
      "source_refs": [
