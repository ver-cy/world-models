      "inputs": [
        "Well-formed identifier or a parsed subtag structure",
        "Pinned registry snapshot reference including its File-Date",
        "Policy for handling deprecated, grandfathered and collection-scope records"
      ],
      "outputs": [
        "Validity verdict per subtag",
        "Deprecation status and prescribed replacement value per affected subtag",
        "References to the individual registry records consulted",
        "Prefix and script-suppression advisories, and scope classification of the primary language subtag"
      ],
      "preconditions": [
        "The identifier has already passed well-formedness parsing",
        "A registry snapshot is pinned, retrievable and integrity-checked"
      ],
      "effects": [
        "Emits a validation result bound to a named registry snapshot and File-Date",
        "Flags grandfathered, redundant, collection-scope and macrolanguage records for human review",
        "Does not rewrite the stored identifier; applying a replacement is a separate, policy-governed patch"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-003",
        "SRC-012"
      ]
    },
    {
      "id": "loc-locale-fn-match-language-ranges",
      "name": "Filter or look up tags against language ranges",
      "description": "Applies basic filtering, extended filtering or lookup to compare a language priority list against a set of candidate tags, returning either the matching set in priority order or the single closest match with its truncation steps.",
      "inputs": [
        "Language priority list of ranges with optional weights",
        "Candidate tag set",
        "Matching scheme selector",
        "Defaulting behaviour to use when no candidate matches"
      ],
      "outputs": [
        "Matching tag set in priority order for filtering schemes",
        "Single closest tag or the declared default for lookup",
        "Match reason per candidate, including the truncation steps taken",
        "List of ranges that matched nothing"
      ],
      "preconditions": [
        "Ranges and candidate tags are expressed in the same canonical form",
        "The defaulting behaviour for a no-match result is defined before the call is made"
      ],
      "effects": [
        "Returns a match result without asserting the semantic validity of any tag or range",
        "Records the scheme, implementation and truncation steps used so the result can be reproduced",
        "Selects no resources, serves no content and writes to no host record"
