  "functions": [
    {
      "id": "loc-locale-fn-parse-canonicalize",
      "name": "Parse and canonicalize a language or locale identifier",
      "description": "Parses a supplied identifier into its subtags by role, applies the stated case and ordering normalization, and returns the canonical form together with the parse result and the list of normalizations applied.",
      "inputs": [
        "Identifier string exactly as received",
        "Canonicalization profile selector: language-tag canonical form or Unicode locale identifier canonical form",
        "Pinned registry and locale data versions to use"
      ],
      "outputs": [
        "Canonical identifier string",
        "Parsed subtag structure by role, including extension attributes and keywords",
        "Well-formedness verdict with the failing position where parsing fails",
        "List of normalizations applied, including dropped duplicate attributes and keys"
      ],
      "preconditions": [
        "The input is a single identifier, not a language range or a priority list",
        "The canonicalization profile and its data version are stated explicitly by the caller"
      ],
      "effects": [
        "Produces a canonical identifier and a parse result for storage or comparison",
        "Records which normalization profile and data version were applied so the result is reproducible",
        "Performs no content transformation, no rendering and no resource selection"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-004",
        "SRC-009"
      ]
    },
    {
      "id": "loc-locale-fn-validate-registry-reference",
      "name": "Validate subtags against the pinned subtag registry",
