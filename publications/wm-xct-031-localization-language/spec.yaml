        "description": "Everything needed to state, normalize and validate which language, script and locale a host record is bound to, and to keep that binding stable as external registries change.",
        "rationale": "BCP 47 separates a tag's syntax from its validity against a registry, and UTS #35 separates a language identifier from a locale identifier. An agent cannot safely compare, store or display a linguistic declaration without all three of these settled first: the canonical tag, its registry backing, and the script and direction it implies.",
