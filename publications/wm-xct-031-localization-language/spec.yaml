                "inline_only_rationale": "This model is a mixin: the binding lives as a field set on a host object owned by another model and has only host-dependent weak identity, keyed by host object reference plus target field or resource path plus monotonic binding version. Its state, effective interval and supersession references remain inline on that host record. Materializing them as a standalone artifact would create a competing independent identity and could be mistaken for the lifecycle of a language, content item or translation project. A durable narrative of change remains in the host model's revision history and referenced records model."
