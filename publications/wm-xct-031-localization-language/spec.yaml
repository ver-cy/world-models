        "description": "The governed lifecycle of the binding on its host object, and the declarative rules that control who may see localized values, how long binding records are kept, and what survives their withdrawal.",
        "rationale": "A localization binding changes far more often than the host it annotates and far more often than the registries it cites, so it needs its own version, effective interval and supersession semantics without acquiring an independent identity as a language, content item or project. Localized variants are also routinely embargoed or locale-restricted before release, and binding records fall under the adopting organization's retention schedule, so disclosure and disposition must be declared explicitly and their execution attributed to the owning systems.",
