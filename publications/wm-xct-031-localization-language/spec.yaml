      {
        "id": "loc-trans-form-fallback",
        "name": "Message Form Contract and Fallback Resolution",
        "description": "The formal contract a target variant must satisfy to be substitutable for its source, and the declared, ordered behaviour when no acceptable variant exists.",
        "rationale": "A translation is only interchangeable with its source if it preserves the selection structure and the placeholder set. MessageFormat 2 makes selectors, variant keys, a required catch-all, placeholders, function option types and error fallbacks normative; CLDR fixes the language-specific plural category sets; XLIFF constrains inline codes and their reordering. Separately, RFC 4647 Lookup and LDML parent-locale inheritance both return a value from some other locale when the requested one is absent, which is resolution, not translation. Keeping form and fallback in one bundle prevents that conflation.",
