        "id": "loc-trans-terminology-quality",
        "name": "Terminology Binding, Quality Assertions and Verification Evidence",
        "description": "What a term occurrence is required to mean, how good a variant is asserted to be, who vouched for it, and what testing shows about whether it actually renders and is usable.",
        "rationale": "ITS separates Terminology from Localization Quality Issue, Localization Quality Rating, MT Confidence and Provenance, and requires MT Confidence to be attributed to an engine through Provenance; XLIFF likewise separates the Glossary module from validation rules. TBX makes the concept, not the string, the unit of terminological identity. Pseudo-locale practice exists because a fully populated locale can still fail to render. Keeping terminology, asserted quality and observed rendering distinct is therefore evidence-led, not stylistic.",
