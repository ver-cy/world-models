      "inputs": [
        "Party identifier references",
        "Role type and scope",
        "Role validity window"
      ],
      "outputs": [
        "Party role binding set",
        "Unresolved party reference exception"
      ],
      "preconditions": [
        "Party identifiers resolve in the referenced party model or registry"
