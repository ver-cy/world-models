    "name": "Financial Account",
    "entry_kind": "entity",
    "purpose": "Give an agent the context needed to identify a financial account, know who holds and services it, what it is denominated in, what state it is in, what rules and protections bind it, and which contained or neighbouring models own everything else.",
    "scope_statement": "A financial account is an identified, durable container maintained by a financial institution or ledger operator for a business arrangement with one or more holders. This model owns account identity, identifier schemes, classification, party role bindings, servicing arrangement, denomination reference, bound terms and limits, protection designation, state and lifecycle, position declaration, provenance, evidence linkage, retention designation and interoperability projections. It owns no posting semantics, no monetary-unit semantics, no party master data, no payment execution and no runtime authorisation, enforcement or audit-trail semantics.",
    "in_scope": [
      "Account identity and the identifier schemes that denote it (IBAN, domestic BBAN, sort code plus account number, masked PAN, proprietary and interface resource identifiers)",
      "Aliases, proxies, nicknames and display labels bound to the account",
      "Product, regulatory and tax classification, each carried with its scheme and scheme version",
      "Holder set, ownership structure (single, joint, trust, entity) and declared ownership shares",
      "Beneficial owner and controlling-person role bindings expressed as references to party identifiers",
      "Account servicer or provider and the servicing relationship",
      "Operating authority: mandates, authorised signatories, powers of attorney and delegated operating rights",
      "Denomination reference and permitted monetary instrument set, carried only as a reference",
      "Terms bound to the account: fees, interest, limits, facilities, notice periods and withdrawal restrictions",
      "Protection and guarantee designation (deposit guarantee scheme or deposit insurance ownership category)",
      "Account status, state transitions, restrictions, opening, closure, switching and dormancy determination",
      "Declared balances and statement designation as observations with an explicit as-of instant",
      "Provenance, supporting-evidence linkage, validation controls, retention designation, access designation and standards crosswalks"
    ],
    "out_of_scope": [
      "Definition of currency, monetary units, minor units or instrument semantics (owned by WM-ECO-004)",
      "Creation, amendment, reversal, matching or interpretation of postings and derivation of balances from them (owned by WM-ECO-016)",
      "Party and legal-entity master data, entity verification and ownership hierarchies (referenced by identifier only)",
      "Payment instruction, clearing, settlement and funds-availability execution",
      "Issuance, evaluation, revocation or enforcement of data-access consents and the audit-trail record model",
      "Product catalogue definition and price-list governance independent of a specific account",
      "Deposit guarantee payout calculation and scheme operation",
      "Custody of escheated balances and reclaim-fund repayment obligations",
      "AML transaction monitoring, alerting, sanctions screening execution and case management",
      "Credit decisioning, risk scoring and capital treatment",
      "Card or payment instrument issuance and lifecycle",
      "Chart-of-accounts taxonomy governance and accounting policy",
      "Statement rendering channels, delivery infrastructure and notification transport"
    ],
