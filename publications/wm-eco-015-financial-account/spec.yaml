  "functions": [
    {
      "id": "register-account-record",
      "name": "Register account record",
      "description": "Create the model's context record for an account by binding its authoritative master-system identifier, servicer reference and opening timestamp.",
      "inputs": [
        "Master-system account identifier",
        "Servicer reference",
        "Opening event timestamp and observation timestamp"
      ],
      "outputs": [
        "Account context record with resolved identity",
        "Identity precedence decision"
      ],
      "preconditions": [
        "The master-system identifier is unique within the servicer namespace",
        "The servicer is identified by a governed identifier scheme"
      ],
      "effects": [
        "Creates a context record in this model only",
        "Does not open, authorise or activate the account in any servicing system"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002"
      ]
    },
    {
      "id": "resolve-identifier-set",
      "name": "Resolve and normalise the identifier set",
      "description": "Normalise, structurally validate and rank the scheme-qualified identifiers that denote the account, including check-digit verification where the scheme defines one.",
      "inputs": [
        "Scheme-qualified identifier candidates",
        "Scheme structure and check-digit rules"
      ],
      "outputs": [
        "Normalised identifier set with precedence",
        "Validation outcome per identifier"
      ],
      "preconditions": [
        "Each candidate declares its scheme and scheme owner"
      ],
      "effects": [
        "Records validation outcomes without altering the source identifier",
        "Flags identifiers that fail structural validation rather than discarding them"
      ],
      "source_refs": [
        "SRC-008",
        "SRC-013",
        "SRC-002"
      ]
    },
    {
      "id": "classify-account",
      "name": "Assign account classifications",
      "description": "Attach product, regulatory and tax classifications to the account, each carrying its code set, version, jurisdiction and effective period.",
      "inputs": [
        "Product code set values",
        "Regulatory category assertions",
        "Tax regime category assertion"
      ],
      "outputs": [
        "Classification set with effective periods",
        "Unclassifiable exception record"
      ],
      "preconditions": [
        "Each code set version is resolvable",
        "Jurisdiction is known for regulatory and tax categories"
      ],
      "effects": [
        "Adds time-bounded classification entries",
        "Does not reinterpret or redefine any external code set"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-003",
        "SRC-010",
        "SRC-011"
      ]
    },
    {
      "id": "bind-account-parties",
