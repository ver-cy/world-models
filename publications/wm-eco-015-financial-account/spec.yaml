    "canon_and_patch": {
      "canonicalization_rules": [
        "Canonical form is the format-neutral element graph defined by this model; JSON, YAML, Markdown, HTML, Git, MCP and MongoDB projections are renderings and never the source of truth.",
        "Identifier values are canonicalised by removing presentation separators and applying the scheme's own normalisation, while the original presentation form is retained as a separate display value.",
        "All time values are canonicalised to RFC 3339 with seconds and an explicit offset; local-time strings without an offset are rejected rather than assumed to be UTC.",
        "Amounts are canonicalised as a decimal value plus a denomination reference; a currency symbol or code embedded in a text field is never treated as the denomination.",
        "Coded values are canonicalised as a triple of code set name, code set version and code value, so that an unqualified bare code is treated as incomplete."
      ],
      "patch_rules": [
        "Patches are element-scoped and must carry the asserting source, the assertion timestamp and the ingestion timestamp; a patch that cannot state its source is rejected.",
        "Status, classification, party binding and terms changes are appended as new time-bounded entries; existing entries are closed with an effective-to timestamp rather than overwritten.",
        "A patch may not create, amend or delete a contained posting, alter a monetary unit definition, or change an authorisation record; such a patch is rejected and routed to the owning model.",
        "Identifier corrections are modelled as supersession with both values retained and the superseded value marked, because downstream references may still resolve against it.",
        "Conflicting concurrent patches are resolved by declared source precedence, and the losing assertion is retained as a conflict entry rather than discarded."
      ],
      "compatibility_rules": [
        "Adding an optional element, a new code set alignment or a new artifact type is a minor change; removing an element, tightening cardinality or changing an identity rule is a breaking change.",
        "A projection to an external representation may be revised independently of the model, provided the crosswalk records the target version it was built against.",
        "Deprecated elements remain resolvable for at least one full major version and are marked with their replacement.",
        "Conformance to an external standard is never asserted by version bump alone; a claim requires evidence recorded in the conflict register and the crosswalk."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "The authoritative master-system identifier assigned by the system of record, which for a financial account is the servicing institution's account identifier and for an artifact is the identifier assigned by the system that produced it.",
        "A governed global identifier or IRI issued by a recognised authority, such as an IBAN under ISO 13616 for the account or an LEI under ISO 17442 for a legal entity, used when no master-system identifier is available or when cross-institution resolution is required.",
        "A UUID or ULID assigned by the adopting Dimension, used only when neither of the above exists, and always recorded as Dimension-assigned rather than presented as authoritative.",
        "A date, a period, a status, a balance or a party name is never an identifier; where a natural key seems to exist it is recorded as an attribute and a surrogate identifier is minted instead."
      ],
      "timestamp_rule": "All time values use RFC 3339 date-time with explicit seconds and an explicit numeric UTC offset or the literal Z; local times without an offset are rejected. Event time and observation or ingestion time are recorded as separate fields whenever they can differ, which for this model includes status transitions, balance observations, opening and closure, dormancy determination and every ingested source assertion. Dates that are genuinely date-only, such as a disposition due date, are recorded as full-date values and are never coerced into an instant with an assumed offset.",
      "serial_naming_rule": "Serial artifacts, namely the statement of fees, the account statement and the validation run report, are named by their subject identifier plus the reporting period start and end plus a monotonic sequence number within that subject. The issue timestamp is carried as an attribute and never used as the identifier, and a regenerated instance for the same period increments the sequence and links to the instance it supersedes.",
      "integrity_rule": "Every artifact instance carries a content digest computed over its canonical serialisation, the algorithm name, the digest computation timestamp and the reference to the source system that produced the content. A stored artifact whose recomputed digest differs from the recorded digest is marked as integrity-failed and quarantined rather than silently replaced, and the failure is recorded as a quality finding against the account record."
