      "namespace_guidance": "Use one namespace per adopting Dimension and per servicing institution, so that a servicer-proprietary account identifier is only ever unique inside its servicer namespace. Governed global identifiers such as an IBAN or an LEI keep the namespace of their issuing authority and are never re-minted locally. Local model identifiers stay lower-kebab-case, carry no date component and never encode a jurisdiction, product or status that can change.",
      "registry_links": [
