  "structure": {
    "bundles": [
      {
        "id": "identity-and-classification",
        "name": "Account Identity and Classification",
        "description": "How an account is denoted, aliased and typed, across the identifier schemes and classification schemes that different authorities impose on the same account.",
        "rationale": "Account identifiers are scheme-bound and plural (immutable resource id, IBAN, domestic BBAN, PAN) and classification is authority-specific, so identity and typing must be modelled as scheme-qualified sets rather than single fields.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-008",
          "SRC-010",
          "SRC-013"
        ],
        "layers": [
          {
            "id": "identifier-and-naming",
            "name": "Identifier Schemes and Naming",
            "description": "The identifier values that denote the account, their governing schemes, and the human-facing labels and proxies layered over them.",
            "source_refs": [
              "SRC-001",
              "SRC-002",
              "SRC-008",
              "SRC-013"
            ],
            "findings": [
              {
                "id": "account-identifier-schemes",
                "name": "Account identifier schemes and precedence",
                "description": "An account carries one authoritative servicer-assigned identifier plus zero or more scheme-governed public identifiers; each value must record its scheme, scheme owner and validity window.",
                "source_refs": [
                  "SRC-001",
                  "SRC-002",
                  "SRC-008",
                  "SRC-013"
                ],
                "questions": [
                  {
                    "id": "q-ident-master",
                    "text": "Which identifier is the authoritative master-system identifier assigned by the account servicer, and in which namespace is it unique?",
                    "kind": "identity",
                    "answer_data": [
                      "Master-system identifier value",
                      "Servicer namespace or system reference",
                      "Uniqueness assertion scope"
                    ]
                  },
                  {
                    "id": "q-ident-schemes",
                    "text": "Which additional identifier schemes denote this account, and who governs each scheme?",
                    "kind": "interoperability",
                    "answer_data": [
                      "Scheme name (IBAN, BBAN, SortCodeAccountNumber, PAN, proprietary)",
                      "Scheme owner or registration authority",
                      "Identifier value and structure metadata"
                    ]
                  },
                  {
                    "id": "q-ident-stability",
                    "text": "Is each identifier immutable for the life of the account, or may it be reissued or reassigned?",
                    "kind": "constraint",
                    "answer_data": [
                      "Immutability flag per identifier",
                      "Reassignment policy reference",
                      "Superseded identifier history with validity window"
                    ]
                  },
                  {
                    "id": "q-ident-time",
                    "text": "From which instant is each identifier valid, and when did it cease to denote this account?",
                    "kind": "temporal",
                    "answer_data": [
                      "Identifier valid-from timestamp",
                      "Identifier valid-to timestamp",
                      "Observation timestamp of the identifier record"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-master-account-id",
                    "name": "Master account identifier",
                    "description": "Servicer-assigned identifier that authoritatively denotes the account within the servicing system.",
                    "value_kind": "identifier",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-002",
                      "SRC-001"
                    ]
                  },
                  {
                    "id": "de-identifier-entry",
                    "name": "Scheme-qualified identifier entry",
                    "description": "Structured pair of scheme name and identifier value with validity window, for example an IBAN under ISO 13616.",
                    "value_kind": "object",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-002",
                      "SRC-008",
                      "SRC-013"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "Identifiers are structured data values validated against external registries and schemes; there is no document instance to hold, and binding them to an artifact would wrongly imply the model issues or certifies them."
              },
              {
                "id": "alias-proxy-and-display-names",
                "name": "Aliases, proxies and display labels",
                "description": "Non-authoritative labels attached to the account: customer nickname, servicer description, masked identifiers and proxy or alias values resolved to the account by an external directory.",
                "source_refs": [
                  "SRC-001",
                  "SRC-002",
                  "SRC-012"
                ],
                "questions": [
                  {
                    "id": "q-alias-purpose",
                    "text": "What is each alias or display label for, and is it customer-supplied or servicer-supplied?",
                    "kind": "definition",
                    "answer_data": [
                      "Label value",
                      "Label origin (customer, servicer, scheme)",
                      "Intended use context"
                    ]
                  },
                  {
                    "id": "q-alias-resolve",
                    "text": "Which external directory resolves a proxy or alias to this account, and what is the reference to that directory entry?",
                    "kind": "relationship",
                    "answer_data": [
                      "Proxy type code",
                      "Directory or scheme reference",
                      "Resolution record reference"
                    ]
                  },
                  {
                    "id": "q-alias-mask",
                    "text": "Which identifier values must be masked or truncated when displayed or shared?",
                    "kind": "privacy",
                    "answer_data": [
                      "Masking rule per identifier scheme",
                      "Permitted display form",
                      "Applicable disclosure context"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-account-nickname",
                    "name": "Account nickname",
                    "description": "Customer-assigned label with no authoritative meaning to the servicing system.",
