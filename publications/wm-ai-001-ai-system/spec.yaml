    "name": "AI System",
    "entry_kind": "aggregate",
    "purpose": "Describe a governed AI-enabled system as a unit of accountability that is larger than any single model artifact: its identity, declared purpose, composition, classification, lifecycle, operation, oversight, assurance evidence and retirement.",
    "scope_statement": "WM-AI-001 covers the machine-based system that infers from input how to generate outputs influencing physical or virtual environments, taken together with the provider/deployer arrangements, configuration baseline, human oversight, logging, evaluation evidence and regulatory status that make it operable and auditable. It is format-neutral: JSON, YAML, Markdown, HTML, Git, MCP and MongoDB are projections of the same semantics. It stops at the boundary of the model artifact, the agent actor, the dataset and the incident report, which are separately modelled and linked by typed edges.",
    "in_scope": [
      "Authoritative system identity, trade name, identification reference and public registration identifiers",
      "Declared intended purpose, conditions of use, excluded uses and reasonably foreseeable misuse",
      "Autonomy and adaptiveness profile, output types and the environments outputs can influence",
      "Regulatory and internal risk classification, including derogation claims and profiling flags",
      "Versioned configuration baseline and the component set frozen in it (AI bill of materials)",
      "Binding to model artifacts, upstream providers and external model services",
      "Input data dependencies, input specifications and deployer-controlled input governance",
      "Operator roles: provider, deployer, importer, distributor, authorised representative and internal AI actor functions",
      "Lifecycle stage, market status, change control and substantial-modification determination",
      "Deployment topology, processing locations, integration interfaces and market jurisdictions",
      "Automatic event logging, runtime operational state and containment triggers",
      "Human oversight measures, assignment, competence and intervention mechanisms",
      "Performance metrics, declared accuracy, validation and testing evidence",
      "Cybersecurity controls and adversarial threat posture",
      "Conformity assessment, declarations, standards applied and public registration records",
      "Transparency disclosure to affected persons and machine-readable marking of synthetic output",
      "Risk management system and impact assessment on persons and fundamental rights",
      "Post-market monitoring, serious incident detection and reporting linkage",
      "Retention, decommissioning, withdrawal and deletion"
    ],
    "out_of_scope": [
      "Internal structure, weights, architecture, training run and evaluation of the model artifact itself (WM-SFT-004)",
      "Agent actor goals, tool repertoire, planning loops and autonomous task execution semantics (WM-AI-002)",
      "The AI incident report record and its regulatory narrative content (WM-AI-010)",
      "Dataset content, dataset licensing and dataset lineage as first-class records",
      "Legal entity, organisational structure and personnel records of the provider or deployer",
      "Generic software product packaging, release engineering and non-AI functionality inherited from WM-SFT-002",
      "Data subject, natural person and consent records",
      "Enterprise risk register, audit programme and management-system certification scope of the organisation",
      "Hardware/device product records where the AI system is only an embedded safety component",
      "Contract, procurement and commercial terms records"
    ],
    "boundary_notes": [
      {
        "neighbor": "AI model artifact (WM-SFT-004)",
        "distinction": "The model artifact is a versioned trained object with parameters and a training provenance chain. WM-AI-001 records only the binding: which artifact version is invoked, in which role, under which access mode. Regulators separate the two regimes explicitly, treating general-purpose models and AI systems as distinct objects of obligation.",
        "source_refs": [
          "SRC-001",
          "SRC-018"
        ]
      },
      {
        "neighbor": "AI agent (WM-AI-002)",
        "distinction": "An AI system may expose zero, one or many agent actors. Agent-specific semantics (goal decomposition, tool invocation, memory, delegation) belong to WM-AI-002; WM-AI-001 records only that agent actors exist, their autonomy envelope and the containment controls around them.",
        "source_refs": [
          "SRC-013",
          "SRC-014"
        ]
      },
      {
        "neighbor": "AI incident report (WM-AI-010)",
        "distinction": "WM-AI-001 owns detection, classification and the reporting obligation state for the system; the incident report record itself, with its narrative, causal analysis and authority correspondence, is a separate record that names the affected AI system.",
        "source_refs": [
          "SRC-006"
        ]
      },
      {
        "neighbor": "Software product or service (WM-SFT-002)",
        "distinction": "WM-AI-001 specialises the software parent with the elements that only apply when a system infers outputs rather than executing fully specified rules: inference-derived behaviour, adaptiveness after deployment and autonomy. Deterministic rule engines without an inference step are out of scope even when embedded in the same product.",
        "source_refs": [
          "SRC-013",
          "SRC-014"
        ]
      },
      {
        "neighbor": "Dataset / training corpus record",
        "distinction": "WM-AI-001 records the input data specification and the identifiers of datasets relied upon, not the dataset contents, collection method or labelling procedure, which are documented in the model artifact and dataset models.",
        "source_refs": [
          "SRC-002"
        ]
      },
      {
        "neighbor": "Conformity certificate and notified-body record",
        "distinction": "Certificates are issued to a version of a system by an external body and have their own identity and expiry. WM-AI-001 holds the reference and status, not the certificate lifecycle of the issuing body.",
        "source_refs": [
          "SRC-003",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Medical device or other sectoral product record",
        "distinction": "Where the AI system is a device software function, sectoral lifecycle regimes add pre-authorised change control constructs that are not present in the horizontal regime; WM-AI-001 carries a change-plan reference rather than duplicating sectoral device documentation.",
        "source_refs": [
          "SRC-020"
        ]
      }
    ]
  },
