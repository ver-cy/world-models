    "conflicts": [
      "Definitional scope: the OECD definition and the EU regulation align on machine-based inference producing predictions, content, recommendations or decisions, but the FDA glossary definition retrieved via secondary reporting frames AI around human-defined objectives and omits the adaptiveness clause. An instance classified as an AI system under one definition may not be under another; the behavioural profile finding records the deciding definition explicitly.",
      "Model versus system boundary: the regulation treats general-purpose AI models and AI systems as separate objects with separate obligations, but common industry practice documents them together in a single model or system card. This model keeps them separate and links by reference; adopters who merge them will double-count obligations.",
      "Voluntary versus binding: the NIST AI RMF is explicitly voluntary while the EU regime is binding. Trustworthiness characteristics are used here as an evaluation vocabulary only; using them as evidence of legal conformity would be unsupported.",
      "Log retention: the deployer-side minimum retrieved is at least six months unless other law applies, while sectoral and data-protection law may require shorter minimisation or longer retention. The retention finding therefore stores a period plus its basis rather than a single global default.",
      "Registration transparency: registration data are broadly public, but instructions for use are withheld for certain law enforcement and border-control use cases. A single 'public entry' assumption would be wrong; visibility is modelled per field.",
      "Change control: the horizontal regime treats unforeseen changes as substantial modifications triggering renewed conformity assessment, whereas the sectoral device regime permits pre-authorised modification envelopes. Both are represented; an adopter must state which governs, and the two can produce opposite answers for the same change.",
      "ISO/IEC 22989:2022 defines an engineered system generating outputs for human-defined objectives, without the OECD/EU/CoE verb infers and without stressing post-deployment adaptiveness in the definition sentence.",
      "NIST AI RMF 1.0 still uses an older OECD-like definition that omits content as an output type and the infers wording of the 2023 OECD revision.",
      "Secondary summaries of ISO/IEC 22989 sometimes list seven lifecycle stages and omit continuous validation; the ANSI preview table of contents lists eight stages including continuous validation and re-evaluation.",
      "The EU AI Act uses a product-safety risk-tier scheme; NIST AI RMF uses contextual, non-tiered risk and must not be treated as equivalent classification.",
