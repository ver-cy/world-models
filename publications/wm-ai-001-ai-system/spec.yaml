    "known_omissions": [
      "Sources SRC-014 (OECD explanatory memorandum), SRC-019 (ISO/IEC 42001:2023) and SRC-020 (FDA PCCP final guidance) could not be retrieved in full text during this research: SRC-014 and SRC-019 returned HTTP 403 and SRC-020 returned HTTP 404 on direct fetch. Their titles, identifiers and dates were confirmed via publisher catalogue and site-restricted search metadata. No structural node depends on these three alone.",
