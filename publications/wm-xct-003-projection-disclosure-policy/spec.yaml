  "composition": [
    {
      "target": "WM-KNW-012 Governed Policy",
      "relation": "EXTEND",
      "purpose": "Specialize the generic governed policy with output-shape semantics only. Policy identity, authoring authority, approval, version states, supersession and conflict resolution remain in the target; this model adds selection, treatment, record scope, grain, shape algebra, templates and shape-specific change classification.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-011"
      ]
    },
    {
      "target": "WM-XCT-001 Ownership and Delegation",
      "relation": "REFERENCE",
      "purpose": "Carry a reference to the owner or delegated steward whose authority a shape presupposes, and to the party who accepted a named residual-disclosure risk. Ownership records, delegation instruments and their lifecycle stay in the target.",
      "required": true,
      "source_refs": [
        "SRC-012",
        "SRC-003"
      ]
    },
    {
      "target": "WM-XCT-002 Access Contract and Consent",
      "relation": "REFERENCE",
      "purpose": "Bind a shape to an access contract or consent grant by reference and record the audience class the binding serves. Authorization, purpose, parties and consent lifecycle stay in the target.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-005"
      ]
    },
    {
      "target": "WM-XCT-004 Access Audit",
      "relation": "REFERENCE",
      "purpose": "Supply the provenance tuple - policy version identifier, template fingerprint, binding identifier, source schema version - that the target records with each served disclosure. Audit events, append-only trail semantics, ordering, immutability and retention stay in the target.",
      "required": true,
      "source_refs": [
        "SRC-013",
        "SRC-003"
      ]
    },
    {
