    "name": "Projection / Disclosure Policy",
    "entry_kind": "mixin",
    "purpose": "Define, in a storage- and interface-neutral way, the shape data is permitted to leave in - which elements, after which transformations, over which records, at which grain - so one reusable shape specification can be bound to many contracts and audiences and can be reproduced and explained afterwards.",
    "scope_statement": "A mix-in that specializes a generic governed policy (WM-KNW-012) with output-shape semantics only. It owns the declarative output shape (element selection, per-element treatment, record scope, aggregation grain), the order relation and least-disclosure combination over shapes, the compiled output template and its fingerprint, the binding of a shape to a target and audience as references, the declared identifiability and assurance properties of the shape, shape-specific change classification, and alignment with external policy-expression standards. It does not own policy identity, authority, approval, versioning state or conflict resolution; nor ownership, authorization, consent, classification, source-schema semantics, threshold or budget computation, audit records, or any runtime evaluation, decision, enforcement or execution over instance data. It holds no instance data.",
    "in_scope": [
      "Declarative output-shape definition: selection sets with a default treatment, per-element transformation technique and parameters, record-set scope, aggregation grain",
      "Shape algebra: the subsumption test deciding whether one shape is no wider than another, and the meet operation combining two applicable shapes into a least-disclosure shape",
      "Compiled output templates and their content fingerprints as reproducible derivations from a pinned policy version and pinned source schema version",
      "Binding of a shape to a target, audience and effective window, expressed purely as references",
      "Declared identifiability roles, assurance-method claims and cross-release linkability properties of a shape",
      "Shape-specific change classification (narrowing, widening, orthogonal) and invalidation signals",
      "Alignment of the shape vocabulary with external policy-expression and selective-disclosure standards",
      "The projection under which the policy record itself is published"
    ],
    "out_of_scope": [
      "Generic policy identity, authority, approval, versioning state and conflict resolution (WM-KNW-012)",
      "Ownership, stewardship and delegation over the underlying data (WM-XCT-001)",
      "Authorization, purpose, parties and consent lifecycle (WM-XCT-002)",
      "Audit records, append-only access trails and their ordering, immutability and retention (WM-XCT-004)",
      "Cohort-floor and threshold computation, privacy budget accounting and aggregation assurance (WM-XCT-005)",
      "Sensitivity classification schemes, criteria and class assignment (WM-XCT-020)",
      "Source schema semantics, validation contracts and data quality (WM-DAT-004)",
      "Runtime evaluation, decision outcome, explanation, obligation discharge and enforcement for a concrete request (WM-XCT-038)",
      "Execution of transformations on instance data, key custody, and storage or transport of disclosed outputs",
      "Legal determination of lawfulness: regimes are cited as constraints, never interpreted here"
    ],
