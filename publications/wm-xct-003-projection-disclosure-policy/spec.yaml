  "structure": {
    "bundles": [
      {
        "id": "shape-semantics",
        "name": "Shape Semantics",
        "description": "What an output shape actually is: which elements leave, how each is transformed, which records are in scope, at what grain, and how two shapes compare and combine.",
        "rationale": "This is the only concern the registry entry assigns exclusively to this model - the shape data leaves in. Every other bundle either derives from it or references a model that owns its subject.",
        "source_refs": [
          "SRC-005",
          "SRC-008",
          "SRC-012",
          "SRC-003"
        ],
        "layers": [
          {
            "id": "element-selection",
            "name": "Element Selection",
            "description": "Which elements of a source structure may leave, expressed as sets over a declared default, and how those elements are addressed.",
            "source_refs": [
              "SRC-006",
              "SRC-012",
              "SRC-005"
            ],
            "findings": [
              {
                "id": "selection-scope-and-defaults",
                "name": "Selection Sets and Default Treatment",
                "description": "Include and exclude sets over source elements, the default treatment applied to everything the sets do not name, and whether the shape is closed against elements it has never seen.",
                "source_refs": [
                  "SRC-012",
                  "SRC-005",
                  "SRC-001"
                ],
                "questions": [
                  {
                    "id": "q-sel-default",
                    "text": "What treatment applies to a source element that neither the include nor the exclude set names?",
                    "kind": "constraint",
                    "answer_data": [
                      "default treatment code (omit, deny, mask, pass-through)",
                      "justification for a default other than omit"
                    ]
                  },
                  {
                    "id": "q-sel-overlap",
                    "text": "When an include path and an exclude path both match one element, which prevails and on what rule?",
                    "kind": "decision",
                    "answer_data": [
                      "resolution rule code (exclude-wins, most-specific-wins)",
                      "worked example path pair"
                    ]
                  },
                  {
                    "id": "q-sel-mandatory",
                    "text": "Which elements must survive selection for the output to remain usable, and what happens when the policy would remove them?",
                    "kind": "requirement",
                    "answer_data": [
                      "mandatory element path list",
                      "failure mode code (refuse, serve degraded, empty result)"
                    ]
                  },
                  {
                    "id": "q-sel-unseen",
                    "text": "How is an element treated that was added to the source after this shape was authored?",
                    "kind": "exception",
                    "answer_data": [
                      "closure mode code (closed, open)",
                      "unmatched-element outcome code",
                      "notification target reference"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-sel-include-set",
                    "name": "Include path set",
                    "description": "Ordered set of path expressions naming elements permitted to leave.",
                    "value_kind": "collection",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-006"
                    ]
                  },
                  {
