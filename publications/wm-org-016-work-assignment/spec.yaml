  "composition": [
    {
      "target": "WM-ORG-004 Position",
      "relation": "REFERENCE",
      "purpose": "The assignment cites the post it occupies; the post's definition, grading and description remain owned by WM-ORG-004. Direction: WM-ORG-016 points outward to WM-ORG-004, complementing the registered COMPOSE relation in which a position is occupied through a scoped assignment.",
      "required": false,
      "source_refs": [
        "SRC-001"
      ]
    },
    {
      "target": "WM-ORG-005 Employment Relationship",
      "relation": "REFERENCE",
      "purpose": "The assignment cites the engagement that gives it a basis. Marked not required because agency-supplied, contracted and volunteer assignments rest on a commercial or non-employment arrangement instead; what is required is some engagement context, not specifically an employment relationship.",
      "required": false,
      "source_refs": [
        "SRC-014",
        "SRC-010"
      ]
    },
    {
      "target": "Person, party and agent identity model",
      "relation": "REFERENCE",
      "purpose": "Supplies the assignee identity, including non-human agents. This model holds only a reference and never duplicates personal master data.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-007"
      ]
    },
    {
      "target": "Organization and organizational unit model",
      "relation": "REFERENCE",
      "purpose": "Supplies the organization or unit in which the assignment is held and, where different, the host organization where the work is performed.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-014"
      ]
    },
    {
      "target": "Role, occupation and competence classifier model",
      "relation": "REFERENCE",
      "purpose": "Supplies role concepts, occupation codes and the competences that become assignment prerequisites; the classifier owns the concepts, the assignment owns the citation.",
      "required": false,
      "source_refs": [
        "SRC-006",
        "SRC-001"
      ]
    },
    {
      "target": "Schedule, roster and availability model",
      "relation": "COMPOSE",
      "purpose": "Concrete dated duty and shift instances are composed from the assignment's pattern, availability and limits, and reference the assignment identifier.",
      "required": false,
      "source_refs": [
        "SRC-011",
        "SRC-002"
      ]
    },
    {
      "target": "Access entitlement and identity management model",
      "relation": "REFERENCE",
      "purpose": "Consumes the assignment as the temporal and organizational basis for user-to-role assignment, activation and de-provisioning; the permission catalogue and decision engine stay outside this model.",
      "required": false,
      "source_refs": [
        "SRC-004"
      ]
    },
    {
      "target": "Place and work location model",
      "relation": "REFERENCE",
      "purpose": "Supplies base and additional work locations from which jurisdictional, safety and working-time regimes are derived.",
      "required": false,
      "source_refs": [
        "SRC-002",
        "SRC-010"
      ]
    },
    {
      "target": "W3C Organization Ontology (org:Membership, org:Post, org:Role)",
      "relation": "ALIGN",
      "purpose": "Primary structural alignment for the reified n-ary agent-organization-role relation with a validity interval. Known divergence: org:memberDuring leaves its range unconstrained, so this model imposes RFC 3339 instants.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-008"
      ]
    },
    {
      "target": "HL7 FHIR PractitionerRole",
      "relation": "ALIGN",
      "purpose": "Domain alignment showing role code, specialty, organization, location, service scope, period and availability carried on the assignment. Known divergence: FHIR conflates post and membership into one resource and has no separation-of-duty or authority constructs.",
      "required": false,
      "source_refs": [
        "SRC-002"
      ]
    },
    {
      "target": "schema.org Role and OrganizationRole",
      "relation": "ALIGN",
      "purpose": "Publication alignment for lightweight external exposure. Known divergence: no lifecycle status, no authority, and date-only validity, so it is an export target only and never a semantic source.",
      "required": false,
      "source_refs": [
        "SRC-005"
      ]
    },
    {
      "target": "HR Open Standards StaffingAssignment (Contingent Staffing 3.3)",
      "relation": "ALIGN",
      "purpose": "Alignment for the tri-party case in which a resource engaged by one organization is placed with a customer. Known divergence: the consortium's newer JSON API set has no Assignment resource, so no stable modern JSON counterpart exists.",
      "required": false,
      "source_refs": [
        "SRC-014",
        "SRC-013"
      ]
    },
    {
      "target": "W3C PROV-O qualified association and delegation",
      "relation": "MIX-IN",
      "purpose": "Provenance mixin for authorization, acting-on-behalf-of delegation and role-at-time-of-action, applied to approval records and lifecycle events.",
      "required": false,
      "source_refs": [
        "SRC-007"
      ]
    },
    {
      "target": "NIST/INCITS RBAC constraint model",
      "relation": "ALIGN",
      "purpose": "Alignment for static and dynamic separation of duty and cardinality constraints. Known divergence: standard RBAC user assignment carries no temporal bounds, so the temporal semantics are supplied by this model and must not be assumed on the RBAC side.",
      "required": false,
      "source_refs": [
        "SRC-004"
      ]
    },
    {
      "target": "RFC 3339 timestamp profile",
      "relation": "ALIGN",
      "purpose": "Governs every effective, transition, authorization, notification and observation time in the model, including the reserved meaning of an unknown local offset.",
      "required": true,
      "source_refs": [
        "SRC-008"
      ]
    }
  ],
  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "A Dimension adopting this model must name a single accountable owner for the assignment register and a named deputy, each identified by their own assignment record so that authority is self-describing.",
        "The owner package must declare the identity priority actually applied, the authoritative master system for assignment identifiers, and the boundary convention for inclusive or exclusive period ends before any record is created.",
        "The owner package must publish its governed vocabularies for assignment type, status, reporting line type, authority conveyance and end reason, each versioned, and state how local extensions are reviewed.",
        "The owner package must declare which sibling models supply agent identity, post definition, engagement context and classifiers, and must not shadow their fields.",
        "The owner package must publish the retention schedule, the access scope rules per role and the jurisdictions in scope, since none of these are universal."
      ],
      "namespace_guidance": "Use a stable, resolvable namespace owned by the adopting Dimension, versioned independently of any storage projection, for example a path segment for the model, a version segment and a local identifier. Never encode personal data, organizational structure or dates in the identifier. External identifiers from master systems and standards are held as qualified aliases with their issuing system, never merged into the primary identifier.",
      "registry_links": [
        "vr.wm-org-016 as the registry entry for this model, with nav path NAV.SOC.ORG.ASN and domain tag SOC.ORG.ASN",
        "WM-ORG-004 Position and WM-ORG-005 Employment Relationship as the registered structural neighbours to be resolved during boundary review",
        "Registered alignments to the W3C Organization Ontology, HL7 FHIR PractitionerRole, schema.org Role and HR Open StaffingAssignment, each recorded with target version and known losses"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "All instants are stored in RFC 3339 form with seconds and an explicit offset or Z; an unknown local offset is expressed as the reserved -00:00 and never silently normalized to Z.",
        "Event time and record time are stored as separate fields and are never collapsed; an effective date is never used as an identifier.",
        "References are stored as identifiers with an explicit issuing system, never as display names; display strings are derived at read time.",
        "Codes are stored with their scheme identifier and scheme version so that a reclassification of the scheme does not silently change the meaning of historic records.",
        "Field ordering, whitespace and presentation form carry no meaning; canonical equality is computed over the semantic field set only, so that JSON, YAML, Markdown, Git and document-store projections compare identically."
      ],
      "patch_rules": [
        "Changes to the world are effective-dated amendments that preserve prior values; changes to the record are versioned corrections. The two are never expressed with the same operation.",
        "Every patch declares its change class, effective instant, actor, actor role at the time and reason; patches without these are rejected.",
        "Patches that touch an immutable participant, or that cross a declared new-record trigger, are rejected in favour of ending the assignment and creating a successor with a succession link.",
        "Lifecycle transitions are appended as events, never applied by overwriting the status field alone; the status field is a materialized view of the event stream.",
        "A patch that would breach a blocking validation rule is rejected unless it carries a reference to an approved, unexpired exception."
      ],
      "compatibility_rules": [
        "Adding an optional field or a new vocabulary term is a minor change; removing a field, narrowing cardinality, changing a code's meaning or altering the period boundary convention is a breaking change requiring a new model version and a migration note.",
        "Crosswalks are versioned against both the model version and the target standard version; a target reversioning is treated as a new crosswalk, not an in-place edit.",
        "Consumers must tolerate unknown optional fields and must not infer meaning from field order or from the storage projection in use.",
        "Known losses and recorded conflicts travel with every projection; a consumer that strips caveats is non-conformant."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Identifier issued by the authoritative master system for assignments in the adopting Dimension, recorded with that system's name or URI",
        "Governed global identifier or IRI where one exists for the assignment or its instrument, recorded with its issuing authority",
        "UUID or ULID minted by the adopting Dimension, used only when neither of the above exists and never derived from personal data",
        "Explicitly not an identifier: any date, period, job title, person name, email address or composite of these"
      ],
      "timestamp_rule": "Every timestamp on an artifact or record uses RFC 3339 with seconds and an explicit offset or Z; where the local offset is genuinely unknown, the reserved -00:00 form is used. Event time and observation or ingestion time are recorded separately whenever they can differ.",
      "serial_naming_rule": "Serial artifacts - assignment instruments, statements of particulars and change, approval records, register entries and event log entries - are numbered monotonically within a declared series scope (engagement, register or assignment), never reuse a number after supersession or withdrawal, and carry both the series identifier and the sequence value. Non-serial artifacts are identified by their subject reference plus an RFC 3339 generation instant.",
      "integrity_rule": "Issued and approved artifacts are immutable. Corrections are new artifacts that reference the superseded one and state the reason; the superseded artifact is retained and marked, never deleted or edited, until its retention period expires and disposal is recorded. Append-only logs may not be rewritten, and any artifact leaving the Dimension carries its identifier, version, generation instant and known-loss caveats."
    },
    "policies": [
      "No assignment confers authority before an authorization record with a competent authorizer exists; a proposed or draft assignment is never treated as effective for access, reporting or headcount.",
      "Every conferred authority and delegation lapses automatically when the assignment ends or is suspended; continued exercise requires a fresh grant, and transfers require existing authorizations to be re-confirmed rather than inherited.",
      "Blocking validation outcomes may be overridden only by a registered exception with a named approver, a compensating control and a mandatory expiry; exceptions without expiry are invalid.",
      "Personal and specially protected fields are disclosed on a least-privilege basis; the default external projection of an assignment is post, scope and period without assignee identity or terms.",
      "Records are retained for their declared period against a stated basis and then disposed of by the declared method, with disposal recorded; legal holds suspend disposal and are themselves auditable.",
