                    "value_kind": "code",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-002"
                    ]
                  },
                  {
                    "id": "de-record-version",
                    "name": "record_version",
                    "description": "Version of the record as stored, incremented on correction rather than on real-world change.",
                    "value_kind": "identifier",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-007"
                    ]
