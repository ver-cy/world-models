  "functions": [
    {
      "id": "resolve-effective-configuration",
      "name": "Resolve effective configuration",
      "description": "Combine a base revision with its overlays, variants and scope-specific configurations into a single effective view, emitting the precedence trace that justifies every resolved field.",
      "inputs": [
        "Base revision reference",
        "Overlay and variant references",
        "Working scope path",
        "Tenant, locale and channel selectors"
      ],
      "outputs": [
        "Effective configuration document",
        "Precedence trace listing the winning source of each field",
        "Effective-configuration digest"
      ],
      "preconditions": [
        "Every referenced revision resolves and its integrity has been verified",
        "A deterministic precedence rule is declared for overlapping scopes"
      ],
      "effects": [
        "Produces a read-only derived view; mutates no stored revision",
        "Makes the resolution reproducible by digesting the resolved result"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-006",
        "SRC-011"
      ]
    },
    {
      "id": "render-prompt-from-template",
      "name": "Render prompt from template",
      "description": "Substitute validated argument values into a prompt template to produce the final message sequence, applying escaping so that values cannot be read as instructions.",
      "inputs": [
        "Template block reference",
        "Argument name and value pairs",
        "Rendering engine version"
      ],
      "outputs": [
        "Rendered message sequence with roles",
        "Render trace recording substitutions",
        "Validation errors where arguments fail"
      ],
      "preconditions": [
        "All arguments marked required are present",
        "Each value validates against its declared argument schema"
      ],
      "effects": [
        "Substituted values are delimited and carry no instruction authority",
        "Rendering fails closed when a required argument is missing"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-004",
        "SRC-019"
      ]
    },
    {
      "id": "validate-configuration",
      "name": "Validate configuration revision",
      "description": "Check a candidate revision against its structural schema, declared policy rules and internal consistency, including that no secret appears in instruction text and that every requested scope has a justification.",
      "inputs": [
        "Candidate revision snapshot",
        "Schema dialect reference",
        "Policy ruleset"
      ],
      "outputs": [
        "Validation report",
        "Pass or fail verdict",
        "Ordered violation list with severities"
      ],
      "preconditions": [
        "The schema dialect resolves and reference resolution rules are applied",
        "The policy ruleset version is recorded with the report"
      ],
      "effects": [
        "Blocks promotion of the revision while any blocking violation is open",
        "Records the verdict against the candidate content digest"
      ],
      "source_refs": [
        "SRC-019",
        "SRC-001",
        "SRC-007",
        "SRC-018"
      ]
    },
    {
      "id": "release-configuration-revision",
      "name": "Release configuration revision",
      "description": "Freeze an approved candidate into an immutable revision, mint its canonical digest, assign a version according to the declared change class, and emit the release event.",
      "inputs": [
        "Approved candidate snapshot",
        "Change class (major, minor or patch)",
        "Approval decision record"
      ],
      "outputs": [
        "Immutable revision with content digest",
        "Version string",
        "Release event with an RFC 3339 timestamp"
      ],
      "preconditions": [
        "Validation passed and approval is recorded by a party other than the sole author",
        "The version string is not already in use for a different digest"
      ],
      "effects": [
        "Released content becomes immutable; corrections require a new version",
        "Supersedes and derived-from links are written to the prior revision"
      ],
      "source_refs": [
        "SRC-009",
        "SRC-007",
        "SRC-008",
        "SRC-010"
      ]
    },
    {
      "id": "attest-and-sign-revision",
      "name": "Attest and sign revision",
      "description": "Produce a signed provenance statement binding the builder identity, external parameters and resolved dependencies to the released revision digest, together with a component inventory.",
      "inputs": [
        "Revision digest",
        "Builder identity and version",
        "Resolved dependency set",
        "Component inventory"
      ],
      "outputs": [
        "Signed attestation over the revision digest",
        "Bill-of-materials reference",
        "Public verification instructions"
      ],
      "preconditions": [
        "The release environment and its trust anchors are identified",
        "The digest to be attested matches the stored revision"
      ],
      "effects": [
        "Enables downstream verification before load",
        "Creates the supply-chain record used for dependency impact analysis"
      ],
      "source_refs": [
        "SRC-011",
        "SRC-012"
      ]
    },
    {
      "id": "verify-configuration-before-load",
      "name": "Verify configuration before load",
      "description": "Verify digest and signature against declared trust anchors before a runtime loads a configuration, and classify accompanying tool annotations as trusted or untrusted based on the verification result.",
      "inputs": [
        "Revision reference",
        "Attestation",
        "Trust anchor set and trust policy"
      ],
      "outputs": [
        "Verification verdict",
        "Trusted or untrusted classification for tool annotations",
        "Rejection reason where verification fails"
      ],
      "preconditions": [
        "Trust anchors are configured out of band",
        "The attestation subject digest is recomputed locally, not taken on trust"
      ],
      "effects": [
        "Refuses to load unverified or mismatched revisions",
        "Downgrades tool annotations to untrusted when the source is not verified"
      ],
      "source_refs": [
        "SRC-011",
        "SRC-001",
        "SRC-004"
      ]
    },
    {
      "id": "evaluate-configuration-revision",
      "name": "Evaluate configuration revision",
      "description": "Run functional and adversarial evaluation suites against a specific revision digest under a pinned model build, compare results with acceptance thresholds and attach the evidence with an expiry.",
      "inputs": [
        "Revision reference and digest",
        "Evaluation suite references and versions",
        "Pinned model build and runtime versions"
      ],
      "outputs": [
        "Metric results with units",
        "Acceptance verdict per threshold",
        "Evidence record with validity period"
      ],
      "preconditions": [
        "Suites are versioned and the run environment is recorded",
        "The digest under test equals the digest that will be released"
      ],
      "effects": [
        "Attaches evidence to the revision rather than to a mutable name",
        "Sets an expiry that forces re-evaluation on model or runtime change"
      ],
      "source_refs": [
        "SRC-007",
        "SRC-014",
        "SRC-018"
      ]
    },
    {
      "id": "bind-and-roll-out",
      "name": "Bind revision and control rollout",
      "description": "Activate a verified revision in a named environment or tenant under a declared rollout strategy, opening a new binding record and closing the previous one with an effective-to instant.",
      "inputs": [
        "Revision reference",
        "Environment and tenant",
        "Rollout strategy and traffic share"
      ],
      "outputs": [
        "Deployment binding record",
        "Effective-from instant",
        "Closed prior binding with effective-to instant"
      ],
      "preconditions": [
        "Verification and evaluation have passed and evidence is unexpired",
        "A rollback target is designated and still retained"
      ],
      "effects": [
        "Makes the revision operative for matching traffic",
        "Preserves an auditable, non-overlapping history of effective windows"
      ],
      "source_refs": [
        "SRC-007",
        "SRC-014",
        "SRC-003"
      ]
    },
    {
      "id": "rollback-or-disable-configuration",
      "name": "Roll back or disable configuration",
      "description": "Withdraw an active revision immediately, either by reverting to the designated rollback target or by disabling the configuration without a redeploy, and link the action to an incident record.",
      "inputs": [
        "Active binding reference",
        "Rollback target reference or disable instruction",
        "Incident reference"
      ],
      "outputs": [
        "Closed binding with effective-to instant",
        "Restored binding or disabled state",
        "Incident linkage record"
      ],
      "preconditions": [
        "The rollback target is retained and passes integrity verification",
        "The operator is authorised to act on the affected environment"
      ],
      "effects": [
        "Removes the revision from service without deleting its record",
        "Creates the audit trail linking withdrawal to its triggering incident"
      ],
      "source_refs": [
        "SRC-007",
        "SRC-014",
        "SRC-004"
      ]
    },
    {
      "id": "redact-configuration-for-disclosure",
      "name": "Redact configuration for disclosure",
      "description": "Produce an audience-appropriate disclosure package from a revision, applying the declared redaction rules while preserving verifiable linkage to the original digest.",
      "inputs": [
        "Revision snapshot",
        "Audience class (deployer, auditor, regulator, end user)",
        "Redaction ruleset"
      ],
      "outputs": [
        "Redacted disclosure package",
        "Redaction manifest naming every removed field",
        "Reference to the source revision digest"
      ],
      "preconditions": [
        "A confidentiality class is assigned to the revision",
        "The audience class maps to a defined disclosure scope"
      ],
      "effects": [
        "Removes secrets and restricted fields without breaking digest traceability",
        "Writes an access log entry recording principal, purpose and timestamp"
      ],
      "source_refs": [
        "SRC-018",
        "SRC-015",
        "SRC-014",
        "SRC-004"
      ]
    },
    {
      "id": "bind-tools-and-skills",
      "name": "Bind tools and skills",
      "description": "Attach a pinned tool catalog and skill packages, reconcile experimental allowed-tools with the host allowlist, and record independent risk classes.",
      "inputs": [
        "configuration version",
        "tool definitions",
        "skill packages",
        "host allowlist and approval policy"
      ],
      "outputs": [
        "pinned catalog digest",
        "reconciled allowlist",
        "untrusted annotation flags"
      ],
      "preconditions": [
        "Tool input schemas are valid JSON Schema objects",
        "Skill names match directories and frontmatter"
      ],
      "effects": [
        "The configuration version references a frozen or explicitly live catalog",
        "Annotations are stored as hints only"
      ],
      "source_refs": [
        "SRC-023",
        "SRC-024",
        "SRC-028",
        "SRC-032"
      ]
    },
    {
      "id": "emit-run-pin",
      "name": "Pin configuration for a run",
      "description": "Emit the pin tuple a run must store so later inspection can recover the exact instruction and tool package.",
      "inputs": [
        "configuration version or stored prompt reference",
        "effective stack digest if already composed",
        "content-capture policy"
      ],
      "outputs": [
        "pin tuple",
        "optional redacted instruction snapshot according to capture policy"
      ],
      "preconditions": [
        "Version exists and is not hard-deleted",
        "Capture policy is known"
      ],
      "effects": [
        "A run can be related to WM-AI-005 without depending on a latest pointer"
      ],
      "source_refs": [
        "SRC-022",
        "SRC-027"
      ]
    }
  ],
