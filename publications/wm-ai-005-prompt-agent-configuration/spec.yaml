                      "Key ordering, encoding and line-ending rules",
                      "Round-trip test result"
                    ]
                  },
                  {
                    "id": "q-digest-exclusions",
                    "text": "Which regions are excluded from the digest because they resolve only at run time?",
                    "kind": "composition",
                    "answer_data": [
                      "Excluded field paths",
                      "Reason for each exclusion",
                      "How excluded values are recorded at run time instead"
                    ]
                  }
