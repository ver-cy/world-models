      {
        "id": "identity-and-release-control",
        "name": "Identity and Release Control",
        "description": "How a configuration is named, uniquely addressed, digested, versioned and moved through controlled lifecycle states.",
        "rationale": "Without a stable identifier and an immutable, content-addressed revision, no downstream claim about behaviour, evidence or compliance can be attached to anything. Release immutability and version semantics are normative in SemVer and presumed by attestation formats.",
        "source_refs": [
          "SRC-009",
          "SRC-011",
          "SRC-017",
          "SRC-007"
        ],
        "layers": [
          {
            "id": "identity-and-addressing",
            "name": "Identity and Addressing",
            "description": "Names, namespaces, aliases and the digest that makes a revision comparable across stores.",
            "source_refs": [
              "SRC-017",
              "SRC-001",
              "SRC-011"
            ],
            "findings": [
              {
                "id": "configuration-identity",
                "name": "Configuration identity and addressing",
                "description": "The identifiers by which this configuration is known: the master-system identifier of record, an ownership-bearing namespaced name, and any unstable display aliases. MCP names are unique only within a server, so they are not global identifiers.",
                "source_refs": [
                  "SRC-001",
                  "SRC-002",
                  "SRC-017"
                ],
                "questions": [
                  {
                    "id": "q-master-identifier",
                    "text": "Which authoritative master system issues the identifier for this configuration, and what is that identifier?",
                    "kind": "identity",
                    "answer_data": [
                      "Master system name and base IRI",
                      "Identifier string as issued",
                      "Whether the Dimension is the system of record or a replica"
                    ]
                  },
                  {
                    "id": "q-global-namespace",
                    "text": "What governed namespace or reverse-DNS name distinguishes this configuration from a same-named configuration published by someone else?",
                    "kind": "interoperability",
                    "answer_data": [
                      "Reverse-DNS namespace and local name",
                      "Evidence of namespace ownership (DNS, repository or registry verification)"
                    ]
                  },
                  {
                    "id": "q-configuration-kind",
                    "text": "Is this a system instruction, a parameterised prompt template, an agent definition, a tool-grant set, or a composite of these?",
                    "kind": "classification",
                    "answer_data": [
                      "Configuration kind code",
                      "Whether the kind changes the required fields",
                      "Composite part list if applicable"
                    ]
                  },
                  {
                    "id": "q-stable-aliases",
                    "text": "Which display titles, slugs or aliases resolve to this configuration, and which of them are guaranteed stable?",
                    "kind": "definition",
                    "answer_data": [
                      "Alias values with stability flag",
                      "Locale of each display title",
                      "Resolution precedence among aliases"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "configuration-identifier",
                    "name": "Configuration identifier",
