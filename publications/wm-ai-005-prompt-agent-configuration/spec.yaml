                "description": "Each released revision is an immutable snapshot identified by an algorithm-qualified digest over a canonical serialisation, with run-time-resolved regions explicitly excluded.",
                "source_refs": [
                  "SRC-011",
                  "SRC-009",
                  "SRC-001"
