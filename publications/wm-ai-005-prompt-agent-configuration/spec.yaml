  "model": {
    "registry_id": "vr.wm-ai-005",
    "model_id": "WM-AI-005",
    "name": "Prompt / Agent Configuration",
    "entry_kind": "aggregate",
    "purpose": "Describe, as a format-neutral aggregate, the versioned operational instruction set and tool configuration that governs how an AI model or agent behaves, so that an agent can identify, compose, validate, release, deploy, audit and retire a configuration revision reproducibly.",
    "scope_statement": "A Prompt / Agent Configuration is an immutable, versioned, content-addressable specification of agent behaviour. It aggregates instruction blocks (system, developer, template), template arguments and rendering rules, instruction authority levels and trust boundaries, model selection and decoding parameters, output contracts, tool and context/resource grants with risk annotations, server and authorization-scope bindings, safety constraints and human-oversight gates, autonomy and resource budgets, evaluation and adversarial evidence, provenance and release attestation, deployment bindings, and governance metadata (ownership, regulatory classification, access, retention). The model covers the configuration artifact and its lifecycle, not the actor that executes it and not the executions themselves.",
    "in_scope": [
      "Identity, namespacing and content-addressed revision integrity of a configuration",
      "Instruction blocks, prompt templates, arguments and rendering/escaping rules",
      "Instruction authority hierarchy and untrusted-content trust boundaries",
      "Model selection, decoding parameters and declared output contract",
      "Tool grants, schema bindings, behaviour annotations and confirmation gates",
      "Context, root, resource and persistent-memory grants",
      "Server bindings, requested authorization scopes and secret referencing by handle",
      "Behavioural constraints, refusal policy and enforcement points outside the model",
      "Human oversight gates, autonomy caps and per-run resource budgets",
      "Evaluation suites, acceptance thresholds and adversarial-test evidence tied to a digest",
      "Authorship provenance, release attestation, signing and dependency inventory",
      "Version scheme, compatibility rules, lifecycle states and change control",
      "Environment binding, rollout, rollback and immediate-disable mechanisms",
      "Ownership, regulatory classification, confidentiality, access and retention"
    ],
    "out_of_scope": [
      "The foundation model itself: weights, training data, fine-tuning and adapter artifacts",
      "The deployed agent as an actor, its persona in the world, and its runtime process",
      "Agent run/execution records, transcripts, traces and conversation content",
      "Tool and API implementations, their internal service contracts and hosting",
      "Identity and access management principals, credential issuance and secret storage",
      "Retrieval corpora, vector index construction and knowledge-base content",
      "Multi-agent orchestration topology and inter-agent negotiation protocols",
      "Serving infrastructure, hardware, autoscaling and cost accounting systems",
      "Content credentials or watermarking applied to generated outputs"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-AI-002 AI Agent (deployed actor)",
        "distinction": "This model is the versioned instruction artifact; the agent model is the actor that loads it. The agent references a configuration revision; the configuration never contains agent runtime state, health or persona-in-world facts. One configuration may be referenced by many agents and one agent may swap configurations over time.",
        "source_refs": [
          "SRC-016",
          "SRC-005"
        ]
      },
      {
        "neighbor": "WM-AI-004 Agent Run / execution record",
        "distinction": "A run records the exact configuration revision identifier and digest for reproducibility. Only linkage fields (revision reference, telemetry attribute keys, conversation identifier) belong here; prompts, tool call payloads, outputs and timings of a specific execution belong to the run model.",
        "source_refs": [
          "SRC-016",
          "SRC-011"
        ]
      },
      {
        "neighbor": "WM-KNW-005 parent knowledge model",
        "distinction": "The configuration is a governed knowledge artifact and inherits identity, provenance and retention semantics, but adds executable operational semantics: authority levels, capability grants and enforcement points that a passive knowledge asset does not have.",
        "source_refs": [
          "SRC-007",
          "SRC-013"
        ]
      },
      {
        "neighbor": "Foundation model / model card artifact",
        "distinction": "The configuration records which model it is pinned to and which decoding parameters it sets; it does not describe training data, architecture, quantitative model-level analysis or model licensing. Those belong to a model-card style sibling aligned with CycloneDX ML-BOM.",
        "source_refs": [
          "SRC-012",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Tool / MCP server definition",
        "distinction": "The configuration records the grant (which tool name, from which server, bound to which schema digest, with which confirmation gate). The tool's own definition, implementation, availability and versioning are owned by the server and its registry entry. Tool annotations are copied as untrusted claims, not as authoritative classification.",
        "source_refs": [
          "SRC-001",
          "SRC-017",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Credential and secret management model",
        "distinction": "The configuration holds only opaque secret handles and requested authorization scopes. Secret values, rotation, vault policy and token issuance are out of scope; embedding a secret in instruction text is prohibited by policy rather than modelled here.",
        "source_refs": [
          "SRC-018",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Software build / release artifact",
        "distinction": "The configuration borrows release semantics (immutability, semantic versioning, in-toto/SLSA attestation) but is not a code build: its externalParameters are instruction text and grants, and its correctness evidence is behavioural evaluation rather than compilation.",
        "source_refs": [
          "SRC-009",
          "SRC-011"
        ]
      }
    ]
  },
