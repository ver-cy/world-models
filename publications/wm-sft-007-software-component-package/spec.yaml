      "inputs": [
        "root component coordinate",
        "declared dependency manifest",
        "registry state and resolver configuration"
      ],
      "outputs": [
        "resolved component set with pinned versions and digests",
        "direct versus transitive classification",
        "completeness statement including known unknowns"
      ],
      "preconditions": [
        "Version scheme is declared or inferable for each constraint",
        "Registry endpoints are reachable or a cached snapshot is available"
      ],
      "effects": [
        "Resolution instant is recorded so the closure can be reproduced or invalidated",
        "Unresolvable constraints are recorded as explicit known unknowns rather than dropped"
      ],
      "source_refs": [
        "SRC-006",
        "SRC-005",
        "SRC-002"
      ]
    },
    {
      "id": "fn-verify-build-provenance",
