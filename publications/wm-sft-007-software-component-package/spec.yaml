        "verification policy"
      ],
      "outputs": [
        "verification result",
        "builder identity and build type as verified",
        "claimed assurance level with supporting evidence"
      ],
      "preconditions": [
        "Attestation subject digest is present",
        "Trust material for the signer is available and within its validity window"
      ],
      "effects": [
