  "functions": [
    {
      "id": "fn-normalize-coordinate",
      "name": "Normalize and compare package coordinate",
      "description": "Produce the canonical purl for a component or release and decide whether two coordinates denote the same thing.",
      "inputs": [
        "raw coordinate or purl string",
        "purl type",
        "registry endpoint context"
      ],
      "outputs": [
        "canonical purl",
        "normalization decisions applied",
        "equality or inequality verdict against a candidate"
      ],
      "preconditions": [
        "purl type is known and lowercase-normalizable",
        "type-specific case and encoding rules are available for the type"
      ],
      "effects": [
        "Canonical identity is stored and used as the comparison key for all downstream operations",
        "Unrecognized or ambiguous types are raised as gaps rather than silently defaulted"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-003"
      ]
    },
    {
      "id": "fn-verify-artifact-integrity",
      "name": "Verify artifact integrity",
      "description": "Verify retrieved bytes against the recorded digest before the artifact is consumed or archived.",
      "inputs": [
        "retrieved byte stream",
        "recorded digest in algorithm:encoded form",
        "accepted algorithm policy"
      ],
      "outputs": [
        "verification outcome",
        "computed digest",
        "verification instant and actor"
      ],
      "preconditions": [
        "At least one digest is recorded for the artifact",
        "The digest algorithm is on the accepted list"
      ],
      "effects": [
        "A mismatch quarantines the artifact and never overwrites the recorded digest",
        "Verification outcome and time are appended to the assertion ledger"
      ],
      "source_refs": [
        "SRC-013",
        "SRC-007",
        "SRC-017"
      ]
    },
    {
      "id": "fn-resolve-dependency-closure",
