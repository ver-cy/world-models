  "model": {
    "registry_id": "vr.wm-sft-007",
    "model_id": "WM-SFT-007",
    "name": "Software Component / Package",
    "entry_kind": "entity",
    "purpose": "Provide the format-neutral context an agent needs to identify, classify, verify, compose, govern and operate a versioned, distributable software component or package release used as a dependency.",
    "scope_statement": "This model covers the identifiable software component or package as a distributable unit: its project-level and release-level identity, version designation, contained and depended-upon composition, origin and build provenance, licensing and regulatory obligations, lifecycle state, vulnerability exposure, distribution channel and the provenance of every assertion made about it. It deliberately stops at the boundary of the consuming product, the SBOM document, the advisory record and the running deployment, each of which is a sibling or parent model. Storage and interface (JSON, YAML, Markdown, Git, MCP, MongoDB) are projections of this model, never its semantics.",
    "in_scope": [
      "Project-level identity (ecosystem type, namespace, name) and release-level identity (version, distribution variants, content digests).",
      "Cross-scheme identifier alignment: purl, CPE, SWID, content identifiers, OCI descriptors and registry-native keys.",
      "Declared dependency constraints, resolved dependency closures, contained files, bundled subcomponents and pedigree or derivation.",
      "Origin and supply-chain provenance: supplier, author, manufacturer and distributor roles, source revision linkage, build attestation and signature verification.",
      "Declared and concluded licensing, attribution and notice obligations attaching to redistribution.",
      "Release lifecycle state (pre-release, published, deprecated, yanked, withdrawn, removed), support window and replacement path.",
      "Vulnerability affectedness of a specific version, exploitability status, remediation decisions and time-bounded exceptions.",
      "Distribution channel, registry of record, retrieval location, availability, unpublish and retention behaviour.",
      "Assertion-level provenance: who asserted a fact, from which source, with what evidence and confidence, at which event and observation time."
    ],
    "out_of_scope": [
      "The composed software product or service that consumes the component, and its architecture (WM-SFT-001).",
      "The SBOM document itself, its structure, exchange, signing and distribution (WM-SFT-012); only the reference edge and coverage claims remain here.",
      "Vulnerability and advisory records as first-class entities (CVE, GHSA, OSV entries); only the affectedness edge for a version is in scope.",
      "Source repository, branch and commit management, code review and contribution process.",
      "Build platform, pipeline and runner configuration as entities; only the emitted provenance predicate and its subject digest are referenced.",
      "Deployed or running instances, hosts, containers at runtime and operational telemetry.",
      "Legal-entity master data for suppliers, maintainers and stewards; only the role edge is in scope.",
      "Licence texts, licence drafting and legal interpretation; only the expression and derived obligations are in scope.",
      "Cryptographic key material, trust roots, key issuance and rotation procedures.",
      "Hardware bills of material and non-software components."
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-SFT-001 Software Product / Service",
        "distinction": "A product or service is the marketed and operated whole; a package is a versioned distributable unit reusable across many products. SPDX models both as Package instances distinguished only by purpose vocabularies, so the distinction must be carried by the composition edge, not by the class.",
        "source_refs": [
          "SRC-001",
          "SRC-018"
        ]
      },
      {
        "neighbor": "WM-SFT-012 Software Bill of Materials",
        "distinction": "An SBOM is a document asserting a component set at a point in time; SPDX models it as a distinct Sbom class. The component exists independently of any SBOM, so SBOM structure, completeness and exchange belong to the sibling model.",
        "source_refs": [
          "SRC-018",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Vulnerability / advisory record (OSV, CVE, GHSA)",
        "distinction": "The OSV entry is the authority-published record with its own identifier, aliases, ranges and modification time. This model stores only the resolved verdict for a concrete version plus the evidence of that resolution.",
        "source_refs": [
          "SRC-008"
        ]
      },
      {
        "neighbor": "Build or pipeline run",
        "distinction": "SLSA provenance describes the build run, its builder identity and parameters. The package holds the subject digest and the attestation reference; the run itself is a separate event entity.",
        "source_refs": [
          "SRC-006",
          "SRC-007"
        ]
      },
      {
        "neighbor": "Source code revision (VCS commit)",
        "distinction": "purl types such as github and golang can address version-control locations, but a revision is not a distributable release with its own distribution artifacts and lifecycle state; the two must not be conflated.",
        "source_refs": [
          "SRC-002"
        ]
      },
      {
        "neighbor": "Product-class identifier (CPE)",
        "distinction": "CPE names classes of IT products for platform enumeration and vulnerability matching; it does not address a specific downloadable artifact. purl does. Mapping between them is lossy and must be recorded as an alignment.",
        "source_refs": [
          "SRC-011",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Installed software asset (SWID tag)",
        "distinction": "SWID tags describe software installed on an endpoint, including patch and supplemental tags for asset management. Endpoint installation state is asset data, not package identity.",
        "source_refs": [
          "SRC-012"
        ]
      },
      {
        "neighbor": "Container image / OCI artifact",
        "distinction": "An OCI image is addressed by a content descriptor digest and may also carry a purl of type oci. It extends package identity with layered content addressing rather than replacing it.",
        "source_refs": [
          "SRC-013",
          "SRC-002"
        ]
      }
    ]
  },
