    "conflicts": [
      "No universal version ordering exists. Semantic Versioning defines strict precedence with build metadata ignored, while OSV explicitly distinguishes GIT, SEMVER and ECOSYSTEM range types precisely because ecosystem ordering differs. The model therefore refuses a canonical cross-scheme precedence and stores the version as opaque with a declared scheme.",
      "Version is not universally mandatory. CycloneDX requires only type and name, and SPDX makes packageVersion optional at 0..1, whereas component-inventory practice treats version as a minimum element. The model keeps version optional at project level and required at release level rather than asserting a single rule.",
      "purl, CPE and SWID answer different questions. purl addresses a downloadable package, CPE names classes of IT products for platform enumeration, and SWID describes installed software for asset management. Mappings between them are lossy and directional; the model records mapping confidence and forbids treating them as equivalent.",
      "Deletion regimes conflict across registries. npm permits unpublish within 72 hours and under narrow later conditions while permanently forbidding version reuse; PyPI's yank keeps the file installable for explicit pins; Semantic Versioning simply forbids modifying released content. The model normalizes these to lifecycle states plus a registry-specific policy reference rather than assuming one behaviour.",
      "Timestamp granularity conflicts with this model's rule. SLSA specifies build timestamps in a UTC-only form and OSV requires RFC3339 timestamps ending in Z, whereas the Vercy rule requires an explicit offset or Z. The model stores such values with the Z designator and records the upstream constraint as an alignment note; it does not relax the offset requirement.",
