  "composition": [
    {
      "target": "WM-SFT-001 Software Product / Service",
      "relation": "COMPOSE",
      "purpose": "A software product or service is composed of component or package releases; the product model owns architecture, market framing and operation, this model owns the reusable versioned unit. SPDX models both as Package instances, so the distinction is carried by this edge rather than by class.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-018",
        "SRC-005"
      ]
    },
    {
      "target": "WM-SFT-012 Software Bill of Materials",
      "relation": "REFERENCE",
      "purpose": "A package release references the SBOM documents that assert its contents. SPDX defines Sbom as a distinct class, so document structure, completeness and exchange stay in the sibling model while this model keeps the reference and the coverage claim.",
      "required": false,
      "source_refs": [
        "SRC-018",
        "SRC-005"
      ]
    },
    {
      "target": "Vulnerability / advisory record (OSV, CVE, GHSA)",
      "relation": "REFERENCE",
      "purpose": "Affectedness verdicts reference advisory records that carry their own identifiers, aliases, ranges, severities and modification times. This model stores only the resolved verdict for a concrete version plus its evidence.",
      "required": false,
      "source_refs": [
        "SRC-008"
      ]
    },
    {
      "target": "Organisation / Agent (supplier, author, distributor, steward)",
      "relation": "REFERENCE",
      "purpose": "Supplier, originator, distributor and steward roles reference agent identities owned elsewhere; the model records the role edge and its assertion basis, never duplicate legal-entity master data.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-005",
        "SRC-010"
      ]
    },
    {
      "target": "Source code repository revision",
      "relation": "REFERENCE",
      "purpose": "Links a release to the exact revision claimed to have produced it, keeping repository, branch and review process in the source model.",
      "required": false,
      "source_refs": [
        "SRC-002",
        "SRC-006"
      ]
    },
    {
      "target": "Build or pipeline run",
      "relation": "REFERENCE",
      "purpose": "References the build run whose provenance predicate binds a builder identity and build definition to the artifact's subject digest; the run itself is a separate event entity.",
      "required": false,
      "source_refs": [
        "SRC-006",
        "SRC-007"
      ]
    },
    {
      "target": "Package URL (purl) identifier scheme, ECMA-427",
      "relation": "ALIGN",
      "purpose": "Canonical component identity aligns to the purl syntax and normalization rules as a governed global identifier scheme; alignment is asserted as a mapping, not as conformance.",
      "required": true,
      "source_refs": [
        "SRC-002",
        "SRC-003"
      ]
    },
    {
      "target": "SPDX License List and licence expression grammar",
      "relation": "ALIGN",
      "purpose": "Licence expressions are canonicalized to the SPDX expression grammar with its identifiers, operators and precedence so that determinations are comparable across suppliers.",
      "required": true,
      "source_refs": [
        "SRC-009"
      ]
    },
    {
