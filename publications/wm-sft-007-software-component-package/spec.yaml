      "Attempts to retrieve the CISA and NTIA minimum-elements documents returned HTTP 403, so the specific 2025 and 2026 field names (component hash algorithm, component license, tool name, generation context) are not cited as primary support. Where the model uses those concepts they are grounded instead in CycloneDX and SPDX fields.",
