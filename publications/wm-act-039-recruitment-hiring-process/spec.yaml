    "name": "Recruitment / Hiring Process",
    "entry_kind": "aggregate",
    "purpose": "Represent one governed recruitment process aggregate for a bounded hiring need or campaign, connecting an authorized requisition and frozen selection design to source-qualified candidate participation, accountable decisions, offers and closure.",
    "scope_statement": "Owns recruitment-process identity and lineage, mandatory process profile, authorized need and exact requisition and criterion bindings, posting and sourcing activity, process-scoped candidate-case links, stage design and occurrences, bounded screening, assessment, interview, verification, recommendation, decision, offer, response, closure, quality, fairness, lifecycle, interoperability, access and retention assertions. Organization, Unit, Position, Vacancy, Person, Candidate, Application, Qualification, Competency, Assessment Definition, Assessment Result, Interview, Evidence, Decision, Offer, Contract, Employment, Communication, Dataset, Artifact and Audit masters remain external.",
    "in_scope": [
      "Process identity, profile, lineage, hiring need, requisition, authority, job analysis, competencies, qualifications, criteria and policy bindings",
      "Posting, channels, sourcing, referrals, agencies, fees, candidate notices, application and candidate-case references, eligibility, accessibility, accommodations and protected-data controls",
      "Screening, assessments, interviews, verification, ranking, recommendation, accountable selection, offers, responses, closure, complaints, quality, fairness, lifecycle, interoperability, retention and safe agents"
    ],
    "out_of_scope": [
      "Independent organization, unit, position, vacancy, person, candidate, application, competency, qualification, assessment, interview, evidence, decision, offer, contract, employment, communication, dataset, artifact or audit master lifecycles",
      "Inferring consent, qualification, eligibility, suitability, fairness, employment, legality or future performance from participation, one document, score, ratio, offer response or opaque model",
      "Implementing an applicant-tracking system, job board, assessment platform, background-check service, HR information system, payroll system or universal employment and equality law"
    ],
    "boundary_notes": [
      {
        "neighbor": "Position, Vacancy / Matching and Job Posting",
        "distinction": "The position and vacancy define the opportunity and a posting is one published representation. The recruitment aggregate binds exact external revisions and coordinates a bounded hiring realization.",
        "source_refs": [
          "SRC-001",
          "SRC-004",
          "SRC-009",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Person, Candidate and Application",
        "distinction": "The process owns source-qualified participation and stage assertions. Person, candidate identity and application evidence retain independent ownership, rights and lifecycle.",
        "source_refs": [
          "SRC-002",
          "SRC-005",
          "SRC-008",
          "SRC-012",
          "SRC-014"
        ]
      },
      {
        "neighbor": "Assessment, Interview, Verification and Evidence",
        "distinction": "The process binds exact definitions and records occurrences and bounded use. Instruments, observations, source evidence and result records retain their own identity, authority and correction history.",
        "source_refs": [
          "SRC-003",
