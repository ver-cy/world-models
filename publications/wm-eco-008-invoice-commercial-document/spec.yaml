    "adversarial_checks": [
      "Tested whether electronic signatures are a normative requirement for invoice integrity. They are not: the governing guidance treats business controls creating a reliable audit trail as sufficient and names signatures and EDI as examples. A structure that made signatures mandatory would have been attractive and wrong, so the model records assurance method as elective and jurisdiction-qualified.",
      "Tested whether the legacy generic version-chain pattern should be carried over from the previous-version material. It should not: an issued invoice is immutable and is amended by a further document, so applying a version chain to invoice content would model an unlawful operation. The correction chain replaces it and the conflict with the parent model is recorded.",
      "Tested whether transport-level receipt can stand in for business acceptance. It cannot; the network specifications distinguish message-level status from business response, so the model keeps delivery evidence and business response as separate findings with separate artefacts.",
      "Tested whether the issuer's invoice number can be treated as the authoritative identifier everywhere. It cannot, because clearance regimes assign an identifier that is legally operative; the identity priority therefore leads with the authoritative master-system identifier defined by regime, not with the issuer's number.",
      "Tested whether a single 'compliant' or 'valid' flag is defensible. It is not, because usage specifications and networks layer additional rules on the core set and artefact versions change on a release cycle; the model requires rule-set identity and artefact version to accompany every verdict.",
      "Tested whether settlement status belongs on the invoice. It does not; the document asserts an amount due at issue, and holding a mutable paid or unpaid field on an immutable record would corrupt both the record and the settlement model. Settlement is referenced and derived instead.",
      "Tested whether date-only business terms could simply be stored as RFC 3339 instants for uniformity. They cannot without inventing a time zone and risking a date shift across offsets, which would change tax point and deadline assessments; the timestamp rule therefore separates calendar dates from system-observed instants.",
      "Searched for a counterexample to the four-corner exchange assumption and found that a major economy operates no mandate and a voluntary network, which is why regional generalisation is recorded as an assumption rather than as structure.",
      "Could this model collapse into N1 Document & Record? No: lines, tax totals, payable amount, type codes and customs valuation are commercial-claim semantics; N1 is referenced for recordkeeping only.",
      "Are payments in scope? Only instructions, prepaid amount and typed settlement links; payment execution is WM-ECO-009.",
      "Is a customs commercial invoice the same object as a Peppol tax invoice? No; legal class and mandatory content differ and are explicit.",
      "Can an issued invoice be patched? Not in this model; successors carry corrections.",
      "Does alignment to UBL imply XML storage? No; UBL is a business-object alignment independent of XML, JSON, PDF, Git, MCP or MongoDB."
    ]
