                "description": "An invoice is identified by a number that is unique within the issuer's namespace and, in EU law, drawn from a sequential series; the number alone is not globally unique, so identity is the pair (issuer party identifier, invoice number) qualified by document type. Where a clearance regime applies, a second, authority-assigned identifier exists and legally outranks the issuer's number.",
