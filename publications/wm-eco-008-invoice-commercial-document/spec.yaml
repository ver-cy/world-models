  "composition": [
    {
      "target": "WM-ECO-009 Payment / Settlement",
      "relation": "REFERENCE",
      "purpose": "The invoice asserts a payment instruction and an amount due at issue; actual settlement, partial payment and write-off are held in the settlement model and referenced back, never written into the issued document.",
      "required": true,
      "source_refs": [
        "SRC-004",
        "SRC-003",
        "SRC-006"
      ]
    },
    {
      "target": "WM-ECO-024 Order Fulfilment",
      "relation": "REFERENCE",
      "purpose": "Despatch advice and receiving advice identifiers and the actual delivery date link the invoice to the supply it bills, forming the audit trail required to assure authenticity of origin.",
      "required": false,
      "source_refs": [
        "SRC-004",
        "SRC-011"
      ]
    },
    {
      "target": "Document & Record (legacy N1 recordkeeping model)",
      "relation": "EXTEND",
      "purpose": "Reuse generic recordkeeping machinery — custody, holds, disposition, preservation of legibility — while overriding the generic version-chain pattern, because an issued invoice is immutable and is amended by a new document rather than by a new version.",
      "required": false,
      "source_refs": [
        "SRC-010",
        "SRC-006",
        "SRC-011"
      ]
    },
    {
      "target": "Organization / Legal Entity",
      "relation": "REFERENCE",
      "purpose": "Seller, buyer, payee and tax-representative roles resolve to externally governed legal-entity records; the invoice stores a snapshot plus a reference, not the master record.",
      "required": true,
      "source_refs": [
        "SRC-004",
        "SRC-008"
      ]
    },
    {
      "target": "Person / Contact",
      "relation": "REFERENCE",
      "purpose": "Named contacts, approvers and signatories on or around the document resolve to the person model, which also carries the personal-data governance those references attract.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-004"
      ]
    },
    {
      "target": "Product / Item and Classification",
      "relation": "REFERENCE",
      "purpose": "Line items reference item records and classification schemes; the invoice carries identifiers and a descriptive snapshot rather than governing item master data.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-004"
      ]
    },
    {
      "target": "Order and Contract",
      "relation": "REFERENCE",
      "purpose": "Purchase order, sales order, contract, tender and lot references support matching and are named core elements of an electronic invoice, but contractual terms remain governed elsewhere.",
      "required": false,
      "source_refs": [
        "SRC-008",
        "SRC-004"
      ]
    },
    {
      "target": "Tax Registration and Rate",
      "relation": "REFERENCE",
      "purpose": "Tax registration identifiers, category codes, rates and exemption reason codes are drawn from externally governed registrations and code lists rather than defined by this model.",
      "required": true,
      "source_refs": [
        "SRC-005",
        "SRC-006"
      ]
    },
    {
      "target": "Identifier Scheme Registry",
      "relation": "REFERENCE",
      "purpose": "Party identifiers, electronic addresses and item identifiers must be scheme-qualified against registered scheme lists so that a bare identifier is never treated as globally unique.",
      "required": true,
      "source_refs": [
        "SRC-005",
        "SRC-012"
      ]
    },
    {
      "target": "Currency and Unit of Measure code lists",
      "relation": "ALIGN",
      "purpose": "Currency codes, country codes and unit-of-measure codes align to the registered code lists with explicit version pinning, since code-list versions change on a scheduled release cycle.",
      "required": true,
      "source_refs": [
        "SRC-005",
        "SRC-004"
      ]
    },
    {
      "target": "European semantic model of the core elements of an electronic invoice (EN 16931 family)",
      "relation": "ALIGN",
      "purpose": "Business terms and groups are aligned to the European core invoice semantic model as expressed through registered usage specifications and supporting artefacts; alignment is claimed, conformance only where validation evidence exists.",
      "required": false,
      "source_refs": [
        "SRC-005",
        "SRC-008",
        "SRC-003"
      ]
    },
    {
      "target": "Invoice syntaxes (business-language XML, cross-industry XML, hybrid carriers)",
      "relation": "ALIGN",
      "purpose": "Serialisations are projections of the same semantics; the model aligns to each binding and records mapping fidelity rather than adopting any one syntax as its definition.",
      "required": false,
