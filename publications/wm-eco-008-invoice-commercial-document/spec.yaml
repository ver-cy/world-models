  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "The adopting Dimension must name a single accountable owner for the invoice record — the issuing organisation by default — and must record any custodian (service provider, access point, archiving provider) with the scope of processing permitted to it; custody never transfers ownership.",
        "The owner package must declare, per jurisdiction it operates in, the applicable particulars profile, the retention period and trigger, whether a clearance or reporting regime applies, and the accepted usage specifications, with the legal basis cited for each.",
        "The owner package must pin code-list and validation-artefact versions and subscribe to the publishing release cycle, so that a document can always be revalidated against the artefact version in force at issue as well as the current one.",
        "The owner package must define role-scoped projections before granting any access, and must operate an append-only provenance log that is verifiable independently of the document store.",
        "The owner package must publish an AGENTS.md bootstrap contract at the root of whatever storage the model is projected into, regardless of whether that storage is a file tree, a document database or an MCP-exposed service."
      ],
      "namespace_guidance": "Use a stable, storage-neutral namespace of the form <dimension>.commercialDocument.<bundle>.<layer>, for example world.commercialDocument.identityAndClassification.identityAndNumbering. Namespace segments are lower camel case, never versioned in the path, and never derived from a date or a syntax name; syntax bindings (business-language XML, cross-industry XML, hybrid carriers, JSON, Markdown, Git, MCP, MongoDB) are projections addressed by mapping manifest rather than by namespace. Jurisdictional variants are expressed as usage-specification identifiers attached to instances, not as forked namespaces, so that a single semantic namespace serves all regions.",
      "registry_links": [
        "vr.wm-eco-008 — this registry entry, nav path NAV.SOC.ECO.INV, domain tags SOC.ECO.INV, legacy alias N1",
        "Registry of supporting artefacts for the European invoice standard: validation artefacts, code lists and registered usage specifications and extensions (SRC-005)",
        "Registered usage specification and profile identifiers published by the exchange network operator (SRC-003, SRC-012)",
        "Scheme registries for party identifiers and electronic addresses referenced by the identifier priority (SRC-005, SRC-012)",
        "planning/VERCY-MODEL-RELATIONS.csv — typed edges to WM-ECO-009 and WM-ECO-024 recorded in the relations register"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Canonical form is semantic, not syntactic: the canonical record is the set of model data elements with their values, independent of whether the instance is carried as business-language XML, cross-industry XML, a hybrid carrier, JSON or database documents.",
        "Amounts are normalised to the decimal precision required by the document currency with the declared rounding mode, and every calculated value is materialised explicitly; no value may be omitted on the assumption that a receiver will recompute it.",
        "Codes are stored with their code-list identifier and version and are compared case-insensitively but stored as published; unversioned code references are rejected at canonicalisation.",
        "Instants are normalised to RFC 3339 with seconds and an explicit offset or Z; date-only business terms remain calendar dates and carry their governing jurisdiction rather than being widened into instants.",
        "Text is normalised to Unicode NFC with trailing whitespace trimmed; collections are ordered deterministically (lines by line identifier, tax groups by category code then rate) before any digest is computed.",
        "The integrity digest is computed over the canonical business document only and explicitly excludes the transport envelope, routing metadata and any post-receipt annotation."
      ],
      "patch_rules": [
        "An issued document is immutable. There is no patch operation on issued content; commercial change is expressed only by issuing a further document that refers specifically and unambiguously to the original.",
        "Annotation planes — lifecycle state, validation results, matching results, responses, transmission records, provenance entries, retention assignment — are append-only. Entries are added, never edited or removed, and each carries actor, acting system and an RFC 3339 instant with explicit offset.",
        "A correction to an annotation is a new entry that supersedes an earlier one by reference; the superseded entry remains retrievable.",
        "No patch may alter a document that has been cleared or registered by an authority, nor any bytes covered by a signature, seal or clearance token; such a change invalidates the assurance and must instead trigger the correction mechanism.",
        "Pre-issue drafts may be edited freely but are marked non-fiscal, are excluded from retention and clearance obligations, and must not be exposed through any projection that implies issued status."
      ],
      "compatibility_rules": [
        "Adding an optional data element or an additional annotation plane is a minor, backward-compatible change; consumers must ignore unknown optional content rather than reject it.",
        "Tightening cardinality, removing an element, changing a value kind or narrowing a code list is breaking and requires a major revision plus a migration note naming affected instances.",
        "A usage specification may restrict the model but must not change the meaning of a core element; an extension may add content but must not make core content unreadable to a core-only consumer.",
        "Code-list and validation-artefact versions are pinned per instance. A document remains interpretable against the artefact version in force at issue; revalidation against a newer version is recorded as a separate result and does not retroactively invalidate the original verdict.",
        "Conformance to the core rule set does not imply conformance to a network's additional rules; each claim names its rule set explicitly and is evidenced separately."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier: the identifier assigned by the system of record that legally owns the document — the tax authority's clearance or registration identifier where a clearance regime applies, otherwise the issuer's invoice number qualified by the issuer's registered party identifier and the document type code.",
        "Governed global identifier or IRI: a resolvable identifier drawn from a registered scheme, such as a scheme-qualified party identifier combined with the document type identifier, or a URN minted under a governed namespace whose scheme and version are recorded with the value.",
