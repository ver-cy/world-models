    "regional_assumptions": [
      "The normative spine — mandatory particulars, authenticity and integrity obligations, storage duties and the acceptance rule — is drawn from European Union law and Commission guidance. It is treated as the reference frame, not as universal law.",
      "Retention periods are not fixed by the EU directive itself but by national law of the Member State concerned; the model therefore carries the period as jurisdiction-scoped data rather than as a constant.",
      "The four-corner exchange framework is used as the reference exchange pattern because it is adopted by authorities in Europe and beyond, including in Asia-Pacific. Other regions use different or no network mandates, and the pattern is not assumed to be universal.",
      "Continuous transaction control regimes exist in several jurisdictions and invert the lifecycle by inserting an authority step before delivery. The model supports this as an optional inserted state; the specific identifier formats, tokens and deadlines are jurisdiction-specific and not enumerated.",
      "The United States has no federal invoice mandate and its exchange framework is voluntary, so tax-driven mandatory particulars and clearance semantics must not be applied there by default.",
      "Currency, country, unit and tax-category code lists are assumed to be drawn from the internationally governed lists referenced by the European supporting-artefact registry; national extensions to those lists exist and must be pinned per instance.",
      "Default tax-invoice content follows EU VAT Directive 2006/112/EC and EN 16931; other VAT/GST regimes need local required-mention overlays.",
