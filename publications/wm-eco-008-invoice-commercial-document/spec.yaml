    "name": "Invoice / Commercial Document",
    "entry_kind": "aggregate",
    "purpose": "Provide one format-neutral context structure for commercial billing documents (invoice, credit note, debit note, self-billed invoice and their corrections) so an agent can understand, create, validate, exchange, prove and retain them across jurisdictions and syntaxes.",
    "scope_statement": "This model covers the commercial billing document as an aggregate: its identity and type, the parties and commercial content it asserts, its tax and monetary computation, the documents it references, its lifecycle and authenticity, and the exchange, retention and governance controls that make it legally usable. It is deliberately narrower than the legacy N1 'Document & Record' entry: generic recordkeeping mechanics are delegated to the record model, and the financial consequences of the document (payment, posting, tax return) are delegated to sibling models. Storage format and access interface are projections: UBL XML, UN/CEFACT CII, hybrid PDF/A-3, JSON, Markdown, Git, MCP or MongoDB carry the same semantics.",
    "in_scope": [
      "Billing document family and function: invoice, credit note, debit note, self-billed invoice and self-billed credit note, corrective and cancelling documents, simplified invoices, summary/periodic invoices, proforma invoices, and the document-type and profile codes that distinguish them.",
      "Document identity and numbering, including issuer-scoped sequential numbers and tax-authority clearance identifiers where a clearance regime applies.",
      "Party roles carried on the document (seller, buyer, payee, seller tax representative, deliver-to party) as references to externally governed party records.",
      "Commercial content: invoice lines, item identification and classification, quantities and unit codes, prices, document- and line-level allowances and charges, invoicing period.",
      "Tax treatment and monetary computation: tax category and rate breakdown, exemption reasons, reverse charge, document and tax-accounting currency, totals, rounding and arithmetic consistency.",
      "Payment instruction data carried on the document: payment means, terms, due date, payee account and remittance reference (not the payment event itself).",
      "References to order, contract, despatch advice, receiving advice, tender/lot, project, preceding invoices and supporting attachments.",
      "Lifecycle and status of the document, buyer response, dispute, correction and cancellation.",
      "Authenticity of origin, integrity of content and legibility: business controls and reliable audit trail, electronic signature or seal, cryptographic fixity, tax-authority clearance and registration.",
      "Regulatory conformance evidence: mandatory particulars, national usage specifications, validation results against schema and business rules.",
      "Exchange semantics: syntax binding and semantic fidelity, routing identifiers, envelope and delivery evidence.",
      "Retention, storage, legibility over the storage period, legal holds and disposition, including the tension with personal-data erasure.",
      "Ownership, role-scoped access projections and provenance/audit trail."
    ],
    "out_of_scope": [
      "Payment execution, settlement, clearing, reconciliation state and remittance advice processing (delegated to WM-ECO-009 Payment / Settlement).",
      "Order placement, contract formation and negotiation of commercial terms (delegated to the order and contract models).",
      "Physical or digital fulfilment, despatch and goods receipt events (delegated to WM-ECO-024 Order Fulfilment).",
      "Accounting postings, journal entries, revenue recognition and general-ledger treatment.",
      "Periodic tax returns, digital reporting submissions (DRR), SAF-T extracts and audit-file generation; only the invoice-side data they draw on is modelled here.",
      "Party master data and legal-entity registration; the model references party identifiers rather than governing them.",
      "Product and service master data, catalogues and price lists.",
      "Receivables financing, factoring, assignment, dunning and collections.",
      "Point-of-sale fiscal receipts and cash-register fiscalisation devices.",
      "Generic recordkeeping mechanics (rendition management, custody transfer, disposition machinery) beyond invoice-specific obligations; these belong to the document-and-record model.",
      "Operation of exchange networks (service metadata publishing, transport certificates, access-point onboarding)."
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ECO-009 Payment / Settlement",
        "distinction": "The invoice carries a payment instruction (means, terms, due date, amount due) as an assertion at issue time; it does not carry settlement state. Whether the invoice was paid, partially paid or written off is derived by reference to settlement records, never stored as a mutable field on an issued document.",
        "source_refs": [
          "SRC-003",
          "SRC-004",
          "SRC-006"
        ]
      },
      {
        "neighbor": "WM-ECO-024 Order Fulfilment",
        "distinction": "Despatch advice and receiving advice identifiers appear on the invoice as references supporting three-way matching, and the actual delivery date is a tax-relevant business term on the invoice; the fulfilment events themselves and their exceptions are governed by the fulfilment model.",
        "source_refs": [
          "SRC-004",
          "SRC-001"
        ]
      },
      {
        "neighbor": "Document & Record (legacy N1)",
        "distinction": "This model narrows the legacy generic record entry. Version chains, renditions, custody transfer and disposition machinery are reused from the record model; what is specific here is that an issued invoice is immutable and is corrected by a new document rather than by a new version, so the generic version-chain pattern must not be applied to invoice content.",
        "source_refs": [
          "SRC-006",
          "SRC-010",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Tax return and digital reporting",
        "distinction": "The invoice supplies data to periodic returns and to transaction-level digital reporting, and under clearance regimes the reporting act can precede delivery to the buyer; but the report is a separate governed submission with its own identity, deadline and correction rules and is not a projection of this model.",
        "source_refs": [
          "SRC-007",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Exchange network (Peppol eDelivery and comparable four-corner frameworks)",
        "distinction": "Participant identifiers, service metadata lookup, transport profile and envelope are referenced so that routing and delivery evidence can be attached, but network operation and transport-level acknowledgement are outside the document. Transport receipt is not business acceptance.",
        "source_refs": [
          "SRC-012",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Order and contract",
        "distinction": "The invoice references a purchase order, contract and tender/lot; it does not restate contractual terms. Where invoice terms contradict contract terms, the model records the discrepancy as a dispute input rather than resolving it.",
        "source_refs": [
          "SRC-004",
          "SRC-001"
        ]
      },
      {
        "neighbor": "Accounting ledger",
        "distinction": "Tax amounts and totals on the invoice are the legally asserted figures; the accounting entries derived from them (including any different functional-currency amounts) belong to the ledger model and may legitimately differ in presentation without invalidating the document.",
        "source_refs": [
          "SRC-006",
          "SRC-004"
        ]
      }
    ]
  },
