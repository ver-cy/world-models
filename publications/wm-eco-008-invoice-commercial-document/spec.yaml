        "Negative rule: a date, an issue period, a file name, a storage path or a transport message identifier is never an identifier of the document. A file name or envelope identifier may serve only as a temporary correlation hint and must be replaced on first authoritative match."
      ],
      "timestamp_rule": "All instant-valued fields use RFC 3339 date-time with explicit seconds and an explicit numeric UTC offset or Z; where UTC is known but the local offset is not, -00:00 is used rather than Z. Event time (issue, signature, clearance acknowledgement, despatch, response, disposition) is recorded separately from observation or ingestion time (receipt at an access point, ingestion into a store, validation execution, archiving) whenever the two differ, and both are retained with the acting system and its clock source. Date-only business terms such as the issue date, tax point date and due date remain calendar dates carrying their governing jurisdiction and must never be silently widened into timestamps by assuming a time zone.",
      "serial_naming_rule": "Serial artefacts — invoice numbers, clearance responses, validation reports, matching runs, transmission records, provenance entries, disposition certificates — are named <ownerPartyIdentifier>--<artefactKind>--<serialKey>, where serialKey preserves the originating system's own monotonic sequence. Sequence gaps must be explainable from the record itself; no date component is used as the sort key or as part of the key; a re-issued, replaced or corrected artefact takes a new serialKey and records a supersession link rather than reusing or overwriting an existing key.",
      "integrity_rule": "Every stored artefact carries a cryptographic digest (SHA-256 or stronger) over its canonical byte form together with the algorithm identifier, computed on the business document excluding the transport envelope. The digest is recorded at ingestion with the observing actor and instant, and every signature, seal, clearance token or timestamp is bound to that digest and to a stated covered scope. Attachments carry their own digests and are only treated as protected if they fall inside a declared signature scope. A digest mismatch quarantines the artefact, blocks disposition and raises an integrity exception; long-lived artefacts are re-protected before the underlying algorithms or certificates expire."
    },
    "policies": [
      "Technology neutrality on assurance: the model must not require electronic signatures. Business controls creating a reliable audit trail between the invoice and the supply are an accepted method in the governing law, and a Dimension asserting that signatures are mandatory must cite the specific jurisdictional rule that makes them so.",
      "Immutability after issue: no process, integration or repair job may edit issued content. Data-quality defects in an issued document are corrected through the lawful correction mechanism, and any tooling capable of in-place edit must be disabled for issued records.",
      "Jurisdiction is explicit: every conformance, retention, particulars and clearance statement names the jurisdiction it applies to. Unqualified statements such as 'compliant' or 'retained for the required period' are rejected at review.",
      "Transport receipt is never recorded as business acceptance, and business acceptance is never inferred from silence unless a named rule establishes that inference.",
      "Personal data on invoices is marked, minimised in projections and restricted rather than erased where a statutory retention obligation applies; the conflict is recorded as a decision with its legal basis, never resolved silently.",
      "Evidence over assertion: conformance, integrity, delivery and disposition claims are only valid where the corresponding artefact (validation report, integrity evidence set, transmission record, disposition certificate) exists and is retrievable.",
