    "conflicts": [
      "Sequential numbering versus opaque identifiers: the legal requirement for a sequential number that uniquely identifies the invoice conflicts with the common engineering preference for UUIDs. Resolved here by ranking the issuer's sequential number above surrogates and forbidding surrogates from being presented as the legal number — but a Dimension using UUIDs as invoice numbers may be non-compliant in some jurisdictions.",
      "Date-only business terms versus instant-valued timestamps: the invoice issue date, tax point date and due date are calendar dates in the core semantic model, while the protocol requires RFC 3339 instants with offsets. Widening a date to an instant invents a time zone and can shift the date across a boundary. Resolved by keeping dates as dates with a governing jurisdiction and confining RFC 3339 to system-observed instants.",
      "Clearance identifier versus issuer number: under continuous transaction control regimes the authority-assigned identifier is the legally operative one, but most syntaxes and integrations key on the issuer's number. The two-tier identity priority resolves this, but tooling built on the issuer number alone will be wrong in those jurisdictions.",
      "Recipient acceptance of electronic invoices: the long-standing rule that use of an electronic invoice is subject to the recipient's acceptance is being displaced by mandatory domestic e-invoicing regimes and by the digital-age package from its entry into force. Both states exist in practice during the transition.",
      "Core conformance versus network conformance: a document can satisfy the core European rule set and still be rejected by a network that layers additional rules on top. Claiming a single undifferentiated 'compliant' status is unsafe.",
      "Hybrid carriers with two representations: a single file carrying both a visual rendition and embedded structured data can hold divergent content, and which representation prevails is not uniform across jurisdictions.",
