    "name": "Price / Valuation",
    "entry_kind": "aggregate",
    "purpose": "Represent observed prices, subject-specific valuation conclusions and statistical price or index observations as governed, versioned value assertions independent of storage or exchange format.",
    "scope_statement": "Owns value-assertion identity and family, subject and interest bindings, amount and unit semantics, price observation evidence, appraisal engagement, basis, approaches, inputs, assumptions, conclusion and uncertainty, price-index structure, provenance, correction and standards projections while referencing offers, transactions, invoices, payments, contracts, assets, currencies, official statistics, datasets and documents.",
    "in_scope": [
      "Value assertion identity, subject, interest or basket, quantity, amount, unit, currency, context and effective time",
      "Price observations and components, appraisal engagements, bases, premises, methods, inputs, comparables, adjustments, conclusions, uncertainty and review",
      "Price-index baskets, classifications, weights, formulae, periods, observations, releases, revisions, provenance, conversion, access and interoperability"
    ],
    "out_of_scope": [
      "Offer, order, contract, trade, transaction, invoice, payment, tax, insurance, asset, liability, product, service, currency or commodity master lifecycles",
      "Respondent-level source data, generic official-statistics production, dataset and file distribution, document payload, publication channel and party identity",
      "Universal asset-class methods, jurisdictional valuation law, accounting recognition, tax rules, disclosure thresholds, foreign-exchange rate authority or price-index formula"
    ],
    "boundary_notes": [
      {
        "neighbor": "Offer, Contract and Transaction",
        "distinction": "This model may observe requested, quoted, administered or transacted amounts, but the commercial record owns negotiation, agreement, performance and legal effect.",
        "source_refs": [
          "SRC-005",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Invoice and Payment",
        "distinction": "Invoiced and paid amounts are external accounting or settlement events; they may evidence price but do not become appraisal or index conclusions.",
        "source_refs": [
          "SRC-006",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Asset, Liability, Product, Service and Right",
        "distinction": "The valued subject and interest retain external identity, physical or legal properties and lifecycle while this model owns only the scoped value assertion.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Currency and Exchange Rate",
        "distinction": "Currency codes and rate observations are external masters; a derived conversion retains original amount, rate binding, time, direction and rounding.",
        "source_refs": [
          "SRC-008",
          "SRC-010"
        ]
      },
      {
