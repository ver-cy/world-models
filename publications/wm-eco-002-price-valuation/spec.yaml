    "dimension": {
      "owner_package_requirements": [
        "Declare the Dimension owner, price-observation authority, valuation authority, statistical compiler, semantic steward and disclosure authority.",
        "Declare subject or asset, contract, offer, transaction, invoice, payment, currency, market, statistics, dataset, document and party master systems.",
        "Publish model, object, event, relation, classification, access, retention, assurance and interoperability registries.",
        "Pin valuation basis, asset class, jurisdiction, price-index, currency, confidentiality and exchange profiles."
      ],
      "namespace_guidance": "Mint value-assertion identifiers only in the adopting Dimension's governed namespace; preserve asset, offer, transaction, invoice, payment, IVS, IFRS, SDMX, GS1 and currency identifiers as typed references with authority, version and time.",
      "registry_links": [
        "https://ver.cy/models/",
        "https://ver.cy/model-agent-protocol.md",
        "Dimension-local subject, value assertion, market, currency, statistics, access and provenance registries"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Canonicalize by registry ID, model version, value-assertion master ID, immutable revision and explicit authority; never use subject name, numeric amount, date, report filename or hash alone as identity.",
        "Keep observed, requested, agreed, invoiced, paid, accounting, appraised, modelled and indexed values distinct and preserve corrected, superseded or withdrawn revisions."
      ],
      "patch_rules": [
        "Additive extensions use a Dimension-owned namespace and declare target node, assertion family, subject profile, basis, source, method, rationale, access and interoperability impact.",
        "Breaking changes require a new version, migration and crosswalk maps, compatibility declaration and continued resolution of prior assertion revisions."
      ],
      "compatibility_rules": [
        "Consumers may ignore unknown additive fields only when assertion identity, subject, interest, quantity, unit, time, basis, method, provenance and access meaning remain intact.",
        "IVS, IFRS, SDMX, GS1 and partner mappings pin source and target versions and declare transformed, omitted or non-round-trippable values."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative valuation or price master-system identifier and immutable revision identifier.",
        "Governed globally resolvable value-assertion or index-observation IRI.",
        "Adopting-Dimension UUID or ULID when no authoritative external identifier exists."
      ],
      "timestamp_rule": "Record event timestamps in RFC 3339 with seconds and an explicit UTC offset or Z; keep effective, observation, inspection, valuation, release, conversion and ingestion times distinct.",
      "serial_naming_rule": "Name serial artifacts as {assertion-id}--{artifact-kind}--{revision-or-event-id}; never use a subject name, amount, date, filename or hash alone as assertion identity.",
      "integrity_rule": "Store digest, media type, byte length, issuer, source and method versions, currency or unit, effective time, provenance, assurance and access marking for every retained serial artifact."
    },
    "policies": [
      "The adopting Dimension declares who may observe, appraise, calculate, review, correct, convert, disclose, rely on, supersede, withdraw, retain and tombstone value assertions.",
      "Every value requires assertion family, subject or basket, interest, quantity, currency or unit, context, effective time, source, method, status, uncertainty and revision lineage as applicable.",
      "Agents never infer transaction completion, accounting recognition, market value, fair value, appraisal compliance, cost of living or inflation from a bare amount or index movement.",
      "Offers, transactions, invoices, payments, contracts, subjects, currencies, statistics, datasets and documents remain in their owning systems and are referenced.",
      "Automated agents may append low-risk observations and derived projections under delegation but consequential valuation, reliance, disclosure, withdrawal and irreversible use decisions default to proposal or confirmation."
    ],
