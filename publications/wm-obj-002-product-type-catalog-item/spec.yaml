  "functions": [
    {
      "id": "register-product-type",
      "name": "Register product type",
      "description": "Create a governed product type record with exactly one authoritative identity anchor, a declared granularity and an initial lifecycle state.",
      "inputs": [
        "proposed identifier scheme and value or a request to assign an internal identifier",
        "authoritative party reference",
        "initial classification assignment",
        "target market scope"
      ],
      "outputs": [
        "persisted product type master record",
        "assigned authoritative identifier",
        "record version identifier",
        "creation and identifier-assignment timestamps"
      ],
      "preconditions": [
        "the requesting party holds or can evidence authority to allocate under the chosen scheme",
        "no existing record already claims the same authoritative identifier",
        "the type does not duplicate an existing record under a different key"
      ],
      "effects": [
        "a new type identity becomes permanently allocated and enters the non-reuse regime",
        "downstream consumers can resolve the identifier to a record",
        "an entry is written to the identifier change decision log"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-006",
        "SRC-009"
      ]
    },
    {
      "id": "evaluate-identity-change-rule",
      "name": "Evaluate identity change rule",
      "description": "Decide whether a proposed modification requires allocation of a new type identifier or may be applied as a revision of the existing record.",
      "inputs": [
        "proposed attribute changes",
        "current record version",
        "applicable rule set identifier and version",
        "target markets affected"
      ],
      "outputs": [
        "decision outcome (new identifier | revision)",
        "cited rule references",
        "recommended change effective date",
        "decision log entry"
      ],
      "preconditions": [
        "the applicable rule set and its version are resolvable",
        "the affected attributes are classified as declared or descriptive"
      ],
      "effects": [
        "either a successor type registration is triggered or a change set is opened",
        "trading partners can be notified with an authoritative rationale"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-006"
      ]
    },
    {
      "id": "classify-product-type",
      "name": "Classify product type",
      "description": "Assign or update classification codes in one or more external schemes, recording scheme version, basis and effective dates.",
