      {
        "id": "interoperability-and-projection",
        "name": "Interoperability and Projection",
        "description": "How the type record is carried, resolved and exchanged across systems and standards without changing its semantics.",
        "rationale": "GS1 Digital Link defines a normative way to express type identity in web URIs; GDSN, AAS submodels, schema.org and passport formats are alternative projections of the same type-level facts. Keeping projection separate from semantics is required by the format-neutrality rule.",
        "source_refs": [
          "SRC-004",
          "SRC-009",
          "SRC-011",
          "SRC-001",
          "SRC-008"
        ],
        "layers": [
          {
            "id": "carriers-resolution-and-exchange",
            "name": "Carriers, Resolution and Exchange",
            "description": "Physical and digital carriers of type identity, their resolution behaviour, and the profiles used to exchange the record.",
            "source_refs": [
              "SRC-004",
              "SRC-008",
              "SRC-009",
              "SRC-011",
              "SRC-001"
            ],
            "findings": [
              {
                "id": "data-carrier-and-web-resolution",
                "name": "Data carrier encoding and web resolution",
                "description": "Type identity is carried on product and packaging by barcodes, QR codes or RFID and, increasingly, by a web URI. GS1 Digital Link normalises GTINs to 14 digits in the URI path and appends key qualifiers for variant, lot and serial, while explicitly warning that applications must not assume such a URI points to a resolver. Passport regimes require the carrier to lead to the passport.",
                "source_refs": [
                  "SRC-004",
                  "SRC-008"
                ],
                "questions": [
                  {
                    "id": "q-carrier-types",
                    "text": "Which data carriers encode this type's identity, on which packaging levels, and with which encoded content?",
                    "kind": "interoperability",
                    "answer_data": [
                      "carrier type code",
                      "packaging level",
                      "encoded content string",
                      "encoding standard and version"
                    ]
                  },
                  {
                    "id": "q-uri-construction",
                    "text": "How is the web URI for this type constructed, including qualifier ordering and identifier normalisation?",
                    "kind": "interoperability",
                    "answer_data": [
                      "URI template",
                      "normalisation rule",
                      "qualifier order",
                      "domain and path ownership"
                    ]
                  },
                  {
                    "id": "q-resolution-behaviour",
                    "text": "What does the URI resolve to for each requesting role and link type, and who operates the resolver?",
                    "kind": "access",
                    "answer_data": [
                      "link type identifiers",
                      "target resource per link type and role",
                      "resolver operator reference",
                      "availability commitment"
                    ]
                  },
                  {
                    "id": "q-carrier-change",
                    "text": "When the carrier or its encoded content changes, how are in-market goods with the previous carrier handled?",
                    "kind": "lifecycle",
                    "answer_data": [
                      "carrier change effective date",
                      "coexistence period",
                      "backward compatibility statement",
                      "affected packaging levels"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "data-carrier",
                    "name": "dataCarrier",
                    "description": "Carrier of the type identity with carrier type, packaging level and encoded content.",
                    "value_kind": "object",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-004",
                      "SRC-008"
                    ]
                  },
                  {
                    "id": "digital-link-uri",
