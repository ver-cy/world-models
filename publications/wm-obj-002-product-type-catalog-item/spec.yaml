                "description": "A product type must resolve to exactly one authoritative identity within a stated scheme. GS1 issues a GTIN under a licensed company prefix for a trade item; UNTP carries a resolvable id plus idScheme and modelNumber at model granularity; medical device regimes issue a Basic UDI-DI as the model-level identifier above the trade-item Device Identifier. Where no external authority applies, the adopting Dimension assigns a UUID or ULID, never a date or a name.",
