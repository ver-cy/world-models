        "scheme identifier and version",
        "candidate code",
        "assignment basis",
        "assigning party"
      ],
      "outputs": [
        "classification assignment record",
        "primary classification designation",
        "review due date for provisional assignments"
      ],
      "preconditions": [
        "the scheme release is resolvable and not withdrawn",
        "the code exists in the stated scheme release"
      ],
      "effects": [
        "mandatory attribute sets implied by the classification become applicable",
        "validation and completeness scoring are recalculated"
      ],
      "source_refs": [
        "SRC-007",
        "SRC-013",
        "SRC-014",
        "SRC-009"
      ]
    },
    {
