      "Definitional conflict: a GS1 trade item is defined commercially (anything priced, ordered or invoiced), whereas an ESPR product model is defined technically (units sharing the technical characteristics relevant to ecodesign requirements). The two do not partition the same population, so one commercial type may span several regulatory models or vice versa.",
      "Classification non-alignment: GPC bricks, UNSPSC commodities, ECLASS/IEC CDD classes and HS subheadings are independently governed with different granularity and revision cycles, and no authoritative bidirectional crosswalk exists; concurrent assignment with a declared primary is the only defensible treatment.",
