  "model": {
    "registry_id": "vr.wm-obj-002",
    "model_id": "WM-OBJ-002",
    "name": "Product Type / Catalog Item",
    "entry_kind": "classifier",
    "purpose": "Provide the governed, format-neutral context an AI agent needs to understand, create, inspect and operate a product type (catalog item): the type-level abstraction that carries stable identity, classification, declared specification, variant structure, packaging form, lifecycle and compliance data, and that classifies the physical item instances produced or sold under it.",
    "scope_statement": "This model covers the TYPE level of a product: a governed record describing a class of goods (or catalogable service/software offering) whose members share the declared identity, technical characteristics and commercial description. It is the level identified by a GTIN under GS1 trade-item rules, by 'product model' under EU ESPR, by 'model' granularity in UNECE UNTP, by a Device Identifier / Basic UDI-DI in medical device regimes, and by schema.org ProductModel / ProductGroup. It explicitly excludes the individual instance (serial), the production batch/lot, and the commercial offer (price, availability, terms). It is storage- and interface-neutral: JSON, YAML, Markdown, HTML, Git, MCP and MongoDB are projections of this semantics, not part of it.",
    "in_scope": [
      "Type-level identity anchors and identifier schemes (GTIN, MPN, model number, Basic UDI-DI, internal catalog key) and their allocation, change and non-reuse rules",
      "Designation, brand, multilingual names and marketing/technical descriptions of the type",
      "Classification against commercial, technical and regulatory taxonomies (GPC, UNSPSC, ECLASS/IEC CDD, HS/CN, risk classes)",
      "Declared characteristics bound to property dictionaries, with units, tolerances and measurement conditions",
      "Variant structure: variant axes, product groups, consumer product variants, and the boundary at which a variant becomes a distinct type",
      "Packaging-level type hierarchy (each/inner pack/case/pallet type), net content, dimensions and weights",
      "Type-level composition references: component types, materials, substances of concern",
      "Inter-type relationships: accessory, spare part, consumable, compatibility, predecessor/successor, substitution",
      "Lifecycle states, specification change control, record versioning, discontinuation and post-market obligations",
      "Market and temporal applicability: target markets, jurisdictions, effective and validity dating",
      "Type-level compliance: responsible economic operator, conformity claims, certifications, markings, model-level digital product passport data",
      "Stewardship, authority, attribute-level provenance, data quality and validation of the type record",
      "Interoperability: data carriers, web resolution, syndication profiles and crosswalk mappings"
    ],
    "out_of_scope": [
      "Individual serialised item instances, their serial numbers, condition and custody (WM-OBJ-001)",
      "Production batches, lots and manufacturing runs, and batch-level passports",
      "Offers: price, currency, availability, sales channel, delivery terms and contract conditions",
      "Inventory positions, stock levels, warehouse and shelf locations",
      "The internal structure and effectivity logic of the engineering bill of material (WM-OBJ-019)",
      "Governance of the classification schemes themselves (GPC, UNSPSC, ECLASS, HS are external registries)",
      "Party and organisation master data (brand owner, manufacturer, notified body) beyond referencing roles",
      "Facility and site master data beyond referencing production locations",
      "Supply chain traceability events and chain-of-custody records",
      "Substance and material master data as substances (regulatory substance lists, CAS entries)",
      "Document lifecycle and content management of referenced media beyond reference and applicability",
      "Demand forecasting, planning parameters, costing and profitability attributes"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-OBJ-001 Item Instance",
        "distinction": "The type is a class with an identity that is allocated once and never reused; the instance is an individual with a serial or production identifier. Regulators separate these explicitly: a UDI has a fixed Device Identifier (type/model) and a variable Production Identifier (lot, serial, expiry), and UNTP marks the difference with idGranularity model vs item.",
        "source_refs": [
          "SRC-009",
          "SRC-015",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Batch / Lot",
        "distinction": "A batch is a subset of one model produced under shared conditions. It is neither the type nor a single instance and is carried in GS1 Digital Link as the lot (10) key qualifier and in UNTP as idGranularity 'batch'. Batch-specific values (actual measured content, production date) must not be asserted on the type record.",
        "source_refs": [
          "SRC-004",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Offer / Price",
        "distinction": "schema.org separates Product from Offer, and states that a ProductGroup itself is not directly offered for sale. Price, availability, seller and terms belong to the offer model; only whether an attribute is 'declared' (e.g. price-on-pack, which triggers a new GTIN) touches the type record.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-005"
        ]
      },
      {
        "neighbor": "WM-OBJ-019 Engineering Bill of Material",
        "distinction": "The BOM composes component types into an assembly; it owns quantities, positions, effectivity and alternates. The product type owns only the reference to its governing BOM and any summarised composition needed for compliance (materials, substances of concern).",
        "source_refs": [
          "SRC-011",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Classification scheme registry",
        "distinction": "GPC bricks, UNSPSC commodities, ECLASS/IEC CDD classes and HS subheadings are externally governed registries with their own versioning. This model records the assignment (code, scheme, scheme version, assigning authority, confidence), never the taxonomy content.",
        "source_refs": [
          "SRC-007",
          "SRC-010",
          "SRC-013",
          "SRC-014"
        ]
      },
      {
        "neighbor": "Packaging / logistics unit",
        "distinction": "GS1 treats each, case and pallet as separate trade items with their own GTINs, but a grouping made only for transport or storage is a logistics unit identified by an SSCC, not a trade item. Logistics units are instances and are out of scope.",
        "source_refs": [
          "SRC-006",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Service and software catalog items",
        "distinction": "GS1 defines a trade item as any item, product or service, that may be priced, ordered or invoiced, so non-physical catalog items are legitimately in scope for identity and classification, but the physical-form findings (packaging, net content, dimensions) are not applicable to them and must be omitted rather than defaulted.",
        "source_refs": [
          "SRC-006",
          "SRC-014"
        ]
      },
      {
        "neighbor": "Party / Organization",
        "distinction": "Brand owner, manufacturer, information provider and responsible economic operator are roles held by parties; the model carries role-scoped references and the party's registered identifier, not the party master record itself. UNTP models this as relatedParty with a defined role.",
        "source_refs": [
          "SRC-009",
          "SRC-011",
          "SRC-008"
        ]
      }
    ]
  },
