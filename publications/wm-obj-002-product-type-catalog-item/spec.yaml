                  }
                ],
                "inline_only_rationale": null
              },
              {
                "id": "exchange-profiles-and-crosswalks",
                "name": "Exchange profiles and crosswalk mappings",
                "description": "The same type record is projected into several external shapes: trade-item data pools, industrial asset submodels, web vocabulary markup and passport credentials. Each projection is lossy in a different direction, so mappings must be recorded explicitly with their gaps and the conflicts they cannot reconcile, and conformance must not be claimed without evidence.",
                "source_refs": [
                  "SRC-009",
