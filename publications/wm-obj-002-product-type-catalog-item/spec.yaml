            "findings": [
              {
                "id": "attribute-provenance-and-time",
                "name": "Attribute-level provenance and dual timestamps",
                "description": "Because a catalog item record aggregates contributions from manufacturers, distributors, laboratories and scraped sources, provenance must be recorded per assertion: who asserted it, from which source system, by what method, and at which event and ingestion times. Recording only a record-level 'last updated' destroys the ability to assess trust.",
                "source_refs": [
                  "SRC-009",
                  "SRC-012",
                  "SRC-010"
                ],
                "questions": [
                  {
                    "id": "q-assertion-origin",
                    "text": "For each asserted value, which party and source system supplied it and by what acquisition method?",
                    "kind": "provenance",
                    "answer_data": [
                      "asserting party reference",
                      "source system identifier",
                      "acquisition method code (declared | measured | derived | inferred | extracted)",
                      "source document reference"
                    ]
                  },
                  {
                    "id": "q-dual-timestamps",
                    "text": "Are event time and ingestion time both retained for each assertion, with explicit offsets?",
                    "kind": "temporal",
                    "answer_data": [
                      "event timestamp (RFC 3339)",
                      "ingestion timestamp (RFC 3339)",
                      "offset handling policy"
                    ]
                  },
                  {
                    "id": "q-derived-values",
                    "text": "Which values are derived or inferred rather than asserted, and what is the derivation rule and its inputs?",
                    "kind": "provenance",
                    "answer_data": [
                      "derived attribute reference",
                      "derivation rule identifier and version",
                      "input attribute references",
                      "recomputation trigger"
                    ]
                  },
                  {
                    "id": "q-source-trust",
                    "text": "What trust level is assigned to each source, and how does it affect precedence and publication?",
                    "kind": "quality",
                    "answer_data": [
                      "source trust level",
                      "assignment rationale",
                      "effect on precedence",
                      "review date"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "assertion-provenance",
                    "name": "assertionProvenance",
                    "description": "Per-assertion provenance record with party, source system, method and dual timestamps.",
                    "value_kind": "object",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-009",
                      "SRC-012"
                    ]
                  },
                  {
                    "id": "acquisition-method",
                    "name": "acquisitionMethod",
                    "description": "Coded method by which a value was obtained.",
                    "value_kind": "code",
                    "cardinality": "0..n",
                    "required": false,
