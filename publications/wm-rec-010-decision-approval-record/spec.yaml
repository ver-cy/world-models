  "composition": [
    {
      "target": "WM-REC-001",
      "relation": "EXTEND",
      "purpose": "WM-REC-010 is a specialisation of the generic record. The parent owns record characteristics, custody, format, preservation and baseline metadata; this model adds only decision-specific authority, outcome, reasons, validity and supersession semantics and must not restate parent mechanics.",
      "required": true,
      "source_refs": [
        "SRC-002",
        "SRC-011"
      ]
    },
    {
      "target": "WM-ACT-025",
      "relation": "REFERENCE",
      "purpose": "A meeting may produce decision records. The link is optional in both directions because Delaware §141(f) unanimous written consent and delegated sign-offs produce decisions with no meeting at all. Attendance, agenda and full minutes stay in the meeting model; only the occasion reference, agenda item and quorum/vote result attach here.",
      "required": false,
      "source_refs": [
        "SRC-010",
        "SRC-004"
      ]
    },
    {
      "target": "WM-POL-017",
      "relation": "COMPOSE",
      "purpose": "An administrative case ends or changes state through decisions. The case model owns the procedure and its state; this model owns each decision within it. One case may compose many decisions of different procedural stages, and one decision may close or alter several cases.",
      "required": false,
      "source_refs": [
        "SRC-004",
        "SRC-007"
      ]
    },
    {
      "target": "Party / agent master-data model (sibling candidate, model ID not yet registered)",
      "relation": "REFERENCE",
      "purpose": "Deciders, approvers, dissenters, addressees and affected parties must resolve to governed party identifiers rather than being named inline, so that authority, delegation and conflicts can be verified against master data.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-010"
      ]
    },
    {
      "target": "Policy, rule and mandate model (sibling candidate, model ID not yet registered)",
      "relation": "REFERENCE",
      "purpose": "The authority basis, the rules applied and the machine policy sets evaluated are cited at a specific in-force version. Their normative content belongs to the policy model; this model records only which version was relied upon and to what effect.",
      "required": true,
      "source_refs": [
        "SRC-003",
        "SRC-007",
        "SRC-010"
      ]
    },
    {
      "target": "Electronic signature, seal and time-stamp evidence model (sibling candidate, model ID not yet registered)",
      "relation": "MIX-IN",
      "purpose": "Attestation evidence is mixed in rather than owned: this model holds references, coverage statements and verification verdicts, while the cryptographic object model, trust anchors and long-term validation material live in the evidence model.",
      "required": false,
      "source_refs": [
        "SRC-012",
        "SRC-002"
      ]
    },
    {
      "target": "Retention schedule and disposition authority model (sibling candidate, model ID not yet registered)",
      "relation": "REFERENCE",
      "purpose": "Retention periods, disposition outcomes and appraisal criteria are jurisdiction-specific and change independently of decisions. This model references a schedule item and records the resolved trigger, never embedding a period.",
      "required": true,
      "source_refs": [
        "SRC-011",
        "SRC-017",
        "SRC-002"
      ]
    },
    {
      "target": "W3C PROV-O (http://www.w3.org/ns/prov#)",
      "relation": "ALIGN",
      "purpose": "Alignment only. The decision act maps to prov:Activity, deciders and systems to prov:Agent, the record to prov:Entity, roles to a qualified prov:Association with prov:hadRole, delegation to prov:actedOnBehalfOf, supersession to prov:wasDerivedFrom and cessation of effect to prov:wasInvalidatedBy. PROV has no native concept of competence, quorum or validity window, so the alignment is partial.",
      "required": false,
      "source_refs": [
        "SRC-001"
      ]
    },
    {
      "target": "OASIS XACML 3.0 Result vocabulary",
      "relation": "ALIGN",
      "purpose": "Alignment only, for retained machine authorization decisions: Decision, Status, Obligations, AssociatedAdvice and PolicyIdentifierList map onto outcome, status detail, obligations, advisory items and applied policy identifiers. Permit/Deny must not be equated with a reasoned grant or refusal, and NotApplicable has no administrative equivalent.",
      "required": false,
      "source_refs": [
        "SRC-003"
      ]
    },
    {
      "target": "ECLI (European Case Law Identifier) and OASIS Akoma Ntoso v1.0",
      "relation": "ALIGN",
      "purpose": "Alignment for judicial and legislative decisions: ECLI supplies a governed global identifier for the decision as a work; Akoma Ntoso supplies the Work/Expression/Manifestation/Item identity levels and the judgment structure. Neither is imposed on administrative or corporate decisions.",
      "required": false,
      "source_refs": [
        "SRC-006",
        "SRC-009"
      ]
    },
    {
      "target": "DCMI Metadata Terms (http://purl.org/dc/terms/)",
      "relation": "ALIGN",
      "purpose": "Alignment for the temporal and supersession vocabulary: valid, issued, created, modified, dateAccepted, replaces, isReplacedBy, provenance, accessRights and conformsTo. Adopted because these terms keep validity, issuance and modification separate, which a single decision date collapses.",
      "required": false,
      "source_refs": [
        "SRC-008"
      ]
    },
    {
      "target": "ISO/IEC/IEEE 42010:2022 architecture decision and rationale",
      "relation": "ALIGN",
      "purpose": "Alignment for design-governance decisions, where a decision pertains to concerns, affects description elements and carries rationale covering alternatives not chosen. Used to justify the options-considered and reasons findings as a general pattern, not to import architecture description structure.",
      "required": false,
      "source_refs": [
        "SRC-016"
      ]
    }
  ],
  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "The adopting Dimension must name a single accountable record owner for each decision series and a records-management authority empowered to approve disposition; ownership of a decision record must not default to the system that stores it.",
        "The Dimension must publish, per decision family, the authority basis, the quorum and majority rules, the delegation thresholds and the disposition authority in force, each with an effective period, so that a decision can be validated against the rules that applied at its own decision time rather than today's rules.",
        "The Dimension must declare which identifier scheme is authoritative for each decision family, which governed global schemes it participates in, and the fallback minting rule, before any record is created.",
        "The Dimension must state which decision families are subject to a duty to give reasons, a duty to publish and a duty to serve, with the instrument imposing each, and must not assume these duties are universal.",
        "The Dimension must define the canonical form used for digest computation and the re-verification interval for attestation evidence."
      ],
      "namespace_guidance": "Use a stable, resolvable namespace under the Dimension's own authority for locally minted decision identifiers, distinct from the namespaces of any governed global scheme it also uses. Never mint values inside an external scheme's namespace. Keep the decision work identifier, the expression discriminator and the record object identifier in separate namespace segments so that corrections and translations never collide with the abstract decision. Do not encode dates, statuses or organisational names into identifier strings; where an inherited scheme already does so, treat those components as opaque and never parse them as data.",
      "registry_links": [
        "Decision family vocabulary with per-family handling rules, maintained as a versioned registry entry",
        "Outcome and non-outcome vocabulary, including deferral, withdrawal, no quorum and unable-to-determine values",
        "Status enumeration and permitted transition table with per-transition authorised roles",
        "Authority basis register linking each decision family to its conferring instruments at versioned effective periods",
        "Delegation register with thresholds, reserved matters and effective periods",
        "Disposition authority register linking decision families to retention triggers and outcomes",
        "External scheme and vocabulary mapping registry with version, lossiness notes and conflict records"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Serialise all time values as RFC 3339 timestamps with seconds and an explicit numeric offset or Z; use -00:00 only to mean UTC with an unknown local offset, never as a synonym for Z.",
        "Normalise identifiers to their canonical scheme form, preserve case where the governing scheme is case-sensitive, and record aliases in a separate ordered list rather than rewriting the canonical value.",
        "Fix the element order and encoding of the canonical form before computing any digest, and record the canonicalisation profile identifier alongside the digest so a later verifier can reproduce it.",
        "Declare digest coverage explicitly: state whether reasons, annexes, evidence manifests and attachments are inside or outside the hashed content.",
        "Normalise references to external instruments as identifier plus version or point-in-time discriminator; a bare reference without a version is invalid for authority basis and applied policy elements."
      ],
      "patch_rules": [
        "Content that has passed the fixity point is never patched in place. A correction creates a new expression under the same work identifier; a substantive change creates a superseding decision with its own identifier.",
