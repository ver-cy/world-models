    "known_omissions": [
      "The full normative texts of ISO 15489-1:2016, ISO/IEC/IEEE 42010:2022 and the ISO 23081 metadata series were not inspected; iso.org returned HTTP 403 to automated retrieval. Claims attributed to them are at catalogue, abstract and secondary-summary level and should be re-verified against purchased copies before any conformance statement.",
      "EUR-Lex could not be retrieved during this research. The eIDAS Regulation (EU) No 910/2014 was therefore not consulted at all, and the GDPR and the AI Act were consulted through an unofficial reproduction and an official Commission overview page rather than the Official Journal text. No electronic-signature assurance tier, seal semantics or article-level AI Act obligation is asserted on that basis.",
      "Sector-specific approval regimes — medicines and device authorisation, building and environmental permits, credit and underwriting decisions, research-ethics approvals, export licensing, clinical treatment decisions — are covered only by the generic structure. Each is likely to add mandatory elements this model does not name.",
      "Voting mechanics are modelled generically. Weighted voting, qualified majority with population thresholds, consensus and objection-based procedures, ranked and multi-round ballots, and proxy or alternate voting are not individually represented.",
      "Multilingual authentic-text divergence is handled only through expression identity; no rule is given for resolving substantive conflict between equally authentic language versions.",
      "Long-term preservation of validation data for attestation evidence — archival time-stamps, revocation information, cryptographic agility over decades — is referenced but not modelled.",
      "Group, class-action and collective decisions with many co-equal deciders across organisations are representable but were not stress-tested against a real instrument.",
      "No retention period, challenge deadline or quorum threshold is asserted as a value anywhere in the model; all are referenced to instruments that the adopting Dimension must supply.",
      "eIDAS/ETSI qualified electronic signatures and trust-service evidence profiles were not fetched and are not specified.",
      "GDPR Article 22 and other automated individual-decision rights regimes were not fetched; software-agent deciders are modelled only via PROV Agent.",
      "Corporate board-resolution statutes, company-law filing numbers and notarisation practices are not in the source set.",
      "Maker-checker or SOX/COSO dual-control is asked as a local policy question, not as a normative requirement.",
      "Akoma Ntoso, LegalDocML and judicial-opinion structure are excluded; court orders may still instantiate this record.",
      "ISO 9001 documented-information controls and ISO 30300 vocabulary were not fetched as primary texts.",
      "ISO 15489-1:2016 full clause text is paywalled; characteristics are taken from ISO 23081 TC46/SC11 and the official 2016 abstract, with DCC 2007 as secondary and version-lagged.",
      "Clinical, safety-case and financial-trade approval specialisations are not modelled."
