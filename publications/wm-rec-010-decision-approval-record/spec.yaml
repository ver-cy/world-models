    "conflicts": [
      "XACML's four decision values do not map cleanly onto administrative or judicial outcomes. Deny is an enforcement result rather than a reasoned refusal, and NotApplicable has no administrative equivalent. Recorded as an alignment with declared loss; the model does not adopt the XACML vocabulary as canonical.",
      "ECLI's year component is the year the judgment was rendered, while DCMI issued is the date of formal issuance. These routinely differ. Treating the identifier as a source of dates would produce systematically wrong deadlines, so identifier components are declared opaque.",
      "Akoma Ntoso's judgment structure of introduction, background, motivation and decision is judicial. Administrative notices, board resolutions and machine authorization results do not share it and must not be forced into it; the model therefore adopts the FRBR identity levels but not the body structure.",
      "PROV-O can attribute an activity to responsible agents but has no concept of competence, quorum, majority or validity window. Provenance alignment alone cannot establish that a decision was validly taken.",
      "Delaware §141(f) makes action without a meeting effective when the last consent is delivered, or on a stated later date up to sixty days out. A model assuming decision time equals meeting date is wrong for this entire class, which is why decided_at is derived rather than copied from an occasion.",
      "GDPR Article 22 and the AI Act overlap without coinciding. Article 29 Working Party guidance indicates that nominal human sign-off does not necessarily remove solely-automated status, while AI Act human-oversight duties attach to system risk classification rather than to the individual decision. The model records mode and oversight adequacy separately rather than collapsing them.",
      "Records standards require records to be fixed and unalterable, yet decisions frequently need correction. The model resolves this by forbidding in-place edits and requiring a new expression or a superseding decision, but this conflicts with common practice in systems that silently overwrite approval records.",
      "Approval and decision are used interchangeably in practice but are not equivalent. Here an approval is either an outcome value or a participation act. Systems that treat a signature as constituting rather than evidencing the decision will disagree with this model about when the decision occurred.",
      "MADR documents a YYYY-MM-DD last-updated date, which is coarser than the required RFC 3339 event and ingestion timestamps and must be treated as a projection.",
      "Nygard/MADR practice treats accepted decisions as immutable and superseded rather than edited; some administrative systems amend orders in place. This model prefers succession and records in-place amendment as a compatibility exception.",
      "APA § 557 mandates findings, conclusions, reasons and rulings on exceptions for covered hearings; MADR treats drivers, confirmation and option trade-offs as optional. Neither profile is universal.",
      "OMG DMN models executable repeatable logic; ADR and APA model instance records. Merging them would falsify both.",
      "DCC briefing describes ISO 15489:2001 and DIRKS; ISO 15489-1:2016 is the current standard and de-emphasises that methodology. Process names from DCC are secondary only.",
      "APA public-record and Congressional-access rules are US-specific and conflict with a default need-to-know private-sector posture."
    ],
    "regional_assumptions": [
      "ECLI applies to participating European jurisdictions and does not exist elsewhere; the identity priority degrades to master-system identifier then Dimension-minted identifier outside its scope.",
      "Charter of Fundamental Rights Article 41 binds Union institutions, bodies, offices and agencies. Member State authorities' duty to give reasons arises from national law and general principles, not directly from Article 41, so the duty must be cited per jurisdiction.",
      "5 U.S.C. §557 governs formal adjudication by United States federal agencies only. Its findings-and-reasons requirement is not a general rule of administrative law and is not assumed elsewhere.",
      "Delaware General Corporation Law §141 is the law of one United States state. Quorum floors, committee limits, remote-presence rules and the sixty-day consent window vary by jurisdiction and by corporate form and are cited as a verified counterexample source rather than as a default.",
      "NARA's Universal ERM Requirements apply to United States federal agencies. They are used as a lifecycle requirement pattern, not as a retention schedule for any other jurisdiction.",
      "MoReq2010 originates in a European context and its development was discontinued after 2018; it is treated as a stable reference rather than a current obligation.",
      "Qualified electronic signature and seal frameworks are assumed to be jurisdiction-specific. Because the eIDAS text was not retrievable, the model deliberately asserts no assurance-tier vocabulary and relies on RFC 3161 for the time-attestation semantics only.",
      "Non-Western and customary decision-making traditions, and consensus-based or non-adversarial procedures, were not researched; the model's quorum-and-majority orientation may be a poor fit for them.",
      "Adjudicative grades, ex parte docketing and emergency omission of recommended decisions are taken from US APA § 557 and do not automatically apply outside US formal adjudication.",
      "Public-records disclosure overlays (FOIA and analogues) are jurisdiction-specific; DCMI accessRights is the generic hook.",
      "ADR/MADR status vocabularies originate in software-engineering practice and are not legal status codes.",
