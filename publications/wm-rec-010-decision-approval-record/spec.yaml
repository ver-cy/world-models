    "adversarial_checks": [
      "Sought counterexamples to a required meeting. Delaware §141(f) unanimous written or electronic consent, and single-officer delegated sign-offs, produce valid decisions with no meeting and no vote. The occasion link was therefore made optional in both directions and decided_at was made a derived value with its own effectiveness rule rather than a copy of a meeting date.",
      "Sought counterexamples to a universal duty to give reasons. Many corporate resolutions, and effectively all machine authorization results, carry no statement of reasons, and Charter Article 41(2)(c) binds Union institutions rather than every decision-maker. The reasons element was therefore made conditional with a mandatory duty-basis citation, rather than required by default.",
      "Tested and rejected a single decision_date field. It cannot express delayed effectiveness under written consent, the gap between issuance and service that starts challenge clocks, retroactive effect, or the separation of event time from ingestion time required by RFC 3339 practice and PROV. It was replaced with an explicit multi-event timeline plus a separate validity window.",
      "Tested and rejected adopting XACML Permit/Deny/NotApplicable/Indeterminate as the canonical outcome vocabulary. It is attractive because it is normative and machine-clean, but it cannot express grant-with-conditions, partial grant, deferral or withdrawal, and NotApplicable has no administrative meaning. It was demoted to an alignment with a recorded conflict.",
      "Tested whether Approval deserves a separate sibling model. Rejected for now because the cited sources give approval acts no independent identity — they are outcome values or participation events. Flagged in the boundary notes because standing authorisations such as licences and permits do have independent holders and validity and may need their own model; this is recorded as an open boundary rather than resolved by assertion.",
      "Checked for duplication against the parent record model. Record characteristics, custody, format and preservation were removed from the findings and expressed only as an EXTEND link to WM-REC-001, so that the model adds decision-specific semantics rather than restating generic record mechanics.",
      "Probed whether a human sign-off on a machine result can be assumed to make a decision non-automated. Article 29 Working Party guidance indicates it cannot without evidence of authority, competence and actual consideration, so the model records a nominal-review finding rather than silently upgrading the classification.",
      "Probed the retention trigger assumption. Anchoring retention to record creation would destroy long-validity decisions such as permits while they are still in force, so the trigger was modelled as an explicit choice among creation, issuance, expiry of validity, exhaustion of challenge routes and case closure, with the resolved trigger timestamp stored.",
      "Checked whether any node lacks primary support. Every bundle, layer, finding, function and composition link carries at least one primary source reference except the two ISO-derived alignments and the security dimension, which are marked as evidence gaps in known_omissions and in the checklist rather than presented as canonical.",
      "Could this model be collapsed into WM-REC-001? No: parent recordhood is insufficient without outcome, rationale, approver and validity, which are the stated purpose of WM-REC-010.",
      "Could this model absorb DMN? No: DMN is reusable executable logic; this record is an authorised instance. Absorption would hide the approver and validity surface.",
      "Does unioning APA orders and lightweight ADRs over-claim a single type? The union is defensible at the instance-record layer (one outcome, reasons, agents, status, effect) if grades and mandatory findings remain optional-when-not-applicable rather than always required.",
      "Would treating minutes as the decision record lose citability? Yes; meetings may contain many motions. The decision record must be separable, which matches the WM-ACT-025 CONTAINS relation.",
      "Does allowing software agents as PROV Agents silently erase human accountability? The model requires explicit attribution of a responsible human or organisation when a system produced the outcome.",
      "Is oral-only approval a record? Not until captured; the oral-first flag records a completeness gap rather than inventing a contemporaneous instrument."
    ]
