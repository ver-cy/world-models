  "model": {
    "registry_id": "vr.wm-rec-010",
    "model_id": "WM-REC-010",
    "name": "Decision / Approval Record",
    "entry_kind": "entity",
    "purpose": "Provide the format-neutral context an agent needs to identify, create, interpret, validate and operate an authoritative record of a decision or approval: what was decided, on what question, by whom under what authority, on what reasons and evidence, with what conditions, from when until when it is valid, and how it is superseded, challenged, disclosed and retained.",
    "scope_statement": "The model covers the record that constitutes or evidences a discrete decision or approval act and the act's decision-relevant attributes. It treats the decision act and the record of it as distinct but co-modelled: the act supplies authority, outcome, reasons and timing; the record supplies identity, versioned expression, integrity evidence, disclosure and disposition. It spans administrative decisions, judicial judgments, corporate and board resolutions, delegated sign-offs, gate/change approvals and retained machine authorization decisions. It excludes the deliberative occasion, the containing case or procedure, the norms applied, party master data and generic record custody mechanics, which belong to sibling or parent models.",
    "in_scope": [
      "Decision identity, versioned expression identity and classification of decision or approval type",
      "Decided question, outcome/disposition, attached conditions, obligations and advice",
      "Statement of reasons, alternatives considered and rejected, evidence and findings of fact relied on",
      "Decision authority, legal or constitutional basis, delegation, approval limits, quorum and voting",
      "Approval participation acts, dissent, abstention, recusal and conflict-of-interest declarations",
      "Attestation evidence: signature, seal, trusted time-stamp token, hash and finality of the record",
      "Distinct decision-relevant times: taken, consented, issued, served, published, in force, recorded",
      "Validity window, retroactivity, conditions of validity, expiry and renewal",
      "Status model, finality, supersession, amendment, corrigendum, revocation and annulment",
      "Challenge, appeal, review outcome and suspensive effect",
      "Automated, assisted and solely automated decision modes with human oversight and contestability",
      "Publication, individual notification/service, access classification, redaction and anonymisation",
      "Decision-specific retention triggers, disposition and disposal/legal hold",
      "Alignment to external decision identifiers and vocabularies (ECLI, Akoma Ntoso, PROV, DCMI, XACML)"
    ],
    "out_of_scope": [
      "The deliberative occasion itself — agenda, attendance, minutes as a whole (WM-ACT-025 Meeting)",
      "The containing administrative case, application or procedure lifecycle (WM-POL-017)",
      "Generic record custody, storage media, format migration and preservation mechanics (parent WM-REC-001)",
      "The normative content of the policy, statute, rule or standard being applied (policy/rule sibling model)",
      "Master data for persons, organisational units and positions holding decision roles (party/agent sibling model)",
      "Authoring and administration of machine access-control policies; only a retained decision result is in scope",
      "Contract or agreement terms that a decision may authorise (agreement sibling model)",
      "Workflow engine internals, task queues and routing logic that carry an approval request",
      "Downstream financial posting, permit issuance or benefit payment produced by a decision"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ACT-025 Meeting",
        "distinction": "A meeting is an occasion; a decision record is an outcome assertion. The relationship is optional in both directions: Delaware General Corporation Law §141(f) permits board action without any meeting by unanimous written or electronic consent, and delegated single-signature approvals never involve a meeting. Meeting attendance and agenda stay in the meeting model; only the linkage, the agenda item decided and the quorum/vote result attach to the decision record.",
        "source_refs": [
          "SRC-010"
        ]
      },
      {
        "neighbor": "WM-POL-017 Administrative case",
        "distinction": "A case is the procedural container and may hold many decisions — procedural, interim, partial and final. Case state transitions are driven by decisions but are not decisions. Ex parte communications belong to the case record and are referenced by the decision record only where a rule requires them to be placed on the record of decision.",
        "source_refs": [
          "SRC-004"
        ]
      },
      {
        "neighbor": "WM-REC-001 Record (parent)",
        "distinction": "The parent supplies generic record properties: authenticity, reliability, integrity and usability as record characteristics, custody, format and preservation. WM-REC-010 adds only what is decision-specific — authority, outcome, reasons, validity and supersession — and must not restate parent mechanics.",
        "source_refs": [
          "SRC-002"
        ]
      },
      {
        "neighbor": "Runtime authorization decision (XACML PDP result)",
        "distinction": "A PDP result has the same logical shape (decision value, status, obligations, advice, applicable policy identifiers) but is normally ephemeral and produced at log scale. The boundary is retention as a record: a PDP result becomes an instance of this model only when it is captured and managed as a record. XACML decision values are an alignment vocabulary, not the canonical outcome set.",
        "source_refs": [
          "SRC-003"
        ]
      },
      {
        "neighbor": "Judicial judgment / case law item",
        "distinction": "A judgment is a specialised decision record with a governed global identifier (ECLI) and a document structure of introduction, background, motivation and decision. That structure is judicial and must not be imposed on administrative or corporate decisions; court organisation, procedure and case-law citation networks are out of scope.",
        "source_refs": [
          "SRC-006",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Electronic signature, seal and time-stamp evidence",
        "distinction": "Attestation evidence is referenced, not owned. The decision record holds pointers to signature/seal objects and time-stamp tokens plus a verification verdict and verification time; the cryptographic object model, trust lists and long-term validation data belong to a signature-evidence sibling model.",
        "source_refs": [
          "SRC-012"
        ]
      },
      {
        "neighbor": "Approval as an independent object",
        "distinction": "Boundary under review. In this model an approval is either an outcome value of a decision or a participation act within one, because the cited sources give approvals no independent identity. Standing authorisations such as licences and permits do have independent validity and holders, and may justify a separate sibling model; flagged rather than assumed.",
        "source_refs": [
          "SRC-010",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Architecture decision record (ADR) practice",
        "distinction": "ISO/IEC/IEEE 42010:2022 treats an architecture decision as pertaining to concerns and affecting architecture description elements, with rationale covering alternatives not chosen. That is a design-governance specialisation of the same shape; the architecture description, viewpoints and models it affects are out of scope here.",
        "source_refs": [
          "SRC-016"
        ]
      }
    ]
  },
