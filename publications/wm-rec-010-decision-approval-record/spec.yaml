        "SRC-005",
        "SRC-004"
      ]
    },
    {
      "id": "fn-supersede-or-amend",
      "name": "Supersede, amend or correct",
      "description": "Link a later act to this decision as a corrigendum, amendment, replacement or revocation and create the resulting expression without altering fixed content.",
      "inputs": [
        "Original decision record reference",
        "Change type",
        "Changing act reference",
        "Affected parts and change effective time"
      ],
      "outputs": [
        "Bidirectional supersession links",
        "New consolidated or corrected expression",
        "Updated status of the original",
        "Event-history entries on both records"
      ],
      "preconditions": [
        "The changing authority is competent to change this decision",
        "The original record's fixed content is preserved unmodified",
        "The change type is classified and justified"
