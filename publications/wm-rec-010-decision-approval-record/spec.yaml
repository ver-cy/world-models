        "SRC-004",
        "SRC-006",
        "SRC-005"
      ]
    },
    {
      "id": "fn-evaluate-validity-as-of",
      "name": "Evaluate validity at an instant",
      "description": "Answer whether the decision was valid, suspended, expired, revoked or annulled at a specified instant, returning the evidence used.",
      "inputs": [
        "Decision record reference",
        "Instant to evaluate as an RFC 3339 timestamp",
        "Validity window, suspension intervals, supersession and annulment events"
