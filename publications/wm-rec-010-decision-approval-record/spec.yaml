  "functions": [
    {
      "id": "fn-register-decision",
      "name": "Register decision record",
      "description": "Create a decision record and bind it to a canonical identifier following the identity priority, capturing both the event time and the ingestion time.",
      "inputs": [
        "Decision family and binding character",
        "Question decided and outcome",
        "Deciding authority reference and authority basis",
        "Decision event time with explicit offset",
        "Available authoritative or governed identifiers"
      ],
      "outputs": [
        "Persisted decision record in its initial state",
        "Canonical identifier assignment",
        "Alias identifier set",
        "Initial event-history entry"
      ],
      "preconditions": [
        "The deciding authority reference resolves in the party model",
        "The authority basis instrument is resolvable at a stated version",
        "No existing record already carries the same authoritative identifier"
      ],
      "effects": [
        "Record enters the governed state model",
        "Retention trigger candidates are computed but not yet resolved",
        "Identifier is reserved in the register and cannot be reassigned"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-006",
        "SRC-005",
        "SRC-011"
      ]
    },
    {
      "id": "fn-record-approval-act",
      "name": "Record approval or consent act",
      "description": "Attach an individual approval, consent, vote, abstention or recusal to a decision record, preserving actor, capacity and time.",
      "inputs": [
        "Decision record reference",
        "Participant reference and capacity",
        "Act type and value",
        "Act timestamp",
        "Presence mode where relevant"
      ],
      "outputs": [
        "Persisted participation act",
        "Updated participant list",
        "Appended event-history entry"
      ],
      "preconditions": [
        "The decision record is in a state that still accepts participation acts",
        "The participant is eligible under the applicable composition rule",
        "The participant has not already cast a conflicting act for the same question"
      ],
      "effects": [
        "Vote tally and consent set are updated",
        "Quorum evaluation becomes re-computable",
        "Recusal adjusts the eligible denominator for quorum and majority"
      ],
      "source_refs": [
        "SRC-010",
        "SRC-004",
        "SRC-001"
      ]
    },
    {
      "id": "fn-evaluate-quorum-and-majority",
      "name": "Evaluate quorum and required majority",
      "description": "Determine whether the applicable quorum was satisfied and whether the recorded acts meet the required majority, including the no-meeting consent path.",
      "inputs": [
        "Decision record reference",
        "Applicable quorum and majority rule with source provision",
        "Participation acts",
        "Eligible membership at the decision time"
      ],
      "outputs": [
        "Quorum satisfaction verdict",
        "Majority satisfaction verdict",
        "Derived outcome or an explicit failure reason"
      ],
      "preconditions": [
        "A quorum and majority rule is resolvable for the deciding body",
        "Eligible membership at the decision time is known",
        "Recusals and conflicts have been applied to the denominator"
      ],
      "effects": [
        "A failed evaluation blocks transition to a decided state",
        "The verdict and the rule version used are recorded for audit",
        "Where consent replaces a sitting, effectiveness is derived from the last consent delivery or a stated later date"
      ],
      "source_refs": [
        "SRC-010",
        "SRC-004"
      ]
    },
    {
      "id": "fn-verify-authority",
      "name": "Verify competence and delegation limits",
      "description": "Check that the decider held competence at the decision time and that the decision falls within any delegated thresholds and outside reserved matters.",
      "inputs": [
        "Decision record reference",
        "Authority basis and delegation chain",
        "Decision magnitude and category",
        "Decision time"
      ],
      "outputs": [
        "Competence verdict with reasons",
        "List of breached thresholds or reserved matters",
        "Escalation target where competence is absent"
      ],
      "preconditions": [
        "The delegation instruments are resolvable at their in-force versions",
        "The decision magnitude is expressed in a unit the thresholds use"
      ],
      "effects": [
        "A negative verdict marks the record as requiring ratification or escalation",
        "The verdict, the instrument versions checked and the check time are recorded"
      ],
      "source_refs": [
        "SRC-010",
        "SRC-001",
        "SRC-004"
      ]
    },
    {
      "id": "fn-attest-and-fix",
      "name": "Attest, seal and fix the record",
