  "coverage": {
    "claim": "Merged model covers the context an agent needs to identify, classify, compose, operate, evidence, govern and exchange a built facility as an operationally managed aggregate, using the Claude result as base (explicit in/out-of-scope lists keyed to named sibling models, eight sourced boundary notes, bitemporal and retention discipline) plus five Grok findings for facility eligibility and non-building/mobile cases, AHJ occupancy authorization, alleged-versus-adjudicated compliance status, facility-scale fire and life safety, and post-occupancy evaluation. Bounded to the facility aggregate only: Site, Building, Space, Equipment, Organization, Authorization, Address and Work Management remain sibling models. No claim of universal, cross-jurisdiction or metaphysical completeness is made; code lists remain Dimension-declared.",
    "confidence": "medium",
    "checklist": [
      {
        "dimension": "identity",
        "status": "covered",
        "notes": "Master-system key, governed external registry identifiers, non-reuse, merge and split, and match confidence are grounded in the EPA Facility Site Identification Data Standard, the FRS registry pattern and INSPIRE persistent-identifier rules. Reference designations are explicitly excluded from identity because ISO 81346-12 excludes serial and inventory numbering from its scope."
      },
      {
        "dimension": "lifecycle",
        "status": "covered",
        "notes": "Phase set from ISO 15686-1, operational status from real-property inventory and INSPIRE construction-condition semantics, handover and trigger events from ISO 19650-3, terminal states with surviving obligations. Gap: no primary source consulted supplies a single normative facility status code list, so the model requires the adopting Dimension to declare and version its own."
      },
      {
        "dimension": "relationships",
        "status": "covered",
        "notes": "Site containment (conditional, because IFC allows a facility as outermost container), facility part decomposition with a mandatory usage convention, building membership with validity and exclusivity, system-to-space service edges, and typed references to seven sibling models."
      },
      {
        "dimension": "temporal",
        "status": "covered",
        "notes": "Bitemporal discipline with record validity bounds, real-world validity, event time, observation time and ingestion time; RFC 3339 with explicit offset mandated; partial dates handled by a declared structure rather than padding; correction versus real-world change distinguished explicitly."
      },
      {
        "dimension": "provenance",
        "status": "covered",
        "notes": "Per-attribute source system, precedence ranking, match confidence, estimated versus metered shares and restatement handling, modelled on the federated-registry integration and best-pick pattern and on benchmarking data-quality practice."
      },
      {
        "dimension": "ownership",
        "status": "covered",
        "notes": "Legal interest, title holder, custodial control and encumbrances separated from operating accountability; the demand-organisation to service-provider distinction is taken from ISO 41011 facility-management vocabulary."
      },
      {
        "dimension": "validation",
        "status": "covered",
        "notes": "Blocking versus advisory rules, publication gate, canonical-form constraints (unit required, CRS required, offset required), reconciliation tolerances for apportioned area, and deduplication adjudication thresholds."
      },
      {
        "dimension": "access",
        "status": "covered",
        "notes": "Deny-by-default with per-scope sensitivity markings across bundle, layer, finding and artifact; five named exception classes including emergency response and statutory disclosure; audit obligations. Grounded in the statutory authority to exclude federal real property from publication for national-security and FOIA-exemption reasons, and in the ISC security-level standard."
      },
      {
        "dimension": "retention and deletion",
        "status": "covered",
        "notes": "Record classes mapped to schedule items with trigger, period and disposition action; decommissioning modelled as a lifecycle transition rather than deletion; tombstone metadata preserved; archival-offer obligation before disposition. Grounded in NARA GRS 5.4 (Transmittal 35, May 2024)."
      },
      {
        "dimension": "interoperability",
        "status": "covered",
        "notes": "Alignments to IFC 4.3, CityGML 3.0, COBie V3, INSPIRE Buildings, SAREF4BLDG, BOT, ISO 55001 and ISO 19650-3, each versioned, direction-tagged and lossiness-flagged, with conformance withheld absent cited evidence."
      },
      {
        "dimension": "classification",
        "status": "covered",
        "notes": "Functional and reporting classification with per-purpose precedence, plus legally consequential code occupancy classification asserted by an authority having jurisdiction. Uniclass Complexes versus Entities is recorded as a granularity decision rather than a fixed mapping."
      },
      {
        "dimension": "spatial",
        "status": "covered",
        "notes": "Representative point, extent geometry, CRS and vertical datum, accuracy, level of detail, relative versus absolute placement, addressing roles and jurisdictional straddling."
      },
      {
        "dimension": "measurement",
        "status": "covered",
        "notes": "Area under a declared measurement standard, capacity, occupancy, utilisation formula, resource metrics with normalisation and benchmark reference, metering boundary declaration and metered-versus-estimated share."
      },
      {
        "dimension": "security",
        "status": "covered",
        "notes": "Security level determination factors, five-level scale, required versus implemented countermeasures with approved deviations, critical-infrastructure designation and reassessment cadence, from the ISC Risk Management Process 2021 Edition."
      },
      {
        "dimension": "risk and criticality",
        "status": "covered",
        "notes": "Criticality and mission dependency with declared method, hazard exposure with likelihood and severity basis, redundancy and recovery objectives, exercise evidence. Gap: no consulted primary source defines a cross-sector criticality scale, so the method must be named by the adopting Dimension."
      },
      {
        "dimension": "regulatory compliance",
        "status": "covered",
        "notes": "Programme interests with regulator and programme identifier, permits with validity and conditions, statutory inspections with due dates, open nonconformities with corrective actions and deadlines."
