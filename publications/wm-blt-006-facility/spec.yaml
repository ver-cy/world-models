      "inputs": [
        "facility identifier",
        "site reference",
        "building and structure references",
        "decomposition convention",
        "system reference designations"
      ],
      "outputs": [
        "facility breakdown structure",
        "membership assertions with validity windows",
        "system register entries"
      ],
      "preconditions": [
        "A decomposition convention has been selected and justified",
        "Member references resolve to governed model instances"
      ],
      "effects": [
        "Non-exclusive memberships are flagged and given an apportionment basis",
        "Breakdown depth beyond the declared terminal level is rejected and routed to the Building or Space model"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-001",
        "SRC-016",
        "SRC-018"
      ]
    },
    {
