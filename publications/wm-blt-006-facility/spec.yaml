        "status": "gap",
        "notes": "Occupant population is modelled only as aggregate counts by category. Person-level occupancy, access-credential records and workplace monitoring raise data-protection duties that no consulted source addresses at facility level; these are deferred to an Identity/Access model and flagged as an evidence gap rather than covered here."
      }
