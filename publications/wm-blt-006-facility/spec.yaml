      "namespace_guidance": "Use a stable, resolvable namespace under the adopting Dimension, segmented by record plane and model, for example {dimension-root}/world-model/wm-blt-006/{facility-identifier}. Node identifiers within the model are lower-kebab-case and stable for the life of the model; renaming a node requires a new identifier plus an explicit supersession link. External identifiers keep their issuing authority's namespace and are never rewritten into the local namespace. Where linked-data projection is used, mint facility IRIs in the Dimension namespace and relate them to external vocabularies by alignment properties rather than by asserting equivalence.",
      "registry_links": [
