      "inputs": [
        "facility identifier",
        "reporting period",
        "meter and estimate inputs",
        "area and occupancy measures",
        "normalisation and benchmark reference"
      ],
      "outputs": [
        "performance benchmark report",
        "benchmark score",
        "metering boundary declaration",
        "provenance and validation report"
      ],
      "preconditions": [
        "Metering boundary is declared relative to the facility extent",
        "Gross floor area and operating hours are present and dated"
      ],
      "effects": [
        "Restatements create a new report version citing the superseded one and notify downstream consumers",
        "Estimated shares above the declared threshold mark the figures as advisory"
      ],
      "source_refs": [
        "SRC-019",
        "SRC-005",
        "SRC-011"
      ]
    },
    {
      "id": "apply-disclosure-controls",
      "name": "Apply disclosure controls",
      "description": "Produce a release projection of the facility record with sensitivity markings applied, attributes withheld or generalised, exceptions honoured and access logged.",
      "inputs": [
        "facility record version",
        "sensitivity markings by scope",
        "redaction and generalisation rules",
        "requesting identity and purpose"
      ],
      "outputs": [
        "release projection",
        "redaction manifest",
        "access log entry"
      ],
      "preconditions": [
        "Every scope carries a sensitivity marking",
        "The requesting identity is authenticated and its role is resolved"
      ],
      "effects": [
        "Withheld attributes are recorded as withheld with a legal basis rather than silently omitted",
        "Geometry precision reduction is applied before any public release",
        "An access log entry is written for restricted content"
      ],
      "source_refs": [
        "SRC-006",
        "SRC-009"
      ]
    },
    {
      "id": "export-facility-exchange-package",
      "name": "Export facility exchange package",
      "description": "Render the canonical facility payload and its artifacts into a chosen projection with crosswalk rows, integrity digests and the required bootstrap manifest.",
      "inputs": [
        "facility identifier and record version",
        "target projection",
        "crosswalk selection",
        "artifact set"
