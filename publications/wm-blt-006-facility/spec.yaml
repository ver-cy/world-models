    "access": {
      "default_rule": "Deny by default. Access is granted per scope (bundle, layer, finding, artifact) to an authenticated identity holding a role explicitly bound to that scope's sensitivity marking, for a declared purpose. Facility information is not presumed public: statutory real-property publication regimes expressly authorise excluding assets for national-security reasons and under freedom-of-information exemptions, so the model treats openness as a per-scope decision rather than a default.",
