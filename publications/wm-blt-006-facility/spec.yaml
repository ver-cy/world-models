  "model": {
    "registry_id": "vr.wm-blt-006",
    "model_id": "WM-BLT-006",
    "name": "Facility",
    "entry_kind": "aggregate",
    "purpose": "Provide the governed, format-neutral context an agent needs to identify, classify, compose, operate, evidence and hand over a built facility as a managed aggregation of buildings, structures, systems and grounds.",
    "scope_statement": "A Facility is a bounded, operationally managed built entity that is planned, constructed, operated, maintained and eventually decommissioned as a unit under identified custody, and that aggregates one or more buildings, structures, engineered systems and associated grounds. The model covers the facility as (a) an identifiable real-world entity with registry standing, (b) an aggregation root over contained buildings and systems, and (c) an object of regulatory, financial, security and information governance. It deliberately excludes the internals of contained models (Building, Space, Equipment) and the land-tenure semantics of the containing Site.",
    "in_scope": [
      "Facility identity, naming, reference designation and cross-registry keys",
      "Functional, occupancy and code classification of the facility as an operating whole",
      "Geospatial extent, georeference and jurisdictional location of the facility boundary",
      "Containment by Site and decomposition into facility parts, buildings and structures",
      "Facility-level engineered systems and linkage to the component asset register",
      "Lifecycle phase, operational status, milestone events and record versioning",
      "Condition, service life, deferred maintenance and criticality at facility level",
      "Ownership, custody, legal interest, operator and facility-management accountability",
      "Regulatory programme interests, permits, statutory inspections and nonconformities",
      "Security level, protective posture and information disclosure constraints",
      "Capacity, occupancy, utilisation and resource performance benchmarking",
      "Asset information requirements, provenance, retention and standards alignment"
    ],
    "out_of_scope": [
      "Land parcel tenure, cadastral boundaries and site acquisition (Site model WM-BLT-008)",
      "Internal building fabric, storeys, structural systems and envelope (Building model WM-BLT-001)",
      "Room and space geometry, occupancy assignment and wayfinding (Space model)",
      "Component-level equipment records, serial numbers, warranties and spares (Equipment/Asset-item model)",
      "Legal-entity attributes of owners, operators and regulators (Organization/Party model)",
      "The permit or licence instrument itself, including its issuance workflow (Authorization model)",
      "Postal address normalisation and address-point registry semantics (Address model)",
      "Work-order execution, labour, scheduling and cost postings (Work Management model)",
      "Financial valuation, depreciation and capital accounting (Financial Asset model)",
      "Linear network topology of utilities and transport corridors beyond the facility boundary (Network/Utility model)",
      "Individual person records, credentials and access-card issuance (Identity/Access model)",
      "Construction project delivery, contracts and programme management (Project model)"
    ],
    "boundary_notes": [
      {
        "neighbor": "Site (WM-BLT-008)",
        "distinction": "Site is the georeferenced land locus with tenure and parcel semantics; Facility is the operating unit placed on or spanning one or more sites. IFC keeps IfcSite and IfcFacility as distinct spatial structure elements and allows IfcFacility to be aggregated directly to IfcProject when no site information exists, so Site containment is normal but not universal.",
        "source_refs": [
          "SRC-001",
          "SRC-018"
        ]
      },
      {
        "neighbor": "Building (WM-BLT-001)",
        "distinction": "Facility aggregates buildings and structures; Building holds fabric, storeys and envelope. This inverts the IFC type hierarchy, where IfcBuilding is a subtype of IfcFacility rather than its part. The registry CONTAINS relation is retained as an operational aggregation, and IFC subtyping is recorded as an alignment conflict rather than a conformance claim.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Space / Room model",
        "distinction": "Facility stops at facility parts and building membership; interior spatial subdivision (IfcSpace, COBie Space and Zone, CityGML rooms) belongs to the Space model. Facility records only aggregate space counts and area totals.",
        "source_refs": [
          "SRC-002",
          "SRC-016",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Equipment / Asset-item model",
        "distinction": "Facility records facility-level systems and a pointer to the asset register with coverage and completeness measures; individual component identity, type data and maintenance history belong to the Equipment model (COBie Type and Component).",
        "source_refs": [
          "SRC-016",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Organization / Party model",
        "distinction": "Facility references owner, custodian, demand organisation and service provider by identifier and role, with validity dates; it does not model legal-entity registration, corporate hierarchy or contracting capacity.",
        "source_refs": [
          "SRC-012",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Authorization / Permit model",
        "distinction": "Facility carries regulatory programme interests, programme identifiers and permit references with validity windows; the permit instrument, its conditions text and issuance workflow belong to the Authorization model. EPA FRS models this as environmental interest types linked to a facility Registry ID.",
        "source_refs": [
          "SRC-005",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Address / Location model",
        "distinction": "Facility holds address references and administrative unit codes needed for reporting and emergency response; address parsing, normalisation and address-point authority belong to the Address model.",
        "source_refs": [
          "SRC-004",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Facility Management service model (ISO 41001)",
        "distinction": "Facility is the object of management, not the management system. FM policy, objectives, competence and audit of the FM management system belong to a separate management-system model; Facility retains only the accountability links and service scope.",
        "source_refs": [
          "SRC-012"
        ]
      }
    ]
  },
