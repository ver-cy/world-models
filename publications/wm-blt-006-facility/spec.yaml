      {
        "dimension": "financial",
        "status": "not-applicable",
        "notes": "Valuation, depreciation, capital accounting and cost postings are routed to a Financial Asset model. Only deferred maintenance liability is retained here, because condition reporting requires it and real-property inventory guidance reports it alongside condition."
