  "functions": [
    {
      "id": "register-facility",
      "name": "Register facility",
      "description": "Create a governed facility record with an authoritative identifier, minimal classification, containment and initial lifecycle state.",
      "inputs": [
        "candidate facility descriptor",
        "proposed identifier or issuing authority",
        "containing site reference where applicable",
        "asserting party and authority basis"
      ],
      "outputs": [
        "facility record version 1",
        "assigned facility identifier",
        "identifier register entry",
        "creation event log entry"
      ],
      "preconditions": [
        "Identity resolution has been run and no existing facility matches above the adjudication threshold",
        "An issuing authority for the identifier scheme is named",
        "Country and coordinate reference system are supplied"
      ],
      "effects": [
        "A new persistent facility identifier is assigned and recorded as never-reusable",
        "An append-only creation event is written with event time and ingestion time",
        "Downstream registries are notified of the new identifier"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-005",
        "SRC-003"
      ]
    },
    {
      "id": "resolve-facility-identity",
      "name": "Resolve facility identity",
      "description": "Match an inbound facility assertion against existing records using name, address, coordinates and programme identifiers, returning a match, a candidate set or a no-match decision with confidence.",
      "inputs": [
        "inbound facility assertion",
        "match rule set and thresholds",
        "reference registry snapshot"
      ],
      "outputs": [
        "match decision code",
        "matched facility identifier or candidate set",
        "match confidence value",
        "adjudication record"
      ],
      "preconditions": [
        "Inbound assertion carries at least one location or identifier attribute",
        "Match rules and thresholds are versioned and published"
      ],
      "effects": [
        "An adjudication record is appended with the rule version and confidence",
        "Below-threshold matches are queued for human adjudication rather than auto-merged",
        "Merge or split decisions emit successor identifier links"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-004"
      ]
    },
    {
      "id": "classify-facility",
      "name": "Classify facility",
      "description": "Assign functional, reporting and code occupancy classifications to the facility in each adopted scheme, with precedence per downstream purpose.",
      "inputs": [
        "facility identifier",
        "scheme identifiers and versions",
        "use and area evidence",
        "authority having jurisdiction determination where applicable"
      ],
      "outputs": [
        "classification assignment set",
        "crosswalk table rows",
        "classification effective-from date"
      ],
      "preconditions": [
        "Primary function evidence is available",
        "Each scheme version in use is declared"
      ],
      "effects": [
        "Classification changes trigger review of permits, benchmarking baseline and occupancy determination",
        "Prior classifications are retained with end dates rather than overwritten"
      ],
      "source_refs": [
        "SRC-019",
        "SRC-021",
        "SRC-020",
        "SRC-001"
      ]
    },
    {
      "id": "assemble-facility-composition",
