      "outputs": [
        "regulatory standing summary",
        "expiry and overdue list",
        "open nonconformity list"
      ],
      "preconditions": [
        "Programme interests are mapped to competent regulators",
        "Permit validity windows are populated"
      ],
      "effects": [
        "Expired or missing authorisations block publication of an operational status of in-use without an explicit exception",
        "Overdue statutory inspections raise a compliance exception with an owner and deadline"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-011",
        "SRC-020"
      ]
    },
    {
