        "facility identifier",
        "target phase and status codes",
        "event time",
        "supporting evidence reference",
        "asserting party"
      ],
      "outputs": [
        "milestone event log entry",
        "updated status fields",
        "new record version"
      ],
      "preconditions": [
        "The transition is permitted from the current state",
        "Event time carries an explicit offset or Z",
        "The asserting party holds authority for the transition"
