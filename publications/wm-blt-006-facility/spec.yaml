      "outputs": [
        "condition assessment report",
        "criticality rating",
        "hazard exposure set",
        "reassessment due date"
      ],
      "preconditions": [
        "Assessor competence is evidenced",
        "Method version is declared and its scale is published"
      ],
      "effects": [
        "Backlog above the escalation threshold raises a maintenance and investment finding",
        "Criticality changes propagate to the security-level mission-criticality factor"
