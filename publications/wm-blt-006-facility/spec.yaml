        "name": "Identity and Classification",
        "description": "What fixes which facility is meant, how it is named and designated, and how it is typed for operational, code and reporting purposes.",
        "rationale": "Facility data is federated across construction, real-property, regulatory and energy systems, each issuing its own key and its own typology. Identity resolution and classification precedence must be settled before any other context is trustworthy.",
