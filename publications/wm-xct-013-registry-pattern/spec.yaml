  "model": {
    "registry_id": "vr.wm-xct-013",
    "model_id": "WM-XCT-013",
    "name": "Registry Pattern",
    "entry_kind": "pattern",
    "purpose": "Give an agent the format-neutral context needed to understand, constitute, inspect and operate an authoritative register: what subject matter a register admits, how entries are composed and identified, what status and ordering they carry, what effect registration produces in the world, and what may be inspected, searched or certified — while delegating identifier, provenance, ownership, access, audit, evidence, status, version, application, decision, event, federation, projection, mandate and dispute semantics to sibling models.",
    "scope_statement": "The pattern covers the register as an authoritative book and the registry that operates it. It owns register constitution (field of application, item classes, entry model, registration policy), the entry record and its supersession and priority ordering, the registration act that changes the book, the effect and reliance regime attached to registration, the publicity/search/extract surface, and register-level assurance and currency measures. It does not own any machinery that a linked model already governs; where a concern is target-owned this model carries only the binding, the subject-specific parameters and the reference.",
    "in_scope": [
      "Constitution of a register: field of application, item classes, entry content model and registration policy strictness",
      "Register entries as authoritative records: composition, subject binding, status binding and temporal validity",
      "Registration acts (addition, clarification, amendment, supersession, retirement, invalidation, correction, cancellation, lapse) and their authority basis",
      "Registration ordering and priority stamp, including the rule that order of registration can determine rank",
      "Effect of registration: constitutive, declaratory, evidentiary-presumption, priority-conferring or opposability effect and its commencement instant",
      "Publicity regime classification per register and per attribute, index and search surface, certified extract attestation, and fee/cost-recovery basis",
      "Register-level assurance: rectification regime, liability and indemnity posture, contested marking, coverage and currency measures",
      "Registry instance hosting one or more registers, registrar continuity and succession, and alignment bindings to external registry vocabularies"
    ],
    "out_of_scope": [
      "Identifier scheme syntax, allocation, lifecycle and resolution (WM-XCT-011)",
      "Provenance agents, derivations and source lineage semantics (WM-XCT-012)",
      "Ownership transfer, delegation and stewardship lifecycle (WM-XCT-001)",
      "Authorization, purpose, consent, party and grant lifecycle, and runtime access decisions (WM-XCT-002)",
      "Audit event schema, ordering, integrity and audit retention (WM-XCT-004)",
      "Evidence custody, verification workflow, support, challenge and rationale semantics (WM-XCT-028)",
      "Generic status vocabulary, transition rules and lifecycle history (WM-XCT-021)",
      "Version identity, diffs and change-history semantics (WM-XCT-022)",
      "Application intake, applicant payload and request lifecycle (WM-REC-009)",
      "Decision outcome, reasons, approval evidence and signoff (WM-REC-010)",
      "Event ordering, replay, integrity proof and event retention (WM-XCT-015)",
      "Federation authority topology, routing, mirroring, freshness and drift (WM-XCT-018)",
      "Projection selection, transformation, grain, compilation and runtime disclosure enforcement (WM-XCT-003)",
      "Registry mandate issuance, jurisdiction and mandate lifecycle (WM-POL-013)",
      "Dispute forum procedure, hearings and adjudication (WM-POL-010)",
      "Domain-specific register content such as parcel geometry, civil-status facts or licence conditions"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-XCT-011 Identifier scheme",
        "distinction": "This model states which governed scheme an entry identifier is drawn from, whether values may be reused after retirement, and how the identifier is bound to an entry; syntax, allocation procedure and resolution stay in WM-XCT-011. RFC 8126 treats reclamation of assigned values as a change-control question, which reinforces that the reuse rule is register policy while the value space is scheme-owned.",
        "source_refs": [
          "SRC-003",
          "SRC-002"
        ]
      },
      {
        "neighbor": "WM-XCT-028 Evidence",
        "distinction": "This model owns only the evidentiary requirement specification — which evidence classes an item class demands before an act may be applied — and the reference from entry to evidence. Custody, verification workflow, sufficiency challenge and rationale remain WM-XCT-028. The previous R1 'evidence' bundle with a verification layer is therefore deliberately removed.",
        "source_refs": [
          "SRC-005",
          "SRC-009"
        ]
      },
      {
        "neighbor": "WM-REC-009 Application record and WM-REC-010 Decision record",
        "distinction": "Lodgement payload, applicant identity and request lifecycle belong to WM-REC-009; outcome, reasons and signoff belong to WM-REC-010. What remains here is the registration act itself — the mutation of the book — plus the ordering stamp attached at lodgement, because that stamp is what confers rank inside the register.",
        "source_refs": [
          "SRC-005",
          "SRC-012"
        ]
      },
      {
        "neighbor": "WM-XCT-003 Projection and disclosure shape",
        "distinction": "The shape, field selection and grain of a public view, extract or bulk view, and its runtime enforcement, are WM-XCT-003 and its evaluator. This model carries only the publicity classification of register content and the registrar's attestation that an extract corresponds to the register at a stated instant.",
        "source_refs": [
          "SRC-004",
          "SRC-009"
        ]
      },
      {
        "neighbor": "WM-XCT-021 Status and lifecycle",
        "distinction": "Status vocabulary, transition legality and lifecycle history are WM-XCT-021. This model binds register-specific meanings to those states — notably which states remain publicly exposed and which cease to support new use while being retained for interpreting older data, as ISO 19135 requires for superseded, retired and invalid items.",
        "source_refs": [
          "SRC-001",
          "SRC-008"
        ]
      },
      {
        "neighbor": "WM-XCT-004 Audit and WM-XCT-015 Event register",
        "distinction": "Registration acts and disclosures generate audit and domain events, but this model neither defines their schema nor guarantees their ordering, integrity proof or retention; it only hands off the change notification and the disclosure signal.",
        "source_refs": [
          "SRC-004",
          "SRC-011"
        ]
      },
      {
        "neighbor": "WM-POL-013 Registry mandate and WM-POL-010 Dispute forum",
        "distinction": "Registrar powers, jurisdiction and mandate lifecycle sit in WM-POL-013; objection and appeal procedure sits in WM-POL-010. Here the register records only that its field of application is derived from a referenced mandate, and that an entry carries a contested marking pointing to a case.",
        "source_refs": [
          "SRC-002",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Domain registers that specialize this pattern",
        "distinction": "Cadastres, civil registers, identity registers, licence books, security-rights registries and protocol-parameter registries inherit this skeleton inbound. Domain payload — parcel geometry, civil-status facts, collateral descriptions, protocol semantics — stays in the domain model; only the register skeleton is factored here.",
        "source_refs": [
          "SRC-003",
          "SRC-005",
          "SRC-009"
        ]
      },
      {
        "neighbor": "ISO 15489 records management",
        "distinction": "Authenticity, reliability, integrity and usability are general record properties applying to any records system. This model uses them as assurance criteria for register content but does not restate general records-management process or disposition-authority machinery.",
        "source_refs": [
          "SRC-011"
        ]
      }
    ]
  },
