              {
                "id": "register-field-of-application",
                "name": "Field of application and completeness claim",
                "description": "The register's declared subject-matter boundary, its territorial or jurisdictional reach, and how strong a completeness claim it makes. A register that claims to hold every instance of its subject supports negative inference ('not registered means not existing'); one that does not must say so, because search results are otherwise misread.",
