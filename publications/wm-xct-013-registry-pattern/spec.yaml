          {
            "id": "interoperability-alignment",
            "name": "Interoperability and alignment",
            "description": "How this register refers to and is referred to by others, and how it aligns with external registry vocabularies without claiming conformance.",
            "source_refs": [
              "SRC-001",
              "SRC-003",
              "SRC-004",
              "SRC-008",
              "SRC-010"
            ],
            "findings": [
              {
                "id": "cross-register-reference-binding",
                "name": "Cross-register reference and federation binding",
                "description": "Registers reference one another: an entry in one register may cite an identifier maintained in another, and independent registers may participate in an interconnection that distributes information in a standard message format. This model records which external register a reference resolves against and what freshness is expected; topology, routing, mirroring and drift are owned by WM-XCT-018.",
                "source_refs": [
                  "SRC-004",
                  "SRC-008",
                  "SRC-007"
                ],
                "questions": [
                  {
                    "id": "q-external-reference-targets",
                    "text": "Which external registers does this register cite, and for which fields?",
                    "kind": "relationship",
                    "answer_data": [
                      "External register reference list with the fields resolved against each",
                      "Whether values are restated locally or resolved on demand",
                      "Behaviour when the external register is unavailable"
                    ]
                  },
                  {
                    "id": "q-authoritative-source-precedence",
                    "text": "When a locally held value conflicts with the external register that owns it, which prevails?",
                    "kind": "decision",
                    "answer_data": [
                      "Precedence rule per referenced field",
                      "Detection route for divergence",
                      "Correction path once divergence is detected"
                    ]
                  },
                  {
                    "id": "q-federation-participation",
                    "text": "Does this register participate in an interconnection or mirroring arrangement, and in what role?",
                    "kind": "interoperability",
                    "answer_data": [
                      "Participation role: authoritative node, mirror or consumer",
                      "Reference to the federation arrangement (WM-XCT-018)",
                      "Expected freshness of any mirrored copy"
                    ]
                  },
                  {
                    "id": "q-cross-border-identifier-use",
                    "text": "Which identifier allows this register's entries to be matched unambiguously across borders or systems?",
                    "kind": "identity",
                    "answer_data": [
                      "Cross-system identifier used and its governing scheme",
                      "Scope in which the identifier is unequivocal",
                      "Fallback matching attributes where the identifier is absent"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-external-register-ref",
                    "name": "External register reference",
                    "description": "Reference to another register against which specified fields resolve.",
                    "value_kind": "reference",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-004",
                      "SRC-008"
                    ]
                  },
                  {
                    "id": "de-precedence-rule",
                    "name": "Precedence rule",
                    "description": "Rule stating which register's value prevails when a locally held value diverges from its authoritative source.",
                    "value_kind": "text",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-004"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "These are reference and policy fields on the register constitution; the federation arrangement itself, including routing, mirroring and drift handling, is an asset of WM-XCT-018 and must not be reproduced as a local artifact."
              },
              {
                "id": "registry-vocabulary-alignment",
                "name": "External registry vocabulary alignment",
                "description": "Several standards describe registers in overlapping but non-identical terms: ISO 19135 uses register manager, control body and item status; ISO/IEC 11179-6 separates registration status from administrative status and adds submitting organization and stewardship; RFC 8126 uses registration policy and change controller. These are alignments, not conformance claims, and their disagreements must be recorded rather than smoothed over.",
                "source_refs": [
                  "SRC-001",
                  "SRC-010",
                  "SRC-003",
                  "SRC-008",
                  "SRC-004"
                ],
                "questions": [
                  {
                    "id": "q-alignment-targets",
                    "text": "Which external registry vocabularies does this register align to, and at which version?",
                    "kind": "interoperability",
                    "answer_data": [
                      "Aligned standard or vocabulary list with version",
                      "Scope of each alignment (roles, statuses, policies, message formats)",
                      "Statement that alignment is not a conformance claim"
                    ]
                  },
                  {
                    "id": "q-term-crosswalk",
                    "text": "How do local role and status terms map onto each aligned vocabulary?",
                    "kind": "definition",
                    "answer_data": [
                      "Term-by-term crosswalk with mapping strength",
                      "Terms with no counterpart in an aligned vocabulary",
                      "Directionality of each mapping"
                    ]
                  },
                  {
                    "id": "q-alignment-conflict-record",
                    "text": "Where aligned vocabularies disagree, which disagreement is recorded and how is it resolved locally?",
                    "kind": "exception",
                    "answer_data": [
                      "Recorded conflict list",
                      "Local resolution chosen and its justification",
                      "Impact of the conflict on exchanged data"
                    ]
                  },
                  {
                    "id": "q-conformance-evidence",
                    "text": "What evidence would be needed before a conformance claim to an aligned standard could be made?",
                    "kind": "evidence",
                    "answer_data": [
                      "Conformance test or assessment referenced by the standard",
                      "Artefacts that would have to be produced",
                      "Party competent to assert or certify conformance"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-alignment-target",
                    "name": "Alignment target",
                    "description": "External registry standard or vocabulary to which this register is aligned, with its version.",
                    "value_kind": "reference",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-001",
                      "SRC-010",
                      "SRC-003"
                    ]
                  },
                  {
                    "id": "de-term-mapping",
