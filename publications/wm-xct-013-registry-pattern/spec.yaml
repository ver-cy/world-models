  "functions": [
    {
      "id": "fn-constitute-register",
      "name": "Constitute register",
      "description": "Bring a register into existence by fixing its identity, field of application, role bindings, registration policy and publicity schedule under a referenced constituting instrument.",
      "inputs": [
        "Constituting instrument or mandate reference",
        "Proposed field of application and exclusions",
        "Role bindings for owner, manager and control body",
        "Registration policy per intended item class"
      ],
      "outputs": [
        "Register constitution record",
        "Register identifier binding",
        "Initial publicity regime schedule"
      ],
      "preconditions": [
        "A constituting instrument exists and is referenced; its issuance and lifecycle are governed by WM-POL-013",
        "An identifier for the register is obtainable from a scheme governed by WM-XCT-011",
        "Accountable parties for each role resolve through WM-XCT-001"
      ],
      "effects": [
        "A register exists as a governed object distinct from the registry that operates it",
        "Later acts can be tested against a declared field of application",
        "Publicity classification becomes available to the access and projection models as input"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-008",
        "SRC-012"
      ]
    },
    {
      "id": "fn-define-item-class",
      "name": "Define item class",
      "description": "Add or revise an item class in a register, fixing its required attributes, syntax constraints, reserved ranges, extensibility and language rules.",
      "inputs": [
        "Register identifier",
        "Proposed attribute specification with cardinality and syntax",
        "Reserved and private-use ranges",
        "Extensibility and language rules"
      ],
      "outputs": [
        "Item class specification",
        "Updated register constitution record"
      ],
      "preconditions": [
        "The register is constituted and its field of application admits the class",
        "The registration policy for the class is stated",
        "Review by the competent control body or designated expert has been obtained where the policy requires it"
      ],
      "effects": [
        "Submissions can be validated against a published attribute contract",
        "Reserved ranges are withheld from ordinary assignment",
        "Extending domain registers gain a stable contract to specialize"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-003",
        "SRC-007",
        "SRC-008"
      ]
    },
    {
      "id": "fn-apply-registration-act",
      "name": "Apply registration act",
      "description": "Apply an authorised change to the register — addition, clarification, amendment, supersession, retirement, invalidation or cancellation — creating or altering an entry and binding its identifier.",
      "inputs": [
        "Act type",
        "Target register and item class",
        "Entry content payload",
        "Application record reference",
        "Authorising decision record reference",
        "Evidence references where the item class requires them"
      ],
      "outputs": [
        "Registration act record",
        "Created or updated register entry record",
        "Bound entry identifier"
      ],
      "preconditions": [
        "An authorising decision exists in WM-REC-010; this function does not decide the outcome",
        "Submitted content satisfies the item class specification and the register's admission criteria",
        "An entry identifier is obtainable from the scheme governed by WM-XCT-011",
        "The acting role is competent for the act type under the register's competence matrix"
      ],
      "effects": [
        "The register content changes and becomes the authoritative statement for the subject",
        "A change notification becomes available for hand-off to the event register",
        "Audit and provenance mix-ins receive the references they need, without this model defining their records"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-005",
        "SRC-009"
      ]
    },
    {
      "id": "fn-stamp-registration-order",
      "name": "Stamp registration order",
      "description": "Assign the receipt instant and monotonic sequence position that fix an act's place in the register's ordering, and derive priority rank where the register allocates rank.",
      "inputs": [
        "Received act reference",
        "Registry receipt clock reading",
        "Existing ordering state for the affected subject"
      ],
      "outputs": [
        "Ordering stamp",
        "Derived priority rank where applicable",
        "Tie-break resolution record"
      ],
      "preconditions": [
        "The register declares whether and how it allocates rank",
        "A monotonic sequence source is available so that equal timestamps can still be ordered",
        "Any applicable priority protection window has been checked"
      ],
      "effects": [
        "Competing acts over the same subject acquire a deterministic order",
        "Rank becomes computable independently of storage or event-log ordering",
        "Priority protection reservations are consumed or released"
      ],
      "source_refs": [
        "SRC-012",
        "SRC-009",
        "SRC-005"
      ]
    },
    {
      "id": "fn-apply-supersession-or-retirement",
      "name": "Apply supersession or retirement",
      "description": "Close an entry by replacing it with a named successor or withdrawing it without replacement, preserving both directions of the continuity chain and the register's retention obligation.",
      "inputs": [
        "Target entry reference",
        "Outcome kind: supersession, retirement or invalidation",
        "Successor entry reference where a successor exists",
        "Authorising decision reference"
      ],
      "outputs": [
        "Updated continuity links on predecessor and successor",
        "Registration act record for the closure",
        "Updated status binding on the affected entries"
      ],
      "preconditions": [
        "The target status transition is legal under the governed vocabulary owned by WM-XCT-021",
        "A successor is supplied for supersession and withheld for retirement",
        "The register's retention rule permits closure rather than deletion"
      ],
      "effects": [
        "Closed entries remain available for interpreting data produced before closure",
        "Publication of the entry follows the status-to-exposure mapping rather than disappearing",
        "Consumers can traverse from any predecessor to the current successor"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-008",
        "SRC-009"
      ]
    },
    {
      "id": "fn-record-rectification",
      "name": "Record rectification",
      "description": "Correct an inaccuracy in the register, classifying it as registry error, submitted error or a change of underlying facts, and record whether the correction operates retroactively.",
      "inputs": [
        "Target entry reference",
        "Error classification and its supporting material references",
        "Corrected content",
        "Authorising decision reference",
        "Retroactivity determination"
      ],
      "outputs": [
        "Registration act record of type correction",
        "Updated entry record",
        "Error classification and retroactivity markers"
      ],
      "preconditions": [
        "The inaccuracy is established and classified against the register's error classes",
        "Affected parties have been notified where the register requires notification before correction",
        "Any protection for a party who relied in the interim has been evaluated by the competent decision maker"
      ],
      "effects": [
        "The register content ceases to be inaccurate from the determined commencement instant",
        "Liability and indemnity consequences become assessable from the error classification",
        "The pre-correction state remains reconstructable through the version mix-in"
      ],
      "source_refs": [
        "SRC-009",
        "SRC-005",
        "SRC-012"
      ]
    },
    {
      "id": "fn-issue-certified-extract",
      "name": "Issue certified extract",
      "description": "Produce an authenticated reproduction of specified register content as at a stated instant, bearing the registrar's attestation and an integrity value.",
      "inputs": [
        "Entry or content selection",
        "Requested as-at instant",
        "Requester and access grant reference",
        "Extract shape reference"
      ],
      "outputs": [
        "Certified register extract",
        "Attestation mark and integrity value",
        "Recorded as-at instant"
      ],
      "preconditions": [
        "An access grant covering the requested content has been resolved by WM-XCT-002",
        "The extract shape is supplied by WM-XCT-003; this function does not select or transform fields",
        "The register state as at the requested instant is reconstructable"
      ],
      "effects": [
        "A third party holds a verifiable statement of register content at a known instant",
        "A disclosure signal is handed to the audit mix-in without this model defining the audit record",
        "Pending acts outside the extract are disclosed as bounds on reliance"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-009",
        "SRC-012"
      ]
    },
    {
      "id": "fn-execute-register-search",
      "name": "Execute register search",
      "description": "Interrogate the register index by declared search keys and return a result set with an explicit as-at instant and completeness bounds, or an express nil statement.",
      "inputs": [
        "Search keys and values",
        "Requested as-at instant",
        "Access grant reference",
        "Product type: informational search or definitive search certificate"
      ],
      "outputs": [
        "Result set or express nil statement",
        "Registry search certificate where a definitive product is requested",
        "Result completeness statement"
      ],
      "preconditions": [
        "The supplied keys are among the register's declared search keys",
        "An access grant covering the requested publicity tier has been resolved by WM-XCT-002",
        "The matching rule and any normalisation for each key are published"
      ],
      "effects": [
        "The requester learns what the register does and does not show for the given keys",
        "Risk allocation for a near-miss becomes explicit through the published matching rule",
        "A definitive search may reserve rank where the register offers priority protection"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-012",
        "SRC-009"
      ]
    },
    {
      "id": "fn-publish-register-change",
      "name": "Publish register change",
      "description": "Hand a completed registration act to the register's change-notification channel so that downstream consumers and the append-only event register can take it up.",
      "inputs": [
        "Applied registration act record",
        "Affected entry references",
        "Publicity tier applying to the changed content"
      ],
      "outputs": [
        "Change notification payload",
        "Hand-off acknowledgement reference"
      ],
      "preconditions": [
        "The act has been applied and its ordering stamp assigned",
        "The publicity tier permits the level of detail included in the notification",
        "A destination event register is configured"
      ],
      "effects": [
        "Downstream consumers can detect that the register changed",
        "Ordering guarantees, replay and integrity proof for the published stream are supplied by WM-XCT-015, not by this model",
        "Restricted content is excluded from notifications by tier rather than by ad hoc filtering"
      ],
      "source_refs": [
        "SRC-008",
        "SRC-004",
        "SRC-007"
      ]
    },
    {
      "id": "fn-assess-register-currency",
      "name": "Assess register currency",
      "description": "Compute and publish coverage, currency lag, backlog and established error rate for a register against its declared field of application.",
      "inputs": [
        "Register identifier",
        "Reporting window start and end instants",
        "Reference population for coverage",
        "Established error records for the window"
      ],
      "outputs": [
        "Register quality statement",
        "Metric values with definitions",
        "Known systematic gap list"
      ],
      "preconditions": [
        "The field of application and completeness claim are declared",
        "A reference population exists or its absence is stated",
        "Error classification is available for the window"
      ],
      "effects": [
        "Consumers can calibrate how far a nil result or a stale entry may be relied on",
        "Remediation thresholds become testable",
        "The completeness claim is either corroborated or falsified by published measurement"
      ],
      "source_refs": [
        "SRC-011",
        "SRC-004",
        "SRC-008",
        "SRC-009"
      ]
    }
  ],
  "composition": [
    {
      "target": "WM-XCT-011",
      "relation": "REFERENCE",
      "purpose": "Bind register and entry identifiers to governed identifier schemes and record the reuse-after-retirement rule. Scheme syntax, allocation procedure, lifecycle and resolution stay in the target; this model carries only the scheme reference, the uniqueness scope and the subject-specific reuse parameter.",
      "required": true,
      "source_refs": [
        "SRC-002",
        "SRC-003",
        "SRC-010"
      ]
    },
    {
      "target": "WM-XCT-012",
      "relation": "MIX-IN",
      "purpose": "Attach provenance references to entries and registration acts so their source lineage can be traced. Provenance agents, derivations and lineage semantics remain in the target; this model neither defines provenance records nor asserts derivation.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-011"
      ]
    },
    {
      "target": "WM-XCT-001",
      "relation": "MIX-IN",
      "purpose": "Resolve register owner, register manager, control body and change controller to accountable parties. Ownership transfer, delegation and stewardship lifecycle remain in the target; this model records only the role-to-party binding and the competence matrix that uses it.",
      "required": true,
      "source_refs": [
        "SRC-002",
        "SRC-003",
        "SRC-012"
      ]
    },
    {
      "target": "WM-XCT-002",
      "relation": "REFERENCE",
      "purpose": "Route inspection, extract issuance and bulk access through access contracts. Authorization, purpose, consent, parties and grant lifecycle remain in the target; this model supplies only the publicity tier of each attribute and the legitimate-interest definition as input to the grant decision.",
      "required": true,
      "source_refs": [
        "SRC-004",
        "SRC-006",
        "SRC-009"
      ]
    },
    {
      "target": "WM-XCT-004",
      "relation": "MIX-IN",
      "purpose": "Let registration acts and disclosures contribute audit events. Audit event schema, ordering, integrity and audit retention remain in the target; referencing audit here confers no ownership of audit-trail semantics and this model defines no audit record.",
      "required": true,
      "source_refs": [
        "SRC-011",
        "SRC-004"
      ]
    },
    {
      "target": "WM-XCT-028",
      "relation": "REFERENCE",
      "purpose": "Point entries and registration acts at the evidence grounding them. Evidence custody, verification workflow, support, challenge and rationale remain in the target; this model owns only the per-item-class evidentiary requirement and a sufficiency marking.",
      "required": true,
      "source_refs": [
        "SRC-005",
        "SRC-009"
      ]
    },
    {
      "target": "WM-XCT-021",
      "relation": "MIX-IN",
      "purpose": "Bind registers, entries and registry cases to governed lifecycle states. Status vocabulary, transition legality and lifecycle history remain in the target; this model adds only the mapping from a bound state to publication exposure and permitted use.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-008"
      ]
    },
    {
      "target": "WM-XCT-022",
      "relation": "MIX-IN",
      "purpose": "Expose governed versions and change history for register definitions and entries. Version identity, diffs and change-history semantics remain in the target; this model relies on it for as-at reconstruction and pre-correction states rather than storing history locally.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-008",
        "SRC-009"
      ]
    },
    {
      "target": "WM-REC-009",
      "relation": "REFERENCE",
      "purpose": "Reference the generic application record behind a filing, amendment or cancellation request. Intake, applicant payload and request lifecycle remain in the target; this model retains only the receipt instant and ordering stamp, because those determine rank inside the register.",
      "required": true,
      "source_refs": [
        "SRC-005",
        "SRC-012"
      ]
    },
    {
      "target": "WM-REC-010",
      "relation": "REFERENCE",
      "purpose": "Reference the decision record authorising acceptance, refusal, correction or cancellation. Outcome, reasons, approval evidence and signoff remain in the target; this model owns only the resulting mutation of the book.",
      "required": true,
      "source_refs": [
        "SRC-005",
        "SRC-009"
      ]
    },
    {
      "target": "WM-XCT-015",
      "relation": "COMPOSE",
      "purpose": "Publish register changes to an append-only event register. Event ordering, replay, integrity proof and event retention remain in the target; this model produces a change notification and a hand-off, and derives its own priority ordering independently rather than from the event log.",
      "required": false,
      "source_refs": [
        "SRC-008",
        "SRC-012"
      ]
    },
    {
      "target": "WM-XCT-018",
      "relation": "REFERENCE",
      "purpose": "Record participation in interconnection or controlled mirroring and the expected freshness of a mirrored copy. Authority topology, routing, mirroring mechanics and drift handling remain in the target.",
      "required": false,
      "source_refs": [
        "SRC-004",
        "SRC-008"
      ]
    },
    {
      "target": "WM-XCT-003",
      "relation": "REFERENCE",
      "purpose": "Bind public views, certified extracts and bulk views to governed disclosure shapes. Projection selection, transformation, grain, compilation and runtime enforcement remain in the target and its evaluator; this model contributes the publicity classification and the registrar's attestation and as-at instant.",
      "required": true,
      "source_refs": [
        "SRC-004",
        "SRC-009"
      ]
    },
    {
      "target": "WM-POL-013",
      "relation": "REFERENCE",
      "purpose": "Reference the mandate defining registrar powers and the subject scope a public register may cover. Mandate issuance, authority, jurisdiction and mandate lifecycle remain in the target; this model records the derivation of its field of application from that mandate.",
      "required": false,
      "source_refs": [
        "SRC-002",
        "SRC-009",
        "SRC-012"
      ]
    },
    {
