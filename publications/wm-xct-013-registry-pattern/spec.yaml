  "structure": {
    "bundles": [
      {
        "id": "register-constitution",
        "name": "Register constitution",
        "description": "What brings a register into existence and fixes what it may contain: its identity as a book, the subject matter it admits, who may submit, and the item classes and entry model it publishes.",
        "rationale": "Every authoritative register cited — ISO 19135 registers, IANA protocol registries, INSPIRE registers, company registers, security-rights registries and title registers — is constituted before any entry exists, by a definition that fixes field of application, item classes, entry content and who may propose. Without this bundle an agent cannot tell whether a given fact is registrable at all.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-003",
          "SRC-004",
          "SRC-007",
          "SRC-008"
        ],
        "layers": [
          {
            "id": "register-definition",
            "name": "Register definition",
            "description": "The register as a governed object: its identity and constitution, the boundary of what it covers, and the policy controlling who may cause entries to exist.",
            "source_refs": [
              "SRC-001",
              "SRC-002",
              "SRC-003",
              "SRC-004",
              "SRC-008"
            ],
            "findings": [
              {
                "id": "register-identity-and-constitution",
                "name": "Register identity and constituting act",
                "description": "A register is a named, individually identified book of entries constituted by an instrument that names an accountable keeper and, where public, derives its powers from a referenced mandate. ISO/TC 211 separates the register owner from the register manager and the control body; UNIDROIT separates the Supervisory Authority from the Registrar; INSPIRE shows the operator can change while item URIs persist. The constitution is therefore distinct from both the operator and the storage.",
                "source_refs": [
                  "SRC-001",
                  "SRC-002",
                  "SRC-008",
                  "SRC-012"
                ],
                "questions": [
                  {
                    "id": "q-register-constituting-instrument",
                    "text": "Which instrument constitutes this register and what does it authorise the register to contain?",
                    "kind": "authority",
                    "answer_data": [
                      "Reference to the constituting instrument or mandate record (WM-POL-013)",
                      "Instrument type: statute, regulation, standard, charter, contract or internal policy",
                      "Date of entry into force of the constitution"
                    ]
                  },
                  {
                    "id": "q-register-distinct-identity",
                    "text": "What identifier distinguishes this register from every other register, including from the registry that operates it?",
                    "kind": "identity",
                    "answer_data": [
                      "Register identifier drawn from a governed scheme (binding to WM-XCT-011)",
                      "Register short name and official title",
                      "Operating registry identifier hosting the register"
                    ]
                  },
                  {
                    "id": "q-register-role-separation",
                    "text": "Which distinct parties hold register ownership, register management and control-body review for this register?",
                    "kind": "ownership",
                    "answer_data": [
                      "Owner party reference (resolved via WM-XCT-001)",
                      "Register manager / registrar party reference",
                      "Control body or designated expert reference where review is delegated"
                    ]
                  },
                  {
                    "id": "q-register-operator-succession",
                    "text": "What happens to register identity and item references if the operating organisation changes?",
                    "kind": "lifecycle",
                    "answer_data": [
                      "Persistence commitment for register and item references",
                      "Successor-operator designation rule",
                      "Continuity conditions required of a manager (legal entity, funding, minimum commitment period)"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-register-identifier",
                    "name": "Register identifier",
                    "description": "Stable identifier of the register itself, drawn from a governed scheme owned by WM-XCT-011.",
                    "value_kind": "identifier",
