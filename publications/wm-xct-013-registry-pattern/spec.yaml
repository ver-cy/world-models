                    "value_kind": "object",
                    "cardinality": "1..n",
                    "required": true,
                    "source_refs": [
                      "SRC-002",
                      "SRC-012"
                    ]
                  }
                ],
                "artifacts": [
                  {
                    "id": "register-constitution-record",
                    "name": "Register constitution record",
                    "description": "The durable statement of what this register is: identity, constituting instrument reference, role bindings, operating language and persistence commitment.",
                    "media_or_form": [
                      "structured record",
                      "normative text",
                      "registry metadata entry"
                    ],
                    "serial": false,
                    "identity_strategy": "Register identifier from the governed scheme; where no master-system identifier exists, a Dimension-assigned UUID bound to the constituting instrument reference.",
                    "source_refs": [
                      "SRC-001",
