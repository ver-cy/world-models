      "The model assumes an adopting Dimension that operates at least one system of record capable of issuing authoritative identifiers; where none exists the identity priority falls through to governed IRIs and then to UUID or ULID.",
      "Litigation hold and disposition-freeze semantics are drawn from a United States federal records practice in which counsel issues the hold and a written instruction is required to lift it. Other jurisdictions place the duty to preserve on different actors and at different trigger points; the hold reference and authority are therefore modelled as external references.",
      "The ten-year documentation-retention assumption derives from European high-risk AI provisions and applies only where those provisions bind the host; it is not a general default.",
      "Governance-line terminology assumes an organisation large enough to separate management, oversight and independent assurance. Small entities routinely combine these roles, so the model requires the overlap to be declared and mitigated rather than prohibited outright.",
