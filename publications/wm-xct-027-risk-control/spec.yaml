  "structure": {
    "bundles": [
      {
        "id": "rctl-risk-binding-bundle",
        "name": "Risk subject binding and assessment framing",
        "description": "Everything that fixes what was assessed and under which declared frame: the referenced risk and its exact revision, the anchors the assessment is scoped against, the causal chain quantified, the category and taxonomy pins, the scope and horizon, and the criteria, method and expression-mode pins.",
        "rationale": "A recorded level of risk is uninterpretable and non-comparable without the reference it belongs to and the frame it was produced under. NIST SP 800-30 requires the purpose, scope, assumptions, constraints, information sources, risk model and analytic approach to be documented alongside results, and IEC 31010 exists precisely because technique choice changes what a result means. Binding fields therefore precede estimate fields.",
        "source_refs": [
          "SRC-001",
          "SRC-007",
          "SRC-008",
          "SRC-002"
        ],
        "layers": [
          {
            "id": "rctl-risk-reference-layer",
            "name": "Referenced risk, anchors and causal chain",
            "description": "Reference-carrying fields that attach one assessment context to a pinned risk revision, to the objectives, assets, processes and contextual conditions it is scoped against, and to the risk source, event and consequences it quantifies.",
            "source_refs": [
              "SRC-001",
              "SRC-002",
              "SRC-005",
              "SRC-007"
            ],
            "findings": [
              {
                "id": "rctl-risk-subject-reference",
                "name": "Referenced risk identity and exact revision pin",
                "description": "Identifies which risk or opportunity entity this assessment context is bound to and which exact revision of its statement was assessed, so an estimate cannot silently drift when the referenced statement is later restated. The referenced entity's own status and lifecycle stay with the owning risk model; only the local binding validity state is held here.",
                "source_refs": [
                  "SRC-002",
                  "SRC-005",
                  "SRC-007"
                ],
                "questions": [
                  {
                    "id": "rctl-risk-q-subject-identifier",
                    "text": "Which authoritative identifier designates the risk entity that this assessment context is bound to?",
                    "kind": "identity",
                    "answer_data": [
                      "risk reference identifier value",
                      "identifier system or namespace",
                      "assigning authority or system of record"
                    ]
                  },
                  {
                    "id": "rctl-risk-q-subject-revision",
                    "text": "Which exact revision or version of the referenced risk statement was assessed?",
                    "kind": "provenance",
                    "answer_data": [
                      "risk revision or version token",
                      "time the revision was retrieved",
                      "content digest of the assessed statement"
                    ]
                  },
                  {
                    "id": "rctl-risk-q-subject-staleness",
                    "text": "How is this assessment context marked once the pinned risk revision is superseded upstream?",
                    "kind": "state",
                    "answer_data": [
                      "binding validity state code",
                      "time supersession was detected",
                      "re-assessment required indicator"
                    ]
                  },
                  {
                    "id": "rctl-risk-q-subject-polarity",
                    "text": "Does the bound subject represent a threat, an opportunity, or both, and where is that reading declared?",
                    "kind": "classification",
                    "answer_data": [
                      "effect polarity code",
                      "reference to the statement establishing polarity"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "rctl-risk-de-risk-reference",
                    "name": "risk-reference",
                    "description": "Resolvable reference to the risk or opportunity entity in its owning model.",
                    "value_kind": "reference",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-002",
                      "SRC-005"
                    ]
                  },
                  {
                    "id": "rctl-risk-de-risk-revision-pin",
                    "name": "risk-revision-pin",
                    "description": "Exact revision, version token or immutable snapshot identifier of the assessed risk statement.",
                    "value_kind": "text",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-001",
                      "SRC-005"
                    ]
                  },
                  {
                    "id": "rctl-risk-de-statement-digest",
                    "name": "risk-statement-digest",
                    "description": "Content digest of the assessed statement, allowing detection of upstream change without re-reading the source.",
                    "value_kind": "text",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-005"
                    ]
                  },
                  {
                    "id": "rctl-risk-de-binding-state",
                    "name": "binding-validity-state",
                    "description": "Local state of the binding: current, superseded-upstream, dangling or withdrawn. Describes this record only, never the referenced risk's own status.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-002",
                      "SRC-005"
                    ]
                  },
                  {
                    "id": "rctl-risk-de-effect-polarity",
                    "name": "effect-polarity",
                    "description": "Whether the assessed effect is treated as downside, upside or two-sided under the pinned criteria.",
                    "value_kind": "code",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-007",
                      "SRC-009"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "These are reference and pin fields carried on the host record; they produce no separable document. Reproducing the referenced risk statement here would fork the authoritative text owned by the risk entity model, so the binding stores an identifier, a revision token and a digest rather than a copy."
              },
