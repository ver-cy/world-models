                    "kind": "spatial",
                    "answer_data": [
                      "jurisdiction code set",
                      "site or facility reference",
                      "basis for jurisdictional applicability"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "rctl-risk-de-anchor-set",
                    "name": "assessment-anchor-set",
                    "description": "The complete set of resolvable anchors this assessment is scoped against; at least one anchor must resolve for the context to be valid.",
                    "value_kind": "collection",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-001",
                      "SRC-007"
                    ]
                  },
                  {
                    "id": "rctl-risk-de-objective-reference",
                    "name": "objective-reference",
                    "description": "Reference to an objective whose achievement the assessed uncertainty affects.",
                    "value_kind": "reference",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-007",
                      "SRC-002"
                    ]
                  },
                  {
                    "id": "rctl-risk-de-asset-process-reference",
                    "name": "asset-or-process-reference",
                    "description": "Reference to an asset, process, system or service inside the assessed exposure.",
                    "value_kind": "reference",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-001",
                      "SRC-002"
                    ]
                  },
                  {
                    "id": "rctl-risk-de-context-condition",
                    "name": "context-condition-statement",
                    "description": "A contextual condition held fixed for this assessment, whose change invalidates the estimate.",
                    "value_kind": "text",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-001",
                      "SRC-010"
                    ]
                  },
                  {
                    "id": "rctl-risk-de-applicable-jurisdiction",
                    "name": "applicable-jurisdiction-or-site",
                    "description": "Jurisdiction, site or facility whose rules or conditions make the anchor set location-specific.",
                    "value_kind": "code",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-012",
                      "SRC-007"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "Anchors are pure reference data pointing into objective, asset, process and organizational registries owned elsewhere. Materialising them as a local artifact would duplicate master data and create a second, silently diverging copy of records this model has no authority to maintain."
              },
