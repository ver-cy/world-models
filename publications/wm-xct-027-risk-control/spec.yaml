  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "The adopting Dimension must designate one accountable owner package for WM-XCT-027 records, name the responsible party in AGENTS.md, and keep that designation current; the mixin does not create or maintain party records itself.",
        "The owner package must publish the versioned authority threshold table mapping residual severity bands to required authority levels, and the incompatible-duty pair set, before any binding may reach an accepted state.",
        "The owner package must declare, with a resolvable identifier and version for each, the risk register, control catalogue, criteria and scale source, party registry, evidence store, authorization model, audit trail model and retention schedule that it binds to.",
        "The owner package must declare the regional and sector profiles in force, their effective periods, and the precedence rule applied when two profiles conflict on the same field.",
        "The owner package must nominate an independent review function that is not accountable for designing or operating the controls it reviews, and record the basis of that independence."
      ],
      "namespace_guidance": "Local identifiers are lower-kebab-case and stable for the life of the record. The adopting Dimension issues one namespace per owner package and qualifies every code value as namespace plus code plus version, so that a severity band, assurance level, governance line or sensitivity label is never interpreted against the wrong vocabulary. External identifiers are carried verbatim in their own namespace and are never rewritten into local form. Namespaces must not encode dates, environments or storage technology.",
      "registry_links": [
        "The model is registered as vr.wm-xct-027 with model identifier WM-XCT-027, entry kind mixin, under parent WM-KNW-015.",
        "Each referenced external vocabulary is registered with its publisher identifier, version and retrieval URL, including the control catalogue, the provenance ontology, the assessment exchange schema and the sensitivity label vocabulary.",
        "Each declared regional or sector profile is registered with its jurisdiction or sector scope, effective period and issuing authority."
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Serialise with deterministic member ordering and no insignificant whitespace before computing any digest; the digest is taken over the canonical form, not over a storage projection.",
        "Express every time value in RFC 3339 form with seconds and an explicit offset, preserving the originally recorded offset rather than normalising it away; a separate normalised UTC value may be derived but is never the canonical value.",
        "Represent code values as namespace-qualified strings with an explicit vocabulary version; bare labels are not canonical.",
        "Use decimal representation with an explicit scale for scores and levels, without locale-dependent separators; ordinal bands are represented by their code, not by a rendered position.",
        "Represent absent optional values by omission rather than by an empty string, so that absence and emptiness are distinguishable."
      ],
      "patch_rules": [
        "Records in draft may be patched in place; records that have been reviewed, accepted or disclosed are append-only and are corrected by supersession.",
        "Every patch document must carry the base revision identifier and is rejected when that identifier does not match the current revision, providing optimistic concurrency.",
        "Patches touching an immutable field are rejected with an explicit reason code; immutable fields include the assertion instant, the asserting agent, the acted-on-behalf-of reference, the evidence digest set, the criteria binding and any authorization statement.",
        "A patch that would change a residual level, an acceptance or an assurance level requires the authority level applicable at the time of the patch, not the authority level used originally.",
        "Patches are idempotent under a caller-supplied idempotency key: replaying a key with the same base revision returns the original result without producing a second revision."
      ],
      "compatibility_rules": [
        "The mixin schema carries a semantic version; adding an optional field or an enumeration member is a minor change, while removing a field, narrowing cardinality, tightening a requirement or changing the meaning of an existing code is a major change.",
        "Consumers must ignore unknown optional fields and must not infer meaning from field order.",
        "A regional or sector profile may constrain the mixin, for example by making an optional field required or narrowing an enumeration, but may never relax a requirement of the base model.",
        "Deprecated fields remain readable for at least one major version and are marked with their replacement and the instant of deprecation.",
        "Exports declare the mixin version, the profile version and the target schema version, and state explicitly which fields could not be mapped."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier issued by the system of record that owns the host record and its risk-control binding, such as the GRC, ISMS or assurance register key, used verbatim and never rewritten.",
        "Governed global identifier or IRI from a normative registry or published namespace, such as a control catalogue IRI, a published risk register IRI or a governed assessment-result identifier.",
        "UUID or ULID assigned by the adopting Dimension, used only where neither of the preceding exists, and recorded together with the party and instant of assignment.",
        "A date, an assessment cycle label, a review period name, a version tag, a file name or a human-readable title is never an identifier and must not be used as one, alone or in combination."
      ],
      "timestamp_rule": "All time values are recorded as RFC 3339 date-time values that include seconds and an explicit numeric offset or the literal Z; local times without an offset, dates alone and implied time zones are rejected. Event time and observation or ingestion time are recorded in separate fields whenever they differ: the instant the assessed condition existed or the decision was taken is distinct from the instant the assertion was recorded in this model, and the two are never collapsed into one field. Where an assurance conclusion covers a period, the coverage period start and end are recorded separately from both the conclusion instant and the recording instant, and the currency clock declares which of these instants starts it.",
      "serial_naming_rule": "Serial artifacts - authorization statements, criteria binding records, assurance limitation statements, supersession records, reconciliation reports, evidence manifests, export packages and tombstones - are named as the binding identifier, then the artifact kind, then a zero-padded sequence number that increases monotonically within that binding and artifact kind. Sequence numbers are never reused after withdrawal, and a gap in the sequence must be explained by a retained withdrawal record rather than silently closed. Dates, cycle labels and environment names never appear in a serial name.",
      "integrity_rule": "Every artifact carries a cryptographic digest with an explicit algorithm identifier over its canonical form, the digest of the immediately preceding revision where one exists, and the identifier of the asserting agent. Evidence references carry the digest of the referenced object as observed at assertion time together with that observation instant. A digest mismatch on any referenced evidence item, or on a preceding revision, invalidates the currency of the affected assertion and forces reassessment before further reliance; the mismatch is recorded here and reported, while remediation of the underlying store and the audit trail of the detection are owned by the referenced evidence and audit models."
    },
    "policies": [
      "Correction is by supersession, never by silent mutation: any assertion that has been reviewed, accepted or disclosed is retained in full for its retention period alongside its successor and the reason for correction.",
      "No party may both assert and independently review the same binding, and no party may both operate a control and accept the residual risk that control is asserted to reduce, unless a time-bounded override has been granted by an authority above both roles and recorded with a compensating condition.",
      "Residual risk may be accepted only by a party holding the authority level that the in-force threshold table assigns to the residual band, and the table version used is recorded with the acceptance so that later re-validation is possible.",
      "An assertion whose evidence fails digest verification, whose referenced risk or control has been retired, or whose validity window has elapsed is marked not current and may not be cited as the basis of a new acceptance until reassessed.",
      "Sensitivity labels are assigned at the level of the individual element as well as the record, and every output carries the label of the most restrictive element it contains; the party releasing information is responsible for ensuring the recipient can follow the handling rules.",
      "This model declares governance parameters and records governance decisions about its own content; it never evaluates access at runtime, never enforces a policy, never owns the audit trail, and never executes destruction of records.",
      "Machine-generated assertions are labelled as such and may not be relied upon at an assurance level above that permitted by the profile in force without a recorded human review."
    ],
    "crud": {
      "read": [
        "Read is scoped by sensitivity label and disclosure profile: a principal receives the field projection its audience is entitled to, and fields outside that projection are omitted rather than nulled, so that absence is not mistaken for an assessed value.",
        "Every read of an assertion returns its revision identifier, currency status and superseded-by reference where present, so that a consumer cannot silently rely on a stale or corrected conclusion.",
        "Reading a superseded or expired assertion is permitted and returns it clearly marked; reading is never blocked merely because a record is not current.",
        "Reads that resolve to a tombstone return the tombstone rather than an error, so that inbound references remain resolvable after disposition.",
        "Bulk reads and exports are subject to the export function's profile checks; a bulk read is not a route around field-level disclosure rules."
      ],
      "create": [
        "A binding is created in draft state with, at minimum, a resolvable host reference, a resolvable risk reference, at least one control reference or an explicit statement that the treatment is acceptance without control, a risk owner reference and the asserting agent and instant.",
        "Creation requires the identifier to be taken from the identity priority order; a Dimension-assigned UUID or ULID is used only where no master-system or governed identifier exists, and the assignment is recorded.",
        "Creation is idempotent under a caller-supplied idempotency key: replaying the key returns the originally created binding rather than a duplicate.",
        "A binding may not be created in an accepted state; acceptance is a separate authorised transition so that authority and assertion remain separable.",
        "Creation that would duplicate an existing active binding between the same risk and control on the same host is rejected unless a declared discriminator distinguishes them."
      ],
      "update": [
        "Updates carry the base revision identifier and are rejected on mismatch; concurrent writers receive an explicit conflict result rather than a last-writer-wins outcome.",
        "Draft records may be updated in place; reviewed, accepted or disclosed records are append-only and are changed only through the supersession function.",
        "Changing a control linkage, residual level, criteria binding or acceptance requires re-authorisation at the currently applicable authority level and resets the currency status pending review.",
        "Unlinking a control from a risk is an update that must record the reason and the resulting residual level, and never removes the historical assertion that the linkage once existed.",
        "Updates never rewrite provenance, evidence digests or prior authorization statements; an attempt to do so is rejected with an explicit reason code."
      ],
      "delete": [
        "Assertions that have been reviewed, accepted or disclosed are never hard-deleted from this model; they are withdrawn or superseded and remain readable until their retention period ends.",
        "Disposition eligibility is computed from the retention schedule reference, the retention clock start and the absence of any active legal hold; the computed eligibility is advisory input to the owning records capability and is not itself an instruction to destroy anything.",
        "Execution of destruction or erasure is owned by the referenced records retention and disposition model together with the adopting Dimension's records policy; this model issues a disposition request, records the confirmation returned to it, and never performs or claims to have performed the destruction.",
        "An active legal hold suspends all disposition for the held binding and its evidence manifest until the hold is released in writing by the party authorised under the adopting Dimension's records policy; application and release are recorded with RFC 3339 instants and the authorising party reference.",
        "On confirmed disposition a tombstone is retained containing only the binding identifier, host record reference, terminal state, disposition authority reference, disposition instant and the digest of the disposed record; risk statements, control descriptions, evidence content and free-text conclusions must not survive in the tombstone.",
        "Draft assertions never submitted for review may be hard-deleted by their author, provided no external consumer has read them and no hold applies; the deletion is emitted as an event to the referenced audit trail model, whose retention this model does not own.",
        "Erasure requests arising from data-protection law are routed to the adopting Dimension's privacy policy owner; this model records the request reference and the resulting field-level suppression, and does not adjudicate the request or determine its lawful outcome."
      ]
