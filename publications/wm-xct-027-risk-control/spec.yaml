    "adversarial_checks": [
      "Entry-kind challenge, recorded for adjudication: relationship was tested as an alternative subject kind. A relationship entry would give each risk-to-control link its own identity, which genuinely suits relied-on-control attribution and residual change explanation, both of which are n-ary link attributes. It fails for the remaining required content - assessment scope, horizon, criteria pin, likelihood and consequence dimensions, uncertainty, appetite comparison - which are properties of an assessment context attached to a host record rather than of a single link, and one context routinely cites many controls and many consequences. mixin is retained; a Dimension may reify the control-reliance attribution as a separate association record without altering this field group.",
      "Ownership-leak sweep: every bundle, layer, finding, data element and function was re-read against each composition rationale and boundary note. Control effectiveness is cited and never determined; acceptance and authorization are referenced and never granted; observation capture, evidence collection and audit-log retention are delegated with the delegation stated in the audit requirements themselves; risk entity status transitions appear nowhere; no function evaluates, executes or enforces anything.",
      "Universal-matrix check: no five-by-five grid, fixed likelihood band, default impact scale or scoring formula appears anywhere in the structure. Qualitative, ordinal, semi-quantitative, quantitative, probabilistic, scenario-based and multi-dimensional expressions are all admitted through an expression-mode field plus a resolvable scale reference, and prohibited operations are derived from the declared scale type.",
      "Counterexample search: three awkward cases were tested against the field group. A quantitative frequency-and-magnitude analysis producing a distribution is representable through distribution parameters and quantitative units. A purely qualitative safety hazard judgement with no inherent estimate is representable because the inherent estimate is optional with a required omission ground. A scenario-set assessment with no single headline likelihood is representable through scenario identifiers, per-scenario estimates and an explicit reference-case designation. A fourth case, an assessment relying on a control with no current effectiveness determination, drove the reliance-without-determination flag.",
      "Aggregation trap: the structure deliberately refuses to define a roll-up algorithm even though enterprise staging guidance encourages a single profile. The comparability function returns a verdict, the mismatched pins and a caveat set, and leaves construction of any aggregate to the enterprise reporting model. This is the most likely point of pressure from adopters wanting a single enterprise number.",
      "Date-as-identifier check: no identifier field, serial naming rule or artifact identity strategy uses an assessment date, review cycle, fiscal period or version label as an identifier; the serial rule explicitly excludes date, period and cycle components and forbids reuse of retired sequence values.",
      "Inline-versus-artifact audit: eleven findings are inline because they are reference, pin, dimension or verdict fields that must stay inseparable from the values they qualify; the two findings that declare artifacts do so for genuinely separable documents - a pinned criteria and method record and the basis and derivation records - and no finding carries both artifacts and a rationale.",
      "Documentation is not effectiveness. A complete policy, procedure, design description or control catalogue entry sets no effectiveness field; a conclusion requires at least one verified assessment or evidence binding. The Basel Committee's own review finding that several operational-risk principles had not been adequately implemented, despite being published, is the counterexample this rule encodes.",
      "A framework crosswalk is not conformance. Mapping this control to an entry in another catalogue sets only crosswalk fields with a mandatory non-conformance disclaimer, and can never set applicability, implementation status or effectiveness.",
      "Absence of incidents is not evidence. No field permits an effectiveness conclusion derived from a zero incident count, a clean loss record or an uneventful period; incident and loss records are explicitly out of scope and are not a permitted conclusion basis.",
      "Design adequacy does not imply operation. A control can be adequately designed and not implemented, implemented and not operating, or operating and never tested. Four independent status fields plus a separate conclusion prevent any collapse, and no function derives one from another.",
      "Ownership creep audit. Every bundle, layer, finding and function was compared against each boundary note and composition link. No node stores catalogue text, policy text, configuration state, test cases, test results, evidence payloads, remediation workflow states or audit-trail records. References to a runtime evaluator, an enforcement engine or an audit record confer no evaluation, execution, enforcement or trail semantics here; the operating-cadence finding declares expected cadence and consumes observed counts by reference only, and audit requirements emit to the audit model while retaining only the emission reference.",
      "Stale-conclusion audit. An expired conclusion cannot masquerade as current: read returns an explicit expired marker, the residual contribution is suspended, and patching an expired conclusion is forbidden so that a fresh basis must be produced.",
      "Identifier audit. No local identifier, in any bundle, layer, finding, question, data element, artifact or function, encodes a date, a status, a period or a framework code, so records cannot be silently re-keyed or invalidated when a framework version or reporting period changes.",
      "Vocabulary-merge audit. Conflicting external status and outcome scales are never coerced into one internal scale; every coded value carries its vocabulary identifier and version, and consumers must fail closed rather than default an unknown value to applicable, implemented or effective.",
      "Tested whether this mixin quietly acquires ownership of runtime authorization: the authorization function was restricted to deciding admissibility of writes to this model's own records, with evaluation and enforcement moved to a composition reference and recorded in the boundary notes, and the duty-separation finding was made inline specifically to avoid creating a competing rule store.",
      "Tested whether audit-trail semantics were being absorbed: all audit language was rewritten as emission of events to a referenced model, with an explicit statement that record structure, immutability, query and audit retention are not owned here and that the model retains only references.",
      "Tested whether deletion ownership was overclaimed: the disposition function now produces an advisory eligibility verdict and a request, and the delete rules name the referenced records model and the adopting Dimension's records policy as the owners of execution.",
      "Tested whether a standalone risk or control lifecycle was smuggled in: state and currency findings were rewritten as host-scoped obligations, and the inline-only rationale for the state finding records why no separate lifecycle artifact exists.",
      "Searched for a counterexample to the claim that residual risk always has a single accepting authority: risks accepted jointly across entities, and inherited third-party controls where the accepting party cannot compel the operator, both break it. The criteria-conflict and inherited-reliance questions were added so the model records the divergence instead of forcing a single verdict.",
      "Tested whether attractive but unsupported structure had been added: a quantitative residual-reduction scale and a control maturity ladder were rejected because no consulted primary source defines a portable scale, and the absence is recorded as a checklist gap rather than filled with plausible invention.",
      "Tested the artifact-versus-inline split for convenience bias: findings were forced to justify inline status on ownership grounds rather than on brevity, which moved provenance, profiles and duty separation to inline with explicit rationales while leaving artifacts only where this model genuinely authors a durable, citable output."
    ]
