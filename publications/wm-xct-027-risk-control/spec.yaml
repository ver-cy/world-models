    "conflicts": [
      "Inherent or gross risk is not uniformly defined. Some frameworks exclude all controls, others exclude only the controls under assessment, and some public-authority guidance does not require an inherent estimate at all. The model therefore requires an explicit inherent-definition statement and a documented omission ground rather than assuming any single reading.",
      "Risk appetite and risk tolerance are used interchangeably in parts of the guidance landscape and as distinct constructs elsewhere, with NIST IR 8286A treating tolerance as the expressed, measurable bound and HM Treasury guidance leading with appetite. The model stores a versioned reference and an outcome rather than adopting one vocabulary.",
      "OSCAL expresses residual risk as an adjusted characterization facet state rather than as a separate residual field, which conflicts with register-style models that hold inherent and residual as parallel columns. The model supports both by pairing a role-tagged estimate with a characterization state.",
      "Risk as the effect of uncertainty on objectives admits positive effects, whereas the NIST information-security risk model and the Open FAIR taxonomy are loss-oriented. The effect-polarity field records which reading is in force rather than forcing reconciliation.",
      "Semi-quantitative ordinal scores are routinely multiplied and averaged in practice although ordinal scales do not support arithmetic. The model stores scale-referenced codes and refuses implicit arithmetic, which conflicts with common matrix tooling and will require projection-level accommodation.",
      "Enterprise roll-up guidance encourages staging registers into a single profile, while measurement guidance warns that risks are not uniformly measurable. The model resolves this in favour of an explicit comparability gate and non-strippable caveats rather than an unsupported normalization rule.",
      "Assessment-outcome vocabularies conflict across sources: NIST SP 800-53A resolves determinations to satisfied or other than satisfied, PCAOB AS 2201 grades design and operating deficiencies as deficiency, significant deficiency or material weakness, and the NCSC CAF uses achieved, partially achieved or not achieved. The model stores the conclusion with its vocabulary identifier and version rather than forcing one scale.",
      "Implementation-status vocabularies differ: the OSCAL system security plan by-component uses implemented, partial, planned and not applicable, while PCI DSS distinguishes a compensating control from a customized approach and forbids combining them for the same requirement. Both are carried as source-qualified codes with no silent merge.",
      "The term compensating control carries two incompatible senses. NIST defines it as an alternative to a baseline control giving equivalent or comparable protection, whereas PCAOB treats it as a control that mitigates an identified deficiency at a level of precision sufficient to prevent or detect a material misstatement. The model requires an explicit sense code on every compensating control reference.",
      "GAO-14-704G (September 2014) is superseded by GAO-25-107721 (15 May 2025, effective fiscal year 2026). Both were consulted; the newer edition governs where they differ, and the older is cited only for the preventive-versus-detective distinction and the integrated-operation criterion whose full text was retrievable.",
      "CSF 2.0 informative references and OSCAL crosswalks are alignments, yet adopters commonly present mapping tables as conformance or assurance evidence. The model rejects this inference and enforces it with a mandatory non-conformance disclaimer field.",
      "Control frequency has two distinct meanings that are often conflated: the cadence at which a control operates and the cadence at which it is assessed. SP 800-137 governs the latter and OSCAL task timing can express either; the model separates operating frequency from assessment timing into different findings.",
      "Retention obligations conflict across regimes: a ten-year documentation-retention duty for high-risk AI documentation can outlast a shorter organisational schedule and can collide with data-protection erasure duties where the binding contains personal data. The model records both references and the resulting suppression but does not adjudicate precedence, which is left to the adopting Dimension's records and privacy owners.",
      "Independence expectations differ: internal-audit independence as described by the professional body is organisational, while auditing and attestation standards impose a formal conceptual framework of threats and safeguards. A reviewer independent enough for internal purposes may not meet the external threshold, so the independence basis is recorded as a code rather than a boolean.",
      "Justification practice for control inclusion diverges: some certification practice accepts a single blanket justification that all included controls were identified as necessary by the risk assessment, while exclusions must be individually justified. This asymmetry is preserved rather than normalised.",
      "Sensitivity labelling regimes conflict where a published community label vocabulary meets a national classification scheme; the model carries the label vocabulary and version but cannot map between them without a jurisdiction-specific profile.",
      "Assessment-results exchange models treat a finding as an output of a time-boxed engagement, whereas this mixin treats the binding as durable state on a host. Round-tripping is therefore lossy in both directions and must be declared as such."
    ],
    "regional_assumptions": [
      "HM Treasury Orange Book material is UK central-government guidance; its category list, assurance construct and three-lines role separation are treated as one adoptable projection, not a universal taxonomy.",
      "NIST publications are US federal guidance; their register field sets, risk model components and framework steps are alignment targets rather than obligations outside that context.",
      "The EU AI Act residual-risk acceptability requirement applies only to high-risk AI systems in EU scope, with the referenced provisions applying from 2 December 2027 and 2 August 2028 for the respective categories; it is modelled as a scoped legal projection and not generalized.",
      "Currency, monetary impact bands, fiscal-year horizons and working-day conventions are jurisdiction- and Dimension-specific and are carried as unit and scale references rather than fixed values.",
      "Data-protection constraints on affected-party and narrative consequence fields vary by jurisdiction; the redaction rule delegates to the adopting Dimension's privacy policy rather than assuming one regime.",
      "Retention periods, assessor independence requirements and management attestation duties are jurisdiction-specific. The model records a retention class and an independence flag but adopts no jurisdiction's schedule or threshold.",
      "PCAOB AS 2201 and the GAO Green Book are United States sources whose deficiency-severity ladder and internal-control criteria are offered as one selectable vocabulary, not as the default for all adopters.",
      "The NCSC Cyber Assessment Framework is a United Kingdom framework aimed at essential services and critical national infrastructure; its three-value outcome scale is offered as a selectable vocabulary rather than a global standard.",
