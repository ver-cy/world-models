  "model": {
    "registry_id": "vr.wm-xct-027",
    "model_id": "WM-XCT-027",
    "name": "Risk / Control",
    "entry_kind": "mixin",
    "purpose": "Provide an embeddable field group that binds one risk assessment context to a referenced risk, links it to referenced controls and their cited effectiveness determinations, and explains the residual position against referenced appetite or tolerance, without owning the risk entity, the control register or any treatment workflow.",
    "scope_statement": "WM-XCT-027 is a mixin: a reusable set of fields attached to a host record so that record can carry a defensible, revision-pinned risk assessment context. It owns the reference and binding fields (risk reference and exact revision, objective/asset/process/context anchors, source-event-consequence anchors), the pinned assessment frame (category and taxonomy pins, scope, exclusions, time horizon, criteria set, method and technique with versions, expression mode), the estimate slots (likelihood and consequence dimension declarations, inherent estimate with its exclusion statement, residual estimate with change explanation), the evidential basis (assumptions, information sources, data currency, estimation basis kind, uncertainty and confidence qualification), the control-linkage references (relied-on control references and the effectiveness determinations cited for them), the governance stamps at assessment-context level (assessor, context owner, reviewer and acceptance-decision references, review-due timing), and the comparability surface (comparability verdicts, aggregation caveats, scenario dependence). It does not evaluate controls, does not run assessments, does not set or enforce appetite, does not grant acceptance or authorization, and does not define the internals of any pinned technique. Storage and interface are projections: the same field semantics must survive JSON, YAML, Markdown, HTML, Git, MCP and MongoDB representations.",
    "in_scope": [
      "Reference to one risk or opportunity entity together with an exact revision or version pin of the assessed statement.",
      "Anchor references the assessment is scoped against: objectives, assets, processes, organizational units, contextual conditions and applicable jurisdiction or site.",
      "Causal-chain references: risk source or threat source, the event or event class quantified, and the consequences included or explicitly excluded.",
      "Category values with an explicit taxonomy scheme identifier and version pin.",
      "Assessment scope statement, exclusions, likelihood time horizon, as-of time of the assessed state, recording time and validity or review-due time.",
      "Criteria set, assessment method and technique pins with their versions, plus the expression mode (qualitative, ordinal, semi-quantitative, quantitative, probabilistic, scenario-based).",
      "Likelihood and consequence dimension declarations with units, scale references, distribution parameters and support for multi-dimensional impact.",
      "Inherent (pre-control) estimate together with an explicit statement of what 'inherent' excluded in this context, or a documented ground for omitting it.",
      "Assumptions, information sources, data currency, estimation basis kind, analysis constraints and identification of critical assumptions.",
      "Uncertainty representation, confidence or data-quality grading, unmeasurable aspects and precision caveats.",
      "Control linkage: references to the controls relied on and to the effectiveness determinations cited for them, produced by the owning control assessment model.",
      "Residual (post-control) estimate, the characterization state marking it as adjusted rather than initial, the changed-dimension set and the explanation of change.",
      "References to the appetite or tolerance statement in force and the recorded outcome of comparing the residual estimate against it.",
      "Assessment-context governance stamps: assessor, context owner, reviewer and acceptance-decision references, and review-due timing.",
      "Comparability verdicts, mismatched-pin reporting, aggregation caveats, scenario identifiers and reference-case designation."
    ],
    "out_of_scope": [
      "The risk or opportunity entity itself: its identity, statement, status, register membership and lifecycle transitions.",
      "The control register: control identity, design, implementation records, control ownership and control lifecycle.",
      "Evaluation or testing of control design or operating effectiveness and the production of effectiveness determinations.",
      "Risk treatment options, treatment plans, milestones, remediation tracking, plan-of-action records and closure.",
      "Incidents, realized loss events, issues, near misses and post-event investigation.",
      "Objective, asset, process and organizational-unit master data.",
      "Setting, approving, publishing or enforcing risk appetite and tolerance thresholds.",
      "Granting acceptance, authorization or exception decisions on a residual position.",
      "Assessment execution, observation capture and evidence collection procedures.",
      "Audit-trail storage, log integrity and retention execution.",
      "Technique internals and algorithm semantics of any pinned method, including simulation, fault-tree, event-tree and Bayesian computation.",
      "Any fixed numeric risk matrix, default likelihood band, default impact scale or universal scoring rule.",
      "Runtime evaluation or enforcement of thresholds by a policy engine."
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-KNW-015 risk / opportunity entity and lifecycle",
        "distinction": "The parent model owns risk identity, statement, register status and lifecycle. This mixin attaches one assessment context to a pinned revision of that entity, carries no risk status transitions, and marks its own binding as stale when the pinned revision is superseded upstream.",
        "source_refs": [
          "SRC-002",
          "SRC-007"
        ]
      },
      {
        "neighbor": "Control implementation records and control assessment determinations",
        "distinction": "This mixin stores control references and cites effectiveness determinations by reference; determining, testing or re-opening effectiveness belongs to the control assessment model, where assessment objectives, methods and satisfied / other-than-satisfied determinations are produced.",
        "source_refs": [
          "SRC-005",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Risk treatment, remediation and plan-of-action records",
        "distinction": "A residual estimate is an input to treatment planning. Treatment option selection, milestones, scheduling, cost tracking and closure are owned by the treatment model and are not represented here.",
        "source_refs": [
          "SRC-002",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Assessment execution, observation and evidence records",
        "distinction": "Observations and evidence are cited as the basis of an estimate. Collecting evidence, executing assessment procedures and logging assessment results are owned by the assessment-results model; this mixin holds references and a basis statement only.",
        "source_refs": [
          "SRC-005",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Risk appetite and tolerance governance",
        "distinction": "The mixin references a versioned tolerance statement and records the comparison outcome. Determining appetite, approving tolerance lines and enforcing them are enterprise governance acts held elsewhere.",
        "source_refs": [
          "SRC-003",
          "SRC-007",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Acceptance, authorization and exception decisions",
        "distinction": "Accepting a residual position is an authorization act performed by a designated official and recorded in an authorization or decision model. This mixin carries only a reference to that decision and never grants, derives or enforces it.",
        "source_refs": [
          "SRC-011",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Incident, loss event and issue records",
        "distinction": "A realized event is not an assessment. Loss data may be cited as an information source for an estimate, but event records, their timelines and their consequences are owned by event models.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Risk assessment technique definitions (IEC 31010 technique catalogue and comparable method registries)",
        "distinction": "The mixin pins which technique and version were applied and stores the technique's declared outputs. It never restates, parameterizes or re-implements the technique's internal semantics.",
        "source_refs": [
          "SRC-008",
          "SRC-001"
        ]
      },
      {
        "neighbor": "Alternative subject kind: relationship (a first-class risk-to-control association)",
        "distinction": "Modelling this as a relationship was tested. A relationship entry would give each risk-control link its own identity, which suits relied-on-control attribution. It fails for the rest of the required content: assessment scope, horizon, criteria pin, likelihood and consequence dimensions, uncertainty and appetite comparison are properties of an assessment context attached to a host record, and one context routinely cites many controls and many consequences. The mixin kind is retained; the residual-change attribution is the part a Dimension may legitimately reify as a separate association record without altering this field group.",
        "source_refs": [
          "SRC-005",
          "SRC-002",
          "SRC-007"
        ]
      }
    ]
  },
