                "name": "Objective, asset, process and context anchors",
                "description": "Records what the risk is assessed against - objectives, assets, processes, organizational units, fixed contextual conditions and applicable jurisdiction or site - as references, so the estimate is interpretable and comparable only within its declared anchor set. Master data for each anchor belongs to its own registry.",
