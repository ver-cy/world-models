    {
      "target": "WM-KNW-015 - Risk / Opportunity entity and lifecycle",
      "relation": "CHILD",
      "purpose": "The parent model owns risk identity, statement, register membership, status and lifecycle transitions. This mixin attaches one assessment context to a pinned revision of that entity, carries only its own binding validity state, and reproduces no risk lifecycle or register operations.",
      "required": true,
      "source_refs": [
        "SRC-002",
        "SRC-007"
      ]
    },
    {
      "target": "Host record of the adopting Dimension that carries risk-control linkage fields",
      "relation": "MIX-IN",
      "purpose": "Defines how this field group is embedded on a host entity, event or decision record so a Dimension can carry a defensible assessment context without standing up a separate register.",
      "required": true,
      "source_refs": [
        "SRC-002",
        "SRC-005"
      ]
    },
    {
      "target": "Control implementation and control assessment records (control register, implemented requirements, effectiveness determinations)",
      "relation": "REFERENCE",
      "purpose": "Supplies control identity, implementation statements and effectiveness determinations that the residual estimate cites. Assessment procedures, objectives, methods and the production of determinations remain wholly with that model; this mixin carries only the reference and the reliance parameters specific to this assessment.",
      "required": true,
      "source_refs": [
        "SRC-005",
        "SRC-006"
      ]
    },
    {
      "target": "Risk criteria and assessment-method registry (criteria sets, scales, thresholds, technique definitions)",
      "relation": "REFERENCE",
      "purpose": "Supplies the versioned criteria scales and technique definitions that this mixin pins. The mixin stores the pin, the version token and the expression mode; it never defines, parameterizes or re-implements technique semantics.",
      "required": true,
      "source_refs": [
        "SRC-008",
        "SRC-001"
      ]
    },
    {
      "target": "Risk appetite and tolerance statements",
