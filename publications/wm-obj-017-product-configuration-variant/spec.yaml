    "entry_kind": "aggregate",
    "purpose": "Describe a reusable configured product definition between product family and physical instance, including selections, qualified direct properties, capabilities and contextual evidence.",
    "scope_statement": "The aggregate owns a versioned partial, resolved or released configuration definition and its selected-feature assertions, rule/evaluation bindings, nominal properties, lifecycle and mappings. The whole family option space, design, BOM, item, session, offer and order remain external masters.",
    "in_scope": [
      "Definition identity, scoped aliases, selections, rules and reproducible evaluation evidence",
      "Nominal physical properties, recognition features, capabilities and explicit use limits",
      "Design/BOM links, effectivity, release, stewardship and loss-aware interchange"
    ],
    "out_of_scope": [
      "Owning the full product family, solver implementation, engineering design, BOM, item instance, inventory, offer, order or session lifecycle",
      "Automatic physical operation, certification, undisclosed customer data transfer or execution of imported rule code"
    ],
