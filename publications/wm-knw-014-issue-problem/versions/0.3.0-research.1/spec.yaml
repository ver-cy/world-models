  "model": {
    "registry_id": "vr.wm-knw-014",
    "model_id": "WM-KNW-014",
    "name": "Issue / Problem",
    "entry_kind": "aggregate",
    "purpose": "Give an agent the format-neutral context needed to recognize, record, classify, analyse, relate, govern and hand off a recognized discrepancy between an observed state and a required or expected state, without owning the work, change, enforcement or audit trail that resolves it.",
    "scope_statement": "An Issue / Problem record asserts that some observed state of a subject diverges from a stated expectation (requirement, specification, norm, target or design intent) and that the divergence is recognized as needing disposition. The model covers the discrepancy assertion itself, its identity, classification and grading, its recognition context in time and place, its evidence and provenance, its impact and causal analysis, its lifecycle states and disposition, its relationships to other issues and subjects, and the governance, confidentiality, assurance and retention context of the record. It deliberately stops at the boundary of the work: corrective and preventive actions, changes, incident response execution, verification execution, enforcement and audit trails are referenced, never reproduced. The model is storage- and interface-neutral: tracker rows, occurrence databases, nonconformance reports, SARIF results, Markdown files and MongoDB documents are projections of the same semantics.",
    "in_scope": [
      "Assertion of a discrepancy: observed state, expected state and the reference norm or requirement against which the divergence is judged",
      "Identity of the issue record, duplicate resolution, merge/canonical selection and correspondence with identifiers in other systems",
      "Typology and grading: issue type, category codes, severity, priority, urgency and assessed impact",
      "Recognition context: who or what detected the discrepancy, through which channel, under which environment and configuration",
      "Separated time anchors for occurrence, detection, report submission and record ingestion",
      "Evidence set, reproducibility and the provenance and confidence of every asserted claim on the record",
      "Extent of impact, affected subjects, occurrence aggregation and recurrence semantics",
      "Causal analysis outcomes: hypothesis, proximate and root cause, contributing factors, and known-error designation",
      "Documented workaround and mitigation knowledge held as knowledge, not as executed work",
      "Lifecycle states, permitted transitions, triage acceptance, disposition categories and closure criteria",
      "Relationships between issues and to incidents, requirements, assets, tests, actions and changes",
      "Governance context: accountable roles, competent decision authority, waiver/concession reference, sensitivity, reporter protection, retention class and hold status",
      "Interoperability crosswalks to external issue, defect, nonconformance and occurrence vocabularies"
    ],
    "out_of_scope": [
      "Execution, scheduling and tracking of corrective, preventive or containment actions, which belong to the action/work model referenced as parent WM-ACT-021",
      "Change request implementation and release semantics, which belong to a change model aligned to OSLC Change Management",
      "Incident detection, triage and response operations, which belong to an incident/occurrence model",
      "Risk identification, analysis and treatment for events that have not been realized",
      "Runtime evaluation or enforcement of validation rules, routing rules or policy: this model declares constraints, an external evaluator or engine applies them",
      "Audit-trail generation and retention of who did what to the record, which belongs to the adopting Dimension's audit-log service",
      "Governance of classification schemes, taxonomies and code lists themselves (for example ADREP/ECCAIRS, CWE); this model binds to them",
      "Verification and validation execution proving an action was effective; only the reference and acceptance status are carried",
      "Physical or logical deletion execution and destruction certification, which belongs to a records retention and disposition model",
      "Party, organization and role master data",
      "Specification, requirement and norm authoring and versioning",
      "Security vulnerability enumeration, scoring and coordinated disclosure workflow, which is a specialized sibling model"
    ],
    "boundary_notes": [
      {
        "neighbor": "Incident / occurrence event",
        "distinction": "An incident is an unplanned event or interruption that occurred at a point in time; an issue is the recognized discrepancy that one or more incidents may evidence. NIST SP 800-61r3 scopes incident response as an operational cycle inside cybersecurity risk management, and Regulation (EU) No 376/2014 treats an occurrence report as an event record with its own transmission deadlines. The issue record references occurrences; it does not carry their response lifecycle.",
        "source_refs": [
          "SRC-006",
          "SRC-008"
        ]
      },
      {
        "neighbor": "Risk register entry",
        "distinction": "A risk is an unrealized possibility carried for treatment; an issue is a recognized, already-observed divergence. Regulation (EU) No 376/2014 applies a safety risk classification to occurrences that have already happened, which shows risk scoring can be an attribute of an issue without making the issue a risk. Forward-looking likelihood modelling stays in the risk model.",
        "source_refs": [
          "SRC-006",
          "SRC-008"
        ]
      },
      {
        "neighbor": "Corrective and preventive action (CAPA)",
        "distinction": "21 CFR 820.100 separates investigating the cause of nonconformities from identifying, implementing and verifying the action. The issue owns the discrepancy, the investigation outcome and the disposition decision context; the action model owns action definition, execution and effectiveness verification. The issue carries only the reference and the acceptance status.",
        "source_refs": [
          "SRC-007"
        ]
      },
      {
        "neighbor": "Change request / work item (parent WM-ACT-021)",
        "distinction": "OSLC Change Management models ChangeRequest, Task and ReviewTask as trackable executable activities with their own state predicates. Assignment, effort, scheduling and workflow execution belong there. This model retains the discrepancy semantics and links to the change request rather than duplicating its workflow.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Requirement / specification / norm",
        "distinction": "The expected state that makes a discrepancy a discrepancy is authored and versioned elsewhere. The issue carries a resolvable reference to the norm clause and the norm version in force at recognition time, not the norm text.",
        "source_refs": [
          "SRC-007",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Evidence, observation and measurement records",
        "distinction": "Tool runs, logs, samples, images and measurement results are entities with their own provenance. SARIF models a result inside a run with its own artifact and provenance objects. The issue references evidence and states its sufficiency; it does not become the evidence store.",
        "source_refs": [
          "SRC-003",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Security vulnerability record",
        "distinction": "A vulnerability is a specialized weakness class with registry-governed identifiers, scoring systems and coordinated disclosure states. It behaves as a specialization of an issue but carries machinery this generic model must not absorb; SARIF keeps taxonomy membership in taxa references rather than in the result itself.",
        "source_refs": [
          "SRC-003"
        ]
      },
      {
        "neighbor": "Records retention and disposition policy",
        "distinction": "Regulation (EU) No 376/2014 places retention, de-identification and repository transfer duties on designated bodies. This model declares the retention class, hold state and tombstone marker on its own records but does not own destruction execution or certification.",
        "source_refs": [
          "SRC-006",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Classification scheme / taxonomy registry",
        "distinction": "ADREP/ECCAIRS compatibility is mandated for aviation occurrence systems and SARIF results point at external taxa. Code list governance, versioning and deprecation stay in the classifier registry; the issue binds a code plus the scheme identifier and version.",
        "source_refs": [
          "SRC-003",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Complaint or customer feedback record",
        "distinction": "21 CFR 820.100 lists complaints as one of several quality data sources analysed to detect nonconformities. A complaint is an intake channel artifact; it may cause an issue to be registered but is not itself the issue.",
        "source_refs": [
          "SRC-007"
        ]
      }
    ]
  },
