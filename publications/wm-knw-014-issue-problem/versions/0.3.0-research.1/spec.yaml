  "structure": {
    "bundles": [
      {
        "id": "issue-definition-and-identity",
        "name": "Discrepancy definition, identity and classification",
        "description": "Establishes what the record asserts, how it is uniquely and stably identified across systems and duplicates, and how it is typed and graded.",
        "rationale": "Every downstream use — triage, causal analysis, aggregation, exchange — depends on an unambiguous statement of the divergence and a stable identifier. Both OSLC CM and SARIF treat identity, type and severity/level as first-class, separable properties of the reporting item rather than derived text.",
        "source_refs": [
          "SRC-001",
          "SRC-003",
          "SRC-009",
          "SRC-011"
        ],
        "layers": [
          {
            "id": "discrepancy-definition",
            "name": "Discrepancy assertion and record identity",
            "description": "The propositional content of the issue — observed versus expected against a named norm — and the identity apparatus that keeps the record addressable and de-duplicated.",
            "source_refs": [
              "SRC-003",
              "SRC-007",
              "SRC-009",
              "SRC-011"
            ],
            "findings": [
              {
                "id": "discrepancy-statement",
                "name": "Observed state, expected state and reference norm",
                "description": "The atomic assertion that makes something an issue: what was observed, what was required or expected, which authored norm or requirement establishes the expectation, and the version of that norm in force when the divergence was recognized.",
                "source_refs": [
                  "SRC-007",
                  "SRC-009",
                  "SRC-003"
                ],
                "questions": [
                  {
                    "id": "q-ds-observed",
                    "text": "What observed state or behaviour is asserted, and in what terms is it expressed?",
                    "kind": "definition",
                    "answer_data": [
                      "Observed-state description in controlled prose",
                      "Measured or captured values with units where the divergence is quantitative"
                    ]
                  },
                  {
                    "id": "q-ds-expected",
                    "text": "What expected or required state is the observation being compared against?",
                    "kind": "requirement",
                    "answer_data": [
                      "Expected-state description",
                      "Acceptance threshold or tolerance where applicable"
                    ]
                  },
                  {
                    "id": "q-ds-norm",
                    "text": "Which authored requirement, specification or norm clause establishes that expectation, and which version of it was in force at recognition?",
                    "kind": "provenance",
                    "answer_data": [
                      "Resolvable reference to the norm or requirement clause",
                      "Norm version or edition identifier in force at recognition"
                    ]
                  },
                  {
                    "id": "q-ds-divergence",
                    "text": "Is the divergence asserted as a categorical failure to conform or as a quantified deviation?",
                    "kind": "classification",
                    "answer_data": [
                      "Divergence mode code (categorical or quantified)",
                      "Deviation magnitude and direction when quantified"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-observed-state",
                    "name": "observed_state",
                    "description": "Description of the state or behaviour actually encountered.",
                    "value_kind": "text",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-003",
                      "SRC-009"
                    ]
                  },
                  {
                    "id": "de-expected-state",
                    "name": "expected_state",
                    "description": "Description of the state required by the referenced norm or design intent.",
                    "value_kind": "text",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-007",
                      "SRC-009"
                    ]
                  },
                  {
                    "id": "de-norm-reference",
                    "name": "reference_norm_ref",
                    "description": "Resolvable reference to the requirement, specification or norm clause plus the version in force at recognition.",
                    "value_kind": "reference",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-007",
                      "SRC-009"
                    ]
                  },
                  {
                    "id": "de-deviation-magnitude",
                    "name": "deviation_magnitude",
                    "description": "Signed magnitude of the deviation with unit, present only for quantified divergences.",
                    "value_kind": "quantity",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-009"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "The discrepancy assertion is structured inline data on the record: three short fields plus a reference. Materializing it as a separate document would fragment the atomic claim and duplicate the norm text, which is authored and versioned by the requirement model."
              },
              {
                "id": "issue-record-identity",
                "name": "Issue identity, correlation and duplicate resolution",
                "description": "How the issue record is named, which identifier is authoritative, how correlation across runs and systems is achieved without conflating identity, and how duplicates are detected, merged and superseded.",
                "source_refs": [
                  "SRC-003",
                  "SRC-011",
                  "SRC-004",
                  "SRC-001"
                ],
                "questions": [
                  {
                    "id": "q-id-authoritative",
                    "text": "Which system of record issues the authoritative identifier for this issue, and what is that identifier?",
                    "kind": "identity",
                    "answer_data": [
                      "Master-system identifier value",
                      "Identifier-issuing system reference and namespace"
                    ]
                  },
                  {
                    "id": "q-id-correlation",
                    "text": "What stable correlation value lets the same discrepancy be recognized across repeated detections or tool runs?",
                    "kind": "identity",
                    "answer_data": [
                      "Correlation identifier or fingerprint value",
                      "Fingerprint algorithm name and version"
                    ]
                  },
                  {
                    "id": "q-id-duplicate",
                    "text": "On what criteria is another record judged a duplicate rather than a related or recurring issue?",
                    "kind": "constraint",
                    "answer_data": [
                      "Duplicate-decision criteria set",
                      "Comparison fields and matching tolerance"
                    ]
                  },
                  {
                    "id": "q-id-merge",
                    "text": "When records are merged, which record survives as canonical and how is the derivation of the retired record preserved?",
                    "kind": "provenance",
                    "answer_data": [
                      "Canonical record reference",
                      "Derivation link from retired to canonical record and merge justification"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-issue-id",
                    "name": "issue_identifier",
                    "description": "Authoritative identifier of the issue record, qualified by the issuing system namespace.",
                    "value_kind": "identifier",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-011",
                      "SRC-003"
                    ]
                  },
                  {
                    "id": "de-correlation-id",
                    "name": "correlation_identifier",
                    "description": "Stable value used to recognize logically equivalent detections across runs or systems, modelled on SARIF correlationGuid and fingerprints.",
                    "value_kind": "identifier",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-003"
                    ]
                  },
                  {
                    "id": "de-fingerprint",
                    "name": "partial_fingerprints",
                    "description": "Versioned named fingerprint values supporting more than one matching strategy.",
                    "value_kind": "collection",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-003"
                    ]
