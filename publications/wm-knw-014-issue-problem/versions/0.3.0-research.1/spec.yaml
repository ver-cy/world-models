  "functions": [
    {
      "id": "fn-register-issue",
      "name": "Register issue from an intake submission",
      "description": "Create an issue record from an intake submission, binding the observed and expected state, the reference norm, the intake channel and the separated time anchors, and assigning the authoritative identifier.",
      "inputs": [
        "Intake report submission",
        "Detector or reporter reference",
        "Reference norm or requirement reference",
        "Detection and ingestion timestamps"
      ],
      "outputs": [
        "Issue record with authoritative identifier",
        "Preserved link to the as-submitted intake artifact",
        "Initial state value"
      ],
      "preconditions": [
        "The minimum information set for the intake channel is satisfied or the record is marked incomplete",
        "An identifier-issuing system of record is designated"
      ],
      "effects": [
        "A new issue record exists in its initial state",
        "The as-submitted intake artifact is retained unaltered and referenced",
        "Ingestion time is recorded separately from detection and occurrence time"
      ],
      "source_refs": [
        "SRC-006",
        "SRC-007",
        "SRC-010",
        "SRC-011"
      ]
    },
    {
      "id": "fn-state-discrepancy",
      "name": "State or restate the discrepancy",
      "description": "Record or revise the observed state, expected state, reference norm and norm version in force, retaining the superseded statement with its attribution.",
      "inputs": [
        "Observed-state description",
        "Expected-state description",
        "Norm reference and version"
      ],
      "outputs": [
        "Current discrepancy statement",
        "Superseded statement with validity interval"
      ],
      "preconditions": [
        "The issue record exists",
        "The asserting agent is identified"
      ],
      "effects": [
        "The discrepancy statement is current and attributed",
        "Prior statements remain citable rather than overwritten"
      ],
      "source_refs": [
        "SRC-007",
        "SRC-009",
        "SRC-004"
      ]
    },
    {
      "id": "fn-classify-and-grade",
      "name": "Classify and grade the issue",
      "description": "Assign type, external category codes with scheme and version, and the severity, priority and significance grades, recording the grading basis and any required endorsement.",
      "inputs": [
        "Issue record reference",
        "Classification scheme identifiers and versions",
        "Grading scheme and assessed inputs"
      ],
      "outputs": [
        "Type and category code assignments",
        "Severity, priority and significance values with rationale",
        "Endorsement status where required"
      ],
      "preconditions": [
        "The referenced classification and grading schemes are resolvable at a stated version",
        "The assigning party is competent for the grade being applied"
      ],
      "effects": [
        "Grades and codes are current with their prior values retained",
        "Any threshold shifting competent authority is made explicit on the record"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-003",
        "SRC-006",
        "SRC-009"
      ]
    },
    {
      "id": "fn-resolve-identity",
      "name": "Resolve identity, duplicates and cross-system correspondence",
      "description": "Determine whether an incoming assertion is the same discrepancy as an existing record, select the canonical record on a merge, and register identifiers held by other systems with their authority assignment.",
      "inputs": [
        "Candidate record or incoming assertion",
        "Correlation identifiers and fingerprint values",
        "Declared duplicate-decision criteria"
      ],
      "outputs": [
        "Duplicate determination with justification",
        "Canonical record reference and derivation link from the retired record",
        "External identifier registrations with representation roles"
      ],
      "preconditions": [
        "Duplicate-decision criteria and the fingerprint algorithm version are declared",
        "No record already merged into a different canonical record without a recorded supersession"
      ],
      "effects": [
        "At most one canonical record represents the discrepancy",
        "Retired records remain resolvable and carry a derivation link to the canonical record"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-004",
        "SRC-011"
      ]
    },
    {
      "id": "fn-attach-evidence",
      "name": "Attach evidence and reproduction context",
      "description": "Associate evidence items and any reproduction procedure with the issue, recording custodian, capture time, content digest and the resulting sufficiency assessment.",
      "inputs": [
        "Evidence item references with digests",
        "Reproduction preconditions and steps",
        "Capturing agent reference"
      ],
      "outputs": [
        "Evidence set attached to the issue",
        "Reproducibility status",
        "Sufficiency assessment with named gaps"
      ],
      "preconditions": [
        "Each evidence item has a resolvable custodian and a content digest",
        "Evidence sensitivity is classified before attachment"
      ],
      "effects": [
        "The evidential basis of the assertion is inspectable",
        "Evidence gaps blocking a sought disposition are made explicit"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-007",
        "SRC-009"
      ]
    },
    {
      "id": "fn-record-causal-outcome",
      "name": "Record causal analysis outcome",
      "description": "Record the investigation outcome on the issue — hypotheses considered and eliminated, proximate cause, root cause, contributing factors, method, analyst and conclusion status — and any resulting known-error designation.",
      "inputs": [
        "Causal analysis report reference",
        "Candidate causes with eliminating evidence",
        "Analysis method and analyst reference"
      ],
      "outputs": [
        "Typed causal statements with conclusion status",
        "Known-error designation where its criteria are met",
        "Reference to the supporting analysis report"
      ],
      "preconditions": [
        "The investigation is complete or is explicitly recorded as provisional",
        "Evidence supporting each retained cause is referenced"
      ],
      "effects": [
        "The causal conclusion and its status are separable from the actions that follow",
        "A formally undetermined outcome is distinguishable from an unfinished investigation"
      ],
      "source_refs": [
        "SRC-007",
        "SRC-005",
        "SRC-012",
        "SRC-013"
      ]
    },
    {
      "id": "fn-transition-state",
      "name": "Apply a lifecycle transition to the issue record",
      "description": "Move the record between declared states, recording prior state, new state, transition instant, competent party and reason, and updating any interoperability progress predicates consistently.",
      "inputs": [
        "Target state",
        "Competent party reference",
        "Transition reason"
      ],
      "outputs": [
        "Updated state value and progress predicates",
        "Appended transition record"
      ],
      "preconditions": [
        "The transition is in the declared permitted set and its guard condition is satisfied",
        "The acting party is competent for the transition at the record's current significance"
      ],
      "effects": [
        "The record's state history is complete and attributable",
        "Predicate values remain consistent with the state value per the declared mapping"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-009"
      ]
    },
    {
      "id": "fn-record-disposition",
      "name": "Record disposition and closure",
      "description": "Record the disposition category selected by the competent body, the assessments performed, the closure criteria and their satisfaction, and the closure instant.",
      "inputs": [
        "Disposition category from the declared closed value set",
        "Deciding body reference and assessment outcomes",
        "Closure criteria with satisfaction evidence references"
      ],
      "outputs": [
        "Disposition record artifact reference",
        "Closure criteria satisfaction status",
        "Closure timestamp"
      ],
      "preconditions": [
        "The deciding body is competent at the record's significance level",
        "Each closure criterion is either satisfied with a reference or explicitly waived by an authorisation"
      ],
      "effects": [
        "The disposition and its justification are inspectable independently of the issue narrative",
        "Closure of the record is distinguishable from resolution of the discrepancy"
      ],
      "source_refs": [
        "SRC-009",
        "SRC-007",
        "SRC-001"
      ]
    },
    {
      "id": "fn-link-resolution-reference",
      "name": "Link resolution work and effectiveness verification",
      "description": "Attach references to the action, change or task records addressing the issue and to the externally produced effectiveness verification results, and set the acceptance status the issue carries in consequence.",
      "inputs": [
        "Action, change or task record references with roles",
        "Effectiveness verification result references",
        "Accepting party reference"
      ],
      "outputs": [
        "Resolution reference set",
        "Acceptance status with timestamp"
      ],
      "preconditions": [
        "Each reference resolves in its owning model",
        "The verification result exists in the verification model before acceptance is set"
      ],
      "effects": [
        "The issue carries pointers and a consequent status only",
        "No action definition, execution state or verification result is copied into this model"
      ],
      "source_refs": [
        "SRC-007",
        "SRC-001"
      ]
    },
    {
      "id": "fn-produce-disclosure-extract",
      "name": "Produce a disclosure extract under confidentiality constraints",
      "description": "Derive a disidentified or redacted representation of the issue for a stated requester entitlement, retaining a derivation link to the source that only entitled parties can resolve.",
      "inputs": [
        "Source issue record",
        "Requester entitlement basis",
        "Fields designated for removal or masking"
      ],
      "outputs": [
        "Disidentified disclosure extract",
        "Derivation link to the source record",
        "Release conditions attached to the extract"
      ],
      "preconditions": [
        "Sensitivity classification and reporter-protection regime are recorded on the source",
        "The requester's entitlement basis is stated and the release scope is bounded"
      ],
      "effects": [
        "Only the extract circulates outside the holding organization",
        "The extract identifier encodes no protected personal detail"
      ],
      "source_refs": [
        "SRC-006",
        "SRC-004"
      ]
    },
    {
      "id": "fn-project-for-exchange",
      "name": "Project the issue into an external vocabulary",
      "description": "Emit a representation of the issue in a target vocabulary at a stated version using the maintained crosswalk, annotating elements lost in the projection and declaring alignment rather than conformance.",
      "inputs": [
        "Issue record",
        "Target vocabulary identifier and version",
        "Crosswalk edition"
      ],
      "outputs": [
        "Projected representation in the target vocabulary",
        "Loss annotation listing unmapped elements",
        "Alignment declaration"
      ],
      "preconditions": [
        "A crosswalk edition exists for the target version",
        "Any conflicting term definitions are recorded rather than silently resolved"
      ],
      "effects": [
        "Consumers receive an explicitly lossy, versioned projection",
        "No conformance claim is asserted without recorded evidence"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-003",
        "SRC-005"
      ]
    },
    {
      "id": "fn-set-retention-status",
      "name": "Set retention class, hold and tombstone marker",
      "description": "Record the retention class and anchor, place or lift a disposal hold with its authority, and, once disposal is authorised and executed elsewhere, replace the record with the declared tombstone.",
      "inputs": [
        "Retention class and anchor event",
        "Hold reason and placing or lifting authority",
        "Disposal authorisation reference"
      ],
      "outputs": [
        "Retention status on the record",
        "Hold state with review date",
        "Tombstone once disposal is confirmed"
      ],
      "preconditions": [
        "The owning retention policy or records model is identified",
        "No active hold is in force when disposal is recorded as authorised"
      ],
      "effects": [
        "Retention state and hold state are inspectable on the record",
        "A tombstone preserves the identifier and disposal outcome so inbound references do not break; destruction execution and certification remain with the owning retention model"
      ],
      "source_refs": [
        "SRC-006",
        "SRC-012",
        "SRC-007"
      ]
    }
  ],
  "composition": [
    {
      "target": "WM-ACT-021",
      "relation": "CHILD",
      "purpose": "Registered parent in the action plane. The issue is the recognized discrepancy that motivates action; the parent owns action definition, assignment, scheduling, effort and execution. This model contributes the discrepancy, causal and disposition context and receives back only references and acceptance status. 21 CFR 820.100 separates investigating the cause from identifying, implementing and verifying the action, and OSLC CM keeps Task and ReviewTask as separate trackable activities.",
      "required": true,
      "source_refs": [
        "SRC-007",
        "SRC-001"
      ]
    },
    {
      "target": "Incident / occurrence event model",
      "relation": "REFERENCE",
      "purpose": "Carry references to the occurrences an issue explains, with the explanatory role and, where required, the onward-transmission obligation. The occurrence record's own detection, response and closure lifecycle stays entirely in that model.",
      "required": false,
      "source_refs": [
        "SRC-006",
        "SRC-008"
      ]
    },
    {
      "target": "Risk model (risk register entry)",
      "relation": "REFERENCE",
      "purpose": "Bind a realized risk to the issue it became, and carry an endorsed risk classification value assigned to the discrepancy. Likelihood modelling, treatment planning and risk-appetite evaluation remain with the risk model.",
      "required": false,
      "source_refs": [
        "SRC-006",
        "SRC-008"
      ]
    },
    {
      "target": "Requirement / specification / norm model",
      "relation": "REFERENCE",
      "purpose": "Resolve the expected state against an authored requirement clause at the version in force at recognition. Requirement authoring, versioning and baseline control stay with that model.",
      "required": true,
      "source_refs": [
        "SRC-007",
        "SRC-009"
      ]
    },
    {
      "target": "Corrective and preventive action model",
      "relation": "REFERENCE",
      "purpose": "Reference corrections, corrective actions and preventive actions with their roles, and the effectiveness verification or validation results they produce. Action execution and the verification activity itself are owned there; this model carries only the reference and the resulting acceptance status.",
      "required": false,
      "source_refs": [
        "SRC-007"
      ]
    },
    {
      "target": "Change request model aligned to OSLC Change Management 3.0",
      "relation": "ALIGN",
      "purpose": "Align state, priority, severity, parent and related-request semantics to the oslc_cm vocabulary for exchange, using oslc_cm:state in preference to the archaic oslc_cm:status. Alignment only: no conformance is claimed and change workflow is not reproduced.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-002"
      ]
    },
    {
      "target": "Evidence, observation and measurement model",
      "relation": "REFERENCE",
      "purpose": "Reference evidence items with custodian, capture time and content digest, and reproduction procedures. Evidence capture, storage and integrity verification remain with that model.",
      "required": true,
      "source_refs": [
        "SRC-003",
        "SRC-007"
      ]
    },
    {
      "target": "Provenance model aligned to W3C PROV-O",
      "relation": "ALIGN",
      "purpose": "Express per-claim attribution, derivation of merged and superseded records, and assertion intervals using the PROV Entity/Activity/Agent pattern and its qualification classes.",
      "required": false,
      "source_refs": [
        "SRC-004"
      ]
    },
    {
      "target": "Classification scheme and taxonomy registry",
      "relation": "REFERENCE",
      "purpose": "Bind category codes to externally governed schemes with an explicit scheme identifier and version, as ADREP/ECCAIRS compatibility and SARIF taxa references both require. Code list governance, deprecation and versioning stay in the registry.",
      "required": true,
      "source_refs": [
        "SRC-006",
        "SRC-003"
      ]
    },
    {
      "target": "Party, organization and role model",
      "relation": "REFERENCE",
      "purpose": "Resolve reporter, owner, custodian, analyst, competent authority and recipient references. Party master data, role definitions and competence assertions are owned there.",
      "required": true,
      "source_refs": [
        "SRC-006",
        "SRC-009"
      ]
    },
    {
      "target": "Records retention and disposition policy model",
      "relation": "REFERENCE",
      "purpose": "Bind the retention class, anchor and hold authority, and receive the disposal authorisation reference. Schedule authoring, destruction execution and disposal certification are owned by that model or by the adopting Dimension's policy.",
      "required": true,
