      ],
      "preconditions": [
        "Zone identifier resolves to a canonical zone in the pinned release",
        "Requested instant lies within the release's asserted validity bound or a projection rule is available"
      ],
      "effects": [
        "Resolved offset and the zone data release identifier are persisted with the value so the resolution is reproducible",
        "Anomalies are surfaced rather than silently defaulted"
      ],
      "source_refs": [
