    "known_omissions": [
      "ISO 8601-1:2019 and ISO 8601-2:2019 are the underlying international standards but could not be fetched (ISO returned 403 and the Library of Congress EDTF pages returned 403), so they are represented indirectly through the IETF profile, the W3C granularity note and the calendaring standards; the uncertain, approximate and set-valued date vocabulary is therefore recorded as a gap.",
      "No global authoritative registry of public holidays exists. Coverage is demonstrated with one national feed and two legal instruments; jurisdictions without an identified authoritative source must be marked as gaps, and the model deliberately does not endorse aggregated secondary holiday datasets.",
      "Sighting-based observance determination (notably Hijri months determined by local observation) cannot be predicted; the model records method, community and confirmation status but supplies no computation, and per-community authority sources were not individually verified.",
      "Leap smearing is named as a policy option but no smear algorithm is specified, because the widely used smear windows are vendor practice rather than standardised.",
      "The specific rule of the CIPM proposal for the new UT1-UTC maximum, due for approval at the 28th CGPM in 2026, is not yet available and is therefore modelled as a pending lifecycle event rather than as a value.",
      "Business centre code lists were referenced by scheme rather than enumerated; the individual centre scheme file was not retrieved successfully during research.",
      "Historical calendar reform events (for example Julian-to-Gregorian adoption dates, which differ by jurisdiction by up to several centuries) are within scope conceptually but no per-jurisdiction adoption dataset was grounded in a primary source here.",
      "CalConnect's general recurrence representation was identified as a relevant standard but its document could not be retrieved (404), so no structure depends on it.",
      "ISO 8601-1:2019 and ISO 8601-2:2019 full texts were not retrieved (paywalled); alignment is via RFC 3339 and RFC 9557 citations only.",
      "ISO 19108:2002 temporal schema was cited by OWL-Time but not independently read.",
      "RFC 9636 TZif, RFC 7808 TZDIST, RFC 8984 JSCalendar and RFC 5905 NTP were identified as related and not fully retrieved.",
      "GNSS timescales (GPS, GLONASS, Galileo, BeiDou) and operator leap smearing lack a primary source in this pass.",
      "No global primary holiday, weekend or financial business-day register was found; national gazettes remain masters.",
      "Windows timezone IDs and CLDR windowsZones mapping were not fetched as a first-party artefact.",
      "Astronomical new-moon algorithms, Hebrew postponement tables and Umm al-Qura internals are tradition-specific authorities not copied here.",
      "Negative leap seconds are allowed by the IERS framework but have never been issued; encoding remains a rare lifecycle case."
    ],
    "conflicts": [
      "The tz database and CLDR deliberately diverge on identifier stability: tz relinks and renames zones as the ground truth changes, while CLDR preserves canonical identifiers to avoid churn. Consumers must choose a persistence layer; the model requires the choice to be declared rather than resolving it.",
      "RFC 3339 originally treated Z as implying UTC is the preferred reference point; RFC 9557 updates that reading so Z means the local offset is unknown. Systems built to either reading will disagree about the same string, so the model records the interpretation in the conformance profile.",
      "The tz database records leap-second-aware behaviour as optional because POSIX requires leap seconds to be excluded from the time count; the same instant therefore has different representations across POSIX and leap-aware systems.",
      "Legal instruments and their database mirror can diverge for weeks after a decree, and the mirror maintainer explicitly aims at what the average person on the street would think the time is rather than at the statute. The model tracks divergence rather than assuming agreement.",
      "Hijri calendar variants in the calendar registry (tabular civil, tabular astronomical, Umm al-Qura, Saudi sighting) yield different dates for the same nominal day; there is no single correct value, only a declared method.",
      "The pinned leap-second table and the CGPM decision to raise the UT1-UTC tolerance by 2035 point in different directions for long-horizon planning: current data assumes the existing regime while the governing decision has already changed it.",
      "The FpML NEAREST convention is defined by reference to Sundays and Mondays, which does not generalise to territories whose weekend is not Saturday and Sunday; applying it outside that assumption is undefined.",
      "RFC 3339 treats Z and +00:00 as implying UTC is the preferred reference point; RFC 9557 updates Z so that implication no longer holds. Both keep -00:00 for unknown local offset.",
      "ISO 8601 mandates leap seconds in lexical forms; OWL-Time notes XML Schema/XSD lexical forms ignore them. RFC 5545 allows second 60 but says non-supporting implementations SHOULD treat it as 59, and durations MUST NOT consider leap seconds. POSIX/Unix time also omits leap seconds.",
      "RFC 9557 IANA timezone names mean rules current at interpretation time; RFC 5545 VTIMEZONE is a snapshot embedded in one object. Offset timezones such as +01:00 are legal in IXDTF but strongly discouraged.",
      "RFC 5545 CALSCALE exists but RFC 7529 states it has never been used; non-Gregorian recurrence requires RSCALE.",
      "tzdb is complete by design only for post-1970 civil clocks of recorded locations; using it as a universal historical atlas overclaims.",
