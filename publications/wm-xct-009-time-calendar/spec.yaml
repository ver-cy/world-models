          {
            "id": "provenance-conflict-and-quality",
            "name": "Provenance, conflict and quality",
            "description": "Recording where a temporal fact came from, how reliable it is, where authoritative sources disagree, and how corrections propagate.",
            "source_refs": [
              "SRC-003",
              "SRC-002",
              "SRC-011",
              "SRC-015",
              "SRC-010"
            ],
            "findings": [
              {
                "id": "provenance-and-known-inaccuracy",
                "name": "Provenance, declared inaccuracy and conflict handling",
                "description": "The maintainers of the primary zone dataset state plainly that many pre-1970 and future timestamps are wrong or misleading, that some entries derive from unreliable sources, and that transitions were often gradual rather than instantaneous. A downstream model must therefore carry an evidence class and known-inaccuracy marker with each fact, and must record where the stability-oriented locale layer and the volatile upstream layer disagree.",
                "source_refs": [
                  "SRC-003",
                  "SRC-002",
                  "SRC-011",
                  "SRC-015"
                ],
                "questions": [
                  {
                    "id": "pki-q1",
                    "text": "What is the evidence class of this temporal fact — legal instrument, authority publication, mirrored consensus, or reconstruction?",
                    "kind": "evidence",
                    "answer_data": [
                      "evidence class",
                      "citation",
                      "reconstruction method if applicable"
                    ]
                  },
                  {
                    "id": "pki-q2",
                    "text": "Is the fact within a range the upstream maintainer declares unreliable, and is that warning propagated to consumers?",
                    "kind": "quality",
                    "answer_data": [
                      "reliability range flag",
                      "maintainer caveat text",
                      "consumer-facing warning surface"
                    ]
                  },
                  {
                    "id": "pki-q3",
                    "text": "Where two authoritative sources disagree, which one governs here and on what documented basis?",
                    "kind": "decision",
                    "answer_data": [
                      "conflicting sources",
                      "governing source",
                      "decision rationale",
                      "decision maker",
                      "review date"
                    ]
                  },
                  {
                    "id": "pki-q4",
                    "text": "When an upstream correction changes a historical value, what is done with results already published from the old value?",
                    "kind": "exception",
                    "answer_data": [
                      "correction event record",
                      "affected output inventory",
                      "reissue or annotate policy",
                      "notification obligation"
                    ]
                  },
                  {
                    "id": "pki-q5",
                    "text": "Who is accountable for the accuracy of each class of temporal fact in this Dimension?",
                    "kind": "ownership",
                    "answer_data": [
                      "fact class",
                      "accountable role",
                      "review cadence",
                      "escalation contact"
                    ]
                  },
                  {
                    "id": "pki-q6",
                    "text": "Is the provenance chain from legal instrument to mirrored dataset to local record complete and traversable?",
                    "kind": "provenance",
                    "answer_data": [
                      "chain completeness check",
                      "missing links",
                      "remediation action"
                    ]
                  }
                ],
                "data_elements": [
                  {
