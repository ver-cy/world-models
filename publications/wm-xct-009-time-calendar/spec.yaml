            "findings": [
              {
                "id": "reference-data-release",
                "name": "Release identity, signing and freshness obligation",
                "description": "Temporal reference data is released as identified versions on an irregular, event-driven cadence — the zone database is released roughly twenty times a year and releases should be cryptographically signed. Distribution services support monolithic or per-zone versioning with synchronisation tokens and conditional requests, and some datasets carry hard expiry, so pinning a release and proving its freshness is a first-class obligation.",
                "source_refs": [
                  "SRC-001",
                  "SRC-002",
                  "SRC-010",
                  "SRC-016",
                  "SRC-022"
                ],
                "questions": [
                  {
                    "id": "rdr-q1",
                    "text": "Which release of each reference dataset is currently pinned, and where is the pin recorded?",
                    "kind": "identity",
                    "answer_data": [
