  "coverage": {
    "claim": "Dual-provider research synthesis for a format-independent Time / Calendar mixin and governed reference model. It covers time scales, leap adjustment, civil time zones, calendar systems, temporal value shapes, recurrence, observances, working-day rules and reference-data governance. It does not claim exhaustive historical timezone or holiday coverage for every jurisdiction.",
    "confidence": "medium",
    "checklist": [
      {
        "dimension": "identity",
        "status": "covered",
        "notes": "Identity priority is applied concretely: legal instrument citations and publisher release identifiers first, then governed identifiers (tz canonical ids, CLDR BCP47 timezone and calendar keys, ontology IRIs, business centre codes), then Dimension UUIDs for crosswalks, profiles and attestations. The model explicitly forbids identifying zones by abbreviation, offset or country code, and forbids dates as identifiers."
      },
      {
        "dimension": "lifecycle",
        "status": "covered",
        "notes": "Covered at three levels: the authority decision lifecycle (announcement, effect, rescission) in the zone-legal-authority and public-holiday layers; the reference-data release lifecycle (release, verify, adopt, expire, supersede) in the governance bundle; and the derived-artifact lifecycle (expansion, reissue, freeze) in recurrence and working-day layers."
      },
      {
        "dimension": "relationships",
        "status": "covered",
        "notes": "Zone-to-scale, transition-to-zone, era-to-calendar, observance-to-calendar, holiday-to-instrument, recurrence-to-calendar-scale, and working-day-calendar-to-inputs are all modelled, plus Allen interval relations from the W3C ontology for interval ordering. Cross-model links are expressed as sixteen composition entries."
      },
      {
        "dimension": "temporal",
        "status": "covered",
        "notes": "Event, announcement, effective, observation, adoption, build and expiry instants are separated by rule; RFC 3339 with seconds and explicit offset or Z is mandated; granularity is declared rather than inferred; open and unbounded endpoints are distinguished from missing values."
      },
      {
        "dimension": "provenance",
        "status": "covered",
        "notes": "Every fact carries an evidence class and cites either a legal instrument, an authority publication, a mirrored release or a reconstruction. The provenance chain from instrument through mirrored dataset to local record is an explicit question, and upstream accuracy caveats are propagated rather than absorbed."
      },
      {
        "dimension": "ownership",
        "status": "covered",
        "notes": "Six roles are defined with distinct responsibilities; jurisdictional facts are attributed to the declaring authority while the steward owns only the mirroring. Accountability per fact class is a required data element and an AGENTS.md field."
      },
      {
        "dimension": "validation",
        "status": "covered",
        "notes": "A validation function checks values against the binding, timestamp and precision profiles; ordering violations in transition, leap and era series fail validation; cross-implementation recurrence test vectors and round-trip projection tests are required; orphaned recurrence overrides are detected."
      },
