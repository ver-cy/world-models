  "model": {
    "registry_id": "vr.wm-xct-009",
    "model_id": "WM-XCT-009",
    "name": "Time / Calendar",
    "entry_kind": "mixin",
    "purpose": "Provide a format-neutral, authority-grounded reference model for temporal reference data (time scales, civil time zones, calendar systems, recurrence, holidays and observances) together with the embeddable temporal value shapes that every other model needs to express instants, intervals, durations, schedules and deadlines unambiguously.",
    "scope_statement": "WM-XCT-009 is a mix-in plus reference model. It defines (a) the governed reference data that determines what a civil date-time means — time scales and leap adjustments, time zone identifiers and their offset-transition history, calendar systems, eras and week rules, and jurisdictional holidays and observances; and (b) the reusable temporal value shapes (instant, interval, duration, recurrence, precision, binding mode) that sibling models embed. It is storage- and interface-neutral: TZif, iCalendar, JSCalendar, JSON, XML, Git or MongoDB are projections of the same semantics. It records external standards as alignments, never as claimed conformance, and treats the IANA tz database and CLDR as mirrors of civil decisions rather than as the legal authority for them.",
    "in_scope": [
      "Time scales, epochs and their mutual offsets (UTC, TAI, UT1, GPS time, POSIX/Unix time), and the governance of leap adjustments",
      "Civil time zone identity, canonical/alias relationships, standard and daylight offsets, and the complete transition history of a zone",
      "Legal instruments and decision processes by which a jurisdiction sets or changes standard time and daylight saving arrangements",
      "Calendar systems and their identifiers, eras and year numbering, intercalation and leap-month structure, and territory week rules",
      "Reusable temporal value shapes: instant, interval, duration, period, granularity/precision, and the floating/zoned/absolute binding contract",
      "Recurrence rule semantics, exceptions and overrides, and calendar-scale-aware recurrence expansion",
      "Public holidays as proclaimed by an authority, cultural and religious observances and their computation methods",
      "Working-day and business-day calendars, weekend rules and date-adjustment (business day) conventions",
      "Reference-data lifecycle: release versioning, signing, distribution, expiry, freshness and correction of temporal reference data"
    ],
    "out_of_scope": [
      "Clock synchronisation and time transfer protocols and their engineering (NTP, PTP, GNSS timing, UTC(k) traceability chains) — a distinct time-dissemination model",
      "Calendaring and scheduling application semantics such as attendees, invitations, free/busy, alarms and iTIP scheduling workflows",
      "The definition and geometry of jurisdictions and territories themselves — held by the place/jurisdiction model and only referenced here",
      "General identifier-scheme governance — held by the identifier and naming model; this model only consumes registered temporal identifier schemes",
      "Astronomical ephemeris computation and the physics of Earth rotation; only the published results (leap-second decisions, DUT1 limits) are consumed",
      "Labour-law entitlements, pay premiums and leave accrual arising from holidays; only the day-off status of a holiday is modelled",
      "Domain deadline policy (SLA targets, statutory limitation periods); this model supplies the calculus, not the policy",
      "Localisation and formatting of dates for presentation, beyond the identifiers and week/calendar preference data needed to compute correct values"
    ],
    "boundary_notes": [
      {
        "neighbor": "Place / jurisdiction reference model",
        "distinction": "Time zones and holidays are scoped to jurisdictions and sub-jurisdictional divisions (for example the UK bank-holiday divisions england-and-wales, scotland, northern-ireland, or US county-level zone boundaries in 49 CFR Part 71). This model references those jurisdiction identities; it does not define territories, boundaries or their geometry. tz zone names are deliberately not country-based and must not be treated as jurisdiction identifiers.",
        "source_refs": [
          "SRC-003",
          "SRC-019",
          "SRC-020"
        ]
      },
      {
        "neighbor": "Identifier and naming model",
        "distinction": "tzids, CLDR BCP47 timezone keys and u-ca calendar keys are governed identifier schemes maintained elsewhere. This model records which scheme an identifier belongs to, its canonical form and its alias relations; scheme registration policy itself belongs to the identifier model.",
        "source_refs": [
          "SRC-011",
          "SRC-013",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Time dissemination and clock synchronisation model",
        "distinction": "BIPM Circular T and IERS bulletins are consumed here as authoritative statements about the scale (leap seconds, UTC-TAI, UTC(k) deviations). How a device acquires and steers to that scale, and traceability of a local clock, is a separate engineering model.",
        "source_refs": [
          "SRC-014",
          "SRC-015",
          "SRC-023"
        ]
      },
      {
        "neighbor": "Calendaring and scheduling application model",
        "distinction": "RFC 5545 and RFC 8984 are alignments for recurrence and time-zone value semantics only. Event participation, scheduling negotiation and calendar-store synchronisation belong to an application model that embeds this mix-in.",
        "source_refs": [
          "SRC-007",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Financial settlement and instrument models",
        "distinction": "Business day conventions and business-centre holiday calendars are defined here as reusable date arithmetic. Which convention a given contract or instrument elects is a fact of that instrument, held by the financial model.",
        "source_refs": [
          "SRC-021"
        ]
      },
      {
        "neighbor": "Statistics and records models",
        "distinction": "Reference periods, retention triggers and reporting cut-offs embed this model's interval and recurrence shapes. The meaning of a reference period for a statistic, or of a retention trigger for a record, stays with those models.",
        "source_refs": [
          "SRC-017",
          "SRC-007"
        ]
      }
    ]
  },
