  "model": {
    "registry_id": "vr.wm-act-044",
    "model_id": "WM-ACT-044",
    "name": "Content Publication",
    "entry_kind": "aggregate",
    "purpose": "Represent one governed content-publication operation that binds an external content revision, records review and authority, issues a release instruction, observes origin and downstream delivery, and preserves corrections or removal without absorbing the systems it coordinates.",
    "scope_statement": "Owns publication-case identity and lineage, target bindings and release metadata snapshots, editorial workflow, review and clearance assertions, decisions, immutable release instructions, packages, channel bindings, delivery attempts, discovery and syndication projections, availability observations, correction, update, retraction, withdrawal and takedown events, provenance, access, retention and interoperability. Content, Publication or Edition, actor, channel, rights, rendition, communication, analytics and record masters remain external.",
    "in_scope": [
      "Publication-case identity, authority, target revision bindings, metadata snapshot, workflow, review, clearances and decision evidence",
      "Release instructions, packages, representations, channels, delivery, canonical locations, discovery, feeds, subscriptions and verified availability",
      "Post-publication observation, correction, retraction, withdrawal, takedown, lifecycle, provenance, retention, interoperability and safe agents"
    ],
    "out_of_scope": [
      "Independent content, edition, actor, organization, role, platform, channel, rights, licence, translation, rendition, communication, analytics or record master lifecycles",
      "Treating approval as availability, delivery acknowledgement as audience reach, syndication as origin authority, unpublishing as erasure or a representation as an edition",
      "Operating publishing platforms, determining legal rights, guaranteeing indexing or reach, moderating all audience interaction or deleting referenced masters"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-MED-003 Publication / Edition candidate parent",
        "distinction": "The external edition master owns bibliographic identity and edition lineage; this aggregate owns a governed operation that may publish a referenced edition. The registry parent is not an approved relation row.",
        "source_refs": [
          "SRC-003",
          "SRC-007",
          "SRC-008"
        ]
      },
      {
        "neighbor": "Content, Creative Work and Document",
        "distinction": "Those masters own authored meaning and revision history. This model binds the exact revision and records whether, where and under whose authority it was released.",
        "source_refs": [
          "SRC-002",
          "SRC-007",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Channel, Platform, Representation and Rendition",
        "distinction": "External masters own endpoint, platform and media identities. This case stores release-specific bindings, attempts and observations without copying their inventories.",
        "source_refs": [
          "SRC-002",
          "SRC-004",
          "SRC-008"
        ]
      },
      {
        "neighbor": "Rights, Licence, Policy and Accessibility",
        "distinction": "Their masters own normative rules. This model records scoped clearance assertions and evidence for one release decision.",
        "source_refs": [
          "SRC-010",
          "SRC-013"
        ]
      },
      {
        "neighbor": "Communication, Notification, Analytics, Audit and Record",
        "distinction": "Those systems own messages, measurements and records; this case binds qualified references needed to explain publication outcomes.",
        "source_refs": [
          "SRC-001",
          "SRC-006",
          "SRC-009"
        ]
      }
    ]
