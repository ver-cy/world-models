    "name": "Clinical Observation / Diagnosis",
    "entry_kind": "aggregate",
    "purpose": "Represent one source-qualified clinical assertion, explicitly profiled as an observation result, clinical impression or diagnosis-condition, so agents can interpret evidence, status, uncertainty and lineage without conflating the assertion with the patient, encounter or disease entity.",
    "scope_statement": "Owns assertion identity and lineage, profile, subject and encounter bindings, source meaning, observation design and value, interpretation, diagnostic statement, evidence-use links, participants and authority, effective and record times, result, verification and clinical statuses, correction and refutation history, quality, privacy, retention and interoperability. Patient, practitioner, encounter, specimen, device, procedure, report, disease, terminology, care action, consent, audit and record masters remain external.",
    "in_scope": [
      "Clinical assertion profile, identity, source, subject, focus, context, value, interpretation, evidence, uncertainty, participants, authority and time",
      "Observation capture, clinical impression, diagnosis assertion, lifecycle, verification, correction, refutation, privacy, retention, provenance and version-pinned projections"
    ],
    "out_of_scope": [
      "Independent patient, practitioner, encounter, episode, specimen, device, request, procedure, diagnostic report, disease or condition entity, terminology, care plan, treatment, medication, consent, audit or records lifecycles",
      "Treating an observable as a result, result as diagnosis, assertion as disease entity, preliminary as final, clinical status as verification status, refuted as erased or code mapping as source truth",
      "Giving medical advice, autonomously diagnosing, ordering or performing care, operating clinical systems or defining universally applicable professional and legal rules"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ACT-018 Encounter",
        "distinction": "Encounter may contain or contextualize assertion instances, but owns its own participants, location, service and lifecycle. The ledger relation is candidate only.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-004"
        ]
      },
      {
        "neighbor": "WM-LIV-021 Disease / Biological Condition",
        "distinction": "The disease or biological-condition master owns the condition entity or class. This model owns a source-qualified assertion that a subject has, may have or does not have a condition at a stated verification and clinical status.",
        "source_refs": [
          "SRC-002",
          "SRC-006",
          "SRC-007"
        ]
      },
      {
        "neighbor": "Patient, Related Person, Practitioner, Organization and Care Team",
        "distinction": "External identity and role masters own people and organizations. This assertion records role-qualified references, participation, informant status, delegation and responsibility.",
        "source_refs": [
          "SRC-001",
