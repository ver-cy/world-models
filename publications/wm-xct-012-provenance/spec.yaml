        "id": "origin-derivation-and-lineage",
        "name": "Origin, Derivation and Lineage",
        "description": "Where the subject came from: its origination, its sources and ingredients, the derivation relations that connect it to prior entities, and how far the resulting lineage can be traversed and trusted.",
        "rationale": "Every consulted standard centres on the same pair of facts — an entity was generated by an activity, and an entity was derived from other entities. PROV names the relations, ISO lineage names process steps and sources, C2PA names ingredients, SLSA names resolved dependencies, and dcterms names source and primary source. The bundle collects the graph and the honest statement of where it stops.",
