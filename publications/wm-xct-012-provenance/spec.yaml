  "coverage": {
    "claim": "Dual-provider research synthesis for a format-independent Provenance mixin. The accepted structure covers subject anchoring, provenance record identity, origin and derivation, agents and activities, custody, temporal and spatial context, fixity, attestation, verification, disclosure, access, retention and vocabulary alignment. It is a public research draft, not a claim that every sector-specific provenance profile is complete.",
    "confidence": "medium",
    "checklist": [
      {
        "dimension": "identity",
        "status": "covered",
        "notes": "Subject anchoring, provenance assertion identity and agent identity are separated, with a five-tier identity priority that puts master-system identifiers first, then governed IRIs, then minted UUID/ULID, and explicitly bars dates, filenames and labels. Digest is treated as a binding rather than an identity, following in-toto's digest-only subject matching and SPDX's required spdxId (SRC-007, SRC-015)."
      },
      {
        "dimension": "lifecycle",
        "status": "covered",
        "notes": "Origination, transformation, invalidation, custody transfer, supersession, redaction and disposition are all modelled as events with their own records; C2PA update manifests and PREMIS events support supersession over mutation, and NARA disposition supports the tombstone rule (SRC-005, SRC-017, SRC-019)."
      },
      {
        "dimension": "relationships",
        "status": "covered",
        "notes": "Typed derivation, revision, quotation, primary source, ingredient, membership and transformation relations are drawn from PROV, FHIR entity roles, dcterms and EPCIS transformation events, with qualification through activity, role and time and an explicit fallback to generic influence when the specific type is unknown (SRC-001, SRC-010, SRC-008, SRC-014)."
      },
      {
        "dimension": "temporal",
        "status": "covered",
        "notes": "Occurrence and record time are separate mandatory-capable axes; RFC 3339 with explicit offset or Z is required; local zone offset survives UTC normalisation per EPCIS; ordering and validity follow PROV-CONSTRAINTS; trusted time-stamping is separated from self-declared clocks (SRC-010, SRC-014, SRC-003, SRC-005)."
      },
      {
        "dimension": "provenance",
        "status": "covered",
        "notes": "Provenance-of-provenance is modelled through bundles as entities, per-statement source references on merge, statement basis codes distinguishing recorded from inferred, and asserting-agent identity separate from the agents named inside an assertion (SRC-001, SRC-004)."
      },
      {
        "dimension": "ownership",
        "status": "covered",
        "notes": "Ownership is separated from custody following the dcterms:provenance definition; the custody register records holders, intervals, gaps and transfer instruments, and delegation records where responsibility rests above the acting agent (SRC-008, SRC-001, SRC-019, SRC-016)."
      },
      {
        "dimension": "validation",
        "status": "covered",
        "notes": "Three graded verification levels with per-check status codes, PROV-CONSTRAINTS instance validity, fixity re-checks, error declarations and re-verification triggers on trust-list or credential-status change; validators are identified and versioned in every report (SRC-005, SRC-003, SRC-014)."
      },
      {
        "dimension": "access",
        "status": "covered",
        "notes": "Default least-revealing view with named exceptions for regulators, data subjects and integrity investigations; four scopes at bundle, layer, finding and artifact level; discovery is interface-neutral via embedded records, link relations, resolver services or soft-binding lookup (SRC-004, SRC-005, SRC-012)."
      },
      {
        "dimension": "retention and deletion",
        "status": "covered",
