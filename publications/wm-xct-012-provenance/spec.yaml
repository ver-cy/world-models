    "access": {
      "default_rule": "Provenance is readable by any party authorised to hold the subject, at the least revealing view that still supports verification: subject anchor, binding method, verification grade, origination type, responsible organisation and time axes are exposed by default, while named natural persons, internal parameters, precise locations, credential internals and commercially sensitive process detail are withheld unless a broader view is granted. Write access is restricted to the asserting producer for its own statements; no party may silently alter or delete another party's statements.",
