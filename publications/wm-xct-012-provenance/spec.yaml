    "adversarial_checks": [
      "Attempted to justify a separate 'trust score' bundle and rejected it: no cited source defines a comparable cross-producer trust metric. C2PA grades verification (well-formed, valid, trusted) but that is an outcome of defined checks, not a score, so confidence remains a per-statement, scale-declared element and comparability is recorded as an open question.",
      "Tested whether 'provenance' could simply be the audit log, using FHIR's own boundary text as the counterexample: AuditEvent covers usage and access while Provenance covers generation. Collapsing them would import every read event into the lineage graph, so the boundary is stated explicitly rather than assumed.",
      "Tested whether digest could serve as identity, using in-toto's digest-only subject matching as the apparent supporting case. Rejected for mutable and versioned subjects, because two byte-identical renderings of different works would collide and any re-encoding would destroy identity; digest is therefore modelled as a binding under the identity priority rule.",
      "Searched for a counterexample to the mandatory-record-time rule and found the opposite: EPCIS makes recordTime optional while FHIR makes recorded optional too. The model nevertheless requires a record time on the assertion because without it supersession ordering is undecidable — this is recorded as a model-specific strengthening beyond the sources, not as a sourced requirement.",
      "Considered making a signature mandatory on every assertion and rejected it: PREMIS, ISO lineage, dcterms and RO-Crate all describe unsigned provenance that is nonetheless authoritative within its custodial context. Signature is therefore modelled as evidence strength, and unsigned provenance is representable with a correspondingly lower verification grade.",
      "Probed whether soft bindings (watermarks, fingerprints) could be presented as integrity evidence. They cannot: C2PA scopes them to matching across renditions, not to tamper detection, so the model forces an explicit statement of what each binding actually proves and separates hard from soft bindings.",
      "Checked whether redaction can be modelled as deletion. It cannot without breaking verification, since C2PA retains a labelled placeholder and lists redacted references in the claim; the model therefore forbids silent removal and requires a visible placeholder plus an explicit statement of which checks the redaction invalidates.",
      "Stress-tested the mix-in framing against SPDX, where provenance-like properties sit on the base Element class, and against C2PA, where provenance is a separate signed manifest. Both patterns are supported through the declared attachment-pattern element rather than privileging either, because privileging one would bind the model to a storage projection.",
      "Looked for authority to publish a canonical relation-type and reason-code vocabulary and found only mutually incompatible domain lists across PREMIS, EPCIS, C2PA and FHIR. Rather than invent a union list, classification is marked as a gap in the checklist and the vocabularies are assigned to the adopting Dimension with a governance requirement.",
      "Would treating this mixin as an entity rather than a mixin duplicate Artifact, Event or Agent models? Mitigated by MIX-IN composition and explicit out-of-scope list.",
      "Would claiming ISO 19115 or C2PA conformance without constraint or trust-list evidence be a false conformance claim? Mitigated by ALIGN not EXTEND and by recording conflicts.",
      "Would a date-stamped filename be used as a provenance identifier? Forbidden by identity priority and timestamp rule.",
      "Would a valid signature be presented as proof that media is true? Forbidden by C2PA non-goals and policy text.",
      "Would withheld personal actor data be reconstructed from EXIF or logs? Forbidden by privacy policy and C2PA v2 removal of identified humans from assertions.",
      "Would tenant-generated SLSA fields be treated as control-plane authentic? Explicit tenant-generated field question and builder trust boundary.",
      "Would deletion of an object erase evidence of its destruction? Invalidation and retention policy require a recorded event when archive policy applies."
