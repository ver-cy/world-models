    "canon_and_patch": {
      "canonicalization_rules": [
        "A canonical form must be defined and reproducible before any assertion is signed; the canonicalisation rule identifier and version are recorded in the envelope so that a verifier can reconstruct the signed bytes without the original transport.",
        "Time values are canonicalised to RFC 3339 with seconds and an explicit offset or Z; when a value is normalised to UTC, the local zone offset in effect at the place of the event is retained as a separate element rather than discarded.",
        "Identifiers are canonicalised by scheme, not by string case folding alone; an external identifier is retained verbatim as received alongside any normalised local form.",
        "Absent elements are canonicalised as absent, never as empty strings or zero values, so that unknown, not-applicable and withheld remain distinguishable through their explicit markers."
      ],
      "patch_rules": [
        "Provenance assertions are append-only: a correction is expressed as a superseding assertion referencing the prior one, never as an in-place edit of signed content.",
        "A patch that would change the meaning of a signed statement invalidates the signature and must be re-sealed; the superseded envelope is retained with its original verification history.",
        "Redaction is the only sanctioned removal operation and must leave a visible placeholder, a reason code and the identity of the redacting party.",
        "Merges of statements sharing an identifier record conflicting attributes rather than silently preferring one; unresolved merges are quarantined and reported."
      ],
      "compatibility_rules": [
        "Adding an optional element or a new relation type is a minor change; making an element mandatory, narrowing a cardinality, changing an element's meaning or retiring a relation type is a breaking change requiring a new profile major version.",
        "Consumers must ignore unknown elements rather than reject the assertion, so that producers on a newer profile remain interoperable with older consumers.",
        "Mappings to an external vocabulary are pinned to a target version; a new target version creates a new mapping row rather than replacing the existing one.",
        "No conformance to an external standard is asserted in an exchanged record unless a validation evidence reference accompanies the claim."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier issued by the system of record for the subject or the event, retained with its issuing authority.",
        "Governed global identifier or IRI from a recognised scheme where no master-system identifier exists.",
        "UUID (time-ordered, such as UUIDv7) or ULID minted by the adopting Dimension, recorded together with the minting authority and minting time.",
        "Content digest may serve as a matching key for immutable artifacts but is a binding, not an identity, and never replaces an assigned identifier for mutable or versioned subjects.",
        "A date, a filename, a path, a display label or a sequence position is never used as an identifier."
      ],
      "timestamp_rule": "All time values are recorded in RFC 3339 format with seconds precision and an explicit UTC offset or Z. Occurrence time and record/observation time are stored in separate named elements and are never conflated; where an event occurred in a local zone, the zone offset in effect at that time and place is retained separately from any UTC-normalised value. Claimed precision is recorded whenever it is coarser than the field allows.",
      "serial_naming_rule": "Serial artifacts (event records, custody register entries, fixity and verification reports, redaction and disposition logs) are named by the artifact class plus the subject or assertion identifier plus a monotonic sequence number, with the RFC 3339 recorded instant carried as data rather than embedded in the name. Ordering within a series is by occurrence time with recorded time as tiebreaker and the sequence number as final tiebreaker; sequence numbers are never reused after a gap and gaps are recorded explicitly.",
      "integrity_rule": "Every artifact that leaves the producing system carries at least one digest over a defined extent with a named algorithm, and where the artifact is authoritative it carries a signature bound to a signer identity plus, where available, a trusted time-stamp. Digests are retained after algorithm deprecation alongside replacements. A fixity or signature failure produces a new dated report and an integrity exception; it never overwrites the recorded expected value, and it never silently downgrades a previously recorded verification verdict."
    },
    "policies": [
      "Provenance is append-only and evidence-preserving: no operation may make a previously recorded fact, verdict or conflict disappear without leaving a superseding record that states what changed, when, by whom and why.",
      "Absence is never evidence: an unknown, not-applicable or withheld provenance fact must be marked explicitly, and a consumer must not infer that unmarked absence means the fact does not exist.",
      "No conformance claim without evidence: external standards are recorded as alignments in the crosswalk, and any statement of conformance must reference validation evidence and its scope.",
      "Signed content is immutable: corrections are issued as superseding assertions, and any change to signed bytes requires re-sealing with the superseded envelope and its verification history retained.",
      "Provenance records are governed as records in their own right, with their own retention authority, legal-hold handling and disposition evidence, which may differ from the subject's.",
      "Personal data appearing in provenance is minimised to what is necessary for accountability, with position or role identifiers preferred over named individuals where that preserves the accountability chain.",
      "Do not infer that a valid, well-formed or signed provenance record means the subject is authentic, lawful, unbiased or good.",
      "Honor creator control and privacy: omit or redact personal provenance fields when the creator withheld them, and do not reconstruct withheld identity from side channels.",
      "When multiple providers supply contradictory records, keep all records, attribute each to its provider, and apply an explicit selection policy rather than overwriting.",
      "Deletion of a subject does not imply deletion of its provenance when OAIS or legal-hold policy requires keeping history of destruction; record invalidation as an event."
    ],
