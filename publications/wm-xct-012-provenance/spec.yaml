  "functions": [
    {
      "id": "anchor-subject",
      "name": "Anchor provenance to a subject",
      "description": "Bind a provenance assertion to one or more identified subjects at a declared granularity, with descriptors and a match rule that lets a verifier decide whether an artifact in hand is the subject.",
      "inputs": [
        "subject identifier and issuing authority",
        "subject descriptor including digest set where computable",
        "granularity level",
        "match rule selection"
      ],
      "outputs": [
        "subject anchor record",
        "anchor validation result"
      ],
      "preconditions": [
        "Subject identifier resolves under a declared authority or a UUID/ULID is minted with the minting authority recorded",
        "Granularity level is declared before any statement is attached"
      ],
      "effects": [
        "Subsequent provenance statements in the assertion acquire a defined scope",
        "Ambiguous or unresolvable anchors are rejected rather than stored"
      ],
      "source_refs": [
        "SRC-007",
        "SRC-005",
        "SRC-017"
      ]
    },
    {
      "id": "record-provenance-event",
      "name": "Record a provenance event",
      "description": "Create an append-only record of an origination, transformation, transfer, disposition or verification act, with separate occurrence and recorded times, responsible agents and used and generated entities.",
      "inputs": [
        "event type",
        "occurrence time and local zone offset",
        "agent references and roles",
        "used and generated entity references",
        "activity parameters"
      ],
      "outputs": [
        "event record identifier",
        "recorded provenance statement"
      ],
      "preconditions": [
        "Subject anchor exists",
        "Recording clock source is declared",
        "Agent references resolve in the governing agent registry or are recorded as unresolved"
      ],
      "effects": [
        "Event is appended to the subject's provenance series",
        "Recorded time is set by the recording system and cannot be supplied by the caller"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-010",
        "SRC-014",
        "SRC-013"
      ]
    },
    {
      "id": "assert-derivation",
      "name": "Assert a derivation relation",
      "description": "Record a typed relation between the subject and a prior entity, optionally qualified by the activity, role and times through which the relation arose.",
      "inputs": [
        "source entity reference",
        "relation type",
        "qualifying activity reference",
        "usage and generation times"
      ],
      "outputs": [
        "derivation statement",
        "updated lineage graph edge"
      ],
      "preconditions": [
        "Both entities are identified",
        "Relation type is drawn from the governed relation vocabulary or a generic influence relation is used with a stated reason"
      ],
      "effects": [
        "Lineage traversal from the subject reaches the source entity",
        "Ordering constraints between the related events become checkable"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-010"
      ]
    },
    {
      "id": "seal-assertion",
      "name": "Seal a provenance assertion",
      "description": "Produce a signed envelope over a typed provenance payload, distinguishing statements the signer originates from statements gathered from other components, and attach a trusted time-stamp where available.",
      "inputs": [
        "provenance payload",
        "payload or predicate type",
        "signer credential reference",
        "time authority reference"
      ],
      "outputs": [
        "signed attestation envelope",
        "time-stamp evidence object"
      ],
      "preconditions": [
        "Canonical form of the payload is defined and reproducible",
        "Signer credential is valid at signing time",
        "Originated and gathered statements are separately marked"
      ],
      "effects": [
        "Payload becomes tamper-evident and attributable to a signer",
        "Later mutation requires a superseding assertion rather than an edit"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-007",
        "SRC-006"
      ]
    },
    {
      "id": "verify-assertion",
      "name": "Verify a provenance assertion",
      "description": "Check an assertion for structural well-formedness, cryptographic validity and trust against a declared trust list, returning a graded outcome with per-check status codes.",
      "inputs": [
        "signed attestation envelope",
        "trust list identifier and version",
        "credential status source",
        "verification instant"
      ],
      "outputs": [
        "verification report",
        "verification grade",
        "per-check status codes"
      ],
      "preconditions": [
        "Canonicalisation rule is available to reconstruct the signed bytes",
        "Trust list and its curating authority are declared"
      ],
      "effects": [
        "A dated, immutable verification report is appended",
        "A previously trusted assertion may be regraded without erasing the earlier verdict"
      ],
      "source_refs": [
        "SRC-005",
        "SRC-003"
      ]
    },
    {
      "id": "verify-fixity",
      "name": "Verify subject fixity",
      "description": "Recompute digests over the anchored extent of the subject and compare them with recorded values, recording the outcome as evidence regardless of result.",
      "inputs": [
        "subject reference",
        "recorded digest set",
        "canonical form rule",
        "check instant"
      ],
      "outputs": [
        "fixity check report",
        "fixity outcome per subject"
      ],
      "preconditions": [
        "At least one digest with a named algorithm is recorded",
        "The covered extent is unambiguously defined"
      ],
      "effects": [
        "Integrity evidence is refreshed with a dated outcome",
        "A mismatch raises an integrity exception and does not overwrite the recorded digest"
      ],
      "source_refs": [
        "SRC-017",
        "SRC-015",
        "SRC-007"
      ]
    },
    {
      "id": "validate-instance",
      "name": "Validate provenance instance consistency",
      "description": "Normalise a provenance instance and check it against ordering, uniqueness and impossibility constraints, reporting violations rather than silently repairing them.",
      "inputs": [
        "provenance instance",
        "constraint set identifier and version"
      ],
      "outputs": [
        "constraint check report",
        "validity verdict",
        "violated constraint references"
      ],
      "preconditions": [
        "All statements carry identifiers where the constraint set requires them",
        "Time values are RFC 3339 with explicit offset or Z so that ordering is decidable"
      ],
      "effects": [
        "Invalid instances are flagged and quarantined rather than merged into the canonical graph",
        "Merged statements sharing an identifier are recorded with their conflicting attributes"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-001"
      ]
    },
    {
      "id": "traverse-lineage",
      "name": "Traverse lineage",
      "description": "Return ancestors or descendants of a subject to a bounded depth, marking truncation points, unknown-provenance nodes and per-edge assertion sources.",
      "inputs": [
        "subject identifier",
        "direction",
        "depth and breadth limits",
        "relation type filter"
      ],
      "outputs": [
        "lineage graph export",
        "completeness statement",
        "continuation token where truncated"
      ],
      "preconditions": [
        "Traversal limits are declared before execution",
        "Cycle detection is enabled"
      ],
      "effects": [
        "Consumers receive an explicitly bounded result rather than a silently partial one",
        "Truncation reasons are distinguishable from genuine absence of ancestry"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-004",
        "SRC-013"
      ]
    },
    {
      "id": "resolve-provenance-record",
      "name": "Resolve provenance for a subject",
      "description": "Given only a subject, locate provenance about it through embedded records, link relations, a resolver service or soft-binding lookup, and report which mechanism succeeded.",
      "inputs": [
        "subject or its digest or soft-binding identifier",
        "known resolver endpoints",
        "anchor qualifier"
      ],
      "outputs": [
        "provenance record locator",
        "retrieved assertion",
        "resolution mechanism used"
      ],
      "preconditions": [
        "At least one discovery mechanism is configured",
        "Anchor semantics are stated for changing resources"
      ],
      "effects": [
        "Consumers can obtain provenance without prior arrangement with the producer",
        "Failure to resolve is reported as unknown provenance rather than as absence of provenance"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-005"
      ]
    },
    {
      "id": "redact-provenance",
      "name": "Redact a provenance element",
      "description": "Remove or withhold a provenance element for privacy, confidentiality or legal reasons while retaining a visible placeholder and a reason, and re-evaluate what still verifies.",
      "inputs": [
        "target element reference",
        "redaction reason",
        "authorised redactor identity",
        "approval reference"
      ],
      "outputs": [
        "redaction log entry",
        "updated assertion with placeholder",
        "post-redaction verification grade"
      ],
      "preconditions": [
        "Redactor holds the authority for the element's originating party",
        "Reason code is drawn from the governed reason vocabulary"
