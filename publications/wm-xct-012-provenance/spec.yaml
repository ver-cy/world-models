        "id": "subject-anchoring-and-record-identity",
        "name": "Subject Anchoring and Provenance Record Identity",
        "description": "Establishes precisely what the provenance is about, at what granularity, and how the provenance assertion itself is identified, versioned and made subject to its own provenance.",
        "rationale": "A mix-in has no meaning until its attachment point is fixed. in-toto matches subjects purely by digest, C2PA binds a claim to specified byte ranges, PREMIS distinguishes intellectual entity from representation, file and bitstream, and PROV distinguishes an entity from its specialisations and alternates. Ambiguous anchoring is the single most common way provenance becomes unverifiable.",
        "source_refs": [
          "SRC-001",
          "SRC-005",
          "SRC-007",
          "SRC-017"
        ],
        "layers": [
