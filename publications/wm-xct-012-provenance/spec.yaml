      "owner_package_requirements": [
        "The adopting Dimension must designate a named owner accountable for the provenance application profile, the governed relation and reason vocabularies, and the crosswalk table, with a published contact and dispute channel.",
        "The owner must publish the identifier minting authority, the trust list or trust anchors relied on, the constraint set version used for validity checking, and the retention authority applicable to provenance records, before any assertion is issued in production.",
        "The owner must maintain a review cadence for external vocabulary version drift and for trust-list changes, and must record every profile change as a versioned, superseding profile rather than an in-place edit.",
        "The owner must declare which host models the mix-in is applied to and which provenance elements become mandatory for each, so that consumers can distinguish a genuinely absent fact from an element the profile never required."
      ],
      "namespace_guidance": "Local element identifiers are lower-kebab-case and stable for the life of the model; they are minted under a Dimension-controlled namespace and never reused after retirement. External vocabulary terms are referenced by their governed IRIs at a pinned version and are never redefined locally. Where a local element aligns with an external term, both identifiers are retained side by side in the crosswalk with an explicit mapping relation, so that a reference can always be traced to the authority that governs it.",
      "registry_links": [
        "Registry entry vr.wm-xct-012 (WM-XCT-012, Provenance), nav path NAV.XCT.PROV, entry kind mixin, status candidate.",
