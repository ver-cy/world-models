    "conflicts": [
      "The word 'provenance' is a homonym across the cited authorities. In DCMI it is a statement about changes of ownership and custody; in archival practice (RiC-CM) it centres on the creator and the accumulating body; in PROV and ISO lineage it is the derivation and process graph. This model keeps all three but separates them into custody, origination agent and derivation graph, and flags the mapping caution in the crosswalk.",
      "PROV permits an entity with no generation activity and identifies entities by IRI, whereas in-toto and SLSA identify subjects purely by digest and require one. A record that is valid under PROV can be unusable in an attestation pipeline and vice versa; the model therefore separates identity from binding rather than treating a digest as an identifier.",
      "Time normalisation conflicts: SLSA mandates UTC 'Z' timestamps, EPCIS requires a separate eventTimeZoneOffset alongside a UTC eventTime, and PROV/xsd:dateTime permits inline offsets. Normalising everything to UTC loses the local-time meaning EPCIS deliberately preserves, so this model requires both a normalised value and a retained local offset.",
      "Provenance versus audit scope conflicts: FHIR places usage and read events in AuditEvent while PREMIS treats many usage and management acts as preservation Events. A record that a system considers provenance in one regime is an audit record in the other, and merging them inflates provenance graphs with access traffic.",
      "ISO 19115 lineage permits a free-text lineage statement alongside structured process steps; the two can contradict each other and no source specifies which prevails. The model records the statement as text and requires structured steps to be treated as authoritative where both exist, which is an adopting-Dimension decision rather than a sourced rule.",
      "C2PA's training and data-mining assertion was removed from the core specification in version 2.0, while the AI Act requires machine-readable marking of AI-generated content and a training-content summary. No single cited assertion type discharges the legal obligation, so the model treats marking mechanism and training summary as separate elements and does not claim that any one manifest satisfies the regulation.",
      "dcterms:provenance is a human-readable ProvenanceStatement while PROV, PREMIS and EPCIS require structured events. Round-tripping through Dublin Core loses the graph, so the crosswalk records this as a lossy mapping rather than an equivalence.",
      "C2PA and SLSA both move quickly (C2PA 2.4 supersedes 2.2; SLSA v1.1 is marked retired in favour of v1.2). Version pinning in the crosswalk is therefore mandatory, and any node resting on a single fast-moving specification should be re-checked at each review cycle.",
      "ISO 19115-1:2014 defines provenance, citing ISO 5127, as the organization or individual that created, accumulated, maintained and used records, and defines lineage as provenance plus sources and production processes. W3C PROV uses provenance for the latter graph. Alignment must keep both senses labelled.",
      "Dublin Core dct:provenance is a narrative custody and ownership statement; PROV is a graph. PROV-DC maps the property to prov:has_provenance, not to wasAttributedTo.",
      "CIDOC separates legal title from physical custody; Dublin Core and many supply-chain practices lump them. Collapsing them is a Dimension choice, not conformance.",
      "C2PA refuses value judgements of good or bad; SLSA Build levels are assurance grades of production integrity. Do not equate a trusted C2PA manifest with SLSA Build L3.",
      "PROV unique-generation forbids two generations of one entity in a valid instance; Dublin Core created plus issued on one resource is common and is valid PROV only if modelled as specializations.",
      "C2PA v2 removed identified humans from assertions for privacy; PREMIS and PROV still treat Person agents as first-class. Sharing profiles must not re-identify withheld actors.",
      "ISO 14721:2025 allows information packages where PDI is optional (ingest first, describe later); OAIS users of earlier editions expected Provenance Information as part of PDI.",
      "in-toto and SLSA treat the builder as a trust boundary that must not be tenant-controlled for authenticity; PROV allows any agent to assert provenance, with trust decided separately."
