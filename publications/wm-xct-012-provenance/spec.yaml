    "regional_assumptions": [
      "The disclosure duties modelled here are EU-specific: Regulation (EU) 2024/1689 for synthetic-content marking, deepfake disclosure, high-risk logging and training-content summaries, and Regulation (EU) 2016/679 for source-of-personal-data disclosure, recipient notification and storage limitation. Equivalent or conflicting obligations in the United States, United Kingdom, China, India and elsewhere were not researched and must be added by the adopting Dimension.",
      "NARA's Universal ERM Requirements are United States federal-government requirements; their capture, transfer and disposition expectations are used here as an authoritative pattern, not as a globally applicable rule.",
      "GS1 EPCIS is voluntary in most markets but is relied on by sector-specific regimes (for example US food traceability); the model treats it as an alignment, not a mandate.",
      "The legal weight of digital signatures and trusted time-stamps varies by jurisdiction (for example eIDAS in the EU versus other electronic-signature regimes); the model records signature and time-stamp evidence without asserting its legal effect anywhere.",
      "Time representation assumes RFC 3339 and the proleptic Gregorian calendar; non-Gregorian calendar systems, historical calendar changes and uncertain or fuzzy historical dating (common in archival provenance) are not represented.",
