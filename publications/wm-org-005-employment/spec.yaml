  "model": {
    "registry_id": "vr.wm-org-005",
    "model_id": "WM-ORG-005",
    "name": "Employment",
    "entry_kind": "relationship",
    "purpose": "Represent one governed, jurisdiction-qualified employment relationship between a worker party and an employing party, including identity, classification evidence, terms, assignment realization, continuity, separation, disagreement and provenance without depending on storage or interface format.",
    "scope_statement": "Owns employment relationship identity, party-role topology, asserted basis and jurisdiction, purpose-qualified classification assertions and determinations, effective term bindings, assignment realization links, relationship state, continuity and separation events, party assertions, evidence quality, privacy and interoperability projections while external systems own parties, positions, assignments, occupations, contracts, payroll, attendance, benefits, tax, social insurance, qualifications, recruitment, access grants and evidence objects.",
    "in_scope": [
      "Employment relationship identity, worker and employing-party bindings, multi-party roles, basis, jurisdiction, classification assertions, determinations and recognition indicators",
      "Commencement, probation, term bindings, working-time and workplace context, position, assignment, occupation and skill references",
      "Relationship state, continuity, interruption, succession, separation, disputes, evidence, privacy, retention, verification, provenance and exchange"
    ],
    "out_of_scope": [
      "Generic organizational membership and affiliation, which belong to WM-ORG-006 Membership",
      "Person, organization, unit, position, occupation, assignment, contract, payroll, compensation, attendance, benefits, tax, social insurance, qualification, recruitment, performance and work-product master lifecycles",
      "A universal legal definition of employee, worker or self-employment, or automatic authority for an agent to determine status, change terms, disclose sensitive data or end employment"
    ],
    "boundary_notes": [
      {
        "neighbor": "Membership",
        "distinction": "Employment is a work relationship with asserted legal or factual basis, terms and labour effects; generic belonging, affiliation and member standing are owned by WM-ORG-006.",
        "source_refs": [
          "SRC-001",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Work Assignment",
        "distinction": "WM-ORG-016 owns assignment identity, scope, duties, execution and lifecycle; Employment owns only the typed, time-qualified link showing which assignments realize the relationship.",
        "source_refs": [
          "SRC-004",
          "SRC-007",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Position, Role and Occupation",
        "distinction": "A position can exist vacant, a role is a reusable concept and an occupation classifies similar jobs; none is an employment relationship or proves its legal status.",
        "source_refs": [
          "SRC-004",
          "SRC-005",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Contract, Policy, Law and Collective Agreement",
        "distinction": "Normative instruments retain independent identity, text, authority, version and lifecycle; Employment stores versioned applicability and precedence bindings.",
        "source_refs": [
          "SRC-001",
          "SRC-006",
          "SRC-008"
        ]
      },
      {
        "neighbor": "Payroll, Compensation, Attendance, Benefits, Tax and Social Insurance",
        "distinction": "Transactions and accounts remain external evidence or consequences; their existence or absence alone never proves relationship identity, status or continuity.",
        "source_refs": [
          "SRC-001",
