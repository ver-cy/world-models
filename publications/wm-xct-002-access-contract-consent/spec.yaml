  "composition": [
    {
      "target": "Any world-model entry whose data may cross an ownership or accountability boundary",
      "relation": "MIX-IN",
      "purpose": "Attach permission, consent, lifecycle and decision semantics to a host entry without the host having to redefine them; the host contributes only the object references that scope clauses select over.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-007"
      ]
    },
    {
      "target": "world.ownership — ownership, title and delegation model (legacy S1)",
      "relation": "REFERENCE",
      "purpose": "Resolve whether the grantor held the right to permit, and in which capacity; a grant whose authority basis fails verification is void here and corrected there.",
      "required": true,
      "source_refs": [
        "SRC-003",
        "SRC-011"
      ]
    },
    {
      "target": "world.disclosureScope — disclosure shape and projection policy model (legacy S3)",
      "relation": "REFERENCE",
      "purpose": "Each scope clause points at a projection policy identifier that determines the shape in which covered objects leave; this model never describes shape itself.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-007"
      ]
    },
    {
      "target": "world.accessAudit — access audit model (legacy S4)",
      "relation": "REFERENCE",
      "purpose": "Every decision rendered, every exercise of a grant and every read of the instrument itself is logged there against the decision correlation identifier produced here.",
      "required": true,
      "source_refs": [
        "SRC-008",
        "SRC-014"
      ]
    },
    {
      "target": "world.accessEnforcement — enforcement and violation model (legacy S7)",
      "relation": "REFERENCE",
      "purpose": "Undischarged duties and out-of-scope reads escalate into cases there; this model contributes the duty definition, its deadline and its discharge status.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-013"
      ]
    },
    {
      "target": "Generic contract primitive (parties, terms, formation, termination)",
      "relation": "EXTEND",
      "purpose": "This model specialises the general agreement primitive for permission to read, adding consent evidence, capacity verification and a coverage-decision surface that a generic contract does not carry.",
      "required": false,
      "source_refs": [
        "SRC-001"
      ]
    },
    {
      "target": "ODRL Information Model 2.2 and ODRL Vocabulary & Expression 2.2",
      "relation": "ALIGN",
      "purpose": "Map the instrument onto Policy/Agreement, Permission, Prohibition and Duty with assigner, assignee, target, action and constraint; adopt the conflict strategy vocabulary. No conformance is claimed, since ODRL carries no consent-evidence, capacity or state-machine concepts.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-002"
      ]
    },
    {
      "target": "ISO/IEC TS 27560:2023 consent record information structure, as rendered by the DPVCG guide with DPV 2.1",
      "relation": "ALIGN",
      "purpose": "Map the consent record and receipt onto the standardised record structure, event fields and consent status vocabulary so records can be exchanged and lifecycle-managed across systems.",
      "required": false,
      "source_refs": [
        "SRC-005",
        "SRC-006",
        "SRC-016"
      ]
    },
    {
      "target": "HL7 FHIR R5 Consent resource",
      "relation": "ALIGN",
      "purpose": "Map grantor, grantee, manager, controller, verification, decision and nested provisions for health-sector exchange; note the state vocabularies are not isomorphic with DPV.",
      "required": false,
      "source_refs": [
        "SRC-007"
      ]
    },
    {
      "target": "OASIS XACML 3.0",
      "relation": "ALIGN",
      "purpose": "Adopt the separation of decision point from enforcement point, the four-value outcome vocabulary and obligation expressions as the semantics of the coverage-decision surface.",
      "required": false,
      "source_refs": [
        "SRC-008"
      ]
    },
    {
      "target": "Kantara UMA 2.0 grant and IETF RFC 9396 authorization details",
      "relation": "ALIGN",
      "purpose": "Project a standing instrument into runtime tokens and fine-grained authorization details, so an enforcing party can act on the granted scope and actions without reading the instrument.",
      "required": false,
      "source_refs": [
        "SRC-009",
        "SRC-010"
      ]
    },
    {
      "target": "W3C Verifiable Credentials Data Model 2.0",
      "relation": "ALIGN",
      "purpose": "Express the receipt as an independently verifiable credential with validFrom, validUntil, evidence, termsOfUse and a checkable credentialStatus supporting revocation and suspension.",
      "required": false,
      "source_refs": [
        "SRC-012"
      ]
    },
    {
      "target": "GA4GH / OBO Data Use Ontology (DUO)",
      "relation": "ALIGN",
      "purpose": "Supply governed purpose codes and use modifiers for research data access, demonstrating that purposes and duties are coded reference data rather than free text.",
      "required": false,
      "source_refs": [
        "SRC-013"
      ]
    },
    {
      "target": "Privacy notice and transparency model",
      "relation": "REFERENCE",
      "purpose": "Resolve the exact notice version presented at capture; this model stores only an immutable snapshot as evidence and never becomes the master of notice text.",
      "required": false,
      "source_refs": [
        "SRC-005",
        "SRC-015"
      ]
    },
    {
      "target": "Purpose, data category and action vocabularies registry",
      "relation": "COMPOSE",
      "purpose": "Coded purposes, data categories, actions and duties are resolved from governed vocabularies whose versions are recorded on the instrument; the model composes them rather than embedding copies.",
      "required": true,
      "source_refs": [
        "SRC-006",
        "SRC-013",
        "SRC-002"
      ]
    }
  ],
  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "The adopting Dimension must name a single accountable steward for each instrument class and publish the escalation path for disputed assertions; the default steward for an instrument is the grantor.",
        "The Dimension must publish, and version, the jurisdiction profiles, the conflict resolution declaration, the retention schedule and the contract projection profiles before any instrument may be activated under it.",
        "The Dimension must declare which governed vocabularies supply purpose codes, data category codes, action codes and duty codes, pinning the version in force, and must record that version on every instrument it activates.",
        "The Dimension must operate or designate a decision service that implements the declared outcome vocabulary and fail-closed default, and must not permit enforcement points to read instrument content directly.",
        "The Dimension must not create permission on a grantor's behalf beyond what the ownership and delegation model records as delegated authority."
      ],
      "namespace_guidance": "Use a stable reverse-domain or registry-rooted namespace per Dimension, with the model segment fixed as the access-contract namespace and sub-namespaces for agreement, consent, lifecycle, decision, assurance and interoperability concerns. Instrument identifiers are minted inside the Dimension namespace; purpose, action, data category and duty terms are referenced by their owning vocabulary's IRI and are never minted locally except through a declared extension namespace that is explicitly marked non-interoperable.",
      "registry_links": [
        "Registry entry vr.wm-xct-002 (WM-XCT-002) is the canonical record of this mixin, its status and its review state.",
        "Sibling registry entries for the ownership, disclosure-scope, access-audit and enforcement models must be resolvable before an instrument is activated, since three of the four are required composition targets.",
        "Governed vocabulary registrations for purpose, action, data category and duty terms must be listed with pinned versions in the Dimension's package manifest."
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "The canonical form of an instrument or consent record is the abstract field set with values in their declared value kinds; storage encodings such as JSON, YAML, Markdown, XML or a document store are projections and never authoritative.",
        "All time values are normalised to RFC 3339 with seconds and an explicit offset or Z before canonicalisation; a value lacking an offset is rejected rather than assumed to be UTC.",
        "Field ordering is normalised deterministically and collections are ordered by their declared key before a digest is computed; the canonicalisation algorithm identifier and version are recorded alongside every digest.",
        "Fields excluded from the digest — such as transient synchronisation state and cache metadata — are enumerated explicitly in the integrity manifest, never inferred.",
        "Coded values are canonicalised as the full governed IRI plus the pinned vocabulary version, not as a local short code."
      ],
      "patch_rules": [
        "Instruments and consent records are append-only: a change produces a new version that names its predecessor, and no prior version is mutated or deleted while its retention period runs.",
        "A patch must declare its change class, because the class determines whether re-consent is required before the new version may activate.",
        "Corrections to a recorded timestamp or assertion are expressed as a correction event carrying the superseded value, the corrector identity and the correction time; the original value remains readable.",
        "Consent events, propagation ledger entries, obligation discharges and integrity manifests are strictly append-only and admit no patch operation at all.",
        "A patch that would narrow scope takes effect from its stated instant forward and never retroactively invalidates a read already performed under the prior version."
      ],
      "compatibility_rules": [
        "Adding an optional field, a new coded term or a new named projection is a minor change; removing a field, narrowing cardinality, changing a value kind, altering the state set or changing the fail-closed default is a breaking change requiring a major version.",
        "The schema version is carried on every instrument and consent record so that a consumer can refuse to interpret a version it does not understand rather than guessing.",
