  "functions": [
    {
      "id": "verify-grantor-authority",
      "name": "Verify grantor authority",
      "description": "Check that the asserted grantor could lawfully permit the read, in the capacity claimed, against the ownership or delegation record, and record the outcome and time.",
      "inputs": [
        "grantor identifier",
        "claimed capacity code",
        "covered object references",
        "authority evidence references"
      ],
      "outputs": [
        "verification outcome",
        "verified capacity scope",
        "verification timestamp",
        "authority verification record reference"
      ],
      "preconditions": [
        "Grantor identifier resolves in a named master system",
        "Ownership or delegation record is reachable, or an explicit unreachable outcome is produced"
      ],
      "effects": [
        "Authority verification record is created",
        "Instrument is blocked from activation if verification fails"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-007",
        "SRC-011"
      ]
    },
    {
      "id": "draft-grant",
      "name": "Draft grant instrument",
      "description": "Assemble a proposed instrument from parties, scope clauses, purpose, permitted actions, constraints and duties, and validate it against the applicable jurisdiction profile without activating it.",
      "inputs": [
        "grantor and grantee references",
        "scope clause set",
        "purpose codes and text",
        "permitted and prohibited actions",
        "constraints and duties",
        "jurisdiction profile version"
      ],
      "outputs": [
        "draft instrument with version identifier",
        "validation report of missing mandatory elements"
      ],
      "preconditions": [
        "Jurisdiction profile is resolvable",
        "Scope selectors meet the declared specificity floor"
      ],
      "effects": [
        "Instrument is created in a proposed state",
        "No read becomes permissible"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-007",
        "SRC-011"
      ]
    },
    {
      "id": "capture-consent",
      "name": "Capture consent act",
      "description": "Record an act of assent with its capture context, notice version, act time and record time, and assess it against the validity elements required by the governing regime.",
      "inputs": [
        "draft instrument reference",
        "indication mechanism",
        "notice version reference",
        "language tag",
        "acting party and capacity",
        "act timestamp"
      ],
      "outputs": [
        "consent record",
        "validity assessment",
        "consent status"
      ],
      "preconditions": [
        "Notice version snapshot exists and is immutably retrievable",
        "Acting party capacity has been verified"
      ],
      "effects": [
        "Consent record is appended",
        "Instrument becomes eligible for activation where consent is the declared basis"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-004",
        "SRC-005",
        "SRC-016"
      ]
    },
    {
      "id": "activate-grant",
      "name": "Activate grant",
      "description": "Move a validated instrument into force from a stated instant, fixing the version that governs and publishing its validity for decision points.",
      "inputs": [
        "instrument version reference",
        "basis reference (consent record or other legal basis)",
        "requested effective instant"
      ],
      "outputs": [
        "active instrument state",
        "effective-from timestamp",
        "activation event"
      ],
      "preconditions": [
        "Authority verification succeeded",
        "All mandatory elements for the jurisdiction profile are present",
        "Any pre-condition duties are discharged"
      ],
      "effects": [
        "Reads within scope become permissible from the effective instant",
        "Activation event is emitted to the audit model"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-003",
        "SRC-007"
      ]
    },
    {
      "id": "issue-receipt",
      "name": "Issue receipt to grantor",
      "description": "Produce and deliver the durable, portable copy of what was agreed, including the withdrawal method and a checkable status reference.",
      "inputs": [
        "consent record reference",
        "instrument version reference",
        "grantor delivery channel"
      ],
      "outputs": [
        "consent receipt artefact",
        "delivery confirmation",
        "receipt status endpoint reference"
      ],
      "preconditions": [
        "Consent record exists and passes integrity check",
        "Delivery channel is known and validated"
      ],
      "effects": [
        "Receipt is issued and its status becomes checkable",
        "Delivery is recorded against the consent record"
      ],
      "source_refs": [
        "SRC-012",
        "SRC-014",
        "SRC-015",
        "SRC-016"
      ]
    },
    {
      "id": "evaluate-coverage",
      "name": "Evaluate coverage of a proposed read",
      "description": "Given a proposed read, determine whether an in-force instrument covers it, apply constraints and the declared conflict strategy, and return an outcome with any obligations and a validity horizon.",
      "inputs": [
        "requesting party identifier and assurance level",
        "target object references",
        "proposed action code",
        "declared purpose code",
        "evaluation context attributes"
      ],
      "outputs": [
        "decision outcome",
        "returned obligations",
        "scope fingerprint",
        "validity horizon",
        "decision correlation identifier"
      ],
      "preconditions": [
        "Required attributes are supplied or an unevaluable outcome is produced",
        "Conflict resolution declaration version is resolvable"
      ],
      "effects": [
        "Decision response is produced",
        "Decision correlation identifier is emitted for audit logging",
        "No contract content is disclosed to the requester"
      ],
      "source_refs": [
        "SRC-008",
        "SRC-009",
        "SRC-010"
      ]
    },
    {
      "id": "amend-instrument",
      "name": "Amend instrument",
      "description": "Apply a classified change to a live instrument, creating a new version, and require a fresh consent act where the change class demands one.",
      "inputs": [
        "instrument version reference",
        "proposed change set",
        "change classification",
        "authority of the amending party"
      ],
      "outputs": [
        "new instrument version",
        "amendment record",
        "re-consent requirement flag"
      ],
      "preconditions": [
        "Instrument is in a state that permits amendment",
        "Amending party holds the required authority"
      ],
      "effects": [
        "New version supersedes the prior version from a stated instant",
        "Prior version is retained and remains resolvable"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-004",
        "SRC-011"
      ]
    },
    {
      "id": "terminate-instrument",
      "name": "Terminate instrument",
      "description": "End a grant by withdrawal, revocation, expiry, supersession or invalidation, recording the reason, the effective instant and any reliance exception.",
      "inputs": [
        "instrument reference",
        "termination reason code",
        "issuing party",
        "requested effective instant"
      ],
      "outputs": [
        "revocation or termination notice",
        "updated state",
        "effective instant"
      ],
      "preconditions": [
        "Issuing party is authorised for the stated reason",
        "Effective instant is not earlier than any binding non-retroactivity rule permits"
      ],
      "effects": [
        "No further read is covered from the effective instant",
        "Prior lawful reads remain lawful unless a stated rule provides otherwise",
        "Post-termination surviving duties become active"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-006",
        "SRC-011"
      ]
    },
    {
      "id": "propagate-termination",
      "name": "Propagate termination downstream",
      "description": "Notify every recipient that received data under the grant, collect cutoff and deletion acknowledgements, and record any recipient that cannot be reached.",
      "inputs": [
        "termination event reference",
        "recipient list or recipient categories",
        "notification deadline"
      ],
      "outputs": [
        "propagation ledger entries",
        "propagation status",
        "impossibility justifications"
      ],
      "preconditions": [
        "Termination event exists",
        "Recipient contact routes are known or an impossibility record is produced"
      ],
      "effects": [
        "Recipients are notified within the deadline",
        "Unresolved recipients are surfaced to the accountable steward"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-013",
        "SRC-014"
      ]
    },
    {
      "id": "record-duty-discharge",
      "name": "Record duty discharge",
      "description": "Register that a grantee duty was fulfilled, with the evidence relied on, and update the duty status.",
      "inputs": [
        "duty reference",
        "evidence artefact",
        "discharging party",
        "discharge timestamp"
      ],
      "outputs": [
        "obligation discharge evidence artefact",
        "updated duty status"
      ],
      "preconditions": [
        "Duty exists and is not already discharged",
        "Evidence type is acceptable for the duty class"
      ],
      "effects": [
        "Duty status changes to discharged",
        "Any dependent suspension is lifted"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-013"
      ]
    },
    {
      "id": "project-contract-view",
      "name": "Project a view of the instrument",
      "description": "Return a named projection of the instrument to a requesting role — validity token, grantor ledger or grantee entitlement list — omitting everything outside that projection.",
      "inputs": [
        "instrument reference",
        "requesting role",
        "projection name and version"
      ],
      "outputs": [
        "projected view",
        "applied projection version",
        "access log entry reference"
      ],
      "preconditions": [
        "Requesting role is mapped to the requested projection",
        "Projection profile version is resolvable"
      ],
      "effects": [
        "Only the projected fields are disclosed",
        "The read of the instrument is itself logged in the audit model"
      ],
      "source_refs": [
        "SRC-008",
        "SRC-009",
        "SRC-014"
      ]
    },
    {
      "id": "apply-retention-disposal",
      "name": "Apply retention and disposal",
      "description": "Evaluate the retention schedule against terminated instruments and their evidence, and minimise, anonymise, tombstone or destroy each record class accordingly.",
      "inputs": [
        "record class",
        "termination timestamp",
        "retention schedule version",
        "competing obligation references"
      ],
      "outputs": [
        "disposal state",
        "disposal action record",
        "surviving tombstone field set"
      ],
      "preconditions": [
        "Retention period has elapsed or an erasure request has been assessed",
        "No competing legal hold applies, or the hold is recorded"
      ],
      "effects": [
        "Records are minimised, anonymised, tombstoned or destroyed",
        "Integrity manifests for destroyed records are retained as evidence of prior existence"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-004",
        "SRC-011"
      ]
    },
    {
      "id": "conflict-evaluation",
      "name": "Conflict evaluation",
      "description": "Detect Permission/Prohibition/Action-inheritance clashes and apply the instrument's conflict strategy or fail invalid.",
      "inputs": [
        "access_contract_id",
        "candidate_action",
        "candidate_target"
      ],
      "outputs": [
        "conflict_detected",
        "conflict_strategy_applied",
        "resulting_decision"
      ],
      "preconditions": [
        "Rules and action includedIn/implies graph are available."
      ],
      "effects": [
        "Does not change stored rules.",
        "Returns invalid when strategy is invalid or when privacy default-deny forbids perm-overrides-prohibition without an explicit profile."
      ],
      "source_refs": [
        "SRC-001"
      ]
    }
