  "structure": {
    "bundles": [
      {
        "id": "grant-instrument",
        "name": "Grant Instrument",
        "description": "The permission itself as a durable object: who permits, who may read, over which slice, for which purpose, under which conditions, and with which duties attached to the reader.",
        "rationale": "Every authoritative instrument examined separates the same components: ODRL splits a Rule into party functions, target, action, constraint and duty; HIPAA 164.508 enumerates description of information, authorised parties, purpose and expiration as core elements; FHIR Consent nests actor, action, purpose, dataPeriod and data inside provisions. Modelling these as one bundle keeps the instrument independent of the data it covers.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-007",
          "SRC-011"
        ],
        "layers": [
          {
            "id": "parties-and-authority",
            "name": "Parties and Authority",
            "description": "The grantor and the grantee, the capacity in which each acts, and the verification that the grantor was entitled to permit at all.",
            "source_refs": [
              "SRC-001",
              "SRC-007",
              "SRC-009",
              "SRC-011"
            ],
            "findings": [
              {
                "id": "grantor-authority-basis",
                "name": "Grantor identity and authority basis",
                "description": "Who asserts the right to permit reading, in what capacity (self, personal representative, guardian, delegate, institutional custodian), what evidence supports that capacity, and the outcome and time of verification against the ownership or delegation record. A grant issued without a verified basis is void rather than merely disputed.",
                "source_refs": [
                  "SRC-003",
                  "SRC-004",
                  "SRC-007",
                  "SRC-009",
                  "SRC-011"
                ],
                "questions": [
                  {
                    "id": "q-grantor-identifier",
                    "text": "Which authoritative identifier designates the grantor, and in which master system is it resolved?",
                    "kind": "identity",
                    "answer_data": [
                      "grantor identifier value",
                      "issuing master system identifier",
                      "identifier scheme or namespace",
                      "resolution timestamp"
                    ]
                  },
                  {
                    "id": "q-grantor-capacity",
                    "text": "In what capacity does the grantor act — data subject, owner, personal representative, guardian, or delegate?",
                    "kind": "authority",
                    "answer_data": [
                      "capacity code from governed vocabulary",
                      "reference to the delegation or guardianship record relied on",
                      "scope limits of that capacity"
                    ]
                  },
                  {
                    "id": "q-authority-evidence",
                    "text": "What evidence documents the representative's authority, and when was it last verified?",
                    "kind": "evidence",
                    "answer_data": [
                      "evidence artefact reference",
                      "verifier identity",
                      "verification outcome",
                      "verification timestamp with offset"
                    ]
                  },
                  {
                    "id": "q-authority-lapse",
                    "text": "What happens to an active grant if the authority basis lapses or is later found invalid?",
                    "kind": "exception",
                    "answer_data": [
                      "effect code (void ab initio, suspend, terminate forward)",
                      "effective instant of the effect",
                      "reason code",
                      "notification obligation"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "grantor-id",
                    "name": "Grantor identifier",
                    "description": "Authoritative identifier of the party permitting the read, resolved in a named master system.",
                    "value_kind": "identifier",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-001",
                      "SRC-007"
                    ]
                  },
                  {
                    "id": "grantor-capacity-code",
                    "name": "Grantor capacity",
                    "description": "Coded capacity in which the grantor acts, drawn from a governed vocabulary.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-007",
                      "SRC-011"
                    ]
                  },
                  {
                    "id": "authority-verification-outcome",
                    "name": "Authority verification outcome",
                    "description": "Result of checking the asserted capacity against the ownership or delegation record, with the time of the check.",
                    "value_kind": "object",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-003",
                      "SRC-011"
                    ]
                  }
                ],
                "artifacts": [
                  {
                    "id": "authority-verification-record",
                    "name": "Authority verification record",
                    "description": "The captured evidence and outcome of confirming that the grantor could lawfully permit the read, including any representative documentation relied on.",
                    "media_or_form": [
                      "structured record object",
                      "signed attestation",
                      "scanned or attached representative documentation"
                    ],
                    "serial": true,
                    "identity_strategy": "UUID or ULID assigned by the adopting Dimension, carrying the master ownership record identifier as a resolvable reference; one record per verification event.",
                    "source_refs": [
                      "SRC-011",
                      "SRC-003"
                    ]
                  }
                ],
                "inline_only_rationale": null
              },
              {
                "id": "grantee-designation",
                "name": "Grantee designation and onward recipients",
                "description": "Who may read under the grant — a named party, a defined class or collection, or the bearer of a ticket — and which onward recipients or sub-processors, if any, are inside the grant and under what flow-down duties.",
                "source_refs": [
                  "SRC-001",
                  "SRC-002",
                  "SRC-003",
                  "SRC-006",
                  "SRC-011"
                ],
                "questions": [
