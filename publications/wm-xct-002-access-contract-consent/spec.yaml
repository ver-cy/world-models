    "model_id": "WM-XCT-002",
    "name": "Access Contract / Consent",
    "entry_kind": "mixin",
    "purpose": "Provide a format-neutral, machine-readable instrument of permission to read: which party permits which reader to read which slice of data, for which declared purpose, under which conditions and duties, until when, on what evidence of assent, and how that permission is verified, changed and ended.",
    "scope_statement": "This mixin is attached to any world-model entry whose data may cross an ownership or accountability boundary. It owns the permission instrument (parties, scope selection, purpose, action, constraints, duties), the optional consent act and its evidence, the instrument lifecycle and its termination propagation, and the minimal decision surface by which a holder asks whether a specific read is covered. It does not own the data being shared, the shape in which it leaves, the log of exercises, or enforcement casework. Consent is modelled as one possible basis of a grant, not as a mandatory precondition, because lawful permission can also rest on contract, statute or court order.",
    "in_scope": [
      "The grant instrument: grantor, grantee, scope clauses, declared purpose, permitted action, validity window, machine-evaluable constraints and grantee duties",
      "The consent act where one exists: expression, capture context, notice version, validity elements, evidence record and portable receipt",
      "Authority and capacity to grant, including representative, guardian and delegate capacity, and the verification outcome of that authority",
      "Instrument lifecycle: proposal, activation, amendment, supersession, suspension, expiry, withdrawal and revocation, with explicit effective times",
      "Termination propagation to downstream holders and evidence of cutoff, deletion or return",
      "The coverage-decision request/response surface and its outcome vocabulary, including unevaluable outcomes",
      "Conflict and precedence handling across multiple applicable instruments",
      "Provenance, integrity and canonical form of instrument and consent records",
      "Retention and erasure of the instrument and its evidence",
      "Jurisdictional parameters that vary the instrument (governing law, age thresholds, conditioning rules, transfer conditions)"
    ],
    "out_of_scope": [
      "Ownership, title and delegation registries: authority is verified against them, not defined here",
      "Disclosure shape, redaction, masking and projection policies: referenced by identifier only",
      "The access audit log of individual read exercises",
      "Enforcement cases, sanctions and breach handling arising from violations",
      "Identity proofing and authentication of parties; the model consumes party identifiers and assurance levels",
      "Schemas, semantics or quality of the payload data itself",
      "Write, modify, delete and licensing/royalty permissions; the normative core is read/disclosure",
      "Token, key and protocol mechanics of OAuth, UMA or similar; these are projections of the decision surface",
      "Adjudication of whether a non-consent legal basis is lawful"
    ],
    "boundary_notes": [
