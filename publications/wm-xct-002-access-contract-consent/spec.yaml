        ]
      },
      {
        "neighbor": "Access audit model (legacy S4)",
        "distinction": "This model holds terms and current state; every exercise of a grant, and every decision rendered, is an event recorded in the audit model. Only the decision correlation identifier is retained here.",
        "source_refs": [
          "SRC-008",
          "SRC-014"
        ]
      },
      {
        "neighbor": "Access enforcement model (legacy S7)",
        "distinction": "Duties and their deadlines are declared here; detection of breach, escalation and remedy are cases there. This model records only whether a duty was discharged and on what evidence.",
        "source_refs": [
          "SRC-001",
          "SRC-013"
        ]
      },
      {
        "neighbor": "Legal-basis and lawfulness model",
        "distinction": "Consent is one legal basis among several. This mixin can carry a declared basis and, where the basis is consent, the full consent apparatus; it does not decide whether a non-consent basis is validly invoked.",
        "source_refs": [
