              {
                "id": "instrument-flavour-classification",
                "name": "Instrument classification",
                "description": "The same mixin covers several disjoint subtypes that MUST be classified rather than conflated: ODRL Set (generic rules), Offer (assigner offers, does not grant), Agreement (assigner has granted to assignee); FHIR privacy consent directive versus treatment or research-participation consent; ISO 27560 consent record (privacy processing) versus a non-personal usage licence. FHIR decision is permit or deny as the default, with nested provisions as exceptions. ODRL Policy may declare a conflict strategy (perm, prohibit, invalid). Regulatory basis and category support indexing but do not themselves grant access.",
                "source_refs": [
                  "SRC-001",
                  "SRC-003",
                  "SRC-017"
                ],
                "questions": [
                  {
                    "id": "instrument-flavour-classification-q01",
                    "text": "Is this instrument an Offer, an Agreement already granted, a FHIR draft, or a mere Set of rules?",
                    "kind": "classification",
                    "answer_data": [
                      "policy_subclass",
                      "status"
                    ]
                  },
                  {
                    "id": "instrument-flavour-classification-q02",
                    "text": "Does this grant authorise processing of personal data on a consent legal basis, or only usage of a non-personal asset?",
                    "kind": "classification",
                    "answer_data": [
                      "grant_flavour",
                      "regulatory_basis_codes"
                    ]
                  },
                  {
                    "id": "instrument-flavour-classification-q03",
                    "text": "If a requested read matches no provision, is the default permit, deny, or invalid-by-conflict?",
                    "kind": "decision",
                    "answer_data": [
                      "default_decision",
                      "conflict_strategy"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "instrument-flavour-classification-data01",
                    "name": "policy_subclass",
                    "description": "set | offer | agreement | fhir-consent | iso27560-record.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-001",
                      "SRC-017",
                      "SRC-005"
                    ]
                  },
                  {
                    "id": "instrument-flavour-classification-data02",
                    "name": "grant_flavour",
                    "description": "privacy-consent | usage-licence | mixed-only-if-principal-is-grantor.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-001",
                      "SRC-003"
                    ]
                  },
                  {
                    "id": "instrument-flavour-classification-data03",
                    "name": "default_decision",
                    "description": "permit | deny. FHIR Consent.decision; ODRL implies only stated permissions.",
                    "value_kind": "code",
