  "composition": [
    {
      "target": "Household and family membership model (sibling; legacy alias H2)",
      "relation": "REFERENCE",
      "purpose": "Household membership, filiation and kinship ties are separate registered acts and separate statistical units; Person holds only typed pointers to them.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-017"
      ]
    },
    {
      "target": "Population and community group model (sibling; legacy alias H3)",
      "relation": "REFERENCE",
      "purpose": "Group and community membership resolves against the person reference identifier and is never stored as a person attribute, particularly where it would reveal special-category data.",
      "required": false,
      "source_refs": [
        "SRC-011",
        "SRC-012"
      ]
    },
    {
      "target": "Education and qualification model (sibling; legacy alias H4)",
      "relation": "REFERENCE",
      "purpose": "Earned credentials anchor to the person as holder; credential content and awarding rules live in the qualification model.",
      "required": false,
      "source_refs": [
        "SRC-010",
        "SRC-006"
      ]
    },
    {
      "target": "Organization model (sibling; legacy alias O1)",
      "relation": "REFERENCE",
      "purpose": "Registrars, issuing authorities, credential issuers, verifiers and corporate guardians must resolve as organizations rather than being described inside Person.",
      "required": true,
      "source_refs": [
        "SRC-003",
        "SRC-004",
        "SRC-006"
      ]
    },
    {
      "target": "Address and place model (sibling)",
      "relation": "REFERENCE",
      "purpose": "Places of birth, death and residence resolve as place or address objects; Person stores pointers plus a residence kind and validity period.",
      "required": true,
      "source_refs": [
        "SRC-004",
        "SRC-001"
      ]
    },
    {
      "target": "Vital event and civil registration act model (sibling)",
      "relation": "REFERENCE",
      "purpose": "The registration act, informant details, certificate issuance and statistical coding belong to the event model; Person keeps anchors, roles and resulting status changes.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-017"
      ]
    },
    {
      "target": "Human biological organism and health subject model (sibling)",
      "relation": "REFERENCE",
      "purpose": "Explicit boundary: physiology, clinical findings, cause of death and genomic data are excluded here and must be reached only through a governed reference.",
      "required": false,
      "source_refs": [
        "SRC-009",
        "SRC-011"
      ]
    },
    {
      "target": "Consent and authorization service (legacy alias S1)",
      "relation": "COMPOSE",
      "purpose": "Grants, scopes, withdrawal and policy decisions over person data are executed by the consent service; Person declares what is subject-owned and which purposes exist.",
      "required": true,
      "source_refs": [
        "SRC-011",
        "SRC-017"
      ]
    },
    {
      "target": "Audit and evidence service (legacy alias S4)",
      "relation": "COMPOSE",
      "purpose": "Disclosure logs, lifecycle transition logs and correction records are written to the audit service so the person and oversight authorities can read them.",
      "required": true,
      "source_refs": [
        "SRC-017",
        "SRC-011"
      ]
    },
    {
      "target": "ISO/IEC 24760-1:2025 identity management framework",
      "relation": "ALIGN",
      "purpose": "Adopt the entity/identity/identifier/reference-identifier distinction and identity-register and relying-party roles as the model's conceptual vocabulary; the exact lifecycle state list must be bound to a published Dimension vocabulary.",
      "required": false,
      "source_refs": [
        "SRC-003"
      ]
    },
    {
      "target": "Core Person Vocabulary 2.00 (SEMIC)",
      "relation": "ALIGN",
      "purpose": "Map name components, birth and death facts, citizenship, domicile and the Identifier class with scheme, issuing authority and issue date.",
      "required": false,
      "source_refs": [
        "SRC-004"
      ]
    },
    {
      "target": "EUDI Wallet PID Rulebook (ARF Annex 3.01)",
      "relation": "ALIGN",
      "purpose": "Map the person identification data attribute set for wallet-based presentation, including predicate attributes such as age_over_18 and the issuer-defined personal administrative number policy.",
      "required": false,
      "source_refs": [
        "SRC-005"
      ]
    },
    {
      "target": "W3C Verifiable Credentials Data Model v2.0",
      "relation": "ALIGN",
      "purpose": "Express identity evidence as credentials with issuer, subject, validity window, status and proof, and use presentations for selective disclosure.",
      "required": false,
      "source_refs": [
        "SRC-006"
      ]
    },
    {
      "target": "W3C Decentralized Identifiers v1.0",
      "relation": "ALIGN",
      "purpose": "Provide the governed global identifier option at identity-priority level two, with documented correlation risk and controller-versus-subject separation.",
      "required": false,
      "source_refs": [
        "SRC-007"
      ]
    },
    {
      "target": "NIST SP 800-63A-4 identity proofing and enrollment",
      "relation": "ALIGN",
      "purpose": "Adopt resolution, validation and verification as recorded proofing steps producing an assurance level, while keeping authenticator management outside this model.",
      "required": false,
      "source_refs": [
        "SRC-008"
      ]
    },
    {
      "target": "HL7 FHIR R5 Patient",
      "relation": "ALIGN",
      "purpose": "Map to care-context demographics and reconcile the one-anchor-per-person rule with FHIR's multiple Patient records via link semantics rather than merge.",
      "required": false,
      "source_refs": [
        "SRC-009"
      ]
    },
    {
      "target": "schema.org Person",
      "relation": "ALIGN",
      "purpose": "Provide a lossy public publication projection only; no validity periods, authority or assurance semantics may be inferred from it.",
      "required": false,
      "source_refs": [
        "SRC-010"
      ]
    },
    {
      "target": "OASIS CIQ v3.0 xNL and xAL value shapes",
      "relation": "MIX-IN",
      "purpose": "Reuse structured, culture-aware name and address value shapes instead of re-inventing name part roles and ordering conventions.",
      "required": false,
      "source_refs": [
        "SRC-016"
      ]
    },
    {
      "target": "ISO/IEC 5218:2022 codes for the representation of human sexes",
      "relation": "ALIGN",
      "purpose": "Bind the administrative sex code list, noting the standard's explicit exclusion of gender identity, which forces separate modelling of self-identified gender.",
      "required": false,
      "source_refs": [
        "SRC-013",
        "SRC-005"
      ]
    },
    {
      "target": "ICAO Doc 9303 Part 3 (Eighth Edition, 2021)",
      "relation": "ALIGN",
      "purpose": "Bind machine-readable-zone name transliteration, truncation behaviour and biometric image encoding used by travel-document evidence.",
      "required": false,
      "source_refs": [
        "SRC-014"
      ]
    },
    {
      "target": "Regulation (EU) 2016/679 (GDPR)",
      "relation": "ALIGN",
      "purpose": "Regional legal alignment for lawful basis, special categories, accuracy, storage limitation and subject rights; other jurisdictions require their own binding.",
      "required": false,
      "source_refs": [
        "SRC-011",
        "SRC-012"
      ]
    }
  ],
  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "Name a civil registrar or register of record that owns the registered-identity bundles, and a distinct controller relationship for the personal-sphere bundle owned by the person.",
        "Publish, before any person record is created, the identifier schemes recognised, their issuing authorities, format rules, reuse policies and correlatability classes.",
        "Publish jurisdiction bindings: civil status vocabulary, administrative sex code list and version, nationality coding scheme, identity-record lifecycle state vocabulary and the retention schedule.",
        "Register the disclosure projections available to each relying-party class, and the lawful basis attached to each declared processing purpose.",
        "Declare the escalation and reversal procedures for merges, splits, presumed-death reversal and refused subject-right requests."
      ],
      "namespace_guidance": "Use one stable logical namespace per Dimension, for example <dimension>.person, with bundle-level sub-namespaces such as .civilIdentity, .identifiersEvidence, .legalStanding, .lifeCourse, .personalSphere, .dataGovernance and .qualityInterop. Namespaces are logical only and must not encode storage engine, file layout or access interface. Identifier scheme names are namespaced by issuing authority, never by consuming application. External code lists are referenced as namespaced, versioned registry entries rather than inlined literals.",
      "registry_links": [
        "vr.wm-per-001 is the registry entry of record for WM-PER-001 and holds its status, review state and priority metadata.",
        "Sibling registry entries for household, organization, address/place, vital-event and qualification models must exist and be linked before Person records reference them.",
        "External alignment targets (ISO/IEC 24760-1, Core Person Vocabulary, EUDI PID Rulebook, W3C VC and DID, FHIR Patient, schema.org, ISO/IEC 5218, ICAO Doc 9303, OASIS CIQ) are registered as versioned references with their retrieval dates.",
        "Code lists for sex, civil status, nationality, capacity class and lifecycle state are registered as separately versioned registry entries owned by the adopting Dimension."
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Serialise all recorded times as RFC 3339 with seconds and an explicit UTC offset or Z; keep date-only civil facts as dates with a stated precision and never widen them to timestamps.",
        "Order name parts by the declared ordering convention rather than by serialisation order, and always carry script and encoding alongside the value.",
        "Represent every coded value as a scheme reference plus version plus value; bare literals are non-canonical and must be rejected on ingest.",
        "Canonical person form is the reference identifier plus the set of scheme-qualified identifiers sorted by scheme name, then the current time-valid assertions sorted by element identifier.",
        "Store references to other models as model-qualified identifiers, never as embedded copies of the referenced object."
      ],
      "patch_rules": [
        "An attribute change is a new time-bounded assertion that supersedes the prior one; in-place mutation of a prior value is prohibited.",
        "A correction carries a correction reason, the authorising role and the evidence reference, and links to the superseded assertion, which is retained.",
        "Merge, split and lifecycle transitions are record-level patches that never rewrite the superseded record's history and always leave a resolvable tombstone.",
        "Every patch records occurrence, registration and ingestion times separately, even when they coincide.",
        "Erasure executed under a subject right is a patch that records the deletion method and the residual tombstone, not a silent removal."
      ],
      "compatibility_rules": [
        "Adding an optional finding, data element or code value is backward compatible; narrowing a code list, changing cardinality from optional to required, or repurposing an identifier scheme is breaking.",
        "Alignment mappings are versioned independently; a new version of an external standard does not implicitly change this model or its conformance posture.",
        "Removing a data element requires a deprecation period during which both the deprecated and replacement elements resolve.",
        "Changing the identity priority applied to an existing population is always breaking and requires a migration plan that keeps prior identifiers resolvable."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier: the civil register or population register entry identifier issued by the registrar of record for the jurisdiction.",
        "Governed global identifier or IRI: a resolvable identifier under a named, governed scheme such as a DID or registry IRI, used where no civil register identifier exists or where law forbids its use.",
        "UUID or ULID assigned by the adopting Dimension, used only as a local surrogate and never presented externally as a civil identifier.",
        "A date, a name, a name plus date-of-birth combination, a biometric template or any other demographic attribute set is not an identifier and must never be used as a key."
      ],
      "timestamp_rule": "All recorded times use RFC 3339 with seconds and an explicit UTC offset or Z. Occurrence time, registration time and observation/ingestion time are stored as separate fields and never collapsed. Date-only civil facts such as date of birth remain dates with an explicit precision code rather than being padded to midnight timestamps.",
      "serial_naming_rule": "Serial artifacts are named <model-id>-<artifact-id>-<zero-padded-sequence>, with the sequence scoped to the issuing authority and the artifact class. Sequence numbers are monotonic and are never reused after a merge, split, correction or erasure; gaps are permitted and must not be closed.",
      "integrity_rule": "Every artifact carries a content digest, the issuing or authoring authority reference and, where it evidences identity, a signature or equivalent authenticity proof. Digests are recomputed on each patch and the prior digest is retained in the change log, so that any artifact can be shown to be the one that was disclosed at a given logged time."
    },
    "policies": [
      "Documents, credentials and identifiers evidence identity; they never constitute it. Revoking a document or identifier does not revoke or close the person.",
      "Registered-identity data is owned by the registrar of record and personal-sphere data is owned by the person. No component may reclassify data between the two without a recorded decision.",
      "Disclosure defaults to the minimum attribute set or a derived predicate; releasing anything beyond the approved minimum requires a recorded justification.",
      "Special-category data is excluded from every default projection and requires an explicit additional lawful condition per disclosure.",
      "No conformance to an external standard may be claimed without retrievable evidence; every external link is a mapping until conformance is evidenced.",
      "Historical assertions are retained for audit even when superseded; erasure is a governed exception evaluated against retention obligations, never a default operation.",
      "Full legal capacity is the default and may be displaced only by an evidenced, scoped and reviewable act; representation arrangements must record the person's own will and preferences.",
      "Split stewardship: the civil registrar or identification authority owns registered identity, documents and civil status; the natural person owns personal-sphere data and consent over it.",
      "ISO/IEC 24760 alignment is vocabulary-only; non-human principals cannot be stored as Person.",
      "GDPR data minimisation, purpose limitation, accuracy, storage limitation and integrity apply to processing of person data, with the public-interest archiving exception for permanent civil registers.",
      "Identity verification and PID presentation use selective disclosure or confirmation-only answers.",
      "No silent overwrite of legal name, civil marker or civil status by self-declared attributes.",
      "Special-category data, including biometrics used to uniquely identify a person, require an Article 9 condition in addition to an Article 6 basis.",
      "Household, filiation and organisational roles must be referenced, not duplicated.",
      "Time values use RFC 3339 with seconds and an explicit offset or Z; incomplete civil dates use GenericDate precision."
    ],
    "crud": {
      "read": [
        "Every read declares a purpose bound to a lawful basis and returns the narrowest projection satisfying it; unspecified-purpose reads are denied.",
        "Reads of registered-identity, evidence or special-category findings are logged with requester, role, purpose, attribute set and an RFC 3339 timestamp.",
        "The person may read every record and every access-log entry concerning them, including refusals and their grounds.",
        "Bulk or statistical reads are served only as aggregated or de-identified extracts, never as per-person projections."
      ],
      "create": [
        "Creating the person anchor requires either a civil registration act reference or a recorded exception route with a named authorising role and reason.",
        "Creating an identifier assignment requires scheme, version, issuing authority, validity period, reuse policy and correlatability class.",
        "Creating an evidence record requires issuer, validity window, asserted attribute set, holder binding method and a status resolution pointer.",
        "Creating any assertion records occurrence, registration and ingestion times separately at creation."
      ],
      "update": [
