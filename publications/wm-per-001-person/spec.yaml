        "description": "Lawful basis and consent, subject-right execution, minimal disclosure, retention, erasure and disclosure audit over person data.",
        "rationale": "Person data is personal data by definition; UN legislative guidance requires confidentiality and access control over civil-registration records, and EU law defines subject rights, special categories and storage limitation. Governance is therefore inseparable from the model, not an optional overlay.",
