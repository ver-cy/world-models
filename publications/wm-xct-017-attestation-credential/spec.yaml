  "model": {
    "registry_id": "vr.wm-xct-017",
    "model_id": "WM-XCT-017",
    "name": "Attestation / Credential",
    "entry_kind": "aggregate",
    "purpose": "Represent issuer-asserted claims with durable identity, evidence, validity, status, securing and purpose-bound presentation while remaining independent of storage and interface format.",
    "scope_statement": "Owns credential class and issued-instance identity, claim and schema references, issuer, subject and holder role bindings, issuance evidence, validity, status and lifecycle, secured representations, credential-specific verification evidence, presentations, disclosure manifests, interoperability mappings and governed retention. Party identity, issuer mandate, subject profile, source evidence, keys, permission-bearing grants, trust policy, authorization decisions and generic audit logs remain external.",
    "in_scope": [
      "Credential and attestation definitions, instance and representation identity, typed claims, schema, vocabulary, issuer authority reference, subject binding and issuance evidence",
      "Validity and terms, status method and freshness, suspension, revocation, expiry, renewal, correction, supersession, secured representations and verification results",
      "Presentation requests, disclosures, holder binding, privacy and correlation, format mappings, role views, access, retention, provenance and safe agent operations"
    ],
    "out_of_scope": [
      "Person, organization, issuer, subject, holder, verifier, mandate, source evidence, key, trust policy, permit grant, authorization decision or audit-log master lifecycle",
      "Implementing proof, signature, wallet, PKI path, status-list or presentation-protocol algorithms and storing private keys or undisclosed secrets",
      "Universal claim truth, issuer trust, identity proofing, authentication, authorization, eligibility, legal effect or certified cross-format equivalence"
    ],
    "boundary_notes": [
      {
        "neighbor": "Claim / Evidence",
        "distinction": "The credential owns the issuer's claim expression and references evidence; source observations and evidence artifacts keep their own identity and provenance.",
        "source_refs": [
          "SRC-001",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Identity / Key / Authentication",
        "distinction": "Issuer, subject, holder and verifier identities and public key references remain external; credential verification is not authentication by itself.",
        "source_refs": [
          "SRC-002",
          "SRC-004",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Permit / Authorization / Decision",
        "distinction": "A licence or permit credential may evidence an external grant, but its authenticity and status do not themselves make an authorization decision.",
        "source_refs": [
          "SRC-001",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Digital Signature / Proof",
        "distinction": "Generic proof artifacts and verification methods remain external or reusable mixins; this model binds them to credential claim, validity, status and presentation context.",
        "source_refs": [
          "SRC-002",
          "SRC-005",
          "SRC-007"
        ]
      },
      {
        "neighbor": "Presentation / Wallet / Audit Log",
        "distinction": "This model records credential-specific presentations and verification evidence, while wallet inventory and generic append-only audit execution remain external.",
        "source_refs": [
          "SRC-001",
          "SRC-008",
          "SRC-010"
        ]
      }
    ]
