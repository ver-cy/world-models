      "rationale": "Two axes must be separated. On the record plane, a frozen registry value such as standalone-mm classifies how the entry is stored and governed in the registry, not what the subject is; it is never a subject-model entry kind. The pack ships frozen_context as an empty object, so the registry value could not be re-read here and its cross-check is held. On the subject-model plane, the declared 'mixin' is not defensible against the provider's own evidence: the model mints and canonicalizes issued-instance identity (authoritative issuer plus credential identifier), owns an append-only lifecycle with activate/suspend/revoke/renew/correct/supersede events, defines disposition authority, legal hold, tombstones, an artifact identity priority ladder and seven steward roles. A mixin is a reusable trait attached to a host entity and owns no independent identity, retention authority or delete policy. 'aggregate' is preferred over 'entity' because credential class, typed claims, secured representations, proofs, status entries, presentations, disclosure manifests and receipts are non-independent parts governed under a single root, and the provider's own coverage claim already calls the subject 'an issued attestation and credential aggregate'. Status is reclassified rather than split, but presentation and disclosure ownership is recorded as the leading split candidate because a presentation binds a set of credentials from possibly several issuers and cannot canonicalize under one credential identifier."
    },
