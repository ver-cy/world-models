  "coverage": {
    "claim": "Base is Claude's 6-bundle / 14-layer / 26-finding structure for WM-ECO-004, plus two grok findings (SDR as unit and reserve asset, and retail/wholesale CBDC classes), giving 28 findings and 10 functions. It covers the monetary unit of account, the monetary instrument class, legal status and territorial validity, unit and series lifecycle, the monetary amount value object, and governance, alignment and assurance, for the sources actually consulted. E-money, MiCA, euro conversion arithmetic and legal-tender doctrine in the base are EU-derived and remain jurisdiction-scoped assertions. The FATF virtual-asset node and its admission function are deferred because they contradict the base classification of currency-referencing tokens; issuer-level stock and all holder positions remain outside this model. No claim of universal or exhaustive coverage of monetary law, token regimes, national cash-threshold schedules or banknote series catalogues is made.",
