            "findings": [
              {
                "id": "legal-tender-status",
                "name": "Legal tender status and its limits",
                "description": "Legal tender status is conferred by specific legal instruments and its effects are not defined uniformly. In the euro area, treaty provisions confer status on banknotes and a Council regulation on coins, while the concept itself is defined through recommendation and case law as mandatory acceptance at full face value with power to discharge. The same regulation caps obligatory acceptance at fifty coins in a single payment, proving that legal tender is quantitatively bounded. Status must therefore be asserted per jurisdiction, per instrument form, with its limits.",
                "source_refs": [
                  "SRC-014",
                  "SRC-020"
                ],
                "questions": [
                  {
                    "id": "legal-tender-assertion",
                    "text": "In which jurisdictions does this instrument hold legal tender status, and which legal instrument confers it?",
                    "kind": "authority",
                    "answer_data": [
                      "Jurisdiction reference",
                      "Conferring legal instrument citation",
                      "Instrument forms covered such as notes or coin"
                    ]
                  },
                  {
                    "id": "legal-tender-quantitative-limit",
                    "text": "What quantitative limits bound the obligation to accept, such as caps on coin counts or cash payment thresholds?",
                    "kind": "constraint",
                    "answer_data": [
                      "Limit type and numeric threshold",
                      "Legal source of the limit",
                      "Parties exempt from the limit"
                    ]
                  },
                  {
                    "id": "legal-tender-status-change",
                    "text": "When did the current legal tender status take effect, and what status preceded it?",
                    "kind": "temporal",
                    "answer_data": [
                      "Effective-from timestamp with offset",
                      "Prior status value",
                      "Legal act that changed it"
                    ]
                  },
                  {
                    "id": "non-tender-acceptance",
                    "text": "For instruments without legal tender status, what governs acceptance and how is that recorded distinctly from tender status?",
                    "kind": "definition",
                    "answer_data": [
