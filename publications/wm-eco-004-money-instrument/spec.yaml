  "model": {
    "registry_id": "vr.wm-eco-004",
    "model_id": "WM-ECO-004",
    "name": "Money / Instrument",
    "entry_kind": "entity",
    "purpose": "Define the monetary unit of account and the transferable monetary instrument that denominate, embody and store value, so that any agent can identify a unit or instrument, classify it, reason about its issuer, claim, legal status and lifecycle, and construct or validate a monetary amount without owning accounts, balances or payment execution.",
    "scope_statement": "WM-ECO-004 owns the referenced thing that money is: (a) the monetary unit of account and its code, denomination structure and lifecycle; (b) the monetary instrument class - the concrete form money takes (banknote, coin, deposit money, electronic money, central bank digital currency, e-money token) with its issuer, claim, backing, redeemability, transferability and settlement-asset character; and (c) the monetary amount value object with its precision, rounding and conversion rules. It does not own accounts, holdings, payment orders, settlement processing or credit claims: those are referenced from sibling models that point at this one. The model is storage- and interface-neutral; ISO 4217 lists, ISO 20022 payloads, DTI registry records, Git files, MCP tools and MongoDB documents are projections of these semantics, not the semantics.",
    "in_scope": [
      "Monetary unit of account: identity, alphabetic and numeric codes, official and local names, symbol and presentation, minor unit and subdivision structure",
      "Unit kind classification: national currency, supranational currency, fund code, precious-metal unit, special drawing right, special-purpose codes such as no-currency and testing codes, and digital token units",
      "Monetary instrument class: form taxonomy, fungibility, divisibility, negotiability, bearer versus registered form, ledger or medium dependency",
      "Issuer identity and issuance authority, the claim the instrument represents, its backing or reserve arrangement, and redemption rights including redemption at par",
      "Settlement-asset character: central bank money, commercial bank money or other settlement asset, and the instrument's capacity to discharge an obligation with finality",
      "Legal tender status, territorial and jurisdictional validity, issuer authorisation and supervisory status, and usage or holding restrictions attached to the unit or instrument",
      "Lifecycle and succession of units and instrument series: introduction, redenomination, currency substitution, withdrawal, demonetisation and exchange windows",
      "Monetary amount as a value object: amount plus unit reference, permitted scale, sign, rounding and conversion arithmetic, and the provenance and fitness for use of any rate applied",
      "Governance of the local record: authoritative source, amendment tracking, external code-scheme alignment, validation evidence, publication, retention and access"
    ],
    "out_of_scope": [
      "Financial accounts, wallets and their holders, scheme membership and account identifiers such as IBAN or BIC - owned by WM-ECO-015",
      "Balances, holdings, positions and as-of quantification of who holds how much - owned by WM-ECO-017",
      "Payment orders, initiation, clearing, settlement instruction processing, rails, operating calendars and payment lifecycle status - owned by WM-ECO-009",
      "Credit and debt claims, principal, interest and amortisation schedules; these reference monetary units but are separate instruments",
      "Non-monetary financial instruments such as equities, bonds and derivatives identified by ISIN, UPI or CFI",
      "Legal and natural person identity, organisational structure and beneficial ownership of issuers or holders",
      "Market microstructure, order books, tradable price discovery and time series of traded FX prices",
      "Monetary policy operations, money supply aggregates, macroeconomic statistics and national accounts compilation",
      "Anti-money-laundering screening logic, sanctions list maintenance and transaction monitoring rules"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ECO-009 Payment / Funds Transfer",
        "distinction": "WM-ECO-009 owns the transfer event, its parties, instruction, rail and settlement outcome. WM-ECO-004 owns only the unit or instrument that the transfer moves, plus the instrument's intrinsic settlement-asset character. PFMI Principle 8 finality is a property of the transfer arrangement; PFMI Principle 9 money settlement is a property of the settlement asset, so the asset-side attribute stays here and the process stays in WM-ECO-009.",
        "source_refs": [
          "SRC-004",
          "SRC-005"
        ]
      },
      {
        "neighbor": "WM-ECO-015 Financial Account",
        "distinction": "An account declares its denomination or the monetary instruments it may hold by referencing a WM-ECO-004 unit or instrument. Account identity, parties, scheme, status and access rules are never duplicated here. Account-number schemes are excluded even though they co-occur with currency in ISO 20022 payloads.",
        "source_refs": [
          "SRC-015"
        ]
      },
      {
        "neighbor": "WM-ECO-017 Financial Position / Balance",
        "distinction": "A position quantifies an amount of a referenced unit or instrument at a stated time. WM-ECO-004 supplies the unit reference and the amount value-object rules including scale and rounding; it never records who holds how much. The previous F2 'holding' object is retired from this model's scope.",
        "source_refs": [
          "SRC-015",
          "SRC-017"
        ]
      },
      {
        "neighbor": "Credit and debt claim model (legacy F8)",
        "distinction": "Deposit money is in scope here as an instrument form classified as a liability of a deposit-taking corporation, following the statistical classification of currency and deposits. Loans, bonds and other credit claims are out of scope even though they are denominated in a monetary unit and settled by payments in one.",
        "source_refs": [
          "SRC-017",
          "SRC-018"
        ]
      },
      {
        "neighbor": "Market price / FX market data model",
        "distinction": "WM-ECO-004 keeps only the definitional side of conversion: the ordered currency pair, the quotation convention, legally fixed conversion rates and the provenance of any referenced rate. Continuous market price discovery, tradable quotes and rate time series belong to a market-data sibling; the ECB reference rates are explicitly not intended for transaction purposes, which shows the two concerns must not be merged.",
        "source_refs": [
          "SRC-010",
          "SRC-013"
        ]
      },
      {
        "neighbor": "Organization / legal entity model",
        "distinction": "Issuers, maintenance agencies and registration authorities are referenced by governed entity identifier such as an LEI. Their corporate identity, hierarchy and relationship data stay in the organization model; only the issuance role and its authorisation evidence are asserted here.",
        "source_refs": [
          "SRC-006"
        ]
      },
      {
        "neighbor": "Jurisdiction / place model",
        "distinction": "Territorial validity, legal tender scope and monetary sovereignty are expressed as references to jurisdiction entities. The definition, geometry and political status of those jurisdictions are not modelled here, which matters because a unit can be lawful money in jurisdictions that did not issue it.",
        "source_refs": [
          "SRC-014",
          "SRC-020"
        ]
      },
      {
        "neighbor": "Securities and non-monetary instrument model",
        "distinction": "ISO 4217 also carries fund codes and precious-metal codes that are not currencies, and DTI covers tokens that are securities rather than money. WM-ECO-004 includes such codes only as unit-of-account references and marks them as non-monetary; the instruments they identify belong elsewhere.",
        "source_refs": [
          "SRC-003",
          "SRC-008"
        ]
      }
    ]
  },
