        "rationale": "Amendment 180 moving Bulgaria from BGN to EUR, the withdrawal of the EUR 500 note from issuance, and the maintenance of a separate historic code list all demonstrate that units and instrument series have distinct, dated lifecycles whose transitions must be modelled explicitly rather than inferred from a current-state snapshot.",
