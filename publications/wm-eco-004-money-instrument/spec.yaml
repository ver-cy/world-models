                "id": "cbdc-classes",
                "name": "Retail and wholesale CBDC classes",
                "description": "BIS FSI defines CBDCs as a direct liability of the central bank. Retail CBDC is intended for the general public; wholesale CBDC is for financial intermediaries and is like reserves with tokenisation features. Tokenisation is digital representation of a claim on a programmable platform. Architectures include one-tier, pure two-tier/intermediated and hybrid models. BIS legal analysis warns that rCBDC is not a perfect replica of cash because it is intangible, needs a technical system, and may have holding limits, programmability, interest or a contractual user relationship, so classifying it as cash, deposit or e-money imports the wrong legal regime unless lawmakers choose that result. Designation as currency and legal tender may strengthen its monetary-anchor function but is a legal choice. Payment execution on a CBDC platform remains WM-ECO-009; wallets remain WM-ECO-015.",
