            "findings": [
              {
                "id": "code-scheme-alignment",
                "name": "Code-scheme alignment and recorded conflicts",
                "description": "The same economic thing can be identified in several schemes at once - a token pegged to an official currency may carry a digital token identifier while also referencing an ISO 4217 code, and national schemes may use codes that clash with the international list. Alignment is a mapping with a stated equivalence strength, not a claim of conformance. Where schemes disagree - for example on whether a unit is money at all, or on effective dates for a substitution - the conflict is recorded and neither side is silently preferred.",
                "source_refs": [
                  "SRC-003",
                  "SRC-008",
                  "SRC-012"
                ],
                "questions": [
                  {
