        "id": "governance-and-interoperability",
        "name": "Governance, Alignment and Assurance",
        "description": "How the local record stays faithful to its authoritative sources, how it maps to external schemes without over-claiming conformance, and how it is validated, published, retained and accessed.",
        "rationale": "Every substantive fact in this model is sourced from an externally governed registry, legal instrument or standard that versions independently. The model must therefore carry explicit provenance, alignment-not-conformance semantics, validation evidence and retention rules, or agents will silently consume stale or mis-mapped monetary reference data.",
