        "description": "Where and on what terms the unit or instrument is lawful money, who is authorised to issue it, and what restrictions bound its holding and use.",
        "rationale": "Legal tender is conferred by specific legal instruments and is bounded rather than absolute; issuance is subject to authorisation regimes that can be granted, varied and withdrawn; and holding or usage limits are real constraints that change how an agent may reason about the instrument. None of this is derivable from the code list alone.",
        "source_refs": [
          "SRC-011",
          "SRC-012",
          "SRC-014",
          "SRC-020",
          "SRC-021"
