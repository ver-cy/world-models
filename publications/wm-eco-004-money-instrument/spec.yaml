  "functions": [
    {
      "id": "resolve-monetary-unit",
      "name": "Resolve monetary unit reference",
      "description": "Resolve a code, identifier or scheme-qualified string to the governed monetary unit record valid at a stated instant, returning kind, minor unit, lifecycle state and successor where the unit is retired.",
      "inputs": [
        "Code or identifier value",
        "Code scheme reference",
        "As-of instant as an RFC 3339 timestamp with offset"
      ],
      "outputs": [
        "Resolved unit record with scheme identifiers",
        "Lifecycle state and validity interval",
        "Successor unit reference where the unit is retired",
        "Resolution confidence and source version used"
      ],
      "preconditions": [
        "A code scheme reference is supplied or unambiguously inferable",
        "The local copy of the scheme is within its maximum staleness threshold"
      ],
      "effects": [
        "Emits a resolution event carrying the source version and observation instant",
        "Records a miss when no unit matches, without inventing a placeholder"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-007"
      ]
    },
    {
      "id": "validate-unit-identifier",
      "name": "Validate unit identifier and code consistency",
      "description": "Apply format, check-character and cross-field validation to a unit identifier, including consistency between alphabetic and numeric codes and between the declared minor unit and the authoritative list.",
      "inputs": [
        "Candidate identifier and scheme reference",
        "Declared numeric code and minor unit where present",
        "Authoritative list version"
      ],
      "outputs": [
        "Validation outcome per rule with severity",
        "Discrepancy detail where a cross-check fails",
        "Observation timestamp of the validation run"
      ],
      "preconditions": [
        "The authoritative list version is retrievable and its retrieval instant is recorded"
      ],
      "effects": [
        "Appends outcomes to the validation report",
        "Sets a blocking disposition when a mandatory rule fails"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-003",
        "SRC-007"
      ]
    },
    {
      "id": "classify-instrument",
      "name": "Classify monetary instrument form and settlement-asset class",
      "description": "Assign the instrument form, transfer mode, claim structure and settlement-asset class from documented issuer, backing and legal evidence, recording the criteria satisfied and those not evidenced.",
      "inputs": [
        "Instrument class specification draft",
        "Issuer authority dossier",
        "Backing and redemption evidence"
      ],
      "outputs": [
        "Instrument form code with satisfied criteria",
        "Settlement-asset class with risk characterisation",
        "List of unevidenced criteria flagged as gaps"
      ],
      "preconditions": [
        "Issuer identity is resolved or explicitly asserted absent",
        "At least one primary legal or supervisory source is cited"
      ],
      "effects": [
        "Updates the instrument class specification",
        "Opens a gap item for each unevidenced criterion rather than defaulting"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-005",
        "SRC-011",
        "SRC-017"
      ]
    },
    {
      "id": "assert-legal-status",
      "name": "Assert legal tender and discharge status for a jurisdiction",
      "description": "Produce a jurisdiction-scoped, time-bounded assertion of legal tender status, discharge effect, acceptance limits and lawful refusal grounds, citing the legal instrument relied on.",
      "inputs": [
        "Unit or instrument reference",
        "Jurisdiction reference",
        "As-of instant"
      ],
      "outputs": [
        "Discharge status assertion with legal citations",
        "Quantitative acceptance limits",
        "Enumerated refusal grounds",
        "Effective and observation timestamps"
      ],
      "preconditions": [
        "A primary legal instrument is identified for the jurisdiction",
        "Territorial validity has been established for the unit"
      ],
      "effects": [
        "Appends a new assertion; prior assertions are never edited in place",
        "Flags jurisdictions where no primary source could be found as gaps"
      ],
      "source_refs": [
        "SRC-014",
        "SRC-020"
      ]
    },
    {
      "id": "derive-amount-scale",
      "name": "Derive and enforce permitted amount scale",
      "description": "Compute the effective permitted scale for an amount from the unit's minor unit and the narrower constraints of the target projection, and reject or flag amounts that violate it.",
      "inputs": [
        "Unit reference",
        "Target projection identifier",
        "Candidate amount value"
      ],
      "outputs": [
        "Effective permitted scale",
        "Conformance result for the candidate amount",
        "Divergence record where unit and projection constraints differ"
      ],
      "preconditions": [
        "Denomination profile for the unit is resolved",
        "A projection binding profile exists for the target"
      ],
      "effects": [
        "Blocks serialisation of a non-conforming amount",
        "Records the divergence for governance review"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-003",
        "SRC-015"
      ]
    },
    {
      "id": "convert-monetary-amount",
      "name": "Convert a monetary amount between units",
      "description": "Convert an amount using a referenced rate under the governing arithmetic rule profile, preserving full rate precision, refusing derived inverse rates and applying the prescribed rounding only to the final result.",
      "inputs": [
        "Source amount with unit reference",
        "Target unit reference",
        "Rate reference including type and determination instant",
        "Arithmetic rule profile reference"
      ],
      "outputs": [
        "Converted amount at the permitted scale",
        "Full computation trace including unrounded intermediate value",
        "Rate provenance and any publisher usage caveat"
      ],
      "preconditions": [
        "The rate is directionally applicable and not derived by inversion",
        "The rate's fitness for the intended use is not excluded by its publisher",
        "Both units are resolvable at the stated as-of instant"
      ],
      "effects": [
        "Emits a conversion record retaining inputs, rate and rounding decision",
        "Refuses conversion and raises an exception when only an excluded or unavailable rate exists"
      ],
      "source_refs": [
        "SRC-010",
        "SRC-013"
      ]
    },
    {
      "id": "apply-unit-succession",
      "name": "Apply unit succession to historical amounts",
      "description": "Map amounts expressed in a retired unit into its successor using the fixed conversion factor and continuity rules, preserving the original-unit value alongside the restated value.",
      "inputs": [
        "Historical amount with retired unit reference",
        "Succession mapping table version",
        "Restatement policy"
      ],
      "outputs": [
        "Restated amount in the successor unit",
        "Preserved original amount and unit",
        "Applied factor, legal act citation and restatement audit entry"
      ],
      "preconditions": [
        "A succession mapping exists with a legally established factor",
        "The as-of instant of the amount falls before the changeover end"
      ],
      "effects": [
        "Writes an audit entry linking original and restated values",
        "Leaves the original value immutable"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-013",
        "SRC-014"
      ]
    },
    {
      "id": "verify-issuer-authorisation",
      "name": "Verify issuer identity and authorisation",
      "description": "Resolve the issuer's governed entity identifier against its register and check the authorisation state for the instrument, recording the observation instant and the status effective date separately.",
      "inputs": [
        "Issuer entity identifier",
        "Authorisation regime reference",
        "Register locator"
      ],
      "outputs": [
        "Entity resolution result with registration status",
        "Authorisation state with effective and observation timestamps",
        "Passporting scope where applicable"
      ],
      "preconditions": [
        "The register is reachable and its response is attributable to a named authority"
      ],
      "effects": [
        "Appends an authorisation verification record",
        "Downgrades record confidence when verification fails or cannot be completed"
      ],
      "source_refs": [
        "SRC-006",
        "SRC-011",
        "SRC-012"
      ]
    },
    {
      "id": "reconcile-with-master-registry",
      "name": "Reconcile local record against master registries",
      "description": "Compare the local reference set against each master registry's current publication and amendment stream, producing a differential and opening discrepancy items rather than auto-overwriting local assertions.",
      "inputs": [
        "Local reference set version",
        "Master registry publication and amendment stream",
        "Reconciliation policy"
      ],
      "outputs": [
        "Differential of added, changed and retired entries",
        "Discrepancy items with proposed dispositions",
        "Staleness measure per master"
      ],
      "preconditions": [
        "Each master's source locator and version are recorded",
        "Field-level derivation flags distinguish copied from locally asserted values"
      ],
      "effects": [
        "Updates the provenance ledger with source version and ingestion instant",
        "Never overwrites a locally asserted field without steward approval"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-015"
      ]
    },
    {
      "id": "publish-reference-snapshot",
      "name": "Publish an immutable reference snapshot",
      "description": "Emit a versioned, immutable snapshot of the publishable reference set for a projection target, applying publication classification, licence attribution and lossiness disclosure.",
      "inputs": [
        "Reference set version",
        "Projection binding profile",
        "Publication and retention policy"
      ],
      "outputs": [
        "Immutable snapshot with content digest",
        "Attribution and licence notice",
        "Lossiness disclosure and code-set version pins"
      ],
      "preconditions": [
        "All blocking validation rules pass or exceptions are approved",
        "Upstream licence terms permit the intended redistribution"
      ],
      "effects": [
        "Registers the snapshot with an integrity digest",
        "Retains superseded snapshots per the retention rule"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-007",
        "SRC-015"
      ]
    }
  ],
  "composition": [
    {
      "target": "WM-ECO-009 Payment / Funds Transfer",
      "relation": "REFERENCE",
      "purpose": "WM-ECO-009 references a unit or instrument to state what is being transferred; WM-ECO-004 supplies the settlement-asset class and discharge properties but never the instruction, rail, parties or settlement status.",
      "required": false,
      "source_refs": [
        "SRC-004",
        "SRC-005"
      ]
    },
    {
      "target": "WM-ECO-015 Financial Account",
      "relation": "REFERENCE",
      "purpose": "An account declares its denomination and the instruments it may hold by referencing this model; account identity, scheme, status and holder relationships remain entirely in WM-ECO-015.",
      "required": false,
      "source_refs": [
        "SRC-015",
        "SRC-017"
      ]
    },
    {
      "target": "WM-ECO-017 Financial Position / Balance",
      "relation": "REFERENCE",
      "purpose": "A position quantifies an amount of a referenced unit or instrument as of a stated time; this model supplies the unit reference, scale and rounding contract, not the quantity or its owner.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-017"
      ]
    },
    {
      "target": "Organization / legal entity model (issuer, maintenance agency, competent authority)",
      "relation": "REFERENCE",
      "purpose": "Issuers, registration authorities and supervisors are referenced by governed entity identifier so that corporate identity and hierarchy are maintained once, in the organization model.",
      "required": true,
      "source_refs": [
        "SRC-006"
      ]
    },
    {
      "target": "Jurisdiction / place model",
      "relation": "REFERENCE",
      "purpose": "Legal tender assertions, territorial validity and restriction scopes reference jurisdiction entities rather than embedding place definitions, because a unit can be lawful money outside its issuing jurisdiction.",
      "required": true,
      "source_refs": [
        "SRC-014",
        "SRC-020"
      ]
    },
    {
      "target": "Credit and debt claim model (legacy F8 successor)",
      "relation": "REFERENCE",
      "purpose": "Credit claims are denominated in units defined here and discharged by instruments defined here; the claim, principal and interest structure stays outside this model to keep the money-versus-claim boundary intact.",
      "required": false,
      "source_refs": [
        "SRC-017",
        "SRC-018"
      ]
    },
    {
      "target": "Sibling models that carry monetary amounts (charges, fares, valuations, cash flows)",
      "relation": "COMPOSE",
      "purpose": "The monetary amount value object with its unit binding, scale and arithmetic rule profile is defined once here and composed into any model that needs to express a sum of money.",
      "required": false,
      "source_refs": [
        "SRC-013",
        "SRC-015"
      ]
    },
    {
      "target": "Market price and reference-data time-series model",
      "relation": "REFERENCE",
      "purpose": "Continuous price discovery and tradable quote history are referenced, not owned; this model keeps only the pair definition, rate type and the provenance and fitness-for-use of a rate actually relied upon.",
      "required": false,
