    "known_omissions": [
      "Non-decimal and historical subdivision structures are acknowledged as a question but not modelled with a general algebra; only the decimal minor unit exponent is structurally supported, which is a real limitation for pre-decimalisation and some traditional units.",
      "Commodity money, barter units, mutual credit systems and local exchange units are not covered; the sources relied on address currencies, deposits, electronic money, CBDC and tokens, and extending to informal units without primary support would be unfounded.",
      "Negative interest, demurrage and other unit-level value-decay mechanisms are not modelled; they were judged to sit on positions and accounts rather than on the unit or instrument definition, but this boundary is unverified against a primary source.",
      "Islamic finance and other faith-based constraints on monetary instruments are not represented; no primary standards source was consulted and asserting structure would be speculative.",
      "Cross-border correspondent arrangements, nostro and vostro relationships and liquidity bridging are excluded as payment and account concerns, so a consumer needing to reason about the reachability of an instrument must combine this model with WM-ECO-009 and WM-ECO-015.",
      "Detailed reserve-asset quality criteria and stress thresholds for stablecoin arrangements are referenced at the level of principle only; supervisory technical standards implementing them were not consulted in full.",
      "National cash-payment ceilings, coin legal-tender limits and AML cash-reporting thresholds are jurisdictional schedules not reproduced here.",
      "Complete banknote and coin series catalogues of every issuing authority are not included; only the series-lifecycle pattern is.",
      "ISO/CD 24982 Digital currencies — Vocabulary is under development in ISO/TC 68 and is not yet a stable primary vocabulary.",
      "SNA 2025 updates to financial-instrument classes were not independently verified in this pass.",
      "Complementary, community and local currencies without ISO 4217 codes are representable as unlisted units but lack a global registry.",
      "Tokenised deposits, wholesale settlement tokens and multi-CBDC arrangements have design literature but few binding statutes.",
      "Islamic/near-money instruments and some mobile-money national laws are not exhaustively surveyed.",
      "Physical cash logistics, vault operations and note fitness sorting are operational and out of scope.",
      "Market FX, PPP and real-effective-rate statistics are omitted by design."
    ],
    "conflicts": [
      "ISO 4217 carries fund codes and precious-metal codes in the same scheme as currencies while statistical classification places monetary gold and special drawing rights in a category separate from currency and deposits. This model resolves the tension by keeping a single identifier scheme reference but a separate monetary-character flag, and records that the two frameworks disagree about what belongs together.",
      "Legal tender is described as entailing mandatory acceptance at full face value with power to discharge, yet the same body of law caps obligatory acceptance of coins in a single payment and permits refusal in good faith or by contract. The model therefore treats legal tender as a bounded, conditional status rather than an absolute one, and records the limits alongside the status.",
      "Published reference rates carry an explicit caveat discouraging their use for transaction purposes, while many systems in practice use exactly those rates to convert transactional amounts. The model records the publisher's caveat verbatim as a fitness-for-use attribute and does not endorse the common practice.",
      "A token pegged to an official currency may be identified simultaneously by a digital token identifier and by reference to an ISO 4217 code, and different jurisdictions may classify the same token as electronic money, an asset-referenced instrument or an unregulated crypto-asset. Both classifications are retained with their authorities and no silent precedence is applied.",
      "Whether the instrument-side property of discharging an obligation and the arrangement-side property of settlement finality should be separated is a modelling judgement drawn from reading PFMI Principles 8 and 9 together with legal tender doctrine; a reader could reasonably place both entirely in the payment model, and this boundary is flagged for migration review.",
      "ISO 4217 defines currency as a medium of exchange identified by the location of the monetary authority (a coded unit). IMF/SNA define currency as notes and coins (an instrument form). Records must name which sense is used.",
      "FATF excludes digital fiat from virtual assets, while some jurisdictions have granted legal-tender status to Bitcoin or similar assets that fail IMF currency tests and are absent from ISO 4217. That is legal tender without catalogue membership.",
      "BIS notes that legal-tender acceptance is mandatory in some jurisdictions and merely a default discharge in others; no global default should be inferred.",
      "IMF classifies electronic money as deposits, not currency; some legal CBDC debates analogise rCBDC to cash. Classification as cash, deposit or a new class changes the imported legal regime.",
      "Previous F2 bundled payments, accounts, balances and exchange-rate quotes into this model; those now conflict with WM-ECO-009, WM-ECO-015, WM-ECO-017 and a price/quote sibling and must not be re-imported."
    ],
    "regional_assumptions": [
      "Electronic money definition, issuance-at-par and redeemability obligations, and the electronic money token versus asset-referenced token split are drawn from European Union instruments and are region-specific. Other jurisdictions define stored-value and token instruments differently, and the model marks these as jurisdiction-scoped assertions rather than universal definitions.",
      "The conversion arithmetic rules relied upon - six significant figures, no rounding of the rate, no derived inverse rates and round-half-up on the result - come from the euro introduction framework. They are treated here as an exemplary, well-evidenced profile rather than as globally binding; other jurisdictions and schemes may mandate different rounding.",
      "Legal tender examples, the coin acceptance cap and the notion that legal tender is defined through recommendation and case law rather than statute are euro-area specific and must not be generalised.",
      "The reference-rate provenance pattern, including a daily concertation procedure, a stated publication hour in a European time zone and suspension of a pair, reflects one central bank's practice; other publishers use different determination times, conventions and availability rules.",
      "The identification of a maintenance agency secretariat and a registration authority as single authoritative points assumes continuity of the current custodianship arrangements for ISO 4217 and ISO 24165; a change of custodian would require re-pinning the master sources.",
      "EU e-money definition and par-redemption rules are primary for EEA electronic money and are an alignment, not a global statute.",
      "Euro changeover mechanics (fixed conversion rate, dual circulation, dual price display) are illustrated by the 2026 Bulgaria ISO 4217 amendment and do not automatically apply to other unions.",
      "SDR holder eligibility is limited to IMF members, the IMF and prescribed official holders; private SDR denomination in contracts does not create private SDR money.",
      "Dollarized and currency-board economies may use a foreign ISO unit as the domestic medium of exchange without issuing that unit.",
      "Common-law nemo dat exceptions for currency are described by BIS as typical, not universal."
