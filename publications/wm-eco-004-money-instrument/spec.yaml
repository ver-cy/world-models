              {
                "id": "payload-interoperability",
                "name": "Payload and projection interoperability",
                "description": "Messaging standards bind amount and currency together in dedicated data types and externalise volatile code sets that are republished on their own cadence. Projecting this model into a payload therefore constrains scale, code-set membership and the permitted set of codes, and a projection that silently truncates or substitutes is a defect. Storage and interface choices - documents, message schemas, tool interfaces or database collections - are projections that must round-trip the semantics defined here.",
                "source_refs": [
                  "SRC-015",
                  "SRC-001"
                ],
                "questions": [
                  {
                    "id": "projection-binding-rules",
                    "text": "For each target projection, what binding rules govern how a unit reference and an amount are rendered and parsed?",
                    "kind": "interoperability",
                    "answer_data": [
                      "Projection identifier",
                      "Field bindings for value, unit and scale",
                      "Round-trip test reference"
                    ]
                  },
                  {
                    "id": "external-code-set-dependency",
                    "text": "Which externalised code sets does a projection depend on, and how is their republication cadence tracked?",
                    "kind": "composition",
                    "answer_data": [
                      "Code set names and locators",
                      "Published version and effective instant",
                      "Update cadence and tracking mechanism"
                    ]
                  },
                  {
                    "id": "projection-lossiness",
                    "text": "What information defined in this model cannot be carried by a given projection, and how is that loss disclosed?",
                    "kind": "constraint",
                    "answer_data": [
                      "Unrepresentable elements per projection",
                      "Disclosure mechanism to consumers",
                      "Compensating out-of-band carriage where used"
                    ]
                  },
                  {
                    "id": "unsupported-code-handling",
                    "text": "How does a projection behave when it encounters a unit code that its bound code set does not contain?",
                    "kind": "exception",
