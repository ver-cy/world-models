            "findings": [
              {
                "id": "validation-and-evidence",
                "name": "Validation rules and supporting evidence",
                "description": "Monetary reference data admits strong mechanical checks: code format and check-character validation for identifiers that define one, cross-checking alphabetic against numeric codes, verifying minor unit against the authoritative list, confirming that an amount's scale satisfies both unit and payload constraints, and confirming that an entity identifier resolves in its register with an active status. Each check produces evidence with its own observation timestamp, distinct from the effective time of the fact checked.",
                "source_refs": [
                  "SRC-001",
                  "SRC-006",
                  "SRC-007",
                  "SRC-019"
                ],
                "questions": [
                  {
                    "id": "validation-rule-set",
                    "text": "Which validation rules apply to this record, and which are blocking versus advisory?",
                    "kind": "validation",
                    "answer_data": [
                      "Rule identifiers and definitions",
                      "Severity classification",
                      "Rule version and its source"
                    ]
                  },
                  {
                    "id": "validation-evidence-record",
                    "text": "What evidence is retained for each validation run, and how are effective time and observation time recorded separately?",
                    "kind": "evidence",
                    "answer_data": [
                      "Rule outcome per record",
                      "Observation timestamp with offset",
                      "Effective timestamp of the fact validated",
                      "Validator identity and version"
                    ]
                  },
                  {
                    "id": "validation-failure-disposition",
                    "text": "What happens to a record that fails a blocking rule - is it quarantined, superseded, or published with a defect marker?",
                    "kind": "process",
                    "answer_data": [
                      "Disposition state",
                      "Responsible role",
                      "Remediation deadline and escalation"
                    ]
                  },
                  {
                    "id": "stale-record-detection",
                    "text": "How is a record detected as stale relative to its master, and what confidence signal is exposed to consumers?",
                    "kind": "quality",
                    "answer_data": [
                      "Staleness measure and threshold",
                      "Last successful reconciliation instant",
                      "Consumer-facing confidence indicator"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "validation-outcome",
                    "name": "validationOutcome",
                    "description": "Result of applying a validation rule to a record, with severity and validator identity.",
                    "value_kind": "collection",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-001",
                      "SRC-006"
                    ]
                  },
                  {
                    "id": "validation-observed-time",
                    "name": "validationObservedTime",
                    "description": "Instant at which a validation was performed, recorded separately from the effective time of the validated fact.",
                    "value_kind": "timestamp",
