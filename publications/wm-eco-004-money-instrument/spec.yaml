                "artifacts": [
                  {
                    "id": "validation-report",
                    "name": "Validation report",
                    "description": "A per-run report of rule outcomes across the reference set, with validator version, observation instant, failure dispositions and staleness measures per master source.",
                    "media_or_form": [
                      "report",
                      "structured dataset"
                    ],
                    "serial": true,
                    "identity_strategy": "Keyed by validation profile identifier plus run ordinal; the run ordinal is the serial sequence and the observation instant is an attribute, not the key.",
                    "source_refs": [
                      "SRC-001",
                      "SRC-019"
                    ]
                  }
                ],
                "inline_only_rationale": null
              },
              {
                "id": "access-retention-publication",
                "name": "Access, retention and publication of monetary reference data",
                "description": "Most of this model is public reference data that authoritative bodies publish free of charge and permit free reuse, which argues for open read access. But not all of it is: authorisation checks, restrictive-measure linkages, reserve attestations and supplier-licensed rate feeds carry licence, confidentiality or redistribution constraints. Retention is asymmetric to deletion: superseded unit states and succession mappings must be kept indefinitely to keep historical amounts interpretable, while cached third-party feeds may be subject to contractual deletion.",
                "source_refs": [
                  "SRC-001",
                  "SRC-007",
                  "SRC-010",
                  "SRC-016"
                ],
                "questions": [
