                "description": "A monetary unit is identified by the authoritative registry identifier of its governing scheme before any locally assigned surrogate. For currencies, funds and precious metals this is the ISO 4217 alphabetic code with its numeric code, published by the Maintenance Agency Secretariat; for digital token units it is the nine-character Digital Token Identifier assigned by the DTI Foundation. Alphabetic codes are reused across time after a unit is withdrawn, so a code alone is not a durable key without a scheme and validity interval.",
