              {
                "id": "retention-tombstoning-and-erasure",
                "name": "Retention, tombstoning and lawful erasure",
                "description": "Gazetteer identifiers are cited by external systems, so removal is normally deprecation with a tombstone plus a superseded-by pointer, not deletion; Getty TGN treats deletion as a governed editorial action with retained history, GNIS retains historical features, and persistent-URI practice forbids identifier reuse. Genuine erasure obligations (for example personal data embedded in a note) must be satisfied without destroying the identifier or the succession chain.",
