    "name": "Gazetteer Place",
    "entry_kind": "entity",
    "purpose": "Provide the format-neutral context an AI agent needs to understand, create, inspect and operate a governed gazetteer place record: a named real-world location identified by a geographic identifier, with temporally scoped toponyms, classification, position, authority, provenance, relationships and access controls.",
    "scope_statement": "The model covers one place as recorded in a gazetteer, i.e. an ISO 19112 location instance identified by a geographic identifier within a declared location type and gazetteer register. It covers naming (multilingual, multi-script, temporally scoped), place-type classification, representative position and geometry with declared CRS and accuracy, existence and record lifecycle, naming authority and decisions, provenance and attestation, hierarchy and topology, cross-gazetteer concordance, sensitivity and access control, validation and retention. It excludes address semantics, coordinate reference system definition, boundary determination, cartographic rendering and any observation that merely cites a place.",
    "in_scope": [
      "Place record identity, identifier minting, persistence and resolution",
      "Toponyms with language, script, transliteration, pronunciation, nativeness, status and temporal validity",
      "Place type / feature type classification including local types and type change over time",
      "Representative position, geometry set, extent, CRS declaration and coordinate encoding constraints",
      "Positional accuracy, resolution, viewing-scale bounds and fitness-for-use statements",
      "Real-world existence period and record version lifespan, including uncertain and open-ended dates",
      "Supersession, merge, split, deprecation and tombstoning of place records",
      "Naming authority scope, official status, decision process and effective dates",
      "Contested, disputed and competing names or claims and their audience-scoped presentation",
      "Custodian, administrator, contributor, licence and editorial lineage",
      "Partitive/administrative hierarchy and topological or associative relations to other places",
      "Concordance to external gazetteers with match type and confidence",
      "Sensitivity classification, locality generalization and access rules",
      "Validation, conformance testing and quality measurement",
      "Exchange encodings and query-service projections as non-semantic renderings"
    ],
    "out_of_scope": [
      "Address and addressable-object semantics (ISO 19160-1 address model, address components, postal templates)",
      "Definition of coordinate reference systems, datums and transformations (ISO 19111 / EPSG registry content)",
      "Legal determination or delimitation of administrative and international boundaries",
      "Cadastral parcels, property rights and land tenure",
      "Building, facility and asset management records",
      "Commercial point-of-interest operations such as opening hours, capacity, booking and pricing",
      "Transport network topology, route segments and navigation instructions",
      "Cartographic styling, symbolisation and map production",
      "Observation, occurrence, event or transaction records that merely reference a place",
      "Language, script, country and currency code registries themselves"
    ],
    "boundary_notes": [
      {
        "neighbor": "Address / addressable object model (ISO 19160-1)",
        "distinction": "A gazetteer place is a named real-world feature referenced indirectly by a geographic identifier; an address is a structured, human-oriented designation of an addressable object. ISO/TC 211 concluded that addressing requirements are sufficiently different from the scope of ISO 19112, so address components must be referenced, not absorbed.",
        "source_refs": [
          "SRC-001",
          "SRC-017"
        ]
      },
      {
        "neighbor": "Administrative unit and statistical geography registers (UN M49, ISO 3166, INSPIRE AU)",
        "distinction": "This model records that a place sits in, or is coded to, an administrative or statistical area and carries country codes; it does not define the area hierarchy, its legal basis or its boundary geometry, which remain owned by the register. UN M49 explicitly disclaims political interpretation of its groupings.",
        "source_refs": [
          "SRC-002",
          "SRC-010",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Coordinate reference system model (ISO 19111 / EPSG)",
        "distinction": "The place record declares which CRS its coordinates are expressed in and how they are encoded; the definition of the CRS, its datum and its transformations is external. GeoSPARQL 1.1 treats spatial reference system as a broader category than CRS and relies on external CRS identity in geometry literals.",
        "source_refs": [
          "SRC-003",
          "SRC-004",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Point-of-interest / local business model (schema.org Place and LocalBusiness)",
        "distinction": "schema.org Place mixes stable physical extension with operational commerce attributes such as opening hours, capacity and booking pages. Only the stable named-place core is in scope; operational and commercial attributes belong to a sibling POI/venue model.",
        "source_refs": [
          "SRC-016"
        ]
      },
      {
        "neighbor": "Place type / feature type vocabulary (GeoNames feature classes and codes, Getty AAT, INSPIRE NamedPlaceTypeValue)",
        "distinction": "The model requires a classification assertion with a resolvable vocabulary concept and optional source label, but the controlled vocabulary itself is a separate classifier model with its own versioning and deprecation rules.",
        "source_refs": [
          "SRC-002",
          "SRC-011",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Bibliographic source / citation model",
        "distinction": "Attestations, citations and name sources are first-class here as links plus temporal and confidence qualifiers, but the bibliographic description of the cited work (authors, edition, holdings) is delegated to a citation model.",
        "source_refs": [
          "SRC-011",
          "SRC-014"
        ]
      }
    ]
