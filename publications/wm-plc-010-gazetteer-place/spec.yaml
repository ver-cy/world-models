    {
      "target": "Gazetteer register and location type registry (ISO 19112 gazetteer / location type)",
      "relation": "REFERENCE",
      "purpose": "Every place record must declare the gazetteer that publishes it and the location type whose definition it satisfies; the register and type definitions are governed separately from individual instances.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-009"
      ]
    },
    {
      "target": "Address and addressable-object model (ISO 19160-1 conceptual model)",
      "relation": "REFERENCE",
      "purpose": "Link a place to addresses that designate it without importing address component or postal-template semantics, which ISO/TC 211 treats as a distinct scope from geographic identifiers.",
      "required": false,
      "source_refs": [
        "SRC-017",
        "SRC-001"
      ]
    },
    {
      "target": "Country and area code registry (ISO 3166-1 and UN M49)",
      "relation": "REFERENCE",
      "purpose": "Supply the country or area codes that contextualise the place; LPF makes country codes a required property and the register carries the disclaimer about legal status and frontiers.",
      "required": true,
      "source_refs": [
        "SRC-010",
        "SRC-011",
        "SRC-013"
      ]
    },
    {
      "target": "Administrative and statistical area model (INSPIRE Administrative Units, national admin hierarchies)",
      "relation": "REFERENCE",
      "purpose": "Provide the parent administrative and statistical units that a place belongs to, without duplicating their legal basis, boundary geometry or versioning.",
      "required": false,
      "source_refs": [
