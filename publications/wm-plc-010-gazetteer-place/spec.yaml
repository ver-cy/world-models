        "name": "Place Identity and Naming",
        "description": "What the place is, how it is identified persistently, and how it is named across languages, scripts, statuses and time.",
        "rationale": "ISO 19112 makes the geographic identifier the referencing mechanism, while INSPIRE, GeoNames, Getty TGN and LPF all separate the stable place object from a set of temporally and linguistically qualified name assertions. Conflating identity with a name string is the single most common failure in gazetteer data.",
