    "purpose": "Represent one governed security holding as an identity-bearing, source-qualified position that binds a holder capacity and a security to an account or register context and preserves balances, rights, restrictions and change lineage without becoming the instrument, account, transaction, corporate action or legal ownership determination.",
    "scope_statement": "Owns holding and version identity; authoritative source-position key or declared composite identity; direct, indirect, legal, registered, beneficial, nominee, custody, long and short capacity assertions; security, issuance, share class, listing, account, register, depository, custodian, subcustodian, account-servicer, holder, owner and manager bindings; quantity, unit, face value, percentage and fraction assertions; settled, available, blocked, pledged, lent, borrowed, pending and encumbered balance buckets; acquisition-source, lot, date, quantity, cost, currency, fee, tax and accounting references; legal-title, beneficial-interest, economic-interest, control, voting, dividend, distribution, conversion, subscription and participation-right assertions; lock-up, holding-period, transfer, sanction, freeze, lien, pledge, securities-lending, repo, collateral, short-sale, recall and return references; order, trade, allocation, netting, settlement, payment and ledger references; holding-owned acquisition, disposal, transfer, delivery, receipt, cancellation, reversal, observation, reconciliation, correction, split, merge, account-transfer and successor lineage; corporate-action event, announcement, record, ex, election and payment times; eligible and entitled quantities, rates, options, rounding and fractions; election, instruction, deadline, status, rejection, cancellation, cash or security movement, confirmation, reversal, tax and income outcome references; price, value, method, accrual, income, gain, loss and exposure projections; beneficial-ownership, percentage, voting-power, threshold, filing and disclosure references; provenance, event and knowledge clocks, quality, access, retention, audit and loss-aware projections. Instrument, issuance, party, account, register, custody, trade, settlement, payment, ledger, tax lot, valuation, corporate action, entitlement, instruction, tax, filing and records masters remain authoritative.",
    "in_scope": [
      "Holding identity, version, holder capacity, security, account or register context and source-qualified balance observations",
      "Lots, rights, restrictions, encumbrance references, position changes, reconciliation and corporate-action position views",
      "Valuation and reporting projections, provenance, access, retention, validation and interoperability"
    ],
    "out_of_scope": [
      "Owning Security Instrument, Issuance, Party, Account, Register, Custody, Order, Trade, Settlement, Payment, Ledger, Tax Lot, Valuation, Rating, Securities Lending, Repo, Collateral, Corporate Action, Entitlement, Instruction, Movement, Tax, Filing or Record masters",
      "Treating registered holder as beneficial owner, quantity as voting power or value, trade as settlement, settled as available, eligibility as accepted instruction, valuation as fact or filing as complete ownership truth",
      "Autonomous trading, transfer, settlement, voting, election, instruction, beneficial-ownership determination, tax, filing, protected disclosure or record destruction"
    ],
