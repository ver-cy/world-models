  "functions": [
    {
      "id": "ct-core-fn-establish-concept",
      "name": "Establish a concept identity",
      "description": "Create a new concept record with a persistent identifier and an initial delimitation, after confirming that no existing concept already covers the same intension.",
      "inputs": [
        "Essential and delimiting characteristics proposed for the concept",
        "Candidate designations with language tags",
        "Subject field reference",
        "Assigning master system or governed namespace"
      ],
      "outputs": [
        "Concept record carrying a primary identifier",
        "Optional governed IRI",
        "Recorded intension and extension boundedness"
      ],
      "preconditions": [
        "A duplicate test has been run against existing concepts sharing any candidate designation",
        "The authority controlling the identifier namespace is known and reachable",
        "At least one delimiting characteristic distinguishes the new concept from its nearest neighbour"
      ],
      "effects": [
        "A citable concept identifier exists and can be referenced by other models",
        "No scheme membership, editorial status or approval is asserted; those remain with the scheme and lifecycle areas",
        "The identity rule reference in force at creation is recorded for later split and merge decisions"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-003",
        "SRC-005"
      ]
    },
    {
      "id": "ct-core-fn-attach-designation",
      "name": "Attach a designation to a concept",
      "description": "Attach a term, appellation, proper name or symbol to an existing concept with its language tag, designation type and acceptability rating, reifying the designation where the active profile requires designation-level attributes.",
      "inputs": [
        "Concept identifier",
        "Designation literal form or symbol asset reference",
        "Designation type",
        "BCP 47 language tag and optional script subtag",
        "Acceptability rating and rating-authority reference"
      ],
      "outputs": [
        "Designation record linked to the concept",
        "Reified designation identifier where the profile requires one",
        "Constraint evaluation result for preferred-label uniqueness"
      ],
      "preconditions": [
        "The language tag validates against the IANA Language Subtag Registry and any script subtag is justified against Suppress-Script",
        "The concept identifier resolves",
        "No conflicting preferred designation already exists for the same language tag unless the profile documents a relaxation"
      ],
      "effects": [
        "The designation inventory is updated and the uniqueness constraint is re-evaluated",
        "The rating-authority pointer is stored as a reference only; the rating process, its approval and its audit record stay outside this model",
        "Hidden designations become available to retrieval without becoming displayable"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-009",
        "SRC-010"
      ]
    },
    {
      "id": "ct-core-fn-record-definition-note",
      "name": "Record a definition or typed note",
      "description": "Attach a language-tagged definition or a typed note to a concept or to a specific designation, with its source reference and attachment level.",
      "inputs": [
        "Concept or designation identifier",
        "Note or definition type",
        "Text and language tag",
        "Source document or clause reference"
      ],
      "outputs": [
        "Typed definition or note attached at the declared level",
        "Classification of the note as meaning-bearing or editorial"
      ],
      "preconditions": [
        "The language tag is valid",
        "The note type is drawn from the declared note vocabulary",
        "The definition cardinality rule for the target language permits the addition"
      ],
      "effects": [
        "The meaning description of the concept is extended",
        "Editorial notes are marked filterable so interchange profiles can drop them without loss of meaning",
        "Circularity and bare-negation checks are queued for the validation function"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-003",
        "SRC-005"
      ]
    },
    {
      "id": "ct-core-fn-resolve-designation",
      "name": "Resolve a designation to candidate concepts",
      "description": "Look up a string in a given language and optional subject field and return the concepts whose designations match, with the evidence needed to disambiguate homographs.",
      "inputs": [
        "Search string",
        "Language tag and optional fallback order",
        "Optional subject field filter",
        "Whether hidden designations are in scope"
      ],
      "outputs": [
        "Ranked candidate concept identifiers",
        "Matched designation with its type, rating and language tag",
        "Homograph disambiguation evidence including subject field and delimiting characteristic"
      ],
      "preconditions": [
        "The caller is authorised to read the designations in scope under the adopting Dimension's policy",
        "The language fallback order is declared"
      ],
      "effects": [
        "Read-only: no concept, designation or note is modified",
        "Hidden designations may be matched but are not returned for display unless the caller is explicitly permitted",
        "A no-designation signal is returned rather than a coined term when no match exists in the requested language"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-003",
        "SRC-009"
      ]
    },
    {
      "id": "ct-core-fn-validate-core-record",
      "name": "Validate a concept record against declared constraints",
      "description": "Check a concept record and its designations, definitions and notes against the structural constraints declared for the active profile, and return findings.",
      "inputs": [
        "Concept record with its designations, definitions and notes",
        "Declared interchange or validation profile",
        "Registry endpoints for language and script code validation"
      ],
      "outputs": [
        "List of constraint findings with severity and constraint identifier",
        "Summary of unresolved references",
        "Statement of which constraints were not evaluated and why"
      ],
      "preconditions": [
        "The applicable profile has been declared",
        "Any referenced registry is reachable, or its unavailability is reported rather than assumed to pass"
      ],
      "effects": [
        "Findings are returned to the caller only",
        "No remediation, no enforcement and no audit record is written; enforcement and audit storage belong to the adopting Dimension and to the governance area",
        "A failed constraint marks the record unverified rather than altering it"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-008",
        "SRC-012"
      ]
    },
    {
      "id": "ct-core-fn-project-interchange",
      "name": "Project a concept set to or from an interchange profile",
      "description": "Render concepts and their designations into a named interchange profile, or read them back, producing an explicit report of anything the target profile cannot carry.",
      "inputs": [
        "Concept records in scope",
        "Target profile identifier such as SKOS, SKOS-XL with the ISO 25964 extension, TBX or OntoLex",
        "Language filter",
        "Direction of projection"
      ],
      "outputs": [
        "Profile-shaped projection of the selected concepts",
        "Loss report naming every attribute the target profile cannot represent",
        "Mapping table used for the projection"
      ],
      "preconditions": [
        "A documented mapping exists for the target profile",
        "Where the profile reifies designations, designation identifiers exist for every designation in scope"
      ],
      "effects": [
        "Model semantics are unchanged; the projection is a rendering, not a redefinition",
        "A loss report is produced whenever designation-level attributes or note types cannot be carried",
        "No conformance to the target standard is claimed unless validation evidence for that profile is attached"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-004",
        "SRC-008",
        "SRC-012"
      ]
    },
    {
      "id": "ct-rel-fn-assert-semantic-relation",
      "name": "Assert a within-scheme semantic relation",
      "description": "Record a direct hierarchical or associative relation between two concepts inside one scheme, with its refined kind where the scheme supports refinement, and with the justification note that accompanies the assertion.",
      "inputs": [
        "Source concept reference",
        "Target concept reference",
        "Relation type and refined kind",
        "Governing scheme reference",
        "Justification note"
      ],
      "outputs": [
        "Stored direct relation assertion marked as authored",
        "Accepted or rejected status with the reason",
        "List of integrity conditions evaluated for this assertion"
      ],
      "preconditions": [
        "Both endpoints resolve to concepts, not to grouping nodes or schemes",
        "The relation type is one the governing scheme permits",
        "For an associative assertion, no hierarchical path already connects the pair",
        "For a second broader assertion, the scheme permits polyhierarchy"
      ],
      "effects": [
        "Only the direct form is stored; no transitive or ancestor statement is written",
        "Any materialised closure is marked stale for recomputation",
        "Approval, publication and change-history recording are left to the governance and lifecycle areas"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-008",
        "SRC-014"
      ]
    },
    {
      "id": "ct-rel-fn-assert-mapping",
      "name": "Assert a cross-scheme mapping",
      "description": "Record a mapping from this concept to a concept in another scheme, with the mapping type, the target scheme reference, the bound scheme releases and the basis for the chosen strength.",
      "inputs": [
