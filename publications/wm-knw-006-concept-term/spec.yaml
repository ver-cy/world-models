    "adversarial_checks": [
      "Tested whether a preferred label could serve as the identifier; rejected because SKOS permits one preferred label per language tag, labels are language-scoped and mutable, and the same string recurs across schemes and subject fields. The policy layer now forbids resolving or merging on label equality.",
      "Searched for a counterexample to the concept and designation split: non-linguistic symbols and appellations are designations with no lexical entry, which is why lexical form is attached at the designation boundary rather than at the concept, and why the designation-type code is mandatory.",
      "Checked whether multilingual equivalence smuggles in cross-scheme mapping ownership; it does not — equivalence here holds between designations of a single concept, and concept-to-concept mapping is excluded in scope and boundary notes.",
      "Audited every function against the no-enforcement rule: the validation function returns findings and explicitly disclaims remediation, enforcement and audit-record writing, and the resolve function is declared read-only with a no-designation signal instead of a coined fallback.",
      "Checked whether SKOS forbids a declared top concept from also having a broader concept in the same scheme. It does not - the Reference states there is no such integrity condition - so top concepts are modelled as declared entry points, not as derived roots, and the coexistence is flagged rather than rejected.",
      "Checked whether skos:broader is transitive before allowing any finding to store ancestor sets. It is not; only skos:broaderTransitive is. Closure is therefore modelled as a derived view that is never written back as an authored assertion.",
      "Checked whether scheme membership propagates along semantic relations. The SKOS Reference explicitly denies the entailment and gives a counterexample, so membership must be asserted per concept and any derivation is marked as a local rule.",
      "Checked whether exact-match chains and close-match chains may be composed together. closeMatch is explicitly not transitive, so heterogeneous and non-transitive chain composition is rejected by the chain function rather than merely discouraged.",
      "Checked whether mapping properties are formally restricted to different concept schemes. They are restricted only by convention, and same-scheme mapping produces no inconsistency, so the model records this as an exception case caused typically by merging sources rather than asserting a prohibition the standard does not make.",
      "Checked whether the OntoLex decomp module supports a claim that a compound concept is the semantic composition of its parts. It decomposes lexical entries, not concepts, so decomposition basis is recorded as lexical or semantic and a non-inference statement is required.",
      "Checked whether an alignment to an ontology term may default to owl:sameAs or owl:equivalentClass. OWL 2 gives both strong extensional consequences and distinguishes individual identity from class equivalence, so the alignment predicate and its entailment scope must be declared and the weaker predicate is the default.",
      "Falsifiability test — is any node unsupported? Every bundle, layer, finding and function cites sources. The weakest support is the registration state model, whose category split relies on a paywalled standard read through catalogue and summary material; that limitation is recorded as a known omission and the confidence is set to medium rather than high, and no clause-level conformance is claimed.",
      "Counterexample test — does a stable concept identity always survive? It does not in every real vocabulary: concepts are sometimes silently re-scoped in place, and some registries do reuse identifiers. The model treats that as a defect to be detected rather than accommodated, forcing deprecation plus successor, which is a normative local choice and is stated as such.",
      "Serial-scope test — does the naming rule respect the real scopes? Mapping sets are scoped to a scheme pair plus both bound releases and interchange packages to an export closure, not to a concept; only the four governance artifacts and the usage attestation are concept- or designation-scoped; the crosswalk specification remains non-serial with external or content identity.",
      "Integrity test — is every digest re-derivable per media form? Structured artifacts hash the versioned canonical semantic form; audio, raster, vector, video and screenshot renditions hash the exact retained byte stream with media type and byte length; transcoding mints a new rendition; physical specimens are never hashed directly, only their holding-system record and retained renditions; and restricted digests carry no promise of third-party recomputation."
