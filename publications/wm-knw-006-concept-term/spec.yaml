      "namespace_guidance": "WM-KNW-006 uses exactly three stable local-ID zones, all lower-kebab-case, all stable across storage and interface projections: ct-core- for the lexical and designation surface (concepts, designations, language-tagged labels, definitions and the ct-core-usage-attestation artifact); ct-rel- for semantic relations, scheme mappings and interchange (including ct-rel-art-mapping-set, ct-rel-art-crosswalk-specification and ct-rel-art-interchange-package); and ct-gov- for lifecycle, decision, provenance, evidence, validation, quality, stewardship, rights and retention structures (including ct-gov-artifact-decision-record, ct-gov-artifact-change-record, ct-gov-artifact-deprecation-notice and ct-gov-artifact-validation-report). Every bundle, layer, finding, question, data element, artifact and function ID MUST begin with its zone prefix, and a node MUST NOT be moved between zones without a deprecation of the old ID and a new ID in the target zone; IDs are never reused across zones. Zone prefixes are semantic addresses, not folder names: a Markdown tree, a Git path, a MongoDB collection, an MCP resource URI and a JSON pointer are all equally valid projections provided the zone prefix survives intact. Local IDs MUST NOT contain a date, timestamp, release label or sequence position. Externally facing IRIs are minted in the package's own namespace and MUST NOT reuse a standards-body namespace.",
