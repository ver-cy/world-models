      "OBO Foundry Principle 4 prefers date-based version identifiers of the form YYYY-MM-DD, while Vercy prohibits a date as an identifier. Resolved locally by permitting a date-formed version designation as a human-facing release label while identity remains the release identifier; this is a local policy decision, not a claim that OBO is wrong.",
      "Semantic Versioning's MAJOR/MINOR/PATCH semantics are API-oriented and do not map cleanly to vocabulary change: a definition narrowing breaks consumers without changing any structural interface. The local EDITORIAL/ADDITIVE/BREAKING classification is used instead, with SemVer cited only for the increment and immutability discipline.",
      "RFC 3339 permits -00:00 to signal an unknown local offset. This model prohibits that form in governed records, which is a local restriction of the standard rather than a conformance claim.",
      "ISO 25964 statuses attach primarily at the term level while ISO/IEC 11179-6 registration statuses attach to an administered item. This model attaches registration status to the stable concept and treats designation-level status as lexical-split content; adopters bridging to a thesaurus management system will need an explicit mapping.",
      "Three distinct deprecation idioms coexist — owl:deprecated with term-replaced-by in OBO practice, adms:status or dcat:status codes in catalogue practice, and dcterms:isReplacedBy in DCMI. This model records the local flag plus successor pointers and maps outward, rather than adopting one idiom as canonical."
