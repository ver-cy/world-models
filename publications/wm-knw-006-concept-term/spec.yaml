                    "id": "ct-rel-art-interchange-package",
                    "name": "Relation and mapping interchange package",
                    "description": "A self-describing export or import payload carrying the selected closure of concepts, their scheme and grouping memberships, direct relations, mappings and alignments, together with a manifest declaring the closure rule, out-of-closure references, the crosswalk applied and any lossy constructs. It is produced repeatedly and must be verifiable on receipt, so it carries its own identifier, digest and assertion count.",
