  "model": {
    "registry_id": "vr.wm-knw-006",
    "model_id": "WM-KNW-006",
    "name": "Concept / Term",
    "entry_kind": "entity",
    "purpose": "Represent a stable, identified semantic concept as a unit of thought that is independent of any label, language or storage format, together with the designations, definitions, notes and usage descriptions that describe it, so that agents and systems can refer to the same meaning across languages, vocabularies and interfaces.",
    "scope_statement": "WM-KNW-006 models the concept as an aggregate root with its own persistent identity, plus the subordinate or referenced descriptions that give it meaning: designations (terms, appellations, proper names, symbols) with acceptability ratings, lexical entries and word forms, definitions and typed notes, subject field, referents and usage context; the concept's placement in concept schemes and its hierarchical, associative and cross-scheme mapping relations; and its lifecycle, provenance, ownership, editorial governance, access policy references and quality assertions. The model is format-neutral: RDF/SKOS, TBX, OntoLex, JSON, YAML, Markdown, Git, MCP and document stores are projections of the same semantics. External standards are treated as alignments, not as conformance claims.",
    "in_scope": [
      "Concept identity: authoritative identifier, governed IRI, notation, and the rules that decide when a change breaks identity",
      "Concept delimitation: intension, extension, essential and delimiting characteristics, split/merge and duplicate tests",
      "Concept kind: general versus individual concept, and explicit separation from lexical entry, word form, sense, class/type, referent and free-text keyword",
      "Designations attached to the concept: term, appellation, proper name and non-linguistic symbol, with preferred/admitted/deprecated acceptability ratings and hidden retrieval-only labels",
      "Designation-level identity and attributes where terms are reified rather than carried as plain strings",
      "Language, script, region and variant tagging of every designation, definition and note, plus transliteration and romanization",
      "Lexical description at the designation boundary: lexical entry, canonical form, other forms, written and phonetic representation, grammatical categories",
      "Definitions and typed notes: scope note, example, general note, editorial note, and their attachment level",
      "Subject field assignment and homograph disambiguation across domains",
      "Referents and exemplars denoted by the concept, held as references to external entity records",
      "Usage context: audience, register, territory, discouraged usage and attested occurrences",
      "Multilingual equivalence asserted at the designation and sense boundary",
      "Concept scheme membership, top-concept status and scheme-scoped constraints",
      "Hierarchical, associative and instantial semantic relations between concepts",
      "Cross-scheme concept mappings and their degree of match",
      "Concept and designation lifecycle: status, supersession, deprecation, redirect and versioning",
      "Provenance, ownership, editorial authority and change history",
      "Access-policy references, quality assertions and validation profiles for concept records"
    ],
    "out_of_scope": [
      "The real-world objects and entity records that a concept denotes; their attributes, identity resolution and lifecycle belong to domain entity models",
      "Formal ontology axiomatisation and reasoning: OWL/RDFS class semantics, restrictions, entailment and consistency checking",
      "Publication of a full lexical or lexicographic resource (dictionary entries, sense inventories, corpora, annotation layers) beyond the designation-level description carried here",
      "Documents, records and content items that merely mention or are indexed with a concept",
      "Search, retrieval, ranking and indexing engines that consume designations",
      "Translation-management workflow, translation memory segments and localisation project state",
      "Identifier minting and resolution infrastructure such as PID, handle or DOI services",
      "Runtime access-control evaluation, policy enforcement and audit-trail storage; this model carries policy and audit-record references only",
      "Machine-learning embeddings, vector representations and similarity models derived from concepts",
      "Retention scheduling, legal hold and physical destruction execution, which belong to the adopting Dimension's records policy"
    ],
    "boundary_notes": [
      {
        "neighbor": "Lexical entry and word form (OntoLex-Lemon lexicon)",
        "distinction": "A lexical entry is a unit of the lexicon with grammatically related forms and base meanings; a concept is a unit of thought. This model attaches lexical entries and forms at the designation boundary and references the lexicon, but does not own the lexicon's entry inventory or its editorial lifecycle.",
        "source_refs": [
          "SRC-004",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Class or type in a formal ontology",
        "distinction": "SKOS concepts are individuals of skos:Concept, not classes; the SKOS Primer records that OWL DL forbids treating them as classes. A concept record may be aligned with an owl:Class under a documented punning rule, but class axioms, restrictions and entailment stay in the ontology model.",
        "source_refs": [
          "SRC-001",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Referent or real-world object",
        "distinction": "ISO 1087 separates the object (anything perceivable or conceivable) from the concept (a mental unit combining characteristics of objects). This model records which referents a concept denotes as references; the referent's own master data belongs elsewhere.",
        "source_refs": [
          "SRC-005",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Concept scheme, thesaurus or controlled vocabulary (parent WM-KNW-002)",
        "distinction": "The scheme owns membership, top-concept designation, scheme versioning and scheme-wide editorial policy. A concept carries an inScheme reference; the same concept may participate in more than one scheme without the scheme's rules migrating into the concept record.",
        "source_refs": [
          "SRC-001",
          "SRC-007"
        ]
      },
      {
        "neighbor": "Free-text keyword or tag",
        "distinction": "A keyword is an uncontrolled string with no identity, no rating, no language governance and no definition. A designation in this model is always bound to an identified concept and carries a language tag and an acceptability rating.",
        "source_refs": [
          "SRC-002",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Lexical sense (ontolex:LexicalSense)",
        "distinction": "A sense pairs one lexical entry with one reference; equivalence asserted sense-to-sense is narrower than equivalence asserted concept-to-concept. This model records which level an equivalence claim was made at, but does not maintain a sense inventory.",
        "source_refs": [
          "SRC-004"
        ]
      },
      {
        "neighbor": "Notation, code list and classification registry",
        "distinction": "skos:notation is a lexical code unique within a concept scheme, typed by datatype. The code list itself, its allocation rules and its release cycle are owned by the issuing registry, not by the concept record that cites the code.",
        "source_refs": [
          "SRC-001",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Semantic relations, mappings, lifecycle, provenance, access and quality areas of WM-KNW-006",
        "distinction": "These are in scope for the combined model but are specified in separate areas. The semantic core carries only the identity-breaking trigger that forces a split or merge, reference-only pointers to rating authority and definition source, and no relation, status, approval or audit machinery of its own.",
        "source_refs": [
          "SRC-001",
          "SRC-007",
          "SRC-008"
        ]
      }
    ]
  },
