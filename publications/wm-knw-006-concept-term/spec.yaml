              {
                "id": "ct-rel-find-interchange",
                "name": "Import, export, projection and crosswalk behaviour",
                "description": "RDF 1.1 establishes that the abstract structure of identifiers, values and statements is independent of any concrete serialization, and that identifiers have global scope, so JSON, YAML, Markdown, tabular files, Turtle and JSON-LD are projections of one assertion set. Interchange therefore turns on three decisions that must be declared rather than implied: which closure is included (concept alone, direct relations, whole scheme, or transitive neighbourhood); how references that leave the closure are represented so they are not read as missing data; and which constructs are lossy in the target model - refined hierarchical kinds, compound equivalence and reified associations are the usual casualties. Namespace and identifier resolution follow the published-vocabulary recipes: term identifiers stay stable while version information moves into the served document.",
