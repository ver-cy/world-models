  "composition": [
    {
      "target": "WM-KNW-002 — concept scheme or knowledge organization system (registered parent)",
      "relation": "CHILD",
      "purpose": "A concept is registered as a member of one or more schemes. This model carries only the inScheme reference and any scheme-scoped notation; scheme membership rules, top-concept designation, scheme versioning and scheme-wide editorial policy remain with the parent.",
      "required": true,
      "source_refs": [
        "SRC-001",
        "SRC-007"
      ]
    },
    {
      "target": "W3C SKOS and SKOS-XL vocabulary",
      "relation": "ALIGN",
      "purpose": "Express concept identity, labels, notation and typed notes in RDF, including reified labels where designation-level attributes are needed. Alignment only: conformance is claimed solely where a validated profile and evidence exist.",
      "required": false,
      "source_refs": [
        "SRC-001",
        "SRC-002",
        "SRC-003"
      ]
    },
    {
      "target": "W3C OntoLex-Lemon lexicon model",
      "relation": "ALIGN",
      "purpose": "Attach lexical entries, canonical and other forms, written and phonetic representations and senses at the designation boundary. The lexicon's own entry inventory, sense inventory and editorial lifecycle remain in the lexical resource.",
      "required": false,
      "source_refs": [
        "SRC-004"
      ]
    },
    {
      "target": "ISO 25964 SKOS extension (iso-thes) thesaurus profile",
      "relation": "ALIGN",
      "purpose": "Map reified preferred and non-preferred terms and the term-level status property. The extension's hierarchical relation properties are used by the relations area of this model, not by the semantic core.",
      "required": false,
      "source_refs": [
        "SRC-007",
        "SRC-008"
      ]
    },
    {
      "target": "TBX interchange profile (ISO 30042 dialects)",
