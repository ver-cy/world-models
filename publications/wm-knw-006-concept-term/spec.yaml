    "conflicts": [
      "SKOS condition S14 permits at most one skos:prefLabel per language tag, while terminology practice grounded in ISO 1087 and TBX allows several admitted terms and, in some termbases, more than one term rated preferred per language for different registers. A profile decision is required and is recorded rather than resolved.",
      "Plain SKOS labels and reified designations (SKOS-XL, iso-thes preferred and non-preferred term classes, TBX term sections) are not interchangeable: projecting a reified designation to a plain literal silently drops rating history, source and grammatical data, which is why a loss report is mandatory.",
      "OntoLex defines LexicalConcept as a subclass of skos:Concept, which invites treating a lexicalised concept as a terminological concept; ISO 1087 keeps concept and designation strictly apart. The model records the assertion level of any equivalence claim to keep the two apart.",
      "The SKOS Primer states that OWL DL users cannot treat SKOS concepts as classes, yet many domain vocabularies do exactly that through punning. Any ontology projection must declare the OWL flavour assumed, and conformance claims that do not are rejected.",
      "BCP 47 Suppress-Script guidance conflicts with the common practice of always emitting a script subtag; tags carrying a suppressed script do not match consumer expectations and are treated as a validation finding, not silently normalised.",
      "The iso-thes namespace documentation lists custom term, concept and note attributes as unmodelled, so extension attributes carried in ISO 25964 XML have no agreed RDF form; such attributes are reported as loss rather than mapped by guesswork.",
      "SKOS declares broadMatch and narrowMatch as sub-properties of both skos:broader/skos:narrower and skos:mappingRelation, so a cross-scheme mapping also enters the within-scheme transitive hierarchical closure. This cuts against the clean separation of semantic and mapping relations that the SKOS Primer presents, and the model records the leak explicitly rather than resolving it.",
      "The SKOS Reference states that restricting mapping properties to different schemes is a convention and supplies no integrity condition against same-scheme mapping, while common practice and the Primer treat cross-scheme use as the rule. The model records the convention and permits the local rule to be stricter.",
      "SKOS defines no integrity condition preventing a declared top concept from also asserting a broader concept in the same scheme, whereas thesaurus practice generally treats top terms as roots. The model treats top concepts as declared entry points and flags the coexistence rather than rejecting it.",
      "ISO 25964 supports compound equivalence and split non-preferred terms, and XKOS supports reified many-to-many associations; SKOS has no native construct for either, so consumers reading plain SKOS lose the structure silently unless the loss is declared.",
      "XKOS and iso-thes both refine broader, but with different property sets (specializes/isPartOf versus broaderGeneric/broaderPartitive/broaderInstantial); a scheme using one is not automatically interpretable by a consumer expecting the other, and neither maps cleanly onto ISO 1087 terminology-science relation typing.",
      "OntoLex-Lemon is a Community Group Report and explicitly not a W3C Standard, so its constructs carry lower normative weight than SKOS or OWL 2 even though they are the best available model for the lexical bridge and for decomposition.",
      "SKOS defines skos:Concept and documentation properties including historyNote and changeNote but supplies no status, deprecation or versioning vocabulary at all. Status and version machinery therefore comes from ADMS, DCAT and registration standards, and no SKOS conformance is claimed for it.",
