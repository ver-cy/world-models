            "findings": [
              {
                "id": "ct-rel-find-ontology-alignment",
                "name": "Semantic alignment to ontology classes, properties and individuals",
                "description": "Aligning a concept to an ontology term is not the same as mapping it to another concept. OWL 2 gives owl:equivalentClass a set-extensional meaning over individuals, rdfs:subClassOf transitive and reflexive subsumption, and owl:sameAs identity of individuals, and each licenses a reasoner to draw consequences the vocabulary editor may not intend. OntoLex sits deliberately between the two worlds: LexicalConcept is a subclass of skos:Concept and is connected to entries by evokes and lexicalizedSense, while denotes and reference point at ontology predicates. DCAT shows the practical consequence, allowing a taxonomy to be a concept scheme, a collection or an ontology. The alignment predicate and its entailment scope must therefore be recorded with the alignment, not assumed.",
                "source_refs": [
                  "SRC-004",
                  "SRC-015",
                  "SRC-016",
                  "SRC-019"
                ],
                "questions": [
                  {
                    "id": "ct-rel-q-align-target-kind",
