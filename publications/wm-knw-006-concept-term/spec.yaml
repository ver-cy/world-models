              },
              {
                "id": "ct-rel-find-hierarchy-kind",
                "name": "Hierarchical relation kinds: generic, partitive and instantial",
                "description": "SKOS offers a single undifferentiated broader relation. ISO 25964, through iso-thes, refines it into broaderGeneric, broaderPartitive and broaderInstantial, and XKOS distinguishes specializes/generalizes from isPartOf/hasPart. ISO 1087 gives the corresponding terminology-science distinction between generic and partitive relations. The refinement matters operationally because chaining behaves differently: generic subsumption composes reliably, whereas partitive chains are unsafe across changes of part-whole kind. Projecting a refined kind onto plain broader for interchange is lossy and must be declared.",
