    "canon_and_patch": {
      "canonicalization_rules": [
        "Canonical form is the versioned canonical semantic form of the record, never a stored file or a pretty-printed serialisation. Serialise the record's semantic content as UTF-8 JSON and apply RFC 8785 (lexicographic UTF-16 code-unit key ordering, ECMAScript number serialisation, defined string escaping), then record the canonical-form version tag, for example ct-canon/1.",
        "Lexical and designation content: designation and label strings are normalised to Unicode NFC and trimmed only of leading and trailing whitespace. No case folding, diacritic stripping, transliteration or punctuation rewriting is applied, because those operations change the designation itself rather than its encoding.",
        "Language-tagged values: each value canonicalises as the pair (BCP 47 language tag in canonical case, NFC string). A value carrying no language tag is a distinct value from the same string carrying one and MUST NOT be merged with it. Collections of language-tagged values sort by language tag, then by string.",
        "Scheme relations and mappings: each assertion canonicalises as the tuple (source concept identifier, source scheme release, predicate, target concept identifier, target scheme release). Sets sort by source identifier, then predicate, then target identifier, then target release. Inverse and inferred assertions are never materialised into the canonical form; only asserted direction and asserted closure are canonical.",
        "Governance content: all timestamps normalise to RFC 3339 with seconds and an explicit offset or Z; code values canonicalise as (code system identifier, code version, code) triples; free-text rationale is NFC. Governance event collections sort by event time, then by record identifier, so equal event times never produce a non-deterministic order.",
        "Absence and explicit null are distinct: omit a property that was never asserted, and assert null only where the model defines an asserted-unknown. Canonicalisation never fills defaults, never drops empty collections that were explicitly asserted, and never reorders array-typed content whose order is semantic.",
        "Derived, cached and projection-only content is excluded from the canonical form and therefore from every digest: rendered display labels, inferred broader or narrower closures, sort keys, pagination metadata and storage-engine fields."
      ],
      "patch_rules": [
        "A patch targets exactly one governed record at one named canonical-form version and carries the pre-image digest. Apply only if the pre-image digest matches the current canonical form; otherwise reject as a conflict and require re-derivation.",
        "Patches are ordered, typed operations over semantic paths (add, replace, remove, move) and MUST be reversible: every accepted patch stores its inverse operation set so any superseded state can be reconstructed exactly.",
        "Lexical and designation content: a published designation is never rewritten in place. Changing the string retires the existing designation and adds a new one, because usage attestations and mapping assertions bind to the designation, not to the concept alone.",
        "Language-tagged values: retagging is a distinct operation from restringing. A patch MUST NOT change a language tag and a string in a single operation, and MUST NOT silently attach a tag to a previously untagged value.",
        "Scheme relations and mappings: changing a match predicate, changing a mapping's bound target release, or removing a published mapping is a semantic change requiring a decision record. It is never applied as a patch-level correction, and a patch that touches a mapping without a referenced decision is rejected.",
        "Governance content is append-only. A patch may add a correcting record or set a supersession pointer, but MUST NOT mutate or delete an emitted decision, change, validation or deprecation record, nor alter a recorded event, effective or ingestion time.",
        "Every accepted patch emits exactly one ct-gov-artifact-change-record; where the patch resolved a governed choice, that change record MUST reference the ct-gov-artifact-decision-record that authorised it."
      ],
      "compatibility_rules": [
        "Change classes are EDITORIAL (no change to canonical semantics: typography, non-normative notes, examples), ADDITIVE (new designations, new non-conflicting mappings, new governance metadata, new evidence) and BREAKING (definition scope change, merge, split, deprecation, retirement, or removal or narrowing of a published designation or mapping).",
        "A BREAKING change MUST increment the major component of the release designation and MUST NOT reuse any released version designation. Released content is immutable: defects are corrected in a new release, never by editing a published one.",
        "A concept identifier is never reused, never repointed to a different meaning and never deleted. Meaning change is modelled as deprecation plus successor, so downstream consumers can detect it rather than silently inherit it.",
        "Lexical compatibility: adding a language-tagged value is ADDITIVE; removing the last value for a language is BREAKING for consumers of that language and MUST be declared per language in the release notes. Changing the preferred designation within a language is BREAKING for label-keyed consumers.",
        "Mapping compatibility: tightening or loosening a match predicate is BREAKING for downstream inference. Rebinding an existing mapping to a newer target-scheme release is ADDITIVE only when a conformance check shows the target concept is unchanged in that release; otherwise it is BREAKING.",
        "Governance compatibility: steward change, added evidence and status progression that does not withdraw the concept are ADDITIVE. Retirement, withdrawal, licence narrowing and retention shortening are BREAKING and require prior notice under the published resolution guarantee.",
        "A version designation may use a date form as a human-facing release label, but a date is never identity; identity is the release identifier and the concept identifier. Consumers MUST resolve on identifiers, not on labels."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier: the identifier assigned by the system of record that owns the artifact — the registration authority's case or decision key, the evaluation engine's report run key, the holding institution's accession or specimen number. Record it verbatim together with the identifier of the issuing system, and prefer it over every locally minted alternative.",
        "Immutable digital-artifact content address, using a named digest algorithm together with the applicable canonical-form or exact-byte-stream mode and its version, when the artifact's own declared identity strategy selects content identity and no authoritative master-system identifier exists. This second tier identifies only that immutable artifact or rendition, never the concept, designation or referent; any canonical-content or retained-byte change creates a new artifact identity and a derivation link. Governed external identifiers and local UUID/ULID remain the following fallback tiers for artifacts whose declared strategy is not content-addressed.",
        "Governed global identifier or IRI: a persistent, resolvable identifier from a governed scheme, such as a concept scheme PURL or IRI, DOI, Handle, ARK, ISSN or ISBN for a cited publication. Record the scheme and the resolution service alongside the value.",
        "UUID (RFC 4122) or ULID minted by the adopting Dimension, used only where neither of the above exists. The minting event, minting authority and mint time are recorded so the identifier's origin remains auditable.",
        "Never identity: a date, timestamp, release label or version designation, a file name or path, a display label or title, a digest prefix, a row number or a position in a sequence. Any of these may appear as descriptive metadata but MUST NOT be used to identify an artifact."
      ],
      "timestamp_rule": "Every time value in WM-KNW-006 is an RFC 3339 date-time that includes seconds and an explicit numeric offset or the Z designator; fractional seconds are optional but preserved verbatim in the canonical form when present. The RFC 3339 unknown-local-offset form -00:00 MUST NOT be used in governed records: use Z where the value is genuinely UTC and a known numeric offset otherwise. Event time (when the governed act actually occurred: a decision taken, a deprecation effective, an attestation captured), effective time (when the change takes force for consumers, which may be prospective or retrospective) and observation or ingestion time (when this register captured, received or indexed the record) are stored as separate fields and MUST NOT be collapsed into one value; when they coincide, all three are still written. Intervals and durations are expressed with RFC 3339 date-times at both ends rather than open-ended text, and any ordering of governance events is by event time with the record identifier as deterministic tie-break.",
      "serial_naming_rule": "Serial artifacts are named artifact-kind / scope-discriminator / sequence, where the sequence is a monotonically increasing integer that is never reused, never renumbered and never gap-filled within its scope, and where the scope discriminator is the artifact kind's declared scope rather than a convenience. Sequences are held per (artifact kind, scope) pair; two kinds never share a counter. The complete serial inventory for WM-KNW-006 is: (a) ct-core-usage-attestation — designation-scoped, so the discriminator is the designation identifier, which already carries its concept and language tag; (b) ct-rel-art-mapping-set — scoped jointly to an ordered scheme pair and the bound release of both schemes, so the discriminator is the tuple (source scheme identifier, source scheme release, target scheme identifier, target scheme release), and a mapping set is never scoped by a single concept; (c) ct-rel-art-interchange-package — export-closure-scoped, so the discriminator is the export closure identifier, meaning the resolved set of schemes, releases, languages and filters that defined the export, and never a concept; (d) ct-gov-artifact-deprecation-notice, ct-gov-artifact-change-record, ct-gov-artifact-decision-record and ct-gov-artifact-validation-report — each concept-scoped, so the discriminator is the concept identifier and each of the four kinds keeps its own independent sequence. A date, timestamp, release label, ISO week or any other temporal token MUST NOT be used as the sequence or as any part of artifact identity, although a date may appear in a human-readable title. Non-serial artifacts are never numbered and MUST NOT be retro-fitted with a sequence: ct-rel-art-crosswalk-specification is bridge-model-scoped and retains its declared external identity — the crosswalk specification's own governed identifier or DOI — falling back to content identity where no external identifier exists; every other non-serial artifact likewise retains the identity strategy declared on it.",
      "integrity_rule": "Every artifact carries a digest that a holder of the payload can re-derive, recorded together with the named digest algorithm (for example SHA-256), the canonicalisation or byte-stream mode, and the version of that mode; a digest lacking any of these three is not an integrity claim and MUST be treated as unverifiable. (1) Structured artifacts — decision records, change records, deprecation notices, validation reports, mapping sets, crosswalk specifications and interchange manifests — are hashed over the versioned canonical semantic form defined in the canonicalisation rules, never over a stored file, and record mode canonical-semantic together with the canonical-form version tag. (2) Digital renditions — digital audio, raster image, vector image, video and screenshot — are hashed over the exact retained byte stream, recorded with the declared IANA media type and the byte length in octets; the retained byte stream, not a re-render or a re-export, is the hashed object. Any transcoding, re-encoding, resizing, cropping, redaction or format migration produces a new rendition with its own digest, media type and byte length plus a derivation link to its source rendition, and never updates the digest of the original. (3) A physical specimen or object is never hashed directly: hash the holding system's catalogue record as a structured artifact and each retained digital rendition of the specimen as a byte stream, and link both to the specimen's holding-system identifier, so the integrity claim is about the records and renditions rather than about the object. (4) Where a payload is restricted, embargoed or contains personal data, the algorithm, mode, mode version and digest are disclosed only to authorised parties; the model MUST NOT represent that an unauthorised third party can independently recompute a restricted digest, because recomputation requires authorised access to the canonical payload. A restricted artifact may expose a reference and a statement that a digest exists without exposing the value."
    },
    "policies": [
      "Concept identity is stable and label-independent: designations, definitions and mappings may change under governance, but the concept identifier never changes meaning, is never reused and is never deleted.",
      "Governance records are append-only and immutable once emitted. Corrections are made by adding a superseding record with a pointer to the original, which remains readable for audit.",
      "No progression without authority: a state transition beyond the recorded state requires steward sponsorship and registration-authority approval, recorded as a statement of authorisation and a decision record.",
      "Published releases are immutable and resolvable. A defect in a published release is fixed in a new release, and version designations are never reused.",
      "No conformance claim without evidence: an alignment to an external standard is recorded as an alignment with its clause and version. Conformance is asserted only where a retained validation report or equivalent evidence supports it, and conflicts are recorded rather than reconciled silently.",
      "Evidence that may identify a living person or carry third-party rights is not published without a completed privacy and rights review; where the evidence cannot be disclosed, a restricted reference is published in its place.",
      "This model owns declaration and record-keeping, not execution: constraint evaluation, policy enforcement, audit-log storage and disposition execution are performed by the referenced models and the adopting Dimension, and referencing them confers no ownership of their semantics."
    ],
