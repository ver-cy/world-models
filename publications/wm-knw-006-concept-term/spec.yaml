        "id": "ct-core-identity-bundle",
        "name": "Concept identity and delimitation",
        "description": "What makes this concept a single, citable unit of thought: how it is identified, what fixes its boundaries against neighbouring concepts, what kind of concept it is, and which real-world referents it denotes.",
        "rationale": "ISO 1087 and SKOS both treat the concept, not the label, as the unit that carries identity; SKOS notation is scheme-scoped and labels are language-scoped, so neither can serve as the identifier. Delimitation by essential and delimiting characteristics is the only defensible test for whether two records are the same concept.",
        "source_refs": [
          "SRC-001",
          "SRC-003",
          "SRC-005"
        ],
