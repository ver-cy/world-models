        "id": "ct-rel-bundle-semantics",
        "name": "Within-scheme semantic relations",
        "description": "Relations asserted between concepts inside one concept scheme: direct hierarchical links and their derived transitive closure, refined hierarchical kinds, associative relations and their disjointness from hierarchy, and the modelling of compound (pre-coordinated) concepts.",
        "rationale": "SKOS deliberately does not declare skos:broader or skos:narrower transitive and asserts them only for direct links, while providing separate transitive properties and declaring skos:related disjoint from the transitive hierarchical closure. These are the constraints most often violated by implementations, so asserted structure, derived structure and refined typing are separated and treated conservatively.",
