      "default_rule": "Published concept records, their registration status, version chain, change history, deprecation notices and successor pointers are readable by default under the licence recorded on each record part, because identifier resolution and change transparency are what a consumer depends on. Everything that is not published — draft proposals, unapproved decisions, restricted evidence, embargoed content and personal data — is closed by default and is exposed only as a restricted-reference stub. Write access is closed by default and granted per role and per record part.",
