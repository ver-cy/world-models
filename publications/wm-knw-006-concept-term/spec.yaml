        "The adopting package MUST declare itself owner of vr.wm-knw-006 and name a registration authority, at least one concept steward, a namespace controller and a rights-and-privacy reviewer before any concept record may progress beyond the recorded state.",
        "The package MUST publish the governed code systems it uses for registration status, change class, obsolescence reason, warrant type, maturity, retention class and disposition, each with a version identifier, because this model fixes the slots but not the local value sets.",
