                "description": "A concept is a language-independent node: SKOS attaches labels in many languages to one concept and permits only one preferred label per language tag, so a translation is normally a label of the same concept rather than a mapping to a different concept. Where two vocabularies are maintained in different languages, ISO 25964 treats cross-lingual equivalence as graded - exact, inexact, partial, one-to-many or absent. BCP 47 tags identify the language, script and region of a string; matching tags on two labels says nothing about whether the labels denote the same concept, and equal tags must never be used as evidence of equivalence.",
