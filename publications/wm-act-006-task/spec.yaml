  "model": {
    "registry_id": "vr.wm-act-006",
    "model_id": "WM-ACT-006",
    "name": "Task",
    "entry_kind": "aggregate",
    "purpose": "Provide a format-neutral governed context model for a task instance: a stateful, assignable unit of work with identity, authorisation, lifecycle, timing, inputs, outputs and evidence, reusable by human and automated performers.",
    "scope_statement": "The model governs the task instance as a consistency boundary: the task record plus the parts that have no independent identity outside it (status history, role assignments, deadlines, typed inputs and outputs, progress measurements, provenance entries). Reusable task definitions, plans, work orders, projects, parties and produced documents are separate models referenced by typed edges. Storage and interface (JSON, YAML, Markdown, Git, MCP, MongoDB) are projections of these semantics, not part of them.",
    "in_scope": [
      "Identity of a task instance and correlation of identifiers across exchanging systems",
      "Binding of an instance to a reusable task definition and its version",
      "Classification: task type, performer kind, priority scale and severity",
      "Authorisation and actionability level (proposal, plan, order) and the authorising reference",
      "Role assignment, claiming, release, delegation and forwarding",
      "Canonical state model, terminality, blocking and failure classification",
      "State transition events with event time and recording time separated",
      "Deadlines, escalations, recurrence and temporal anchors",
      "Decomposition into subtasks and typed dependencies with lead or lag",
      "Typed inputs, completion and acceptance criteria, outputs and produced artifacts",
      "Progress and effort measurement, execution provenance and evidence",
      "Access control, confidentiality classification, retention and deletion of the task record",
      "Alignment crosswalks to external task vocabularies and exchange integrity controls"
    ],
    "out_of_scope": [
      "Project and programme portfolio semantics (WM-ACT-005)",
      "Plan and schedule authoring, baselining and versioning (WM-ACT-008)",
      "Work order raising, contractual authorisation and billing (WM-ACT-007)",
      "Process and case definition languages themselves (BPMN process models, CMMN case models)",
      "Party, organisation, role directory and competency registries",
      "Document, dataset and physical deliverable content models referenced as outputs",
      "Calendar event and appointment scheduling of people's time",
      "Issue, defect and change-request domain semantics beyond alignment",
      "Cost, rate, invoicing and financial accounting of work",
      "Robot motion-level or actuator-level decomposition of physical actions"
    ],
    "boundary_notes": [
      {
        "neighbor": "Task definition or template (BPMN task, CMMN task, FHIR ActivityDefinition, WS-HumanTask task definition)",
        "distinction": "A definition is a reusable, versioned specification of work; this model governs the instance that instantiates it and tracks its execution state. The instance carries a version-pinned reference to the definition, never a copy that can silently diverge.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-010",
          "SRC-014"
        ]
      },
      {
        "neighbor": "Project (WM-ACT-005)",
        "distinction": "A project is a temporary endeavour with objectives, budget and governance; a task is a single unit of assignable work inside it. Project membership is an edge on the task, not an attribute the task owns.",
        "source_refs": [
          "SRC-002",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Work order (WM-ACT-007)",
        "distinction": "A work order is the authorising instrument that permits and groups execution; the task records the authorisation reference and its actionability level but does not model the authorising instrument's own approval chain.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Plan or schedule (WM-ACT-008)",
        "distinction": "A plan is independently versioned and places tasks in time; the task holds planned and actual anchors plus a version-pinned plan reference. When planned dates disagree with the plan, the plan is authoritative unless the Dimension states otherwise.",
        "source_refs": [
          "SRC-002",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Provenance activity record (PROV-O Activity)",
        "distinction": "A PROV Activity is a retrospective assertion about something that occurred; a task is prospective and assignable, with deadlines, owners and terminal failure states. The task emits provenance; it is not itself only provenance.",
        "source_refs": [
          "SRC-006"
        ]
      },
      {
        "neighbor": "Calendar event (iCalendar VEVENT) and appointment",
        "distinction": "An event occupies a time block and has its own status vocabulary (TENTATIVE, CONFIRMED, CANCELLED); a to-do or task has completion semantics (NEEDS-ACTION, IN-PROCESS, COMPLETED, CANCELLED), a due time and percent complete.",
        "source_refs": [
          "SRC-003",
          "SRC-015"
        ]
      },
      {
        "neighbor": "Change request or issue (OSLC ChangeRequest)",
        "distinction": "A change request is a domain record about a requested change with review predicates; a task is the unit of work that may implement it. Alignment is one-directional and lossy because OSLC expresses state as independent boolean predicates.",
        "source_refs": [
          "SRC-008",
          "SRC-013"
        ]
      },
      {
        "neighbor": "Message or notification (WS-HumanTask notification, A2A Message)",
        "distinction": "A notification is one-way and expects no response or completion tracking; a task is stateful and must reach a terminal state. Messages requesting missing input attach to a task but are not tasks.",
        "source_refs": [
          "SRC-001",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Outcome or procedure record (FHIR Procedure)",
        "distinction": "An outcome record asserts a change made to a subject; a task tracks whether the work was requested, performed and completed. Both may exist for the same real-world action and must not be merged.",
        "source_refs": [
          "SRC-002"
        ]
      }
    ]
  },
