  "structure": {
    "bundles": [
      {
        "id": "b-identity-and-definition",
        "name": "Identity and definition",
        "description": "What this task is, how it is identified, which reusable definition it instantiates, and how it is classified.",
        "rationale": "Every cited specification makes identity and typing mandatory or near-mandatory (iCalendar UID and DTSTAMP are REQUIRED, FHIR requires status and intent, A2A requires a server-generated id), and all of them separate a reusable definition from a running instance. Without this bundle no other context can be attached reliably.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-003",
          "SRC-009",
          "SRC-010"
        ],
        "layers": [
          {
            "id": "l-task-identity",
            "name": "Task identity and definition binding",
            "description": "Identifier authority, uniqueness scope, correlation across systems, and the versioned link from instance to definition.",
            "source_refs": [
              "SRC-002",
              "SRC-003",
              "SRC-009",
              "SRC-010"
            ],
            "findings": [
              {
                "id": "f-task-identity-and-identifiers",
                "name": "Task instance identity and identifier correlation",
                "description": "Which identifier is authoritative for a task instance, who mints it, in what namespace it is unique, and how it correlates with identifiers held by other systems.",
                "source_refs": [
                  "SRC-001",
                  "SRC-002",
                  "SRC-003",
                  "SRC-008",
                  "SRC-009"
                ],
                "questions": [
                  {
                    "id": "q-identity-authoritative",
                    "text": "Which system of record holds the authoritative identifier for this task instance, and what is that identifier value?",
                    "kind": "identity",
                    "answer_data": [
                      "Master system code and its identifier scheme URI",
                      "Authoritative identifier value",
                      "Minting authority and assignment time"
                    ]
                  },
                  {
                    "id": "q-identity-uniqueness-scope",
                    "text": "Within what namespace is the identifier guaranteed unique, and is uniqueness global or scoped to one server?",
                    "kind": "constraint",
                    "answer_data": [
                      "Namespace or IRI base",
                      "Uniqueness scope (global, tenant, server)",
                      "Collision handling rule"
                    ]
                  },
                  {
                    "id": "q-identity-correlation",
                    "text": "Which additional business, group or external identifiers correlate this task across exchanging systems?",
                    "kind": "interoperability",
                    "answer_data": [
                      "Business identifier values with scheme",
                      "Group identifier shared by sibling tasks",
                      "External UID or IRI held by partner systems"
                    ]
                  },
                  {
                    "id": "q-identity-recurrence",
                    "text": "If the work repeats, is each occurrence separately identified or derived from one recurring definition?",
                    "kind": "identity",
                    "answer_data": [
                      "Recurrence identifier of the occurrence",
                      "Identifier of the recurring parent",
                      "Occurrence expansion rule"
                    ]
                  }
                ],
                "data_elements": [
                  {
