  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "The adopting Dimension MUST designate one owner package that holds this model, its state model definition, its task type code list and its escalation rules, and MUST name an accountable maintainer for each.",
        "The owner package MUST publish the identifier policy (which master system is authoritative, which IRI scheme is used, and when a UUID or ULID may be minted) before any task record is created under this model.",
        "The owner package MUST pin the version of every aligned external vocabulary it claims, store the corresponding crosswalk, and re-verify round-trip fidelity at each release.",
        "The owner package MUST declare retention classes, legal-hold procedure and the authority under which performer-identifying data is retained, since no statutory period is asserted by this model."
      ],
      "namespace_guidance": "Mint task identifiers only under an HTTPS IRI base controlled by the adopting Dimension, for example <base>/act/task/{identifier}, and keep the state vocabulary and task type code list under sibling bases such as <base>/act/task/state and <base>/act/task/type. External vocabulary IRIs from FHIR, iCalendar, PROV, Activity Streams, OSLC, schema.org and A2A appear only as alignment targets and are never used to mint local identifiers.",
      "registry_links": [
        "Registry entry vr.wm-act-006 in the world-model record plane, navigation path NAV.ACT.TSK",
        "Relations file planning/VERCY-MODEL-RELATIONS.csv for the CONTAINS and REFERENCE edges to WM-ACT-005, WM-ACT-007 and WM-ACT-008",
        "State model definition registry entry holding the canonical state list, terminality flags and permitted transitions",
        "Task type and priority scale vocabulary registry entry, versioned independently of this model"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Serialise with deterministic key ordering and Unicode NFC normalisation of all text values so that digests are reproducible across projections.",
        "Express every time value in RFC 3339 form with seconds and an explicit offset; preserve the original offset rather than silently converting to Z, because the offset carries the performer's civil context.",
        "Represent every coded value as the triple of code system, code and code system version; a bare code or a bare priority integer is not canonical.",
        "Represent references as absolute IRIs or as an identifier plus its scheme; distinguish an absent field from a field present with an empty value."
      ],
      "patch_rules": [
        "Patches address stable local identifiers of bundles, layers, findings, questions, data elements and artifacts; they never address values by array position.",
        "State changes are applied only through the transition function; direct field writes to the state value are rejected.",
        "Records in a terminal state accept additive annotations only; a correction is made by a superseding record that references the closed one, never by rewriting history.",
        "Every patch carries actor, reason, event time and recording time, and appends to the transition log; silent updates are invalid.",
        "Deletions are tombstoned: the identifier, terminal state, retention class and deletion provenance survive the removal of content."
      ],
      "compatibility_rules": [
        "Adding an optional data element, question or artifact class is a minor change; consumers must ignore unknown optional fields.",
        "Removing or narrowing a state value, changing the direction of a priority scale, changing terminality, or changing the identity policy is a breaking change requiring a major version and a migration note.",
        "Any change to an alignment mapping requires a new crosswalk revision with an explicit loss note; the superseded crosswalk is retained.",
        "A conformance claim may only be strengthened when new round-trip evidence is stored; otherwise the claim is downgraded to partial alignment."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier issued by the system of record that owns the task instance, for example the workflow engine, ticketing system or agent server that created it; where the producing server mandates that it alone generates task identifiers, that server is the master system.",
        "Governed global identifier or IRI, such as an iCalendar-style globally unique UID or an HTTPS IRI minted under the adopting Dimension's namespace, used when no master system exists.",
        "UUID or ULID assigned by the adopting Dimension, recorded together with its minting authority and minting time.",
        "A date, due time, title, sequence position, assignee name or queue position is never an identifier and must not be used as one, including for occurrences of a recurring task."
      ],
      "timestamp_rule": "All time values MUST be RFC 3339 date-time strings that include seconds and an explicit offset, either Z or a signed hh:mm offset; the -00:00 offset is used only when the UTC time is known but the local offset genuinely is not. Event time, meaning when the state change, claim, execution or deadline breach actually occurred, MUST be recorded separately from observation or ingestion time, meaning when the recording system received or wrote the fact, whenever the two can differ, and each MUST carry its own offset. Where a leap second is represented, the value 60 in the seconds field is accepted and preserved rather than normalised away.",
      "serial_naming_rule": "Serial artifacts, namely transition log entries, delegation records, input requests, acceptance records, output artifacts and evidence items, are named <task-identifier>/<artifact-class>/<zero-padded-sequence>, where the sequence is monotonic within the task and its artifact class, starts at one, and is never reused after deletion or supersession.",
      "integrity_rule": "Every artifact carries a named digest algorithm with its digest value, its size and its media type or form. The transition log is append-only and each entry references the digest of the preceding entry, so that a missing or altered entry is detectable. Outputs are frozen with a digest at acceptance. A claim of conformance to any external vocabulary requires both a stored crosswalk pinned to the target version and stored round-trip test evidence; without both, only partial alignment may be stated."
    },
    "policies": [
      "Do not claim conformance to FHIR, iCalendar, WS-HumanTask, OSLC or A2A without a stored crosswalk and round-trip evidence; state partial alignment and name the distinctions that are lost.",
      "A priority value MUST carry its scale identifier, because the direction and meaning of the scale differ across the cited sources and a bare integer is therefore ambiguous.",
      "Terminal states are immutable by default: reopening requires a new task that references the closed one. Where an aligned system permits status correction instead, that behaviour is recorded as a declared exception with its own audit entry.",
      "An automated performer MUST be recorded as the acting agent together with an on-behalf-of chain to an accountable human or organisational party; an unattributed automated action is invalid.",
      "Every state, assignment and priority change is recorded with actor, reason, event time and recording time; silent transitions are prohibited.",
      "Personal data carried in task descriptions, comments and attachments is minimised at creation and inherits the retention class of the task unless a stricter class applies to the attachment.",
      "Least-privilege access by generic human role: potential owners see queue fields; actual owners update execution fields; requesters may cancel according to policy; stakeholders and business administrators may escalate; excluded owners are denied claim and start.",
      "Retain terminal Task records and lifecycle history for the Dimension retention period unless a legal hold applies; entered-in-error records are retained because they may have been used, but must be labeled so they are not treated as valid work.",
      "Treat external standards as alignments. Store native codes and declared maps; do not overwrite native status with a canonical code.",
      "Cascade suspend and resume to children unless a child is already terminal. Do not auto-complete a parent solely because one child completed unless a completion condition says so."
    ],
    "crud": {
      "read": [
        "Read by task identifier returns identity, classification, current state, assignment and temporal anchors; history, attachments and evidence are retrieved as separate scopes so that summary access does not disclose payload content.",
        "Reads are filtered by the caller's role on the task or on its container, and reads of confidential content are logged with caller, scope and time."
      ],
      "create": [
        "Creation requires an intent code, a task type code and either an authorising reference or an explicit statement that none exists; identity is minted according to the identity priority rule and the authored time is recorded.",
        "Creation from a definition pins the definition version; creation without a definition records that the task is ad hoc or discretionary."
      ],
      "update": [
        "Field-scoped updates are guarded by the revision token or sequence number; a stale token causes rejection rather than a merge.",
        "State, ownership and priority are changed only through their functions, each of which appends to the transition log with reason and both times."
      ],
      "delete": [
        "Deletion is logical by default: content is removed but the identifier, terminal state, retention class and deletion provenance are retained as a tombstone so that references from other tasks remain resolvable.",
        "Physical erasure occurs only on a recorded erasure request citing its authority, is blocked by any active legal hold, and always leaves an audit entry describing the scope erased."
      ]
    },
