    "name": "Marketing Campaign",
    "entry_kind": "aggregate",
    "purpose": "Represent one governed marketing campaign so agents can coordinate objectives, audiences, propositions, channels, content, schedule, budget, measurement, execution, experiments, optimization and learning without confusing campaign state with communication delivery, audience consent, sales conversion, financial commitment or causal effect.",
    "scope_statement": "Owns marketing-campaign identity, revisions, profiles and state; generic campaign, sponsor, owner, brand, market and initiative bindings; situation, insight, baseline, objective, intended outcome, hypothesis, target and success-criterion assertions; audience-definition, segment, taxonomy, source, recency, eligibility, exclusion, geography, language, accessibility and suppression bindings; value-proposition, product, service, offer, promotion, benefit and claim references; channel, endpoint, journey, touchpoint, activity, content, creative, message, localization and approval bindings; wave, flight, placement, inventory, partner, contract, schedule, cadence, sequence and frequency plan; planned and approved budget and resource allocations; metric definitions, numerators, denominators, units, baselines, targets, data sources, identity resolution, deduplication, attribution windows and models; execution, delivery, impression, viewability, invalid-traffic, reach, frequency, engagement, response, conversion and business-outcome references; experiment, treatment, control, assignment, contamination, effect, uncertainty and causal-limit assertions; approval, launch, pause, optimization, change, exception, incident, closure and retrospective evidence; distinct clocks, provenance, privacy, quality, retention, validation and loss-aware projections. External generic campaign, party, audience, consent, offer, promotion, advertisement, creative, activity, communication, placement, contract, finance, observation, experiment, sales and records masters remain authoritative.",
    "in_scope": [
      "Campaign identity, revisions, purpose, sponsor, situation, objectives, hypotheses, audiences, exclusions, propositions, channels, content, waves, placement, schedule, frequency, budget and resource allocations",
      "Metric and attribution design, execution and performance evidence, experiments, optimization, lifecycle, outcomes, clocks, provenance, privacy, access, retention, validation and projections"
    ],
    "out_of_scope": [
      "Owning generic Campaign, Project, Organization, Brand, Market, Product, Service, Offer, Promotion, Advertisement, Creative Work, Content, Audience Member, Segment, Party, Contact Point, Consent, Preference, Activity, Event, Communication, Channel Endpoint, Placement, Inventory, Contract, Order, Invoice, Payment, Budget Ledger, Dataset, Metric Definition, Observation, Experiment, Sales Lead, Opportunity, Customer, Account or Records masters",
      "Treating campaign state as proof of delivery, impression, viewability, reach, engagement, response, conversion, revenue, consent or causality, or treating one funnel, attribution method, KPI, taxonomy or channel as universal",
      "Autonomous targeting of protected groups, unlawful contact, consent creation, sensitive-attribute inference, dark patterns, discrimination, claim approval, content publication, media purchase, budget commitment, personal-data disclosure or record destruction"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ACT-028 Campaign",
        "distinction": "The unified registry supplies a provisional parent signal only. The generic campaign coordinates activities toward an outcome; this aggregate adds marketing-specific audience, proposition, channel, content, budget and measurement context without a settled containment edge.",
