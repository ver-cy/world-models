  "model": {
    "registry_id": "vr.wm-org-018",
    "model_id": "WM-ORG-018",
    "name": "Governance Body / Committee",
    "entry_kind": "entity",
    "purpose": "Describe a constituted collective body through mandate, membership and decision-authority context.",
    "scope_statement": "An enduring body that persists across sessions and membership turnover; distinguish its constitution, seats, holders, procedure and references to decisions. Not a meeting, legal entity by default or legal-validity engine.",
    "in_scope": [
      "Body identity, establishment, mandate and delegation limits",
      "Seats, terms, officers, participation and rule-specific decision procedure",
      "Decision evidence references, reporting, renewal, dissolution and governed records"
    ],
    "out_of_scope": [
      "Underlying person or organization identity and full meeting/decision payloads",
      "Appointing people, casting votes, convening meetings or executing resolutions",
      "Universal quorum, legal validity, retention periods or unrestricted delegated power"
    ],
    "boundary_notes": [
      {
        "neighbor": "Organization or unit",
        "distinction": "A constituted body can be situated in an organization without automatically being a separate legal entity.",
        "source_refs": [
          "SRC-001",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Meeting session",
        "distinction": "Body identity persists across meetings; candidate meeting relationship is not approved composition.",
        "source_refs": [
          "SRC-003",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Member and post",
        "distinction": "Seat, membership term and person are distinct; membership does not automatically confer voting or access rights.",
        "source_refs": [
          "SRC-001",
          "SRC-003",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Decision and operational action",
        "distinction": "Records reference outcomes and their basis without adopting, validating legally or executing them.",
        "source_refs": [
          "SRC-002",
          "SRC-003",
          "SRC-004"
        ]
      }
    ]
  },
