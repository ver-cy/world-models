    "crud": {
      "read": [
        "Reads of fields classified as public require no authorization but are rate-limited and logged in aggregate.",
        "Reads of restricted-tier fields require an authenticated requester category, a stated purpose and a recorded legal basis; the access decision and basis are written to the audit log.",
