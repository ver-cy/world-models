    "known_omissions": [
      "Sole traders, partnerships without legal personality and unincorporated associations are only partially addressed. They appear as an entity category and are within registry-guidance scope, but the model is built around registered legal persons, and jurisdictions differ on whether such entities register at all.",
      "Trusts and other legal arrangements are deliberately excluded. They are governed by a distinct international recommendation with different transparency mechanics and would need a sibling model rather than an extension of this one.",
