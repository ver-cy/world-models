  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "Name a single accountable owner package for WM-ORG-010 and declare, per jurisdiction, which register it treats as authoritative and whether that register is constitutive or declaratory.",
        "Pin the version of every external code list the package depends on — registration authorities, entity legal forms, activity classification, identifier schemes, event types — and store the pinned version alongside every code value, so a stored code remains interpretable after the list changes.",
        "Publish a jurisdiction coverage statement classifying each jurisdiction as production, best-effort or unsupported, and refuse to present best-effort data as authoritative.",
        "Publish an access-tier classification for every field and artifact type before any data is served, defaulting to deny for anything unclassified.",
        "Expose an AGENTS.md bootstrap at the package root and keep its URLs resolvable."
      ],
      "namespace_guidance": "Namespace instances as <dimension>:org-reg:<registration-authority-code>:<register-entity-identifier>, keeping the authority code as the discriminator so identically formatted registration numbers from different registers can never collide. Reserve a distinct segment, <dimension>:org-reg:local:<ulid>, for identities minted by the adopting Dimension; entries in that segment must carry a non-authoritative flag and may never be published as if register-assigned. Alternate identifiers live in a scheme-qualified sub-namespace <dimension>:org-reg:alt:<scheme-code>:<value> so that scheme is never stripped in transit.",
      "registry_links": [
        "vr.wm-org-010 is the canonical registry entry; navigation path NAV.SOC.ORG.REG, domain tags SOC.ORG.REG.",
        "Parent registry entry WM-ORG-001 must resolve before this model is instantiated; a broken parent link blocks instantiation rather than degrading silently.",
        "External governed lists are referenced by registry link plus version and never silently copied; a local mirror must record the upstream URL, version and retrieval timestamp.",
        "Sibling models named in the composition block must be registered before any required composition link is marked satisfied."
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "The canonical form is format-neutral: an ordered set of typed assertions, each carrying subject, predicate, value, source and observation time. JSON, YAML, Markdown, HTML, Git, MCP and MongoDB are projections and must be reconstructible from the canonical assertions, never the reverse.",
        "Legal names are stored byte-exact as recorded by the register, preserving script, diacritics, casing and punctuation; normalisation for search and matching produces a derived index value that never replaces the stored value.",
        "All timestamps canonicalize to RFC 3339 with seconds and an explicit UTC offset or Z. Date-only register values retain an explicit precision marker and are never promoted to timestamps by assuming a time or a zone.",
        "Every code value canonicalizes to the pair (code, code-list version); a bare code is not a valid canonical value.",
        "Addresses canonicalize to component fields plus the register's own unparsed rendering, so that a lossy parse never destroys the authoritative string."
      ],
      "patch_rules": [
        "Patches are append-only assertions. A superseded value is closed with an end timestamp and a superseding reference; it is never overwritten or deleted.",
        "Any patch touching identity, status, jurisdiction or legal form must cite a validation source and an observation timestamp, and is rejected without them.",
        "Patches derived from a legal entity event carry the event type, the event effective date and the event recorded date as separate fields, plus at least one validation document reference.",
        "Bulk patches from a source export must reference the snapshot artifact they were derived from, so any later correction can be scoped to the affected batch.",
        "A patch that would resolve a recorded conflict must carry the resolution rationale and decider; conflicts are not closed by overwriting one side."
      ],
      "compatibility_rules": [
        "Adding an optional field, adding a code value, or relaxing a cardinality from 1 to 0..1 is compatible. Removing a field, narrowing cardinality, tightening a required flag, or reusing a retired code is breaking.",
        "Changing the authoritative register for an existing instance is breaking: it requires a new identity assertion with an explicit predecessor link, not an in-place edit of the authority code.",
        "External code-list version upgrades are recorded as migrations with an explicit mapping table. Values that cannot be mapped are retained under their original list version and flagged, never coerced.",
        "Projections may be added or retired without affecting canonical compatibility, provided the canonical assertions remain sufficient to regenerate every retained projection."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Identifier assigned by the authoritative master system — the registration authority code paired with the register-assigned entity identifier, both stored with the authority-list version used to validate them.",
        "Governed global identifier or IRI where one exists, such as a legal entity identifier, a cross-border register identifier, or an ISO/IEC 6523 scheme-qualified organization identifier; recorded as an alternate identity with an explicit equivalence assertion, never substituted for the register identity.",
        "UUID or ULID assigned by the adopting Dimension, used only when neither of the above is obtainable, flagged as locally assigned, and replaced by an authoritative identifier as soon as one is resolved, with the local identifier retained as a historical alias."
      ],
      "timestamp_rule": "All recorded times use RFC 3339 with seconds and an explicit UTC offset or Z. Event time, source-recorded time and observation or ingestion time are stored as separate fields and never collapsed into one. Date-only values from registers keep a precision marker and are compared only at date granularity. A date is never used as an identifier.",
      "serial_naming_rule": "Serial artifacts — extracts, certificates, snapshots, filings, gazette notices, history archives — are named <artifact-kind>--<issuer-or-register>--<as-of-timestamp-RFC3339>--<sequence>, where sequence disambiguates artifacts sharing a timestamp. The issuer segment is mandatory because the same document type from two registers is not the same series, and a bare date is never sufficient.",
      "integrity_rule": "Every stored artifact carries a content hash with a named algorithm plus the issuer reference and retrieval timestamp. The hash establishes integrity and enables re-verification only; it must never be used as the business identity of the entity, of the registration record, or of the artifact series, because re-issued extracts of identical content are distinct artifacts and re-rendered documents of identical meaning hash differently."
    },
    "policies": [
      "No conformance claim is made to any external standard without a cited, version-pinned mapping and a published conflict list. Alignments are declared; conformance is proven or not asserted.",
      "A registration fact without a validation source and an observation timestamp is stored as unverified and must not be surfaced as authoritative, exported as corroborated, or used to satisfy a compliance check.",
      "Register-sourced personal data is redistributed only under the access tier, licence and minimisation profile recorded for its source register; a downstream copy never widens access beyond its origin.",
      "Dissolution, strike-off or transfer out never triggers silent deletion. Records are closed with a tombstone and retained per the declared retention period for the jurisdiction.",
      "Entity status and record status are always presented as two distinct values; any interface that exposes only one must label which one it shows.",
      "Where two registers or sources conflict, the conflict is stored and surfaced. A preferred value may be computed but must be marked provisional and carry its rule.",
      "One legally distinct entity receives at most one live LEI; porting changes the managing LOU, not the code.",
      "National register identifiers remain authoritative in the formation jurisdiction even when an LEI or EUID exists.",
      "EntityStatus and identifier RegistrationStatus must never be collapsed into a single status field.",
      "New bearer shares or bearer share warrants must not be issued; existing instruments and nominee arrangements require recorded mitigations.",
      "Minimum retention of basic and beneficial-ownership information is five years after dissolution or cessation; legal-identity history should not be hard-deleted while third-party reliance or restoration remains possible.",
      "Public access applies to the FATF basic set and to EU free BRIS particulars; beneficial-ownership access follows the jurisdiction's documented multi-pronged choice and privacy exceptions."
