    "access": {
      "default_rule": "Deny by default. A field, document or artifact is readable only if it has been explicitly classified as public by the owner package on the basis of the source register's own disclosure regime; anything unclassified is treated as restricted. Every permitted read returns source, observation time and corroboration level with the value.",
