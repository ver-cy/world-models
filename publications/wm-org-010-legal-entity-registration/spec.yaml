  "functions": [
    {
      "id": "resolve-registration-identity",
      "name": "Resolve registration identity",
      "description": "Resolve a candidate organization description to a single authoritative register record, or report that no confident resolution exists.",
      "inputs": [
        "Candidate legal name and any known variants",
        "Jurisdiction hint at country and subdivision level",
        "Any candidate identifiers with their scheme codes",
        "Address hint"
      ],
      "outputs": [
        "Resolved registration authority code and register entity identifier",
        "Match confidence with the evidence used",
        "Ranked alternatives when resolution is ambiguous",
        "Explicit no-match result with reason"
      ],
      "preconditions": [
        "A version-pinned registration authority list is loaded",
        "The jurisdiction is within the declared coverage of the owner package"
      ],
      "effects": [
        "Creates or reuses an identity assertion with an observation timestamp",
        "Records the resolution evidence and any rejected candidates",
        "Never silently mints a local identifier when an authoritative one is discoverable"
      ],
      "source_refs": [
        "SRC-003",
        "SRC-002",
        "SRC-009"
      ]
    },
    {
