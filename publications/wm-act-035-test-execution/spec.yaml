    "purpose": "Represent one attributable occurrence of running a versioned test procedure against identified subjects in a declared context, producing preserved observations, evidence and bounded result assertions.",
    "scope_statement": "Owns execution identity and lineage, source-qualified classification, immutable bindings to test definition, criterion, expected result and oracle, run-specific subject and configuration snapshots, inputs and samples, environment, equipment and tools, actor and automation assignments, authorization and safety envelope, lifecycle and step events, source observations, evidence pointers, comparison and verdict assertions, anomalies, rerun and review lineage, projections, access and retention. Test case, requirement, subject, product, configuration, sample, environment, resource, instrument, dataset, observation, artifact, defect, incident, risk, assessment, verification or validation claim and generic audit masters remain external.",
    "in_scope": [
      "Execution identity, attempt and lineage, procedure and criterion revisions, expected results, oracle, subject configuration, inputs, environment, tools, resources, actors and authority",
      "Lifecycle and step occurrences, deviations, observations, measurements, evidence, comparisons, outcomes, verdicts, confidence, anomalies and external issue links",
      "Rerun, reproducibility, review, invalidation, correction, supersession, interoperability, access, retention and safe agent operations"
    ],
    "out_of_scope": [
      "Test case, requirement, subject, product, configuration, sample, environment, instrument, dataset, observation, artifact, defect, incident, risk, assessment, verification or validation claim or audit-log master lifecycle",
