  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "Dimension identity, owner, court or arbitration case authority, records authority and namespace",
        "Case, forum, party-role, claim, filing, evidence, order, decision, review and enforcement registries",
        "Master-system mappings for forums, persons, organizations, contracts, offenses, filings, evidence, judgments and remedies",
        "Jurisdiction, procedure, service, due-process, confidentiality, publication, retention and agent-operation policies"
      ],
      "namespace_guidance": "Mint case and assertion identifiers only when no authoritative docket identity exists; keep forums, parties, claims, filings, evidence, decisions, remedies, appeals and enforcement as typed child or external references.",
      "registry_links": [
        "https://ver.cy/models/",
        "https://ver.cy/model-agent-protocol.md",
        "Dimension-local case, docket, role, schedule, hearing, order, outcome and review-link registries"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Canonicalize by authoritative forum docket identifier and procedure profile, never by case title, party, claim, judge, date, ECLI or file hash.",
        "Keep case, forum, dispute, filing, evidence item, judgment, remedy, review and enforcement identities separate."
      ],
      "patch_rules": [
        "Extensions declare jurisdiction and forum profile, target finding, procedure source, authority, classifier and exchange-profile versions and interoperability impact.",
        "Case identity, jurisdiction, child composition, decision finality or access semantics changes require a successor revision, migration map and preserved cited history."
      ],
      "compatibility_rules": [
        "Unknown additive fields may be ignored only when identity, forum, jurisdiction, parties, claims, docket, child links, orders, finality, access and provenance remain intact.",
        "Every Akoma Ntoso, ECLI, LegalRuleML or sector projection pins versions and states transformed fields, omissions and round-trip limits."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system docket or case-management identifier qualified by forum and jurisdiction.",
        "Governed globally resolvable case IRI with authoritative docket binding.",
        "Dimension UUID or ULID when no external identifier exists."
      ],
      "timestamp_rule": "Use RFC 3339 timestamps with seconds and offset or Z; separate filing, receipt, service, hearing, decision, legal-effect, publication, observation and knowledge times.",
      "serial_naming_rule": "Use {case-id}--{artifact-kind}--{assertion-or-event-id}; never use title, party, forum, date, ECLI or hash alone.",
      "integrity_rule": "Store digest, media type, forum, procedure and profile versions, authority, source anchors, event and knowledge times, confidentiality, quality, licence and access marking."
    },
    "policies": [
      "Only the competent forum or authorized tribunal actor may establish procedural orders, findings, decisions or case-state effects.",
      "Allegation, evidence, admission, finding, order, judgment, finality, recognition and enforcement remain distinct.",
      "Filings, evidence items and judgments retain child-model identity and are never flattened into the case record.",
      "Agents may perform reversible clerical operations and propose checks; adjudication, adverse orders, finality, sensitive disclosure and disposition require accountable authority."
    ],
    "crud": {
      "read": [
        "Resolve Dimension, forum, jurisdiction, procedure profile, docket head, party access, sealed scope, event time and purpose."
      ],
      "create": [
        "Create case identity, forum basis, procedure profile, parties, claims and explicit unknowns before docketing child records or orders."
      ],
      "update": [
        "Append docket event, schedule, child link, ruling, order or outcome with actor, authority, rule, time and provenance; never overwrite cited history."
      ],
      "delete": [
        "Apply appeal, sealing, legal hold and records policy; prefer closure or tombstone and never cascade to parties, filings, evidence, judgments or enforcement."
      ]
    },
