    "name": "Official Statistics",
    "entry_kind": "aggregate",
    "purpose": "Represent an official statistical product as a governed, versioned aggregate of authority, concepts, populations, structures, sources, methods, observations, quality, revisions, releases and confidentiality decisions independent of storage or exchange format.",
    "scope_statement": "Owns official programme and product identity, authority and public-purpose claims, statistical concepts and structures, source and method bindings, series and observation vintages, quality and uncertainty evidence, revision lineage, release control and disclosure decisions while referencing respondent, operational source, generic dataset, geography, party, document and policy masters.",
    "in_scope": [
      "Official-statistics governance, programme and product identity, concepts, populations, frames, structures and classifications",
      "Collection and source metadata, processing, imputation, weighting, estimation, adjustments, quality, uncertainty and comparability",
      "Series, observations, vintages, revisions, releases, dissemination projections, confidentiality, provenance and standard mappings"
    ],
    "out_of_scope": [
      "Respondent or statistical-unit identity and raw microdata payloads, operational administrative records, survey fieldwork systems and transactional source masters",
      "Generic dataset and file-distribution lifecycle, geography and time registries, party identity, legislation, policy documents and publication-channel content",
      "Universal domain indicator catalogues, legal mandates, disclosure thresholds, sampling designs or estimation methods"
    ],
    "boundary_notes": [
      {
        "neighbor": "Dataset and Data Register",
        "distinction": "Official Statistics owns semantic product, series, observation and vintage meaning; a generic dataset owns a packaged collection or distribution and may project one or more product vintages.",
        "source_refs": [
          "SRC-004",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Person, Organization and Statistical Unit",
        "distinction": "This model references authorities, producers, respondents and statistical units but does not absorb their identities or operational lifecycles.",
        "source_refs": [
          "SRC-001",
          "SRC-005",
          "SRC-007"
        ]
      },
      {
        "neighbor": "Administrative, transactional and scientific source records",
        "distinction": "The statistical product owns source bindings and transformations while source systems retain original records, purposes, corrections and access authority.",
        "source_refs": [
          "SRC-002",
          "SRC-003",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Geography and Time registries",
        "distinction": "Territories, calendars and periods are governed external references; the product owns only their role in scope, series keys and observations.",
        "source_refs": [
          "SRC-004",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Report, Publication and Visualization",
