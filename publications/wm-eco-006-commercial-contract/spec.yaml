  "structure": {
    "bundles": [
      {
        "id": "identity-and-legal-frame",
        "name": "Identity and Legal Frame",
        "description": "What this agreement is, how it is uniquely denoted, what kind of transaction it governs and which law and forum apply to it.",
        "rationale": "Before any term can be read or any obligation operated, an agent must fix the record's identity boundary and the legal regime that determines validity, interpretation, performance and remedies; the HCCH Principles make the chosen law govern exactly those matters.",
        "source_refs": [
          "SRC-005",
          "SRC-001",
          "SRC-006"
        ],
        "layers": [
          {
            "id": "agreement-identity-and-classification",
            "name": "Agreement Identity and Classification",
            "description": "Denotation of the agreement instance and the coded classification that selects the applicable regime and term expectations.",
            "source_refs": [
              "SRC-006",
              "SRC-001",
              "SRC-004"
            ],
            "findings": [
              {
                "id": "agreement-record-identity",
                "name": "Agreement Record Identity and Instance Boundary",
                "description": "How one agreement is distinguished from another, which identifier is authoritative, and where a framework agreement ends and a call-off begins.",
                "source_refs": [
                  "SRC-004",
                  "SRC-006",
                  "SRC-013"
                ],
                "questions": [
                  {
                    "id": "ari-q-master-identifier",
                    "text": "Which identifier is authoritative for this agreement, who issued it, and is it agreed by all parties?",
                    "kind": "identity",
                    "answer_data": [
                      "Agreement identifier value",
                      "Issuing system or registry",
                      "Identifier scheme code",
                      "Multi-party acceptance flag"
                    ]
                  },
                  {
                    "id": "ari-q-instance-boundary",
                    "text": "Does this record denote one binding agreement, or a framework whose obligations arise only on call-off?",
                    "kind": "definition",
                    "answer_data": [
                      "Instance kind code (standalone, framework, call-off, schedule)",
                      "Parent agreement reference",
                      "Obligation-arising trigger"
                    ]
                  },
                  {
                    "id": "ari-q-expression-addressing",
                    "text": "How is a specific executed version of this agreement addressed as distinct from the abstract agreement?",
                    "kind": "composition",
                    "answer_data": [
                      "Work-level IRI",
                      "Expression-level IRI",
                      "Expression effective date",
                      "Language code"
                    ]
                  },
                  {
                    "id": "ari-q-mint-authority",
                    "text": "If no master-system identifier exists, which Dimension minted the surrogate key and under what authority?",
                    "kind": "authority",
                    "answer_data": [
                      "Minting Dimension",
                      "Surrogate key type (UUID or ULID)",
                      "Mint timestamp",
                      "Authority reference"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-agreement-identifier",
                    "name": "agreementIdentifier",
                    "description": "Authoritative identifier of the agreement instance, resolved by the identity priority rule.",
                    "value_kind": "identifier",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-006",
                      "SRC-004"
                    ]
                  },
                  {
                    "id": "de-identifier-scheme",
                    "name": "identifierScheme",
                    "description": "Coded scheme of the identifier (master register, governed IRI, or Dimension-minted surrogate).",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-004"
                    ]
                  },
                  {
                    "id": "de-parent-agreement-ref",
                    "name": "parentAgreementRef",
                    "description": "Reference to the framework or master agreement under which this instance is concluded.",
                    "value_kind": "reference",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-015"
                    ]
                  }
                ],
                "artifacts": [
                  {
                    "id": "art-contract-register-entry",
                    "name": "Contract Register Entry",
                    "description": "The authoritative register record asserting the agreement identifier, its scheme, instance kind and links to parent or child instances.",
                    "media_or_form": [
                      "structured record",
                      "register row",
                      "signed identifier assertion"
                    ],
                    "serial": false,
                    "identity_strategy": "Carries the authoritative master-system identifier where the register is the system of record; otherwise the governed IRI, with any Dimension-minted UUID/ULID recorded as an alias with minting provenance.",
                    "source_refs": [
                      "SRC-006",
                      "SRC-013"
                    ]
                  }
                ],
                "inline_only_rationale": null
              },
              {
                "id": "contract-classification",
                "name": "Subject-Matter Classification and Applicable Regime",
                "description": "Coded classification of what the agreement does, and the declared applicability or exclusion of regimes such as the CISG.",
                "source_refs": [
                  "SRC-001",
                  "SRC-005",
                  "SRC-015"
                ],
                "questions": [
                  {
                    "id": "cls-q-subject-class",
                    "text": "What class of subject matter does the agreement govern, and under which classification scheme is that code drawn?",
                    "kind": "classification",
                    "answer_data": [
                      "Subject-matter class code",
                      "Classification scheme identifier",
                      "Scheme version"
                    ]
                  },
                  {
                    "id": "cls-q-commercial-scope",
                    "text": "Are all parties acting in the exercise of their trade or profession, so that the commercial-contract scope applies?",
                    "kind": "constraint",
