  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "Declare a jointly owned record package per agreement instance in which each party position holds an equivalent mirror and joint facts change only on jointly evidenced events; unilateral acts such as notices are writable by their sender alone.",
        "Bind every party position to an authoritative party record and store the identity verification evidence with its observation time before any obligation is derived.",
        "Declare governing law, dispute forum and the retention jurisdiction before clause content is stored, because these determine mandatory rules, limitation periods and deletion limits.",
        "Publish an AGENTS.md bootstrap and a versioned projection catalogue listing every view exposed to non-parties and what each view omits."
      ],
      "namespace_guidance": "Adopt the namespace world.commercialContract under nav path NAV.SOC.ECO.CTR. Agreement expressions and clauses are named with FRBR-style Work and Expression IRIs and persistent clause identifiers so that references survive amendment; never mint contract IRIs under a single party's namespace, because the record is jointly owned. Derived artifacts such as obligation rule sets live in a clearly separate derived subnamespace so they can never be mistaken for the executed text.",
      "registry_links": [
        "Global LEI Index for party legal entity identifiers under ISO 17442",
        "ICC Incoterms rule codes with an explicit edition qualifier",
        "Currency and country code lists referenced by the price, place-of-business and jurisdiction elements",
        "Trusted lists of qualified trust service providers for signature and time-stamp validation",
        "UBL document type and business process code lists used by exchange projections"
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "The canonical form is the executed expression: the clause tree with stable identifiers, the party positions, the derived obligation set marked as derived, and a digest over the normative text. PDF, DOCX, HTML, Markdown, JSON, YAML and database rows are manifestations, not the canon.",
        "Timestamps are canonicalised to RFC 3339 with seconds and an explicit offset; the local offset of execution, dispatch and delivery is preserved rather than normalised to Z, because contractual periods run in a stated locality.",
        "Monetary values are canonicalised as an amount plus a currency code, never as formatted strings; quantities carry an explicit unit.",
        "Parties are canonicalised to a position identifier plus a governed entity identifier, never to a display name; trade terms are canonicalised as code plus edition plus named place."
      ],
      "patch_rules": [
        "A patch that changes normative text is valid only if it carries an executed amendment instrument signed at an assurance level no lower than the original execution.",
        "Patches are append-only: superseded expressions are retained and remain addressable by their expression IRI; no in-place overwrite of executed content is permitted.",
        "Editorial or metadata patches must be flagged non-normative and must not change the digest of the executed expression; if the digest would change, the change is an amendment, not a patch.",
        "Every patch records the actor, the reason, the event time at which the change takes effect and the ingestion time at which it was recorded, as distinct values."
      ],
      "compatibility_rules": [
        "Adding optional findings, data elements or projections is backward compatible; changing the clause identity scheme, the deontic vocabulary, the party role vocabulary or the identity priority is breaking and requires a major version.",
        "Relationships to CISG, UNIDROIT, Incoterms, UBL, LegalRuleML and Akoma Ntoso are published as alignments with a declared claim level; a conformance claim requires cited test evidence.",
        "Consumers must tolerate unknown clause classes, unknown remedy kinds and unknown notice kinds rather than rejecting the record, and must not infer absence of a term from absence of a code."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "Authoritative master-system identifier issued by the system of record for the agreement, such as the contract register number of the register the parties have jointly designated as authoritative, where such an identifier exists and is agreed by all parties",
        "Governed global identifier or IRI, such as a FRBR-style Akoma Ntoso expression IRI for the executed text or an ISO 17442 legal entity identifier for a party occupying a position",
        "UUID or ULID minted by the adopting Dimension, recorded together with the minting authority and mint time, used only where neither a master-system nor a governed identifier is available"
      ],
      "timestamp_rule": "All time values are RFC 3339 date-times carrying seconds and an explicit numeric offset or Z; the local offset of execution, dispatch, delivery and performance is preserved because contractual periods run in a stated locality. Event time, meaning the moment the contractual fact occurred or took effect, is recorded separately from observation or ingestion time, meaning the moment the record captured it, whenever the two can differ. Where UTC is known but the local offset is not, use -00:00 rather than Z. A date is never used as an identifier.",
      "serial_naming_rule": "Serial artifacts, namely amendments, notices, performance records, verification records, manifests, dispositions and log segments, are numbered with a zero-padded monotonic sequence scoped to the agreement identifier and the artifact class, for example agreement-id/amendment/0003. Sequence numbers are never reused, never renumbered on amendment and never encode a date; any effective date is carried as a separate field.",
      "integrity_rule": "Every executed or issued artifact carries a digest over its canonical bytes with a named algorithm, the signature or seal evidence relied on at execution, and an attributable time stamp. The digest of the executed expression is immutable for the life of the record. Verification failure sets a disputed flag, notifies all party positions and is written to the audit log; it never causes deletion or silent replacement of the artifact."
    },
    "policies": [
      "Joint record policy: the agreement record is jointly owned by the party positions; joint facts change only on jointly evidenced events, while unilateral acts are attributable to their sender and remain contestable by the counterparty.",
      "Alignment-not-conformance policy: relationships to external standards are recorded as alignments with an explicit claim level; a conformance claim without cited test evidence is a defect.",
