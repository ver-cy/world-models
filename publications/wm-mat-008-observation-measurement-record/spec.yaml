      "source_refs": [
        "SRC-004",
        "SRC-007",
        "SRC-011"
      ]
    },
    {
      "id": "record-quality-outcome",
      "name": "Record externally produced quality outcome",
      "description": "Attach a quality flag, its code list, the test that produced it, the assigning agent and the assignment instant to the record. This function records an outcome computed elsewhere and never evaluates a rule.",
      "inputs": [
        "Flag value and flag code list identifier",
        "Quality-control test reference and parameters in force",
        "Assigning agent reference and assignment instant",
