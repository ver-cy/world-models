  "functions": [
    {
      "id": "register-observation-record",
      "name": "Register observation record",
      "description": "Create a new observation record, resolve its identity under the model identity priority, and establish its initial lifecycle status and ownership.",
      "inputs": [
        "Candidate master-system identifier and its issuing system",
        "Observation type and determination mode",
        "Owning organisation reference",
        "Initial lifecycle status proposal"
      ],
      "outputs": [
        "Registered observation record with a resolved primary identifier",
        "Recorded identifier scheme and surrogate marker where applicable",
        "Initial status and ownership assignment"
      ],
      "preconditions": [
        "The issuing system is declared as the master system of record, or the absence of an authoritative identifier is explicitly asserted",
        "The observation type is drawn from a named code list",
        "An owning organisation reference resolves"
      ],
      "effects": [
        "A durable record identity exists that later versions extend rather than replace",
        "A surrogate identifier, where minted, is flagged so it can be superseded by an authoritative identifier later",
        "No result content is asserted by this function alone"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-011",
        "SRC-014"
      ]
    },
    {
      "id": "bind-measurand-context",
      "name": "Bind measurand and observation context",
      "description": "Attach the mandatory referents that make the record interpretable: exactly one observable property, exactly one observing procedure, the ultimate feature of interest, and where applicable the proximate feature, sample, observer and deployment.",
      "inputs": [
        "Observable property reference and vocabulary version",
        "Observing procedure reference and version",
        "Ultimate and, where applicable, proximate feature of interest references",
        "Sample, observer and deployment references"
      ],
      "outputs": [
        "Bound measurand context on the record",
        "Dimensional consistency verdict between property, quantity kind and unit",
        "List of unresolved or ambiguous references"
      ],
      "preconditions": [
        "The property and procedure references resolve in their owning registries",
        "Where a sample is referenced, its ultimate feature is stated or derivable",
        "The record is in a status that permits binding"
      ],
      "effects": [
        "The record can be interpreted without consulting the producing system",
        "Unresolved references are surfaced rather than silently dropped",
        "Referenced registries are read only; their entries are not modified"
      ],
      "source_refs": [
        "SRC-002",
        "SRC-003",
        "SRC-010"
      ]
    },
    {
      "id": "record-result-and-unit",
      "name": "Record result value and unit binding",
      "description": "Attach the result payload, its datatype and, for quantities, its unit code and code system, or record a declared absence or censoring instead of a value.",
      "inputs": [
        "Result value or absence reason",
        "Declared datatype and observation type",
        "Unit code and unit code system, where the result is a quantity",
        "Censoring bound, direction and limit reference where applicable"
      ],
      "outputs": [
        "Result recorded with a typed payload or an explicit absence or bound",
        "Unit binding with named code system",
        "Validation findings where type, unit or absence are inconsistent"
      ],
      "preconditions": [
        "The measurand context is bound",
        "A quantity result carries a unit code and code system, or an explicit dimensionless assertion",
        "Absence is expressed by a coded reason, never by an empty value"
      ],
      "effects": [
        "Zero is never used to represent an absent or censored value",
        "Any unit conversion performed is recorded with factor, offset and responsible agent",
        "A binary or complex payload is bound by reference and digest"
      ],
      "source_refs": [
        "SRC-004",
        "SRC-005",
        "SRC-009",
        "SRC-011"
      ]
    },
    {
      "id": "assert-temporal-frame",
      "name": "Assert temporal frame",
      "description": "Set and validate the several distinct times on the record, ensuring each carries an explicit offset and that event time is not conflated with capture time.",
      "inputs": [
        "Phenomenon time instant or interval",
        "Result time",
        "Valid-time interval where asserted",
        "Clock and offset context at the observing location"
      ],
      "outputs": [
        "Validated temporal frame on the record",
        "System-assigned ingestion time",
        "Findings where offsets are missing, ordering is implausible or the clock context is unknown"
