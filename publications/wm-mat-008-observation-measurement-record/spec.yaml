      "source_refs": [
        "SRC-004",
        "SRC-005",
        "SRC-015"
      ]
    },
    {
      "id": "amend-or-supersede-record",
      "name": "Amend or supersede observation record",
      "description": "Apply a controlled change to a released record by issuing a new version or a superseding record, preserving prior content and recording the mechanism, reason and authority.",
      "inputs": [
        "Change mechanism selection",
        "Change reason and classification",
        "Authorising agent reference",
        "New content to be asserted"
