  "model": {
    "registry_id": "vr.wm-mat-008",
    "model_id": "WM-MAT-008",
    "name": "Observation / Measurement Record",
    "entry_kind": "event",
    "purpose": "Provide a format-neutral context structure for a single observation act and the measurement record it produces, binding a feature of interest, an observable property, an observing procedure, a result value and its unit, together with time, uncertainty, quality, provenance and governance context, so that an AI agent can create, inspect, validate and operate observation records without owning the lifecycles of the sensors, samples, methods or catalogues it references.",
    "scope_statement": "The subject is the observation event and its resulting record: the act of determining a value for an observable property of a feature of interest by applying an observing procedure, plus everything needed to interpret, trust, correlate and retire that single record. OMS/ISO 19156 and SOSA/SSN both model an Observation as an execution (an act), so this model is an event, not the sensor, the sample, the property definition or the dataset. It carries references, bindings and observation-specific parameters for those neighbours; it does not reproduce their identity, lifecycle or operational machinery. Storage and interface (JSON, XML, RDF, Markdown, Git, MCP, MongoDB, relational LIMS tables) are projections of this semantics, never part of it.",
    "in_scope": [
      "Identity, versioning and classification of one observation record and of the observation act it documents",
      "Binding to exactly one observable property and one observing procedure, and to the observer, host and deployment that executed it, by reference",
      "Proximate and ultimate feature of interest, and the reference to the sample or sampling chain when observation is indirect",
      "Result representation: value, datatype, cardinality, complex or coverage payloads, and the unit of measure or quantity-kind binding",
      "Absent, censored, below-detection-limit, out-of-range and non-numeric results, with the reason they are absent or bounded",
      "Measurement uncertainty statements (standard, expanded, coverage factor and coverage probability) recorded against the result",
      "References to metrological traceability chains and calibration evidence held by other models",
      "Reference ranges, interpretation codes and recorded statements of conformity together with the identifier of the decision rule applied",
      "Temporal frame: phenomenon time, result time, valid time and ingestion or observation-capture time, each with explicit offsets",
      "Aggregation duration, interpolation type, cumulative flags and sampling regime that determine how the value may be resampled",
      "Observation geometry, observed area and the environmental or operating conditions in force during the act",
      "Record lifecycle status, amendment, correction, supersession and retraction semantics for this record only",
      "Recorded quality flags and quality-control outcomes produced elsewhere, plus references to the evidence supporting them",
      "Provenance chain, derivation from prior observations, responsible agents, ownership and attribution",
      "Access classification, retention binding, and identifier resolution and cross-system correlation",
      "Alignment declarations and encoding bindings to external observation standards, and membership in collections, datastreams or series"
    ],
    "out_of_scope": [
      "The sensor, instrument or observing system as a managed asset, including its own registration, maintenance, firmware and decommissioning lifecycle",
      "Calibration and traceability records as governed documents: this model references a calibration certificate but does not issue, renew, revoke or verify one",
      "The sample or specimen as an entity, including collection, preparation, custody transfer, storage and disposal lifecycle",
      "Definition and governance of observable properties, quantity kinds and controlled vocabularies, including term proposal, deprecation and mapping maintenance",
      "Unit-of-measure registry maintenance, unit conversion tables and dimensional-analysis services",
      "The observing procedure or test method as a controlled specification, including method development, validation studies and version approval",
      "Execution of quality-control tests, rule evaluation, thresholding or automated flagging: this model records the outcome and its provenance, never the evaluator",
      "Audit-trail capture, tamper-evidence infrastructure and electronic-signature enforcement, which belong to the electronic-records model",
      "Physical execution of deletion, purge or anonymisation; this model records the disposition decision and its policy binding only",
      "Dataset catalogue publication, licensing negotiation, DOI minting and distribution management for collections of observations",
      "Downstream analytics, model assimilation, forecasting and statistical inference beyond recording that a result was derived",
      "Sensor tasking, actuation and control commands",
      "Laboratory quality-management-system scope, accreditation status and personnel competence records",
      "Transport-level streaming guarantees, message ordering, delivery semantics and API pagination"
    ],
    "boundary_notes": [
      {
        "neighbor": "Sample / Specimen Record",
        "distinction": "OMS and SOSA separate the Sample (a feature used to represent another feature) from the Observation (the act). This model carries the reference from the observation to its proximate feature of interest and, where that is a sample, to the sample identifier and the ultimate feature it stands for. Sample identity, sampling act, preparation steps, sub-sampling relationships and custody remain owned by the sample model.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Observable Property / Quantity Kind Registry",
        "distinction": "OMS requires an observation to name exactly one ObservableProperty, and QUDT separates QuantityKind from Unit. This model holds the reference and any observation-specific constraint or qualifier on the measurand; it does not define the property term, its dimension, its synonyms or its deprecation policy.",
        "source_refs": [
          "SRC-002",
          "SRC-003",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Unit of Measure Registry (UCUM / SI / QUDT)",
        "distinction": "UCUM and QUDT are governed unit code systems. This model records which code system and code express the result, and any observation-level scaling; it never redefines units, conversion multipliers or dimensional vectors, and it must not silently convert values.",
        "source_refs": [
          "SRC-008",
          "SRC-009",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Observing Procedure / Test Method Specification",
        "distinction": "SOSA defines Procedure as a workflow, protocol, plan, algorithm or computational method, and OMS makes the ObservingProcedure a first-class feature. This model records which procedure version was executed and the execution-specific parameters; method authoring, validation and approval belong to the method model.",
        "source_refs": [
          "SRC-002",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Observer / Instrument Asset and Deployment",
        "distinction": "OMS models Observer, Host and Deployment (with deploymentReason and deploymentTime) as separate features. This model references the observer and the deployment in force at the time of the act; asset lifecycle, platform management and deployment scheduling stay outside.",
        "source_refs": [
          "SRC-002",
          "SRC-003"
        ]
      },
      {
        "neighbor": "Metrological Traceability / Calibration Certificate",
        "distinction": "VIM defines metrological traceability as a documented unbroken chain of calibrations. This model records the traceability declaration and pointers to the calibration evidence in force; it does not model the calibration act, the reference standard hierarchy or accreditation validity.",
        "source_refs": [
          "SRC-008",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Quality-Control Procedure and Evaluation Service",
        "distinction": "QARTOD publishes QC test procedures and flag conventions; SensorThings exposes resultQuality as a recorded property. This model stores the resulting flag, the identifier of the test and the identifier of the evaluating agent. Rule authoring, threshold configuration, execution and re-evaluation are owned by the quality-control model and never by this one.",
        "source_refs": [
          "SRC-004",
          "SRC-015"
        ]
      },
      {
        "neighbor": "Electronic Records / Audit Trail",
        "distinction": "MHRA GxP data-integrity expectations place audit trail, tamper-evidence and signature control on the records system. This model requires that a record be linkable to its audit entries and preserves the original acquisition record as an artifact, but it does not define, generate, secure or query the audit trail itself.",
        "source_refs": [
          "SRC-013"
        ]
      },
      {
        "neighbor": "Dataset / Catalogue Publication (DCAT)",
        "distinction": "DCAT governs Dataset, DatasetSeries, Distribution and DataService, with licensing, access rights and versioning at dataset level. This model records membership pointers from an observation to the collection, datastream or series that contains it; catalogue-level metadata, distribution management and publication workflow stay in the catalogue model.",
        "source_refs": [
          "SRC-014"
        ]
      },
      {
        "neighbor": "Time Series / Observation Collection Aggregate",
        "distinction": "SensorThings binds unitOfMeasurement and observationType at Datastream level, and the OGC Timeseries Profile defines series-level defaults such as interpolationType. Series-level defaults are referenced here so a single record remains interpretable in isolation, but the series aggregate owns its own identity, extent, default resolution and completeness accounting.",
        "source_refs": [
          "SRC-004",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Retention and Disposition Policy",
        "distinction": "This model records which retention policy applies, the disposition decision and the tombstone it leaves behind. Policy authoring, legal-hold determination and the physical execution of destruction are owned by the adopting Dimension's records policy.",
        "source_refs": [
          "SRC-013",
          "SRC-014"
        ]
      }
    ]
  },
