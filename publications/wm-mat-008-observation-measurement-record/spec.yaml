        "Container references, where present, resolve"
      ],
      "effects": [
        "Gaps are reported as findings against the record rather than repaired silently",
        "Inherited values are reported as inherited, never rewritten as if locally asserted"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-004",
        "SRC-005"
      ]
    },
    {
      "id": "project-record-to-encoding",
      "name": "Project record to an exchange encoding",
      "description": "Produce a concrete representation of the record in a named encoding and profile, recording the encoding, the record version projected, the producing agent and any element-level loss.",
      "inputs": [
        "Observation record and version",
        "Target encoding and profile identifier",
        "Projection options such as inclusion of payloads"
      ],
      "outputs": [
        "Encoded observation representation with a content digest",
        "Element-level mapping-loss notes",
        "Round-trip fidelity verdict"
      ],
      "preconditions": [
        "The target encoding and profile are declared as an alignment on the record",
        "The record passes the interpretability assessment for the target profile"
      ],
      "effects": [
        "The encoding is treated as a projection and never becomes the source of truth",
        "Loss, coercion or fabrication introduced by the projection is recorded rather than hidden",
        "Projection does not alter the underlying record"
      ],
      "source_refs": [
        "SRC-001",
        "SRC-004",
        "SRC-011"
      ]
    },
    {
      "id": "record-disposition-decision",
      "name": "Record retention and disposition decision",
      "description": "Bind the record to its governing retention policy, register any hold, and record the disposition decision and resulting tombstone. Execution of destruction is performed by the storage platform under the adopting Dimension's records policy.",
      "inputs": [
