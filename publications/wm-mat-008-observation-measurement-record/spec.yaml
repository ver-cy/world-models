  "structure": {
    "bundles": [
      {
        "id": "observation-act-and-identity",
        "name": "Observation Act and Identity",
        "description": "Establishes what one observation record is: how it is identified and versioned, how it is classified, and how it binds to the procedure execution and the executing observer that produced it.",
        "rationale": "OMS and SOSA both define an Observation as the execution of an observing procedure, not as a value. Any agent operating on such records must first resolve identity, kind and the act itself before it can interpret anything else; SensorThings and FHIR both make identity and a typed classification mandatory entry points.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-003",
          "SRC-004",
          "SRC-011"
        ],
        "layers": [
          {
            "id": "record-identity-and-kind",
            "name": "Record Identity and Kind",
            "description": "Identity, versioning and classification of the observation record and of the act it documents.",
            "source_refs": [
              "SRC-002",
              "SRC-004",
              "SRC-011",
              "SRC-014"
            ],
            "findings": [
              {
                "id": "observation-identity-and-version",
                "name": "Observation record identity and version identity",
                "description": "How a single observation record is uniquely and stably identified, how the identity of the record is distinguished from the identity of the observation act, and how successive versions of the same record are identified without colliding with new observations.",
                "source_refs": [
                  "SRC-004",
                  "SRC-011",
                  "SRC-013",
                  "SRC-014"
                ],
                "questions": [
                  {
                    "id": "obs-id-authoritative",
                    "text": "Which system is the master system of record for this observation, and what identifier does it issue?",
                    "kind": "identity",
                    "answer_data": [
                      "Master system identifier value",
                      "Issuing system identifier and its role (LIMS, SCADA historian, observing service, clinical system)",
                      "Identifier scheme or namespace name",
                      "Whether the identifier is guaranteed stable across export and re-import"
                    ]
                  },
                  {
                    "id": "obs-id-act-vs-record",
                    "text": "Is this identifier for the observation act or for the record that documents it, and how are the two related when one act yields several records?",
                    "kind": "identity",
                    "answer_data": [
                      "Act identifier (if separately assigned)",
                      "Record identifier",
                      "Relationship statement between act and record",
                      "Count of records documenting the same act"
                    ]
                  },
                  {
                    "id": "obs-id-versioning",
                    "text": "How is a corrected or reprocessed version of this record identified relative to its predecessor?",
                    "kind": "provenance",
                    "answer_data": [
                      "Version identifier or sequence",
                      "Predecessor record reference",
                      "Whether the base identifier is retained across versions",
                      "Rule stating that a new version never reuses a superseded version identifier"
                    ]
                  },
                  {
                    "id": "obs-id-surrogate",
                    "text": "If no authoritative or governed identifier exists, what surrogate is minted and how is that fact recorded?",
                    "kind": "authority",
