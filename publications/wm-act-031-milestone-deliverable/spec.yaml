    "bundles": [
      {
        "id": "identity-and-definition",
        "name": "Identity and definition",
        "description": "What this record is, how it is uniquely designated, and whether it is a planned achievement, an accepted output, or both.",
        "rationale": "Delivery data standards require a unique, stable milestone or deliverable identifier and a definitional statement before any date, status or acceptance data is meaningful; conflating milestone and deliverable is the most common modelling error in this domain.",
        "source_refs": [
          "SRC-002",
          "SRC-005",
          "SRC-010"
        ],
        "layers": [
          {
            "id": "identity-and-naming",
            "name": "Identity and naming",
            "description": "Stable identification and human-facing designation of the record within and beyond its owning project.",
            "source_refs": [
              "SRC-005",
              "SRC-010"
            ],
            "findings": [
              {
                "id": "record-identity",
                "name": "Record identity and identifier scope",
                "description": "How a milestone or deliverable record is uniquely identified, at what scope that identifier is unique, and how locally scoped numbering relates to organisation-wide or global identifiers.",
