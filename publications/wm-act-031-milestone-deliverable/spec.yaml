                  "SRC-005",
                  "SRC-010",
                  "SRC-003"
                ],
                "questions": [
                  {
                    "id": "q-identity-authoritative",
                    "text": "Which system holds the authoritative identifier for this milestone or deliverable record, and what is that identifier?",
