      "delete": [
        "Hard deletion of a milestone or deliverable record is prohibited while any retention obligation, disposition hold, unresolved acceptance condition or inbound reference is active; the default disposition is logical retirement via the cancelled or superseded status rather than removal.",
        "When a record's content is disposed of, a tombstone is retained containing the identifier, uniqueness scope, record kind, owning project reference, terminal status, terminal date values and the disposition reference, so inbound references and past reports remain resolvable; the tombstone retention period is set by the governing records policy.",
        "This model does not execute deletion of referenced artifacts: disposition of artifact bytes is performed by the document and artifact repository model, and the retention period, trigger and disposition method are owned by the adopting Dimension's records-management policy or by the record-keeping clause of the governing grant or contract instrument. This model records only the obligation reference, the hold flag and the resulting disposition reference.",
