    "canon_and_patch": {
      "canonicalization_rules": [
        "Canonical form is the record graph, not any serialization: field order, whitespace and container format carry no meaning, and JSON, YAML, Markdown, tabular exports, Git objects, MCP resources and document databases are projections.",
        "All instant-valued fields are canonicalized to RFC 3339 with seconds present and an explicit offset or Z; calendar-date fields are canonicalized to full-date form and are never widened to instants by inventing a time.",
        "Codes are canonicalized as a pair of vocabulary identifier plus code value; a bare code without its vocabulary is not canonical.",
        "References are canonicalized as typed pointers of target model identifier plus target record identifier; embedded copies of referenced records are never canonical and must be regenerated from the target on read."
      ],
      "patch_rules": [
        "Patches are expressed against stable field paths in the canonical graph; a patch that would alter a baseline planned date in place is rejected and must be reissued as a rebaseline carrying an authorising reference.",
        "A patch that changes a status value must carry the transition it asserts and be validated against the permitted transition table before application.",
        "Patches that add or remove artifacts must update the submission manifest and the affected digests in the same change unit, so a manifest never references an artifact without an integrity assertion.",
        "Values frozen into a reporting snapshot are not patchable; corrections are issued as a new value with an observation timestamp and a correction note, leaving the snapshot intact."
      ],
      "compatibility_rules": [
        "Adding an optional field, an optional reference, or a value to an open codelist is a compatible change; removing a field, narrowing cardinality, or removing a code is breaking.",
        "Changing the meaning of an existing status value is breaking even if the token is unchanged, and requires a new vocabulary version.",
        "Projections into external schemas declare the target schema version explicitly; a target version bump that changes required fields is treated as breaking for the projection even when the local model is unchanged.",
        "Records created under an earlier vocabulary version retain that version binding; readers must resolve codes against the version recorded on the record, not against the current default."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "The authoritative master-system identifier issued by the system of record that owns the artifact or delivery record (for example the funder portal deliverable identifier, the repository document identifier, or the acceptance certificate number issued by the accepting authority).",
        "A governed global identifier or IRI from a recognised scheme (for example a DOI, handle or other persistent identifier) where no master-system identifier exists.",
        "A UUID or ULID minted by the adopting Dimension, recorded together with the minting authority and the scope in which it is unique.",
        "A display number such as a structured deliverable number is a human-facing designation only and is never promoted to an identifier; a date or date-time is never an identifier."
      ],
      "timestamp_rule": "All instant-valued fields use RFC 3339 date-time with the seconds element present and an explicit time offset (a numeric +/-HH:MM offset or Z); where the instant is known in UTC but the local offset is not, use the -00:00 convention and set a data-quality flag. Event time (when the achievement, submission or acceptance occurred) and observation or ingestion time (when the fact was recorded in this model) are stored in separate fields and are never collapsed into one value; where they differ, both are required. Purely calendar commitments such as a baseline planned date, forecast date and due date are stored as full-date values without an invented time-of-day and are never silently converted into instants.",
      "serial_naming_rule": "Serial artifacts are named as <record-identifier>-<artifact-role>-<zero-padded sequence>, where the sequence increments monotonically per record and role and never restarts. The submission or issue timestamp is stored as a separate attribute and must not appear in the name, so no identifier carries a date-like component; superseded sequence numbers are retained and never reused.",
      "integrity_rule": "Every artifact reference carries at least one digest expressed as an algorithm identifier from the Active entries of the IANA hash algorithms registry for HTTP digest fields plus its value, computed over the complete selected representation. Digests detect corruption across systems but do not by themselves prove authenticity; where non-repudiation is required the record must additionally reference a signature or acceptance certificate held by the issuing authority. A manifest entry whose digest cannot be verified on retrieval is flagged as unverifiable and must not be reported as accepted evidence."
    },
    "policies": [
      "Separation of duties: the party that records a submission must not be the party recorded as the acceptance authority for the same record; where the adopting Dimension cannot avoid this, the record must carry an explicit conflict declaration.",
      "No silent completion: a status of met, completed or accepted requires a recorded actual or decision date and, for deliverables, a bound manifest or an explicit justification for its absence.",
      "Baseline integrity: baseline planned dates are set once and changed only through a rebaseline that names an authorising reference and retains the superseded value.",
      "Classification precedence: the most restrictive classification among a record and its artifacts governs handling; classification is set per item and is not inherited wholesale from the parent project.",
      "Reference not replication: any concept owned by a referenced model is carried as a typed reference plus subject-specific parameters, never as a local copy of that model's lifecycle, evaluation, enforcement or audit semantics."
    ],
    "crud": {
      "read": [
        "Reads resolve the canonical record graph and dereference typed references on demand; a reader that cannot resolve a reference reports it as unresolved rather than substituting a stale embedded copy.",
        "Reads honour the effective classification: items whose classification prohibits the requesting channel are withheld with an explicit access-denied marker rather than silently omitted from result sets.",
        "Historical reads against a reporting snapshot return the frozen values of that snapshot, with later corrections listed separately and never merged into the snapshot."
      ],
      "create": [
        "Creating a record requires kind, title, scope statement, owning project reference and accountable party reference; an identifier is minted according to the identity priority and its uniqueness scope is recorded.",
