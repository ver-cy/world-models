  "model": {
    "registry_id": "vr.wm-act-031",
    "model_id": "WM-ACT-031",
    "name": "Milestone / Deliverable",
    "entry_kind": "entity",
    "purpose": "Represent a planned achievement (milestone) and an accepted output (deliverable) as governed records inside a project or programme, so an agent can define, schedule, produce, verify, accept, report and retire them without owning project, schedule-network, contract, approval-engine or repository semantics.",
    "scope_statement": "This model covers the record of a single milestone or deliverable: its identity and designation, its typology and definitional scope, its baseline/forecast/actual date commitments, its position against stages and gates, the parties accountable for producing it, its composition and artifact manifest, its declared acceptance criteria and means of verification, the recorded acceptance outcome and evidence reference, its status lifecycle, its provenance and revision lineage, its sensitivity/dissemination classification, and its mappings to external delivery-reporting standards. It deliberately stops at the record boundary: schedule calculation, approval execution, file storage, contractual remedy and audit-trail keeping belong to referenced models.",
    "in_scope": [
      "Milestone record: control point that charts progress, normally zero-duration, with baseline planned, forecast and actual dates and a met/not-met status",
      "Deliverable record: unique and verifiable output submitted for acceptance, with type, dissemination level, due date, submission and acceptance dates",
      "Declared acceptance criteria and means of verification attached to the record",
      "Recorded acceptance outcome (accepted, rejected, conditionally accepted) and the reference to acceptance evidence produced by the accepting authority",
      "Composition of a deliverable into sub-deliverables and its artifact manifest with media/form and integrity digests",
      "Status lifecycle, delay/variance explanation, supersession, grouping and cancellation of the record",
      "Sensitivity and dissemination classification of the record and its artifacts",
      "Provenance of generation, attribution and revision lineage",
      "External identifier bindings and alignment mappings to delivery-reporting standards"
    ],
    "out_of_scope": [
      "Project charter, business case, objectives, funding decisions and overall project lifecycle (owned by WM-ACT-005 Project)",
      "Schedule network logic, activity durations, calendars, float and critical-path calculation (owned by the schedule/activity model; this model only references the driving activity and carries a criticality flag)",
      "Execution of approval or gate decisions, delegation chains and the decision audit trail (owned by the approval/decision-authority model)",
      "Inspection, test and quality-assurance execution and the resulting inspection records (owned by the quality/verification model)",
      "Contract formation, payment triggers, warranty and remedy for latent defect or fraud (owned by the contract/agreement model)",
      "Physical storage, versioning, replication and retention execution of files (owned by the document/artifact repository model)",
      "Outcome and benefit realisation measurement after outputs are used (owned by the benefits/outcome model)",
      "Party, organisation and role registries (owned by the party model)",
      "Requirement catalogues and requirement traceability matrices (owned by the requirement/specification model)",
      "Runtime access-control enforcement and access audit records"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ACT-005 Project (parent, CONTAINS)",
        "distinction": "The project owns objectives, stages, funding, assurance planning and controlled closure; this model owns one delivery record within that structure. GovS 002 requires that a project comprise stages preceded by gates and that deliverables and milestones be defined and agreed for all stages: the stage/gate structure is the project's, the individual milestone record is this model's.",
        "source_refs": [
          "SRC-009",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Schedule / activity-network model",
        "distinction": "GAO best practice treats activities (with duration, logic, resources and float) and milestones (zero-duration events) as distinct schedule objects. Sequencing, duration estimation, critical-path and schedule-risk calculation stay in the schedule model; this model carries only the milestone's baseline/forecast/actual dates, a criticality flag and a reference to the driving activity or work package.",
        "source_refs": [
          "SRC-004",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Approval / decision-authority model",
        "distinction": "FAR 46.502 makes acceptance the act of an authorised representative, and delegation of that responsibility binds the accepting party. This model records who the acceptance authority reference is and what outcome was recorded; it does not evaluate criteria, execute the decision, resolve delegation, or keep the decision audit trail.",
        "source_refs": [
          "SRC-001",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Document / artifact repository model",
        "distinction": "The repository owns byte storage, format conversion, versioning and physical disposition. This model carries the artifact manifest: reference, media type, language, publication date and integrity digest, following the OCDS Document pattern and RFC 9530 digest semantics.",
        "source_refs": [
          "SRC-005",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Contract / agreement model",
        "distinction": "FAR 46.501 gives acceptance a contractual effect (acknowledgment of conformance, subject to latent-defect and fraud exceptions). The legal consequence, payment trigger and remedy belong to the contract model; this model records the acceptance event reference and the clause citation only.",
        "source_refs": [
          "SRC-001"
        ]
      },
      {
        "neighbor": "Quality / verification model",
        "distinction": "NASA life-cycle reviews use entrance and success criteria evaluated by review boards. This model declares the acceptance criteria and means of verification attached to a record and points at the verification evidence; it does not run reviews, tests or inspections nor own their results.",
        "source_refs": [
          "SRC-011",
          "SRC-009"
        ]
      },
      {
        "neighbor": "Benefits / outcome model",
        "distinction": "GovS 002 separates output (product created), outcome (state after outputs are used) and benefit (measurable value). This model stops at the output/achievement record; outcome and benefit measurement are modelled elsewhere and only referenced.",
        "source_refs": [
          "SRC-009"
        ]
      }
    ]
  },
