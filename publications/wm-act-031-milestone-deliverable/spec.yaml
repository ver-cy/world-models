        "identifier uniqueness scope declaration",
        "creation provenance entry"
      ],
      "preconditions": [
        "Owning project reference resolves",
        "Accountable party reference resolves",
        "Record kind is determinable against the milestone/deliverable distinction"
      ],
      "effects": [
        "Record exists in its initial planned state",
        "Identifier reserved at the declared uniqueness scope"
      ],
      "source_refs": [
