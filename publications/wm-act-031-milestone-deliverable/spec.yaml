      "owner_package_requirements": [
        "The adopting Dimension names one owner for the Milestone / Deliverable model and one delegated data owner per portfolio or programme that instantiates it, and records both as references into the party model.",
        "The owner package declares the identifier minting authority and uniqueness scope for milestone and deliverable identifiers before any record is created, and publishes the retired-identifier register.",
