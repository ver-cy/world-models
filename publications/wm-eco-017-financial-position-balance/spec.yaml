    "name": "Financial Position / Balance",
    "entry_kind": "aggregate",
    "purpose": "Represent one governed, time-bound asset, liability, equity, holding, account-balance or exposure position so agents can interpret what is held or owed, by whom, how much, at what time and on which basis without confusing the position with its account, instrument, transaction, valuation or report.",
    "scope_statement": "Owns position identity, versions, class and lifecycle; subject, holder, reporting entity, account, ledger, portfolio, fund, instrument, issuer, counterparty and custodian references; quantity, amount, unit, currency, sign and balance type; recognition, ownership, control, availability, restrictions and encumbrances; measurement and valuation bases, inputs, prices, FX rates, accruals, assumptions and uncertainty; as-of, trade, settlement, booking, valuation, reporting, observation, ingestion and knowledge times; movement and rollforward bindings; reconciliation, exposure, risk, quality, correction and restatement evidence; access, retention and version-pinned reporting and interoperability projections. External party, account, instrument, transaction, journal, valuation-run, statement, filing, policy, audit and records masters remain independently authoritative.",
    "in_scope": [
      "Position identity, subject and account or instrument scope, classification, quantity, monetary amount, currency, unit, sign, balance type, recognition, availability and valuation",
      "Multiple time axes, movements, reconciliation, exposure qualifiers, quality, corrections, lifecycle, access, reporting bindings and interoperability projections"
    ],
    "out_of_scope": [
      "Owning Party, Financial Account, Ledger, Portfolio, Fund, Money or Instrument, Contract, Transaction, Journal Entry, Valuation Run, Financial Statement, Filing, Policy, Audit or Records masters",
      "Treating a reported amount as timeless ground truth or collapsing quantity, carrying amount, fair value, available balance and risk exposure",
      "Autonomous posting, settlement, reclassification, netting, valuation approval, impairment, write-off, restatement, disclosure, certification, access widening or physical records disposition"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ECO-015 Financial Account",
        "distinction": "The candidate parent owns account identity, parties, currency, state and operating rules. The position owns a time-bound measured balance or holding and stores a non-owning account reference.",
        "source_refs": [
          "SRC-005",
          "SRC-006",
          "SRC-014"
        ]
      },
      {
        "neighbor": "WM-ECO-004 Money / Instrument",
        "distinction": "The candidate reference owns the currency, monetary unit or transferable instrument identity. The position owns subject, amount or quantity, basis and as-of state.",
        "source_refs": [
          "SRC-005",
          "SRC-008",
          "SRC-013"
        ]
      },
      {
        "neighbor": "WM-ECO-018 Financial Statement",
        "distinction": "A statement is a governed report over entities, accounts, classifications and a reporting period. A position is one time-bound quantitative assertion that a statement line may aggregate or present.",
        "source_refs": [
          "SRC-002",
          "SRC-004",
          "SRC-006"
        ]
      },
      {
        "neighbor": "Transaction, journal entry, valuation and reconciliation",
        "distinction": "Transactions and entries are flows or postings, valuation is a governed measurement activity, and reconciliation is a comparison process. The position binds their outputs and evidence without executing them.",
