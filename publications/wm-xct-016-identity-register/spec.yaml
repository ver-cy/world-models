  "model": {
    "registry_id": "vr.wm-xct-016",
    "model_id": "WM-XCT-016",
    "name": "Identity Register",
    "entry_kind": "registry",
    "purpose": "Provide a governed, durable and source-qualified registry pattern for anchoring and resolving identifiers of persons, organizations, devices, services and things without importing their descriptive master data.",
    "scope_statement": "Owns register and namespace identity, entry anchors, identifier and alias bindings, registration and assignment evidence, assurance, lifecycle, entity-resolution assertions, merge and split lineage, purpose-bound resolution, federation mappings, subject rights, access and retention. Subject profiles, credentials, accounts, authentication factors, keys, authorization decisions, source documents and business lifecycle remain external.",
    "in_scope": [
      "Register authority and profile, namespace, identifier scheme, syntax, canonicalization, comparison, uniqueness, persistence, non-reuse and resolver contract",
      "Entry identity and external subject reference, identifier bindings, minimal aliases, assignment and proofing evidence, assurance, quality, conflicts, lifecycle and entity resolution",
      "Federation and loss-aware mappings, purpose-bound projections, privacy, subject rights, access, retention, disposition and safe agent operations"
    ],
    "out_of_scope": [
      "Person, organization, device, service, thing, credential, account, authentication factor, key, authorization policy, source document or audit-log master lifecycle",
      "Biometric algorithms, credential issuance, authentication execution, access decisions, universal name authority or copying full subject profiles into the register",
      "Guarantees of universal identity truth, cross-register equivalence, legal identity, eligibility or rights that are not established by a named authority and jurisdiction"
    ],
    "boundary_notes": [
      {
        "neighbor": "Person, Organization, Device, Service or Thing",
        "distinction": "The register stores a minimal external subject reference and identity assertions; each subject model owns descriptive, physical, functional and contextual properties.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-010",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Credential / Attestation",
        "distinction": "A credential owns issuer claims and validity; the register may cite it as evidence without becoming its issuer, holder or status list.",
        "source_refs": [
          "SRC-001",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Account / Authentication / Key",
        "distinction": "An entry or identifier can be linked to an account, authenticator or controlled identifier, but lookup does not prove possession or authorize access.",
        "source_refs": [
          "SRC-002",
          "SRC-003",
          "SRC-004"
        ]
      },
      {
        "neighbor": "Entity Resolution / Master Data",
        "distinction": "This pattern records identity-specific candidate matches, equivalence and lineage; descriptive golden-record consolidation remains in domain master-data models.",
        "source_refs": [
          "SRC-001",
          "SRC-006",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Authorization / Decision / Audit Log",
        "distinction": "Resolution and assurance are evidence for external decisions, while the model keeps identity-specific provenance and delegates generic logging and authorization.",
        "source_refs": [
          "SRC-002",
          "SRC-006"
        ]
      }
    ]
  },
