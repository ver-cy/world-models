    "boundaryDecision": {
      "entry_kind": "registry",
      "status": "reclassified",
      "rationale": "Two axes must be kept apart. On the record plane, the frozen registry value classifies how the model record itself is packaged and published (for example a standalone model-registry entry under vr.wm-xct-016); that is a cataloguing label about the artifact and is never a valid subject-model entry kind. On the subject plane, the modeled thing is a governed identity register that owns an aggregate root, a mandate and jurisdiction, a namespace and scheme authority, register-qualified entry identity, append-only lifecycle events, a resolution contract, federation mappings and a retention regime; the schema enum provides `registry` for exactly that shape. Codex declared `pattern`, which under-specifies ownership: `pattern` properly names reusable structures that carry no owned aggregate root or independent lifecycle and are composed into some other root, and asserting it here invites consumers to embed register state inside person, organization, device, service or thing masters, contradicting the model's own firewall that the register must not import subject master data. Instantiability across many subject kinds is a packaging and reuse property, not a subject-kind property, so it does not justify collapsing the two axes. Reclassify the subject-model kind to `registry`, normalize the purpose wording away from 'registry pattern', and state plainly in every published artifact that `registry` here names the modeled identity register and not the Vercy model-record registry plane."
    },
    "decisions": [
      {
        "concept": "Entry kind declared as `pattern`",
        "disposition": "rejected - reclassified to `registry`",
        "rationale": "The model owns an aggregate root, mandate, namespace authority, entry identity, lifecycle events and resolution contract, which is the `registry` shape; `pattern` under-specifies ownership and invites embedding register state into subject masters."
