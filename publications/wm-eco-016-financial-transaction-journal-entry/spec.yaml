      "identity_priority": [
        "Authoritative master-system identifier issued by the ledger system of record - for example the ERP journal identifier plus line number, or the audit-file transaction and record identifier - is used first, qualified by ledger and reporting entity.",
        "Governed global identifier or IRI where one exists and is authoritative for the object, such as the ISO 20022 end-to-end or account-servicer reference for a settled transfer, or an ISO 17442 Legal Entity Identifier for the entity namespace.",
        "UUID or ULID minted by the adopting Dimension, used only where neither of the above exists, recorded explicitly as a surrogate together with its minting authority and the natural key it stands for.",
        "A date, period, amount, description or filename is never an identifier; such values may be recorded as attributes and used for search, but must not carry identity."
