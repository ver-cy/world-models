    "model_id": "WM-ECO-016",
    "name": "Financial Transaction / Journal Entry",
    "entry_kind": "aggregate",
    "purpose": "Model the atomic accounting posting: a balanced set of debit and credit lines recording one economic event in a ledger, with the identity, time, provenance, authority, evidence and retention context an agent needs to create, validate, post, correct, audit and export it.",
    "scope_statement": "The subject is one journal entry (posting document) treated as an aggregate: an entry header plus two or more posting lines that must balance, together with everything required to establish that the posting is authentic, authorised, correctly timed, correctly measured, and reproducible for audit. It covers the entry as recorded in a ledger of record and as exported for audit or tax inspection. It does not cover the accounts it posts to, the payment or invoice that caused it, or the financial statements derived from it; those are neighbouring models. The model is storage-neutral: SAF-T XML, XBRL GL instances, pipe-delimited audit data files, ERP tables, MongoDB documents and append-only ledgers are projections of the same semantics.",
    "in_scope": [
      "Entry header and posting lines, their identifiers, and the balancing invariant between debits and credits",
      "Monetary measurement: amount, direction, transaction currency, functional and reporting currency translation, rounding",
      "Distinct time roles: document date, accounting effective date, posting date, value date, system entry (ingestion) time, approval time",
      "Entry lifecycle from draft through posting to immutability, plus reversal, storno and correction linkage",
      "Provenance: source system, source document reference, derivation rule, preparer, approver, batch and interface lineage",
      "Authority and segregation of duties governing who may post what, where and when",
      "Fiscal period assignment, period state (open, soft-closed, hard-closed) and cut-off treatment",
      "Tax and analytical attributes carried on lines (tax code, taxable base, cost centre, project, segment, counterparty)",
      "Validation, reconciliation to account balances, completeness of the extracted population and control totals",
      "Audit risk signals on entries, supporting evidence, change-history and integrity controls",
      "Access control, regulator and auditor access, retention, legal hold and lawful disposal",
      "Export and exchange profiles (SAF-T, XBRL GL, audit data standards, statement entries) and code-list mapping"
    ],
    "out_of_scope": [
      "Chart of accounts, account master data and derived account balances (owned by WM-ECO-015 Financial Account)",
      "Payment initiation, clearing and settlement mechanics of a payment instruction (owned by WM-ECO-009 Payment)",
      "Invoice and other commercial source-document content and their legal validity requirements",
      "Financial statements, consolidation output and disclosure taxonomies",
      "Legal entity, customer and supplier master records, including LEI issuance and KYC",
      "Currency, unit-of-measure and country code registries as registries",
      "Budgeting, commitment and encumbrance accounting, and management forecasts",
      "Tax return computation and filing obligations",
      "Consensus, cryptographic and network mechanics of distributed-ledger platforms"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-ECO-015 Financial Account (parent, CONTAINS)",
        "distinction": "The account owns the chart-of-accounts record and derived balances; this model owns the posting event and its balancing invariant. Account existence and status are referenced preconditions, never redefined here. Audit data and SAF-T structures likewise separate the chart of accounts and trial balance from general-ledger entries.",
        "source_refs": [
          "SRC-001",
          "SRC-003",
          "SRC-004"
        ]
      },
      {
        "neighbor": "WM-ECO-009 Payment (COMPOSE, produces postings)",
        "distinction": "A payment is an instruction and a value transfer; a journal entry is its accounting representation. One payment may produce several postings in several ledgers, and a bank statement entry is the account servicer's own posting, not the customer's journal entry. Booking status and settlement finality are read from the payment side and only referenced here.",
        "source_refs": [
          "SRC-010",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Invoice and commercial source-document model",
        "distinction": "SAF-T and comparable audit files place source documents in a separate section from general-ledger entries. The entry carries a resolvable reference and a document archive number, but the legal content and format of the invoice belong to the source-document model.",
        "source_refs": [
          "SRC-001",
          "SRC-013"
        ]
      },
      {
        "neighbor": "Financial reporting and disclosure model",
        "distinction": "Aggregation into statements, and the taxonomies used to report them, sit outside. XBRL GL provides an explicit mapping module (SRCD) to financial reporting taxonomies precisely because the two layers are distinct.",
        "source_refs": [
          "SRC-002",
          "SRC-008"
        ]
      },
      {
        "neighbor": "Party / legal entity model",
        "distinction": "Counterparties are referenced by governed identifiers such as the ISO 17442 Legal Entity Identifier; the entry never becomes the master record for entity reference data or ownership structure.",
        "source_refs": [
          "SRC-009"
        ]
      },
      {
        "neighbor": "Economic event ontology (ISO/IEC 15944-4 REA)",
        "distinction": "REA models resources, economic events and agents at business level. This model deliberately covers only the accounting artifact derived from such events; duplicating resource and agent modelling here would collide with that ontology. The alignment is asserted at catalogue level only and is marked as an evidence gap.",
        "source_refs": [
          "SRC-014"
        ]
      }
    ]
  },
