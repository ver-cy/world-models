      "timestamp_rule": "All instants are recorded as RFC 3339 date-time values with explicit seconds and an explicit UTC offset or 'Z'; the original local offset is preserved rather than normalised away, and '-00:00' is used only where the local offset is genuinely unknown. Event time and observation or ingestion time are recorded separately whenever they can differ: accounting effective date, posting date, value date and settlement finality instant are event times, while the system entry timestamp, extraction timestamp, export timestamp and audit-capture timestamp are observation or ingestion times. Values that are calendar accounting dates with no meaningful instant are stored as full-date values and typed as dates, never converted to midnight timestamps or shifted by an offset.",
      "serial_naming_rule": "Serial artifacts - batch control totals, period close records, statement entries, reconciliation and risk reports, audit file exports, audit and access log segments - are named {ledger-id}-{artifact-kind}-{fiscal-period-or-scope}-{monotonic-sequence}, where the sequence is issued by the producing system of record. The sequence, not any date in the name, is the ordering key; gaps and duplicates in the sequence must be explicitly explained rather than silently accepted, and re-issued artifacts take a new sequence number and reference the superseded one.",
      "integrity_rule": "Every exported or archived artifact carries a content digest over its canonical form, the control totals it asserts (entry count, total debit, total credit), and the identity of the producing system and actor. Posted entries are stored either in non-rewriteable, non-erasable form or under a complete time-stamped audit trail that preserves both the original and every modified version together with the identity of the person or process making the change. Any artifact failing digest or control-total verification is quarantined and reported, never silently re-derived or overwritten; re-derivation produces a new artifact with a new sequence number that references the failed one."
    },
    "policies": [
      "Entries are immutable once posted; every correction is a new linked entry, and the ability to alter or delete a posted record is treated as a control failure rather than a feature.",
      "No entry is accepted unless debits equal credits at the declared balancing scope and every referenced account, period, currency and code resolves and is valid at the entry's effective date.",
