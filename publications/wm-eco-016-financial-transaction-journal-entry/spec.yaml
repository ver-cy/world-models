    "canon_and_patch": {
      "canonicalization_rules": [
        "Amounts are exact decimals with a declared scale and an explicit currency code; binary floating point is never used, and the pair (magnitude, credit/debit indicator) is authoritative with any signed representation derived from it, never the reverse.",
        "Instants are normalised to RFC 3339 with seconds and an explicit offset while preserving the original local offset; pure accounting dates are kept as full-date values and are never widened into midnight instants.",
        "Coded values are stored as scheme-qualified pairs of code list identifier, version and code value, so that a code retains meaning after export into a different profile.",
        "Lines are canonically ordered by line identifier, and object keys are canonically ordered before hashing, so that the integrity digest of a posted entry is reproducible across storage projections.",
        "Control totals are recomputed from the canonical lines rather than copied forward, and a mismatch between asserted and recomputed totals is an error, not a warning."
      ],
      "patch_rules": [
        "Posted entries are append-only: any change to amount, direction, account, currency, effective date or fiscal period is effected by a new reversing or replacement entry that is linked bidirectionally to the original, never by an in-place edit.",
        "Drafts may be patched freely before posting, but every patch records actor, timestamp, reason and before-and-after values in the change audit log.",
        "Metadata-only patches to a posted entry - narrative enrichment, added cross-references, added dimension values where policy permits - are allowed only where the audit trail preserves both the original and the modified record and the entry's integrity digest chain is extended rather than overwritten.",
        "A patch request that would break the balancing invariant, target a hard-closed period, or contradict an active legal hold is rejected and the rejection itself is logged.",
        "Deletion of a posted entry is never a patch operation; disposal occurs only through the retention and legal hold path with a disposal record."
      ],
      "compatibility_rules": [
        "Adding optional fields, new code list values or new analytical dimensions is a minor change; consumers must ignore unknown optional fields rather than reject the record.",
        "Changing the balancing scope, the meaning of an existing code, the direction convention, identifier scope or a validation severity is a breaking change and requires a major version with a stated migration path.",
        "Export profile versions are pinned per delivery and recorded in the export artifact; a profile upgrade never silently reinterprets previously delivered files.",
        "Deprecations are announced at least one major version ahead and carry a replacement mapping; a deprecated element remains readable for the full statutory retention period of the records that used it."
      ]
    },
