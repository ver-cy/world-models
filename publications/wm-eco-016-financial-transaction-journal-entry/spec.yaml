  "structure": {
    "bundles": [
      {
        "id": "bdl-identity-classification",
        "name": "Identity and classification of the posting",
        "description": "What this entry is, how it is named, which book it lives in and how it is typed.",
        "rationale": "Every downstream operation - validation, correction, export, audit selection - depends on being able to name the entry unambiguously and know which ledger and category it belongs to. Audit and tax file formats all begin with an entry identifier plus journal and ledger context.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-003"
        ],
        "layers": [
          {
            "id": "lyr-entry-identity",
            "name": "Entry and line identification",
            "description": "Identifiers for the entry aggregate and its lines, their scope, and the external references that must resolve.",
            "source_refs": [
              "SRC-001",
              "SRC-002",
              "SRC-003"
            ],
            "findings": [
              {
                "id": "fnd-entry-identifier",
                "name": "Entry and posting line identification",
                "description": "How the entry and each of its lines are named by the ledger of record, and which external references must resolve back to them.",
                "source_refs": [
                  "SRC-001",
                  "SRC-002",
                  "SRC-003",
                  "SRC-009",
                  "SRC-010"
                ],
                "questions": [
                  {
                    "id": "q-entry-master-id",
                    "text": "Which system of record issues this entry's authoritative identifier, and under what scheme?",
                    "kind": "identity",
                    "answer_data": [
                      "entry identifier value",
                      "issuing system identifier",
                      "identifier scheme name and version"
                    ]
                  },
                  {
                    "id": "q-line-address",
                    "text": "How is each posting line addressed, and does that address stay stable across export and re-import?",
                    "kind": "identity",
                    "answer_data": [
                      "line identifier or line number",
                      "addressing rule",
                      "stability guarantee statement"
                    ]
                  },
                  {
                    "id": "q-entry-cross-reference",
                    "text": "Which external references - payment end-to-end reference, bank entry reference, source document number - must resolve back to this entry?",
                    "kind": "relationship",
                    "answer_data": [
                      "reference type",
                      "reference value",
                      "target model or system",
                      "resolution method"
                    ]
                  },
