  "structure": {
    "bundles": [
      {
        "id": "evidential-link",
        "name": "Evidential Link Identity and Typing",
        "description": "The citation as a reified, independently identifiable relationship, what it attaches to, and how its evidential character is typed.",
        "rationale": "CiTO reifies a citation as a directed link with its own characterization, and the Web Annotation model reifies an annotation with its own identity; both require the link to be addressable independently of its endpoints so that stance, provenance and lifecycle can attach to it.",
        "source_refs": [
          "SRC-003",
          "SRC-001"
        ],
        "layers": [
          {
            "id": "citation-record-core",
            "name": "Citation Record Core",
            "description": "Identity of the citation record and its binding to the citing context.",
            "source_refs": [
              "SRC-003",
              "SRC-001"
            ],
            "findings": [
              {
                "id": "citation-record-identity",
                "name": "Citation record identity and deduplication",
                "description": "The evidential citation is a first-class record with its own identifier, distinguishable from any other link between the same two endpoints.",
                "source_refs": [
                  "SRC-003",
                  "SRC-007",
                  "SRC-001"
                ],
                "questions": [
                  {
                    "id": "q-cri-identity",
                    "text": "Which identifier authoritatively identifies this citation record, and which system masters it?",
                    "kind": "identity",
                    "answer_data": [
                      "Master-system identifier value and issuing system reference",
                      "Identifier scheme code",
                      "Fallback UUID or ULID assigned by the adopting Dimension"
                    ]
                  },
                  {
                    "id": "q-cri-definition",
                    "text": "What distinguishes a genuinely new citation record from a duplicate of an existing citing-context-to-source link?",
                    "kind": "definition",
                    "answer_data": [
                      "Deduplication key composed of citing-context reference, source identifier, anchor and stance",
                      "Collision and merge policy"
                    ]
                  },
                  {
                    "id": "q-cri-composition",
                    "text": "Which sub-structures are embedded components of this record rather than separately identified records?",
                    "kind": "composition",
                    "answer_data": [
                      "Component inventory with embedded or referenced flag",
                      "Cardinality per component"
                    ]
                  },
                  {
                    "id": "q-cri-interop",
                    "text": "Which external citation identifiers may be recorded as equivalents of this record?",
                    "kind": "interoperability",
                    "answer_data": [
                      "External identifier scheme and value",
                      "Basis on which equivalence is asserted"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-cri-record-id",
                    "name": "citation-record-identifier",
                    "description": "Primary identifier of the reified citation record.",
                    "value_kind": "identifier",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-003"
                    ]
                  },
                  {
                    "id": "de-cri-scheme",
                    "name": "identifier-scheme",
                    "description": "Scheme that governs the primary identifier.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-007"
                    ]
                  },
                  {
                    "id": "de-cri-dedup-key",
                    "name": "deduplication-key",
                    "description": "Normalized composite key used to detect duplicate links.",
                    "value_kind": "text",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-007"
                    ]
                  },
                  {
                    "id": "de-cri-equivalent",
                    "name": "equivalent-identifier",
                    "description": "External identifier asserted to denote the same citation.",
                    "value_kind": "identifier",
                    "cardinality": "0..n",
                    "required": false,
                    "source_refs": [
                      "SRC-007",
                      "SRC-003"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "Record identity is pure structured reference data resolved through identifier registries. Materialising it as a separate file would create a second identity surface competing with the master system, which the identity priority explicitly forbids."
              },
              {
                "id": "citing-context-binding",
                "name": "Citing-context binding and locus",
                "description": "What is doing the citing (claim, decision rationale, document passage or data field) and where inside it the citation applies, held as a reference only.",
                "source_refs": [
                  "SRC-003",
                  "SRC-001",
                  "SRC-012"
                ],
                "questions": [
                  {
                    "id": "q-ccb-relationship",
                    "text": "Which citing context does this record attach to, and through what stable reference into its owning model?",
                    "kind": "relationship",
                    "answer_data": [
                      "Citing-context reference and owning model identifier",
                      "Citing-context kind code"
                    ]
                  },
                  {
                    "id": "q-ccb-composition",
                    "text": "Where inside the citing context does the citation apply, and how is that position expressed?",
                    "kind": "composition",
                    "answer_data": [
                      "Locus expression such as passage, field path or rationale step",
                      "Locus expression scheme"
                    ]
                  },
                  {
                    "id": "q-ccb-constraint",
                    "text": "May one record serve several citing contexts, and what eligibility rules restrict permitted endpoints?",
                    "kind": "constraint",
                    "answer_data": [
                      "Cardinality rule for citing contexts",
                      "Permitted citing-context kinds declared by the owning package"
                    ]
                  },
                  {
                    "id": "q-ccb-authority",
                    "text": "Which model owns the citing context's own status so that this record never mirrors it?",
                    "kind": "authority",
                    "answer_data": [
                      "Owning model identifier for citing-context status",
                      "Declared prohibition on caching that status here"
                    ]
                  }
                ],
                "data_elements": [
                  {
                    "id": "de-ccb-context-ref",
                    "name": "citing-context-reference",
