  "serviceLayers": {
    "dimension": {
      "owner_package_requirements": [
        "The owning package must declare the stance, evidence-type and certainty vocabularies it binds, each with a resolvable reference and an explicit version.",
        "The owning package must name the master system for citation record identifiers and the fallback identifier scheme it mints when no master system exists.",
        "The owning package must name the retention and disposition service, the access policy and audit service, and the party model it delegates to, since this model owns none of them.",
        "The owning package must declare which citing-context models are permitted endpoints and how their references resolve."
      ],
      "namespace_guidance": "Local record identifiers and local controlled values are minted in a Dimension-scoped namespace and never inside an external standard's namespace. External terms are referenced by their governing IRI together with the version in force. Local extensions to an aligned vocabulary live under a clearly separated local extension path so that a consumer can distinguish standard terms from local ones without a lookup.",
      "registry_links": [
        "DataCite Metadata Schema relationType as the governed vocabulary for citation direction, versioning and obsolescence relations.",
        "SPAR CiTO property set as the governed citation-intent vocabulary for supporting and challenging stances.",
        "The cite-as link relation as the governed mechanism for discovering a source's preferred citation identifier.",
        "Evidence and Conclusion Ontology as the governed evidence-type and assertion-method vocabulary where scientific evidence is cited.",
        "The GRADE certainty framework as a bindable external certainty scheme."
      ]
    },
    "canon_and_patch": {
      "canonicalization_rules": [
        "Declare a canonicalization profile before digesting any excerpt: a fixed Unicode normalization form, defined whitespace folding, a defined line-ending form, and explicit inclusion or exclusion of prefix and suffix context in the digest input.",
        "Normalize identifiers before comparison or deduplication: consistent case for scheme and prefix, resolver host removed, percent-encoding normalized; retain both the raw and normalized forms so the original is never lost.",
        "Serialize all timestamps in the canonical form and sort repeated elements by a declared stable key before digesting, so that logically equal records produce equal digests across projections."
      ],
      "patch_rules": [
        "Patches address individual elements by stable path and never reorder or renumber collections as a side effect of an unrelated change.",
        "Any patch that alters stance, locator, anchor, excerpt, fixity or certainty on an asserted record produces a new record version rather than an in-place edit.",
        "Every patch carries a change reason code, the acting agent reference and an ingestion timestamp; a patch without a reason code is rejected.",
        "A patch may not write a value into an element owned by a referenced model, such as claim status or audit outcome; such a patch is rejected at the boundary."
      ],
      "compatibility_rules": [
        "Adding an optional element or a new controlled value is a minor change. Removing an element, narrowing cardinality or retiring a controlled value is breaking and requires a new profile major version.",
        "Retired controlled values remain resolvable and carry a mapping to their replacement rather than being deleted.",
        "A conformance claim against an external vocabulary version is invalidated when that version changes and must be re-tested before it is restated."
      ]
    },
    "artifact_rules": {
      "identity_priority": [
        "The authoritative master-system identifier issued by the system of record for the citation, such as the curation platform's citation record key, is used first and is never re-minted locally.",
        "Where no master-system identifier exists, a governed global identifier or IRI such as a DOI, Handle or registered persistent IRI, resolvable through its own registry, is used.",
        "Only when neither exists does the adopting Dimension assign a UUID or ULID in its own namespace. A date, a URL that may change, and a content digest are never used as the primary identifier."
      ],
      "timestamp_rule": "All time values are recorded in RFC 3339 form with an explicit seconds component and an explicit offset or Z, for example 2026-09-02T14:03:07Z or 2026-09-02T16:03:07+02:00, using -00:00 only to signal a known UTC instant whose local offset is unknown. Event time (when the assertion was made, when the cited source was published, changed or retracted) is recorded separately from observation or ingestion time (when the representation was accessed, when the status was observed, when the record entered this store); where only one is known the other is left empty rather than copied across. Protocol formats that use another representation, such as the RFC 1123 datetimes carried in time-based access headers, are converted to this form on storage.",
      "serial_naming_rule": "Serial artifacts, namely excerpt captures, consulted-representation captures, locator check reports and verification reports, are named as the citation record identifier plus a zero-padded ordinal that increases monotonically and is never reused, even after a member is deleted. Capture datetimes, verifier names and digests are attributes of the artifact and never form part of its name.",
