                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-003"
                    ]
                  },
                  {
                    "id": "de-ccb-context-kind",
                    "name": "citing-context-kind",
                    "description": "Classification of the citing endpoint.",
                    "value_kind": "code",
                    "cardinality": "1",
                    "required": true,
                    "source_refs": [
                      "SRC-012"
                    ]
                  },
                  {
                    "id": "de-ccb-locus",
                    "name": "citing-locus",
                    "description": "Position inside the citing context to which the citation applies.",
                    "value_kind": "object",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-001"
                    ]
                  },
                  {
                    "id": "de-ccb-role",
                    "name": "citation-role",
                    "description": "Role the citation plays in the citing context, such as primary support or background.",
                    "value_kind": "code",
                    "cardinality": "0..1",
                    "required": false,
                    "source_refs": [
                      "SRC-003"
                    ]
                  }
                ],
                "artifacts": [],
                "inline_only_rationale": "The binding is a pointer plus a locus expression. Producing an artifact here would duplicate content owned by WM-KNW-007 or WM-KNW-010 and create a second, drifting copy of the citing text."
              }
            ]
          },
          {
