  "model": {
    "registry_id": "vr.wm-knw-008",
    "model_id": "WM-KNW-008",
    "name": "Evidence / Citation",
    "entry_kind": "relationship",
    "purpose": "Model the reified evidential citation: a directed, typed, attributable link from a citing context to a cited source, plus the locator needed to retrieve and re-verify the exact cited material.",
    "scope_statement": "Defines the evidential citation as an independently identifiable relationship record. Covers citing-context binding, evidential stance (support, challenge, qualification, neutral mention), evidence type and assertion method, the source locator (preferred citation identifier, access URI, in-resource anchor, consulted representation state), integrity and provenance of the citation act, binding of an external certainty scheme, record lifecycle and supersession, and interoperability profiles. Storage- and interface-neutral: JSON, RDF, Markdown, Git, MCP and document stores are projections. It masters neither endpoint: the citing claim or decision, and the cited work, are governed elsewhere.",
    "in_scope": [
      "Reified citation record identity, deduplication and the directed citing-context to cited-source link",
      "Typed evidential stance and rhetorical intent, with polarity and direction",
      "Evidence type and assertion method, including human curation versus automated or model-derived extraction",
      "Source locator: preferred citation identifier distinguished from access URI, with scheme normalization",
      "In-resource anchoring by selector chains, plus excerpt, quotation context and transformation status",
      "Consulted representation state: access datetime, version identifier, archived snapshot and request conditions",
      "Locator resolution health, link rot and content drift detection",
      "Binding of an externally governed certainty rating scheme and its per-domain limitation results",
      "Provenance of the citation act, with event, observation and ingestion times kept separate",
      "Fixity of excerpts and captures, and references to signed media provenance manifests",
      "Citation record lifecycle states, supersession and versioning",
      "Dated observations of the cited source's status such as retraction or expression of concern",
      "Alignment declarations, exchange profiles and sensitivity classification of the record and its excerpt"
    ],
    "out_of_scope": [
      "Claim wording, decomposition, truth status and lifecycle, which belong to WM-KNW-007",
      "Decision options, criteria, deliberation and decision lifecycle, which belong to WM-KNW-010",
      "Aggregation of multiple evidence items into a verdict, belief revision, or argument-scheme structure",
      "Canonical bibliographic description and the publication lifecycle of the cited work",
      "Web archive capture scheduling, storage and preservation execution",
      "Rendering of style-specific formatted reference strings and bibliographies",
      "Runtime access evaluation, enforcement and audit-trail records",
      "Execution of retention schedules, erasure and legal-hold determination",
      "Publisher or author trust and reputation scoring as a managed registry",
      "Signing and cryptographic validation of media provenance manifests",
      "Bibliometric citation counting and impact analytics"
    ],
    "boundary_notes": [
      {
        "neighbor": "WM-KNW-007 Claim / Assertion",
        "distinction": "The claim model owns claim identity, text, decomposition, status and lifecycle. This model holds only a resolving reference to the claim and a locus within it, and never mirrors or versions claim status.",
        "source_refs": [
          "SRC-003",
          "SRC-012"
        ]
      },
      {
        "neighbor": "WM-KNW-010 Decision rationale",
        "distinction": "The decision model owns options, criteria, rationale structure and decision lifecycle. This model supplies citation records that a rationale step points at; it models no deliberation and reaches no conclusion.",
        "source_refs": [
          "SRC-008",
          "SRC-002"
        ]
      },
      {
        "neighbor": "Bibliographic source-work registry (DataCite, Crossref or equivalent)",
        "distinction": "Registries master full bibliographic metadata and identifier authority. This model holds a cached, explicitly non-authoritative minimal descriptor with a refresh timestamp, sufficient to make a citation intelligible without dereferencing.",
        "source_refs": [
          "SRC-007",
          "SRC-005"
        ]
      },
      {
        "neighbor": "Web archiving and preservation service",
        "distinction": "This model records memento and timegate URIs, archive datetimes and digests. Capture scheduling, storage tiers and preservation actions are external.",
        "source_refs": [
          "SRC-006"
        ]
      },
      {
        "neighbor": "General provenance graph (PROV-O)",
        "distinction": "Provenance patterns are used for the citation act only. A whole-of-knowledge-base activity and agent graph is a separate concern and is not constructed here.",
        "source_refs": [
          "SRC-002"
        ]
      },
      {
        "neighbor": "Argumentation and inference model",
        "distinction": "This model records one typed evidential link with stance and certainty. Multi-premise schemes, defeaters, weighting and aggregation are not modelled.",
        "source_refs": [
          "SRC-003",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Adopting-Dimension access policy and audit service",
        "distinction": "Only sensitivity labels and policy references are held here. Evaluation of a request, enforcement and the audit trail are owned entirely by that service; referencing an audit event grants no ownership of audit semantics.",
        "source_refs": [
          "SRC-008",
          "SRC-001"
        ]
      },
      {
        "neighbor": "Media provenance system (C2PA)",
        "distinction": "Signed manifests and hard or soft bindings are referenced as integrity evidence for media excerpts. Signing, certificate handling and validation are performed by that system.",
        "source_refs": [
          "SRC-011"
        ]
      },
      {
        "neighbor": "Records retention and disposition service",
        "distinction": "This model records a retention class reference, disposition state and tombstone stub. Schedule ownership, legal-hold determination and erasure execution stay with the adopting Dimension.",
        "source_refs": [
          "SRC-013",
          "SRC-008"
        ]
      }
    ]
  },
