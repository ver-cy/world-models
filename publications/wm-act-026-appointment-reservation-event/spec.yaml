    "model_id": "WM-ACT-026",
    "name": "Appointment / Reservation Event",
    "entry_kind": "aggregate",
    "purpose": "Represent a proposed, held or confirmed allocation of time, capacity, service, place or resource among participants without owning availability, actual encounter, service order or payment lifecycles.",
    "scope_statement": "Owns booking identity and lineage, request purpose and preferences, planned interval and recurrence, allocation references, booking-scoped party roles and responses, proposals and confirmation basis, booking lifecycle events, terms references, booking-specific communications and evidence, projections, access and retention. Party, resource, service, schedule, slot, place, order, payment, entitlement, message, encounter, generic evidence and audit masters remain external.",
    "in_scope": [
      "Appointment and reservation identity, request, proposed or held allocation, participants, service or resource references, time, recurrence and capacity observation",
      "Proposal, response, confirmation, waitlist, modification, reschedule, cancellation, expiry, no-show and fulfilment assertions with authority and lineage",
      "Terms and commerce references, communications, provenance, validation, role views, privacy, retention, interoperability and safe agent operations"
    ],
    "out_of_scope": [
      "Party, resource, service, location, schedule, slot, order, payment, entitlement, message, encounter, generic evidence or audit-log master lifecycle",
      "Proving actual attendance, service performance, resource availability, payment settlement, legal entitlement or party identity merely from booking status",
      "Implementing scheduler, optimization, routing, conferencing, payment, messaging or sector-specific protocol engines and claiming lossless cross-format equivalence"
    ],
    "boundary_notes": [
      {
        "neighbor": "Schedule / Slot / Availability",
        "distinction": "The booking references source-qualified availability and allocated slots; schedules and slots keep their own identity, capacity and availability lifecycle.",
        "source_refs": [
          "SRC-001",
          "SRC-002",
          "SRC-003",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Encounter / Event occurrence",
        "distinction": "The booking describes planned allocation; an actual encounter or real-world event keeps separate observations and outcome evidence.",
        "source_refs": [
          "SRC-001",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Order / Payment / Entitlement",
        "distinction": "The booking can reference commercial or authorization records, but confirmation does not itself settle payment or grant entitlement.",
        "source_refs": [
          "SRC-009",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Party / Resource / Service / Place",
        "distinction": "Booking-scoped roles and allocation references are owned here; external subject masters and their lifecycles are not copied.",
        "source_refs": [
          "SRC-001",
          "SRC-009",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Calendar message / Notification",
        "distinction": "The booking owns the intended state and records communication references; delivery of an invitation or confirmation is not acceptance.",
        "source_refs": [
