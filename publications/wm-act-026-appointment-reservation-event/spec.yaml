      "rationale": "Two axes must not be conflated. On the record plane a registry value such as standalone-mm describes how the model record is stored, versioned and governed in the registry; it is never a subject-model entry kind, and here frozen_context was empty so no frozen registry value could be read at all - that absence is carried as a publication hold rather than silently resolved. On the subject axis the most defensible schema kind is aggregate: the booking has one root identity (authoritative source plus booking identifier plus current lineage head), a transactional confirmation invariant that binds current capacity to required participant responses, and it composes proposals, responses, booking-scoped party roles, status events and booking-specific evidence that have no independent life outside the root, while party, resource, service, place, schedule, slot, order, payment, message, encounter and audit masters remain external references. event is rejected despite the display name because the record is a mutable, revisioned, long-lived commitment whose typed transitions are constituents rather than the root; entity understates the owned composition and append-only lineage; relationship understates independent identity, terms, communications and lifecycle; pattern, mixin, registry and classifier do not describe an instance-bearing subject at all."
    },
