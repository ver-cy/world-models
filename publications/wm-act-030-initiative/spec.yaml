  "model": {
    "registry_id": "vr.wm-act-030",
    "model_id": "WM-ACT-030",
    "name": "Initiative",
    "entry_kind": "aggregate",
    "purpose": "Represent a governed course of coordinated change or exploration that can exist before, outside or across formal projects, programs, campaigns and operations while preserving the identity of every linked master.",
    "scope_statement": "Owns initiative identity and lineage, source-qualified classification, originating problem or opportunity evidence, case for change, mandate, sponsorship, exploratory scope and guardrails, strategy alignment, options and hypotheses, initiative-scoped stakeholder and result intent, linked-work membership and dependencies, roadmap, gates and experiments, bounded assignments and envelopes, lifecycle, formalization and responsibility-transfer history, initiative metric definitions and evaluation assertions, projections, access and retention. Party, strategy, objective, policy, project, program, portfolio, campaign, operation, activity, experiment, capability, product, service, resource, budget, contract, risk, issue, decision, metric, observation, dataset and generic audit masters remain external.",
    "in_scope": [
      "Initiative identity, profile, originating evidence, mandate, sponsor, scope, strategy alignment, options, assumptions, stakeholders and intended results",
      "Linked work, dependencies, roadmaps, stages, gates, experiments, roles, resource and funding references, risks, requirements, controls and exceptions",
      "Proposal, screening, approval, incubation, activation, pause, cancellation, completion, formalization, derivation, observations, evaluation, interoperability, access, retention and agent operations"
    ],
    "out_of_scope": [
      "Party, strategy, objective, policy, project, program, portfolio, campaign, operation, activity, experiment, capability, product, service, resource, budget, contract, risk, issue, decision, metric, observation, dataset or audit-log master lifecycle",
      "Treating Initiative as a synonym for Strategy, Objective, Course of Action, Project, Program, Campaign or Operation, or reusing initiative identity after formalization",
      "Implementing portfolio optimization, project scheduling, accounting, procurement, workforce management, experimentation platforms, analytics engines or universal legal compliance and claiming full ISO or ArchiMate conformance from public sources"
    ],
    "boundary_notes": [
      {
        "neighbor": "Strategy / Policy / Objective / Course of Action",
        "distinction": "The initiative records source-qualified alignment, contribution and selected option assertions; external motivation and course-of-action masters keep their own identity and authority.",
        "source_refs": [
          "SRC-003",
          "SRC-007",
          "SRC-008",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Project / Program / Campaign / Operation",
        "distinction": "An initiative may precede, span or derive formal delivery objects. Formalization creates a new master identity, mapping and responsibility handover rather than renaming the initiative.",
        "source_refs": [
          "SRC-008",
          "SRC-009",
          "SRC-011"
        ]
      },
      {
        "neighbor": "Activity / Work Package / Experiment / Deliverable",
        "distinction": "The initiative owns membership, coordination and learning assertions while external work objects keep their executable scope, owner, lifecycle and evidence.",
        "source_refs": [
          "SRC-003",
          "SRC-005",
          "SRC-009",
          "SRC-010"
        ]
      },
      {
        "neighbor": "Outcome / Benefit / Impact / Observation",
        "distinction": "The initiative owns intended results logic and initiative-specific evaluation; observed results and external benefit or observation masters keep source identity and method, and activity does not establish causation.",
        "source_refs": [
          "SRC-003",
          "SRC-005",
          "SRC-007",
          "SRC-012"
        ]
      },
      {
        "neighbor": "Resource / Budget / Risk / Decision / Policy",
        "distinction": "The initiative owns scoped assignments, envelopes and control views; authoritative transactions, capacities, risks, decisions and policies remain external.",
        "source_refs": [
          "SRC-005",
          "SRC-007",
          "SRC-008",
          "SRC-011",
          "SRC-013"
        ]
      }
    ]
  },
