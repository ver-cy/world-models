    "boundaryDecision": {
      "entry_kind": "aggregate",
      "status": "accepted",
      "rationale": "Two axes must not be conflated. On the record plane the registry classifies how Vercy files the record (the standalone-mm family of values); that is a filing classification and never a valid subject-model entry kind. In this pack frozen_context arrived empty, so the record-plane value could not be re-read and is carried as a publication hold. On the subject-model axis the defensible schema enum is aggregate: one Initiative root owns a bounded cluster of initiative-scoped assertion classes (mandate, case for change, options, memberships, dependencies, roadmap and gates, assignments and envelopes, lifecycle and formalization events, metric definitions, evaluations, access and retention state) under a single consistency and authority boundary, while every party, strategy, objective, policy, project, program, portfolio, campaign, activity, experiment, capability, product, service, resource, budget, contract, risk, issue, decision, metric, observation, dataset and audit master stays external and is referenced by identity. entity would understate the owned child-assertion classes and the append-only released-history invariant; relationship would misread the membership assertions as the subject rather than as owned children; pattern or mixin would deny the model its own identity and lifecycle; registry would misread a governed subject as an index of others. Aggregate is accepted as stated by the active provider."
    },
    "decisions": [
      {
        "concept": "Aggregate root is Initiative, not a work-collection index",
        "disposition": "accepted",
        "rationale": "The consistency boundary is the initiative itself: it owns identity, lineage and initiative-scoped assertions, and every neighbour is referenced rather than contained. That is what makes a single root defensible instead of a thin index over external work."
      },
      {
        "concept": "Formalization mints a new master identity with typed derivation and handover",
        "disposition": "accepted as the load-bearing invariant",
        "rationale": "This is the one rule preventing Initiative from collapsing into Project, Program, Campaign or Operation. It is asserted consistently in scope_statement, boundary_notes, patch_rules, policies, adversarial_checks, the formalize-derive finding and the formalize-or-transfer function. Cross-read for contradiction and none found."
      },
      {
        "concept": "Ownership boundary excludes all neighbour master lifecycles",
        "disposition": "accepted",
        "rationale": "Twenty-four findings touch strategy, work, resources, budgets, risks, requirements and metrics, which invites drift into a universal work model. Each finding is written as a reference plus an initiative-scoped assertion, and the policies block states ownership does not transfer, so the breadth is contained."
      },
      {
        "concept": "Composition by membership assertion without lifecycle cascade",
        "disposition": "accepted with a required explicit non-cascade rule",
        "rationale": "The linked-work finding says the initiative owns membership of externally owned work. The delete rule covers the initiative's own working copies but never states that cancelling, closing or disposing of an initiative must not cascade to member work objects. Add that sentence before canonical promotion."
      },
