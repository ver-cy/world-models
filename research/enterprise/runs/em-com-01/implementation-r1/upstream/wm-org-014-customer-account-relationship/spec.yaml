    "name": "Customer / Account Relationship",
    "entry_kind": "relationship",
    "purpose": "Describe a customer relationship mastered by CRM, including seller scope, role, lifecycle, commercial references and accountable context.",
    "scope_statement": "A source-qualified commercial relationship, not global party identity. CRM account, individual contact, billing customer, login, prospect and entitlement remain distinct record kinds.",
    "in_scope": [
      "Seller-scoped customer identity, participant roles and recognition evidence",
      "Source lifecycle, grouping, account responsibility and contact preference provenance",
      "Commercial-master references, interactions, duplicate lineage and governed exchange"
    ],
    "out_of_scope": [
      "Party identity, login credentials and payment instruments",
      "Executing outreach, charging, credit decisions, service entitlement changes or CRM merge transactions",
      "Universal customer state machine, legal corporate hierarchy or consent inference"
    ],
    "boundary_notes": [
      {
        "neighbor": "Party master",
        "distinction": "One party can participate in multiple customer relationships and seller/service scopes.",
