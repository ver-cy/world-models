{
  "format": "whole-object-coverage",
  "types": {
    "SyncRegister": {
      "identity-class": {
        "status": "required",
        "reason": "Immutable register/Dimension/bootstrap identity."
      },
      "direct-properties": {
        "status": "required",
        "reason": "Sources, scopes, complete journal and derived state; protected namespace."
      },
      "recognition-observation": {
        "status": "required",
        "reason": "Historical replay establishes internal consistency, not current authenticity."
      },
      "capabilities-behaviour-actions": {
        "status": "required",
        "reason": "Admin operations and explicitly granted intake/map/read; archive cannot resume."
      },
      "context-evidence": {
        "status": "required",
        "reason": "One owned local SQLite master; native snapshots are restricted evidence."
      }
    },
    "SourceInstance": {
      "identity-class": {
        "status": "required",
        "reason": "Immutable product/tenant/environment/generation declaration and local ID."
      },
      "direct-properties": {
        "status": "required",
        "reason": "Product reference and continuity evidence; no connector credential fields."
      },
      "recognition-observation": {
        "status": "required",
        "reason": "Host verifies source continuity; matching labels alone are insufficient."
      },
      "capabilities-behaviour-actions": {
        "status": "required",
        "reason": "New generation needs a new declaration; close old epochs explicitly when appropriate."
      },
      "context-evidence": {
        "status": "required",
        "reason": "External source operator owns source truth; host owns its declaration."
      }
    },
    "AcquisitionScope": {
      "identity-class": {
        "status": "required",
        "reason": "Immutable local ID and exact fingerprint excluding that ID."
      },
      "direct-properties": {
        "status": "required",
        "reason": "Resource/key scheme/version, source kind, query/filter/visibility/interpretation/schema refs."
      },
      "recognition-observation": {
        "status": "required",
        "reason": "Literal evidence-reference identity; no semantic normalization."
      },
      "capabilities-behaviour-actions": {
        "status": "required",
        "reason": "New scope for changed interpretation; unpartitioned stream only."
      },
      "context-evidence": {
        "status": "required",
        "reason": "One SourceInstance; evidence namespace controlled by host."
      }
    },
    "RecordSubjectMapping": {
      "identity-class": {
        "status": "required",
        "reason": "Stable claim ID and immutable lineage/target/purpose/issuer anchors."
      },
      "direct-properties": {
        "status": "required",
        "reason": "Known qualified key, target kind, validity, evidence and correction predecessor."
      },
      "recognition-observation": {
        "status": "required",
        "reason": "Aboutness claim with target-catalogue and pair checks, never same-as."
      },
      "capabilities-behaviour-actions": {
        "status": "required",
        "reason": "Append revisions; every activation checks uniqueness; retracted terminal."
      },
      "context-evidence": {
        "status": "required",
        "reason": "Authenticated steward with exact map right; catalogue and policy pinned."
      }
    },
    "SyncEpoch": {
      "identity-class": {
        "status": "required",
        "reason": "Immutable epoch ID within a scope; independent of record generation."
      },
      "direct-properties": {
        "status": "required",
        "reason": "Open/closed state, fence, head, local progress and reset evidence."
      },
      "recognition-observation": {
        "status": "required",
        "reason": "Progress follows committed sequence; opaque tokens are not ordered."
      },
      "capabilities-behaviour-actions": {
        "status": "required",
        "reason": "One open epoch per scope; close after all rounds sealed; reopen with new ID."
      },
      "context-evidence": {
        "status": "required",
        "reason": "Admin owns lifecycle; intake transaction alone advances head."
      }
    },
    "SnapshotRound": {
      "identity-class": {
        "status": "required",
        "reason": "Immutable round ID and scope/epoch/purpose anchors."
      },
      "direct-properties": {
        "status": "required",
        "reason": "Consistency, visibility, ordering evidence, pages, errors and completeness."
      },
      "recognition-observation": {
        "status": "required",
        "reason": "Strong local key accounting is not proof of actual source completeness."
      },
      "capabilities-behaviour-actions": {
        "status": "required",
        "reason": "Append contiguous pages, then seal once; compare only explicit compatible rounds."
      },
      "context-evidence": {
        "status": "required",
        "reason": "Source guarantees are host-verified; only proposals arise from absence."
      }
    },
    "BatchReceipt": {
      "identity-class": {
        "status": "required",
        "reason": "Scope/epoch-wide key and host sequence-derived receipt ID."
      },
      "direct-properties": {
        "status": "required",
        "reason": "Exact content, immutable mapping outcomes, counts, previous head and policy revision."
      },
      "recognition-observation": {
        "status": "required",
        "reason": "Destination acknowledgement of local metadata only."
      },
      "capabilities-behaviour-actions": {
        "status": "required",
        "reason": "One first commit; exact own replay returns old ack; no reapplication."
      },
      "context-evidence": {
        "status": "required",
        "reason": "Serialized local journal; current read rights govern receipt disclosure."
      }
    },
    "RecordOccurrence": {
      "identity-class": {
        "status": "required",
        "reason": "Receipt identity plus original input ordinal, including duplicates."
      },
      "direct-properties": {
        "status": "required",
        "reason": "Qualified key, protected content ref, availability operation, times, correction and pin."
      },
      "recognition-observation": {
        "status": "required",
        "reason": "Distinguish source-declared acquisition from host receipt and nullable source time."
      },
      "capabilities-behaviour-actions": {
        "status": "required",
        "reason": "Immutable; later corrections append evidence without repinning."
      },
      "context-evidence": {
        "status": "required",
        "reason": "Part of one receipt; domain truth and subject lifecycle remain external."
      }
    },
    "QuarantineEntry": {
      "identity-class": {
        "status": "required",
        "reason": "Receipt identity plus original rejected ordinal."
      },
      "direct-properties": {
        "status": "required",
        "reason": "Protected descriptor, reason, retry obligation and open state."
      },
      "recognition-observation": {
        "status": "required",
        "reason": "Adapter classifies raw failures; this register validates descriptors, not raw bytes."
      },
      "capabilities-behaviour-actions": {
        "status": "required",
        "reason": "Retained open in 0.1.0; reingestion is a new batch; resolution API deferred."
      },
      "context-evidence": {
        "status": "required",
        "reason": "Host evidence custody and external operational resolution."
      }
    },
    "ConflictDiagnostic": {
      "identity-class": {
        "status": "required",
        "reason": "Host sequence-derived immutable ID, actor and attempt."
      },
      "direct-properties": {
        "status": "required",
        "reason": "Scope/epoch, reason, supplied and retained digests where available."
      },
      "recognition-observation": {
        "status": "required",
        "reason": "Restricted operational evidence; not a public existence oracle."
      },
      "capabilities-behaviour-actions": {
        "status": "required",
        "reason": "Append on admitted collisions/stale preconditions; no canonical denial telemetry."
      },
      "context-evidence": {
        "status": "required",
        "reason": "Privileged archive; a current writer still observes key unavailability."
      }
    }
  },
  "notNewMetamodels": [
    "RecordKey and EvidenceRef values",
    "Host Catalogue and Policy snapshots",
    "SQLite tables and archive wrapper"
  ],
  "physicalFacets": "These are abstract integration records; mass/geometry do not apply. Per-type recognition, behavior and evidence remain required."
}
