schema: vercy-model-taxonomy
version: 0.1.0-candidate
updated: 2026-08-22
purpose: >-
  Stable discovery taxonomy for the Vercy unified registry. Navigation is not
  inheritance; a model may also carry multiple orthogonal facets and relations.

planes:
  world-model:
    description: Things, actors, information, activities and situations that can have governed context.
  interoperability:
    description: External semantic models, standards, classifications, formats and interfaces aligned to world models.

navigation:
  PHY:
    name: Physical world
    children:
      MAT: {name: Matter, substances, samples and observations}
      OBJ: {name: Physical objects, products, assets and equipment}
      LIV: {name: Living systems, taxonomy, ecology and molecular biology}
      PLC: {name: Places, territory, parcels and spatial referencing}
      BLT: {name: Built environment, facilities and infrastructure}
      EAR: {name: Earth systems, weather, climate and environment}
      SPC: {name: Space, celestial bodies and observations}
      FLW: {name: Resource, material, logistics and mobility flows}
  SOC:
    name: Social and institutional world
    children:
      PER: {name: People, identity, household, relationships and personal context}
      ORG: {name: Organizations, structure, workforce and governance}
      POL: {name: State, jurisdiction, law, justice and public administration}
      ECO: {name: Economy, commerce, finance, tax, insurance and reporting}
      CIV: {name: Civil society, culture, religion, sport and public discourse}
  INF:
    name: Information and virtual world
    children:
      REC: {name: Documents, records, messages, forms and evidence}
      DAT: {name: Data, schemas, catalogues, pipelines, quality and statistics}
      KNW: {name: Knowledge, concepts, claims, decisions, rules and models}
      MED: {name: Creative works, publications and media assets}
      SFT: {name: Software, APIs, components, releases and runtime operations}
      AI: {name: AI systems, agents, runs, training, evaluation and governance}
      VRT: {name: Digital twins, virtual worlds, simulations and distributed ledgers}
      COM: {name: Communication services and channels}
  ACT:
    name: Activities, processes and situations
    children:
      CAP: {name: Functions and capabilities}
      ACT: {name: Acts and actions}
      PRC: {name: Processes and workflows}
      SRV: {name: Services}
      PRJ: {name: Projects, programs and initiatives}
      TSK: {name: Tasks, work orders and assignments}
      PLN: {name: Plans, schedules, goals and milestones}
      MTH: {name: Methods, procedures and rules of work}
      PRD: {name: Production and manufacturing}
      AGR: {name: Agriculture and husbandry operations}
      EXT: {name: Resource extraction}
      MNT: {name: Maintenance and repair}
      HCR: {name: Healthcare delivery and clinical activity}
      EVT: {name: Occurrences, events and observations}
      ENC: {name: Encounters, meetings and interactions}
      INC: {name: Incidents, emergencies, response and recovery}
      CYB: {name: Cyber incidents}
      CSE: {name: Cases and tickets}
      EXP: {name: Experiments and trials}
      RES: {name: Research and studies}
      EDU: {name: Learning and education delivery}
      HR: {name: Recruitment and workforce lifecycle}
      REG: {name: Compliance and regulatory processes}
  XCT:
    name: Cross-cutting reusable context
    children:
      ID: {name: Identity, aliases and identifiers}
      GOV: {name: Ownership, access, consent, policy and audit}
      TIME: {name: Time, version and lifecycle}
      LOC: {name: Location, geometry and coordinate systems}
      VAL: {name: Quantity, unit, currency and measurement}
      PROV: {name: Provenance, evidence, quality and confidence}
      SEC: {name: Integrity, proof, privacy and security}
      REL: {name: Roles, dependency and classification binding}
      REG: {name: Registry, ledger and federation patterns}

facets:
  ontological_kind:
    values: [entity, agent, role, information-object, event, process, state, relationship, contract, rule, measure, collection, view]
  identity_mode:
    values: [natural, assigned, registry, content-addressed, composite, ephemeral]
  lifecycle_scope:
    values: [instant, interval, versioned, state-machine, append-only, timeless-reference]
  governance_layer:
    values: [personal, household, team, organization, market, jurisdiction, international, ecosystem]
  granularity:
    values: [type, instance, collection, event, finding, artifact, aggregate]
  composition_role:
    values: [standalone, mixin, pattern, view, extension, subtype-profile, category-split-required, bundle, external-alignment]
  mastership:
    values: [single-master, federated-master, source-asserted, derived, cached, unknown]
  sensitivity:
    values: [public, internal, confidential, personal, highly-sensitive, classified, owner-defined]
  industry:
    binding: ISIC-Rev.5
  product_or_service:
    binding: CPC-3.0
  government_function:
    binding: COFOG
  standard_field:
    binding: ISO-ICS

relations:
  - {code: CONTAINS, meaning: instance-level matryoshka containment}
  - {code: COMPOSE, meaning: peers form a useful aggregate}
  - {code: REFERENCE, meaning: link to independently mastered context}
  - {code: CLASSIFIES, meaning: type or vocabulary classifies an instance}
  - {code: PRODUCES, meaning: an activity produces an independently governed result}
  - {code: MIX-IN, meaning: reusable context applied without becoming the subject}
  - {code: EXTEND, meaning: compatible specialization adds structure or rules}
  - {code: ALIGN, meaning: semantic mapping to an external entry}
  - {code: VIEW, meaning: projection without a second source of truth}
