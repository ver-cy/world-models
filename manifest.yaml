# ARCH-017 repository manifest (Model-Traversal-and-Layout)
model:
  id: vercy.world-models
  name: Vercy world-model catalogue
  version: 0.2.0
  status: working-draft
  license: Apache-2.0
  steward: Vercy project

bundles:
  - id: architecture
    meaning: "the catalogue map and register: what models exist, clusters, conventions"
    order:
      - README.md
      - Library-Architecture.md
      - world-models.csv
  - id: model-cards
    meaning: one MMAS-conformant card per model, each with its own bundles and layers
    order:
      - models/planet-nature/
      - models/matter-artifacts/
      - models/built-environment/
      - models/activity-work/
      - models/knowledge-information/
      - models/organizations/
      - models/registries-ledgers/
      - models/flows-resources/
      - models/events-phenomena/
      - models/security-ownership-access/
      - models/polity/
      - models/society/
      - models/economy/
      - models/civilization/
      - models/people-groups/
  - id: research
    meaning: independent provider evidence, comparison, adjudication and validation
    order:
      - research/README.md
      - research/queue.csv
      - research/status.csv
      - research/runs/
  - id: publications
    meaning: generated website packages for validated synthesis results
    order:
      - publications/

# Centralized classification (first match wins).
kind_rules:
  - pattern: "BOOTSTRAP.md"
    kind: bootstrap
    origin: authored
  - pattern: "manifest.yaml"
    kind: manifest
    origin: authored
  - pattern: "sources.yaml"
    kind: manifest
    origin: authored
  - pattern: "README.md"
    kind: doc
    origin: authored
  - pattern: "Library-Architecture.md"
    kind: doc
    origin: authored
  - pattern: "world-models.csv"
    kind: doc
    origin: authored
  - pattern: "models/**/*.md"
    kind: doc
    origin: authored
  - pattern: "research/**/*.json"
    kind: evidence
    origin: generated
  - pattern: "research/**/*.csv"
    kind: register
    origin: generated
  - pattern: "publications/**/AGENTS.md"
    kind: bootstrap
    origin: generated
  - pattern: "publications/**/spec.yaml"
    kind: specification
    origin: generated
  - pattern: "publications/**/publication.json"
    kind: manifest
    origin: generated
  - pattern: "publications/**/index.html"
    kind: projection
    origin: generated
  - pattern: "tools/*.py"
    kind: code
    origin: authored

exclude:
  - LICENSE
  - .git/**
